<svg xmlns="http://www.w3.org/2000/svg" width="860" height="528" viewBox="0 0 860 528" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="36" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="528" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Transformer 核心推理链</text>
  <path d="M 280 42 Q 430 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="40" y="68" width="780" height="72" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  </g>
  <text x="56" y="92" font-size="13" font-weight="bold" fill="#b03a3a">Problem</text>
  <text x="56" y="116" font-size="11" fill="#444">RNN 的顺序计算阻止并行化；长程依赖路径长、难学</text>
  <path d="M 430 140 L 430 160" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="40" y="160" width="780" height="72" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="56" y="184" font-size="13" font-weight="bold" fill="#c98a2b">Observation</text>
  <text x="56" y="208" font-size="11" fill="#444">注意力机制本就能在任意两位置间一步建立连接（对齐），只是一直被当作 RNN 的辅助件</text>
  <path d="M 430 232 L 430 252" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="40" y="252" width="780" height="72" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/>
  </g>
  <text x="56" y="276" font-size="13" font-weight="bold" fill="#9e9e9e">Insight</text>
  <text x="56" y="300" font-size="11" fill="#444">如果让 token 之间两两直接互相看（self-attention），序列内部的路由可以全部并行完成，根本不需要时间步</text>
  <path d="M 430 324 L 430 344" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="40" y="344" width="780" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="56" y="368" font-size="13" font-weight="bold" fill="#4a8edb">Method</text>
  <text x="56" y="392" font-size="11" fill="#444">纯注意力 Encoder-Decoder：Multi-Head Self-Attention + 位置敏感的 FFN + sin/cos 位置编码补齐顺序信息</text>
  <path d="M 430 416 L 430 436" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="40" y="436" width="780" height="72" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="56" y="460" font-size="13" font-weight="bold" fill="#4a8e4a">Benefit</text>
  <text x="56" y="484" font-size="11" fill="#444">每层顺序操作 O(n)→O(1)，最大路径长度 O(n)→O(1)；训练时间数量级下降，长程依赖可学，质量反而 SOTA</text>
</svg>