<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="960" height="650" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">同一个 XOR 的四层封装：从手写到位到硬件</text>
  <path d="M 270 41 Q 480 49 690 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <line x1="78" y1="565" x2="78" y2="105" stroke="#bbb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="60" y="335" font-size="10" fill="#888" text-anchor="middle" transform="rotate(-90 60 335)">抽象程度递增，用户要写的 XOR 递减</text>

  <g filter="url(#sk)"><rect x="110" y="95" width="820" height="105" rx="8" fill="#fef7f7" stroke="#b85450" stroke-width="1"/></g>
  <text x="130" y="121" font-size="12" font-weight="bold" fill="#b85450">① 手写 CUDA kernel：XOR 全靠自己</text>
  <text x="130" y="145" font-size="9.5" font-family="monospace" fill="#333">sA[i][j ^ (i &amp; 7)] = data;                        // 写：逻辑块 (i,j) → 槽位 j^(i&amp;7)</text>
  <text x="130" y="163" font-size="9.5" font-family="monospace" fill="#333">__cvta_generic_to_shared(&amp;sA[t][c ^ (t &amp; 7)]);   // 读：ldmatrix 地址同样过 XOR</text>
  <text x="130" y="185" font-size="9" fill="#666">XOR 由谁做：用户——读写两侧各显式一次，漏任何一边就读到错位数据（最常见 bug）</text>

  <g filter="url(#sk)"><rect x="110" y="220" width="820" height="105" rx="8" fill="#f5f9fd" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="130" y="246" font-size="12" font-weight="bold" fill="#2b6e9e">② CuTe / CUTLASS 3.x：布局对象接管</text>
  <text x="130" y="270" font-size="9.5" font-family="monospace" fill="#333">GMMA::Layout_K_SW128_Atom&lt;half_t&gt; = ComposedLayout&lt;Swizzle&lt;3,4,3&gt;, smem_ptr_flag, Layout&lt;Shape&lt;_8,_64&gt;,...&gt;</text>
  <text x="130" y="288" font-size="9.5" font-family="monospace" fill="#333">tile_to_shape(SmemLayoutAtom{}, Shape&lt;_128,_64&gt;{});      // 8×64 原子铺成 128×64</text>
  <text x="130" y="310" font-size="9" fill="#666">XOR 由谁做：布局对象——copy / ldmatrix / WGMMA 取地址时自动套用，用户无感</text>

  <g filter="url(#sk)"><rect x="110" y="345" width="820" height="105" rx="8" fill="#fef9ee" stroke="#c98a2b" stroke-width="1"/></g>
  <text x="130" y="371" font-size="12" font-weight="bold" fill="#7a5415">③ CUTLASS 2.x（Ampere）：布局模板参数</text>
  <text x="130" y="395" font-size="9.5" font-family="monospace" fill="#333">using SmemLayoutA = RowMajorTensorOpMultiplicandCrosswise&lt;16, /*crosswise=*/64&gt;;</text>
  <text x="130" y="413" font-size="9.5" font-family="monospace" fill="#333">// operator() 内部：permuted_vec_contiguous = residual ^ (strided_residual % 4) 等两条异或式</text>
  <text x="130" y="435" font-size="9" fill="#666">XOR 由谁做：layout 的 operator()——异或式随模板实例化，Mma 指令层无感</text>

  <g filter="url(#sk)"><rect x="110" y="470" width="820" height="105" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1"/></g>
  <text x="130" y="496" font-size="12" font-weight="bold" fill="#2e6e2e">④ Hopper TMA：硬件描述符</text>
  <text x="130" y="520" font-size="9.5" font-family="monospace" fill="#333">cuTensorMapEncodeTiled(&amp;tma_desc, ..., CU_TENSOR_MAP_SWIZZLE_128B, ...);</text>
  <text x="130" y="538" font-size="9.5" font-family="monospace" fill="#333">// TMA 硬件按描述符 swizzle 落位，WGMMA 按同一布局反解</text>
  <text x="130" y="560" font-size="9" fill="#666">XOR 由谁做：TMA 硬件——descriptor 声明一次，kernel 代码里一个 XOR 都不用写</text>

  <g filter="url(#sk)">
    <rect x="30" y="592" width="900" height="46" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="50" y="612" font-size="9.5" font-weight="bold" fill="#7a5415">四层完全等价：j ⊕ (i mod 8) ≡ Swizzle&lt;3,4,3&gt; ≡ RowMajorTensorOpMultiplicandCrosswise&lt;16,64&gt; ≡ CU_TENSOR_MAP_SWIZZLE_128B</text>
  <text x="50" y="630" font-size="9.5" fill="#444">变的只是「XOR 写在哪一层」，不是 XOR 本身；抽象层次越高，读写两侧对不上的出错机会越少。</text>
</svg>
