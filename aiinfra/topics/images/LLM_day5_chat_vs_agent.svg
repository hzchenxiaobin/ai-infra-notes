<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="240" fill="#fdfcf7"/>
  <text x="390" y="28" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">聊天模型 vs 智能体</text>
  <text x="195" y="55" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">聊天模型</text>
  <g filter="url(#sk)"><rect x="40" y="65" width="310" height="120" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="50" y="85" text-anchor="start" font-size="9" fill="#666">User: "帮我写一个排序函数"</text>
  <text x="50" y="105" text-anchor="start" font-size="9" fill="#333">Model: "def sort(arr): ..."</text>
  <text x="50" y="125" text-anchor="start" font-size="9" fill="#b85450">← 只输出代码文本</text>
  <text x="50" y="150" text-anchor="start" font-size="9" fill="#666">单轮对话 · 纯文本输出 · 无环境交互</text>
  <text x="585" y="55" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">智能体</text>
  <g filter="url(#sk)"><rect x="430" y="65" width="310" height="120" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="440" y="82" text-anchor="start" font-size="9" fill="#333">[思考] 用户要排序函数</text>
  <text x="440" y="97" text-anchor="start" font-size="9" fill="#4a8e4a">[action] create_file(...)</text>
  <text x="440" y="112" text-anchor="start" font-size="9" fill="#666">[环境反馈] 文件已创建</text>
  <text x="440" y="127" text-anchor="start" font-size="9" fill="#4a8e4a">[action] run(python sort.py)</text>
  <text x="440" y="142" text-anchor="start" font-size="9" fill="#666">[环境反馈] 测试通过 ✓</text>
  <text x="440" y="162" text-anchor="start" font-size="9" fill="#2e6e2e">多步循环 · 结构化动作 · 环境交互</text>
</svg>
