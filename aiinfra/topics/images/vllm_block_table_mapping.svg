<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="430" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">逻辑块 → block table → 物理块（block size = 4 示例）</text>

  <!-- 左：逻辑块 -->
  <text x="120" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">逻辑块（序列视角，连续）</text>
  <g filter="url(#sk)"><rect x="30" y="76" width="180" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="120" y="97" text-anchor="middle" font-size="11" fill="#2b6e9e">逻辑块 0</text>
  <text x="120" y="114" text-anchor="middle" font-size="10" fill="#444">The quick brown fox</text>

  <g filter="url(#sk)"><rect x="30" y="136" width="180" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="120" y="157" text-anchor="middle" font-size="11" fill="#2b6e9e">逻辑块 1</text>
  <text x="120" y="174" text-anchor="middle" font-size="10" fill="#444">jumps over the lazy</text>

  <g filter="url(#sk)"><rect x="30" y="196" width="180" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="120" y="217" text-anchor="middle" font-size="11" fill="#2b6e9e">逻辑块 2</text>
  <text x="120" y="234" text-anchor="middle" font-size="10" fill="#444">dog and runs fast</text>

  <g filter="url(#sk)"><rect x="30" y="256" width="180" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="120" y="277" text-anchor="middle" font-size="11" fill="#7a5415">逻辑块 3（未满）</text>
  <text x="120" y="294" text-anchor="middle" font-size="10" fill="#444">today ░ ░</text>

  <text x="120" y="330" text-anchor="middle" font-size="10" fill="#888">只有最后一个块可能有内部碎片</text>

  <!-- 中：block table -->
  <text x="370" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">block table</text>
  <g filter="url(#sk)"><rect x="310" y="76" width="120" height="230" rx="6" fill="#ffffff" stroke="#7a5415" stroke-width="1.8"/></g>
  <g font-size="11" fill="#444">
    <text x="370" y="104" text-anchor="middle">0 → 物理块 7</text>
    <text x="370" y="164" text-anchor="middle">1 → 物理块 2</text>
    <text x="370" y="224" text-anchor="middle">2 → 物理块 5</text>
    <text x="370" y="284" text-anchor="middle">3 → 物理块 9</text>
  </g>
  <line x1="318" y1="116" x2="422" y2="116" stroke="#ccc" stroke-width="1"/>
  <line x1="318" y1="176" x2="422" y2="176" stroke="#ccc" stroke-width="1"/>
  <line x1="318" y1="236" x2="422" y2="236" stroke="#ccc" stroke-width="1"/>
  <text x="370" y="330" text-anchor="middle" font-size="10" fill="#888">每个序列一张表</text>

  <!-- 右：物理块池 -->
  <text x="600" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#356130">物理块池（显存，离散分配）</text>
  <g font-size="10.5">
    <g filter="url(#sk)"><rect x="500" y="76" width="90" height="34" rx="4" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.2"/></g><text x="545" y="97" text-anchor="middle" fill="#999">块 0 空闲</text>
    <g filter="url(#sk)"><rect x="600" y="76" width="90" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g><text x="645" y="97" text-anchor="middle" fill="#8d3f3b">块 1 他人</text>
    <g filter="url(#sk)"><rect x="500" y="120" width="90" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g><text x="545" y="141" text-anchor="middle" fill="#2b6e9e">块 2 ★</text>
    <g filter="url(#sk)"><rect x="600" y="120" width="90" height="34" rx="4" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.2"/></g><text x="645" y="141" text-anchor="middle" fill="#999">块 3 空闲</text>
    <g filter="url(#sk)"><rect x="500" y="164" width="90" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g><text x="545" y="185" text-anchor="middle" fill="#8d3f3b">块 4 他人</text>
    <g filter="url(#sk)"><rect x="600" y="164" width="90" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g><text x="645" y="185" text-anchor="middle" fill="#2b6e9e">块 5 ★</text>
    <g filter="url(#sk)"><rect x="500" y="208" width="90" height="34" rx="4" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.2"/></g><text x="545" y="229" text-anchor="middle" fill="#999">块 6 空闲</text>
    <g filter="url(#sk)"><rect x="600" y="208" width="90" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g><text x="645" y="229" text-anchor="middle" fill="#2b6e9e">块 7 ★</text>
    <g filter="url(#sk)"><rect x="500" y="252" width="90" height="34" rx="4" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.2"/></g><text x="545" y="273" text-anchor="middle" fill="#999">块 8 空闲</text>
    <g filter="url(#sk)"><rect x="600" y="252" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g><text x="645" y="273" text-anchor="middle" fill="#7a5415">块 9 ★未满</text>
  </g>
  <text x="600" y="330" text-anchor="middle" font-size="10" fill="#888">空闲块可被任意序列按需领取</text>

  <!-- 映射箭头 -->
  <path d="M 210 101 L 300 96" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 161 L 300 156" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 221 L 300 216" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 281 L 300 276" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 430 96 L 612 205" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 430 156 L 505 131" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 430 216 L 610 176" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 430 276 L 608 264" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 底部结论 -->
  <g filter="url(#sk)"><rect x="60" y="360" width="660" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="390" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#356130">逻辑上连续、物理上离散：显存按需分配、用完即还</text>
  <text x="390" y="400" text-anchor="middle" font-size="11" fill="#356130">类比 OS 虚拟内存：逻辑块 ≈ 页，block table ≈ 页表，物理块 ≈ 页帧</text>
</svg>
