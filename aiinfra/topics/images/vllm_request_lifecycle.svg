<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#fdfcf7"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">一次请求的生命周期（时序图）</text>

  <!-- 生命线头部 -->
  <g font-size="11" font-weight="bold">
    <g filter="url(#sk)"><rect x="20" y="45" width="90" height="30" rx="6" fill="#eeeeee" stroke="#888" stroke-width="1.5"/></g><text x="65" y="64" text-anchor="middle" fill="#444">用户</text>
    <g filter="url(#sk)"><rect x="125" y="45" width="100" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g><text x="175" y="64" text-anchor="middle" fill="#2b6e9e">API 层</text>
    <g filter="url(#sk)"><rect x="240" y="45" width="100" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g><text x="290" y="64" text-anchor="middle" fill="#2b6e9e">LLMEngine</text>
    <g filter="url(#sk)"><rect x="355" y="45" width="100" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g><text x="405" y="64" text-anchor="middle" fill="#7a5415">Scheduler</text>
    <g filter="url(#sk)"><rect x="470" y="45" width="105" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g><text x="522" y="64" text-anchor="middle" fill="#7a5415">BlockMgr</text>
    <g filter="url(#sk)"><rect x="590" y="45" width="105" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g><text x="642" y="64" text-anchor="middle" fill="#356130">ModelRunner</text>
    <g filter="url(#sk)"><rect x="710" y="45" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g><text x="750" y="64" text-anchor="middle" fill="#8d3f3b">Sampler</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3">
    <line x1="65" y1="75" x2="65" y2="500"/>
    <line x1="175" y1="75" x2="175" y2="500"/>
    <line x1="290" y1="75" x2="290" y2="500"/>
    <line x1="405" y1="75" x2="405" y2="500"/>
    <line x1="522" y1="75" x2="522" y2="500"/>
    <line x1="642" y1="75" x2="642" y2="500"/>
    <line x1="750" y1="75" x2="750" y2="500"/>
  </g>

  <!-- 1. generate -->
  <path d="M 65 100 L 170 100" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="118" y="92" text-anchor="middle" font-size="9.5" fill="#444">① generate(prompt)</text>
  <!-- 2. add_request -->
  <path d="M 175 128 L 285 128" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="230" y="120" text-anchor="middle" font-size="9.5" fill="#444">② add_request(token ids)</text>
  <!-- 3. schedule -->
  <path d="M 290 170 L 400 170" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="345" y="162" text-anchor="middle" font-size="9.5" fill="#444">③ schedule()</text>
  <!-- 4. allocate -->
  <path d="M 405 198 L 517 198" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="460" y="190" text-anchor="middle" font-size="9.5" fill="#444">④ 分配块 / 抢占</text>
  <!-- 5. outputs -->
  <path d="M 405 226 L 295 226" stroke="#d6a040" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="350" y="218" text-anchor="middle" font-size="9.5" fill="#7a5415">⑤ SchedulerOutputs</text>
  <!-- 6. execute -->
  <path d="M 290 254 L 637 254" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="465" y="246" text-anchor="middle" font-size="9.5" fill="#444">⑥ execute_model（构造输入 → 前向）</text>
  <!-- 7. logits -->
  <path d="M 642 282 L 745 282" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="695" y="274" text-anchor="middle" font-size="9.5" fill="#444">⑦ logits</text>
  <!-- 8. token -->
  <path d="M 750 310 L 295 310" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="520" y="302" text-anchor="middle" font-size="9.5" fill="#8d3f3b">⑧ 采样出 token</text>
  <!-- 9. update -->
  <path d="M 290 338 L 400 338" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="345" y="330" text-anchor="middle" font-size="9.5" fill="#444">⑨ 更新状态 / 追加块</text>
  <!-- loop -->
  <path d="M 405 370 C 405 400 290 400 290 366" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="348" y="412" text-anchor="middle" font-size="9.5" fill="#356130">⑩ 未完成 → 回到 ③ 进入下一 step</text>
  <!-- 10. output -->
  <path d="M 290 440 L 180 440" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="235" y="432" text-anchor="middle" font-size="9.5" fill="#2b6e9e">⑪ RequestOutput（可流式）</text>
  <path d="M 175 468 L 70 468" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="122" y="460" text-anchor="middle" font-size="9.5" fill="#444">⑫ 返回文本</text>

  <text x="400" y="505" text-anchor="middle" font-size="10" fill="#888">③ ~ ⑨ 是每个 step 的循环体；序列完成时 BlockMgr 回收块（ref -1）</text>
</svg>
