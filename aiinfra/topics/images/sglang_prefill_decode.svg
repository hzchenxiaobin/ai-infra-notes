<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="445" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Prefill 与 Decode：一次生成的两个阶段</text>

  <!-- 左：Prefill -->
  <g filter="url(#sk)"><rect x="30" y="52" width="345" height="252" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="202" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">Prefill（预填充）</text>
  <text x="202" y="97" text-anchor="middle" font-size="10.5" fill="#4a6a8a">收到 prompt 后的第一步</text>

  <g filter="url(#sk)">
    <rect x="58" y="112" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="98" y="112" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="138" y="112" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="178" y="112" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="218" y="112" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="75" y="129" text-anchor="middle" font-size="10" fill="#2b6e9e">t1</text>
  <text x="115" y="129" text-anchor="middle" font-size="10" fill="#2b6e9e">t2</text>
  <text x="155" y="129" text-anchor="middle" font-size="10" fill="#2b6e9e">t3</text>
  <text x="195" y="129" text-anchor="middle" font-size="10" fill="#2b6e9e">t4</text>
  <text x="235" y="129" text-anchor="middle" font-size="10" fill="#2b6e9e">t5</text>
  <path d="M 262 125 L 288 125" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="129" font-size="9.5" fill="#4a6a8a">出第 1 个</text>
  <text x="300" y="142" font-size="9.5" fill="#4a6a8a">新 token</text>
  <text x="202" y="163" text-anchor="middle" font-size="10" fill="#4a6a8a">prompt 全部 token 一次进 = 一个 (n×d) 大矩阵乘</text>

  <text x="202" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">计算密集（Compute Bound）——吃满算力</text>
  <text x="202" y="212" text-anchor="middle" font-size="10.5" fill="#4a6a8a">prompt 越长越耗时</text>

  <g filter="url(#sk)"><rect x="55" y="228" width="295" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="202" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">决定 TTFT（首 token 延迟）</text>

  <text x="202" y="290" text-anchor="middle" font-size="9.5" fill="#8a8a8a">Day 3 流式输出里"等第一个字"的那段时间</text>

  <!-- 右：Decode -->
  <g filter="url(#sk)"><rect x="385" y="52" width="345" height="252" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="557" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8d3f3b">Decode（解码）</text>
  <text x="557" y="97" text-anchor="middle" font-size="10.5" fill="#8a5a56">生成主体：自回归循环</text>

  <g filter="url(#sk)">
    <rect x="413" y="112" width="34" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <rect x="493" y="112" width="34" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <rect x="573" y="112" width="34" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="430" y="129" text-anchor="middle" font-size="10" fill="#8d3f3b">新</text>
  <text x="510" y="129" text-anchor="middle" font-size="10" fill="#8d3f3b">新</text>
  <text x="590" y="129" text-anchor="middle" font-size="10" fill="#8d3f3b">新</text>
  <path d="M 447 125 L 489 125" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 527 125 L 569 125" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="615" y="129" font-size="10" fill="#8a5a56">…</text>
  <text x="557" y="163" text-anchor="middle" font-size="10" fill="#8a5a56">一步前向只出 1 个 token，串行依赖</text>

  <text x="557" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#8d3f3b">显存带宽密集（Memory Bound）</text>
  <text x="557" y="212" text-anchor="middle" font-size="10.5" fill="#8a5a56">每步搬全部权重，只算一点点</text>

  <g filter="url(#sk)"><rect x="410" y="228" width="295" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="557" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">决定 TPOT（每 token 间隔）</text>

  <text x="557" y="290" text-anchor="middle" font-size="9.5" fill="#8a8a8a">Day 3 流式输出里"匀速蹦字"的那段节奏</text>

  <!-- 底部：完整时间线 -->
  <text x="380" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">完整时间线（用户视角）</text>

  <g filter="url(#sk)"><rect x="60" y="348" width="190" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="155" y="367" text-anchor="middle" font-size="9.5" fill="#2b6e9e">prefill：整个 prompt 一次前向</text>

  <g filter="url(#sk)">
    <rect x="272" y="348" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="312" y="348" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="352" y="348" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="392" y="348" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="432" y="348" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="287" y="367" text-anchor="middle" font-size="8.5" fill="#8d3f3b">tok1</text>
  <text x="327" y="367" text-anchor="middle" font-size="8.5" fill="#8d3f3b">tok2</text>
  <text x="367" y="367" text-anchor="middle" font-size="8.5" fill="#8d3f3b">tok3</text>
  <text x="407" y="367" text-anchor="middle" font-size="8.5" fill="#8d3f3b">tok4</text>
  <text x="474" y="367" font-size="11" fill="#8d3f3b">…</text>

  <!-- TTFT 括弧 -->
  <path d="M 60 392 L 60 398 L 302 398 L 302 392" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="181" y="414" text-anchor="middle" font-size="10" fill="#356130">TTFT ≈ 排队 + prefill（到 tok1 出现）</text>

  <!-- TPOT 括弧 -->
  <path d="M 302 392 L 302 398 L 470 398 L 470 392" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="386" y="414" text-anchor="middle" font-size="10" fill="#8d3f3b">TPOT × 生成长度</text>

  <text x="600" y="414" font-size="9.5" fill="#8a8a8a">两阶段成本近似可加</text>
</svg>
