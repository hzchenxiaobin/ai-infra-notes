<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="200" fill="#fdfcf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">MoBA: Mixture of Block Attention</text>
  <g filter="url(#sk)"><rect x="30.0" y="55" width="150" height="60" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="105.0" y="75" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">块摘要</text>
  <text x="105.0" y="93" text-anchor="middle" font-size="9" fill="#333">r_j = mean(KV in B_j)</text>
  <path d="M 180.0 85.0 L 200.0 85.0" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="200.0" y="55" width="150" height="60" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="275.0" y="75" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">门控打分</text>
  <text x="275.0" y="93" text-anchor="middle" font-size="9" fill="#333">g_j = sigmoid(q · r_j)</text>
  <path d="M 350.0 85.0 L 370.0 85.0" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="370.0" y="55" width="150" height="60" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="445.0" y="75" text-anchor="middle" font-size="10" fill="#c98a2b" font-weight="bold">Top-K 选择</text>
  <text x="445.0" y="93" text-anchor="middle" font-size="9" fill="#333">选 K 个得分最高的块</text>
  <path d="M 520.0 85.0 L 540.0 85.0" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="540.0" y="55" width="150" height="60" rx="6" fill="#f0e8fa" stroke="#8a4adb" stroke-width="2"/></g>
  <text x="615.0" y="75" text-anchor="middle" font-size="10" fill="#8a4adb" font-weight="bold">精细注意力</text>
  <text x="615.0" y="93" text-anchor="middle" font-size="9" fill="#333">对选中 K 块做标准 attn</text>
  <text x="360" y="155" text-anchor="middle" font-size="10" fill="#666">MoE 门控思想从 FFN 层迁移到注意力层</text>
  <text x="360" y="173" text-anchor="middle" font-size="9" fill="#666">query → KV block 的 Top-K 路由（和 DSA 思路不同但复杂度类似）</text>
</svg>
