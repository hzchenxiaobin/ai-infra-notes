<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="91" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Chunked Prefill：长 prompt 不再阻塞 decode（横轴 = step）</text>

  <!-- 无 chunked -->
  <text x="40" y="70" font-size="13" font-weight="bold" fill="#8d3f3b">无 Chunked Prefill：ITL 出现长毛刺</text>
  <!-- decode steps -->
  <g filter="url(#sk)"><rect x="60" y="86" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="92" y="86" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="124" y="86" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <!-- 长 prefill -->
  <g filter="url(#sk)"><rect x="156" y="86" width="220" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="266" y="101" text-anchor="middle" font-size="10" fill="#8d3f3b">长 prompt 一次 prefill（如 8K token）</text>
  <g filter="url(#sk)"><rect x="382" y="86" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="414" y="86" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <!-- ITL 曲线 -->
  <path d="M 60 150 L 150 150 L 156 122 L 376 122 L 382 150 L 460 150" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="480" y="140" font-size="10" fill="#8d3f3b">decode 请求的 ITL：prefill 期间被挂起</text>

  <!-- 有 chunked -->
  <text x="40" y="200" font-size="13" font-weight="bold" fill="#356130">有 Chunked Prefill：prefill 切片与 decode 混跑，ITL 平滑</text>
  <g filter="url(#sk)"><rect x="60" y="216" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="86" y="216" width="60" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="146" y="216" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="172" y="216" width="60" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="232" y="216" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="258" y="216" width="60" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="318" y="216" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="344" y="216" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="392" y="231" font-size="10" fill="#666">绿 = decode step　黄 = prefill 切片（受 token 预算约束）</text>
  <path d="M 60 272 L 380 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="400" y="276" font-size="10" fill="#356130">decode 的 ITL 基本平稳，prefill 用 3 个 step 分片完成</text>

  <!-- 底部 -->
  <g filter="url(#sk)"><rect x="60" y="305" width="680" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="400" y="327" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">核心：统一 token 预算（max_num_batched_tokens）同时约束 prefill 与 decode</text>
  <text x="400" y="347" text-anchor="middle" font-size="10.5" fill="#2b6e9e">代价：长 prompt 的 TTFT 略增（分片跑完）　收益：ITL 平滑 + 吞吐提升（Sarathi-Serve）</text>
</svg>
