<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Speculative Decoding：小模型猜，大模型验</text>

  <!-- 第一步 draft -->
  <g filter="url(#sk)"><rect x="40" y="60" width="220" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="150" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">① Draft（小模型）</text>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#444">自回归快速猜 k 个 token</text>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="#444">小模型 decode 极快</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#7a5415">例：猜出 [的 快速 发展]</text>

  <!-- 第二步 verify -->
  <g filter="url(#sk)"><rect x="290" y="60" width="220" height="110" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="400" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">② Verify（大模型）</text>
  <text x="400" y="110" text-anchor="middle" font-size="10" fill="#444">k 个候选一次前向并行打分</text>
  <text x="400" y="130" text-anchor="middle" font-size="10" fill="#444">逐位与大模型分布比对</text>
  <text x="400" y="150" text-anchor="middle" font-size="10" fill="#2b6e9e">接受最长匹配前缀</text>

  <!-- 第三步 结果 -->
  <g filter="url(#sk)"><rect x="540" y="60" width="200" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="640" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#356130">③ 结果</text>
  <text x="640" y="110" text-anchor="middle" font-size="10" fill="#356130">接受 [的 快速]</text>
  <text x="640" y="130" text-anchor="middle" font-size="10" fill="#8d3f3b">拒绝 [发展] 重采样</text>
  <text x="640" y="150" text-anchor="middle" font-size="10" fill="#356130">一次前向得 3 个 token</text>

  <path d="M 260 115 L 284 115" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 510 115 L 534 115" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 为什么加速 -->
  <g filter="url(#sk)"><rect x="40" y="200" width="340" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="210" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">为什么能加速</text>
  <g font-size="10" fill="#444">
    <text x="60" y="250">decode 是 memory-bound：读全部权重+KV</text>
    <text x="60" y="270">只算 1 个 token，算力大量闲置</text>
    <text x="60" y="290">verify k 个候选也是一次前向、一次读取</text>
    <text x="60" y="310">同样的字节数，产出最多 k+1 个 token</text>
  </g>

  <!-- 收益取决于 -->
  <g filter="url(#sk)"><rect x="400" y="200" width="340" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="570" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">收益取决于接受率</text>
  <g font-size="10" fill="#444">
    <text x="420" y="250">接受率高（draft 与 target 分布接近）→ 2-3×</text>
    <text x="420" y="270">接受率低 → draft 白算，可能负收益</text>
    <text x="420" y="290">draft 选择：同系列小模型 / n-gram / EAGLE</text>
    <text x="420" y="310">k 太大验证成本升，太大太小都不划算</text>
  </g>

  <!-- 底部 -->
  <g filter="url(#sk)"><rect x="40" y="340" width="700" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="390" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#356130">本质：用闲置算力（compute）换显存带宽（memory）——decode 特有的套利</text>
</svg>
