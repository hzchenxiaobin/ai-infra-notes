<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">同一个模型，两种跑法：裸推理 vs 推理引擎</text>

  <!-- 左：裸推理 -->
  <g filter="url(#sk)"><rect x="30" y="52" width="345" height="268" rx="10" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/></g>
  <text x="202" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#555">PyTorch model.generate()（裸推理）</text>

  <g filter="url(#sk)"><rect x="52" y="94" width="300" height="40" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/></g>
  <text x="202" y="118" text-anchor="middle" font-size="11" fill="#444">一次只处理 1 个请求（batch = 1）</text>

  <g filter="url(#sk)"><rect x="52" y="144" width="300" height="40" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/></g>
  <text x="202" y="162" text-anchor="middle" font-size="11" fill="#444">KV Cache 按最大长度预留</text>
  <text x="202" y="177" text-anchor="middle" font-size="11" fill="#444">显存浪费可达 60-80%</text>

  <g filter="url(#sk)"><rect x="52" y="194" width="300" height="40" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/></g>
  <text x="202" y="212" text-anchor="middle" font-size="11" fill="#444">相同 system prompt 每个请求</text>
  <text x="202" y="227" text-anchor="middle" font-size="11" fill="#444">都从第 0 个 token 全量重算</text>

  <g filter="url(#sk)"><rect x="52" y="244" width="300" height="40" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/></g>
  <text x="202" y="268" text-anchor="middle" font-size="11" fill="#444">无 HTTP 服务 / 无并发 / 无流式</text>

  <g filter="url(#sk)"><rect x="52" y="292" width="300" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="202" y="307" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8d3f3b">GPU 喂不饱，利用率常为个位数</text>

  <!-- 右：SGLang -->
  <g filter="url(#sk)"><rect x="385" y="52" width="345" height="268" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="557" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">SGLang（推理引擎）</text>

  <g filter="url(#sk)"><rect x="407" y="94" width="300" height="40" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="557" y="118" text-anchor="middle" font-size="11" fill="#444">Continuous Batching：请求随到随拼批</text>

  <g filter="url(#sk)"><rect x="407" y="144" width="300" height="40" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="557" y="162" text-anchor="middle" font-size="11" fill="#444">分页 KV Cache 池：按需分配</text>
  <text x="557" y="177" text-anchor="middle" font-size="11" fill="#444">显存浪费降到 ~4%</text>

  <g filter="url(#sk)"><rect x="407" y="194" width="300" height="40" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="557" y="212" text-anchor="middle" font-size="11" fill="#444">RadixAttention：共享前缀只算 1 次</text>
  <text x="557" y="227" text-anchor="middle" font-size="11" fill="#444">命中部分直接复用 KV</text>

  <g filter="url(#sk)"><rect x="407" y="244" width="300" height="40" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="557" y="268" text-anchor="middle" font-size="11" fill="#444">OpenAI 兼容 HTTP 服务 + 流式输出</text>

  <g filter="url(#sk)"><rect x="407" y="292" width="300" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="557" y="307" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#356130">GPU 利用率拉满，吞吐高一个数量级</text>

  <!-- 中间箭头 -->
  <path d="M 380 340 L 380 340" stroke="none"/>
  <text x="380" y="345" text-anchor="middle" font-size="11" fill="#5a5a5a">右边的每一项，都是本周 Day 2-7 要逐一拆开的机制</text>
</svg>
