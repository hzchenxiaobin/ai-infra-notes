  <text x="193" y="340" text-anchor="middle" font-size="8" fill="#999">槽位（每格 16B；彩色对角线 = 逻辑块 0 的去向）</text>
  <text x="193" y="360" text-anchor="middle" font-size="9" fill="#444">行号只取 i mod 8：bit[7,10) 每 1024B 回绕一次（原子基址按 1024B 对齐）</text>
  <text x="193" y="376" text-anchor="middle" font-size="9" fill="#2e6e2e">原子内部：槽位 s 存逻辑块 s ⊕ i，按行写、按列读都铺满 32 bank</text>

  <path d="M 315 225 L 465 225" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="390" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" font-family="monospace" fill="#2b2b2b">tile_to_shape</text>
  <text x="390" y="243" text-anchor="middle" font-size="8.5" fill="#888">原子沿 M、K 平铺</text>

  <text x="602" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">128×64 的 A tile（FP16）</text>
  <text x="602" y="92" text-anchor="middle" font-size="9" fill="#888">M=128 → 16 个原子；K=128 → 2 列（共 32 个）</text>
  <text x="550" y="104" text-anchor="middle" font-size="8" fill="#888">K 0~63（128B）</text>
  <text x="654" y="104" text-anchor="middle" font-size="8" fill="#888">K 64~127（128B）</text>
  <text x="490" y="285" font-size="8" fill="#888" text-anchor="middle" transform="rotate(-90 490 285)">M 方向 16 个原子（每个 8 行）</text>

