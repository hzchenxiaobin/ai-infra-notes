  <text x="602" y="478" text-anchor="middle" font-size="9" fill="#444">每个原子独立做 XOR：i mod 8 在原子内回绕，行号不会串到隔壁原子</text>
  <text x="602" y="494" text-anchor="middle" font-size="9" fill="#7a5415">K 不足 64 列（128B）时降档：SWIZZLE_64B / SWIZZLE_32B，或不 swizzle</text>

  <g filter="url(#sk)">
    <rect x="30" y="512" width="900" height="46" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="50" y="531" font-size="10.5" font-weight="bold" fill="#7a5415">CuTe 布局 = 「原子 + tile_to_shape」两层：</text>
  <text x="50" y="549" font-size="9.5" fill="#444">原子回答「块怎么置换」，平铺回答「怎么铺满 tile」——换 tile 形状不用重写置换规则，这就是两层结构的原因。</text>
