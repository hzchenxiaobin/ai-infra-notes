  <text x="193" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">一个 swizzle 原子</text>
  <text x="193" y="92" text-anchor="middle" font-size="9" fill="#888">8 行 × 8 个 16B 槽 = 8 × 128B = 1024B</text>

