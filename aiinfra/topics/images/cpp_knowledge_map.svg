  </defs>
  <rect width="740" height="520" fill="#fdfcf7"/>
  <text x="370" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">C++ 7 天知识点关联图</text>
  <path d="M 250 40 Q 370 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="240" y="56" width="260" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>  <text x="370" y="80" font-size="12" fill="#2b6e9e" font-weight="bold">Day 1: 内存模型与基础语义</text>  <path d="M 200 92 Q 160 120 160 140" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="142" width="200" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>  <text x="160" y="166" font-size="11" fill="#2e6e2e" font-weight="bold">Day 2: RAII</text>  <path d="M 370 92 L 370 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="240" y="110" width="260" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>  <text x="370" y="134" font-size="11" fill="#7a5415" font-weight="bold">Day 3: 移动语义（右值引用 + move）</text>  <path d="M 370 148 L 370 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="220" y="166" width="300" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>  <text x="370" y="190" font-size="11" fill="#7a5415" font-weight="bold">Day 4: 完美转发 + 变参模板</text>  <path d="M 370 204 L 370 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="240" y="222" width="260" height="36" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>  <text x="370" y="246" font-size="10" fill="#888" font-weight="normal">→ CUTLASS/DeepGEMM 源码</text>  <path d="M 440 92 Q 520 120 520 140" stroke="#b03a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="460" y="142" width="240" height="36" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  </g>  <text x="580" y="166" font-size="10" fill="#b03a3a" font-weight="bold">Day 5: 虚函数表 + Rule of 5</text>  <path d="M 580 178 Q 500 200 370 220" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <text x="440" y="200" font-size="9" fill="#888" font-weight="normal">析构 → Day 2 智能指针</text>  <path d="M 440 92 Q 600 280 580 300" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="460" y="302" width="240" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>  <text x="580" y="326" font-size="10" fill="#2b6e9e" font-weight="bold">Day 6: 并发(thread/atomic)</text>  <path d="M 580 340 L 580 356" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="440" y="358" width="280" height="36" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>  <text x="580" y="382" font-size="9" fill="#888" font-weight="normal">shared_ptr 线程安全 → atomic 引用计数</text>  <g filter="url(#sk)">
    <rect x="40" y="420" width="660" height="50" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.0"/>
  </g>  <text x="370" y="442" font-size="11" fill="#666" font-weight="bold">Day 1 内存模型是所有后续内容的基础</text>  <text x="370" y="460" font-size="10" fill="#888" font-weight="normal">Day 2 RAII → Day 3 移动 → Day 4 模板 → Day 5 虚函数 → Day 6 并发</text></svg>