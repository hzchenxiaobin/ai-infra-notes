<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Copy-on-Write：parallel sampling 共享 prompt 块</text>

  <!-- 左：写之前 -->
  <text x="195" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">写之前：两个样本共享前缀（ref=2）</text>

  <g filter="url(#sk)"><rect x="40" y="80" width="130" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="105" y="103" text-anchor="middle" font-size="11" fill="#2b6e9e">样本 A 的表</text>
  <g filter="url(#sk)"><rect x="40" y="124" width="130" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="105" y="147" text-anchor="middle" font-size="11" fill="#2b6e9e">样本 B 的表</text>

  <g filter="url(#sk)"><rect x="230" y="90" width="120" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="290" y="106" text-anchor="middle" font-size="10.5" fill="#356130">物理块 P0</text>
  <text x="290" y="122" text-anchor="middle" font-size="10" fill="#356130">prompt 前半 ref=2</text>

  <g filter="url(#sk)"><rect x="230" y="140" width="120" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="290" y="156" text-anchor="middle" font-size="10.5" fill="#356130">物理块 P1</text>
  <text x="290" y="172" text-anchor="middle" font-size="10" fill="#356130">prompt 末尾 ref=2</text>

  <path d="M 170 98 L 225 104" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 170 142 L 225 154" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="195" y="215" text-anchor="middle" font-size="10.5" fill="#888">两块都只读，零拷贝共享</text>

  <!-- 右：写之后 -->
  <text x="585" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#8d3f3b">B 生成新 token 落入 P1 → 触发 CoW</text>

  <g filter="url(#sk)"><rect x="430" y="80" width="130" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="495" y="103" text-anchor="middle" font-size="11" fill="#2b6e9e">样本 A 的表</text>
  <g filter="url(#sk)"><rect x="430" y="124" width="130" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="495" y="147" text-anchor="middle" font-size="11" fill="#8d3f3b">样本 B 的表</text>

  <g filter="url(#sk)"><rect x="620" y="80" width="120" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="680" y="103" text-anchor="middle" font-size="10.5" fill="#356130">P0 ref=2</text>

  <g filter="url(#sk)"><rect x="620" y="124" width="120" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="680" y="147" text-anchor="middle" font-size="10.5" fill="#356130">P1 ref=1（仅 A）</text>

  <g filter="url(#sk)"><rect x="620" y="168" width="120" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="680" y="184" text-anchor="middle" font-size="10.5" fill="#7a5415">P4 = P1 副本</text>
  <text x="680" y="198" text-anchor="middle" font-size="10" fill="#7a5415">+ B 的新 token</text>

  <path d="M 560 98 L 615 96" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 560 142 L 615 138" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 560 148 C 590 165 600 175 615 182" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 分隔线 -->
  <line x1="390" y1="70" x2="390" y2="230" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- 底部流程 -->
  <g filter="url(#sk)"><rect x="50" y="250" width="680" height="120" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="390" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">CoW 触发流程（Block Manager 视角）</text>
  <g font-size="11" fill="#444">
    <text x="90" y="304">1. 序列要写入的块 ref &gt; 1（被共享）</text>
    <text x="90" y="326">2. 申请一个新物理块，把原块内容拷过去，写入新 token</text>
    <text x="90" y="348">3. 原块 ref 减 1，本序列的 block table 改指新块</text>
  </g>
  <text x="560" y="304" font-size="11" fill="#2b6e9e">收益：n 个样本的 prompt</text>
  <text x="560" y="326" font-size="11" fill="#2b6e9e">KV 只存一份，显存省 ~n-1 倍</text>
  <text x="560" y="348" font-size="11" fill="#2b6e9e">（Prefix Caching 同源思想）</text>
</svg>
