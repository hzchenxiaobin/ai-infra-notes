<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fdfcf7"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Agent = Model + Harness</text>
  <path d="M 240 40 Q 360 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Model box -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="200" height="250" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="140" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">Model（裸模型）</text>
  <text x="140" y="118" text-anchor="middle" font-size="10" fill="#888">文本输入 → 文本输出</text>

  <g font-size="10" fill="#555">
    <text x="60" y="146">✅ 理解语言</text>
    <text x="60" y="162">✅ 生成代码</text>
    <text x="60" y="178">✅ 推理判断</text>
  </g>
  <line x1="60" y1="192" x2="220" y2="192" stroke="#ddd" stroke-width="1"/>
  <g font-size="10" fill="#b85450">
    <text x="60" y="210">❌ 维护状态</text>
    <text x="60" y="226">❌ 执行代码</text>
    <text x="60" y="242">❌ 读写文件</text>
    <text x="60" y="258">❌ 访问网络</text>
    <text x="60" y="274">❌ 启动环境</text>
    <text x="60" y="290">❌ 纠正自己</text>
  </g>
  <text x="140" y="312" text-anchor="middle" font-size="9" fill="#888">只是一个大脑</text>

  <!-- Plus sign -->
  <text x="290" y="195" text-anchor="middle" font-size="28" font-weight="bold" fill="#5a5a5a">+</text>

  <!-- Harness box -->
  <g filter="url(#sk)">
    <rect x="330" y="70" width="200" height="250" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="430" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">Harness（外骨骼）</text>
  <text x="430" y="118" text-anchor="middle" font-size="10" fill="#888">模型之外的一切</text>

  <g font-size="10" fill="#444">
    <text x="350" y="146" fill="#2b6e9e">System Prompts</text>
    <text x="360" y="160" fill="#888">AGENTS.md → 知识</text>
    <text x="350" y="180" fill="#2e6e2e">Tools &amp; MCP</text>
    <text x="360" y="194" fill="#888">执行能力</text>
    <text x="350" y="214" fill="#c98a2b">沙箱基础设施</text>
    <text x="360" y="228" fill="#888">运行环境</text>
    <text x="350" y="248" fill="#8e5db8">Hooks / 中间件</text>
    <text x="360" y="262" fill="#888">生命周期管理</text>
    <text x="350" y="282" fill="#b85450">Back-Pressure</text>
    <text x="360" y="296" fill="#888">自我验证</text>
    <text x="350" y="312" fill="#4a8e4a">Sub-Agents</text>
  </g>

  <!-- Equals sign -->
  <text x="580" y="195" text-anchor="middle" font-size="28" font-weight="bold" fill="#5a5a5a">=</text>

  <!-- Agent box -->
  <g filter="url(#sk)">
    <rect x="610" y="100" width="90" height="190" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.5"/>
  </g>
  <text x="655" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">Agent</text>
  <text x="655" y="153" text-anchor="middle" font-size="10" fill="#555">智能体</text>
  <g font-size="9" fill="#2e6e2e">
    <text x="620" y="180">✅ 有记忆</text>
    <text x="620" y="196">✅ 能执行</text>
    <text x="620" y="212">✅ 能读写</text>
    <text x="620" y="228">✅ 能纠错</text>
    <text x="620" y="244">✅ 能协作</text>
  </g>
  <text x="655" y="275" text-anchor="middle" font-size="9" fill="#888">大脑+手脚</text>

  <!-- Arrows -->
  <path d="M 245 195 L 330 195" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 535 195 L 610 195" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="640" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-dasharray="5 3"/>
  </g>
  <text x="360" y="360" text-anchor="middle" font-size="10" fill="#7a5415">裸模型只是文本引擎——harness 给它状态、工具、反馈回路和约束时，它才成为智能体</text>
</svg>
