  <rect width="760" height="500" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Block Tile 映射：64×64 tile 切为 16×16 = 256 个 thread tile</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#888">每 thread 负责 TM×TN = 4×4 输出，累加器 acc[4][4] 驻留寄存器</text>

