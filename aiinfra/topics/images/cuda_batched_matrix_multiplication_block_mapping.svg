  <text x="140" y="356" text-anchor="middle" font-size="9" fill="#888">（图为 8×8 概览，实际 16×16 = 256 个 thread tile）</text>

  <!-- ===== Right: zoomed thread tile 4x4 ===== -->
  <text x="310" y="74" font-size="12" fill="#b85450" font-weight="bold">单个 thread 的 TM×TN = 4×4 输出</text>
  <text x="310" y="90" font-size="10" fill="#888">累加器 acc[4][4] 驻留寄存器，K 维循环累加</text>

  <!-- rB label -->
  <text x="430" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">← TN=4 →  rB[0..3]</text>

  <!-- rA label -->
  <text x="304" y="200" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" transform="rotate(-90 304 200)">TM=4  rA[0..3]</text>

  <g font-size="9" fill="#333">
    <rect x="310" y="110" width="240" height="180" fill="none" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <!-- 4x4 grid, each 60x45 -->
    <rect x="310" y="110" width="60" height="45" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
