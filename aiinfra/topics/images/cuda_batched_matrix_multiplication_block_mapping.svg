    <text x="400" y="137" text-anchor="middle" font-family="monospace" font-size="8" fill="#b85450">acc[0][1]</text>
    <text x="460" y="137" text-anchor="middle" font-family="monospace" font-size="8" fill="#b85450">acc[0][2]</text>
