    <text x="340" y="182" text-anchor="middle" font-family="monospace" font-size="8" fill="#b85450">acc[1][0]</text>
    <text x="340" y="227" text-anchor="middle" font-family="monospace" font-size="8" fill="#b85450">acc[2][0]</text>
    <text x="340" y="272" text-anchor="middle" font-family="monospace" font-size="8" fill="#b85450">acc[3][0]</text>
  </g>

  <!-- index formula -->
  <rect x="310" y="304" width="240" height="64" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="322" y="324" font-family="monospace" font-size="9" fill="#333">ty = tid / (BN/TN)  // 0..15</text>
  <text x="322" y="340" font-family="monospace" font-size="9" fill="#333">tx = tid % (BN/TN)  // 0..15</text>
  <text x="322" y="356" font-size="8" fill="#888">→ 输出 C[b][by*64+ty*4+i][bx*64+tx*4+j]</text>

  <!-- ===== Bottom: worked example + summary ===== -->
  <rect x="20" y="384" width="720" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="36" y="406" font-size="12" fill="#444" font-weight="bold">Worked Example（BATCH=32, M=N=K=256, blockIdx=(0,0,1), tid=0）</text>
  <text x="36" y="426" font-family="monospace" font-size="9" fill="#333">b=1 → Ab=A+65536, Bb=B+65536, Cb=C+65536    ty=0, tx=0 → 负责 C[1][0:4][0:4]</text>
  <text x="36" y="442" font-family="monospace" font-size="9" fill="#333">bk 循环: 每次 256 thread 协作加载 As[64][16]+Bs[16][64] → __syncthreads → acc[i][j] += a[i]*b[j]</text>
  <text x="36" y="458" font-size="9" fill="#555">① 每 thread 读 1 次 rA[i] 可给 TN=4 个 acc 乘加 → A 复用 ×4    ② 每 thread 读 1 次 rB[j] 可给 TM=4 个 acc 乘加 → B 复用 ×4</text>
  <text x="36" y="474" font-size="9" fill="#555">③ 256 thread × 16 输出 = 4096 = 64×64 block tile，线程数减少 16×，shared 访问量降 4×</text>
</svg>
