<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Causal Mask（因果掩码，n=4）：下三角可见，上三角置 −∞</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Column headers j=0..3 -->
  <text x="175" y="80" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">j=0</text>
  <text x="245" y="80" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">j=1</text>
  <text x="315" y="80" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">j=2</text>
  <text x="385" y="80" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">j=3</text>

  <!-- Row headers i=0..3 -->
  <text x="125" y="124" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">i=0</text>
  <text x="125" y="174" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">i=1</text>
  <text x="125" y="224" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">i=2</text>
  <text x="125" y="274" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">i=3</text>

  <!-- Row 0: [0, -inf, -inf, -inf] -->
  <g filter="url(#sk)"><rect x="140" y="95" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="175" y="125" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="210" y="95" width="70" height="48" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/></g>
  <text x="245" y="125" text-anchor="middle" font-size="13" fill="#999">−∞</text>
  <g filter="url(#sk)"><rect x="280" y="95" width="70" height="48" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/></g>
  <text x="315" y="125" text-anchor="middle" font-size="13" fill="#999">−∞</text>
  <g filter="url(#sk)"><rect x="350" y="95" width="70" height="48" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/></g>
  <text x="385" y="125" text-anchor="middle" font-size="13" fill="#999">−∞</text>

  <!-- Row 1: [0, 0, -inf, -inf] -->
  <g filter="url(#sk)"><rect x="140" y="145" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="175" y="175" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="210" y="145" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="245" y="175" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="280" y="145" width="70" height="48" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/></g>
  <text x="315" y="175" text-anchor="middle" font-size="13" fill="#999">−∞</text>
  <g filter="url(#sk)"><rect x="350" y="145" width="70" height="48" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/></g>
  <text x="385" y="175" text-anchor="middle" font-size="13" fill="#999">−∞</text>

  <!-- Row 2: [0, 0, 0, -inf] -->
  <g filter="url(#sk)"><rect x="140" y="195" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="175" y="225" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="210" y="195" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="245" y="225" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="280" y="195" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="315" y="225" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="350" y="195" width="70" height="48" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/></g>
  <text x="385" y="225" text-anchor="middle" font-size="13" fill="#999">−∞</text>

  <!-- Row 3: [0, 0, 0, 0] -->
  <g filter="url(#sk)"><rect x="140" y="245" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="175" y="275" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="210" y="245" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="245" y="275" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="280" y="245" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="315" y="275" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="350" y="245" width="70" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="385" y="275" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>

  <!-- Annotations on the right -->
  <text x="435" y="125" font-size="11" fill="#444">← 位置 0 只看自己</text>
  <text x="435" y="175" font-size="11" fill="#444">← 位置 1 看 0, 1</text>
  <text x="435" y="225" font-size="11" fill="#444">← 位置 2 看 0, 1, 2</text>
  <text x="435" y="275" font-size="11" fill="#444">← 位置 3 看全部</text>

  <!-- Legend / note at bottom -->
  <g filter="url(#sk)">
    <rect x="40" y="310" width="560" height="55" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <rect x="60" y="325" width="16" height="16" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  <text x="82" y="338" font-size="11" fill="#444">0：可见（参与 softmax）</text>
  <rect x="240" y="325" width="16" height="16" rx="3" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3"/>
  <text x="262" y="338" font-size="11" fill="#444">−∞：掩码（softmax 后 → 0）</text>
  <text x="60" y="356" font-size="10" fill="#888" font-style="italic">位置 i 只能看到位置 ≤ i，不能"偷看"未来 → 自回归生成的因果性保证</text>
</svg>
