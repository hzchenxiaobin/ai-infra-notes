<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="560" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">归一化谱系：BN → GN → IN 由 G 调节（G=C 为 IN，G=1 类 LN）</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#888">同一 (N,C,H,W) 张量，归约集合随 G 变化 → 访存合并性与 batch 依赖性随之变化</text>

  <!-- ===== spectrum axis ===== -->
  <line x1="60" y1="100" x2="620" y2="100" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 620 100 L 612 96 L 612 104 z" fill="#888" filter="url(#rough2)"/>
  <text x="340" y="88" text-anchor="middle" font-size="11" fill="#555">组数 G（1 → C）</text>

  <!-- ticks -->
  <g font-size="10" fill="#555">
    <line x1="100" y1="96" x2="100" y2="104" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="100" y="118" text-anchor="middle" font-weight="bold">G = 1</text>
    <text x="100" y="132" text-anchor="middle" font-size="9" fill="#888">LayerNorm-like</text>

    <line x1="300" y1="96" x2="300" y2="104" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="300" y="118" text-anchor="middle" font-weight="bold">1 &lt; G &lt; C</text>
    <text x="300" y="132" text-anchor="middle" font-size="9" fill="#888">GroupNorm</text>

    <line x1="540" y1="96" x2="540" y2="104" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="540" y="118" text-anchor="middle" font-weight="bold">G = C</text>
    <text x="540" y="132" text-anchor="middle" font-size="9" fill="#888">InstanceNorm</text>
  </g>

  <!-- ===== reduce set visualization (N=1, C=4, H=W=2 for all) ===== -->
  <!-- G=1: whole (C,H,W) is one group -->
  <text x="100" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">归约集合</text>
  <g font-size="8" fill="#333">
    <!-- 4 channels all same color (one group) -->
    <rect x="60"  y="168" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="76"  y="168" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="92"  y="168" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="108" y="168" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="60"  y="184" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="76"  y="184" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="92"  y="184" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="108" y="184" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="60"  y="200" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="76"  y="200" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="92"  y="200" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="108" y="200" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="60"  y="216" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="76"  y="216" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="92"  y="216" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="108" y="216" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
  </g>
  <text x="100" y="250" text-anchor="middle" font-size="9" fill="#555">M = C·H·W</text>
  <text x="100" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">coalesced ✓</text>
  <text x="100" y="278" text-anchor="middle" font-size="9" fill="#888">batch 无关 ✓</text>

  <!-- G=2: 2 groups of 2 channels each -->
  <g font-size="8" fill="#333">
    <rect x="260" y="168" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="276" y="168" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="292" y="168" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="308" y="168" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="260" y="184" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="276" y="184" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="292" y="184" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="308" y="184" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="260" y="200" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="276" y="200" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="292" y="200" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="308" y="200" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="260" y="216" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="276" y="216" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="292" y="216" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="308" y="216" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
  </g>
  <text x="300" y="250" text-anchor="middle" font-size="9" fill="#555">M = (C/G)·H·W</text>
  <text x="300" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">coalesced ✓</text>
  <text x="300" y="278" text-anchor="middle" font-size="9" fill="#888">batch 无关 ✓</text>

  <!-- G=C: each channel own group -->
  <g font-size="8" fill="#333">
    <rect x="500" y="168" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="516" y="168" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="532" y="168" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="548" y="168" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="500" y="184" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="516" y="184" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="532" y="184" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="548" y="184" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="500" y="200" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="516" y="200" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="532" y="200" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="548" y="200" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="500" y="216" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="516" y="216" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="532" y="216" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="548" y="216" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
  </g>
  <text x="540" y="250" text-anchor="middle" font-size="9" fill="#555">M = H·W</text>
  <text x="540" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">coalesced ✓</text>
  <text x="540" y="278" text-anchor="middle" font-size="9" fill="#888">batch 无关 ✓</text>

  <!-- ===== BN contrast ===== -->
  <line x1="20" y1="300" x2="660" y2="300" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="324" font-size="12" fill="#b85450" font-weight="bold">对比：BatchNorm（不在 GN 谱系，归约沿 N）</text>

  <g font-size="8" fill="#333">
    <!-- BN: reduce along N for each (c,h,w), shown as a column -->
    <rect x="60"  y="332" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="76"  y="332" width="16" height="16" fill="#fff" stroke="#ccc" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <rect x="92"  y="332" width="16" height="16" fill="#fff" stroke="#ccc" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <rect x="108" y="332" width="16" height="16" fill="#fff" stroke="#ccc" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <rect x="60"  y="348" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <rect x="76"  y="348" width="16" height="16" fill="#fff" stroke="#ccc" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <rect x="92"  y="348" width="16" height="16" fill="#fff" stroke="#ccc" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <rect x="108" y="348" width="16" height="16" fill="#fff" stroke="#ccc" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  </g>
  <text x="100" y="384" text-anchor="middle" font-size="9" fill="#555">归约沿 N（步长 C·H·W）</text>
  <text x="100" y="398" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">strided ✗</text>
  <text x="100" y="412" text-anchor="middle" font-size="9" fill="#b85450">batch 依赖 ✗</text>

  <!-- ===== comparison table ===== -->
  <line x1="20" y1="430" x2="660" y2="430" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="454" font-size="12" fill="#444" font-weight="bold">总结表</text>

  <g font-size="10" fill="#333">
    <rect x="30" y="464" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="90" y="480" text-anchor="middle" font-weight="bold">Norm</text>
    <rect x="150" y="464" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="220" y="480" text-anchor="middle" font-weight="bold">归约集合</text>
    <rect x="290" y="464" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="350" y="480" text-anchor="middle" font-weight="bold">合并性</text>
    <rect x="410" y="464" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="470" y="480" text-anchor="middle" font-weight="bold">batch 依赖</text>
    <rect x="530" y="464" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="585" y="480" text-anchor="middle" font-weight="bold">典型场景</text>

    <rect x="30" y="490" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="40" y="505">BatchNorm</text>
    <rect x="150" y="490" width="140" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="160" y="505">(N, H, W) per c</text>
    <rect x="290" y="490" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="300" y="505" fill="#b85450">strided ✗</text>
    <rect x="410" y="490" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="420" y="505" fill="#b85450">依赖 ✗</text>
    <rect x="530" y="490" width="110" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="540" y="505">CV 训练</text>

    <rect x="30" y="514" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="40" y="529">GroupNorm</text>
    <rect x="150" y="514" width="140" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="160" y="529">(Cg, H, W) per g</text>
    <rect x="290" y="514" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="300" y="529" fill="#4a7a3a">coalesced ✓</text>
    <rect x="410" y="514" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="420" y="529" fill="#4a7a3a">无关 ✓</text>
    <rect x="530" y="514" width="110" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="540" y="529">小 batch CV</text>

    <rect x="30" y="538" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="40" y="553">LayerNorm</text>
    <rect x="150" y="538" width="140" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="160" y="553">(C, H, W) per n</text>
    <rect x="290" y="538" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="300" y="553" fill="#4a7a3a">coalesced ✓</text>
    <rect x="410" y="538" width="120" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="420" y="553" fill="#4a7a3a">无关 ✓</text>
    <rect x="530" y="538" width="110" height="22" fill="#fff" stroke="#eee" rx="2" filter="url(#rough2)"/>
    <text x="540" y="553">NLP/Transformer</text>
  </g>
</svg>
