<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">静态批处理（班车） vs Continuous Batching（传送带）</text>

  <!-- 上：静态批处理 -->
  <g filter="url(#sk)"><rect x="30" y="52" width="700" height="175" rx="10" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/></g>
  <text x="380" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">静态批处理：人齐才发，整批一起走，最短的等最长的</text>

  <path d="M 60 95 L 690 95" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="700" y="92" font-size="9" fill="#8a8a8a">时间</text>

  <g filter="url(#sk)"><rect x="60" y="105" width="140" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="130" y="122" text-anchor="middle" font-size="9.5" fill="#2b6e9e">A（16 token）</text>
  <g filter="url(#sk)"><rect x="200" y="105" width="460" height="26" rx="4" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4,4"/></g>
  <text x="430" y="122" text-anchor="middle" font-size="9.5" fill="#999">空转：A 早已完成，槽位干等 C</text>

  <g filter="url(#sk)"><rect x="60" y="140" width="360" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="240" y="157" text-anchor="middle" font-size="9.5" fill="#2b6e9e">B（64 token）</text>
  <g filter="url(#sk)"><rect x="420" y="140" width="240" height="26" rx="4" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4,4"/></g>
  <text x="540" y="157" text-anchor="middle" font-size="9.5" fill="#999">空转</text>

  <g filter="url(#sk)"><rect x="60" y="175" width="600" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="360" y="192" text-anchor="middle" font-size="9.5" fill="#2b6e9e">C（128 token）</text>

  <text x="380" y="218" text-anchor="middle" font-size="10" fill="#8d3f3b">请求 D 在门外排队——必须等整批（即最慢的 C）结束才能上车</text>

  <!-- 下：Continuous Batching -->
  <g filter="url(#sk)"><rect x="30" y="247" width="700" height="175" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="380" y="271" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#356130">Continuous Batching：每步 decode 后重组 batch，随来随上、完成即下</text>

  <path d="M 60 290 L 690 290" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="700" y="287" font-size="9" fill="#4a7a3a">时间</text>

  <g filter="url(#sk)"><rect x="60" y="300" width="140" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="130" y="317" text-anchor="middle" font-size="9.5" fill="#2b6e9e">A（16）</text>
  <g filter="url(#sk)"><rect x="200" y="300" width="340" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="370" y="317" text-anchor="middle" font-size="9.5" fill="#8d3f3b">D（等在门外，此刻立即插入）</text>

  <g filter="url(#sk)"><rect x="60" y="335" width="360" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="240" y="352" text-anchor="middle" font-size="9.5" fill="#2b6e9e">B（64）</text>

  <g filter="url(#sk)"><rect x="60" y="370" width="600" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="360" y="387" text-anchor="middle" font-size="9.5" fill="#2b6e9e">C（128）</text>

  <text x="380" y="413" text-anchor="middle" font-size="10" fill="#356130">调度发生在每一步（iteration 级），不是每一批：完成即离开，等待即插入</text>

  <!-- 底部注释 -->
  <path d="M 60 438 L 700 438" stroke="#d6a040" stroke-width="1" stroke-dasharray="5,5" filter="url(#sk)"/>
  <text x="380" y="460" text-anchor="middle" font-size="11" fill="#7a5415">GPU 不再陪最慢的请求空转——吞吐提升数倍到十几倍（iteration 级调度思想出自 Orca，OSDI 2022）</text>
</svg>
