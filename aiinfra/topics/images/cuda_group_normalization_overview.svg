<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="560" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Group Norm：一个 block 负责一个 (n, g) 组，三遍扫描</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#888">NCHW 布局，C 个通道分 G 组（每组 Cg=C/G），mean/var 沿 (Cg, H, W) 统计</text>

  <!-- ===== NCHW tensor: N=1, C=4, H=W=2, G=2 ===== -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">X[N, C, H, W]  (NCHW 行主序，C 连续分组)</text>
  <text x="30" y="92" font-size="10" fill="#888">例：N=1, C=4, H=W=2, G=2 → Cg=2</text>

  <!-- group 0: channels 0,1 (red) -->
  <text x="40" y="112" font-size="10" fill="#b85450" font-weight="bold">group 0 (c=0,1)</text>
  <g font-size="9" fill="#333">
    <!-- channel 0 -->
    <rect x="40"  y="118" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="56"  y="133" text-anchor="middle">1.0</text>
    <rect x="72"  y="118" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="88"  y="133" text-anchor="middle">1.0</text>
    <rect x="40"  y="140" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="56"  y="155" text-anchor="middle">1.0</text>
    <rect x="72"  y="140" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="88"  y="155" text-anchor="middle">1.0</text>
    <text x="116" y="143" font-size="9" fill="#888">c=0</text>

    <!-- channel 1 -->
    <rect x="40"  y="170" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="56"  y="185" text-anchor="middle">3.0</text>
    <rect x="72"  y="170" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="88"  y="185" text-anchor="middle">3.0</text>
    <rect x="40"  y="192" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="56"  y="207" text-anchor="middle">3.0</text>
    <rect x="72"  y="192" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="88"  y="207" text-anchor="middle">3.0</text>
    <text x="116" y="195" font-size="9" fill="#888">c=1</text>
  </g>

  <!-- group 1: channels 2,3 (green) -->
  <text x="200" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">group 1 (c=2,3)</text>
  <g font-size="9" fill="#333">
    <rect x="200" y="118" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="216" y="133" text-anchor="middle">2.0</text>
    <rect x="232" y="118" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="248" y="133" text-anchor="middle">2.0</text>
    <rect x="200" y="140" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="216" y="155" text-anchor="middle">2.0</text>
    <rect x="232" y="140" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="248" y="155" text-anchor="middle">2.0</text>
    <text x="276" y="143" font-size="9" fill="#888">c=2</text>

    <rect x="200" y="170" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="216" y="185" text-anchor="middle">6.0</text>
    <rect x="232" y="170" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="248" y="185" text-anchor="middle">6.0</text>
    <rect x="200" y="192" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="216" y="207" text-anchor="middle">6.0</text>
    <rect x="232" y="192" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="248" y="207" text-anchor="middle">6.0</text>
    <text x="276" y="195" font-size="9" fill="#888">c=3</text>
  </g>

  <!-- contiguity annotation -->
  <path d="M 40 220 L 104 220" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="72" y="236" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">8 元素连续</text>
  <path d="M 200 220 L 264 220" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="232" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">8 元素连续</text>

  <!-- arrows to blocks -->
  <path d="M 72 244 L 72 268" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 244 L 232 268" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="262" font-size="12" fill="#444" font-weight="bold">grid = N×G 个 block（每 (n,g) 一个 block）</text>

  <!-- ===== blocks ===== -->
  <g font-size="9" fill="#333">
    <rect x="30" y="272" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="100" y="290" text-anchor="middle" font-weight="bold" fill="#b85450">block (n=0, g=0)</text>
    <text x="100" y="306" text-anchor="middle" fill="#555">256 threads</text>
    <text x="100" y="320" text-anchor="middle" fill="#555">reduce Cg×H×W = 8 元素</text>

    <rect x="190" y="272" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="260" y="290" text-anchor="middle" font-weight="bold" fill="#4a7a3a">block (n=0, g=1)</text>
    <text x="260" y="306" text-anchor="middle" fill="#555">256 threads</text>
    <text x="260" y="320" text-anchor="middle" fill="#555">reduce Cg×H×W = 8 元素</text>

    <text x="380" y="296" font-size="11" fill="#888">...</text>
    <text x="380" y="316" font-size="9" fill="#888">共 N×G 个 block</text>
  </g>

  <!-- ===== per-group stats ===== -->
  <path d="M 100 332 L 100 352" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 332 L 260 352" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="346" font-size="12" fill="#444" font-weight="bold">每 block 产出 mean[n,g] / var[n,g]</text>

  <g font-size="9" fill="#333">
    <rect x="40" y="356" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="100" y="371" text-anchor="middle">mean=2.0, var=1.0</text>
    <rect x="200" y="356" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="260" y="371" text-anchor="middle">mean=4.0, var=4.0</text>
  </g>

  <!-- ===== Three passes ===== -->
  <line x1="20" y1="394" x2="660" y2="394" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="416" font-size="12" fill="#444" font-weight="bold">三遍扫描（每 block 独立，归约 Cg×H×W 个连续元素）：</text>

  <rect x="30" y="426" width="190" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="446" font-size="11" fill="#b85450" font-weight="bold">① Pass 1：求 mean</text>
  <text x="44" y="462" font-size="9" fill="#555">sum = Σ x（组内 Cg×H×W 个）</text>
  <text x="44" y="476" font-size="9" fill="#555">mean = sum / M（block_reduce）</text>
  <text x="44" y="488" font-size="9" fill="#888">读 X 1 遍（连续）</text>

  <rect x="240" y="426" width="190" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="254" y="446" font-size="11" fill="#4a7a3a" font-weight="bold">② Pass 2：求 var</text>
  <text x="254" y="462" font-size="9" fill="#555">sq = Σ (x - mean)²</text>
  <text x="254" y="476" font-size="9" fill="#555">var = sq / M（biased）</text>
  <text x="254" y="488" font-size="9" fill="#888">再读 X 1 遍</text>

  <rect x="450" y="426" width="190" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="464" y="446" font-size="11" fill="#446688" font-weight="bold">③ Pass 3：归一化写回</text>
  <text x="464" y="462" font-size="9" fill="#555">y = γ[c]·(x-mean)/√(var+ε) + β[c]</text>
  <text x="464" y="476" font-size="9" fill="#555">γ/β 按通道 c = g·Cg + c_local</text>
  <text x="464" y="488" font-size="9" fill="#888">第 3 遍读 + 写 Y</text>

  <!-- ===== Summary ===== -->
  <rect x="30" y="504" width="610" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="335" y="522" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">访存：每 group 读 X 3 遍 + 写 Y 1 遍 = 4M × 4B（M=Cg×H×W）</text>
  <text x="335" y="538" text-anchor="middle" font-size="10" fill="#888">关键：组内元素在 NCHW 中连续 → coalesced（与 LN 同，与 BN strided 对偶）</text>
</svg>
