<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="101" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">指针 vs 引用：底层内存模型对比</text>
  <path d="M 280 40 Q 450 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: Pointer -->
  <g filter="url(#sk)"><rect x="30" y="60" width="400" height="420" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="230" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">指针（Pointer）</text>

  <g font-size="10" fill="#444">
    <text x="50" y="110" fill="#2b6e9e" font-weight="bold">int x = 10;</text>
    <text x="50" y="126" fill="#2b6e9e" font-weight="bold">int* p = &amp;x;</text>

    <text x="50" y="155" fill="#888">栈内存布局：</text>

    <rect x="60" y="170" width="100" height="40" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
    <text x="110" y="186" text-anchor="middle" font-size="9" fill="#444">变量 x</text>
    <text x="110" y="202" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">值: 10</text>
    <text x="170" y="194" font-size="8" fill="#888">地址: 0x7ffc...a0</text>

    <rect x="60" y="230" width="100" height="40" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
    <text x="110" y="246" text-anchor="middle" font-size="9" fill="#444">指针 p</text>
    <text x="110" y="262" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">值: 0x7ffc...a0</text>
    <text x="170" y="254" font-size="8" fill="#888">地址: 0x7ffc...b8</text>

    <path d="M 160 250 Q 200 240 170 195" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="210" y="230" font-size="8" fill="#b85450">p 存储 x 的地址</text>

    <text x="50" y="300" fill="#b85450" font-weight="bold">特征：</text>
    <text x="50" y="318" fill="#888">- 有独立内存空间（sizeof = 8）</text>
    <text x="50" y="336" fill="#888">- 可以为 nullptr</text>
    <text x="50" y="354" fill="#888">- 可以重新指向其他对象</text>
    <text x="50" y="372" fill="#888">- 需要解引用 *p 访问值</text>
    <text x="50" y="390" fill="#888">- 有多级指针 int** pp</text>

    <text x="50" y="420" fill="#2b6e9e" font-weight="bold">sizeof(int*) = 8（64位系统）</text>
    <text x="50" y="440" fill="#2b6e9e" font-weight="bold">sizeof(p)  = 8（指针本身的大小）</text>
  </g>

  <!-- Right: Reference -->
  <g filter="url(#sk)"><rect x="470" y="60" width="400" height="420" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="670" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">引用（Reference）</text>

  <g font-size="10" fill="#444">
    <text x="490" y="110" fill="#2e6e2e" font-weight="bold">int x = 10;</text>
    <text x="490" y="126" fill="#2e6e2e" font-weight="bold">int&amp; r = x;</text>

    <text x="490" y="155" fill="#888">栈内存布局：</text>

    <rect x="500" y="170" width="100" height="40" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/>
    <text x="550" y="186" text-anchor="middle" font-size="9" fill="#444">变量 x</text>
    <text x="550" y="202" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">值: 10</text>
    <text x="610" y="194" font-size="8" fill="#888">地址: 0x7ffc...a0</text>

    <text x="500" y="240" fill="#888" font-style="italic">r 不占独立内存空间</text>
    <text x="500" y="258" fill="#888" font-style="italic">r 就是 x 的别名</text>

    <rect x="500" y="275" width="200" height="30" rx="4" fill="#f0faf0" stroke="#4a8e4a" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="600" y="294" text-anchor="middle" font-size="9" fill="#2e6e2e">r 和 x 共享同一块内存 0x7ffc...a0</text>

    <text x="490" y="330" fill="#b85450" font-weight="bold">特征：</text>
    <text x="490" y="348" fill="#888">- 无独立内存空间（是别名）</text>
    <text x="490" y="366" fill="#888">- 不能为 nullptr</text>
    <text x="490" y="384" fill="#888">- 必须在定义时初始化</text>
    <text x="490" y="402" fill="#888">- 初始化后不能更改绑定</text>
    <text x="490" y="420" fill="#888">- 没有多级引用</text>

    <text x="490" y="450" fill="#2e6e2e" font-weight="bold">sizeof(int&amp;) = 4（被优化为原对象大小）</text>
    <text x="490" y="468" fill="#2e6e2e" font-weight="bold">sizeof(r)  = 4（就是 sizeof(x)）</text>
  </g>
</svg>
