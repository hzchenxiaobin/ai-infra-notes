<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="350" fill="#fdfcf7"/>
  <text x="350" y="28" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">K2 Agentic 数据合成管线（五阶段）</text>
  <g filter="url(#sk)"><rect x="39.0" y="55" width="110" height="80" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="94.0" y="73" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">Stage 1</text>
  <text x="94.0" y="89" text-anchor="middle" font-size="10" fill="#333">任务采集</text>
  <text x="94.0" y="107" text-anchor="middle" font-size="8" fill="#666">真实: GitHub issues</text>
  <text x="94.0" y="120" text-anchor="middle" font-size="8" fill="#666">合成: LLM 生成变体</text>
  <path d="M 149.0 95.0 L 167.0 95.0" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="167.0" y="55" width="110" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="222.0" y="73" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">Stage 2</text>
  <text x="222.0" y="89" text-anchor="middle" font-size="10" fill="#333">环境构建</text>
  <text x="222.0" y="107" text-anchor="middle" font-size="8" fill="#666">Docker 容器 + 测试</text>
  <text x="222.0" y="120" text-anchor="middle" font-size="8" fill="#666">模拟 API + 状态机</text>
  <path d="M 277.0 95.0 L 295.0 95.0" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="295.0" y="55" width="110" height="80" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="350.0" y="73" text-anchor="middle" font-size="10" fill="#c98a2b" font-weight="bold">Stage 3</text>
  <text x="350.0" y="89" text-anchor="middle" font-size="10" fill="#333">轨迹生成</text>
  <text x="350.0" y="107" text-anchor="middle" font-size="8" fill="#666">模型在环境中尝试</text>
  <text x="350.0" y="120" text-anchor="middle" font-size="8" fill="#666">记录完整轨迹</text>
  <path d="M 405.0 95.0 L 423.0 95.0" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="423.0" y="55" width="110" height="80" rx="6" fill="#f0e8fa" stroke="#8a4adb" stroke-width="2"/></g>
  <text x="478.0" y="73" text-anchor="middle" font-size="10" fill="#8a4adb" font-weight="bold">Stage 4</text>
  <text x="478.0" y="89" text-anchor="middle" font-size="10" fill="#333">拒绝采样</text>
  <text x="478.0" y="107" text-anchor="middle" font-size="8" fill="#666">跑测试/检查目标</text>
  <text x="478.0" y="120" text-anchor="middle" font-size="8" fill="#666">只留成功轨迹</text>
  <path d="M 533.0 95.0 L 551.0 95.0" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="551.0" y="55" width="110" height="80" rx="6" fill="#fae8e8" stroke="#b85450" stroke-width="2"/></g>
  <text x="606.0" y="73" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Stage 5</text>
  <text x="606.0" y="89" text-anchor="middle" font-size="10" fill="#333">SFT + RL</text>
  <text x="606.0" y="107" text-anchor="middle" font-size="8" fill="#666">SFT 微调基座</text>
  <text x="606.0" y="120" text-anchor="middle" font-size="8" fill="#666">GRPO 环境交互 RL</text>
  <text x="350" y="165" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">质量保证链</text>
  <g filter="url(#sk)"><rect x="120" y="175" width="100" height="28" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.0"/></g>
  <text x="170" y="193" text-anchor="middle" font-size="9" fill="#666">可验证性检查</text>
  <path d="M 220 189 L 240 189" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="240" y="175" width="100" height="28" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.0"/></g>
  <text x="290" y="193" text-anchor="middle" font-size="9" fill="#666">难度过滤</text>
  <path d="M 340 189 L 360 189" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="360" y="175" width="100" height="28" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.0"/></g>
  <text x="410" y="193" text-anchor="middle" font-size="9" fill="#666">多样性保证</text>
  <path d="M 460 189 L 480 189" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="480" y="175" width="100" height="28" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.0"/></g>
  <text x="530" y="193" text-anchor="middle" font-size="9" fill="#666">人工抽检</text>
  <text x="350" y="230" text-anchor="middle" font-size="10" fill="#b85450">核心：任务结果必须能自动验证（测试套件/目标状态）</text>
  <text x="350" y="250" text-anchor="middle" font-size="9" fill="#666">→ 和 Day 2 的 RLVR 同一逻辑：可验证 → 二元奖励 → 无法 hack</text>
  <text x="350" y="280" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">产出：~600K 推理 + ~200K 非推理 = ~800K 高质量轨迹</text>
</svg>
