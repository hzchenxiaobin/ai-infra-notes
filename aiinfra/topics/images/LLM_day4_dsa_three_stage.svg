<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="820" height="200" fill="#fdfcf7"/>
  <text x="410" y="28" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">DSA 三阶段：Compress → Select → Fine Attention</text>
  <g filter="url(#sk)"><rect x="20" y="60" width="100" height="50" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="70" y="80" text-anchor="middle" font-size="9" fill="#666">完整 KV cache</text>
  <text x="70" y="94" text-anchor="middle" font-size="9" fill="#666">n 个潜向量</text>
  <text x="70" y="106" text-anchor="middle" font-size="9" fill="#666">(576 维)</text>
  <path d="M 120 85 L 140 85" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="140" y="55" width="180" height="60" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="230" y="75" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">Stage 1: Compress</text>
  <text x="230" y="92" text-anchor="middle" font-size="9" fill="#333">n/c 个块 → 可学习 Conv1d</text>
  <text x="230" y="106" text-anchor="middle" font-size="9" fill="#333">每块压成 1 个摘要向量</text>
  <path d="M 320 85 L 340 85" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="340" y="55" width="180" height="60" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="430" y="75" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">Stage 2: Select</text>
  <text x="430" y="92" text-anchor="middle" font-size="9" fill="#333">query × 压缩 KV 打分</text>
  <text x="430" y="106" text-anchor="middle" font-size="9" fill="#333">Top-N 块（N=64）</text>
  <path d="M 520 85 L 540 85" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="540" y="55" width="180" height="60" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="630" y="75" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">Stage 3: Fine Attn</text>
  <text x="630" y="92" text-anchor="middle" font-size="9" fill="#333">gather 选中块的原始 KV</text>
  <text x="630" y="106" text-anchor="middle" font-size="9" fill="#333">标准 MLA 注意力</text>
  <path d="M 720 85 L 740 85" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="740" y="60" width="60" height="50" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="770" y="80" text-anchor="middle" font-size="9" fill="#666">输出</text>
  <text x="770" y="94" text-anchor="middle" font-size="9" fill="#2e6e2e">O(n·k·d)</text>
  <text x="410" y="175" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1M token: Full Attention 2.56×10¹⁴ → DSA 5.05×10¹²（省 98%）</text>
</svg>
