<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Guides × Sensors 矩阵</text>
  <path d="M 250 40 Q 380 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Axis labels -->
  <text x="200" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">计算性（确定性, CPU）</text>
  <text x="560" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">推理性（语义, LLM）</text>

  <!-- Row labels -->
  <text x="50" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" transform="rotate(-90 50 160)">引导器 / 前馈</text>
  <text x="50" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" transform="rotate(-90 50 310)">传感器 / 反馈</text>

  <!-- Quadrant 1: Guides + Computational -->
  <g filter="url(#sk)">
    <rect x="90" y="100" width="300" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="240" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">计算性前馈</text>
  <text x="240" y="144" text-anchor="middle" font-size="10" fill="#555">行动前引导 · 确定性</text>
  <g font-size="10" fill="#444">
    <text x="110" y="168">bootstrap 脚本</text>
    <text x="110" y="184">LSP / 类型检查</text>
    <text x="110" y="200">ruff / eslint</text>
    <text x="110" y="212" fill="#888" font-size="9">Day 3 实践</text>
  </g>

  <!-- Quadrant 2: Guides + Reasoning -->
  <g filter="url(#sk)">
    <rect x="410" y="100" width="300" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2" stroke-dasharray="6 3"/>
  </g>
  <text x="560" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">推理性前馈</text>
  <text x="560" y="144" text-anchor="middle" font-size="10" fill="#555">行动前引导 · 概率性</text>
  <g font-size="10" fill="#444">
    <text x="430" y="168">AGENTS.md</text>
    <text x="430" y="184">Skills（知识包）</text>
    <text x="430" y="200">architecture.md</text>
    <text x="430" y="212" fill="#888" font-size="9">Day 2 实践</text>
  </g>

  <!-- Quadrant 3: Sensors + Computational -->
  <g filter="url(#sk)">
    <rect x="90" y="250" width="300" height="120" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="240" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">计算性反馈</text>
  <text x="240" y="294" text-anchor="middle" font-size="10" fill="#555">行动后验证 · 确定性</text>
  <g font-size="10" fill="#444">
    <text x="110" y="318">linter / 结构测试</text>
    <text x="110" y="334">覆盖率检查</text>
    <text x="110" y="350">单元测试</text>
    <text x="110" y="362" fill="#888" font-size="9">Day 3-4 实践（check.sh）</text>
  </g>

  <!-- Quadrant 4: Sensors + Reasoning -->
  <g filter="url(#sk)">
    <rect x="410" y="250" width="300" height="120" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" stroke-dasharray="6 3"/>
  </g>
  <text x="560" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">推理性反馈</text>
  <text x="560" y="294" text-anchor="middle" font-size="10" fill="#555">行动后验证 · 概率性</text>
  <g font-size="10" fill="#444">
    <text x="430" y="318">AI code review</text>
    <text x="430" y="334">LLM-as-judge</text>
    <text x="430" y="350">行为正确性验证</text>
    <text x="430" y="362" fill="#888" font-size="9">Day 6 实践（对比实验）</text>
  </g>

  <!-- Bottom: key insight -->
  <g filter="url(#sk)">
    <rect x="90" y="390" width="620" height="40" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-dasharray="5 3"/>
  </g>
  <text x="400" y="408" text-anchor="middle" font-size="10" fill="#7a5415">前馈（引导器）+ 反馈（传感器）= 闭环　|　能用计算性就不用推理性　|　单独用任一维度都不行</text>
  <text x="400" y="424" text-anchor="middle" font-size="9" fill="#888">只有反馈 = 反复犯错　|　只有前馈 = 不知道是否生效</text>
</svg>
