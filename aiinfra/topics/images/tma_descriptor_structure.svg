<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="820" height="420" fill="#fdfcf7"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">TMA Descriptor 内部结构（128 字节）</text>
  <path d="M 290 40 Q 410 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="60" width="700" height="330" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4"/>
  </g>  <g filter="url(#sk)"><rect x="76" y="76" width="668" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="86" y="92" font-size="11" fill="#444" font-weight="normal" font-family="monospace">base GMEM address (8 bytes)</text>  <g filter="url(#sk)"><rect x="76" y="104" width="668" height="24" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1"/></g>
  <text x="86" y="120" font-size="11" fill="#444" font-weight="normal" font-family="monospace">global dimensions [2×8 bytes for 2D]</text>  <g filter="url(#sk)"><rect x="76" y="132" width="668" height="24" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1"/></g>
  <text x="86" y="148" font-size="11" fill="#444" font-weight="normal" font-family="monospace">global strides [(rank-1)×8 bytes]</text>  <g filter="url(#sk)"><rect x="76" y="160" width="668" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/></g>
  <text x="86" y="176" font-size="11" fill="#444" font-weight="normal" font-family="monospace">box dimensions [2×4 bytes for 2D]</text>  <g filter="url(#sk)"><rect x="76" y="188" width="668" height="24" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1"/></g>
  <text x="86" y="204" font-size="11" fill="#444" font-weight="normal" font-family="monospace">element strides [2×4 bytes]</text>  <g filter="url(#sk)"><rect x="76" y="216" width="668" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <text x="86" y="232" font-size="11" fill="#444" font-weight="normal" font-family="monospace">data type (2 bytes)</text>  <g filter="url(#sk)"><rect x="76" y="244" width="668" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <text x="86" y="260" font-size="11" fill="#444" font-weight="normal" font-family="monospace">swizzle mode (2 bytes)</text>  <g filter="url(#sk)"><rect x="76" y="272" width="668" height="24" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1"/></g>
  <text x="86" y="288" font-size="11" fill="#444" font-weight="normal" font-family="monospace">interleave mode (2 bytes)</text>  <g filter="url(#sk)"><rect x="76" y="300" width="668" height="24" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1"/></g>
  <text x="86" y="316" font-size="11" fill="#444" font-weight="normal" font-family="monospace">L2 promotion mode (2 bytes)</text>  <g filter="url(#sk)"><rect x="76" y="328" width="668" height="24" rx="4" fill="#fdecec" stroke="#b03a3a" stroke-width="1"/></g>
  <text x="86" y="344" font-size="11" fill="#444" font-weight="normal" font-family="monospace">OOB fill mode (2 bytes)</text>  <g filter="url(#sk)"><rect x="76" y="356" width="668" height="24" rx="4" fill="#fffdf3" stroke="#d4d4d4" stroke-width="1"/></g>
  <text x="86" y="372" font-size="11" fill="#444" font-weight="normal" font-family="monospace">... (padding)</text>  <text x="560" y="92" font-size="10" fill="#888" font-weight="normal">← 张量总形状</text>  <text x="560" y="148" font-size="10" fill="#888" font-weight="normal">← tile 大小</text>  <text x="560" y="204" font-size="10" fill="#888" font-weight="normal">← half/float/bf16/...</text>  <text x="560" y="232" font-size="10" fill="#888" font-weight="normal">← 128B/64B/32B/NONE</text>  <text x="560" y="316" font-size="10" fill="#888" font-weight="normal">← 越界行为</text></svg>