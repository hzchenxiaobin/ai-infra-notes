<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">不变量 BK ≥ k：全局 top-k 元素每轮必存活</text>
  <text x="390" y="44" text-anchor="middle" font-size="11" fill="#888">全局第 rank-k 元素在任一 tile 内至多有 k-1 个比它大 → 必入 tile 的 top-BK</text>

  <!-- ===== Left: a tile with the rank-k element ===== -->
  <text x="40" y="76" font-size="12" fill="#446688" font-weight="bold">某个 tile（TILE=4096 元素，示意 8 个）</text>

  <!-- tile elements: 99 larger (show 3) + the rank-k element + smaller -->
  <g font-family="monospace" font-size="9" fill="#333">
    <rect x="40" y="88" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="60" y="103" text-anchor="middle">大₁</text>
    <rect x="82" y="88" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="102" y="103" text-anchor="middle">大₂</text>
    <text x="130" y="103" font-size="10" fill="#888">…</text>
    <text x="150" y="103" font-size="9" fill="#b85450">共 k-1=99 个比它大</text>
  </g>

  <!-- the rank-k element (highlighted) -->
  <rect x="40" y="116" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">全局第 rank-k 元素（待保护）</text>

  <g font-family="monospace" font-size="9" fill="#333">
    <rect x="40" y="148" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="60" y="163" text-anchor="middle">小₁</text>
    <rect x="82" y="148" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="102" y="163" text-anchor="middle">小₂</text>
    <text x="130" y="163" font-size="10" fill="#888">…</text>
    <text x="150" y="163" font-size="9" fill="#4a7a3a">其余都比它小</text>
  </g>

  <!-- arrow to top-BK -->
  <path d="M 250 130 L 300 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="124" text-anchor="middle" font-size="9" fill="#666">排序</text>

  <!-- top-BK result -->
  <text x="320" y="76" font-size="12" fill="#4a7a3a" font-weight="bold">tile 的 top-BK=128</text>
  <rect x="320" y="88" width="180" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="108" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">降序排列</text>
  <g font-family="monospace" font-size="9" fill="#333">
    <rect x="332" y="116" width="36" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="350" y="129" text-anchor="middle">大₁</text>
    <rect x="372" y="116" width="36" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="390" y="129" text-anchor="middle">大₂</text>
    <text x="416" y="129" font-size="9" fill="#888">…</text>
    <rect x="432" y="116" width="36" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="450" y="129" text-anchor="middle" fill="#446688" font-weight="bold">★</text>
    <text x="332" y="152" font-size="8" fill="#888">前 99 位是「大」元素</text>
    <text x="332" y="166" font-size="8" fill="#446688">第 100 位 = rank-k 元素 ✓ 存活</text>
  </g>

  <!-- ===== Right: the counting argument ===== -->
  <rect x="520" y="76" width="240" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="640" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">计数论证</text>
  <text x="534" y="118" font-size="9" fill="#555">全局第 rank-k 元素：</text>
  <text x="534" y="134" font-size="9" fill="#555">全数组中仅 k-1 个比它大</text>
  <text x="534" y="150" font-size="9" fill="#555">→ 任一 tile 内 ≤ k-1 个比它大</text>
  <text x="534" y="166" font-size="9" fill="#4a7a3a" font-weight="bold">→ 该 tile 的 top-BK 必含它（BK≥k）</text>

  <!-- ===== Bottom: reduction tree with counts ===== -->
  <text x="40" y="206" font-size="12" fill="#444" font-weight="bold">归约树（N=50M, k=100, TILE=4096, BK=128，归约比 32×）</text>

  <!-- level 0 -->
  <rect x="40" y="220" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="240" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">50,000,000</text>
  <text x="172" y="240" font-size="9" fill="#888">Pass1: 12,207 blocks × 128 →</text>

  <!-- level 1 -->
  <rect x="330" y="220" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1,562,496</text>
  <text x="462" y="240" font-size="9" fill="#888">Pass2: 382 × 128 →</text>

  <!-- level 2 -->
  <rect x="620" y="220" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="680" y="240" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">48,896</text>

  <!-- arrows down between levels -->
  <path d="M 680 252 L 680 268" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 252 L 390 268" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 252 L 100 268" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- level 3 (continue) -->
  <rect x="40" y="272" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="292" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1,536</text>
  <text x="172" y="292" font-size="9" fill="#888">Final: 1 block 排 1,536 → top-128</text>

  <rect x="430" y="272" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">top-k = 100</text>
  <path d="M 250 287 L 426 287" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="281" text-anchor="middle" font-size="9" fill="#b85450">取前 k 个</text>

  <!-- ===== Bottom: key formula ===== -->
  <rect x="40" y="330" width="700" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="354" font-size="12" fill="#444" font-weight="bold">正确性证明（归纳）</text>
  <text x="56" y="374" font-size="10" fill="#555">基态：输入含全部全局 top-k 元素（平凡成立）</text>
  <text x="56" y="392" font-size="10" fill="#555">归纳：设第 i 轮输入含全部 top-k；第 i+1 轮每 tile 的 top-BK 必含该 tile 内所有 top-k 元素</text>
  <text x="56" y="408" font-size="10" fill="#555">         （因为 tile 内至多 k-1 个比 rank-k 大，rank-k ∈ top-BK，rank-1..k-1 同理）</text>
  <text x="56" y="426" font-size="10" fill="#b85450" font-weight="bold">结论：每轮 top-k 元素全部存活，最终 top-128 ⊇ top-100，取前 k 即为答案</text>
  <text x="56" y="440" font-size="9" fill="#888">⚠ 若 BK &lt; k，rank-k 元素可能被 tile 内 k-1 个大元素挤出 top-BK → 漏选，结果错误</text>
</svg>
