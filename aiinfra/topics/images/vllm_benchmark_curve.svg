<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">并发扫描曲线：找到饱和点（示意）</text>

  <!-- 坐标轴 -->
  <path d="M 80 340 L 720 340" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 80 340 L 80 60" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="#444">并发请求数</text>
  <text x="46" y="200" font-size="11" fill="#444" transform="rotate(-90 46 200)">归一化数值</text>

  <!-- 吞吐曲线：先升后平 -->
  <path d="M 80 330 C 200 220 300 160 420 140 C 520 128 620 124 700 122" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <text x="590" y="110" font-size="11" font-weight="bold" fill="#356130">吞吐（tok/s）</text>

  <!-- TPOT 曲线：缓升后陡升 -->
  <path d="M 80 320 C 240 316 380 300 480 260 C 560 228 640 170 700 110" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <text x="620" y="200" font-size="11" font-weight="bold" fill="#8d3f3b">TPOT</text>

  <!-- 饱和点 -->
  <path d="M 430 340 L 430 130" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="350" y="66" width="170" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="435" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">饱和点</text>
  <text x="435" y="103" text-anchor="middle" font-size="9.5" fill="#7a5415">吞吐平台 + TPOT 拐点</text>

  <!-- 三段注解 -->
  <g font-size="10" fill="#666">
    <text x="130" y="300">① 线性区：GPU 吃不饱</text>
    <text x="130" y="316" fill="#888">加并发 ≈ 白捡吞吐</text>
    <text x="470" y="300">② 饱和区：带宽/KV 池打满</text>
    <text x="470" y="316" fill="#888">加并发只加排队</text>
  </g>

  <!-- SLO 线 -->
  <path d="M 80 250 L 700 250" stroke="#4a8edb" stroke-width="1.5" stroke-dasharray="8,4" filter="url(#sk)"/>
  <text x="120" y="242" font-size="10" fill="#2b6e9e">TPOT 的 SLO 上限</text>
  <text x="540" y="268" font-size="10" fill="#2b6e9e">与 SLO 线的交点 = 最大可用并发（goodput）</text>
</svg>
