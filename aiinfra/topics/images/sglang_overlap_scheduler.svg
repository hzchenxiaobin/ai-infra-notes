<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">零开销调度器：CPU 调度与 GPU 计算"错峰并行"</text>

  <!-- 上：串行 -->
  <g filter="url(#sk)"><rect x="30" y="52" width="700" height="148" rx="10" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/></g>
  <text x="380" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">朴素实现：调度一步、算一步，串行等待</text>

  <!-- CPU row -->
  <text x="60" y="103" font-size="10" fill="#666">CPU</text>
  <g filter="url(#sk)">
    <rect x="100" y="88" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="230" y="88" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="360" y="88" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="490" y="88" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="140" y="104" text-anchor="middle" font-size="8.5" fill="#7a5415">组 batch 1</text>
  <text x="270" y="104" text-anchor="middle" font-size="8.5" fill="#7a5415">组 batch 2</text>
  <text x="400" y="104" text-anchor="middle" font-size="8.5" fill="#7a5415">组 batch 3</text>
  <text x="530" y="104" text-anchor="middle" font-size="8.5" fill="#7a5415">组 batch 4</text>

  <!-- GPU row -->
  <text x="60" y="163" font-size="10" fill="#666">GPU</text>
  <g filter="url(#sk)">
    <rect x="185" y="148" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="315" y="148" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="445" y="148" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="575" y="148" width="40" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="205" y="164" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 1</text>
  <text x="335" y="164" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 2</text>
  <text x="465" y="164" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 3</text>
  <text x="595" y="164" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 4</text>

  <!-- GPU 空等区 -->
  <g filter="url(#sk)">
    <rect x="100" y="148" width="80" height="24" rx="4" fill="#f7f7f7" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="230" y="148" width="80" height="24" rx="4" fill="#f7f7f7" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="360" y="148" width="80" height="24" rx="4" fill="#f7f7f7" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="490" y="148" width="80" height="24" rx="4" fill="#f7f7f7" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <text x="380" y="188" text-anchor="middle" font-size="10" fill="#8d3f3b">GPU 等 CPU 组批：每步都空转一段——batch 越小（每步越短）空转占比越大</text>

  <!-- 下：overlap -->
  <g filter="url(#sk)"><rect x="30" y="218" width="700" height="148" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="380" y="242" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#356130">Overlap：GPU 算第 n 步时，CPU 同时准备第 n+1 步</text>

  <!-- CPU row -->
  <text x="60" y="269" font-size="10" fill="#4a7a3a">CPU</text>
  <g filter="url(#sk)">
    <rect x="100" y="254" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="185" y="254" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="270" y="254" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="355" y="254" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="440" y="254" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="222" y="270" text-anchor="middle" font-size="8.5" fill="#7a5415">组 batch n</text>
  <text x="307" y="270" text-anchor="middle" font-size="8.5" fill="#7a5415">组 n+1</text>
  <text x="392" y="270" text-anchor="middle" font-size="8.5" fill="#7a5415">组 n+2</text>
  <text x="477" y="270" text-anchor="middle" font-size="8.5" fill="#7a5415">组 n+3</text>

  <!-- GPU row -->
  <text x="60" y="329" font-size="10" fill="#4a7a3a">GPU</text>
  <g filter="url(#sk)">
    <rect x="185" y="314" width="80" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="270" y="314" width="80" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="355" y="314" width="80" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="440" y="314" width="80" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="525" y="314" width="80" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="225" y="330" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 n</text>
  <text x="310" y="330" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 n+1</text>
  <text x="395" y="330" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 n+2</text>
  <text x="480" y="330" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 n+3</text>
  <text x="565" y="330" text-anchor="middle" font-size="8.5" fill="#2b6e9e">算 n+4</text>

  <!-- 对角虚线示意对应关系 -->
  <path d="M 185 278 L 225 314" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3" filter="url(#sk)"/>
  <path d="M 270 278 L 310 314" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3" filter="url(#sk)"/>

  <text x="380" y="354" text-anchor="middle" font-size="10" fill="#356130">GPU 连续满转：调度时间藏进了计算的"影子"里</text>

  <!-- 底部 -->
  <path d="M 60 378 L 700 378" stroke="#d6a040" stroke-width="1" stroke-dasharray="5,5" filter="url(#sk)"/>
  <text x="380" y="395" text-anchor="middle" font-size="10.5" fill="#7a5415">高并发下调度开销趋近于零——SGLang 对小 batch 低延迟场景优势最明显</text>
</svg>
