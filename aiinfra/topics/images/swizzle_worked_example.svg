<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">单个地址的位运算演算：逻辑块 (i=5, j=6) → 物理槽位 3</text>
  <path d="M 260 41 Q 480 49 700 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="40" y="76" font-size="11" font-weight="bold" fill="#2b6e9e">① 逻辑偏移 = 5×128 + 6×16 = 736</text>
  <g filter="url(#sk)">
    <rect x="60" y="88" width="46" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="108" y="88" width="46" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="156" y="88" width="46" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="204" y="88" width="46" height="34" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="252" y="88" width="46" height="34" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="300" y="88" width="46" height="34" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="348" y="88" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="396" y="88" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="444" y="88" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="492" y="88" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
  </g>
  <g font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">
    <text x="83" y="110" fill="#2b6e9e">1</text>
    <text x="131" y="110" fill="#2b6e9e">0</text>
    <text x="179" y="110" fill="#2b6e9e">1</text>
    <text x="227" y="110" fill="#7a5415">1</text>
    <text x="275" y="110" fill="#7a5415">1</text>
    <text x="323" y="110" fill="#7a5415">0</text>
    <text x="371" y="110" fill="#999">0</text>
    <text x="419" y="110" fill="#999">0</text>
    <text x="467" y="110" fill="#999">0</text>
    <text x="515" y="110" fill="#999">0</text>
  </g>
  <g font-size="8" fill="#aaa" font-family="monospace" text-anchor="middle">
    <text x="83" y="134">9</text>
    <text x="131" y="134">8</text>
    <text x="179" y="134">7</text>
    <text x="227" y="134">6</text>
    <text x="275" y="134">5</text>
    <text x="323" y="134">4</text>
    <text x="371" y="134">3</text>
    <text x="419" y="134">2</text>
    <text x="467" y="134">1</text>
    <text x="515" y="134">0</text>
  </g>
  <text x="131" y="154" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b6e9e">行号 = 101₂ = 5</text>
  <text x="275" y="154" text-anchor="middle" font-size="9" font-weight="bold" fill="#7a5415">块号 = 110₂ = 6</text>
  <text x="443" y="154" text-anchor="middle" font-size="8.5" fill="#999">块内偏移 = 0</text>
  <text x="560" y="110" font-size="11" font-weight="bold" font-family="monospace" fill="#444">= 736</text>

  <text x="40" y="190" font-size="11" font-weight="bold" fill="#444">② swizzle：行号右移 3 位，异或进块号</text>
  <g filter="url(#sk)">
    <rect x="140" y="202" width="40" height="32" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="182" y="202" width="40" height="32" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="224" y="202" width="40" height="32" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="316" y="202" width="40" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="358" y="202" width="40" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="400" y="202" width="40" height="32" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="476" y="202" width="40" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="518" y="202" width="40" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="560" y="202" width="40" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">
    <text x="160" y="223" fill="#7a5415">1</text>
    <text x="202" y="223" fill="#7a5415">1</text>
    <text x="244" y="223" fill="#7a5415">0</text>
    <text x="336" y="223" fill="#2b6e9e">1</text>
    <text x="378" y="223" fill="#2b6e9e">0</text>
    <text x="420" y="223" fill="#2b6e9e">1</text>
    <text x="496" y="223" fill="#2e6e2e">0</text>
    <text x="538" y="223" fill="#2e6e2e">1</text>
    <text x="580" y="223" fill="#2e6e2e">1</text>
  </g>
  <text x="286" y="224" text-anchor="middle" font-size="16" font-weight="bold" fill="#444">⊕</text>
  <text x="452" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">=</text>
  <text x="202" y="252" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#7a5415">110₂ = 6（块号 j）</text>
  <text x="378" y="252" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2b6e9e">101₂ = 5（行号 i）</text>
  <text x="538" y="252" text-anchor="middle" font-size="8.5" font-weight="bold" font-family="monospace" fill="#2e6e2e">011₂ = 3（新块号）</text>

  <text x="40" y="288" font-size="11" font-weight="bold" fill="#2e6e2e">③ 物理偏移 = 5×128 + 3×16 = 688</text>
  <g filter="url(#sk)">
    <rect x="60" y="300" width="46" height="34" rx="3" fill="#f4f8fc" stroke="#9db8d6" stroke-width="1"/>
    <rect x="108" y="300" width="46" height="34" rx="3" fill="#f4f8fc" stroke="#9db8d6" stroke-width="1"/>
    <rect x="156" y="300" width="46" height="34" rx="3" fill="#f4f8fc" stroke="#9db8d6" stroke-width="1"/>
    <rect x="204" y="300" width="46" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="252" y="300" width="46" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="300" y="300" width="46" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="348" y="300" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="396" y="300" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="444" y="300" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="492" y="300" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
  </g>
  <g font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">
    <text x="83" y="322" fill="#2b6e9e">1</text>
    <text x="131" y="322" fill="#2b6e9e">0</text>
    <text x="179" y="322" fill="#2b6e9e">1</text>
    <text x="227" y="322" fill="#2e6e2e">0</text>
    <text x="275" y="322" fill="#2e6e2e">1</text>
    <text x="323" y="322" fill="#2e6e2e">1</text>
    <text x="371" y="322" fill="#999">0</text>
    <text x="419" y="322" fill="#999">0</text>
    <text x="467" y="322" fill="#999">0</text>
    <text x="515" y="322" fill="#999">0</text>
  </g>
  <text x="560" y="322" font-size="11" font-weight="bold" font-family="monospace" fill="#444">= 688</text>
  <text x="60" y="356" font-size="9.5" fill="#2e6e2e">数据仍在第 5 行，只是从槽位 6 挪到槽位 3（6 ⊕ 5 = 3）——块内 16B 连续性不受影响</text>

  <text x="40" y="392" font-size="11" font-weight="bold" fill="#444">④ 落位：第 5 行的 8 个物理槽位（格内数字 = 存放的逻辑块号）</text>
  <path d="M 568 424 C 568 402, 370 402, 370 422" stroke="#7a5415" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="469" y="408" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7a5415">逻辑块 6 → 存槽位 3</text>
  <g filter="url(#sk)">
    <rect x="140" y="430" width="64" height="40" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="206" y="430" width="64" height="40" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="272" y="430" width="64" height="40" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="338" y="430" width="64" height="40" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="404" y="430" width="64" height="40" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="470" y="430" width="64" height="40" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="536" y="430" width="64" height="40" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="602" y="430" width="64" height="40" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
  </g>
  <g font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle" fill="#999">
    <text x="172" y="456">5</text>
    <text x="238" y="456">4</text>
    <text x="304" y="456">7</text>
    <text x="436" y="456">1</text>
    <text x="502" y="456">0</text>
    <text x="568" y="456">3</text>
    <text x="634" y="456">2</text>
  </g>
  <text x="370" y="457" text-anchor="middle" font-size="14" font-weight="bold" font-family="monospace" fill="#7a5415">6</text>
  <g font-size="8.5" fill="#999" font-family="monospace" text-anchor="middle">
    <text x="172" y="484">0</text>
    <text x="238" y="484">1</text>
    <text x="304" y="484">2</text>
    <text x="370" y="484" font-weight="bold" fill="#7a5415">3</text>
    <text x="436" y="484">4</text>
    <text x="502" y="484">5</text>
    <text x="568" y="484">6</text>
    <text x="634" y="484">7</text>
  </g>
  <text x="130" y="484" text-anchor="end" font-size="8.5" fill="#999">槽位</text>

  <text x="40" y="520" font-size="10" fill="#2b6e9e">⑤ 读回来：688 再过同一公式 → 011 ⊕ 101 = 110 → 736。XOR 双射，逆运算 = 再算一遍</text>

  <g filter="url(#sk)">
    <rect x="30" y="545" width="900" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="50" y="568" font-size="10.5" font-weight="bold" fill="#7a5415">为什么两边都必须过 XOR：</text>
  <text x="50" y="586" font-size="9.5" fill="#444">swizzle 是布局约定不是数据搬运：写侧排一次、读侧按同一公式找地址。任何一侧漏掉，就会读到别的逻辑块——手写 swizzle 最常见的 bug。</text>
</svg>
