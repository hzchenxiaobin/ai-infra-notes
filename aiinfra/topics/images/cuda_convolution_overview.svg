<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="480" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">2D Convolution：shared memory halo + 常数内存 kernel</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#888">VALID padding（无填充），输出 (ir-kr+1)×(ic-kc+1)；halo 区域避免重复读 global</text>

  <!-- input tile + halo -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">input (ir×ic) + halo</text>
  <g font-size="9" fill="#333">
    <!-- halo top -->
    <rect x="60" y="82" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)" opacity="0.5"/>
    <text x="160" y="96" text-anchor="middle" font-size="8" fill="#b85450">halo top (kr//2)</text>
    <!-- main tile -->
    <rect x="60" y="102" width="200" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="160" y="152" text-anchor="middle" font-size="10" fill="#446688">output tile (BT×BT)</text>
    <!-- halo bottom -->
    <rect x="60" y="202" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)" opacity="0.5"/>
    <text x="160" y="216" text-anchor="middle" font-size="8" fill="#b85450">halo bottom</text>
    <!-- halo left/right -->
    <rect x="40" y="82" width="20" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)" opacity="0.5"/>
    <rect x="260" y="82" width="20" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)" opacity="0.5"/>
    <text x="50" y="156" text-anchor="middle" font-size="7" fill="#b85450" transform="rotate(-90 50 156)">halo</text>
  </g>

  <!-- shared memory -->
  <path d="M 280 152 L 340 152" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="345" y="100" width="140" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">shared mem</text>
  <text x="415" y="136" text-anchor="middle" font-size="9" fill="#555">tile + halo</text>
  <text x="415" y="152" text-anchor="middle" font-size="9" fill="#555">(BT+kr-1)²</text>
  <text x="415" y="168" text-anchor="middle" font-size="9" fill="#555">全 block 复用</text>
  <text x="415" y="184" text-anchor="middle" font-size="8" fill="#888">kernel 在 __constant__</text>

  <!-- output -->
  <path d="M 485 152 L 540 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="76" font-size="12" fill="#4a7a3a" font-weight="bold">output</text>
  <g font-size="9" fill="#333">
    <rect x="545" y="102" width="100" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="595" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a">BT×BT tile</text>
  </g>

  <!-- conv formula -->
  <line x1="20" y1="232" x2="660" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="256" font-size="12" fill="#444" font-weight="bold">卷积公式（cross-correlation，无翻转）</text>
  <rect x="30" y="266" width="610" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="288" text-anchor="middle" font-size="11" fill="#444">out[i][j] = Σ Σ input[i+m][j+n] · kernel[m][n]</text>

  <!-- variants -->
  <text x="30" y="324" font-size="12" fill="#444" font-weight="bold">变体</text>
  <g font-size="10" fill="#333">
    <rect x="30" y="334" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="120" y="352" text-anchor="middle" fill="#446688">1D: 沿 1 维滑窗</text>
    <rect x="220" y="334" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="310" y="352" text-anchor="middle" fill="#446688">3D: 体数据 halo</text>
    <rect x="410" y="334" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="520" y="352" text-anchor="middle" fill="#4a7a3a">Gaussian Blur: SAME padding</text>
  </g>

  <!-- pooling -->
  <line x1="20" y1="380" x2="660" y2="380" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="390" width="610" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="335" y="410" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Max Pooling：滑窗取 max（reduction），padding 填 -inf</text>
  <text x="335" y="426" text-anchor="middle" font-size="10" fill="#888">out[i][j] = max over kernel window；与 conv 共享 tiling 模式，但累加变 max</text>

  <text x="30" y="462" font-size="9" fill="#888">关键：halo 让边界元素只读 1 次 global（非朴素版的 kr² 次重复）；kernel 存 __constant__ 全广播</text>
</svg>
