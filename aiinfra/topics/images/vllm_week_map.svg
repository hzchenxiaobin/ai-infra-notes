<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="430" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">vLLM 一周知识地图</text>

  <!-- 中心 -->
  <g filter="url(#sk)"><rect x="310" y="180" width="160" height="64" rx="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="390" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">vLLM 引擎</text>
  <text x="390" y="226" text-anchor="middle" font-size="10" fill="#444">高吞吐 LLM serving</text>

  <!-- Day 1 左下 -->
  <g filter="url(#sk)"><rect x="40" y="300" width="200" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="140" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">Day 1 快速上手与全景</text>
  <text x="140" y="342" text-anchor="middle" font-size="9.5" fill="#444">两种模式 / Engine Args / 六层图</text>

  <!-- Day 2 左 -->
  <g filter="url(#sk)"><rect x="30" y="160" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="130" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">Day 2 PagedAttention</text>
  <text x="130" y="202" text-anchor="middle" font-size="9.5" fill="#444">分页 / block table / CoW · 空间</text>

  <!-- Day 3 左上 -->
  <g filter="url(#sk)"><rect x="80" y="60" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="180" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">Day 3 Continuous Batching</text>
  <text x="180" y="102" text-anchor="middle" font-size="9.5" fill="#444">三队列 / 配额 / 抢占 · 时间</text>

  <!-- Day 4 右上 -->
  <g filter="url(#sk)"><rect x="500" y="60" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="600" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#356130">Day 4 源码走读</text>
  <text x="600" y="102" text-anchor="middle" font-size="9.5" fill="#444">step 三段式 / slot_mapping / V0·V1</text>

  <!-- Day 5 右 -->
  <g filter="url(#sk)"><rect x="550" y="160" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="650" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#356130">Day 5 优化特性</text>
  <text x="650" y="202" text-anchor="middle" font-size="9.5" fill="#444">Chunked / Prefix / Graph / 量化</text>

  <!-- Day 6 右下 -->
  <g filter="url(#sk)"><rect x="540" y="300" width="200" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="640" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#8d3f3b">Day 6 分布式与解码</text>
  <text x="640" y="342" text-anchor="middle" font-size="9.5" fill="#444">TP·PP / Spec / Structured / LoRA</text>

  <!-- Day 7 下中 -->
  <g filter="url(#sk)"><rect x="290" y="330" width="200" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="390" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#8d3f3b">Day 7 部署与压测</text>
  <text x="390" y="372" text-anchor="middle" font-size="9.5" fill="#444">benchmark / 饱和点 / 复盘</text>

  <!-- 连线 -->
  <g stroke="#aaaaaa" stroke-width="1.4" filter="url(#sk)">
    <path d="M 310 210 L 230 190" fill="none"/>
    <path d="M 330 186 L 275 110" fill="none"/>
    <path d="M 450 186 L 505 110" fill="none"/>
    <path d="M 470 210 L 550 190" fill="none"/>
    <path d="M 330 244 L 235 305" fill="none"/>
    <path d="M 450 244 L 545 305" fill="none"/>
    <path d="M 390 244 L 390 326" fill="none"/>
  </g>

  <!-- 主线标注 -->
  <text x="390" y="416" text-anchor="middle" font-size="10.5" fill="#888">主线：会用（D1）→ 懂原理（D2·D3）→ 读源码（D4）→ 调优（D5·D6）→ 上线（D7）</text>
</svg>
