<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">背压门控执行顺序（速度递减，重要性递增）</text>
  <path d="M 220 40 Q 340 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="70" width="560" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>  <text x="80" y="98" font-size="13" fill="#4a8e4a" font-weight="bold">1. lint</text>  <text x="260" y="98" font-size="11" fill="#888" font-weight="normal" font-family="monospace">&lt; 1s</text>  <text x="380" y="98" font-size="11" fill="#444" font-weight="normal">语法/风格</text>  <text x="520" y="98" font-size="10" fill="#4a8e4a" font-weight="normal">最快，快速失败</text>  <path d="M 340 114 L 340 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="130" width="560" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>  <text x="80" y="158" font-size="13" fill="#4a8edb" font-weight="bold">2. 类型检查</text>  <text x="260" y="158" font-size="11" fill="#888" font-weight="normal" font-family="monospace">&lt; 3s</text>  <text x="380" y="158" font-size="11" fill="#444" font-weight="normal">类型契约</text>  <path d="M 340 174 L 340 190" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="190" width="560" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>  <text x="80" y="218" font-size="13" fill="#4a8edb" font-weight="bold">3. 结构测试</text>  <text x="260" y="218" font-size="11" fill="#888" font-weight="normal" font-family="monospace">&lt; 2s</text>  <text x="380" y="218" font-size="11" fill="#444" font-weight="normal">架构规则</text>  <path d="M 340 234 L 340 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="250" width="560" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>  <text x="80" y="278" font-size="13" fill="#c98a2b" font-weight="bold">4. 单元测试</text>  <text x="260" y="278" font-size="11" fill="#888" font-weight="normal" font-family="monospace">&lt; 5s</text>  <text x="380" y="278" font-size="11" fill="#444" font-weight="normal">功能正确性</text>  <text x="520" y="278" font-size="10" fill="#c98a2b" font-weight="normal">最重要</text>  <path d="M 340 294 L 340 310" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="310" width="560" height="44" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>  <text x="80" y="338" font-size="13" fill="#b03a3a" font-weight="bold">5. 自定义检查</text>  <text x="260" y="338" font-size="11" fill="#888" font-weight="normal" font-family="monospace">&lt; 2s</text>  <text x="380" y="338" font-size="11" fill="#444" font-weight="normal">项目特有</text>  <text x="80" y="390" font-size="11" fill="#666" font-weight="bold">原则：快速失败 —— lint 不通过则后面的检查无意义</text></svg>