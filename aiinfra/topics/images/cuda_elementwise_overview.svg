<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Elementwise Kernel：grid-stride loop + coalesced 读写</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#888">每 thread 处理多个元素，warp 内地址连续 → 合并访存；memory-bound</text>

  <!-- input arrays -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">A[N], B[N]  (连续 float)</text>
  <g font-size="9" fill="#333">
    <rect x="40" y="84" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="56" y="99" text-anchor="middle">a₀</text>
    <rect x="72" y="84" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="88" y="99" text-anchor="middle">a₁</text>
    <text x="115" y="99" font-size="9" fill="#888">...</text>
    <rect x="130" y="84" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="146" y="99" text-anchor="middle">aₙ</text>

    <rect x="40" y="110" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="56" y="125" text-anchor="middle">b₀</text>
    <rect x="72" y="110" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="88" y="125" text-anchor="middle">b₁</text>
    <text x="115" y="125" font-size="9" fill="#888">...</text>
    <rect x="130" y="110" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="146" y="125" text-anchor="middle">bₙ</text>
  </g>

  <!-- grid-stride -->
  <path d="M 80 136 L 80 156" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="92" width="280" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="112" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">grid-stride loop</text>
  <text x="320" y="128" text-anchor="middle" font-size="9" fill="#555">i = blockIdx.x*blockDim.x + threadIdx.x</text>
  <text x="320" y="140" text-anchor="middle" font-size="9" fill="#555">for (i; i &lt; N; i += gridDim.x*blockDim.x)</text>

  <!-- output -->
  <path d="M 320 144 L 320 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="186" font-size="12" fill="#b85450" font-weight="bold">C[N] = f(A, B)</text>
  <g font-size="9" fill="#333">
    <rect x="40" y="192" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="56" y="207" text-anchor="middle">c₀</text>
    <rect x="72" y="192" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="88" y="207" text-anchor="middle">c₁</text>
    <text x="115" y="207" font-size="9" fill="#888">...</text>
    <rect x="130" y="192" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="146" y="207" text-anchor="middle">cₙ</text>
  </g>
  <text x="200" y="207" font-size="9" fill="#4a7a3a" font-weight="bold">← coalesced 写回</text>

  <!-- f variants -->
  <line x1="20" y1="232" x2="660" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="256" font-size="12" fill="#444" font-weight="bold">f(x) 变体（激活函数 family）</text>
  <g font-size="10" fill="#333">
    <rect x="30" y="266" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="100" y="282" text-anchor="middle" fill="#446688" font-weight="bold">ReLU: max(0,x)</text>
    <rect x="180" y="266" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="250" y="282" text-anchor="middle" fill="#446688" font-weight="bold">LeakyReLU: 0.01x</text>
    <rect x="330" y="266" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="400" y="282" text-anchor="middle" fill="#446688" font-weight="bold">Sigmoid: 1/(1+e⁻ˣ)</text>
    <rect x="480" y="266" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="560" y="282" text-anchor="middle" fill="#446688" font-weight="bold">SiLU: x·σ(x)</text>

    <rect x="30" y="296" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="130" y="312" text-anchor="middle" fill="#d6a040" font-weight="bold">SwiGLU: (x1·σ(x1))·x2</text>
    <rect x="240" y="296" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="312" text-anchor="middle" fill="#d6a040" font-weight="bold">GeGLU: x1·GELU(x2)</text>
    <rect x="450" y="296" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="550" y="312" text-anchor="middle" fill="#b85450" font-weight="bold">GELU(tanh 近似)</text>
  </g>

  <!-- summary -->
  <rect x="30" y="338" width="610" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="335" y="358" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">访存：读 2N + 写 N = 3N×4B（二元），或 读 N + 写 N = 2N×4B（一元）</text>
  <text x="335" y="374" text-anchor="middle" font-size="10" fill="#888">算术强度 ≈ 1 FLOP/8B → memory-bound；优化：float4 向量化、fused kernel、__expf 快速数学</text>
  <text x="30" y="402" font-size="9" fill="#888">grid-stride 优势：支持 N &gt; grid×block，自动负载均衡，warp 内地址连续</text>
</svg>
