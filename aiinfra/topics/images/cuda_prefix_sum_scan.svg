<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="560" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Prefix Sum：三阶段分块扫描（warp scan → block scan → global）</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#888">inclusive scan：output[i] = Σ_{j≤i} input[j]；大 N 需跨 block 传递前缀</text>

  <!-- ===== input ===== -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">input[N]</text>
  <g font-size="10" fill="#333">
    <rect x="40" y="84" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="58" y="100" text-anchor="middle">3</text>
    <rect x="76" y="84" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="94" y="100" text-anchor="middle">1</text>
    <rect x="112" y="84" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="130" y="100" text-anchor="middle">4</text>
    <rect x="148" y="84" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="166" y="100" text-anchor="middle">2</text>
    <text x="200" y="100" font-size="10" fill="#888">...</text>
    <rect x="220" y="84" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="238" y="100" text-anchor="middle">5</text>
  </g>

  <!-- ===== Stage 1: warp scan ===== -->
  <path d="M 130 112 L 130 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="128" font-size="12" fill="#b85450" font-weight="bold">① warp scan：__shfl_up_sync 折半累加（Hillis-Steele）</text>
  <g font-size="9" fill="#b85450">
    <rect x="40" y="138" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="58" y="152" text-anchor="middle">3</text>
    <rect x="76" y="138" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="94" y="152" text-anchor="middle">4</text>
    <rect x="112" y="138" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="130" y="152" text-anchor="middle">8</text>
    <rect x="148" y="138" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="166" y="152" text-anchor="middle">10</text>
    <text x="200" y="152" font-size="9" fill="#888">offset 1→2→4→...→16</text>
  </g>
  <text x="290" y="152" font-size="9" fill="#555">lane 内 inclusive scan，log₂32=5 步</text>

  <!-- ===== Stage 2: block scan ===== -->
  <path d="M 130 162 L 130 182" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="178" font-size="12" fill="#d6a040" font-weight="bold">② block scan：warp 间汇总 + 加偏移</text>
  <g font-size="9" fill="#333">
    <rect x="40" y="188" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="58" y="202" text-anchor="middle">3</text>
    <rect x="76" y="188" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="94" y="202" text-anchor="middle">4</text>
    <rect x="112" y="188" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="130" y="202" text-anchor="middle">8</text>
    <rect x="148" y="188" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="166" y="202" text-anchor="middle">10</text>
  </g>
  <text x="200" y="202" font-size="9" fill="#555">warp 0 总和 → warp 1 加偏移</text>

  <!-- ===== Stage 3: global ===== -->
  <path d="M 130 212 L 130 232" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="228" font-size="12" fill="#4a7a3a" font-weight="bold">③ 跨 block：block 总和落盘 → 下 block 加前缀</text>

  <g font-size="9" fill="#333">
    <rect x="40" y="240" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="58" y="254" text-anchor="middle">3</text>
    <rect x="76" y="240" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="94" y="254" text-anchor="middle">4</text>
    <rect x="112" y="240" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="130" y="254" text-anchor="middle">8</text>
    <rect x="148" y="240" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="166" y="254" text-anchor="middle">10</text>
    <text x="200" y="254" font-size="9" fill="#555">+ prev_block_sum</text>
  </g>

  <!-- ===== output ===== -->
  <path d="M 130 264 L 130 284" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="280" font-size="12" fill="#446688" font-weight="bold">output[N] = inclusive prefix sum</text>
  <g font-size="10" fill="#333">
    <rect x="40" y="288" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="58" y="304" text-anchor="middle">3</text>
    <rect x="76" y="288" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="94" y="304" text-anchor="middle">4</text>
    <rect x="112" y="288" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="130" y="304" text-anchor="middle">8</text>
    <rect x="148" y="288" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="166" y="304" text-anchor="middle">10</text>
  </g>

  <!-- ===== warp scan detail ===== -->
  <line x1="20" y1="330" x2="660" y2="330" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="354" font-size="12" fill="#444" font-weight="bold">warp scan 逐步（input=[3,1,4,2], inclusive）</text>

  <g font-size="9" fill="#333">
    <rect x="40" y="364" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="65" y="378" text-anchor="middle">lane0</text>
    <rect x="92" y="364" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="117" y="378" text-anchor="middle">lane1</text>
    <rect x="144" y="364" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="169" y="378" text-anchor="middle">lane2</text>
    <rect x="196" y="364" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="221" y="378" text-anchor="middle">lane3</text>

    <text x="270" y="378" font-size="9" fill="#888">offset=1: v += shfl_up(v,1)</text>
    <rect x="430" y="364" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="455" y="378" text-anchor="middle">3</text>
    <rect x="482" y="364" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="507" y="378" text-anchor="middle">4</text>
    <rect x="534" y="364" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="559" y="378" text-anchor="middle">5</text>
    <rect x="586" y="364" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="611" y="378" text-anchor="middle">6</text>

    <text x="270" y="402" font-size="9" fill="#888">offset=2: v += shfl_up(v,2)</text>
    <rect x="430" y="388" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="455" y="402" text-anchor="middle">3</text>
    <rect x="482" y="388" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="507" y="402" text-anchor="middle">4</text>
    <rect x="534" y="388" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="559" y="402" text-anchor="middle">8</text>
    <rect x="586" y="388" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="611" y="402" text-anchor="middle">10</text>
  </g>

  <!-- ===== summary ===== -->
  <rect x="30" y="424" width="610" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="335" y="444" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">访存：input 读 1 遍 + output 写 1 遍 = 2N × 4B，memory-bound</text>
  <text x="335" y="460" text-anchor="middle" font-size="10" fill="#888">warp scan log₂32=5 步；block scan log₂8=3 步；跨 block 用第二 kernel 或 atomic</text>

  <text x="30" y="500" font-size="10" fill="#888">inclusive（含当前元素）vs exclusive（不含）；本题 inclusive</text>
  <text x="30" y="516" font-size="10" fill="#888">大 N 需跨 block 传递前缀总和——典型用两阶段（block scan + 全局 scan）</text>
</svg>
