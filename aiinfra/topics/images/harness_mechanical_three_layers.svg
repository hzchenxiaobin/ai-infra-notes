<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fdfcf7"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">机械化执行三层</text>
  <path d="M 250 40 Q 390 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Layer 1: Universal Linter -->
  <g filter="url(#sk)">
    <rect x="60" y="60" width="660" height="80" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="80" y="86" font-size="14" font-weight="bold" fill="#2b6e9e">第 1 层：通用 Linter</text>
  <text x="80" y="104" font-size="10" fill="#555">工具：ruff / eslint / golangci-lint</text>
  <text x="80" y="120" font-size="10" fill="#555">检查：语法、风格、常见 bug 模式</text>
  <text x="580" y="90" font-size="11" font-weight="bold" fill="#2e6e2e">极快 &lt; 1s</text>
  <text x="580" y="108" font-size="9" fill="#888">语言通用规则</text>
  <text x="580" y="122" font-size="9" fill="#888">不需要自己写</text>

  <path d="M 390 142 L 390 158" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Layer 2: Custom Checks -->
  <g filter="url(#sk)">
    <rect x="60" y="160" width="660" height="80" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="80" y="186" font-size="14" font-weight="bold" fill="#7a5415">第 2 层：自定义结构检查</text>
  <text x="80" y="204" font-size="10" fill="#555">工具：scripts/custom_checks.py</text>
  <text x="80" y="220" font-size="10" fill="#555">检查：项目特有约束（AGENTS.md ≤ 60 行、函数 ≤ 50 行、导航链接有效）</text>
  <text x="580" y="190" font-size="11" font-weight="bold" fill="#c98a2b">快 &lt; 2s</text>
  <text x="580" y="208" font-size="9" fill="#888">项目级规则</text>
  <text x="580" y="222" font-size="9" fill="#888">错误信息可控</text>

  <path d="M 390 242 L 390 258" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Layer 3: Structure Tests -->
  <g filter="url(#sk)">
    <rect x="60" y="260" width="660" height="80" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="80" y="286" font-size="14" font-weight="bold" fill="#2e6e2e">第 3 层：结构测试</text>
  <text x="80" y="304" font-size="10" fill="#555">工具：tests/test_structure.py（pytest）</text>
  <text x="80" y="320" font-size="10" fill="#555">检查：架构规则、依赖方向、分层约束（GR-1 ~ GR-4）</text>
  <text x="580" y="290" font-size="11" font-weight="bold" fill="#b85450">中 &lt; 5s</text>
  <text x="580" y="308" font-size="9" fill="#888">架构级不变量</text>
  <text x="580" y="322" font-size="9" fill="#888">CI 集成</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="358" width="660" height="32" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-dasharray="5 3"/>
  </g>
  <text x="390" y="378" text-anchor="middle" font-size="10" fill="#5a3a7a">三层互补：通用规则 → 项目规则 → 架构不变量　|　从快到慢，从广到深</text>
</svg>
