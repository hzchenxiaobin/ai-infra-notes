<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="280" fill="#fdfcf7"/>
  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">注意力架构演进：MHA → MLA → DSA</text>
  <g filter="url(#sk)"><rect x="80" y="50" width="440" height="56" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="90" y="68" text-anchor="start" font-size="11" fill="#4a8edb" font-weight="bold">Full Attention (MHA)</text>
  <text x="90" y="84" text-anchor="start" font-size="10" fill="#333">softmax(QK^T)V</text>
  <text x="300" y="70" text-anchor="middle" font-size="9" fill="#b85450">O(n²d) 计算</text>
  <text x="300" y="86" text-anchor="middle" font-size="9" fill="#2e6e2e">32768 维/token KV cache</text>
  <path d="M 300 106 L 300 125" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="120" text-anchor="middle" font-size="9" fill="#666">压缩 KV 表示</text>
  <g filter="url(#sk)"><rect x="80" y="125" width="440" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="90" y="143" text-anchor="start" font-size="11" fill="#4a8e4a" font-weight="bold">MLA（压缩 KV 表示）</text>
  <text x="90" y="159" text-anchor="start" font-size="10" fill="#333">softmax(Qc·Kc^T)Vc</text>
  <text x="300" y="145" text-anchor="middle" font-size="9" fill="#b85450">O(n²d) 计算（没省）</text>
  <text x="300" y="161" text-anchor="middle" font-size="9" fill="#2e6e2e">576 维/token（57× 压缩）</text>
  <path d="M 300 181 L 300 200" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="195" text-anchor="middle" font-size="9" fill="#666">稀疏化计算</text>
  <g filter="url(#sk)"><rect x="80" y="200" width="440" height="56" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="90" y="218" text-anchor="start" font-size="11" fill="#c98a2b" font-weight="bold">DSA（稀疏化计算）</text>
  <text x="90" y="234" text-anchor="start" font-size="10" fill="#333">Compress→Select→Fine</text>
  <text x="300" y="220" text-anchor="middle" font-size="9" fill="#b85450">O(n·k·d) 计算（省 98%）</text>
  <text x="300" y="236" text-anchor="middle" font-size="9" fill="#2e6e2e">576 维/token（同 MLA）</text>
  <text x="300" y="265" text-anchor="middle" font-size="10" fill="#2b2b2b" font-weight="bold">MLA 管存什么（显存） · DSA 管算哪些（计算） · 两者正交可叠加</text>
</svg>
