<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="780" height="560" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Bitonic 排序网络（降序，8 元素示例）</text>
  <text x="390" y="44" text-anchor="middle" font-size="11" fill="#888">[3,7,2,8,5,1,6,4] → [8,7,6,5,4,3,2,1]，蓝=降序块(keep 大在低位)，橙=升序块</text>

  <!-- ===== position labels (left) ===== -->
  <g font-family="monospace" font-size="9" fill="#888">
    <text x="22" y="84" text-anchor="middle">pos0</text>
    <text x="22" y="116" text-anchor="middle">pos1</text>
    <text x="22" y="148" text-anchor="middle">pos2</text>
    <text x="22" y="180" text-anchor="middle">pos3</text>
    <text x="22" y="212" text-anchor="middle">pos4</text>
    <text x="22" y="244" text-anchor="middle">pos5</text>
    <text x="22" y="276" text-anchor="middle">pos6</text>
    <text x="22" y="308" text-anchor="middle">pos7</text>
  </g>

  <!-- horizontal lanes -->
  <g stroke="#eee" stroke-width="1">
    <line x1="40" y1="80" x2="740" y2="80"/>
    <line x1="40" y1="112" x2="740" y2="112"/>
    <line x1="40" y1="144" x2="740" y2="144"/>
    <line x1="40" y1="176" x2="740" y2="176"/>
    <line x1="40" y1="208" x2="740" y2="208"/>
    <line x1="40" y1="240" x2="740" y2="240"/>
    <line x1="40" y1="272" x2="740" y2="272"/>
    <line x1="40" y1="304" x2="740" y2="304"/>
  </g>

  <!-- ===== Input column ===== -->
  <text x="70" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">输入</text>
  <g font-family="monospace" font-size="10" fill="#333">
    <rect x="56" y="70" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="84" text-anchor="middle">3</text>
    <rect x="56" y="102" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="116" text-anchor="middle">7</text>
    <rect x="56" y="134" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="148" text-anchor="middle">2</text>
    <rect x="56" y="166" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="180" text-anchor="middle">8</text>
    <rect x="56" y="198" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="212" text-anchor="middle">5</text>
    <rect x="56" y="230" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="244" text-anchor="middle">1</text>
    <rect x="56" y="262" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="276" text-anchor="middle">6</text>
    <rect x="56" y="294" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="308" text-anchor="middle">4</text>
  </g>

  <!-- ===== Stage k=2 (j=1): pairs (0,1)(2,3)(4,5)(6,7) ===== -->
  <text x="150" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=2, j=1</text>
  <!-- desc pairs (0,1)(4,5) blue, asc pairs (2,3)(6,7) orange -->
  <path d="M 120 80 L 120 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 120 144 L 120 176" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 120 208 L 120 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 120 272 L 120 304" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- state after k=2: [7,3,2,8,5,1,4,6] -->
  <text x="180" y="64" text-anchor="middle" font-size="9" fill="#888">after k=2</text>
  <g font-family="monospace" font-size="9" fill="#333">
    <rect x="166" y="70" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="180" y="84" text-anchor="middle">7</text>
    <rect x="166" y="102" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="180" y="116" text-anchor="middle">3</text>
    <rect x="166" y="134" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="180" y="148" text-anchor="middle">2</text>
    <rect x="166" y="166" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="180" y="180" text-anchor="middle">8</text>
    <rect x="166" y="198" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="180" y="212" text-anchor="middle">5</text>
    <rect x="166" y="230" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="180" y="244" text-anchor="middle">1</text>
    <rect x="166" y="262" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="180" y="276" text-anchor="middle">4</text>
    <rect x="166" y="294" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="180" y="308" text-anchor="middle">6</text>
  </g>

  <!-- ===== Stage k=4 (j=2): (0,2)(1,3)(4,6)(5,7) all desc (i&4==0 for 0,1; i&4!=0 for 4,5) -->
  <!-- pos0 i&4=0 desc, pos1 i&4=0 desc, pos4 i&4=4 asc, pos5 i&4=4 asc -->
  <text x="270" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=4, j=2</text>
  <path d="M 240 80 L 240 144" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 240 112 L 240 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 240 208 L 240 272" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 240 240 L 240 304" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Stage k=4 (j=1): (0,1)(2,3)(4,5)(6,7) ===== -->
  <text x="330" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=4, j=1</text>
  <!-- i&4: 0,1,2,3 → desc(blue); 4,5,6,7 → asc(orange) -->
  <path d="M 300 80 L 300 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 300 144 L 300 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 300 208 L 300 240" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 300 272 L 300 304" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- state after k=4: [8,7,3,2,1,4,5,6] bitonic -->
  <text x="360" y="64" text-anchor="middle" font-size="9" fill="#888">after k=4</text>
  <text x="360" y="48" text-anchor="middle" font-size="8" fill="#d6a040">（bitonic）</text>
  <g font-family="monospace" font-size="9" fill="#333">
    <rect x="346" y="70" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="360" y="84" text-anchor="middle">8</text>
    <rect x="346" y="102" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="360" y="116" text-anchor="middle">7</text>
    <rect x="346" y="134" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="360" y="148" text-anchor="middle">3</text>
    <rect x="346" y="166" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="360" y="180" text-anchor="middle">2</text>
    <rect x="346" y="198" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="360" y="212" text-anchor="middle">1</text>
    <rect x="346" y="230" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="360" y="244" text-anchor="middle">4</text>
    <rect x="346" y="262" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="360" y="276" text-anchor="middle">5</text>
    <rect x="346" y="294" width="28" height="20" fill="#fff" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="360" y="308" text-anchor="middle">6</text>
  </g>

  <!-- ===== Stage k=8 (j=4): (0,4)(1,5)(2,6)(3,7) all desc ===== -->
  <text x="450" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=8, j=4</text>
  <path d="M 420 80 L 420 208" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 420 112 L 420 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 420 144 L 420 272" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 420 176 L 420 304" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Stage k=8 (j=2): (0,2)(1,3)(4,6)(5,7) all desc ===== -->
  <text x="510" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=8, j=2</text>
  <path d="M 480 80 L 480 144" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 480 112 L 480 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 480 208 L 480 272" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 480 240 L 480 304" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Stage k=8 (j=1): (0,1)(2,3)(4,5)(6,7) all desc ===== -->
  <text x="570" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=8, j=1</text>
  <path d="M 540 80 L 540 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 540 144 L 540 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 540 208 L 540 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 540 272 L 540 304" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Output column: [8,7,6,5,4,3,2,1] ===== -->
  <text x="640" y="64" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">输出（降序）</text>
  <g font-family="monospace" font-size="10" fill="#333">
    <rect x="626" y="70" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="640" y="84" text-anchor="middle">8</text>
    <rect x="626" y="102" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="640" y="116" text-anchor="middle">7</text>
    <rect x="626" y="134" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="640" y="148" text-anchor="middle">6</text>
    <rect x="626" y="166" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="640" y="180" text-anchor="middle">5</text>
    <rect x="626" y="198" width="28" height="20" fill="#fff" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="640" y="212" text-anchor="middle">4</text>
    <rect x="626" y="230" width="28" height="20" fill="#fff" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="640" y="244" text-anchor="middle">3</text>
    <rect x="626" y="262" width="28" height="20" fill="#fff" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="640" y="276" text-anchor="middle">2</text>
    <rect x="626" y="294" width="28" height="20" fill="#fff" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="640" y="308" text-anchor="middle">1</text>
  </g>
  <!-- top-BK region bracket -->
  <path d="M 670 70 L 678 70 L 678 156 L 670 156" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="686" y="116" font-size="9" fill="#b85450" font-weight="bold">top-BK</text>
  <text x="686" y="130" font-size="8" fill="#888">= top-k</text>

  <!-- ===== Bottom: code + legend ===== -->
  <rect x="30" y="340" width="720" height="76" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="46" y="362" font-size="11" fill="#444" font-weight="bold">compare-swap 核心（每 substage 一句）</text>
  <text x="46" y="382" font-family="monospace" font-size="9" fill="#333">int partner = i ^ j;  if (partner > i) {</text>
  <text x="46" y="396" font-family="monospace" font-size="9" fill="#333">  bool desc = ((i &amp; k) == 0);  <tspan fill="#888">// k 的高半段决定升降方向</tspan></text>
  <text x="46" y="410" font-family="monospace" font-size="9" fill="#333">  if ((desc &amp;&amp; s[i] &lt; s[partner]) || (!desc &amp;&amp; s[i] &gt; s[partner])) swap(s[i], s[partner]);</text>

  <!-- legend -->
  <rect x="30" y="432" width="720" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="454" font-size="11" fill="#444" font-weight="bold">图例与规律</text>
  <rect x="46" y="464" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="66" y="473" font-size="9" fill="#446688">蓝箭头 = 降序块（(i&amp;k)==0，大值留在低位 i）</text>
  <rect x="320" y="464" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="340" y="473" font-size="9" fill="#d6a040">橙箭头 = 升序块（(i&amp;k)!=0，小值留在低位 i）</text>
  <text x="46" y="484" font-size="9" fill="#555">每个 stage k 先把数组切成 k 长度的交替升降块，下一 stage 合并成 2k 长度的块，最终全降序</text>
</svg>
