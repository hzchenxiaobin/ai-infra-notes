<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="820" height="410" fill="#fdfcf7"/>

  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">RNN 展开图：隐藏状态的链式传递（参数跨时间步共享）</text>
  <path d="M 250 38 Q 410 46 570 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 时间步标签 ===== -->
  <text x="205" y="62" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">t=1</text>
  <text x="365" y="62" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">t=2</text>
  <text x="525" y="62" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">t=3</text>
  <text x="725" y="62" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">t=n</text>

  <!-- ===== 输入 x_t ===== -->
  <g filter="url(#sk)"><rect x="170" y="72" width="70" height="34" rx="6" fill="#e6e1d3" stroke="#8a8471" stroke-width="1.4"/></g>
  <text x="205" y="94" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">x₁</text>
  <g filter="url(#sk)"><rect x="330" y="72" width="70" height="34" rx="6" fill="#e6e1d3" stroke="#8a8471" stroke-width="1.4"/></g>
  <text x="365" y="94" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">x₂</text>
  <g filter="url(#sk)"><rect x="490" y="72" width="70" height="34" rx="6" fill="#e6e1d3" stroke="#8a8471" stroke-width="1.4"/></g>
  <text x="525" y="94" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">x₃</text>
  <g filter="url(#sk)"><rect x="690" y="72" width="70" height="34" rx="6" fill="#e6e1d3" stroke="#8a8471" stroke-width="1.4"/></g>
  <text x="725" y="94" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">xₙ</text>

  <!-- arrows x_t -> W_x -->
  <path d="M 205 106 L 205 138" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 365 106 L 365 138" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 525 106 L 525 138" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 725 106 L 725 138" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== W_x boxes ===== -->
  <g filter="url(#sk)"><rect x="165" y="140" width="80" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="205" y="161" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">Wₓ·x₁</text>
  <g filter="url(#sk)"><rect x="325" y="140" width="80" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="365" y="161" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">Wₓ·x₂</text>
  <g filter="url(#sk)"><rect x="485" y="140" width="80" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="525" y="161" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">Wₓ·x₃</text>
  <g filter="url(#sk)"><rect x="685" y="140" width="80" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="725" y="161" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">Wₓ·xₙ</text>

  <!-- arrows W_x -> cell -->
  <path d="M 205 172 L 205 208" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 365 172 L 365 208" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 525 172 L 525 208" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 725 172 L 725 208" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== h_0 (初始隐藏状态) ===== -->
  <g filter="url(#sk)"><rect x="35" y="230" width="60" height="40" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="65" y="255" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">h₀</text>

  <!-- ===== W_h+h 循环单元 ===== -->
  <g filter="url(#sk)"><rect x="150" y="222" width="110" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="205" y="245" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Wₕ·h₀ + Wₓ·x₁</text>
  <text x="205" y="262" text-anchor="middle" font-size="10" fill="#2e6e2e">tanh( · )</text>

  <g filter="url(#sk)"><rect x="310" y="222" width="110" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="365" y="245" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Wₕ·h₁ + Wₓ·x₂</text>
  <text x="365" y="262" text-anchor="middle" font-size="10" fill="#2e6e2e">tanh( · )</text>

  <g filter="url(#sk)"><rect x="470" y="222" width="110" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="525" y="245" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Wₕ·h₂ + Wₓ·x₃</text>
  <text x="525" y="262" text-anchor="middle" font-size="10" fill="#2e6e2e">tanh( · )</text>

  <g filter="url(#sk)"><rect x="670" y="222" width="110" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="725" y="245" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Wₕ·hₙ₋₁ + Wₓ·xₙ</text>
  <text x="725" y="262" text-anchor="middle" font-size="10" fill="#2e6e2e">tanh( · )</text>

  <!-- ===== 水平链式箭头：h_0 → cell → cell → ... → cell ===== -->
  <path d="M 95 250 L 148 250" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 250 L 308 250" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 250 L 468 250" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 580 250 L 605 250" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="625" y="256" text-anchor="middle" font-size="22" fill="#888">···</text>
  <path d="M 645 250 L 668 250" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== cell → h_t 输出（向下） ===== -->
  <path d="M 205 278 L 205 306" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 365 278 L 365 306" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 525 278 L 525 306" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 725 278 L 725 306" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 输出 h_t ===== -->
  <g filter="url(#sk)"><rect x="170" y="308" width="70" height="34" rx="6" fill="#e6e1d3" stroke="#8a8471" stroke-width="1.4"/></g>
  <text x="205" y="330" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">h₁</text>
  <g filter="url(#sk)"><rect x="330" y="308" width="70" height="34" rx="6" fill="#e6e1d3" stroke="#8a8471" stroke-width="1.4"/></g>
  <text x="365" y="330" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">h₂</text>
  <g filter="url(#sk)"><rect x="490" y="308" width="70" height="34" rx="6" fill="#e6e1d3" stroke="#8a8471" stroke-width="1.4"/></g>
  <text x="525" y="330" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">h₃</text>
  <g filter="url(#sk)"><rect x="690" y="308" width="70" height="34" rx="6" fill="#c98a2b" opacity="0.30" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="725" y="330" text-anchor="middle" font-size="13" fill="#5c4a28" font-weight="bold">hₙ</text>

  <!-- ===== 底部关键提示 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="358" width="740" height="42" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="378" font-size="11" fill="#444">同一组 <tspan font-weight="bold" fill="#2e6e2e">Wₕ、Wₓ</tspan> 在所有时间步共享（参数共享）→ RNN 能处理变长序列；但 Wₕ 被连乘 n 次 → 梯度消失/爆炸的根源</text>
  <text x="60" y="394" font-size="10" fill="#888" font-style="italic">串行依赖：hₜ 必须等 hₜ₋₁ 算完 → 无法并行，训练慢</text>
</svg>
