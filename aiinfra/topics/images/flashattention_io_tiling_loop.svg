<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 512" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="1000" height="512" fill="#fdfcf7"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">FlashAttention 分块：K/V 列块驻留、Q/O 行块重流，S_ij 永不落盘</text>
  <path d="M 250 39 Q 500 47 750 39" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: loop structure ===== -->
  <text x="270" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">循环结构的 IO 语义（示意 T_c=3、T_r=4）</text>
  <text x="80" y="74" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2e6e2e">K/V 列块</text>
  <text x="168" y="74" text-anchor="middle" font-size="8.5" fill="#888888">i=1</text>
  <text x="260" y="74" text-anchor="middle" font-size="8.5" fill="#888888">i=2</text>
  <text x="352" y="74" text-anchor="middle" font-size="8.5" fill="#888888">i=3</text>
  <text x="444" y="74" text-anchor="middle" font-size="8.5" fill="#888888">i=4</text>

  <!-- green column blocks j=1..3 -->
  <g filter="url(#sk)"><rect x="48" y="80" width="64" height="90" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="80" y="98" text-anchor="middle" font-size="8" fill="#888888">j=1</text>
  <text x="80" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">K₁V₁</text>
  <text x="80" y="142" text-anchor="middle" font-size="7.5" fill="#2e6e2e">载入 1 次</text>
  <text x="80" y="158" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e6e2e">✓</text>
  <g filter="url(#sk)"><rect x="48" y="184" width="64" height="90" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="80" y="202" text-anchor="middle" font-size="8" fill="#888888">j=2</text>
  <text x="80" y="226" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">K₂V₂</text>
  <text x="80" y="246" text-anchor="middle" font-size="7.5" fill="#2e6e2e">载入 1 次</text>
  <text x="80" y="262" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e6e2e">✓</text>
  <g filter="url(#sk)"><rect x="48" y="288" width="64" height="90" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="80" y="306" text-anchor="middle" font-size="8" fill="#888888">j=3</text>
  <text x="80" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">K₃V₃</text>
  <text x="80" y="350" text-anchor="middle" font-size="7.5" fill="#2e6e2e">载入 1 次</text>
  <text x="80" y="366" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e6e2e">✓</text>

  <!-- grid cells: rows j=1..3, cols i=1..4 -->
  <g filter="url(#sk)">
    <rect x="128" y="80" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="128" y="128" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="220" y="80" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="220" y="128" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="312" y="80" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="312" y="128" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="404" y="80" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="404" y="128" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="128" y="184" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="128" y="232" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="220" y="184" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="220" y="232" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="312" y="184" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="312" y="232" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="404" y="184" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="404" y="232" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="128" y="288" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="128" y="336" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="220" y="288" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="220" y="336" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="312" y="288" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="312" y="336" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
    <rect x="404" y="288" width="80" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="404" y="336" width="80" height="42" rx="3" fill="#eef6fb" stroke="#7ab0dd" stroke-width="0.9"/>
  </g>
  <text x="168" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₁</text>
  <text x="168" y="154" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₁</text>
  <text x="260" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₂</text>
  <text x="260" y="154" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₂</text>
  <text x="352" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₃</text>
  <text x="352" y="154" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₃</text>
  <text x="444" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₄</text>
  <text x="444" y="154" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₄</text>
  <text x="168" y="209" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₁</text>
  <text x="168" y="258" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₁</text>
  <text x="260" y="209" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₂</text>
  <text x="260" y="258" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₂</text>
  <text x="352" y="209" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₃</text>
  <text x="352" y="258" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₃</text>
  <text x="444" y="209" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₄</text>
  <text x="444" y="258" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₄</text>
  <text x="168" y="313" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₁</text>
  <text x="168" y="362" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₁</text>
  <text x="260" y="313" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₂</text>
  <text x="260" y="362" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₂</text>
  <text x="352" y="313" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₃</text>
  <text x="352" y="362" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₃</text>
  <text x="444" y="313" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">Q₄</text>
  <text x="444" y="362" text-anchor="middle" font-size="9.5" fill="#2b6e9e">O₄</text>

  <text x="497" y="229" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" transform="rotate(-90 497 229)">每行 = Q₁..Q₄ + O₁..O₄ 全部重流 ≈ 3Nd</text>

  <text x="266" y="398" text-anchor="middle" font-size="9.5" fill="#2e6e2e">绿：K/V 列块各载入 1 次（B_c×d），全程只读一遍 → 合计 2Nd</text>
  <text x="266" y="414" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">蓝：每轮 j，全部 Qᵢ、Oᵢ 重新流过（读 Qᵢ + Oᵢ 一读一写 ≈ 3Nd）× T_c 遍</text>

  <!-- ===== Right: SRAM view ===== -->
  <text x="730" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">SRAM 内容与伪代码（论文 Algorithm 1）</text>
  <g filter="url(#sk)"><rect x="520" y="72" width="430" height="204" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="735" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">SRAM（M 元素 ≈ 100KB）</text>
  <text x="735" y="108" text-anchor="middle" font-size="8.5" fill="#888888">4 块平分预算：K_j、V_j、Q_i、O_i 各 ≤ M/4</text>
  <g filter="url(#sk)"><rect x="545" y="116" width="195" height="64" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="642" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">K_j</text>
  <text x="642" y="154" text-anchor="middle" font-size="8" fill="#666666">B_c × d 行块</text>
  <text x="642" y="170" text-anchor="middle" font-size="7.5" fill="#999999">B_c = ⌈M/4d⌉</text>
  <g filter="url(#sk)"><rect x="750" y="116" width="195" height="64" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="847" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">V_j</text>
  <text x="847" y="154" text-anchor="middle" font-size="8" fill="#666666">B_c × d 行块</text>
  <text x="847" y="170" text-anchor="middle" font-size="7.5" fill="#999999">与 K_j 同轮载入</text>
  <g filter="url(#sk)"><rect x="545" y="192" width="195" height="64" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="642" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">Q_i</text>
  <text x="642" y="230" text-anchor="middle" font-size="8" fill="#666666">B_r × d 行块</text>
  <text x="642" y="246" text-anchor="middle" font-size="7" fill="#999999">B_r = min(⌈M/4d⌉, d)</text>
  <g filter="url(#sk)"><rect x="750" y="192" width="195" height="64" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="847" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">O_i</text>
  <text x="847" y="230" text-anchor="middle" font-size="8" fill="#666666">B_r × d（片上累积）</text>
  <text x="847" y="246" text-anchor="middle" font-size="7" fill="#999999">带统计量 l_i、m_i</text>
  <text x="735" y="270" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">S_ij = Q_iK_jᵀ（B_r×B_c ≤ M/4）片上算完即弃，永不落盘！</text>

  <g filter="url(#sk)"><rect x="520" y="288" width="430" height="136" rx="6" fill="#ffffff" stroke="#b0b8c0" stroke-width="1.2"/></g>
  <text x="532" y="302" font-size="8.3" font-family="monospace" fill="#444444">for j = 1..T_c:              <tspan fill="#999999"># 外层：K/V 列块</tspan></text>
  <text x="532" y="315" font-size="8.3" font-family="monospace" fill="#444444">  load K_j, V_j              <tspan fill="#2e6e2e"># 一次性 2·B_c·d</tspan></text>
  <text x="532" y="328" font-size="8.3" font-family="monospace" fill="#444444">  for i = 1..T_r:            <tspan fill="#999999"># 内层：Q/O 行块</tspan></text>
  <text x="532" y="341" font-size="8.3" font-family="monospace" fill="#444444">    load Q_i, O_i, l_i, m_i  <tspan fill="#b85450" font-weight="bold"># 每轮 j 都重复！</tspan></text>
  <text x="532" y="354" font-size="8.3" font-family="monospace" fill="#444444">    S_ij = Q_i·K_jᵀ          <tspan fill="#999999"># 片上</tspan></text>
  <text x="532" y="367" font-size="8.3" font-family="monospace" fill="#444444">    P̃_ij = online_softmax(S_ij)  <tspan fill="#999999"># 片上，更新 m,l</tspan></text>
  <text x="532" y="380" font-size="8.3" font-family="monospace" fill="#444444">    O_i ← rescale(O_i) + P̃_ij·V_j</text>
  <text x="532" y="393" font-size="8.3" font-family="monospace" fill="#444444">    store O_i, l_i, m_i      <tspan fill="#999999"># 写回 HBM</tspan></text>
  <text x="532" y="406" font-size="8.3" font-family="monospace" fill="#444444">O ← diag(l)⁻¹·O              <tspan fill="#999999"># 最后统一归一化</tspan></text>

  <g filter="url(#sk)">
    <rect x="20" y="432" width="960" height="68" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="40" y="452" font-size="11" font-weight="bold" fill="#7a5415">为什么中间结果可以不落盘（online softmax，Milakov &amp; Gimelshein 2018）</text>
  <text x="40" y="470" font-size="9.5" fill="#444444">softmax 被增量式化：每行只维护 running max m 与归一化因子 l 两个 O(1) 统计量往返 HBM，不再需要 N 长的整行分数 —— 与三遍 softmax 数值等价（exact attention，非近似）</text>
  <text x="40" y="487" font-size="9.5" fill="#444444">代价只是 rescale/重计算的少量额外 FLOPs —— FLOPs 本来就不是瓶颈，用计算换带宽稳赚</text>
</svg>
