<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="540" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Batch Norm：一个 block 负责一个 channel，三遍扫描</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#888">input(N×C) 列主方向归约，mean/var 沿 N 维统计，gamma/beta 按通道缩放</text>

  <!-- ===== Input matrix (N x C) ===== -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">input[N, C]  (行主序，N 行 C 列)</text>
  <g font-size="9" fill="#333">
    <!-- column headers (channels) -->
    <text x="78"  y="92" text-anchor="middle" fill="#b85450" font-weight="bold">c=0</text>
    <text x="118" y="92" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c=1</text>
    <text x="158" y="92" text-anchor="middle" fill="#446688" font-weight="bold">c=2</text>
    <text x="208" y="92" text-anchor="middle" fill="#888">...</text>
    <text x="268" y="92" text-anchor="middle" fill="#d6a040" font-weight="bold">c=C-1</text>

    <!-- row n=0 -->
    <rect x="58"  y="98" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="78"  y="114" text-anchor="middle">1.0</text>
    <rect x="98"  y="98" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="118" y="114" text-anchor="middle">2.0</text>
    <rect x="138" y="98" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="158" y="114" text-anchor="middle">0.5</text>
    <text x="208" y="114" font-size="10" fill="#888">...</text>
    <rect x="248" y="98" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="114" text-anchor="middle">3.0</text>
    <text x="40" y="114" text-anchor="end" font-size="9" fill="#888">n=0</text>

    <!-- row n=1 -->
    <rect x="58"  y="124" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="78"  y="140" text-anchor="middle">3.0</text>
    <rect x="98"  y="124" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="118" y="140" text-anchor="middle">4.0</text>
    <rect x="138" y="124" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="158" y="140" text-anchor="middle">1.5</text>
    <text x="208" y="140" font-size="10" fill="#888">...</text>
    <rect x="248" y="124" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="140" text-anchor="middle">5.0</text>
    <text x="40" y="140" text-anchor="end" font-size="9" fill="#888">n=1</text>

    <!-- row dots -->
    <text x="78"  y="166" text-anchor="middle" font-size="10" fill="#888">...</text>
    <text x="118" y="166" text-anchor="middle" font-size="10" fill="#888">...</text>
    <text x="158" y="166" text-anchor="middle" font-size="10" fill="#888">...</text>
    <text x="268" y="166" text-anchor="middle" font-size="10" fill="#888">...</text>
    <text x="40" y="166" text-anchor="end" font-size="9" fill="#888">...</text>

    <!-- row n=N-1 -->
    <rect x="58"  y="174" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="78"  y="190" text-anchor="middle">5.0</text>
    <rect x="98"  y="174" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="118" y="190" text-anchor="middle">8.0</text>
    <rect x="138" y="174" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="158" y="190" text-anchor="middle">2.5</text>
    <text x="208" y="190" font-size="10" fill="#888">...</text>
    <rect x="248" y="174" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="268" y="190" text-anchor="middle">9.0</text>
    <text x="40" y="190" text-anchor="end" font-size="9" fill="#888">n=N-1</text>
  </g>

  <!-- arrows down per channel -->
  <path d="M 78 202 L 78 224" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 118 202 L 118 224" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 158 202 L 158 224" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 268 202 L 268 224" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== blocks (one per channel) ===== -->
  <text x="30" y="220" font-size="12" fill="#444" font-weight="bold">grid = C 个 block（每 channel 一个 block，沿 N 维归约）</text>
  <g font-size="9" fill="#333">
    <rect x="38" y="228" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="78" y="244" text-anchor="middle" font-weight="bold" fill="#b85450">block 0</text>
    <text x="78" y="258" text-anchor="middle" fill="#555">256 threads</text>

    <rect x="78" y="228" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)" opacity="0"/>
    <rect x="98" y="228" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="138" y="244" text-anchor="middle" font-weight="bold" fill="#4a7a3a">block 1</text>
    <text x="138" y="258" text-anchor="middle" fill="#555">256 threads</text>

    <rect x="158" y="228" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="198" y="244" text-anchor="middle" font-weight="bold" fill="#446688">block 2</text>
    <text x="198" y="258" text-anchor="middle" fill="#555">256 threads</text>

    <text x="248" y="252" font-size="11" fill="#888">...</text>

    <rect x="248" y="228" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="288" y="244" text-anchor="middle" font-weight="bold" fill="#d6a040">block C-1</text>
    <text x="288" y="258" text-anchor="middle" fill="#555">256 threads</text>
  </g>

  <!-- ===== per-channel stats ===== -->
  <path d="M 78 272 L 78 292" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="288" font-size="12" fill="#444" font-weight="bold">每 block 产出 mean[c] / var[c]（块归约，warp shuffle）</text>

  <g font-size="9" fill="#333">
    <rect x="38" y="296" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="78" y="311" text-anchor="middle">mean=3.0</text>
    <rect x="98" y="296" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="138" y="311" text-anchor="middle">mean=4.67</text>
    <rect x="158" y="296" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="198" y="311" text-anchor="middle">mean=1.5</text>
    <rect x="248" y="296" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="288" y="311" text-anchor="middle">mean=5.67</text>
  </g>

  <!-- ===== Three passes ===== -->
  <line x1="20" y1="334" x2="660" y2="334" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="356" font-size="12" fill="#444" font-weight="bold">三遍扫描（沿 N 维，每个 block 独立）：</text>

  <!-- Pass 1 -->
  <rect x="30" y="366" width="190" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="386" font-size="11" fill="#b85450" font-weight="bold">① Pass 1：求 mean</text>
  <text x="44" y="402" font-size="9" fill="#555">sum = Σ input[n,c]</text>
  <text x="44" y="416" font-size="9" fill="#555">mean = sum / N（block_reduce）</text>
  <text x="44" y="428" font-size="9" fill="#888">读 input 1 遍</text>

  <!-- Pass 2 -->
  <rect x="240" y="366" width="190" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="254" y="386" font-size="11" fill="#4a7a3a" font-weight="bold">② Pass 2：求 var</text>
  <text x="254" y="402" font-size="9" fill="#555">sq = Σ (x - mean)²</text>
  <text x="254" y="416" font-size="9" fill="#555">var = sq / N（biased）</text>
  <text x="254" y="428" font-size="9" fill="#888">再读 input 1 遍</text>

  <!-- Pass 3 -->
  <rect x="450" y="366" width="190" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="464" y="386" font-size="11" fill="#446688" font-weight="bold">③ Pass 3：归一化写回</text>
  <text x="464" y="402" font-size="9" fill="#555">y = γ·(x-mean)/√(var+ε) + β</text>
  <text x="464" y="416" font-size="9" fill="#555">逐元素，无需再归约</text>
  <text x="464" y="428" font-size="9" fill="#888">第 3 遍读 input + 写 output</text>

  <!-- ===== Summary ===== -->
  <rect x="30" y="448" width="610" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="335" y="468" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">访存：每 channel 读 input 3 遍（N×4B×3）+ 写 output 1 遍 → memory-bound</text>
  <text x="335" y="484" text-anchor="middle" font-size="10" fill="#888">γ/β/ε 常量级；优化：Welford 单遍融合 mean+var（3 遍读 → 2 遍）</text>

  <text x="30" y="516" font-size="10" fill="#888">注：训练用 batch 维统计（本题），推理用 running mean/var；LayerNorm/RMSNorm 沿 C 维归约，映射对偶</text>
</svg>
