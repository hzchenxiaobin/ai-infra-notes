<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="540" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两阶段归约 Reduction：block reduce → global reduce</text>
  <text x="330" y="44" text-anchor="middle" font-size="11" fill="#888">grid-stride 累加 + warp shuffle 块归约，多个 block 出 partial，最后一 block 汇总</text>

  <!-- ===== Input array ===== -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">input[N]  (float, N 个元素)</text>
  <g font-size="10" fill="#333">
    <rect x="40"  y="84" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="59"  y="101" text-anchor="middle">3.0</text>
    <rect x="78"  y="84" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="97"  y="101" text-anchor="middle">1.0</text>
    <rect x="116" y="84" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="135" y="101" text-anchor="middle">4.0</text>
    <rect x="154" y="84" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="173" y="101" text-anchor="middle">2.0</text>
    <text x="205" y="101" font-size="11" fill="#888">...</text>
    <rect x="230" y="84" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="249" y="101" text-anchor="middle">5.0</text>
    <rect x="268" y="84" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="287" y="101" text-anchor="middle">7.0</text>
    <text x="320" y="101" font-size="11" fill="#888">...</text>
    <rect x="346" y="84" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="365" y="101" text-anchor="middle">6.0</text>
    <rect x="384" y="84" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="403" y="101" text-anchor="middle">8.0</text>
  </g>
  <text x="470" y="100" font-size="10" fill="#888">global memory（只读 1 遍）</text>

  <!-- ===== Stage 1: block reduce (3 blocks shown) ===== -->
  <path d="M 180 116 L 180 138" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="134" font-size="12" fill="#b85450" font-weight="bold">① Stage 1：每个 block grid-stride 累加 + warp shuffle 块归约</text>

  <!-- Block 0 -->
  <g font-size="9" fill="#b85450">
    <rect x="30" y="146" width="170" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="40" y="162" font-size="10" fill="#b85450" font-weight="bold">block 0 (256 threads)</text>
    <rect x="40" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="51" y="182" text-anchor="middle">t0</text>
    <rect x="64" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="75" y="182" text-anchor="middle">t1</text>
    <text x="98" y="182" font-size="9" fill="#888">...</text>
    <rect x="118" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="129" y="182" text-anchor="middle">t255</text>
    <text x="40" y="200" font-size="9" fill="#555">grid-stride: i+=gridDim*256</text>
    <rect x="40" y="206" width="150" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="115" y="219" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">block_reduce_sum → 10.0</text>
  </g>

  <!-- Block 1 -->
  <g font-size="9" fill="#b85450">
    <rect x="220" y="146" width="170" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="230" y="162" font-size="10" fill="#b85450" font-weight="bold">block 1 (256 threads)</text>
    <rect x="240" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="251" y="182" text-anchor="middle">t0</text>
    <rect x="264" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="275" y="182" text-anchor="middle">t1</text>
    <text x="298" y="182" font-size="9" fill="#888">...</text>
    <rect x="318" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="329" y="182" text-anchor="middle">t255</text>
    <text x="230" y="200" font-size="9" fill="#555">grid-stride: i+=gridDim*256</text>
    <rect x="230" y="206" width="150" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="305" y="219" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">block_reduce_sum → 26.0</text>
  </g>

  <!-- Block k -->
  <g font-size="9" fill="#b85450">
    <rect x="410" y="146" width="170" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="420" y="162" font-size="10" fill="#b85450" font-weight="bold">block B (256 threads)</text>
    <rect x="420" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="431" y="182" text-anchor="middle">t0</text>
    <rect x="444" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="455" y="182" text-anchor="middle">t1</text>
    <text x="478" y="182" font-size="9" fill="#888">...</text>
    <rect x="498" y="170" width="22" height="16" fill="#fff" stroke="#b85450" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="509" y="182" text-anchor="middle">t255</text>
    <text x="420" y="200" font-size="9" fill="#555">grid-stride: i+=gridDim*256</text>
    <rect x="420" y="206" width="150" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="495" y="219" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">block_reduce_sum → 18.0</text>
  </g>

  <!-- ===== partial array ===== -->
  <path d="M 115 240 L 115 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 305 240 L 305 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 495 240 L 495 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="252" font-size="12" fill="#4a7a3a" font-weight="bold">partial[B]  (double, 每 block 一个部分和)</text>
  <g font-size="10" fill="#333">
    <rect x="100" y="260" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="125" y="277" text-anchor="middle">10.0</text>
    <rect x="290" y="260" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="315" y="277" text-anchor="middle">26.0</text>
    <text x="370" y="277" font-size="11" fill="#888">...</text>
    <rect x="470" y="260" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="495" y="277" text-anchor="middle">18.0</text>
  </g>
  <text x="540" y="277" font-size="10" fill="#888">global memory（中间结果）</text>

  <!-- ===== Stage 2: final reduce ===== -->
  <path d="M 305 290 L 305 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="308" font-size="12" fill="#446688" font-weight="bold">② Stage 2：单 block 归约 partial[] → output（float）</text>

  <g font-size="9" fill="#446688">
    <rect x="150" y="318" width="320" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="160" y="334" font-size="10" fill="#446688" font-weight="bold">block 0 (256 threads) — grid-stride 读 partial + block_reduce_sum</text>
    <rect x="170" y="344" width="26" height="16" fill="#fff" stroke="#446688" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="183" y="356" text-anchor="middle">t0</text>
    <rect x="200" y="344" width="26" height="16" fill="#fff" stroke="#446688" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="213" y="356" text-anchor="middle">t1</text>
    <text x="240" y="356" font-size="9" fill="#888">...</text>
    <rect x="270" y="344" width="26" height="16" fill="#fff" stroke="#446688" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
    <text x="283" y="356" text-anchor="middle">t255</text>
    <text x="310" y="356" font-size="9" fill="#555">累加 double，避免精度损失</text>
    <rect x="170" y="372" width="280" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.9" rx="3" filter="url(#rough2)"/>
    <text x="310" y="387" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">block_reduce_sum → total = 54.0</text>
  </g>

  <!-- ===== output ===== -->
  <path d="M 310 408 L 310 432" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#888">output[0] = (float)total</text>
  <rect x="280" y="458" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="480" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">54.0</text>

  <!-- ===== Summary ===== -->
  <line x1="20" y1="504" x2="640" y2="504" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="510" width="600" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="526" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">访存：input 读 1 遍（N×4B）+ partial 读写 1 遍 → memory-bound，AI ≈ 1 FLOP/8B</text>
</svg>
