<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Tensor Parallel：一层 Linear 怎么切到多卡（Megatron 风格）</text>

  <!-- 列并行 -->
  <g filter="url(#sk)"><rect x="40" y="60" width="330" height="140" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="205" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">第一层：列并行（Column Parallel）</text>
  <text x="205" y="104" text-anchor="middle" font-size="10" fill="#444">QKV proj、MLP 的 up/gate proj</text>
  <g filter="url(#sk)"><rect x="70" y="118" width="60" height="34" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="100" y="139" text-anchor="middle" font-size="10" fill="#2b6e9e">输入 X</text>
  <g filter="url(#sk)"><rect x="160" y="112" width="90" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="205" y="127" text-anchor="middle" font-size="9.5" fill="#356130">GPU0: W 左半</text>
  <g filter="url(#sk)"><rect x="160" y="140" width="90" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="205" y="155" text-anchor="middle" font-size="9.5" fill="#7a5415">GPU1: W 右半</text>
  <g filter="url(#sk)"><rect x="270" y="118" width="80" height="34" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="310" y="132" text-anchor="middle" font-size="9.5" fill="#444">输出按列</text>
  <text x="310" y="146" text-anchor="middle" font-size="9.5" fill="#444">各拿一半</text>
  <path d="M 130 135 L 155 128" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 137 L 266 137" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 行并行 -->
  <g filter="url(#sk)"><rect x="410" y="60" width="330" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="575" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#356130">第二层：行并行（Row Parallel）</text>
  <text x="575" y="104" text-anchor="middle" font-size="10" fill="#444">o_proj、MLP 的 down proj</text>
  <g filter="url(#sk)"><rect x="435" y="112" width="90" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="480" y="127" text-anchor="middle" font-size="9.5" fill="#356130">GPU0: 部分和</text>
  <g filter="url(#sk)"><rect x="435" y="140" width="90" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="480" y="155" text-anchor="middle" font-size="9.5" fill="#7a5415">GPU1: 部分和</text>
  <g filter="url(#sk)"><rect x="550" y="118" width="80" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="590" y="132" text-anchor="middle" font-size="9.5" fill="#8d3f3b">All-Reduce</text>
  <text x="590" y="146" text-anchor="middle" font-size="9.5" fill="#8d3f3b">求和同步</text>
  <g filter="url(#sk)"><rect x="650" y="118" width="70" height="34" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="685" y="139" text-anchor="middle" font-size="9.5" fill="#444">完整输出</text>
  <path d="M 525 137 L 545 137" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 630 135 L 646 135" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- attention 切分 -->
  <g filter="url(#sk)"><rect x="40" y="220" width="330" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="205" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">Attention：按 head 切</text>
  <text x="205" y="266" text-anchor="middle" font-size="10" fill="#444">32 头 ÷ 2 卡 = 每卡 16 头</text>
  <text x="205" y="286" text-anchor="middle" font-size="10" fill="#444">KV Cache 也随之切半（GQA 头数 &lt; TP 数时复制）</text>

  <!-- TP vs PP -->
  <g filter="url(#sk)"><rect x="410" y="220" width="330" height="80" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="575" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">TP vs PP 怎么选</text>
  <text x="575" y="266" text-anchor="middle" font-size="10" fill="#444">TP 每层两次 All-Reduce → 只在 NVLink 机内</text>
  <text x="575" y="286" text-anchor="middle" font-size="10" fill="#444">PP 按层切、通信少 → 跨机用 PP（或 TP×PP 组合）</text>

  <!-- 底部 -->
  <g filter="url(#sk)"><rect x="40" y="322" width="700" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="390" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#356130">效果：每卡权重 ÷ N、每卡 KV Cache ÷ N（head 切分）→ 装得下更大模型、更大并发</text>
  <text x="390" y="364" text-anchor="middle" font-size="10.5" fill="#356130">代价：每层两次 All-Reduce 通信 → N 越大通信占比越高，单机内一般 TP ≤ 8</text>
</svg>
