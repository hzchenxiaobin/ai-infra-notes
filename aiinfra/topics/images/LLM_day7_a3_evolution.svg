  <path d="M 50 340 L 930 340" stroke="#999" stroke-width="1.0" fill="none" filter="url(#sk)" stroke-dasharray="3,3"/>
  <text x="490" y="358" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">四条主线</text>
  <text x="70" y="370" text-anchor="start" font-size="10" fill="#4a8edb" font-weight="bold">① 架构</text>
  <text x="140" y="370" text-anchor="start" font-size="9" fill="#666">MoE(671B/37B) → MLA(57×) → DSA(98%省) → KDA+AttnRes</text>
