<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Prefix Caching：按块哈希跨请求复用前缀 KV</text>

  <!-- 请求 1 -->
  <g filter="url(#sk)"><rect x="40" y="60" width="200" height="110" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="140" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">请求 1（首次）</text>
  <text x="140" y="106" text-anchor="middle" font-size="10" fill="#444">system prompt + 问题 A</text>
  <text x="140" y="126" text-anchor="middle" font-size="10" fill="#444">prefill 全部计算</text>
  <text x="140" y="148" text-anchor="middle" font-size="10" fill="#2b6e9e">前缀块哈希入缓存</text>

  <!-- 哈希表 -->
  <g filter="url(#sk)"><rect x="290" y="60" width="200" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="390" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">块哈希表</text>
  <text x="390" y="108" text-anchor="middle" font-size="10" fill="#444">hash(块0 token) → 物理块 P3</text>
  <text x="390" y="128" text-anchor="middle" font-size="10" fill="#444">hash(块1 token) → 物理块 P7</text>
  <text x="390" y="150" text-anchor="middle" font-size="10" fill="#7a5415">LRU 淘汰未命中块</text>

  <!-- 请求 2 -->
  <g filter="url(#sk)"><rect x="540" y="60" width="200" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="640" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#356130">请求 2（命中）</text>
  <text x="640" y="106" text-anchor="middle" font-size="10" fill="#444">相同 system prompt + 问题 B</text>
  <text x="640" y="126" text-anchor="middle" font-size="10" fill="#356130">前缀块直接复用（ref+1）</text>
  <text x="640" y="148" text-anchor="middle" font-size="10" fill="#356130">只 prefill 问题 B 部分</text>

  <!-- 箭头 -->
  <path d="M 240 115 L 284 115" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 490 115 L 534 115" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 收益场景 -->
  <text x="40" y="215" font-size="13" font-weight="bold" fill="#2b6e9e">收益最大的场景</text>
  <g filter="url(#sk)"><rect x="40" y="228" width="220" height="80" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="150" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">共享 system prompt</text>
  <text x="150" y="274" text-anchor="middle" font-size="10" fill="#444">同一应用的所有请求</text>
  <text x="150" y="294" text-anchor="middle" font-size="10" fill="#444">长指令只算一次</text>

  <g filter="url(#sk)"><rect x="280" y="228" width="220" height="80" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="390" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">多轮对话</text>
  <text x="390" y="274" text-anchor="middle" font-size="10" fill="#444">历史轮次是天然前缀</text>
  <text x="390" y="294" text-anchor="middle" font-size="10" fill="#444">每轮只算新增部分</text>

  <g filter="url(#sk)"><rect x="520" y="228" width="220" height="80" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="630" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">few-shot / RAG 模板</text>
  <text x="630" y="274" text-anchor="middle" font-size="10" fill="#444">固定示例与文档头</text>
  <text x="630" y="294" text-anchor="middle" font-size="10" fill="#444">TTFT 显著下降</text>

  <!-- 底部 -->
  <g filter="url(#sk)"><rect x="40" y="330" width="700" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="390" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#356130">与 Day 2 的关系：分页让"复用"只是 block table 填同一个物理块号</text>
  <text x="390" y="372" text-anchor="middle" font-size="10.5" fill="#356130">收益是双重的：省显存（只存一份）+ 省算力（跳过重复 prefill，TTFT 降低）</text>
</svg>
