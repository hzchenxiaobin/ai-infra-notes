<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="220" fill="#fdfcf7"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">标准 Rollout vs Partial Rollout</text>
  <text x="190" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">标准 rollout</text>
  <g filter="url(#sk)"><rect x="50" y="70" width="280" height="36" rx="6" fill="#fae8e8" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="190" y="92" text-anchor="middle" font-size="10" fill="#333">从头生成完整回复（5000 token）</text>
  <text x="570" y="58" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">Partial rollout</text>
  <g filter="url(#sk)"><rect x="430" y="70" width="120" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="490" y="92" text-anchor="middle" font-size="9" fill="#333">复用前缀 2000</text>
  <g filter="url(#sk)"><rect x="560" y="70" width="150" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="635" y="92" text-anchor="middle" font-size="9" fill="#333">重新生成 3000</text>
  <path d="M 550 88 L 560 88" stroke="#2e6e2e" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="570" y="130" text-anchor="middle" font-size="9" fill="#666">1. 保留之前 rollout</text>
  <text x="570" y="145" text-anchor="middle" font-size="9" fill="#666">2. 随机位置截断</text>
  <text x="570" y="160" text-anchor="middle" font-size="9" fill="#666">3. 从截断点重新生成</text>
  <text x="570" y="175" text-anchor="middle" font-size="9" fill="#666">4. 拼接 + 计算奖励</text>
  <text x="380" y="200" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">省 ~50%+ rollout 计算 · 更多样本多样性</text>
</svg>
