<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>

  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Scaled Dot-Product Attention 数据流</text>
  <path d="M 140 38 Q 340 46 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- X -->
  <g filter="url(#sk)">
    <rect x="24" y="190" width="70" height="70" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="2"/>
  </g>
  <text x="59" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">X</text>
  <text x="59" y="240" text-anchor="middle" font-size="9" fill="#666">(B,T,C)</text>

  <!-- Q K V -->
  <g filter="url(#sk)">
    <rect x="150" y="55" width="80" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="190" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">Q</text>
  <text x="190" y="92" text-anchor="middle" font-size="9" fill="#666">X·Wq</text>

  <g filter="url(#sk)">
    <rect x="150" y="202" width="80" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="190" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">K</text>
  <text x="190" y="239" text-anchor="middle" font-size="9" fill="#666">X·Wk</text>

  <g filter="url(#sk)">
    <rect x="150" y="350" width="80" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="190" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">V</text>
  <text x="190" y="387" text-anchor="middle" font-size="9" fill="#666">X·Wv</text>

  <!-- X 到 QKV 的箭头 -->
  <path d="M 94 210 L 142 90" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 94 225 L 142 225" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 94 245 L 142 360" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- scores -->
  <g filter="url(#sk)">
    <rect x="290" y="110" width="130" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="355" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">QKᵀ / √d</text>
  <text x="355" y="152" text-anchor="middle" font-size="9" fill="#666">(B,H,T,T)</text>

  <path d="M 230 80 L 282 122" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 230 222 L 282 152" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- mask -->
  <g filter="url(#sk)">
    <rect x="480" y="110" width="110" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="535" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">因果掩码</text>
  <text x="535" y="152" text-anchor="middle" font-size="9" fill="#666">未来位置置 -inf</text>

  <path d="M 420 138 L 472 138" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- softmax -->
  <g filter="url(#sk)">
    <rect x="480" y="220" width="110" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="535" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">softmax</text>
  <text x="535" y="262" text-anchor="middle" font-size="9" fill="#666">注意力权重</text>

  <path d="M 535 166 L 535 212" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 乘 V -->
  <g filter="url(#sk)">
    <rect x="480" y="340" width="110" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="535" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">× V 加权求和</text>

  <path d="M 535 276 L 535 332" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 230 373 L 472 370" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- O -->
  <g filter="url(#sk)">
    <rect x="610" y="340" width="56" height="56" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="2"/>
  </g>
  <text x="638" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">O</text>
  <text x="638" y="384" text-anchor="middle" font-size="9" fill="#666">(B,H,T,d)</text>

  <path d="M 590 368 L 602 368" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 公式 -->
  <text x="340" y="446" text-anchor="middle" font-size="13" fill="#444">Attention(Q, K, V) = softmax(QKᵀ / √d) · V</text>
</svg>
