<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">在线服务 vs 离线 Engine：同一内核，两种形态</text>

  <!-- 左：在线服务 -->
  <g filter="url(#sk)"><rect x="30" y="52" width="345" height="225" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="202" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">在线服务（launch_server）</text>

  <g filter="url(#sk)"><rect x="50" y="92" width="305" height="34" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="202" y="113" text-anchor="middle" font-size="10" fill="#444">python -m sglang.launch_server --model-path ...</text>

  <text x="58" y="148" font-size="10.5" fill="#4a6a8a">· HTTP 常驻服务，OpenAI 兼容 API</text>
  <text x="58" y="168" font-size="10.5" fill="#4a6a8a">· 请求异步到达，随时插入 batch</text>
  <text x="58" y="188" font-size="10.5" fill="#4a6a8a">· 支持流式 SSE，多客户端并发</text>

  <g filter="url(#sk)"><rect x="50" y="202" width="305" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="202" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#356130">适用：在线推理服务</text>
  <text x="202" y="243" text-anchor="middle" font-size="10" fill="#356130">聊天应用 / API 网关 / 生产部署</text>

  <!-- 右：离线 Engine -->
  <g filter="url(#sk)"><rect x="385" y="52" width="345" height="225" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="557" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8d3f3b">离线批处理（sglang.Engine）</text>

  <g filter="url(#sk)"><rect x="405" y="92" width="305" height="34" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="557" y="113" text-anchor="middle" font-size="10" fill="#444">llm = sgl.Engine(model_path=...)</text>

  <text x="413" y="148" font-size="10.5" fill="#8a5a56">· 进程内直接调用，不起 HTTP 服务</text>
  <text x="413" y="168" font-size="10.5" fill="#8a5a56">· 一次性提交整个 prompt 列表</text>
  <text x="413" y="188" font-size="10.5" fill="#8a5a56">· 同步等待全部完成，用完 shutdown()</text>

  <g filter="url(#sk)"><rect x="405" y="202" width="305" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="557" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#356130">适用：离线批量任务</text>
  <text x="557" y="243" text-anchor="middle" font-size="10" fill="#356130">数据标注 / 评测打分 / 批量生成</text>

  <!-- 汇合箭头 -->
  <path d="M 202 277 L 300 303" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 557 277 L 458 303" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 共享内核 -->
  <g filter="url(#sk)"><rect x="155" y="307" width="450" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="380" y="327" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">同一个引擎内核：调度器 + RadixAttention + KV Cache 池</text>
  <text x="380" y="345" text-anchor="middle" font-size="10" fill="#8a6a30">离线 generate(列表) 内部照样组批——Continuous Batching 两种形态都在跑</text>

  <!-- 底部警告 -->
  <text x="380" y="382" text-anchor="middle" font-size="10.5" fill="#8d3f3b">⚠ 同一张卡别同时跑服务和新 Engine：两个引擎各分一块显存，容易双双 OOM</text>
</svg>
