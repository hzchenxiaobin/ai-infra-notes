<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="360" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">引擎主循环：step() 三段式</text>

  <!-- 三段 -->
  <g filter="url(#sk)"><rect x="60" y="90" width="200" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="160" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">① schedule()</text>
  <text x="160" y="142" text-anchor="middle" font-size="10" fill="#7a5415">调度层（CPU）</text>
  <text x="160" y="160" text-anchor="middle" font-size="10" fill="#444">选序列、分配块、抢占</text>
  <text x="160" y="178" text-anchor="middle" font-size="10" fill="#444">产出 SchedulerOutputs</text>

  <g filter="url(#sk)"><rect x="300" y="90" width="200" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="400" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#356130">② execute_model()</text>
  <text x="400" y="142" text-anchor="middle" font-size="10" fill="#356130">执行层（GPU）</text>
  <text x="400" y="160" text-anchor="middle" font-size="10" fill="#444">构造输入张量 → 前向</text>
  <text x="400" y="178" text-anchor="middle" font-size="10" fill="#444">采样 → 每序列 1 个 token</text>

  <g filter="url(#sk)"><rect x="540" y="90" width="200" height="110" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="640" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ process_outputs()</text>
  <text x="640" y="142" text-anchor="middle" font-size="10" fill="#2b6e9e">引擎层（CPU）</text>
  <text x="640" y="160" text-anchor="middle" font-size="10" fill="#444">追加 token、更新状态</text>
  <text x="640" y="178" text-anchor="middle" font-size="10" fill="#444">完成的回收块、流式返回</text>

  <!-- 箭头 -->
  <path d="M 260 145 L 294 145" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 500 145 L 534 145" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 640 200 C 640 250 160 250 160 205" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="268" text-anchor="middle" font-size="10.5" fill="#356130">还有未完成序列 → 下一 step</text>

  <!-- 底部注解 -->
  <g filter="url(#sk)"><rect x="60" y="290" width="680" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="400" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#8d3f3b">关键认知：① 和 ③ 是 CPU 开销，② 是 GPU 计算</text>
  <text x="400" y="331" text-anchor="middle" font-size="10.5" fill="#8d3f3b">小 batch 时 CPU 调度开销占比高 → CUDA Graph / 异步调度来兜底（Day 5）</text>
</svg>
