<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="560" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">k2 Multi-Head Attention：一个 block 负责一个 head</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#888">H=12 个 block 并行，每 head 在 (seq, DH=64) 上做 Q·Kᵀ → softmax → ·V</text>

  <!-- ===== qkv split ===== -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">qkv (seq, 2304) 拆成 Q/K/V 各 (seq, 768)，再 reshape 为 (H, seq, 64)</text>
  <g font-size="9" fill="#333">
    <rect x="40" y="86" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="103" text-anchor="middle">qkv (seq, 2304)</text>
    <text x="180" y="103" font-size="9" fill="#888">split →</text>
    <rect x="220" y="86" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="103" text-anchor="middle">Q</text>
    <rect x="284" y="86" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="314" y="103" text-anchor="middle">K</text>
    <rect x="348" y="86" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="378" y="103" text-anchor="middle">V</text>
    <text x="430" y="103" font-size="9" fill="#888">各 (seq, 768) → view (H=12, seq, 64)</text>
  </g>

  <!-- ===== per-head blocks ===== -->
  <path d="M 100 116 L 100 138" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="132" font-size="12" fill="#444" font-weight="bold">grid = H=12 个 block（每 head 独立计算）</text>

  <g font-size="9" fill="#333">
    <rect x="40" y="142" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="100" y="160" text-anchor="middle" font-weight="bold" fill="#b85450">block 0 (head 0)</text>
    <text x="100" y="174" text-anchor="middle" fill="#555">Q[0], K[0], V[0]</text>

    <rect x="180" y="142" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="240" y="160" text-anchor="middle" font-weight="bold" fill="#b85450">block 1 (head 1)</text>
    <text x="240" y="174" text-anchor="middle" fill="#555">Q[1], K[1], V[1]</text>

    <text x="330" y="166" font-size="11" fill="#888">...</text>

    <rect x="360" y="142" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="420" y="160" text-anchor="middle" font-weight="bold" fill="#b85450">block 11 (head 11)</text>
    <text x="420" y="174" text-anchor="middle" fill="#555">Q[11], K[11], V[11]</text>
  </g>

  <!-- ===== inside one block: 3 steps ===== -->
  <line x1="20" y1="198" x2="660" y2="198" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="220" font-size="12" fill="#444" font-weight="bold">block 内部（以 head h 为例，DH=64，seq=S）：</text>

  <!-- step 1: Q·Kᵀ -->
  <rect x="30" y="232" width="190" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="252" font-size="11" fill="#b85450" font-weight="bold">① scores = Q·Kᵀ / √DH</text>
  <text x="44" y="268" font-size="9" fill="#555">scores[i,j] = Σ Q[i,d]·K[j,d] / 8</text>
  <text x="44" y="282" font-size="9" fill="#555">shape: (S, S)</text>
  <text x="44" y="296" font-size="9" fill="#888">逐行 i：thread i 算 scores[i,:]</text>
  <text x="44" y="308" font-size="9" fill="#888">归约 DH=64 维</text>

  <!-- step 2: softmax -->
  <rect x="240" y="232" width="190" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="254" y="252" font-size="11" fill="#d6a040" font-weight="bold">② softmax(scores)</text>
  <text x="254" y="268" font-size="9" fill="#555">逐行 softmax（沿 j 维）</text>
  <text x="254" y="282" font-size="9" fill="#555">max → exp → sum → div</text>
  <text x="254" y="296" font-size="9" fill="#888">块归约 max + sum</text>
  <text x="254" y="308" font-size="9" fill="#888">safe softmax（减 max）</text>

  <!-- step 3: ·V -->
  <rect x="450" y="232" width="190" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="464" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">③ attn_out = sm·V</text>
  <text x="464" y="268" font-size="9" fill="#555">out[i,d] = Σ sm[i,j]·V[j,d]</text>
  <text x="464" y="282" font-size="9" fill="#555">shape: (S, 64)</text>
  <text x="464" y="296" font-size="9" fill="#888">逐行 i，归约 S 维</text>
  <text x="464" y="308" font-size="9" fill="#888">写出 attn_out[h]</text>

  <!-- arrows -->
  <path d="M 222 272 L 238 272" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 272 L 448 272" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== concat & reshape ===== -->
  <line x1="20" y1="330" x2="660" y2="330" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="352" font-size="12" fill="#444" font-weight="bold">12 个 head 的 attn_out 拼接 → (seq, 768)</text>
  <g font-size="9" fill="#333">
    <rect x="40" y="362" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="70" y="378" text-anchor="middle">h0</text>
    <rect x="100" y="362" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="130" y="378" text-anchor="middle">h1</text>
    <text x="178" y="378" font-size="10" fill="#888">...</text>
    <rect x="200" y="362" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="230" y="378" text-anchor="middle">h11</text>
    <text x="290" y="378" font-size="9" fill="#888">concat → attn_out (seq, 768)</text>
  </g>

  <!-- ===== note: no causal mask (GPT-2 block 题目未加 mask) ===== -->
  <rect x="30" y="404" width="610" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="424" font-size="10" fill="#444" font-weight="bold">⚠️ 注意：本题 reference 未加 causal mask（双向 attention）</text>
  <text x="44" y="440" font-size="9" fill="#555">真实 GPT-2 推理用 causal mask（下三角），见 #53 Causal Self-Attention；本题简化为全注意力</text>

  <!-- ===== optimization ===== -->
  <line x1="20" y1="462" x2="660" y2="462" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="486" font-size="12" fill="#444" font-weight="bold">优化方向：FlashAttention 思想（融合 ①②③）</text>
  <text x="30" y="506" font-size="10" fill="#555">朴素：scores (S×S) 落盘 HBM，seq=1024 时 4MB/head × 12 = 48MB 冗余</text>
  <text x="30" y="522" font-size="10" fill="#555">Flash：分块 K/V，scores 留 shared，online softmax 增量更新 → scores 不落盘</text>
  <text x="30" y="538" font-size="10" fill="#4a7a3a" font-weight="bold">见 softmax-attention / multi-head-attention 题解的 FlashAttention 实现</text>
  <text x="30" y="554" font-size="9" fill="#888">本题朴素实现即过容差 1e-3；生产级用 FlashAttention + causal mask</text>
</svg>
