<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="960" height="570" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Swizzle&lt;3,4,3&gt; 的位级定义：偏移里哪些 bit 参与 XOR</text>
  <path d="M 250 41 Q 480 49 710 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="170" y="54" width="620" height="34" rx="6" fill="#f4f6f8" stroke="#c9c9c9" stroke-width="0.8"/></g>
  <text x="480" y="76" text-anchor="middle" font-size="12" font-family="monospace" fill="#2b2b2b">swizzled = off ^ ((off &amp; 0x380) &gt;&gt; 3)    // 0x380 = 0b111 &lt;&lt; 7</text>

  <text x="40" y="116" font-size="10" fill="#555">以 off = 3×128 + 5×16 = 464（第 3 行的第 5 个 16B 块）为例。一个原子 1024B，只需看低 10 bit：</text>

  <text x="131" y="148" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e">bit[7,10)：行号 i = 3</text>
  <path d="M 60 156 L 60 150 L 202 150 L 202 156" stroke="#4a8edb" stroke-width="1" fill="none"/>
  <text x="275" y="148" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7a5415">bit[4,7)：块号 j = 5</text>
  <path d="M 204 156 L 204 150 L 346 150 L 346 156" stroke="#c98a2b" stroke-width="1" fill="none"/>

  <g filter="url(#sk)">
    <rect x="60" y="164" width="46" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="108" y="164" width="46" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="156" y="164" width="46" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <rect x="204" y="164" width="46" height="34" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="252" y="164" width="46" height="34" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="300" y="164" width="46" height="34" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <rect x="348" y="164" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="396" y="164" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="444" y="164" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="492" y="164" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
  </g>
  <g font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">
    <text x="83" y="186" fill="#2b6e9e">0</text>
    <text x="131" y="186" fill="#2b6e9e">1</text>
    <text x="179" y="186" fill="#2b6e9e">1</text>
    <text x="227" y="186" fill="#7a5415">1</text>
    <text x="275" y="186" fill="#7a5415">0</text>
    <text x="323" y="186" fill="#7a5415">1</text>
    <text x="371" y="186" fill="#999">0</text>
    <text x="419" y="186" fill="#999">0</text>
    <text x="467" y="186" fill="#999">0</text>
    <text x="515" y="186" fill="#999">0</text>
  </g>
  <g font-size="8" fill="#aaa" font-family="monospace" text-anchor="middle">
    <text x="83" y="210">9</text>
    <text x="131" y="210">8</text>
    <text x="179" y="210">7</text>
    <text x="227" y="210">6</text>
    <text x="275" y="210">5</text>
    <text x="323" y="210">4</text>
    <text x="371" y="210">3</text>
    <text x="419" y="210">2</text>
    <text x="467" y="210">1</text>
    <text x="515" y="210">0</text>
  </g>
  <text x="443" y="228" text-anchor="middle" font-size="8.5" fill="#999">bit[0,4)：16B 块内偏移（不动）</text>
  <text x="560" y="186" font-size="11" font-weight="bold" font-family="monospace" fill="#444">= 464</text>

  <path d="M 131 240 C 131 270, 275 270, 275 246" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="203" y="266" text-anchor="middle" font-size="9.5" fill="#444">源右移 3 位后 XOR 进目标：101 ⊕ 011 = 110</text>

  <text x="60" y="300" font-size="10.5" font-weight="bold" fill="#2e6e2e">swizzle 后：off' = 3×128 + 6×16 = 480（行号、块内偏移不动，块号 5 → 6）</text>

  <g filter="url(#sk)">
    <rect x="60" y="310" width="46" height="34" rx="3" fill="#f4f8fc" stroke="#9db8d6" stroke-width="1"/>
    <rect x="108" y="310" width="46" height="34" rx="3" fill="#f4f8fc" stroke="#9db8d6" stroke-width="1"/>
    <rect x="156" y="310" width="46" height="34" rx="3" fill="#f4f8fc" stroke="#9db8d6" stroke-width="1"/>
    <rect x="204" y="310" width="46" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="252" y="310" width="46" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="300" y="310" width="46" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="348" y="310" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="396" y="310" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="444" y="310" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
    <rect x="492" y="310" width="46" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
  </g>
  <g font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">
    <text x="83" y="332" fill="#2b6e9e">0</text>
    <text x="131" y="332" fill="#2b6e9e">1</text>
    <text x="179" y="332" fill="#2b6e9e">1</text>
    <text x="227" y="332" fill="#2e6e2e">1</text>
    <text x="275" y="332" fill="#2e6e2e">1</text>
    <text x="323" y="332" fill="#2e6e2e">0</text>
    <text x="371" y="332" fill="#999">0</text>
    <text x="419" y="332" fill="#999">0</text>
    <text x="467" y="332" fill="#999">0</text>
    <text x="515" y="332" fill="#999">0</text>
  </g>
  <text x="560" y="332" font-size="11" font-weight="bold" font-family="monospace" fill="#444">= 480</text>
  <text x="131" y="360" text-anchor="middle" font-size="8.5" fill="#888">i 不变</text>
  <text x="275" y="360" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2e6e2e">j ⊕ i = 6</text>
  <text x="443" y="360" text-anchor="middle" font-size="8.5" fill="#999">不动</text>

  <g filter="url(#sk)"><rect x="40" y="385" width="280" height="92" rx="8" fill="#f4f8fc" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="56" y="407" font-size="11" font-weight="bold" fill="#2b6e9e">B = 3：参与异或的位数</text>
  <text x="56" y="427" font-size="9.5" fill="#444">行号低 3 位做 XOR，行内 2³ = 8 个槽位</text>
  <text x="56" y="443" font-size="9.5" fill="#444">互相置换；掩码 0x380 = 0b111 &lt;&lt; 7</text>
  <text x="56" y="459" font-size="9.5" fill="#444">圈出的正是这 3 个源 bit。</text>

  <g filter="url(#sk)"><rect x="340" y="385" width="280" height="92" rx="8" fill="#fef9ee" stroke="#c98a2b" stroke-width="1"/></g>
  <text x="356" y="407" font-size="11" font-weight="bold" fill="#7a5415">M = 4：置换单元的粒度</text>
  <text x="356" y="427" font-size="9.5" fill="#444">低 4 bit（2⁴ = 16B）原样保留，块内</text>
  <text x="356" y="443" font-size="9.5" fill="#444">16B 连续性不被打散——正是 ldmatrix /</text>
  <text x="356" y="459" font-size="9.5" fill="#444">cp.async / TMA 的 128-bit 访问粒度</text>

  <g filter="url(#sk)"><rect x="640" y="385" width="280" height="92" rx="8" fill="#f2faf4" stroke="#4a8e4a" stroke-width="1"/></g>
  <text x="656" y="407" font-size="11" font-weight="bold" fill="#2e6e2e">S = 3：两组 bit 的间距</text>
  <text x="656" y="427" font-size="9.5" fill="#444">源在 bit[7,10)、目标在 bit[4,7)，错开</text>
  <text x="656" y="443" font-size="9.5" fill="#444">3 位 → 行距 2^(4+3) = 128B，每 8 行</text>
  <text x="656" y="459" font-size="9.5" fill="#444">（1024B）构成一个 swizzle 原子</text>

  <g filter="url(#sk)">
    <rect x="30" y="495" width="900" height="58" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="50" y="516" font-size="10.5" font-weight="bold" fill="#7a5415">通式与三档硬件封装</text>
  <text x="50" y="534" font-size="9.5" fill="#444">Swizzle&lt;B,M,S&gt;：取 bit[M+S, M+S+B) 右移 S 位，XOR 进 bit[M, M+B)——B 管宽度、M 管粒度、S 管间距。</text>
  <text x="50" y="551" font-size="9.5" fill="#444">Swizzle&lt;1,4,3&gt; / &lt;2,4,3&gt; / &lt;3,4,3&gt; 分别对应 TMA 的 SWIZZLE_32B / SWIZZLE_64B / SWIZZLE_128B。</text>
</svg>
