<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">KV Cache：用显存换掉重复计算</text>

  <!-- 左：无缓存 -->
  <g filter="url(#sk)"><rect x="30" y="52" width="345" height="258" rx="10" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/></g>
  <text x="202" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#555">无 KV Cache（朴素做法）</text>
  <text x="202" y="102" text-anchor="middle" font-size="10.5" fill="#666">生成第 i 个 token 前，</text>
  <text x="202" y="119" text-anchor="middle" font-size="10.5" fill="#666">把前 i-1 个 token 的注意力全部重算</text>

  <text x="58" y="150" font-size="10.5" fill="#555">第 1 步：算 1 个 token</text>
  <g filter="url(#sk)"><rect x="230" y="138" width="16" height="15" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/></g>
  <text x="58" y="174" font-size="10.5" fill="#555">第 2 步：算 2 个 token</text>
  <g filter="url(#sk)"><rect x="230" y="162" width="16" height="15" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="248" y="162" width="16" height="15" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/></g>
  <text x="58" y="198" font-size="10.5" fill="#555">第 3 步：算 3 个 token</text>
  <g filter="url(#sk)"><rect x="230" y="186" width="16" height="15" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="248" y="186" width="16" height="15" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="266" y="186" width="16" height="15" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/></g>
  <text x="58" y="222" font-size="10.5" fill="#555">……</text>
  <text x="58" y="246" font-size="10.5" fill="#555">第 n 步：算 n 个 token</text>
  <text x="278" y="246" font-size="10.5" fill="#888">▍▍▍▍▍▍</text>

  <g filter="url(#sk)"><rect x="55" y="262" width="295" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="202" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8d3f3b">总计算量 ∝ n²，复杂度爆炸</text>

  <!-- 右：有缓存 -->
  <g filter="url(#sk)"><rect x="385" y="52" width="345" height="258" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="557" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">有 KV Cache</text>
  <text x="557" y="102" text-anchor="middle" font-size="10.5" fill="#4a6a8a">历史 token 的 K/V 常驻显存，</text>
  <text x="557" y="119" text-anchor="middle" font-size="10.5" fill="#4a6a8a">每步只算新 token 的 K/V 并追加</text>

  <g filter="url(#sk)"><rect x="405" y="135" width="305" height="52" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="410" y="130" font-size="9.5" fill="#4a6a8a">KV Cache（按 token 追加）</text>
  <g filter="url(#sk)">
    <rect x="415" y="143" width="62" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="483" y="143" width="62" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="551" y="143" width="62" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="619" y="143" width="62" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="446" y="165" text-anchor="middle" font-size="9" fill="#2b6e9e">K1 V1</text>
  <text x="514" y="165" text-anchor="middle" font-size="9" fill="#2b6e9e">K2 V2</text>
  <text x="582" y="165" text-anchor="middle" font-size="9" fill="#2b6e9e">K3 V3</text>
  <text x="650" y="158" text-anchor="middle" font-size="8.5" fill="#7a5415">新 token</text>
  <text x="650" y="170" text-anchor="middle" font-size="8.5" fill="#7a5415">K V 追加</text>

  <g filter="url(#sk)"><rect x="530" y="202" width="90" height="26" rx="5" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/></g>
  <text x="575" y="219" text-anchor="middle" font-size="9.5" fill="#555">新 token（1 个）</text>
  <path d="M 575 202 L 575 185" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="440" y="246" font-size="10.5" fill="#4a6a8a">每步前向：读全部历史 K/V + 算 1 个新 K/V</text>

  <g filter="url(#sk)"><rect x="410" y="262" width="295" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="557" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#356130">每步计算 O(1)，总量 ∝ n</text>

  <!-- 底部：代价 -->
  <path d="M 60 330 L 700 330" stroke="#d6a040" stroke-width="1" stroke-dasharray="5,5" filter="url(#sk)"/>
  <text x="380" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">代价：显存</text>
  <text x="380" y="376" text-anchor="middle" font-size="10.5" fill="#7a5415">每 token KV 字节 = 2 × 层数 × KV 头数 × 头维 × 精度字节</text>
  <text x="380" y="396" text-anchor="middle" font-size="10" fill="#8a6a30">Qwen3-0.6B：2 × 28 × 8 × 128 × 2 B ≈ 112 KiB / token</text>
  <text x="380" y="422" text-anchor="middle" font-size="10.5" fill="#5a5a5a">Day 2 日志的 #tokens = KV 池字节 ÷ 每 token 字节 —— 今天任务 C 亲手验证</text>
</svg>
