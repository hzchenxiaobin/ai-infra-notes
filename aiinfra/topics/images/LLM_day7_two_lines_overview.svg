<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="800" height="220" fill="#fdfcf7"/>
  <text x="400" y="28" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">两条技术线 × 四条主线</text>
  <g filter="url(#sk)"><rect x="80" y="50" width="280" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="220" y="70" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">DeepSeek: V3 → R1 → V3.2 → V4</text>
  <g filter="url(#sk)"><rect x="440" y="50" width="280" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="580" y="70" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">Kimi: K1.5 → K2 → K3</text>
  <text x="400" y="105" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">四条主线</text>
  <g filter="url(#sk)"><rect x="57.5" y="115" width="160" height="45" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="137.5" y="135" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">① 架构效率</text>
  <text x="137.5" y="151" text-anchor="middle" font-size="8" fill="#666">MoE + MLA + DSA</text>
  <g filter="url(#sk)"><rect x="232.5" y="115" width="160" height="45" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="312.5" y="135" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">② 推理能力</text>
  <text x="312.5" y="151" text-anchor="middle" font-size="8" fill="#666">GRPO + RLVR</text>
  <g filter="url(#sk)"><rect x="407.5" y="115" width="160" height="45" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="487.5" y="135" text-anchor="middle" font-size="10" fill="#c98a2b" font-weight="bold">③ 训练工程</text>
  <text x="487.5" y="151" text-anchor="middle" font-size="8" fill="#666">FP8 + DualPipe + MuonClip</text>
  <g filter="url(#sk)"><rect x="582.5" y="115" width="160" height="45" rx="6" fill="#f0e8fa" stroke="#8a4adb" stroke-width="1.4"/></g>
  <text x="662.5" y="135" text-anchor="middle" font-size="10" fill="#8a4adb" font-weight="bold">④ Agentic</text>
  <text x="662.5" y="151" text-anchor="middle" font-size="8" fill="#666">环境交互 RL</text>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="#666">DeepSeek（训练效率+推理RL）  ×  Kimi（优化器+Agent+架构）</text>
</svg>
