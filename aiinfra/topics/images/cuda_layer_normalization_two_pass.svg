<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="560" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单 sample 两遍归约数据流（block n 内部，访问连续）</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#888">256 threads grid-stride 扫 D 个连续元素 → warp shuffle 块归约 → 广播 mean/var → 写回</text>

  <!-- ===== Pass 1: mean ===== -->
  <text x="30" y="76" font-size="12" fill="#b85450" font-weight="bold">① Pass 1：求 mean[n] = Σ x / D</text>

  <!-- input row for sample n (contiguous) -->
  <text x="30" y="98" font-size="10" fill="#446688">input[n, :]（连续）</text>
  <g font-size="9" fill="#333">
    <rect x="40" y="104" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="60" y="118" text-anchor="middle">1.0</text>
    <rect x="80" y="104" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="118" text-anchor="middle">2.0</text>
    <rect x="120" y="104" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="140" y="118" text-anchor="middle">3.0</text>
    <text x="178" y="118" font-size="10" fill="#888">...</text>
    <rect x="200" y="104" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="220" y="118" text-anchor="middle">D</text>
  </g>
  <text x="260" y="118" font-size="9" fill="#b85450" font-weight="bold">← 32 lane 读连续地址 = 1 个 sector（coalesced！）</text>

  <!-- grid-stride threads -->
  <path d="M 84 134 L 160 134" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="9" fill="#b85450">
    <rect x="170" y="118" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="192" y="132" text-anchor="middle">t0: s=6</text>
    <rect x="170" y="142" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="192" y="156" text-anchor="middle">t1: s=...</text>
    <rect x="170" y="166" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="192" y="180" text-anchor="middle">t255</text>
    <text x="230" y="156" font-size="9" fill="#888">grid-stride</text>
  </g>
  <text x="170" y="108" font-size="9" fill="#555">local_sum += x[n,d]</text>

  <!-- block reduce -->
  <path d="M 218 148 L 286 148" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="128" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">block_reduce_sum</text>
  <text x="370" y="160" text-anchor="middle" font-size="9" fill="#555">warp shuffle 5 步</text>
  <text x="370" y="172" text-anchor="middle" font-size="9" fill="#555">+ shared 广播</text>

  <!-- mean result -->
  <path d="M 454 148 L 500 148" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="504" y="128" width="80" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="544" y="146" text-anchor="middle" font-size="9" fill="#888">sum/D</text>
  <text x="544" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">mean=2.0</text>
  <text x="504" y="186" font-size="9" fill="#888">广播给全 block</text>

  <!-- ===== Pass 2: var ===== -->
  <line x1="20" y1="208" x2="660" y2="208" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="230" font-size="12" fill="#4a7a3a" font-weight="bold">② Pass 2：求 var[n] = Σ(x - mean)² / D</text>

  <text x="30" y="252" font-size="10" fill="#446688">input[n, :]（连续）</text>
  <g font-size="9" fill="#333">
    <rect x="40" y="258" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="60" y="272" text-anchor="middle">1.0</text>
    <rect x="80" y="258" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="272" text-anchor="middle">2.0</text>
    <rect x="120" y="258" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="140" y="272" text-anchor="middle">3.0</text>
    <text x="178" y="272" font-size="10" fill="#888">...</text>
    <rect x="200" y="258" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="220" y="272" text-anchor="middle">D</text>
  </g>
  <text x="260" y="272" font-size="9" fill="#888">重复读（同一段连续地址，仍 coalesced）</text>

  <path d="M 84 288 L 160 288" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="9" fill="#4a7a3a">
    <rect x="170" y="272" width="54" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="197" y="286" text-anchor="middle">t0: 2.0</text>
    <rect x="170" y="296" width="54" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="197" y="310" text-anchor="middle">t1: ...</text>
    <rect x="170" y="320" width="54" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="197" y="334" text-anchor="middle">t255</text>
  </g>
  <text x="170" y="262" font-size="9" fill="#555">local_sq += (x - mean)²</text>

  <path d="M 228 292 L 286 292" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="272" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="290" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">block_reduce_sum</text>
  <text x="370" y="304" text-anchor="middle" font-size="9" fill="#555">同模板复用</text>

  <path d="M 454 292 L 500 292" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="504" y="272" width="80" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="544" y="290" text-anchor="middle" font-size="9" fill="#888">sq/D</text>
  <text x="544" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">var=0.67</text>

  <!-- ===== Pass 3: normalize ===== -->
  <line x1="20" y1="346" x2="660" y2="346" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="368" font-size="12" fill="#446688" font-weight="bold">③ Pass 3：写回 y[n,d] = γ[d]·(x-mean)/√(var+ε) + β[d]</text>

  <g font-size="9" fill="#333">
    <rect x="40" y="376" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="60" y="390" text-anchor="middle">1.0</text>
    <rect x="80" y="376" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="390" text-anchor="middle">2.0</text>
    <rect x="120" y="376" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="140" y="390" text-anchor="middle">3.0</text>
    <rect x="200" y="376" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="220" y="390" text-anchor="middle">D</text>
  </g>
  <text x="260" y="390" font-size="9" fill="#888">第 3 遍读（连续）</text>

  <path d="M 84 388 L 220 388" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="224" y="368" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="344" y="386" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">逐元素 + γ[d]/β[d] 查表（无归约）</text>
  <text x="344" y="400" text-anchor="middle" font-size="9" fill="#555">(1-2)/√0.67 ≈ -1.22</text>
  <text x="344" y="412" text-anchor="middle" font-size="9" fill="#555">(2-2)/√... = 0</text>

  <path d="M 468 388 L 510 388" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="9" fill="#333">
    <rect x="514" y="376" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="539" y="390" text-anchor="middle">-1.22</text>
    <rect x="564" y="376" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="589" y="390" text-anchor="middle">0</text>
    <rect x="614" y="376" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="634" y="390" text-anchor="middle">1.22</text>
  </g>
  <text x="514" y="412" font-size="9" fill="#888">output[n, :]（连续写）</text>

  <!-- ===== Summary ===== -->
  <line x1="20" y1="448" x2="660" y2="448" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="458" width="610" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="335" y="478" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">每 sample 访存：3 读 input + 1 写 output = 4D × 4B，全部连续</text>
  <text x="335" y="494" text-anchor="middle" font-size="10" fill="#888">全张量 = 4 × N×D × 4B；warp 32 lane 落在同一 cache line → 1 sector/事务（理想合并）</text>

  <text x="30" y="528" font-size="10" fill="#888">对比 BN：BN 归约沿 N（步长 D，strided），同 warp 32 lane 散落 32 个 sector → 事务放大 32×</text>
</svg>
