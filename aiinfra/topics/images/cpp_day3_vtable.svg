<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1003" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">虚函数表（vtable）与多态机制</text>
  <path d="M 260 40 Q 450 48 640 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Code snippet -->
  <g filter="url(#sk)"><rect x="30" y="55" width="840" height="70" rx="6" fill="#f8f8f0" stroke="#888" stroke-width="1.5"/></g>
  <text x="50" y="78" font-size="10" fill="#444" font-family="monospace">class Base {                        class Derived : public Base {</text>
  <text x="50" y="94" font-size="10" fill="#444" font-family="monospace">    virtual void speak();               void speak() override;</text>
  <text x="50" y="110" font-size="10" fill="#444" font-family="monospace">    virtual void walk();                void walk() override;</text>
  <text x="480" y="78" font-size="10" fill="#444" font-family="monospace">    int data_ = 0;</text>
  <text x="480" y="94" font-size="10" fill="#444" font-family="monospace">};</text>
  <text x="480" y="110" font-size="10" fill="#444" font-family="monospace">    void run();  // 非虚函数</text>

  <!-- Base object -->
  <g filter="url(#sk)"><rect x="30" y="145" width="380" height="200" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="220" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">Base 对象（内存布局）</text>

  <rect x="60" y="180" width="300" height="35" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
  <text x="210" y="202" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">vptr → Base::vtable</text>

  <rect x="60" y="225" width="300" height="35" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
  <text x="210" y="247" text-anchor="middle" font-size="10" fill="#444">data_ = 0</text>

  <text x="60" y="290" font-size="9" fill="#888">每个含虚函数的对象都有一个 vptr</text>
  <text x="60" y="306" font-size="9" fill="#888">vptr 在构造时自动初始化</text>
  <text x="60" y="322" font-size="9" fill="#888">sizeof(Base) = 8(vptr) + 4(data_) + 4(pad) = 16</text>

  <!-- Derived object -->
  <g filter="url(#sk)"><rect x="490" y="145" width="380" height="200" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="680" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Derived 对象（内存布局）</text>

  <rect x="520" y="180" width="300" height="35" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/>
  <text x="670" y="202" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">vptr → Derived::vtable</text>

  <rect x="520" y="225" width="300" height="35" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/>
  <text x="670" y="247" text-anchor="middle" font-size="10" fill="#444">data_ = 0</text>

  <text x="520" y="290" font-size="9" fill="#888">Derived 只有一个 vptr（覆盖 Base 的）</text>
  <text x="520" y="306" font-size="9" fill="#888">构造时 vptr 被改为指向 Derived::vtable</text>
  <text x="520" y="322" font-size="9" fill="#888">run() 不是虚函数，不进入 vtable</text>

  <!-- Base vtable -->
  <g filter="url(#sk)"><rect x="30" y="365" width="250" height="215" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="155" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">Base::vtable</text>
  <text x="155" y="404" text-anchor="middle" font-size="8" fill="#888">（存放在只读数据区 .rodata）</text>

  <rect x="50" y="415" width="210" height="30" rx="4" fill="#fff" stroke="#c98a2b" stroke-width="1"/>
  <text x="155" y="434" text-anchor="middle" font-size="10" fill="#444">[0] → Base::speak()</text>

  <rect x="50" y="455" width="210" height="30" rx="4" fill="#fff" stroke="#c98a2b" stroke-width="1"/>
  <text x="155" y="474" text-anchor="middle" font-size="10" fill="#444">[1] → Base::walk()</text>

  <text x="50" y="510" font-size="9" fill="#888">每个类一个 vtable（不是每个对象）</text>
  <text x="50" y="526" font-size="9" fill="#888">vtable 在编译期生成</text>
  <text x="50" y="542" font-size="9" fill="#888">包含所有虚函数的地址</text>
  <text x="50" y="558" font-size="9" fill="#888">通常还有 type_info（RTTI）</text>

  <!-- Derived vtable -->
  <g filter="url(#sk)"><rect x="330" y="365" width="250" height="215" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="455" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">Derived::vtable</text>
  <text x="455" y="404" text-anchor="middle" font-size="8" fill="#888">（存放在只读数据区 .rodata）</text>

  <rect x="350" y="415" width="210" height="30" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1"/>
  <text x="455" y="434" text-anchor="middle" font-size="10" fill="#2e6e2e">[0] → Derived::speak()</text>

  <rect x="350" y="455" width="210" height="30" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1"/>
  <text x="455" y="474" text-anchor="middle" font-size="10" fill="#2e6e2e">[1] → Derived::walk()</text>

  <text x="350" y="510" font-size="9" fill="#888">覆盖（override）了 Base 的入口</text>
  <text x="350" y="526" font-size="9" fill="#888">槽位顺序与 Base 一致</text>
  <text x="350" y="542" font-size="9" fill="#2e6e2e" font-weight="bold">关键：vptr 指向哪个 vtable</text>
  <text x="350" y="558" font-size="9" fill="#2e6e2e" font-weight="bold">决定了调用哪个函数！</text>

  <!-- Polymorphism call flow -->
  <g filter="url(#sk)"><rect x="630" y="365" width="240" height="215" rx="8" fill="#f3e8fa" stroke="#8e4aeb" stroke-width="2"/></g>
  <text x="750" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e2b9e">多态调用过程</text>

  <text x="650" y="412" font-size="9" fill="#444" font-family="monospace">Base* p = new Derived;</text>
  <text x="650" y="428" font-size="9" fill="#444" font-family="monospace">p->speak();</text>

  <text x="650" y="452" font-size="9" fill="#6e2b9e" font-weight="bold">① 取 p 的 vptr</text>
  <text x="650" y="470" font-size="9" fill="#888">→ 得到 Derived::vtable 地址</text>

  <text x="650" y="492" font-size="9" fill="#6e2b9e" font-weight="bold">② 查 vtable 槽位 [0]</text>
  <text x="650" y="510" font-size="9" fill="#888">→ 得到 Derived::speak() 地址</text>

  <text x="650" y="532" font-size="9" fill="#6e2b9e" font-weight="bold">③ 间接调用</text>
  <text x="650" y="550" font-size="9" fill="#888">→ 执行 Derived::speak()</text>

  <text x="650" y="572" font-size="8" fill="#b85450">开销：两次间接寻址（vptr→vtable→函数）</text>
</svg>
