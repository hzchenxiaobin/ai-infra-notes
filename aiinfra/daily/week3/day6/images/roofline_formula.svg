<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" font-family="Consolas, 'Courier New', monospace">
  <rect width="720" height="140" fill="#f8f9fa" rx="8" stroke="#e0e0e0" stroke-width="1"/>

  <text x="20" y="42" font-size="16" fill="#1a1a2e">
