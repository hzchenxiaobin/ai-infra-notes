<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="360" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">混合精度策略：FP16 输入 / FP32 累加</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- Pipeline stages -->
  <!-- Stage 1: Input FP16 -->
  <g filter="url(#sk2)">
    <rect x="40" y="90" width="220" height="120" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="150" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e8c">输入</text>
  <text x="150" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e8c" font-family="monospace">FP16</text>
  <text x="150" y="160" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">__half</text>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="#444">A, B 矩阵</text>
  <text x="150" y="196" text-anchor="middle" font-size="9" fill="#888">16×16 fragment</text>
  <!-- benefit -->
  <text x="150" y="224" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">节省带宽和显存</text>
  <text x="150" y="238" text-anchor="middle" font-size="9" fill="#888">带宽 2x vs FP32</text>

  <!-- arrow -->
  <path d="M 260 150 L 300 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar3)"/>

  <!-- Stage 2: Tensor Core MMA -->
  <g filter="url(#sk2)">
    <rect x="300" y="90" width="280" height="120" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/>
  </g>
  <text x="440" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">Tensor Core MMA</text>
  <text x="440" y="142" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">D = A × B + C</text>
  <text x="440" y="162" text-anchor="middle" font-size="10" fill="#444">wmma::mma_sync</text>
  <text x="440" y="180" text-anchor="middle" font-size="10" fill="#444">FP16 乘法 → FP32 累加</text>
  <text x="440" y="196" text-anchor="middle" font-size="9" fill="#888">硬件自动精度转换</text>
  <text x="440" y="224" text-anchor="middle" font-size="10" fill="#8e5db8" font-weight="bold">吞吐 2-8x vs FMA</text>
  <text x="440" y="238" text-anchor="middle" font-size="9" fill="#888">一条指令 16×16×16</text>

  <!-- arrow -->
  <path d="M 580 150 L 620 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar3)"/>

  <!-- Stage 3: Accumulate FP32 -->
  <g filter="url(#sk2)">
    <rect x="620" y="90" width="220" height="120" rx="8" fill="#fff3cf" stroke="#e8a838" stroke-width="1.4"/>
  </g>
  <text x="730" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d18">累加</text>
  <text x="730" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d18" font-family="monospace">FP32</text>
  <text x="730" y="160" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">float</text>
  <text x="730" y="180" text-anchor="middle" font-size="10" fill="#444">C/D accumulator</text>
  <text x="730" y="196" text-anchor="middle" font-size="9" fill="#888">23 位尾数</text>
  <text x="730" y="224" text-anchor="middle" font-size="10" fill="#e8a838" font-weight="bold">保证数值精度</text>
  <text x="730" y="238" text-anchor="middle" font-size="9" fill="#888">避免大数吃小数</text>

  <!-- arrow -->
  <path d="M 840 150 L 880 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar3)"/>

  <!-- Stage 4: Output FP32 -->
  <g filter="url(#sk2)">
    <rect x="860" y="90" width="60" height="120" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="890" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a2828">输出</text>
  <text x="890" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828" font-family="monospace">FP32</text>
  <text x="890" y="166" text-anchor="middle" font-size="9" fill="#444">store</text>
  <text x="890" y="180" text-anchor="middle" font-size="9" fill="#444">to</text>
  <text x="890" y="194" text-anchor="middle" font-size="9" fill="#444">GMEM</text>

  <!-- Comparison table at bottom -->
  <g filter="url(#sk2)">
    <rect x="40" y="264" width="860" height="84" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="286" font-size="12" font-weight="bold" fill="#2b2b2b">为什么 FP16 输入 + FP32 累加？</text>
  <text x="60" y="306" font-size="11" fill="#444">① FP16 只有 10 位尾数，大量累加会导致大数吃小数（precision loss）</text>
  <text x="60" y="324" font-size="11" fill="#444">② FP32 有 23 位尾数，累加数千个 FP16 乘积仍能保持精度</text>
  <text x="60" y="342" font-size="11" fill="#2e7d4f" font-weight="bold">③ FP16 输入省带宽(2x) + FP32 累加保精度 = 推理/训练主流方案</text>
</svg>
