<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="620" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">从 31% 到 96% 的优化链（2026-08-09 实测）</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Box 1: 31% Day1 naive -->
  <g filter="url(#sk)">
    <rect x="140" y="60" width="360" height="54" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="170" y="92" font-size="20" font-weight="bold" fill="#7a5415">31%</text>
  <text x="230" y="86" font-size="12" fill="#444" font-weight="bold">Day1 naive, 实测</text>
  <text x="230" y="102" font-size="10" fill="#888">用了 TC 但无 tiling</text>

  <!-- Arrow 1 + description -->
  <path d="M 320 116 L 320 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="134" font-size="10" fill="#444">加 smem tiling</text>
  <text x="335" y="150" font-size="9" fill="#b03a3a">（实现有问题，反而更慢）</text>

  <!-- Box 2: 16% Day2 tiled - regression -->
  <g filter="url(#sk)">
    <rect x="140" y="178" width="360" height="54" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  </g>
  <text x="170" y="210" font-size="20" font-weight="bold" fill="#7a2828">16%</text>
  <text x="230" y="204" font-size="12" fill="#444" font-weight="bold">Day2 tiled, 实测 — 退步!</text>
  <text x="230" y="220" font-size="10" fill="#888">smem layout 未优化</text>

  <!-- Arrow 2 + description -->
  <path d="M 320 234 L 320 292" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="252" font-size="10" fill="#444">用 mma.sync 替代 WMMA</text>
  <text x="335" y="268" font-size="9" fill="#b03a3a">（tiling 粒度太细，仍退步）</text>

  <!-- Box 3: 8.8% Day3 mma.sync - regression -->
  <g filter="url(#sk)">
    <rect x="140" y="296" width="360" height="54" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  </g>
  <text x="170" y="328" font-size="20" font-weight="bold" fill="#7a2828">8.8%</text>
  <text x="230" y="322" font-size="12" fill="#444" font-weight="bold">Day3 mma.sync, 实测 — 继续退步!</text>
  <text x="230" y="338" font-size="10" fill="#888">1 warp/16×8 tile</text>

  <!-- Arrow 3 + description -->
  <path d="M 320 352 L 320 410" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="370" font-size="10" fill="#444">加 cp.async double buffer</text>
  <text x="335" y="386" font-size="9" fill="#4a8e4a">（真正重叠 load/compute）</text>

  <!-- Box 4: 96% Day5 dbuf - big improvement -->
  <g filter="url(#sk)">
    <rect x="140" y="414" width="360" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="170" y="446" font-size="20" font-weight="bold" fill="#2e5a1a">96%</text>
  <text x="230" y="440" font-size="12" fill="#444" font-weight="bold">Day5 dbuf, 实测 — 大幅反超!</text>
  <text x="230" y="456" font-size="10" fill="#888">接近 cuBLAS</text>

  <!-- Arrow 4 + description -->
  <path d="M 320 470 L 320 528" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="488" font-size="10" fill="#444">加 K 分割 + swizzle</text>
  <text x="335" y="504" font-size="9" fill="#444">+ 3-stage + auto-tuning</text>

  <!-- Box 5: 95% CUTLASS -->
  <g filter="url(#sk)">
    <rect x="140" y="532" width="360" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="170" y="564" font-size="20" font-weight="bold" fill="#2e5a1a">95%</text>
  <text x="230" y="558" font-size="12" fill="#444" font-weight="bold">CUTLASS</text>
  <text x="230" y="574" font-size="10" fill="#888">全部优化 + auto-tuning</text>
</svg>
