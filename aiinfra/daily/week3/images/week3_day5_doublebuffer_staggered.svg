<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fdfcf7"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">Double Buffer（Day 5）：load[k+1] 与 compute[k] 重叠</text>
  <path d="M 190 33 Q 360 40 530 33" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- Row 0: load_0 → sync -->
  <text x="72" y="70" text-anchor="end" font-size="10" fill="#888">k=0</text>
  <g filter="url(#sk)">
    <rect x="80" y="56" width="100" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="130" y="76" text-anchor="middle" font-size="11" fill="#7a5415">load_0</text>
  <path d="M 182 71 L 214 71" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="216" y="61" width="40" height="20" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <text x="236" y="75" text-anchor="middle" font-size="9" fill="#666">sync</text>

  <!-- Row 1: load_1 → compute_0 → sync -->
  <text x="172" y="120" text-anchor="end" font-size="10" fill="#888">k=1</text>
  <g filter="url(#sk)">
    <rect x="180" y="106" width="100" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="230" y="126" text-anchor="middle" font-size="11" fill="#7a5415">load_1</text>
  <path d="M 282 121 L 300 121" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="300" y="106" width="100" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="350" y="126" text-anchor="middle" font-size="11" fill="#2b6e9e">compute_0</text>
  <path d="M 402 121 L 434 121" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="436" y="111" width="40" height="20" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <text x="456" y="125" text-anchor="middle" font-size="9" fill="#666">sync</text>

  <!-- overlap bracket row 1 -->
  <path d="M 180 100 L 180 104 M 180 100 L 400 100 M 400 100 L 400 104" stroke="#4a8e4a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="290" y="96" text-anchor="middle" font-size="9" fill="#4a8e4a" font-weight="bold">load_1 与 compute_0 重叠</text>

  <!-- Row 2: load_2 → compute_1 → sync -->
  <text x="272" y="170" text-anchor="end" font-size="10" fill="#888">k=2</text>
  <g filter="url(#sk)">
    <rect x="280" y="156" width="100" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="330" y="176" text-anchor="middle" font-size="11" fill="#7a5415">load_2</text>
  <path d="M 382 171 L 400 171" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="156" width="100" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="450" y="176" text-anchor="middle" font-size="11" fill="#2b6e9e">compute_1</text>
  <path d="M 502 171 L 534 171" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="536" y="161" width="40" height="20" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <text x="556" y="175" text-anchor="middle" font-size="9" fill="#666">sync</text>

  <!-- overlap bracket row 2 -->
  <path d="M 280 150 L 280 154 M 280 150 L 500 150 M 500 150 L 500 154" stroke="#4a8e4a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="390" y="146" text-anchor="middle" font-size="9" fill="#4a8e4a" font-weight="bold">重叠</text>

  <!-- Row 3: load_3 → compute_2 → sync -->
  <text x="372" y="220" text-anchor="end" font-size="10" fill="#888">k=3</text>
  <g filter="url(#sk)">
    <rect x="380" y="206" width="100" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="430" y="226" text-anchor="middle" font-size="11" fill="#7a5415">load_3</text>
  <path d="M 482 221 L 500 221" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="500" y="206" width="100" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="550" y="226" text-anchor="middle" font-size="11" fill="#2b6e9e">compute_2</text>
  <path d="M 602 221 L 634 221" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="636" y="211" width="40" height="20" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <text x="656" y="225" text-anchor="middle" font-size="9" fill="#666">sync</text>

  <!-- overlap bracket row 3 -->
  <path d="M 380 200 L 380 204 M 380 200 L 600 200 M 600 200 L 600 204" stroke="#4a8e4a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="490" y="196" text-anchor="middle" font-size="9" fill="#4a8e4a" font-weight="bold">重叠</text>

  <!-- time arrow -->
  <path d="M 80 258 L 670 258" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="678" y="262" font-size="10" fill="#888">时间</text>

  <text x="360" y="285" text-anchor="middle" font-size="10" fill="#aaa">每行右移表示时间推进 · 异步加载下一块与计算当前块并行</text>
</svg>
