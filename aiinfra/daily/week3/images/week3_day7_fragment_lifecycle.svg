<svg xmlns="http://www.w3.org/2000/svg" width="940" height="200" viewBox="0 0 940 200" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="200" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">WMMA Fragment 生命周期</text>
  <path d="M 320 36 Q 470 44 620 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Loop bracket over load→mma -->
  <path d="M 390 60 L 390 44 L 735 44 L 735 60" stroke="#8e5db8" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="562" y="40" text-anchor="middle" font-size="11" fill="#8e5db8" font-weight="bold">[ K 维循环 ]*</text>

  <!-- Box 1: 声明 -->
  <g filter="url(#sk)">
    <rect x="20" y="60" width="160" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="100" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e8c">声明</text>

  <!-- arrow -->
  <path d="M 180 85 L 205 85" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Box 2: fill_fragment -->
  <g filter="url(#sk)">
    <rect x="205" y="60" width="160" height="50" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="285" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">fill_fragment</text>

  <!-- arrow -->
  <path d="M 365 85 L 390 85" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Box 3: load_matrix_sync -->
  <g filter="url(#sk)">
    <rect x="390" y="60" width="160" height="50" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/>
  </g>
  <text x="470" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a3a7a">load_matrix_sync</text>

  <!-- arrow -->
  <path d="M 550 85 L 575 85" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Box 4: mma_sync -->
  <g filter="url(#sk)">
    <rect x="575" y="60" width="160" height="50" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/>
  </g>
  <text x="655" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">mma_sync</text>

  <!-- arrow -->
  <path d="M 735 85 L 760 85" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Box 5: store_matrix_sync -->
  <g filter="url(#sk)">
    <rect x="760" y="60" width="160" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="840" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5a1a">store_matrix_sync</text>

  <!-- connecting vertical lines -->
  <path d="M 100 110 L 100 134" stroke="#888" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <path d="M 285 110 L 285 134" stroke="#888" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <path d="M 470 110 L 470 134" stroke="#888" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <path d="M 655 110 L 655 134" stroke="#888" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <path d="M 840 110 L 840 134" stroke="#888" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>

  <!-- description text -->
  <text x="100" y="150" text-anchor="middle" font-size="10" fill="#444">编译时确定</text>
  <text x="100" y="164" text-anchor="middle" font-size="10" fill="#444">形状/精度/布局</text>

  <text x="285" y="150" text-anchor="middle" font-size="10" fill="#444">初始化累加器</text>
  <text x="285" y="164" text-anchor="middle" font-size="10" fill="#444">为 0</text>

  <text x="470" y="150" text-anchor="middle" font-size="10" fill="#444">从 smem/gmem</text>
  <text x="470" y="164" text-anchor="middle" font-size="10" fill="#444">加载到 fragment</text>

  <text x="655" y="150" text-anchor="middle" font-size="10" fill="#444">D = A×B + C</text>

  <text x="840" y="150" text-anchor="middle" font-size="10" fill="#444">写回 memory</text>

  <!-- footer note -->
  <text x="470" y="186" text-anchor="middle" font-size="9" fill="#888">声明编译时确定 · load→mma 在 K 维循环 · store 仅最后一次</text>
</svg>
