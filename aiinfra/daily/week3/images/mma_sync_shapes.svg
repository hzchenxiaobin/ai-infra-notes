<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#fdfcf7"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">mma.sync m16n8k16 矩阵形状</text>
  <path d="M 230 42 Q 410 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- bracket label -->
  <path d="M 40 54 Q 40 48 46 48 L 774 48 Q 780 48 780 54" stroke="#4a8edb" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="410" y="44" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">warp（32 线程）协作完成一次 mma.sync — M=16, N=8, K=16</text>

  <!-- A matrix: 16x16, wider -->
  <g filter="url(#sk)">
    <rect x="50" y="70" width="180" height="180" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <!-- A grid: split into 4 quadrants (8x8 each) -->
  <g stroke="#4a8edb" stroke-width="0.5" opacity="0.5">
    <line x1="140" y1="70" x2="140" y2="250"/>
    <line x1="50" y1="160" x2="230" y2="160"/>
  </g>
  <!-- A sub-quadrant labels -->
  <text x="95" y="119" text-anchor="middle" font-size="8" fill="#4a8edb" opacity="0.7">左上8×8</text>
  <text x="185" y="119" text-anchor="middle" font-size="8" fill="#4a8edb" opacity="0.7">右上8×8</text>
  <text x="95" y="209" text-anchor="middle" font-size="8" fill="#4a8edb" opacity="0.7">左下8×8</text>
  <text x="185" y="209" text-anchor="middle" font-size="8" fill="#4a8edb" opacity="0.7">右下8×8</text>
  <text x="140" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e8c">A</text>
  <text x="140" y="270" text-anchor="middle" font-size="11" fill="#444">16×16 (FP16)</text>
  <text x="140" y="286" text-anchor="middle" font-size="9" fill="#888">row-major</text>
  <text x="140" y="300" text-anchor="middle" font-size="9" fill="#888">4 个寄存器 / 线程</text>

  <!-- × symbol -->
  <text x="260" y="165" text-anchor="middle" font-size="28" font-weight="bold" fill="#3a3a3a">×</text>

  <!-- B matrix: 16x8, narrower -->
  <g filter="url(#sk)">
    <rect x="290" y="70" width="90" height="180" rx="4" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.4"/>
  </g>
  <!-- B grid: split into 2 halves (8x8 each, stacked) -->
  <g stroke="#2e7d4f" stroke-width="0.5" opacity="0.5">
    <line x1="290" y1="160" x2="380" y2="160"/>
  </g>
  <text x="335" y="119" text-anchor="middle" font-size="8" fill="#2e7d4f" opacity="0.7">上8×8</text>
  <text x="335" y="209" text-anchor="middle" font-size="8" fill="#2e7d4f" opacity="0.7">下8×8</text>
  <text x="335" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a1a">B</text>
  <text x="335" y="270" text-anchor="middle" font-size="11" fill="#444">16×8 (FP16)</text>
  <text x="335" y="286" text-anchor="middle" font-size="9" fill="#888">col-major</text>
  <text x="335" y="300" text-anchor="middle" font-size="9" fill="#888">2 个寄存器 / 线程</text>

  <!-- + symbol -->
  <text x="420" y="165" text-anchor="middle" font-size="28" font-weight="bold" fill="#3a3a3a">+</text>

  <!-- C matrix: 16x8 -->
  <g filter="url(#sk)">
    <rect x="460" y="70" width="90" height="180" rx="4" fill="#fff3cf" stroke="#e8a838" stroke-width="1.4"/>
  </g>
  <g stroke="#e8a838" stroke-width="0.5" opacity="0.5">
    <line x1="460" y1="160" x2="550" y2="160"/>
  </g>
  <text x="505" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d18">C</text>
  <text x="505" y="270" text-anchor="middle" font-size="11" fill="#444">16×8 (FP32)</text>
  <text x="505" y="286" text-anchor="middle" font-size="9" fill="#888">累加器</text>
  <text x="505" y="300" text-anchor="middle" font-size="9" fill="#888">4 个寄存器 / 线程</text>

  <!-- = symbol -->
  <text x="590" y="165" text-anchor="middle" font-size="28" font-weight="bold" fill="#3a3a3a">=</text>

  <!-- D matrix: 16x8 -->
  <g filter="url(#sk)">
    <rect x="630" y="70" width="90" height="180" rx="4" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <g stroke="#b03a3a" stroke-width="0.5" opacity="0.5">
    <line x1="630" y1="160" x2="720" y2="160"/>
  </g>
  <text x="675" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2828">D</text>
  <text x="675" y="270" text-anchor="middle" font-size="11" fill="#444">16×8</text>
  <text x="675" y="286" text-anchor="middle" font-size="9" fill="#888">FP32 或 FP16</text>
  <text x="675" y="300" text-anchor="middle" font-size="9" fill="#888">输出结果</text>

  <!-- formula at bottom -->
  <g filter="url(#sk)">
    <rect x="50" y="312" width="670" height="22" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 2"/>
  </g>
  <text x="385" y="327" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">D[16×8] = A[16×16] × B[16×8] + C[16×8]</text>
</svg>
