<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="25" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="580" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">标准 Attention 的 Roofline 与瓶颈判定</text>
  <path d="M 280 42 Q 460 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: Roofline plot ===== -->
  <!--
    X-axis (log): AI from 0.1 to 1000, x = 100 + (log10(AI)+1)*110
      0.1→100  1→210  10→320  100→430  1000→540
      softmax AI=0.375 → x=163   ridge AI=12.6 → x=331   GEMM AI=85 → x=419
    Y-axis (log): perf from 0.01 to 100 TFLOP/s, y = 420 - (log10(p)+2)*80
      0.01→420  0.1→340  1→260  10→180  100→100
      bw=19.5/12.6=1.55TB/s  softmax perf=0.375*1.55=0.58→y=279  peak=19.5→y=157  bw@0.1→y=325
  -->
  <text x="270" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">Roofline 图（RTX 5090 FP32，对数坐标）</text>

  <!-- Plot area background -->
  <rect x="100" y="100" width="440" height="320" fill="#fafaf5" stroke="#e0ddd0" stroke-width="0.8"/>

  <!-- Horizontal grid lines -->
  <g stroke="#ece8dc" stroke-width="0.8">
    <line x1="100" y1="340" x2="540" y2="340"/>
    <line x1="100" y1="260" x2="540" y2="260"/>
    <line x1="100" y1="180" x2="540" y2="180"/>
  </g>

  <!-- Y axis -->
  <path d="M 100 420 L 100 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="48" y="260" font-size="11" fill="#444" transform="rotate(-90 48 260)">可达算力 (TFLOP/s, log)</text>
  <!-- Y axis tick labels -->
  <g font-size="9" fill="#888">
    <text x="93" y="424" text-anchor="end">0.01</text>
    <text x="93" y="344" text-anchor="end">0.1</text>
    <text x="93" y="264" text-anchor="end">1</text>
    <text x="93" y="184" text-anchor="end">10</text>
    <text x="93" y="104" text-anchor="end">100</text>
  </g>
  <!-- Y axis tick marks -->
  <g stroke="#3a3a3a" stroke-width="1.2">
    <line x1="96" y1="420" x2="100" y2="420"/>
    <line x1="96" y1="340" x2="100" y2="340"/>
    <line x1="96" y1="260" x2="100" y2="260"/>
    <line x1="96" y1="180" x2="100" y2="180"/>
    <line x1="96" y1="100" x2="100" y2="100"/>
  </g>

  <!-- X axis -->
  <path d="M 100 420 L 540 420" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="450" text-anchor="middle" font-size="11" fill="#444">算术强度 AI (FLOP/Byte, log)</text>
  <!-- X axis tick labels -->
  <g font-size="9" fill="#888">
    <text x="100" y="436" text-anchor="middle">0.1</text>
    <text x="210" y="436" text-anchor="middle">1</text>
    <text x="320" y="436" text-anchor="middle">10</text>
    <text x="430" y="436" text-anchor="middle">100</text>
    <text x="540" y="436" text-anchor="middle">1000</text>
  </g>
  <!-- X axis tick marks -->
  <g stroke="#3a3a3a" stroke-width="1.2">
    <line x1="100" y1="420" x2="100" y2="424"/>
    <line x1="210" y1="420" x2="210" y2="424"/>
    <line x1="320" y1="420" x2="320" y2="424"/>
    <line x1="430" y1="420" x2="430" y2="424"/>
    <line x1="540" y1="420" x2="540" y2="424"/>
  </g>

  <!-- Ridge point vertical line (AI=12.6 → x=331) -->
  <line x1="331" y1="100" x2="331" y2="420" stroke="#c98a2b" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="338" y="116" font-size="10" fill="#c98a2b" font-weight="bold">Ridge Point</text>
  <text x="338" y="130" font-size="9" fill="#c98a2b">AI=12.6</text>

  <!-- Memory bandwidth line: (100, 325) → (331, 157), slope=1 on log-log -->
  <path d="M 100 325 L 331 157" stroke="#4a8edb" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <text x="180" y="252" font-size="10" fill="#4a8edb" font-weight="bold" transform="rotate(-36 180 252)">内存带宽线 (1.55 TB/s)</text>

  <!-- Compute ceiling: (331, 157) → (540, 157), horizontal -->
  <path d="M 331 157 L 540 157" stroke="#4a8e4a" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <text x="340" y="150" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">算力天花板 19.5 TFLOP/s</text>

  <!-- softmax point (163, 279) — ON the memory bandwidth line -->
  <g filter="url(#sk)">
    <circle cx="163" cy="279" r="8" fill="#b03a3a" stroke="#7a2828" stroke-width="1.5"/>
  </g>
  <text x="175" y="273" font-size="10" fill="#b03a3a" font-weight="bold">softmax</text>
  <text x="175" y="287" font-size="9" fill="#7a2828">AI≈0.375</text>
  <text x="175" y="299" font-size="9" fill="#7a2828">→ memory-bound</text>

  <!-- GEMM point (419, 157) — ON the compute ceiling -->
  <g filter="url(#sk)">
    <circle cx="419" cy="157" r="8" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="1.5"/>
  </g>
  <text x="435" y="148" font-size="10" fill="#2e6e2e" font-weight="bold">QK^T / PV GEMM</text>
  <text x="435" y="172" font-size="9" fill="#2e6e2e">AI≈85 → compute-bound</text>

  <!-- Region labels -->
  <text x="165" y="405" font-size="10" fill="#aaa" font-style="italic">memory-bound 区</text>
  <text x="395" y="405" font-size="10" fill="#aaa" font-style="italic">compute-bound 区</text>

  <!-- ===== Right: AI calculations ===== -->
  <!-- GEMM calculation box (top, green) -->
  <g filter="url(#sk)">
    <rect x="580" y="86" width="320" height="105" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="598" y="108" font-size="12" fill="#2b2b2b" font-weight="bold">GEMM 部分（QK^T / PV）</text>
  <text x="598" y="128" font-size="11" fill="#444" font-family="monospace">FLOPs ≈ 4N²·d</text>
  <text x="598" y="146" font-size="11" fill="#444" font-family="monospace">Bytes ≈ 3N²</text>
  <text x="598" y="166" font-size="12" fill="#4a8e4a" font-weight="bold" font-family="monospace">AI = (4/3)d ≈ 85</text>
  <text x="598" y="184" font-size="11" fill="#2e6e2e">85 >> 12.6 → compute-bound</text>

  <!-- softmax calculation box (bottom, red) -->
  <g filter="url(#sk)">
    <rect x="580" y="206" width="320" height="125" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="598" y="228" font-size="12" fill="#2b2b2b" font-weight="bold">softmax 部分</text>
  <text x="598" y="248" font-size="11" fill="#444" font-family="monospace">FLOPs ≈ 3N² (exp+add+div)</text>
  <text x="598" y="268" font-size="11" fill="#444" font-family="monospace">Bytes = 2N² × 4B (读S+写P)</text>
  <text x="598" y="290" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">AI = 3/8 ≈ 0.375</text>
  <text x="598" y="310" font-size="11" fill="#b03a3a">0.375 << 12.6 → memory-bound</text>

  <!-- FlashAttention hint box -->
  <g filter="url(#sk)">
    <rect x="580" y="348" width="320" height="60" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="598" y="370" font-size="11" fill="#c98a2b" font-weight="bold">优化方向</text>
  <text x="598" y="388" font-size="11" fill="#444">FlashAttention：把 softmax 从 HBM</text>
  <text x="598" y="402" font-size="11" fill="#444">搬到 SRAM，消除 O(N²) 读写</text>

  <!-- ===== Bottom: conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="470" width="840" height="92" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="494" font-size="13" font-weight="bold" fill="#2b2b2b">结论：标准 Attention 是混合瓶颈</text>
  <text x="80" y="518" font-size="12" fill="#444">① QK^T / PV 两个 GEMM：AI≈85 >> 12.6 → <tspan font-weight="bold" fill="#4a8e4a">compute-bound</tspan>（大矩阵乘，算力主导）</text>
  <text x="80" y="540" font-size="12" fill="#444">② softmax：AI≈0.375 << 12.6 → <tspan font-weight="bold" fill="#b03a3a">memory-bound</tspan>（O(N²) 读写，带宽主导）← FlashAttention 要消除的瓶颈</text>
</svg>
