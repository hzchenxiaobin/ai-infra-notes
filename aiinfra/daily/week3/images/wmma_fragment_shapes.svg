<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="380" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">WMMA Fragment 形状（m16n16k16）</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- A matrix -->
  <g filter="url(#sk2)">
    <rect x="50" y="80" width="160" height="160" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <!-- A grid lines -->
  <g stroke="#4a8edb" stroke-width="0.4" opacity="0.5">
    <line x1="90" y1="80" x2="90" y2="240"/><line x1="130" y1="80" x2="130" y2="240"/><line x1="170" y1="80" x2="170" y2="240"/>
    <line x1="50" y1="120" x2="210" y2="120"/><line x1="50" y1="160" x2="210" y2="160"/><line x1="50" y1="200" x2="210" y2="200"/>
  </g>
  <text x="130" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e8c">A</text>
  <text x="130" y="260" text-anchor="middle" font-size="11" fill="#444">16×16 (FP16)</text>
  <text x="130" y="276" text-anchor="middle" font-size="9" fill="#888">row-major</text>
  <text x="130" y="292" text-anchor="middle" font-size="9" fill="#888">matrix_a fragment</text>

  <!-- × symbol -->
  <text x="250" y="165" text-anchor="middle" font-size="28" font-weight="bold" fill="#3a3a3a">×</text>

  <!-- B matrix -->
  <g filter="url(#sk2)">
    <rect x="290" y="80" width="160" height="160" rx="4" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.4"/>
  </g>
  <g stroke="#2e7d4f" stroke-width="0.4" opacity="0.5">
    <line x1="330" y1="80" x2="330" y2="240"/><line x1="370" y1="80" x2="370" y2="240"/><line x1="410" y1="80" x2="410" y2="240"/>
    <line x1="290" y1="120" x2="450" y2="120"/><line x1="290" y1="160" x2="450" y2="160"/><line x1="290" y1="200" x2="450" y2="200"/>
  </g>
  <text x="370" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a1a">B</text>
  <text x="370" y="260" text-anchor="middle" font-size="11" fill="#444">16×16 (FP16)</text>
  <text x="370" y="276" text-anchor="middle" font-size="9" fill="#888">col-major</text>
  <text x="370" y="292" text-anchor="middle" font-size="9" fill="#888">matrix_b fragment</text>

  <!-- + symbol -->
  <text x="490" y="165" text-anchor="middle" font-size="28" font-weight="bold" fill="#3a3a3a">+</text>

  <!-- C matrix -->
  <g filter="url(#sk2)">
    <rect x="530" y="80" width="160" height="160" rx="4" fill="#fff3cf" stroke="#e8a838" stroke-width="1.4"/>
  </g>
  <g stroke="#e8a838" stroke-width="0.4" opacity="0.5">
    <line x1="570" y1="80" x2="570" y2="240"/><line x1="610" y1="80" x2="610" y2="240"/><line x1="650" y1="80" x2="650" y2="240"/>
    <line x1="530" y1="120" x2="690" y2="120"/><line x1="530" y1="160" x2="690" y2="160"/><line x1="530" y1="200" x2="690" y2="200"/>
  </g>
  <text x="610" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d18">C</text>
  <text x="610" y="260" text-anchor="middle" font-size="11" fill="#444">16×16 (FP32)</text>
  <text x="610" y="276" text-anchor="middle" font-size="9" fill="#888">accumulator</text>
  <text x="610" y="292" text-anchor="middle" font-size="9" fill="#888">累加器 fragment</text>

  <!-- = symbol -->
  <text x="730" y="165" text-anchor="middle" font-size="28" font-weight="bold" fill="#3a3a3a">=</text>

  <!-- D matrix -->
  <g filter="url(#sk2)">
    <rect x="770" y="80" width="160" height="160" rx="4" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <g stroke="#b03a3a" stroke-width="0.4" opacity="0.5">
    <line x1="810" y1="80" x2="810" y2="240"/><line x1="850" y1="80" x2="850" y2="240"/><line x1="890" y1="80" x2="890" y2="240"/>
    <line x1="770" y1="120" x2="930" y2="120"/><line x1="770" y1="160" x2="930" y2="160"/><line x1="770" y1="200" x2="930" y2="200"/>
  </g>
  <text x="850" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2828">D</text>
  <text x="850" y="260" text-anchor="middle" font-size="11" fill="#444">16×16 (FP32)</text>
  <text x="850" y="276" text-anchor="middle" font-size="9" fill="#888">输出结果</text>
  <text x="850" y="292" text-anchor="middle" font-size="9" fill="#888">store_matrix_sync</text>

  <!-- MMA operation bracket -->
  <path d="M 50 50 Q 50 44 56 44 L 924 44 Q 930 44 930 50" stroke="#4a8edb" stroke-width="1.2" fill="none" filter="url(#sk2)"/>
  <text x="470" y="38" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">wmma::mma_sync — 一条指令完成 16×16×16 矩阵乘加</text>

  <!-- Bottom note -->
  <g filter="url(#sk2)">
    <rect x="40" y="320" width="860" height="48" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="342" font-size="11" fill="#444">一个 warp（32 线程）协作完成一次 MMA 操作，每个线程持有 fragment 的一部分（分布在不同寄存器中）</text>
  <text x="60" y="360" font-size="10" fill="#888">Fragment 内部布局是硬件相关的，程序员不应直接访问 frag.x[i]，所有操作通过 load / store / mma_sync / fill 完成</text>
</svg>
