<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8e5db8"/>
    </marker>
  </defs>

  <rect width="840" height="440" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Block 内 4 Warp 分工（64×64 输出 tile）</text>
  <path d="M 280 44 Q 420 52 560 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="420" y="60" text-anchor="middle" font-size="11" fill="#888">每 warp 负责 32×32 子 tile · 4 warp 共享同一 smem 中的 A/B tile</text>

  <!-- ====== Axis labels ====== -->
  <text x="200" y="82" text-anchor="middle" font-size="11" fill="#888" font-style="italic">N 维 →</text>
  <text x="200" y="82" font-size="10" fill="#aaa"></text>
  <text x="48" y="240" text-anchor="middle" font-size="11" fill="#888" font-style="italic" transform="rotate(-90 48 240)">M 维 ↓</text>

  <!-- tick labels -->
  <text x="60" y="388" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="200" y="388" text-anchor="middle" font-size="9" fill="#aaa">32</text>
  <text x="340" y="388" text-anchor="middle" font-size="9" fill="#aaa">64</text>
  <text x="52" y="104" text-anchor="end" font-size="9" fill="#aaa">0</text>
  <text x="52" y="244" text-anchor="end" font-size="9" fill="#aaa">32</text>
  <text x="52" y="384" text-anchor="end" font-size="9" fill="#aaa">64</text>

  <!-- ====== Block outer frame ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="90" width="280" height="280" rx="4" fill="none" stroke="#2b2b2b" stroke-width="2"/>
  </g>

  <!-- ====== Warp 0 (top-left, blue) ====== -->
  <g filter="url(#sk)">
    <rect x="62" y="92" width="138" height="138" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="131" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">Warp 0</text>
  <text x="131" y="172" text-anchor="middle" font-size="11" fill="#666">C[0:32, 0:32]</text>
  <text x="131" y="190" text-anchor="middle" font-size="9" fill="#888">32×32</text>

  <!-- ====== Warp 1 (top-right, green) ====== -->
  <g filter="url(#sk)">
    <rect x="202" y="92" width="138" height="138" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="271" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">Warp 1</text>
  <text x="271" y="172" text-anchor="middle" font-size="11" fill="#666">C[0:32, 32:64]</text>
  <text x="271" y="190" text-anchor="middle" font-size="9" fill="#888">32×32</text>

  <!-- ====== Warp 2 (bottom-left, orange) ====== -->
  <g filter="url(#sk)">
    <rect x="62" y="232" width="138" height="138" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="131" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">Warp 2</text>
  <text x="131" y="312" text-anchor="middle" font-size="11" fill="#666">C[32:64, 0:32]</text>
  <text x="131" y="330" text-anchor="middle" font-size="9" fill="#888">32×32</text>

  <!-- ====== Warp 3 (bottom-right, purple) ====== -->
  <g filter="url(#sk)">
    <rect x="202" y="232" width="138" height="138" rx="4" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/>
  </g>
  <text x="271" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#5d3a7e">Warp 3</text>
  <text x="271" y="312" text-anchor="middle" font-size="11" fill="#666">C[32:64, 32:64]</text>
  <text x="271" y="330" text-anchor="middle" font-size="9" fill="#888">32×32</text>

  <!-- ====== Shared Memory box (right) ====== -->
  <g filter="url(#sk)">
    <rect x="480" y="140" width="220" height="180" rx="8" fill="#f7f4e8" stroke="#8e5db8" stroke-width="1.6" stroke-dasharray="6 3"/>
  </g>
  <text x="590" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#5d3a7e">Shared Memory</text>
  <text x="590" y="178" text-anchor="middle" font-size="9" fill="#888">4 warp 共享</text>

  <!-- A tile -->
  <g filter="url(#sk)">
    <rect x="500" y="190" width="180" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="590" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">A tile</text>
  <text x="590" y="222" text-anchor="middle" font-size="9" fill="#888">BM×BK = 64×16</text>

  <!-- B tile -->
  <g filter="url(#sk)">
    <rect x="500" y="245" width="180" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="590" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">B tile</text>
  <text x="590" y="277" text-anchor="middle" font-size="9" fill="#888">BK×BN = 16×64</text>

  <!-- ====== Arrows from warps to smem (dashed, showing shared access) ====== -->
  <g filter="url(#sk)" fill="none" stroke="#8e5db8" stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M 200 161 C 340 161 400 200 480 200" marker-end="url(#ard)"/>
    <path d="M 340 161 C 400 161 440 210 480 210" marker-end="url(#ard)"/>
    <path d="M 200 301 C 340 301 400 255 480 255" marker-end="url(#ard)"/>
    <path d="M 340 301 C 400 301 440 265 480 265" marker-end="url(#ard)"/>
  </g>
  <text x="410" y="132" text-anchor="middle" font-size="9" fill="#8e5db8" font-style="italic">load_matrix_sync</text>

  <!-- ====== Bottom notes ====== -->
  <text x="420" y="400" text-anchor="middle" font-size="10" fill="#666">每个 warp 独立计算自己的 32×32 子 tile · 2×2 = 4 条 WMMA 指令</text>
  <text x="420" y="418" text-anchor="middle" font-size="10" fill="#5d3a7e">所有 warp 共享同一个 smem 中的 A/B tile · 每个 tile 只需从 HBM 搬一次</text>
</svg>
