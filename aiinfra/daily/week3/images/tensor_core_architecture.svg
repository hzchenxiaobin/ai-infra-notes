<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Tensor Core 硬件架构：D = A × B + C</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- MMA operation -->
  <text x="470" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">一条 mma.sync m16n16k16 指令做的事</text>
  <!-- A matrix -->
  <g filter="url(#sk2)">
    <rect x="80" y="92" width="160" height="120" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="160" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e8c">A: 16×16</text>
  <text x="160" y="132" text-anchor="middle" font-size="10" fill="#444">FP16</text>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="#444">row-major</text>
  <text x="160" y="174" text-anchor="middle" font-size="9" fill="#888">wmma::matrix_a</text>
  <text x="160" y="196" text-anchor="middle" font-size="9" fill="#888">fragment</text>
  <!-- multiply -->
  <text x="270" y="156" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">×</text>
  <!-- B matrix -->
  <g filter="url(#sk2)">
    <rect x="300" y="92" width="160" height="120" rx="6" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.4"/>
  </g>
  <text x="380" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e3a">B: 16×16</text>
  <text x="380" y="132" text-anchor="middle" font-size="10" fill="#444">FP16</text>
  <text x="380" y="150" text-anchor="middle" font-size="10" fill="#444">col-major</text>
  <text x="380" y="174" text-anchor="middle" font-size="9" fill="#888">wmma::matrix_b</text>
  <text x="380" y="196" text-anchor="middle" font-size="9" fill="#888">fragment</text>
  <!-- plus -->
  <text x="490" y="156" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">+</text>
  <!-- C matrix -->
  <g filter="url(#sk2)">
    <rect x="520" y="92" width="160" height="120" rx="6" fill="#fff3cf" stroke="#e8a838" stroke-width="1.4"/>
  </g>
  <text x="600" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d18">C: 16×16</text>
  <text x="600" y="132" text-anchor="middle" font-size="10" fill="#444">FP32</text>
  <text x="600" y="150" text-anchor="middle" font-size="10" fill="#444">累加器</text>
  <text x="600" y="174" text-anchor="middle" font-size="9" fill="#888">wmma::accumulator</text>
  <text x="600" y="196" text-anchor="middle" font-size="9" fill="#888">fragment</text>
  <!-- equals -->
  <text x="710" y="156" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b">=</text>
  <!-- D matrix -->
  <g filter="url(#sk2)">
    <rect x="740" y="92" width="160" height="120" rx="6" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="820" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828">D: 16×16</text>
  <text x="820" y="132" text-anchor="middle" font-size="10" fill="#444">FP32</text>
  <text x="820" y="150" text-anchor="middle" font-size="10" fill="#444">结果</text>
  <text x="820" y="174" text-anchor="middle" font-size="9" fill="#888">存回 C fragment</text>
  <text x="820" y="196" text-anchor="middle" font-size="9" fill="#888">D = A×B + C</text>

  <!-- warp fragment distribution -->
  <text x="470" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">一个 warp（32 线程）协作持有 fragment</text>
  <g filter="url(#sk2)">
    <rect x="80" y="256" width="780" height="64" rx="8" fill="#f4f0e6" stroke="#3a3a3a" stroke-width="1.2"/>
  </g>
  <!-- 32 lanes -->
  <g font-size="8" fill="#444">
    <g filter="url(#sk2)"><rect x="90" y="266" width="22" height="44" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.6"/><text x="101" y="292" text-anchor="middle">L0</text></g>
    <g filter="url(#sk2)"><rect x="114" y="266" width="22" height="44" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.6"/><text x="125" y="292" text-anchor="middle">L1</text></g>
    <g filter="url(#sk2)"><rect x="138" y="266" width="22" height="44" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.6"/><text x="149" y="292" text-anchor="middle">L2</text></g>
    <text x="185" y="292" font-size="10" fill="#888">...</text>
    <g filter="url(#sk2)"><rect x="216" y="266" width="22" height="44" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.6"/><text x="227" y="292" text-anchor="middle">L15</text></g>
    <g filter="url(#sk2)"><rect x="240" y="266" width="22" height="44" fill="#cde8d8" stroke="#2e7d4f" stroke-width="0.6"/><text x="251" y="292" text-anchor="middle">L16</text></g>
    <text x="290" y="292" font-size="10" fill="#888">...</text>
    <g filter="url(#sk2)"><rect x="330" y="266" width="22" height="44" fill="#fff3cf" stroke="#e8a838" stroke-width="0.6"/><text x="341" y="292" text-anchor="middle">L31</text></g>
    <text x="400" y="284" font-size="10" fill="#444">每个 lane 持有 fragment 的一部分</text>
    <text x="400" y="300" font-size="10" fill="#444">（分布在不同寄存器，硬件相关布局）</text>
    <text x="400" y="316" font-size="9" fill="#b03a3a">⚠ 程序员不应直接访问 frag.x[i]</text>
  </g>

  <!-- Architecture generations -->
  <text x="470" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">各代 Tensor Core 演进</text>
  <g filter="url(#sk2)">
    <rect x="40" y="362" width="860" height="100" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.2"/>
  </g>
  <g font-size="9" fill="#444">
    <g filter="url(#sk2)"><rect x="60" y="376" width="150" height="72" rx="6" fill="#f0ede4" stroke="#888" stroke-width="0.8"/><text x="135" y="394" text-anchor="middle" font-weight="bold" fill="#2b2b2b">Volta sm_70</text><text x="135" y="410" text-anchor="middle">第 1 代</text><text x="135" y="426" text-anchor="middle">FP16</text><text x="135" y="440" text-anchor="middle" font-size="8" fill="#888">首次引入 WMMA</text></g>
    <g filter="url(#sk2)"><rect x="230" y="376" width="150" height="72" rx="6" fill="#f0ede4" stroke="#888" stroke-width="0.8"/><text x="305" y="394" text-anchor="middle" font-weight="bold" fill="#2b2b2b">Turing sm_75</text><text x="305" y="410" text-anchor="middle">第 2 代</text><text x="305" y="426" text-anchor="middle">FP16/INT8</text><text x="305" y="440" text-anchor="middle" font-size="8" fill="#888">INT8 推理</text></g>
    <g filter="url(#sk2)"><rect x="400" y="376" width="150" height="72" rx="6" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="475" y="394" text-anchor="middle" font-weight="bold" fill="#2b2b2b">Ampere sm_80</text><text x="475" y="410" text-anchor="middle">第 3 代</text><text x="475" y="426" text-anchor="middle">+BF16/TF32</text><text x="475" y="440" text-anchor="middle" font-size="8" fill="#888">TF32 加速 FP32</text></g>
    <g filter="url(#sk2)"><rect x="570" y="376" width="150" height="72" rx="6" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="0.8"/><text x="645" y="394" text-anchor="middle" font-weight="bold" fill="#2b2b2b">Hopper sm_90</text><text x="645" y="410" text-anchor="middle">第 4 代</text><text x="645" y="426" text-anchor="middle">+FP8</text><text x="645" y="440" text-anchor="middle" font-size="8" fill="#888">TMA/warp 特化</text></g>
    <g filter="url(#sk2)"><rect x="740" y="376" width="150" height="72" rx="6" fill="#fdecec" stroke="#b03a3a" stroke-width="1.2"/><text x="815" y="394" text-anchor="middle" font-weight="bold" fill="#7a2828">Blackwell sm_120</text><text x="815" y="410" text-anchor="middle">第 5 代</text><text x="815" y="426" text-anchor="middle">+FP8</text><text x="815" y="440" text-anchor="middle" font-size="8" fill="#b03a3a">RTX 5090 ★</text></g>
  </g>

  <!-- FMA vs TC comparison -->
  <text x="470" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">为什么 Tensor Core 比 FMA 快？</text>
  <g filter="url(#sk2)">
    <rect x="60" y="504" width="380" height="130" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.2"/>
  </g>
  <text x="250" y="526" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">FMA (CUDA Core)</text>
  <text x="80" y="548" font-size="10" fill="#444">指令粒度：标量 a*b+c</text>
  <text x="80" y="566" font-size="10" fill="#444">每周期 FLOPs/SM：128 FP32</text>
  <text x="80" y="584" font-size="10" fill="#444">编程模型：显式线程级</text>
  <text x="80" y="602" font-size="10" fill="#444">数据布局：无要求</text>
  <text x="80" y="620" font-size="10" fill="#444">精度：FP32</text>

  <g filter="url(#sk2)">
    <rect x="500" y="504" width="380" height="130" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.2"/>
  </g>
  <text x="690" y="526" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d4f">Tensor Core (WMMA)</text>
  <text x="520" y="548" font-size="10" fill="#444">指令粒度：矩阵 A×B+C (16×16×16)</text>
  <text x="520" y="566" font-size="10" fill="#444">每周期 FLOPs/SM：~256 FP16 (2x)</text>
  <text x="520" y="584" font-size="10" fill="#444">编程模型：warp 级 fragment</text>
  <text x="520" y="602" font-size="10" fill="#444">数据布局：需满足 fragment 布局</text>
  <text x="520" y="620" font-size="10" fill="#444">精度：FP16 输入 / FP32 累加</text>
</svg>
