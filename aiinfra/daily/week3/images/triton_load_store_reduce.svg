<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Triton 三大原语：tl.load / tl.store / tl.reduce（+ tl.dot）</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- tl.load -->
  <text x="160" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a8edb">tl.load —— 带掩码块加载</text>
  <g filter="url(#sk2)">
    <rect x="40" y="88" width="260" height="280" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="55" y="110" font-size="10" fill="#1b5e8c" font-family="monospace">cols = tl.arange(0, BLOCK_SIZE)</text>
  <text x="55" y="126" font-size="10" fill="#1b5e8c" font-family="monospace">mask = cols &lt; n_cols</text>
  <text x="55" y="142" font-size="10" fill="#1b5e8c" font-family="monospace">x = tl.load(</text>
  <text x="55" y="156" font-size="10" fill="#1b5e8c" font-family="monospace">  ptr + row*stride + cols,</text>
  <text x="55" y="170" font-size="10" fill="#1b5e8c" font-family="monospace">  mask=mask,</text>
  <text x="55" y="184" font-size="10" fill="#1b5e8c" font-family="monospace">  other=-float("inf"))</text>
  <!-- mask illustration -->
  <text x="55" y="210" font-size="10" fill="#444">mask 处理越界（N 非幂 2 尾部）</text>
  <g font-size="9" fill="#2b2b2b">
    <g filter="url(#sk2)"><rect x="55" y="220" width="20" height="16" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="65" y="232" text-anchor="middle">v0</text></g>
    <g filter="url(#sk2)"><rect x="77" y="220" width="20" height="16" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="87" y="232" text-anchor="middle">v1</text></g>
    <g filter="url(#sk2)"><rect x="99" y="220" width="20" height="16" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="109" y="232" text-anchor="middle">v2</text></g>
    <g filter="url(#sk2)"><rect x="121" y="220" width="20" height="16" fill="#f0ede4" stroke="#b03a3a" stroke-width="0.8" stroke-dasharray="2 2"/><text x="131" y="232" text-anchor="middle" fill="#b03a3a">-∞</text></g>
  </g>
  <text x="55" y="256" font-size="10" fill="#444">other 指定越界填充值</text>
  <text x="55" y="272" font-size="10" fill="#444">softmax 填 -inf 不影响 max</text>
  <text x="55" y="298" font-size="10" fill="#1b5e8c" font-weight="bold">编译器自动生成：</text>
  <text x="55" y="314" font-size="10" fill="#444">• coalesced 合并访问</text>
  <text x="55" y="330" font-size="10" fill="#444">• 向量化 float4 / half2</text>
  <text x="55" y="346" font-size="10" fill="#444">• 软流水（掩盖延迟）</text>

  <!-- tl.store -->
  <text x="470" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8a838">tl.store —— 带掩码块写出</text>
  <g filter="url(#sk2)">
    <rect x="350" y="88" width="260" height="280" rx="8" fill="#fff3cf" stroke="#e8a838" stroke-width="1.4"/>
  </g>
  <text x="365" y="110" font-size="10" fill="#8a6d18" font-family="monospace">tl.store(</text>
  <text x="365" y="126" font-size="10" fill="#8a6d18" font-family="monospace">  y_ptr + row*stride + cols,</text>
  <text x="365" y="142" font-size="10" fill="#8a6d18" font-family="monospace">  y,</text>
  <text x="365" y="158" font-size="10" fill="#8a6d18" font-family="monospace">  mask=mask)</text>
  <text x="365" y="190" font-size="10" fill="#444">与 tl.load 对称</text>
  <text x="365" y="206" font-size="10" fill="#444">同样支持 mask 防越界写</text>
  <!-- store illustration -->
  <g font-size="9" fill="#2b2b2b">
    <g filter="url(#sk2)"><rect x="365" y="220" width="20" height="16" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="375" y="232" text-anchor="middle">y0</text></g>
    <g filter="url(#sk2)"><rect x="387" y="220" width="20" height="16" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="397" y="232" text-anchor="middle">y1</text></g>
    <g filter="url(#sk2)"><rect x="409" y="220" width="20" height="16" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="419" y="232" text-anchor="middle">y2</text></g>
    <path d="M 430 228 L 460 228" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar3)"/>
    <g filter="url(#sk2)"><rect x="465" y="220" width="60" height="16" fill="#fff3cf" stroke="#e8a838" stroke-width="0.8"/><text x="495" y="232" text-anchor="middle">HBM 写出</text></g>
  </g>
  <text x="365" y="262" font-size="10" fill="#8a6d18" font-weight="bold">自动优化同 load：</text>
  <text x="365" y="278" font-size="10" fill="#444">• 合并写出事务</text>
  <text x="365" y="294" font-size="10" fill="#444">• 向量化宽度自动</text>
  <text x="365" y="310" font-size="10" fill="#444">• mask 外不写（安全）</text>
  <text x="365" y="346" font-size="10" fill="#888" font-style="italic">load/store 配对 = kernel 的 IO 边界</text>

  <!-- tl.reduce -->
  <text x="780" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d4f">tl.reduce —— block 级归约</text>
  <g filter="url(#sk2)">
    <rect x="660" y="88" width="260" height="280" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.4"/>
  </g>
  <text x="675" y="110" font-size="10" fill="#1b5e3a" font-family="monospace">x_max = tl.max(x, axis=0)</text>
  <text x="675" y="126" font-size="10" fill="#1b5e3a" font-family="monospace"># 返回标量</text>
  <text x="675" y="148" font-size="10" fill="#1b5e3a" font-family="monospace">x_sum = tl.sum(x_exp, axis=0)</text>
  <!-- reduce illustration -->
  <g font-size="9" fill="#2b2b2b">
    <g filter="url(#sk2)"><rect x="675" y="162" width="20" height="16" fill="#cde8d8" stroke="#2e7d4f" stroke-width="0.8"/><text x="685" y="174" text-anchor="middle">v0</text></g>
    <g filter="url(#sk2)"><rect x="697" y="162" width="20" height="16" fill="#cde8d8" stroke="#2e7d4f" stroke-width="0.8"/><text x="707" y="174" text-anchor="middle">v1</text></g>
    <g filter="url(#sk2)"><rect x="719" y="162" width="20" height="16" fill="#cde8d8" stroke="#2e7d4f" stroke-width="0.8"/><text x="729" y="174" text-anchor="middle">v2</text></g>
    <text x="745" y="174" font-size="10" fill="#888">...</text>
    <path d="M 705 180 L 705 194" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar3)"/>
    <g filter="url(#sk2)"><rect x="675" y="198" width="60" height="18" fill="#2e7d4f" opacity="0.5" stroke="#1b5e3a" stroke-width="0.8"/><text x="705" y="211" text-anchor="middle" font-size="9" fill="#fff">max/sum</text></g>
  </g>
  <text x="675" y="236" font-size="10" fill="#1b5e3a" font-weight="bold">编译器自动生成：</text>
  <text x="675" y="252" font-size="10" fill="#444">① warp shuffle 折半归约</text>
  <text x="675" y="268" font-size="10" fill="#444" font-family="monospace">  ↓16 ↓8 ↓4 ↓2 ↓1</text>
  <text x="675" y="284" font-size="10" fill="#444">② smem 中转（lane0 写）</text>
  <text x="675" y="300" font-size="10" fill="#444">③ warp0 再 shuffle 一次</text>
  <text x="675" y="316" font-size="10" fill="#444">= Day2 手写的 60 行</text>
  <text x="675" y="332" font-size="10" fill="#444">  blockReduceMax/Sum</text>
  <text x="675" y="352" font-size="10" fill="#b03a3a" font-style="italic">原语 = 把脚手架交给编译器</text>

  <!-- tl.dot extra -->
  <text x="470" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">额外原语：tl.dot —— Tensor Core 矩阵乘</text>
  <g filter="url(#sk2)">
    <rect x="120" y="406" width="700" height="72" rx="8" fill="#f4f0e6" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="140" y="428" font-size="10" fill="#1b5e8c" font-family="monospace">acc = tl.zeros((BLOCK_M, BLOCK_N), dtype=tl.float32)</text>
  <text x="140" y="444" font-size="10" fill="#1b5e8c" font-family="monospace">for k in range(0, K, BLOCK_K):</text>
  <text x="140" y="460" font-size="10" fill="#1b5e8c" font-family="monospace">    a = tl.load(...)  # [BM, BK];  b = tl.load(...)  # [BK, BN]</text>
  <text x="140" y="474" font-size="10" fill="#1b5e8c" font-family="monospace">    acc = tl.dot(a, b, acc)   # 自动调用 Tensor Core (mma PTX)</text>
  <text x="640" y="428" font-size="10" fill="#444">BLOCK 是 16 倍数 → mma 指令</text>
  <text x="640" y="444" font-size="10" fill="#444">GEMM 逼近 cuBLAS 的关键</text>
  <text x="640" y="460" font-size="10" fill="#444">FlashAttention 的 QK^T / PV</text>

  <!-- summary table -->
  <g filter="url(#sk2)">
    <rect x="40" y="496" width="860" height="146" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="60" y="518" font-size="12" font-weight="bold" fill="#2b2b2b">原语 ↔ CUDA 等价 ↔ 自动优化</text>
    <text x="60" y="540" font-size="11" fill="#444">tl.load(ptr, mask, other)  ≡  if(i&lt;N) x=ptr[i] + float4 reinterpret  →  coalesced + 向量化 + 软流水</text>
    <text x="60" y="558" font-size="11" fill="#444">tl.store(ptr, val, mask)   ≡  if(i&lt;N) ptr[i]=y                            →  同上</text>
    <text x="60" y="576" font-size="11" fill="#444">tl.max(x, axis=0)          ≡  blockReduceMax（60 行手写）              →  warp shuffle + smem 两级</text>
    <text x="60" y="594" font-size="11" fill="#444">tl.sum(x, axis=0)          ≡  blockReduceSum（60 行手写）              →  同上</text>
    <text x="60" y="612" font-size="11" fill="#444">tl.dot(a, b, acc)          ≡  wmma / mma PTX 指令                      →  自动调用 Tensor Core</text>
    <text x="60" y="632" font-size="11" fill="#b03a3a">90% 的 kernel 逻辑由这四个原语搭建——掌握它们就掌握了 Triton 核心</text>
  </g>
</svg>
