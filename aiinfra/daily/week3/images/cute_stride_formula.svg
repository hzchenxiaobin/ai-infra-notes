<svg xmlns="http://www.w3.org/2000/svg" width="520" height="130" viewBox="0 0 520 130" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="520" height="130" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">Stride 映射：逻辑坐标 → 物理偏移</text>
  <path d="M 150 32 Q 260 38 370 32" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="70" y="48" width="380" height="44" rx="6" fill="#fff8e1" stroke="#e8a838" stroke-width="1.2"/>
  </g>
  <text x="260" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d18" font-family="monospace">物理偏移 = i × stride[0] + j × stride[1]</text>

  <!-- coordinate labels -->
  <g filter="url(#sk)">
    <rect x="70" y="100" width="180" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <text x="160" y="115" text-anchor="middle" font-size="10" fill="#1b5e8c">逻辑坐标 (i, j)</text>

  <text x="262" y="115" text-anchor="middle" font-size="13" fill="#888">→</text>

  <g filter="url(#sk)">
    <rect x="270" y="100" width="180" height="22" rx="4" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="0.8"/>
  </g>
  <text x="360" y="115" text-anchor="middle" font-size="10" fill="#1b5e3a">物理偏移（内存地址）</text>
</svg>
