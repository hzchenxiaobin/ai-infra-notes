<svg xmlns="http://www.w3.org/2000/svg" width="780" height="210" viewBox="0 0 780 210" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="780" height="210" fill="#fdfcf7"/>

  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Double Buffer：Load 与 Compute 重叠</text>
  <path d="M 240 36 Q 390 44 540 36" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- overlap columns (green translucent, drawn first) -->
  <g filter="url(#sk)">
    <rect x="215" y="66" width="110" height="98" rx="6" fill="#eaf6ee" fill-opacity="0.45" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="325" y="66" width="110" height="98" rx="6" fill="#eaf6ee" fill-opacity="0.45" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="435" y="66" width="110" height="98" rx="6" fill="#eaf6ee" fill-opacity="0.45" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="270" y="61" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">↑重叠</text>
  <text x="380" y="61" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">↑重叠</text>

  <!-- lane labels -->
  <text x="94" y="93" text-anchor="end" font-size="11" fill="#666" font-weight="bold">加载</text>
  <text x="94" y="145" text-anchor="end" font-size="11" fill="#666" font-weight="bold">计算</text>

  <!-- Lane 1: continuous load blocks -->
  <g filter="url(#sk)">
    <rect x="105" y="72" width="110" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="215" y="72" width="110" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="325" y="72" width="110" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="435" y="72" width="110" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="160" y="94" text-anchor="middle" font-size="12" fill="#7a5415">load_0</text>
  <text x="270" y="94" text-anchor="middle" font-size="12" fill="#7a5415">load_1</text>
  <text x="380" y="94" text-anchor="middle" font-size="12" fill="#7a5415">load_2</text>
  <text x="490" y="94" text-anchor="middle" font-size="12" fill="#7a5415">load_3</text>
  <text x="555" y="94" font-size="14" fill="#888">…</text>
  <text x="595" y="94" font-size="10" fill="#c98a2b" font-weight="bold">← 持续加载</text>

  <!-- Lane 2: initial idle + continuous compute -->
  <g filter="url(#sk)">
    <rect x="105" y="124" width="110" height="34" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>
  <text x="160" y="146" text-anchor="middle" font-size="10" fill="#999">等待</text>

  <g filter="url(#sk)">
    <rect x="215" y="124" width="110" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="325" y="124" width="110" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="435" y="124" width="110" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#2b6e9e">compute_0</text>
  <text x="380" y="146" text-anchor="middle" font-size="12" fill="#2b6e9e">compute_1</text>
  <text x="490" y="146" text-anchor="middle" font-size="12" fill="#2b6e9e">compute_2</text>
  <text x="555" y="146" font-size="14" fill="#888">…</text>
  <text x="595" y="146" font-size="10" fill="#4a8edb" font-weight="bold">← 持续计算</text>

  <!-- time arrow -->
  <path d="M 105 180 L 685 180" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="695" y="184" font-size="10" fill="#888">时间</text>

  <text x="390" y="202" text-anchor="middle" font-size="10" fill="#aaa">load_0 + Σ max(load, compute) · load[k+1] 与 compute[k] 并行</text>
</svg>
