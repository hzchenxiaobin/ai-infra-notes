<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Consolas, 'Courier New', monospace">
  <rect width="720" height="380" fill="#f8f9fa" rx="8" stroke="#e0e0e0" stroke-width="1"/>

  <text x="30" y="35" font-size="14" fill="#1a1a2e">
    实际 AI = 2×M×N×K / (重复加载后的实际 Bytes)
  </text>

  <text x="30" y="70" font-size="14" fill="#1a1a2e">
    Day 1 实际 Bytes ≈ <tspan fill="#e94560" font-weight="bold">4× 理论 Bytes</tspan>（每 warp 独立加载）
  </text>

  <text x="30" y="105" font-size="14" fill="#1a1a2e">
    实际 AI ≈ 1365 / 4 ≈ <tspan fill="#0f3460" font-weight="bold">341 FLOP/Byte</tspan>
  </text>

  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#e94560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M1,1 L5,8 L9,1" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="370" y1="100" x2="430" y2="100" stroke="#e94560" stroke-width="2" marker-end="url(#arrowRight)"/>
  <text x="440" y="105" font-size="13" fill="#e94560" font-style="italic">仍算力 bound？</text>

  <line x1="360" y1="120" x2="360" y2="160" stroke="#999" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDown)"/>

  <rect x="30" y="170" width="660" height="50" fill="#fff3cd" rx="6" stroke="#ffc107" stroke-width="1"/>
  <text x="45" y="195" font-size="13" fill="#856404" font-weight="bold">
    ✗ 不对——Day 1 的 fragment load 不经过 L2 cache 优化
  </text>
  <text x="45" y="212" font-size="13" fill="#856404">
    实际 HBM 访问模式极差，effective BW 远低于峰值
  </text>

  <line x1="360" y1="225" x2="360" y2="265" stroke="#999" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDown)"/>

  <rect x="30" y="275" width="660" height="45" fill="#d4edda" rx="6" stroke="#28a745" stroke-width="1"/>
  <text x="45" y="304" font-size="14" fill="#155724" font-weight="bold">
    ✓ Day 1 是 "低效带宽 bound"
  </text>

  <line x1="360" y1="325" x2="360" y2="355" stroke="#28a745" stroke-width="0" />
</svg>
