<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">WMMA GEMM Grid 映射：Grid → Block → Warp → Tile</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- Left: C matrix grid of tiles -->
  <text x="240" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">C[M, N] 被 Grid 覆盖</text>
  <g filter="url(#sk2)">
    <rect x="60" y="92" width="360" height="300" rx="6" fill="#f0ede4" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="240" y="88" text-anchor="middle" font-size="10" fill="#888">Grid = (N/16, M/16)</text>
  <!-- tile grid -->
  <g font-size="8" fill="#666">
    <g filter="url(#sk2)"><rect x="68" y="100" width="56" height="50" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="96" y="128" text-anchor="middle">block(0,0)</text></g>
    <g filter="url(#sk2)"><rect x="126" y="100" width="56" height="50" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="154" y="128" text-anchor="middle">block(0,1)</text></g>
    <g filter="url(#sk2)"><rect x="184" y="100" width="56" height="50" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="212" y="128" text-anchor="middle">block(0,2)</text></g>
    <text x="270" y="128" font-size="10" fill="#888">...</text>
    <g filter="url(#sk2)"><rect x="352" y="100" width="56" height="50" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="380" y="126" text-anchor="middle">block(0,</text><text x="380" y="138" text-anchor="middle">N/16)</text></g>
    <g filter="url(#sk2)"><rect x="68" y="152" width="56" height="50" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="96" y="180" text-anchor="middle">block(1,0)</text></g>
    <text x="160" y="180" font-size="10" fill="#888">...</text>
    <g filter="url(#sk2)"><rect x="68" y="332" width="56" height="50" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="96" y="358" text-anchor="middle">block(</text><text x="96" y="370" text-anchor="middle">M/16,0)</text></g>
    <text x="160" y="360" font-size="10" fill="#888">...</text>
  </g>
  <!-- highlight one block -->
  <g filter="url(#sk2)"><rect x="68" y="100" width="56" height="50" fill="none" stroke="#b03a3a" stroke-width="2.5" stroke-dasharray="3 2"/></g>

  <!-- arrow to detail -->
  <path d="M 420 125 L 460 125" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar3)"/>
  <text x="440" y="118" text-anchor="middle" font-size="9" fill="#888">zoom</text>

  <!-- Right: Block detail -->
  <text x="680" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">1 个 Block 的内部结构</text>
  <g filter="url(#sk2)">
    <rect x="470" y="92" width="420" height="300" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>

  <!-- Block box -->
  <g filter="url(#sk2)">
    <rect x="500" y="108" width="360" height="60" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="680" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e8c">Block (blockIdx.y, blockIdx.x)</text>
  <text x="680" y="150" text-anchor="middle" font-size="10" fill="#444">dim3 block(32, 1) — 含 1 个 warp（32 threads）</text>

  <!-- arrow down -->
  <path d="M 680 170 L 680 186" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar3)"/>

  <!-- Warp box -->
  <g filter="url(#sk2)">
    <rect x="500" y="190" width="360" height="60" rx="6" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.2"/>
  </g>
  <text x="680" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5a1a">Warp（32 threads 协作）</text>
  <text x="680" y="232" text-anchor="middle" font-size="10" fill="#444">warpM = blockIdx.y, warpN = blockIdx.x</text>

  <!-- arrow down -->
  <path d="M 680 252 L 680 268" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar3)"/>

  <!-- Tile box -->
  <g filter="url(#sk2)">
    <rect x="500" y="272" width="360" height="60" rx="6" fill="#fdecec" stroke="#b03a3a" stroke-width="1.2"/>
  </g>
  <text x="680" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828">输出 Tile：C 的 16×16 子矩阵</text>
  <text x="680" y="314" text-anchor="middle" font-size="10" fill="#444">C[warpM*16 : warpM*16+16, warpN*16 : warpN*16+16]</text>

  <!-- arrow down -->
  <path d="M 680 334 L 680 350" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar3)"/>

  <!-- K loop -->
  <g filter="url(#sk2)">
    <rect x="500" y="354" width="360" height="30" rx="6" fill="#fff3cf" stroke="#e8a838" stroke-width="1.2"/>
  </g>
  <text x="680" y="374" text-anchor="middle" font-size="10" fill="#8a6d18" font-family="monospace">for (k=0; k&lt;K; k+=16): load A tile (16×16) + B tile (16×16) → mma_sync</text>

  <!-- Bottom note -->
  <g filter="url(#sk2)">
    <rect x="40" y="404" width="860" height="44" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="424" font-size="11" fill="#444">每个 block 含 1 个 warp（32 threads），协作计算 C 的一个 16×16 tile</text>
  <text x="60" y="440" font-size="10" fill="#888">K 维循环：每次加载 16×16 的 A tile 和 16×16 的 B tile，执行 mma_sync 累加</text>
</svg>
