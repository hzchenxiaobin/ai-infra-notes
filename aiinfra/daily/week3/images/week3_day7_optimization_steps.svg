<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">手写 GEMM 优化链：30% → 95%</text>
  <path d="M 200 36 Q 340 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="56" width="560" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="80" y="84" font-size="14" font-weight="bold" fill="#2e5a1a">30% → 42%</text>
  <text x="180" y="84" font-size="11" fill="#444">shared memory tiling（减少 HBM 访问）</text>
  <text x="540" y="84" font-size="10" fill="#4a8e4a" font-weight="bold">[实测]</text>

  <path d="M 340 102 L 340 126" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="130" width="560" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="80" y="158" font-size="14" font-weight="bold" fill="#1b5e8c">42% → ~50%</text>
  <text x="190" y="158" font-size="11" fill="#444">mma.sync + ldmatrix（消除 WMMA 开销）</text>
  <text x="540" y="158" font-size="10" fill="#4a8edb" font-weight="bold">[预估]</text>

  <path d="M 340 176 L 340 200" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="204" width="560" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="80" y="232" font-size="14" font-weight="bold" fill="#1b5e8c">~50% → ~55%</text>
  <text x="200" y="232" font-size="11" fill="#444">double buffer + cp.async（重叠 load/compute）</text>
  <text x="540" y="232" font-size="10" fill="#4a8edb" font-weight="bold">[预估]</text>

  <path d="M 340 250 L 340 274" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="60" y="278" width="560" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="80" y="306" font-size="14" font-weight="bold" fill="#7a5415">~55% → 85%</text>
  <text x="195" y="306" font-size="11" fill="#444">K 分割并行 + swizzle + 3-stage pipeline</text>

  <path d="M 340 324 L 340 348" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 5 -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="560" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="80" y="380" font-size="14" font-weight="bold" fill="#2e5a1a">85% → 95%</text>
  <text x="180" y="380" font-size="11" fill="#444">auto-tuning + epilogue fusion + 寄存器精算</text>
</svg>
