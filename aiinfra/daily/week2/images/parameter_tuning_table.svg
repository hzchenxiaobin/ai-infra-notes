<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" fill="#444" font-weight="bold">参数精调扫描表</text>
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#888">绿=正向收益，红=溢出/负向，橙=寄存器偏高</text>

    <g transform="translate(40, 64)">
      <rect x="0" y="0" width="680" height="34" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">TM×TN</text>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">1024 矩阵</text>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">2048 矩阵</text>
      <text x="480" y="22" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">4096 矩阵</text>
      <text x="620" y="22" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">Register</text>
    </g>

    <g transform="translate(40, 98)">
      <rect x="0" y="0" width="680" height="34" fill="#e8f0fe" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8×8</text>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">基准</text>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">基准</text>
      <text x="480" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">基准</text>
      <text x="620" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">~88</text>
    </g>
    <g transform="translate(40, 132)">
      <rect x="0" y="0" width="680" height="34" fill="#f6f6f6" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">8×16</text>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">+5%</text>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">+8%</text>
      <text x="480" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">+10%</text>
      <text x="620" y="22" text-anchor="middle" font-size="12" fill="#d6a040">~152</text>
    </g>
    <g transform="translate(40, 166)">
      <rect x="0" y="0" width="680" height="34" fill="#f6f6f6" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">16×8</text>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">+3%</text>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">+5%</text>
      <text x="480" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">+8%</text>
      <text x="620" y="22" text-anchor="middle" font-size="12" fill="#d6a040">~152</text>
    </g>
    <g transform="translate(40, 200)">
      <rect x="0" y="0" width="680" height="34" fill="#fce4ec" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">16×16</text>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">SPILL!</text>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">SPILL!</text>
      <text x="480" y="22" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">SPILL!</text>
      <text x="620" y="22" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">~256</text>
    </g>

    <g transform="translate(40, 234)">
      <rect x="0" y="0" width="680" height="34" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">BK 扫描（固定 TM=TN=8）</text>
    </g>

    <g transform="translate(40, 268)">
      <rect x="0" y="0" width="680" height="34" fill="#f6f6f6" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">BK=4</text>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">-2%</text>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">+3%</text>
      <text x="480" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">+5%</text>
      <text x="620" y="22" text-anchor="middle" font-size="12" fill="#4a7a3a">smem↓</text>
    </g>
    <g transform="translate(40, 302)">
      <rect x="0" y="0" width="680" height="34" fill="#e8f0fe" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">BK=8</text>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">基准</text>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">基准</text>
      <text x="480" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">基准</text>
      <text x="620" y="22" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">~88</text>
    </g>
    <g transform="translate(40, 336)">
      <rect x="0" y="0" width="680" height="34" fill="#fff8e1" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
      <text x="80" y="22" text-anchor="middle" font-size="12" fill="#d6a040">BK=16</text>
      <text x="200" y="22" text-anchor="middle" font-size="12" fill="#d6a040">+1%</text>
      <text x="340" y="22" text-anchor="middle" font-size="12" fill="#d6a040">+2%</text>
      <text x="480" y="22" text-anchor="middle" font-size="12" fill="#d6a040">+3%</text>
      <text x="620" y="22" text-anchor="middle" font-size="12" fill="#d6a040">smem↑</text>
    </g>

  <text x="380" y="398" text-anchor="middle" font-size="12" fill="#888">精调步骤：先扫 TM×TN → 再扫 BK → 最后扫 BM/BN</text>
</svg>