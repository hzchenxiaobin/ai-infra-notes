<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <symbol id="folder" viewBox="0 0 18 14">
      <path d="M 0 2 L 6 2 L 8 0 L 18 0 L 18 12 L 0 12 Z" fill="#dbe8f6" stroke="#4a8edb" stroke-width="1.1"/>
    </symbol>
    <symbol id="filecu" viewBox="0 0 14 16">
      <path d="M 0 0 L 9 0 L 14 5 L 14 16 L 0 16 Z" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.1"/>
      <path d="M 9 0 L 9 5 L 14 5" fill="none" stroke="#4a8e4a" stroke-width="1.1"/>
    </symbol>
    <symbol id="filemd" viewBox="0 0 14 16">
      <path d="M 0 0 L 9 0 L 14 5 L 14 16 L 0 16 Z" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/>
      <path d="M 9 0 L 9 5 L 14 5" fill="none" stroke="#999" stroke-width="1.1"/>
    </symbol>
    <symbol id="note" viewBox="0 0 16 16">
      <path d="M 8 0 L 16 14 L 0 14 Z" fill="#fff3cd" stroke="#c98a2b" stroke-width="1.1"/>
      <text x="8" y="12" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">!</text>
    </symbol>
  </defs>

  <rect width="780" height="470" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Week 2 仓库实际结构</text>
  <path d="M 250 40 Q 390 48 530 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11" fill="#888">按天分目录 · kernel 在各天的 kernels/ 下</text>

  <!-- Tree container -->
  <rect x="30" y="68" width="720" height="388" rx="10" fill="#fffef9" stroke="#ddd" stroke-width="1.2" filter="url(#sk)"/>

  <!-- Vertical tree trunk at x=72 -->
  <line x1="72" y1="100" x2="72" y2="424" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>

  <!-- Row 1: week2/ (root folder) -->
  <use href="#folder" x="50" y="88" width="18" height="14"/>
  <text x="74" y="100" font-size="14" font-weight="bold" fill="#2b6e9e">week2/</text>
  <text x="730" y="100" text-anchor="end" font-size="11" fill="#888">根目录</text>

  <!-- Row 2: README.md -->
  <line x1="72" y1="128" x2="92" y2="128" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>
  <use href="#filemd" x="92" y="121" width="14" height="16"/>
  <text x="112" y="133" font-size="13" fill="#555" font-family="monospace">README.md</text>
  <text x="730" y="133" text-anchor="end" font-size="11" fill="#888">本周教程</text>

  <!-- Row 3: day1/kernels/warp_reduce.cu -->
  <line x1="72" y1="164" x2="92" y2="164" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>
  <use href="#filecu" x="92" y="157" width="14" height="16"/>
  <text x="112" y="169" font-size="13" fill="#2e6e2e" font-family="monospace">day1/kernels/warp_reduce.cu</text>
  <text x="730" y="169" text-anchor="end" font-size="11" fill="#888">Day 1 产出</text>

  <!-- Row 4: day2/kernels/register_blocking_gemm.cu -->
  <line x1="72" y1="200" x2="92" y2="200" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>
  <use href="#filecu" x="92" y="193" width="14" height="16"/>
  <text x="112" y="205" font-size="13" fill="#2e6e2e" font-family="monospace">day2/kernels/register_blocking_gemm.cu</text>
  <text x="730" y="205" text-anchor="end" font-size="11" fill="#888">Day 2 产出</text>

  <!-- Row 5: day3/kernels/multi_stream_pipeline.cu -->
  <line x1="72" y1="236" x2="92" y2="236" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>
  <use href="#filecu" x="92" y="229" width="14" height="16"/>
  <text x="112" y="241" font-size="13" fill="#2e6e2e" font-family="monospace">day3/kernels/multi_stream_pipeline.cu</text>
  <text x="730" y="241" text-anchor="end" font-size="11" fill="#888">Day 3 产出</text>

  <!-- Row 6: CUTLASS note -->
  <line x1="72" y1="272" x2="92" y2="272" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#sk)"/>
  <use href="#note" x="92" y="265" width="16" height="16"/>
  <text x="116" y="277" font-size="12" fill="#7a5415" font-style="italic">CUTLASS 已移至 Week 2 Day 7</text>
  <rect x="116" y="280" width="220" height="2" fill="#c98a2b" opacity="0.3" filter="url(#sk)"/>

  <!-- Row 7: day5/kernels/flash_attention.cu -->
  <line x1="72" y1="308" x2="92" y2="308" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>
  <use href="#filecu" x="92" y="301" width="14" height="16"/>
  <text x="112" y="313" font-size="13" fill="#2e6e2e" font-family="monospace">day5/kernels/flash_attention.cu</text>
  <text x="730" y="313" text-anchor="end" font-size="11" fill="#888">Day 5 产出</text>

  <!-- Row 8: day6/kernels/ -->
  <line x1="72" y1="344" x2="92" y2="344" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>
  <use href="#folder" x="92" y="338" width="18" height="14"/>
  <text x="116" y="349" font-size="13" fill="#2b6e9e" font-family="monospace">day6/kernels/</text>
  <text x="730" y="349" text-anchor="end" font-size="10" fill="#888">Day 6 产出（gemm_optimization_series /</text>
  <text x="730" y="361" text-anchor="end" font-size="10" fill="#888">integrated_gemm / integrated_gemm_leetgpu）</text>

  <!-- Row 9: WMMA note -->
  <line x1="72" y1="380" x2="92" y2="380" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#sk)"/>
  <use href="#note" x="92" y="373" width="16" height="16"/>
  <text x="116" y="385" font-size="12" fill="#7a5415" font-style="italic">WMMA 已移至 Week 2 Day 6</text>
  <rect x="116" y="388" width="196" height="2" fill="#c98a2b" opacity="0.3" filter="url(#sk)"/>

  <!-- Row 10: day7/ (last, uses └──) -->
  <line x1="72" y1="416" x2="92" y2="416" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>
  <use href="#folder" x="92" y="410" width="18" height="14"/>
  <text x="116" y="421" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">day7/</text>
  <text x="730" y="421" text-anchor="end" font-size="11" fill="#888">Day 7 手撕与总结（本目录）</text>

  <!-- Legend -->
  <rect x="40" y="442" width="14" height="16" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1" rx="2" filter="url(#sk)"/>
  <text x="60" y="454" font-size="10" fill="#666">.cu kernel</text>
  <rect x="140" y="442" width="14" height="16" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="2" filter="url(#sk)"/>
  <text x="160" y="454" font-size="10" fill="#666">README</text>
  <rect x="230" y="442" width="18" height="14" fill="#dbe8f6" stroke="#4a8edb" stroke-width="1" rx="2" filter="url(#sk)"/>
  <text x="254" y="454" font-size="10" fill="#666">目录</text>
  <use href="#note" x="310" y="442" width="16" height="16"/>
  <text x="332" y="454" font-size="10" fill="#666">迁移说明</text>
</svg>
