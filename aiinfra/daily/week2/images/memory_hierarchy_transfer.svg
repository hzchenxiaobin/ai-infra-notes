      <rect x="44.0" y="31" width="80.0" height="30" rx="3" fill="#4a7a3a" opacity="0.32" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
      <text x="84.0" y="49.0" text-anchor="middle" font-size="10" fill="#4a7a3a">S0</text>
      <rect x="128.0" y="31" width="80.0" height="30" rx="3" fill="#4a7a3a" opacity="0.32" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
      <text x="168.0" y="49.0" text-anchor="middle" font-size="10" fill="#4a7a3a">S1</text>
      <rect x="212.0" y="31" width="80.0" height="30" rx="3" fill="#4a7a3a" opacity="0.32" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
      <text x="252.0" y="49.0" text-anchor="middle" font-size="10" fill="#4a7a3a">S2</text>
      <rect x="296.0" y="31" width="80.0" height="30" rx="3" fill="#4a7a3a" opacity="0.32" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
      <text x="336.0" y="49.0" text-anchor="middle" font-size="10" fill="#4a7a3a">S3</text>
      <text x="34" y="49.0" text-anchor="end" font-size="10" fill="#888">CL0</text>
      <text x="388" y="49.0" font-size="10" fill="#4a7a3a">128B</text>
      <rect x="40" y="80" width="340" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="44.0" y="85" width="80.0" height="30" rx="3" fill="#4a7a3a" opacity="0.32" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
      <text x="84.0" y="103.0" text-anchor="middle" font-size="10" fill="#4a7a3a">S0</text>
      <rect x="128.0" y="85" width="80.0" height="30" rx="3" fill="#4a7a3a" opacity="0.32" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
      <text x="168.0" y="103.0" text-anchor="middle" font-size="10" fill="#4a7a3a">S1</text>
      <rect x="212.0" y="85" width="80.0" height="30" rx="3" fill="#4a7a3a" opacity="0.32" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
      <text x="252.0" y="103.0" text-anchor="middle" font-size="10" fill="#4a7a3a">S2</text>
      <rect x="296.0" y="85" width="80.0" height="30" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.55"/>
      <text x="336.0" y="103.0" text-anchor="middle" font-size="9" fill="#bbb">空</text>
      <text x="34" y="103.0" text-anchor="end" font-size="10" fill="#888">CL1</text>
      <text x="388" y="103.0" font-size="10" fill="#4a7a3a">3 sector 已驻留</text>
    <text x="40" y="140" font-size="10" fill="#888">L1 miss 后向 L2 取，L2 同样按 sector 粒度向 L1 供给</text>
  </g>

  <!-- Arrow 3: DRAM -> L2 -->
  <line x1="420" y1="574" x2="420" y2="524" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="542" font-size="11" fill="#4a7a3a" font-weight="bold">sector 32B</text>
  <text x="432" y="556" font-size="10" fill="#888">整 sector 搬运，哪怕线程只用 4B</text>

