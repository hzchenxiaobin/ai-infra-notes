<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 740" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="780" height="740" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" fill="#444" font-weight="bold">GPU 访存层次：Cache Line、Sector 与搬运单位</text>
  <text x="390" y="52" text-anchor="middle" font-size="11" fill="#888">DRAM → L2 → L1 → Register：存储按 cache line（128B），传输按 sector（32B）</text>

  <!-- Register layer -->
  <g transform="translate(150, 64)">
    <text x="0" y="0" font-size="13" fill="#d6a040" font-weight="bold">Register File · 每线程私有</text>
    <rect x="0" y="8" width="540" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="48.0" y="22" width="52" height="26" rx="4" fill="#d6a040" opacity="0.25" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
      <text x="74.0" y="39" text-anchor="middle" font-size="10" fill="#d6a040">r0</text>
      <rect x="104.0" y="22" width="52" height="26" rx="4" fill="#d6a040" opacity="0.25" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
      <text x="130.0" y="39" text-anchor="middle" font-size="10" fill="#d6a040">r1</text>
      <rect x="160.0" y="22" width="52" height="26" rx="4" fill="#d6a040" opacity="0.25" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
      <text x="186.0" y="39" text-anchor="middle" font-size="10" fill="#d6a040">r2</text>
      <rect x="216.0" y="22" width="52" height="26" rx="4" fill="#d6a040" opacity="0.25" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
      <text x="242.0" y="39" text-anchor="middle" font-size="10" fill="#d6a040">r3</text>
      <rect x="272.0" y="22" width="52" height="26" rx="4" fill="#d6a040" opacity="0.25" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
      <text x="298.0" y="39" text-anchor="middle" font-size="10" fill="#d6a040">r4</text>
      <rect x="328.0" y="22" width="52" height="26" rx="4" fill="#d6a040" opacity="0.25" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
      <text x="354.0" y="39" text-anchor="middle" font-size="10" fill="#d6a040">r5</text>
      <rect x="384.0" y="22" width="52" height="26" rx="4" fill="#d6a040" opacity="0.25" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
      <text x="410.0" y="39" text-anchor="middle" font-size="10" fill="#d6a040">r6</text>
      <rect x="440.0" y="22" width="52" height="26" rx="4" fill="#d6a040" opacity="0.25" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
      <text x="466.0" y="39" text-anchor="middle" font-size="10" fill="#d6a040">r7</text>
  </g>

  <!-- Arrow 1: L1 -> Register -->
  <line x1="420" y1="182" x2="420" y2="132" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="150" font-size="11" fill="#d6a040" font-weight="bold">LDG.128 = 16B（float4）</text>
  <text x="432" y="164" font-size="10" fill="#888">LDG.32 = 4B｜指令宽度由代码决定</text>

  <!-- L1 Cache layer -->
  <g transform="translate(150, 176)">
    <text x="0" y="0" font-size="13" fill="#446688" font-weight="bold">L1 Cache · 每 SM 私有 · 按 cache line（128B = 4 sector）组织</text>
    <rect x="0" y="8" width="540" height="140" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="40" y="26" width="340" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="44.0" y="31" width="80.0" height="30" rx="3" fill="#446688" opacity="0.32" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
      <text x="84.0" y="49.0" text-anchor="middle" font-size="10" fill="#446688">S0</text>
      <rect x="128.0" y="31" width="80.0" height="30" rx="3" fill="#446688" opacity="0.32" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
      <text x="168.0" y="49.0" text-anchor="middle" font-size="10" fill="#446688">S1</text>
      <rect x="212.0" y="31" width="80.0" height="30" rx="3" fill="#446688" opacity="0.32" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
      <text x="252.0" y="49.0" text-anchor="middle" font-size="10" fill="#446688">S2</text>
      <rect x="296.0" y="31" width="80.0" height="30" rx="3" fill="#446688" opacity="0.32" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
      <text x="336.0" y="49.0" text-anchor="middle" font-size="10" fill="#446688">S3</text>
      <text x="34" y="49.0" text-anchor="end" font-size="10" fill="#888">CL0</text>
      <text x="388" y="49.0" font-size="10" fill="#446688">✓ 完整 128B</text>
      <rect x="40" y="80" width="340" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="44.0" y="85" width="80.0" height="30" rx="3" fill="#ffffff" stroke="#446688" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.55"/>
      <text x="84.0" y="103.0" text-anchor="middle" font-size="9" fill="#bbb">空</text>
      <rect x="128.0" y="85" width="80.0" height="30" rx="3" fill="#ffffff" stroke="#446688" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.55"/>
      <text x="168.0" y="103.0" text-anchor="middle" font-size="9" fill="#bbb">空</text>
      <rect x="212.0" y="85" width="80.0" height="30" rx="3" fill="#446688" opacity="0.32" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
      <text x="252.0" y="103.0" text-anchor="middle" font-size="10" fill="#446688">S2</text>
      <rect x="296.0" y="85" width="80.0" height="30" rx="3" fill="#ffffff" stroke="#446688" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.55"/>
      <text x="336.0" y="103.0" text-anchor="middle" font-size="9" fill="#bbb">空</text>
      <text x="34" y="103.0" text-anchor="end" font-size="10" fill="#888">CL1</text>
      <text x="388" y="103.0" font-size="10" fill="#446688">只 1 sector 驻留</text>
    <text x="40" y="140" font-size="10" fill="#888">虚线扇区 = 该 sector 未被触达，位置留空（按 sector 填充，不必整行搬运）</text>
  </g>

  <!-- Arrow 2: L2 -> L1 -->
  <line x1="420" y1="378" x2="420" y2="328" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="346" font-size="11" fill="#446688" font-weight="bold">sector 32B</text>
  <text x="432" y="360" font-size="10" fill="#888">传输原子单位，不可再分</text>

  <!-- L2 Cache layer -->
  <g transform="translate(150, 372)">
    <text x="0" y="0" font-size="13" fill="#4a7a3a" font-weight="bold">L2 Cache · 所有 SM 共享 · 按 cache line（128B = 4 sector）组织</text>
