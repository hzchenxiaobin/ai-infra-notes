<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="860" height="420" fill="#fafafa"/>

  <text x="430" y="26" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">Warp Reduce 5 步通信过程（32 lane, log₂32 = 5）</text>
  <text x="430" y="44" text-anchor="middle" font-size="11" fill="#888">__shfl_down_sync 折半累加：每步 offset 减半，活跃 lane 减半</text>

  <!-- Column headers -->
  <g font-size="10" fill="#888" font-weight="bold">
    <text x="40" y="68">步骤</text>
    <text x="120" y="68">offset</text>
    <text x="210" y="68">32 lane 活跃状态（橙色=活跃，灰色=不活跃）</text>
    <text x="560" y="68">配对详情</text>
    <text x="790" y="68">活跃数</text>
  </g>

  <!-- Lane number scale (below header) -->
  <g font-size="8" fill="#aaa">
    <text x="210" y="82" text-anchor="middle">0</text>
    <text x="290" y="82" text-anchor="middle">8</text>
    <text x="370" y="82" text-anchor="middle">16</text>
    <text x="450" y="82" text-anchor="middle">24</text>
    <text x="528" y="82" text-anchor="middle">31</text>
  </g>

  <!-- ===== Step 1: offset=16, 16 active (lane 0-15) ===== -->
  <text x="40" y="104" font-size="12" fill="#d6a040" font-weight="bold">Step 1</text>
  <text x="120" y="104" font-family="monospace" font-size="13" fill="#d6a040" font-weight="bold">16</text>
  <!-- inactive background (full 32) -->
  <rect x="210" y="90" width="320" height="18" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- active portion (lane 0-15 = 160px) -->
  <rect x="210" y="90" width="160" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <!-- offset bracket: from lane 0 to lane 16 -->
  <path d="M 210 112 L 210 118 L 370 118 L 370 112" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="290" y="130" text-anchor="middle" font-size="8" fill="#d6a040">offset=16</text>
  <!-- pairing text -->
  <text x="560" y="104" font-size="10" fill="#555">lane0←lane16, lane1←lane17</text>
  <text x="560" y="118" font-size="10" fill="#888">... lane15←lane31</text>
  <text x="790" y="104" font-size="11" fill="#d6a040" font-weight="bold">16</text>

  <!-- ===== Step 2: offset=8, 8 active (lane 0-7) ===== -->
  <text x="40" y="156" font-size="12" fill="#d6a040" font-weight="bold">Step 2</text>
  <text x="120" y="156" font-family="monospace" font-size="13" fill="#d6a040" font-weight="bold">8</text>
  <rect x="210" y="142" width="320" height="18" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="210" y="142" width="80" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <path d="M 210 164 L 210 170 L 290 170 L 290 164" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="250" y="182" text-anchor="middle" font-size="8" fill="#d6a040">offset=8</text>
  <text x="560" y="156" font-size="10" fill="#555">lane0←lane8, lane1←lane9</text>
  <text x="560" y="170" font-size="10" fill="#888">... lane7←lane15</text>
  <text x="790" y="156" font-size="11" fill="#d6a040" font-weight="bold">8</text>

  <!-- ===== Step 3: offset=4, 4 active (lane 0-3) ===== -->
  <text x="40" y="208" font-size="12" fill="#d6a040" font-weight="bold">Step 3</text>
  <text x="120" y="208" font-family="monospace" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <rect x="210" y="194" width="320" height="18" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="210" y="194" width="40" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <path d="M 210 216 L 210 222 L 250 222 L 250 216" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="230" y="234" text-anchor="middle" font-size="8" fill="#d6a040">offset=4</text>
  <text x="560" y="208" font-size="10" fill="#555">lane0←lane4, lane1←lane5</text>
  <text x="560" y="222" font-size="10" fill="#888">lane2←lane6, lane3←lane7</text>
  <text x="790" y="208" font-size="11" fill="#d6a040" font-weight="bold">4</text>

  <!-- ===== Step 4: offset=2, 2 active (lane 0-1) ===== -->
  <text x="40" y="260" font-size="12" fill="#d6a040" font-weight="bold">Step 4</text>
  <text x="120" y="260" font-family="monospace" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <rect x="210" y="246" width="320" height="18" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="210" y="246" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <path d="M 210 268 L 210 274 L 230 274 L 230 268" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="220" y="286" text-anchor="middle" font-size="8" fill="#d6a040">offset=2</text>
  <text x="560" y="260" font-size="10" fill="#555">lane0←lane2</text>
  <text x="560" y="274" font-size="10" fill="#888">lane1←lane3</text>
  <text x="790" y="260" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <!-- ===== Step 5: offset=1, 1 active (lane 0) ===== -->
  <text x="40" y="312" font-size="12" fill="#4a7a3a" font-weight="bold">Step 5</text>
  <text x="120" y="312" font-family="monospace" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="210" y="298" width="320" height="18" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="210" y="298" width="10" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <path d="M 210 320 L 210 326 L 220 326 L 220 320" stroke="#4a7a3a" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="215" y="338" text-anchor="middle" font-size="8" fill="#4a7a3a">offset=1</text>
  <text x="560" y="312" font-size="10" fill="#555">lane0←lane1</text>
  <text x="790" y="312" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== Result ===== -->
  <path d="M 215 320 L 215 350" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="354" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="371" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Result: lane 0 持有 32 线程累加和</text>

  <!-- ===== Code snippet ===== -->
  <rect x="400" y="354" width="440" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="414" y="371" font-family="monospace" font-size="10" fill="#333">for (offset = 16; offset &gt; 0; offset &gt;&gt;= 1)  val += __shfl_down_sync(..., offset);</text>

  <!-- ===== Key insight ===== -->
  <rect x="40" y="390" width="800" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="404" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">每步活跃 lane 减半，5 步完成（log₂32），结果只在 lane 0</text>
</svg>
