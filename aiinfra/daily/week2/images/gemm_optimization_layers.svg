<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="780" height="580" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#444" font-weight="bold">GEMM 优化层次：从 1% 到 70%+</text>
  <text x="390" y="52" text-anchor="middle" font-size="11" fill="#888">每叠加一层优化，cuBLAS 占比提升一档</text>

  <!-- 左侧手绘上箭头：性能方向（底=Naive 1%，顶=cuBLAS 100%）-->
  <line x1="52" y1="544" x2="52" y2="78" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="311" font-size="12" fill="#888" font-weight="bold" transform="rotate(-90, 40, 311)" text-anchor="middle">性能 ↑</text>

    <g transform="translate(90, 72)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#f6f6f6" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#888" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">cuBLAS（NVIDIA 官方优化）</text>
      <text x="210" y="29" font-size="11" fill="#777">PTX 内联 + 完整流水线 + Tensor Core + auto-tuning</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">100%</text>
    </g>
    <g transform="translate(90, 126)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#4a7a3a" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">+ Tensor Core / CUTLASS (进阶)</text>
      <text x="210" y="29" font-size="11" fill="#777">WMMA 指令，矩阵乘加硬件加速</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">~90%+</text>
    </g>
    <g transform="translate(90, 180)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#4a7a3a" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">+ 参数 Auto-tuning (进阶)</text>
      <text x="210" y="29" font-size="11" fill="#777">针对不同尺寸选最优 BM/BN/BK/TM/TN</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">~80%+</text>
    </g>
    <g transform="translate(90, 234)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#446688" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">+ Double Buffering</text>
      <text x="210" y="29" font-size="11" fill="#777">软件流水线，计算掩盖传输延迟</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">~70%</text>
    </g>
    <g transform="translate(90, 288)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#446688" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">+ Warp Shuffle 写回优化 (Day 6)</text>
      <text x="210" y="29" font-size="11" fill="#777">Warp 内协作，减少非合并访问</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">~60%</text>
    </g>
    <g transform="translate(90, 342)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#446688" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">+ float4 向量化加载 (Day 6)</text>
      <text x="210" y="29" font-size="11" fill="#777">128-bit load，提升带宽利用率</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">~55%</text>
    </g>
    <g transform="translate(90, 396)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#d6a040" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">+ Register Blocking (Day 2)</text>
      <text x="210" y="29" font-size="11" fill="#777">TM×TN thread tile，累加器驻留寄存器</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">~45%</text>
    </g>
    <g transform="translate(90, 450)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#d6a040" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">+ Shared Memory Tiling</text>
      <text x="210" y="29" font-size="11" fill="#777">A/B tile 预取到 Shared Memory，K 维复用</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">~15%</text>
    </g>
    <g transform="translate(90, 504)">
      <rect x="0" y="0" width="600" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
      <rect x="0" y="0" width="6" height="46" fill="#b85450" opacity="0.6" rx="3" filter="url(#rough2)"/>
      <text x="18" y="29" font-size="13" fill="#444" font-weight="bold">Naive GEMM</text>
      <text x="210" y="29" font-size="11" fill="#777">每线程算 1 元素，直接访问 Global Memory</text>
      <text x="572" y="30" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">~1%</text>
    </g>

  <!-- Day 2 / Day 6 右侧标记 -->
  <line x1="700" y1="419.0" x2="742" y2="419.0" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="752" y="423.0" font-size="10" fill="#d6a040" font-weight="bold" transform="rotate(90, 752, 423.0)" text-anchor="middle">Day 2</text>

  <line x1="700" y1="257.0" x2="742" y2="257.0" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="752" y="261.0" font-size="10" fill="#446688" font-weight="bold" transform="rotate(90, 752, 261.0)" text-anchor="middle">Day 6</text>

  <text x="390" y="562" text-anchor="middle" font-size="12" fill="#888">Day 6 目标：从 ~45%（Day 2）跨越到 70%+</text>
</svg>