<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="820" height="420" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Double Buffering：Prologue / 主循环 / Epilogue</text>
  <path d="M 220 40 Q 410 48 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="410" y="56" text-anchor="middle" font-size="11" fill="#888">两份 shared memory buffer 交替 · cp.async 异步加载 · Load 与 Compute 并行</text>

  <!-- ====== Section backgrounds ====== -->
  <!-- Prologue -->
  <g filter="url(#sk)">
    <rect x="50" y="75" width="170" height="220" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.5"/>
  </g>
  <text x="135" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d3a7e">Prologue</text>

  <!-- 主循环 -->
  <g filter="url(#sk)">
    <rect x="230" y="75" width="310" height="220" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.5"/>
  </g>
  <text x="385" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">主循环 for (k = BK; k &lt; K; k += BK)</text>

  <!-- Epilogue -->
  <g filter="url(#sk)">
    <rect x="550" y="75" width="170" height="220" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.5"/>
  </g>
  <text x="635" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">Epilogue</text>

  <!-- ====== Track labels ====== -->
  <text x="42" y="125" text-anchor="end" font-size="11" font-weight="bold" fill="#c98a2b">Load</text>
  <text x="42" y="205" text-anchor="end" font-size="11" font-weight="bold" fill="#4a8edb">Compute</text>

  <!-- ====== Load track ====== -->
  <!-- Load 0 → Buf0 (prologue) -->
  <g filter="url(#sk)">
    <rect x="70" y="106" width="120" height="32" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="130" y="127" text-anchor="middle" font-size="11" fill="#7a5415">Load 0 → Buf0</text>

  <!-- Load 1 → Buf1 (main loop) -->
  <g filter="url(#sk)">
    <rect x="250" y="106" width="120" height="32" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="310" y="127" text-anchor="middle" font-size="11" fill="#7a5415">Load 1 → Buf1</text>

  <!-- Load 2 → Buf0 (main loop) -->
  <g filter="url(#sk)">
    <rect x="390" y="106" width="120" height="32" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="450" y="127" text-anchor="middle" font-size="11" fill="#7a5415">Load 2 → Buf0</text>

  <!-- ====== Compute track ====== -->
  <!-- Compute 0 ← Buf0 (main loop, overlaps Load 1) -->
  <g filter="url(#sk)">
    <rect x="250" y="186" width="120" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="310" y="207" text-anchor="middle" font-size="11" fill="#2b6e9e">Compute 0 ← Buf0</text>

  <!-- Compute 1 ← Buf1 (main loop, overlaps Load 2) -->
  <g filter="url(#sk)">
    <rect x="390" y="186" width="120" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="450" y="207" text-anchor="middle" font-size="11" fill="#2b6e9e">Compute 1 ← Buf1</text>

  <!-- Compute 2 ← Buf0 (epilogue) -->
  <g filter="url(#sk)">
    <rect x="570" y="186" width="120" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="630" y="207" text-anchor="middle" font-size="11" fill="#2b6e9e">Compute 2 ← Buf0</text>

  <!-- ====== Overlap brackets ====== -->
  <g filter="url(#sk)" fill="none" stroke="#4a8e4a" stroke-width="1.4">
    <path d="M 250 150 L 250 144 L 370 144 L 370 150"/>
    <path d="M 390 150 L 390 144 L 510 144 L 510 150"/>
  </g>
  <text x="310" y="140" text-anchor="middle" font-size="9" fill="#4a8e4a" font-weight="bold">overlap</text>
  <text x="450" y="140" text-anchor="middle" font-size="9" fill="#4a8e4a" font-weight="bold">overlap</text>

  <!-- Dashed lines showing Load→Compute data dependency -->
  <g filter="url(#sk)" fill="none" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="3 2">
    <path d="M 310 138 L 310 186"/>
    <path d="M 450 138 L 450 186"/>
  </g>

  <!-- ====== wait/sync markers ====== -->
  <g filter="url(#sk)">
    <path d="M 195 102 L 195 224" stroke="#888" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 375 102 L 375 224" stroke="#888" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 525 102 L 525 224" stroke="#888" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  </g>
  <text x="199" y="230" font-size="8" fill="#888">wait;sync</text>
  <text x="379" y="230" font-size="8" fill="#888">wait;sync</text>
  <text x="529" y="230" font-size="8" fill="#888">wait;sync</text>

  <!-- ====== Time arrow ====== -->
  <path d="M 50 265 L 730 265" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="740" y="269" font-size="10" fill="#888">时间</text>

  <!-- ====== Section descriptions ====== -->
  <text x="135" y="290" text-anchor="middle" font-size="10" fill="#5d3a7e">预加载第一块</text>
  <text x="135" y="306" text-anchor="middle" font-size="9" fill="#888">否则首次 compute 无数据</text>

  <text x="385" y="290" text-anchor="middle" font-size="10" fill="#2e6e2e">Load[n+1] || Compute[n]</text>
  <text x="385" y="306" text-anchor="middle" font-size="9" fill="#888">异步加载与计算并行</text>

  <text x="635" y="290" text-anchor="middle" font-size="10" fill="#7a5415">计算最后一块</text>
  <text x="635" y="306" text-anchor="middle" font-size="9" fill="#888">末次加载的数据未被 compute</text>

  <!-- ====== Buffer switching note ====== -->
  <g filter="url(#sk)">
    <rect x="200" y="330" width="420" height="32" rx="8" fill="#f4f4f0" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="410" y="351" text-anchor="middle" font-size="11" fill="#555">cur = (cur + 1) % 2 · Buf0 / Buf1 交替使用 · smem 用量翻倍</text>

  <!-- ====== Bottom note ====== -->
  <text x="410" y="390" text-anchor="middle" font-size="10" fill="#888">真双缓冲需要 cp.async（Ampere+）或 TMA（Hopper+）异步拷贝 · 同步实现收益在噪声范围内</text>
  <text x="410" y="406" text-anchor="middle" font-size="9" fill="#aaa">Day 3 实测 v6 同步双缓冲：4096 63.8% vs v5 62.9%（噪声范围内）</text>
</svg>
