<svg xmlns="http://www.w3.org/2000/svg" width="780" height="260" viewBox="0 0 780 260" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="780" height="260" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Load / Compute 串行执行</text>
  <path d="M 230 40 Q 390 48 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11" fill="#888">无重叠 · Load 期间 Compute 闲置 · Compute 期间 Load 闲置</text>

  <!-- Idle annotations (top) -->
  <g filter="url(#sk)" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3">
    <rect x="80" y="72" width="120" height="20" rx="3"/>
    <rect x="340" y="72" width="120" height="20" rx="3"/>
  </g>
  <text x="140" y="86" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">compute 闲置</text>
  <text x="400" y="86" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">compute 闲置</text>

  <!-- Timeline bars -->
  <!-- Load 0 -->
  <g filter="url(#sk)">
    <rect x="80" y="100" width="120" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="140" y="123" text-anchor="middle" font-size="12" fill="#7a5415">Load Tile 0</text>

  <!-- sync 0 -->
  <path d="M 204 96 L 204 140" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="208" y="148" font-size="8" fill="#888">sync</text>

  <!-- Compute 0 -->
  <g filter="url(#sk)">
    <rect x="216" y="100" width="120" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="276" y="123" text-anchor="middle" font-size="12" fill="#2b6e9e">Compute Tile 0</text>

  <!-- sync 1 -->
  <path d="M 340 96 L 340 140" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="344" y="148" font-size="8" fill="#888">sync</text>

  <!-- Load 1 -->
  <g filter="url(#sk)">
    <rect x="352" y="100" width="120" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="412" y="123" text-anchor="middle" font-size="12" fill="#7a5415">Load Tile 1</text>

  <!-- sync 2 -->
  <path d="M 476 96 L 476 140" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="480" y="148" font-size="8" fill="#888">sync</text>

  <!-- Compute 1 -->
  <g filter="url(#sk)">
    <rect x="488" y="100" width="120" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="548" y="123" text-anchor="middle" font-size="12" fill="#2b6e9e">Compute Tile 1</text>

  <!-- sync 3 -->
  <path d="M 612 96 L 612 140" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="616" y="148" font-size="8" fill="#888">sync</text>

  <!-- Idle annotations (bottom) -->
  <g filter="url(#sk)" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3">
    <rect x="216" y="144" width="120" height="18" rx="3"/>
    <rect x="488" y="144" width="120" height="18" rx="3"/>
  </g>
  <text x="276" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">load 闲置</text>
  <text x="548" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">load 闲置</text>

  <!-- Time arrow -->
  <path d="M 80 182 L 660 182" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="670" y="186" font-size="10" fill="#888">时间</text>

  <!-- Total time annotation -->
  <path d="M 80 196 L 80 206 L 612 206 L 612 196" stroke="#b85450" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="346" y="222" text-anchor="middle" font-size="10" fill="#b85450">总耗时 = Σ(Load + Compute) · 无重叠</text>

  <!-- Bottom note -->
  <text x="390" y="245" text-anchor="middle" font-size="9" fill="#aaa">__syncthreads() 保证 Load 完成后才开始 Compute · 两者无法并行</text>
</svg>
