<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="780" height="540" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">整合版 GEMM Kernel：六层优化合一</text>
  <path d="M 220 40 Q 390 48 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11" fill="#888">integrated_gemm_kernel · Tiling + RegBlk + float4 + Coalesced + Shuffle + DblBuf</text>

  <!-- ====== Layer 1: Tiling ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="72" width="660" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="60" y="72" width="52" height="52" rx="8" fill="#b85450"/>
  </g>
  <text x="86" y="96" text-anchor="middle" font-size="9" fill="#fff">Layer</text>
  <text x="86" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <text x="128" y="94" font-size="13" font-weight="bold" fill="#7a2828">Tiling</text>
  <text x="128" y="112" font-size="10" fill="#666">BM×BN block tile · BK K-dim 分块</text>
  <text x="710" y="103" text-anchor="end" font-size="10" fill="#7a2828" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">grid(BN/BN, M/BM)</text>

  <!-- ====== Layer 2: Register Blocking ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="130" width="660" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="60" y="130" width="52" height="52" rx="8" fill="#c98a2b"/>
  </g>
  <text x="86" y="154" text-anchor="middle" font-size="9" fill="#fff">Layer</text>
  <text x="86" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <text x="128" y="152" font-size="13" font-weight="bold" fill="#7a5415">Register Blocking</text>
  <text x="128" y="170" font-size="10" fill="#666">每线程算 TM×TN 子块 · acc 驻留寄存器</text>
  <text x="710" y="161" text-anchor="end" font-size="10" fill="#7a5415" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">float acc[TM][TN]</text>

  <!-- ====== Layer 3: float4 向量化加载 ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="188" width="660" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="60" y="188" width="52" height="52" rx="8" fill="#4a8e4a"/>
  </g>
  <text x="86" y="212" text-anchor="middle" font-size="9" fill="#fff">Layer</text>
  <text x="86" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <text x="128" y="210" font-size="13" font-weight="bold" fill="#2e6e2e">float4 向量化加载</text>
  <text x="128" y="228" font-size="10" fill="#666">128-bit load · Global→Shared 加载指令数砍 3/4</text>
  <text x="710" y="219" text-anchor="end" font-size="10" fill="#2e6e2e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">reinterpret_cast&lt;float4*&gt;</text>

  <!-- ====== Layer 4: Coalesced 写回 ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="246" width="660" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="60" y="246" width="52" height="52" rx="8" fill="#4a8e4a"/>
  </g>
  <text x="86" y="270" text-anchor="middle" font-size="9" fill="#fff">Layer</text>
  <text x="86" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
  <text x="128" y="268" font-size="13" font-weight="bold" fill="#2e6e2e">Coalesced 写回</text>
  <text x="128" y="286" font-size="10" fill="#666">float4 合并写入 Global Memory</text>
  <text x="710" y="277" text-anchor="end" font-size="10" fill="#2e6e2e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">STG.128</text>

  <!-- ====== Layer 5: Warp Shuffle ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="304" width="660" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="60" y="304" width="52" height="52" rx="8" fill="#4a8edb"/>
  </g>
  <text x="86" y="328" text-anchor="middle" font-size="9" fill="#fff">Layer</text>
  <text x="86" y="344" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text>
  <text x="128" y="326" font-size="13" font-weight="bold" fill="#2b6e9e">Warp Shuffle 写回重排</text>
  <text x="128" y="344" font-size="10" fill="#666">__shfl_sync warp 内转置 · 使写回合并</text>
  <text x="710" y="335" text-anchor="end" font-size="10" fill="#2b6e9e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">__shfl_sync</text>

  <!-- ====== Layer 6: Double Buffering ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="362" width="660" height="52" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3"/>
    <rect x="60" y="362" width="52" height="52" rx="8" fill="#8e5db8"/>
  </g>
  <text x="86" y="386" text-anchor="middle" font-size="9" fill="#fff">Layer</text>
  <text x="86" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">6</text>
  <text x="128" y="384" font-size="13" font-weight="bold" fill="#5d3a7e">Double Buffering</text>
  <text x="128" y="402" font-size="10" fill="#666">cp.async 异步加载 · 两份 buffer 交替 · 软件流水线</text>
  <text x="710" y="393" text-anchor="end" font-size="10" fill="#5d3a7e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">smemA[2][BM][BK]</text>

  <!-- ====== Kernel structure summary ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="430" width="660" height="90" rx="8" fill="#f4f4f0" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="390" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Kernel 结构</text>

  <!-- Flow boxes -->
  <g filter="url(#sk)" font-size="9" text-anchor="middle">
    <rect x="80" y="460" width="100" height="24" rx="4" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1"/>
    <text x="130" y="476" fill="#5d3a7e">smem[2] (L6)</text>

    <rect x="195" y="460" width="100" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
    <text x="245" y="476" fill="#7a5415">acc[TM][TN] (L2)</text>

    <rect x="310" y="460" width="120" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <text x="370" y="476" fill="#2e6e2e">load_async (L3+L6)</text>

    <rect x="445" y="460" width="100" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <text x="495" y="476" fill="#7a2828">compute (L1+L2)</text>

    <rect x="560" y="460" width="140" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <text x="630" y="476" fill="#2b6e9e">writeback (L4+L5)</text>
  </g>

  <!-- Flow arrows -->
  <g filter="url(#sk)" fill="none" stroke="#5a5a5a" stroke-width="1">
    <path d="M 180 472 L 195 472" marker-end="url(#ar)"/>
    <path d="M 295 472 L 310 472" marker-end="url(#ar)"/>
    <path d="M 430 472 L 445 472" marker-end="url(#ar)"/>
    <path d="M 545 472 L 560 472" marker-end="url(#ar)"/>
  </g>

  <!-- K-loop bracket -->
  <path d="M 305 490 L 305 500 L 555 500 L 555 490" stroke="#4a8e4a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="430" y="513" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">K 维循环（load + compute + shuffle）</text>
</svg>
