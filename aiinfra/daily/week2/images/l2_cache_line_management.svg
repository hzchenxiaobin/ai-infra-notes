<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="780" height="680" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" fill="#444" font-weight="bold">「L2 以 128B cache line 管理」是什么意思</text>
  <text x="390" y="52" text-anchor="middle" font-size="11" fill="#888">管理动作（tag / 命中 / 分配）按 128B 行 · 填充与传输按 32B sector</text>

  <!-- Part A: cache line 结构 -->
  <text x="390" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">① L2 的一行长什么样：Tag + 4 个 sector（各带 valid bit）</text>
    <rect x="90" y="96" width="600" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="100" y="106" width="110" height="40" rx="4" fill="#446688" opacity="0.35" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155.0" y="124.0" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Tag</text>
    <text x="155.0" y="140.0" text-anchor="middle" font-size="9" fill="#446688">地址高位</text>
    <rect x="218.0" y="106" width="109.5" height="40" rx="4" fill="#446688" opacity="0.30" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="272.8" y="124.0" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">S0 · 32B</text>
    <text x="272.8" y="140.0" text-anchor="middle" font-size="9" fill="#446688">V=1</text>
    <rect x="335.5" y="106" width="109.5" height="40" rx="4" fill="#446688" opacity="0.30" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="390.2" y="124.0" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">S1 · 32B</text>
    <text x="390.2" y="140.0" text-anchor="middle" font-size="9" fill="#446688">V=1</text>
    <rect x="453.0" y="106" width="109.5" height="40" rx="4" fill="#446688" opacity="0.30" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="507.8" y="124.0" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">S2 · 32B</text>
    <text x="507.8" y="140.0" text-anchor="middle" font-size="9" fill="#446688">V=1</text>
    <rect x="570.5" y="106" width="109.5" height="40" rx="4" fill="#446688" opacity="0.30" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="625.2" y="124.0" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">S3 · 32B</text>
    <text x="625.2" y="140.0" text-anchor="middle" font-size="9" fill="#446688">V=1</text>
  <text x="165" y="180" text-anchor="middle" font-size="10" fill="#446688">命中判断：Tag 匹配</text>
  <text x="165" y="194" text-anchor="middle" font-size="10" fill="#446688">以 128B 行为单位</text>
  <text x="470" y="180" text-anchor="middle" font-size="10" fill="#888">每 sector 独立 valid bit</text>
  <text x="470" y="194" text-anchor="middle" font-size="10" fill="#888">填充 / 传输以 32B 为单位</text>

  <!-- Part B: 地址拆解 -->
  <text x="390" y="226" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">② 地址拆解：命中看 Tag + Index，搬运看 Sector 位</text>
    <rect x="90" y="236" width="220" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="200.0" y="262.0" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Tag</text>
    <text x="200.0" y="298" text-anchor="middle" font-size="10" fill="#446688">→ 命中判断</text>
    <rect x="310" y="236" width="160" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="390.0" y="262.0" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Index</text>
    <text x="390.0" y="298" text-anchor="middle" font-size="10" fill="#446688">→ 定位到哪一行</text>
    <rect x="470" y="236" width="110" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="525.0" y="262.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Sector（2 bit）</text>
    <text x="525.0" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 行内哪个 sector</text>
    <rect x="580" y="236" width="110" height="44" rx="5" fill="#f0f0f0" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="635.0" y="262.0" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Byte（5 bit）</text>
    <text x="635.0" y="298" text-anchor="middle" font-size="10" fill="#888">→ sector 内字节</text>

  <!-- Part C: 两次访问 -->
  <text x="390" y="330" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">③ 两次访问看「管理」与「传输」的分工</text>

  <text x="90" y="364" font-size="12" fill="#444" font-weight="bold">第 1 次：读 4B（落在 S2）→ Tag miss，分配一行、写入 Tag</text>
    <rect x="90" y="372" width="600" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="100" y="382" width="110" height="36" rx="4" fill="#4a7a3a" opacity="0.35" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155.0" y="398.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Tag</text>
    <text x="155.0" y="414.0" text-anchor="middle" font-size="9" fill="#4a7a3a">地址高位</text>
    <rect x="218.0" y="382" width="109.5" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
    <text x="272.8" y="398.0" text-anchor="middle" font-size="10" fill="#bbb" font-weight="bold">S0 · 32B</text>
    <text x="272.8" y="414.0" text-anchor="middle" font-size="9" fill="#bbb">V=0（空）</text>
    <rect x="335.5" y="382" width="109.5" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
    <text x="390.2" y="398.0" text-anchor="middle" font-size="10" fill="#bbb" font-weight="bold">S1 · 32B</text>
    <text x="390.2" y="414.0" text-anchor="middle" font-size="9" fill="#bbb">V=0（空）</text>
    <rect x="453.0" y="382" width="109.5" height="36" rx="4" fill="#4a7a3a" opacity="0.30" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="507.8" y="398.0" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">S2 · 32B</text>
    <text x="507.8" y="414.0" text-anchor="middle" font-size="9" fill="#4a7a3a">V=1</text>
    <rect x="570.5" y="382" width="109.5" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
    <text x="625.2" y="398.0" text-anchor="middle" font-size="10" fill="#bbb" font-weight="bold">S3 · 32B</text>
    <text x="625.2" y="414.0" text-anchor="middle" font-size="9" fill="#bbb">V=0（空）</text>
  <text x="390" y="450" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 只从 DRAM 搬触达的 S2（32B），其余 sector 留空不搬</text>

  <text x="90" y="480" font-size="12" fill="#444" font-weight="bold">第 2 次：读同一行的 S0 → Tag hit（行已存在），但 V0=0</text>
    <rect x="90" y="488" width="600" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="100" y="498" width="110" height="36" rx="4" fill="#4a7a3a" opacity="0.35" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155.0" y="514.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Tag</text>
    <text x="155.0" y="530.0" text-anchor="middle" font-size="9" fill="#4a7a3a">地址高位</text>
    <rect x="218.0" y="498" width="109.5" height="36" rx="4" fill="#4a7a3a" opacity="0.30" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="272.8" y="514.0" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">S0 · 32B</text>
    <text x="272.8" y="530.0" text-anchor="middle" font-size="9" fill="#4a7a3a">V=1</text>
    <rect x="335.5" y="498" width="109.5" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
    <text x="390.2" y="514.0" text-anchor="middle" font-size="10" fill="#bbb" font-weight="bold">S1 · 32B</text>
    <text x="390.2" y="530.0" text-anchor="middle" font-size="9" fill="#bbb">V=0（空）</text>
    <rect x="453.0" y="498" width="109.5" height="36" rx="4" fill="#4a7a3a" opacity="0.30" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="507.8" y="514.0" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">S2 · 32B</text>
    <text x="507.8" y="530.0" text-anchor="middle" font-size="9" fill="#4a7a3a">V=1</text>
    <rect x="570.5" y="498" width="109.5" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
    <text x="625.2" y="514.0" text-anchor="middle" font-size="10" fill="#bbb" font-weight="bold">S3 · 32B</text>
    <text x="625.2" y="530.0" text-anchor="middle" font-size="9" fill="#bbb">V=0（空）</text>
  <text x="390" y="566" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 行级命中、sector 级缺失：只补搬 S0（32B），无需整行重取</text>

  <!-- 底部总结 -->
  <g transform="translate(90, 588)">
    <rect x="0" y="0" width="600" height="76" rx="8" fill="#f6f6f6" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="0" y="0" width="600" height="20" fill="#446688" opacity="0.12" rx="8" filter="url(#rough2)"/>
    <text x="300" y="15" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为什么「管理粗、传输细」</text>
    <text x="20" y="40" font-size="11" fill="#444">tag 按行存：表项数 = 容量 ÷ 128B；若按 32B sector 存 tag，表项 ×4，硬件开销大</text>
    <text x="20" y="58" font-size="11" fill="#444">valid bit 按 sector：支持按需填充，不规则访问不浪费 DRAM 带宽</text>
  </g>
</svg>