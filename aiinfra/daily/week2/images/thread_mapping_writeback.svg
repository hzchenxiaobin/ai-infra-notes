<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="860" height="460" fill="#fdfcf7"/>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">写回线程映射对比：行优先 vs 列优先</text>

  <g filter="url(#sk)">
    <rect x="20" y="50" width="400" height="380" rx="8" fill="#f4fbf4" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="220" y="78" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">行优先映射 ✓ 合并友好</text>
  <text x="220" y="96" text-anchor="middle" font-size="11" fill="#888">lane 0-15 同行，写连续 512B</text>

  <text x="35" y="130" font-size="10" fill="#4a7a3a" font-weight="bold">row 0</text>
  <g filter="url(#sk)">
    <rect x="80" y="115" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="112" y="115" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="144" y="115" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="176" y="115" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="208" y="115" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="240" y="115" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="272" y="115" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="304" y="115" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <text x="94" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L0</text>
  <text x="126" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L1</text>
  <text x="158" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L2</text>
  <text x="190" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L3</text>
  <text x="222" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L4</text>
  <text x="254" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L5</text>
  <text x="286" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L6</text>
  <text x="318" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L7</text>
  <text x="349" y="130" text-anchor="middle" font-size="12" fill="#888">...</text>
  <text x="388" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L15</text>

  <path d="M 80 140 H 388" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="220" y="155" text-anchor="middle" font-size="10" fill="#4a7a3a">512B 连续 → 合并友好</text>

  <text x="35" y="185" font-size="10" fill="#4a7a3a" font-weight="bold">row 0+8</text>
  <g filter="url(#sk)">
    <rect x="80" y="170" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="112" y="170" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="144" y="170" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="176" y="170" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="208" y="170" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="240" y="170" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="272" y="170" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="304" y="170" width="28" height="22" rx="3" fill="#cde9d4" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <text x="94" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L16</text>
  <text x="126" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L17</text>
  <text x="158" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L18</text>
  <text x="190" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L19</text>
  <text x="222" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L20</text>
  <text x="254" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L21</text>
  <text x="286" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L22</text>
  <text x="318" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L23</text>
  <text x="349" y="185" text-anchor="middle" font-size="12" fill="#888">...</text>
  <text x="388" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L31</text>

  <path d="M 80 195 H 388" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="220" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a">512B 连续 → 合并友好</text>

  <g filter="url(#sk)">
    <rect x="40" y="340" width="360" height="70" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="220" y="363" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 相邻 lane 地址相邻</text>
  <text x="220" y="382" text-anchor="middle" font-size="10" fill="#888">L2 内合并为满 sector 写</text>
  <text x="220" y="398" text-anchor="middle" font-size="10" fill="#888">2 段 512B 连续区，每条 STG.128 触达满 sector</text>

  <g filter="url(#sk)">
    <rect x="440" y="50" width="400" height="380" rx="8" fill="#fdf4f4" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="640" y="78" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">列优先映射 ✗ 写回放散</text>
  <text x="640" y="96" text-anchor="middle" font-size="11" fill="#888">lane 0-31 各占一行，散落 32 行</text>

  <text x="460" y="128" font-size="10" fill="#b85450" font-weight="bold">row 0</text>
  <g filter="url(#sk)"><rect x="510" y="115" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="130" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L0</text>

  <text x="460" y="153" font-size="10" fill="#b85450" font-weight="bold">row 1</text>
  <g filter="url(#sk)"><rect x="510" y="140" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="155" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L1</text>

  <text x="460" y="178" font-size="10" fill="#b85450" font-weight="bold">row 2</text>
  <g filter="url(#sk)"><rect x="510" y="165" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="180" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L2</text>

  <text x="460" y="203" font-size="10" fill="#b85450" font-weight="bold">row 3</text>
  <g filter="url(#sk)"><rect x="510" y="190" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="205" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L3</text>

  <text x="460" y="228" font-size="10" fill="#b85450" font-weight="bold">row 4</text>
  <g filter="url(#sk)"><rect x="510" y="215" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="230" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L4</text>

  <text x="460" y="253" font-size="10" fill="#b85450" font-weight="bold">row 5</text>
  <g filter="url(#sk)"><rect x="510" y="240" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="255" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L5</text>

  <text x="460" y="278" font-size="10" fill="#b85450" font-weight="bold">row 6</text>
  <g filter="url(#sk)"><rect x="510" y="265" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="280" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L6</text>

  <text x="460" y="303" font-size="10" fill="#b85450" font-weight="bold">row 7</text>
  <g filter="url(#sk)"><rect x="510" y="290" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="305" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L7</text>

  <text x="530" y="328" text-anchor="middle" font-size="14" fill="#888">...</text>

  <text x="455" y="353" font-size="10" fill="#b85450" font-weight="bold">row 31</text>
  <g filter="url(#sk)"><rect x="510" y="340" width="40" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="530" y="355" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L31</text>

  <path d="M 575 115 V 362" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="585" y="108" font-size="9" fill="#b85450" font-weight="bold">↓ 32 cache line</text>

  <g filter="url(#sk)">
    <rect x="460" y="340" width="360" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="640" y="363" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 单条指令触达 32 条 cache line</text>
  <text x="640" y="382" text-anchor="middle" font-size="10" fill="#888">每个 sector 只用一半（16B/32B）</text>
  <text x="640" y="398" text-anchor="middle" font-size="10" fill="#888">部分 sector 写回 DRAM，带宽浪费</text>
</svg>
