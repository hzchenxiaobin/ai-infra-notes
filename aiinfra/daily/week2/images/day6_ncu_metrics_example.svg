  </g>

  <!-- Warp Stall Long Scoreboard: 35.2% (HIGH! > 20%) -->
  <g transform="translate(40, 300)">
    <text x="0" y="14" font-size="12" fill="#c9d1d9" font-weight="bold">Warp Stall: Long Scoreboard</text>
    <text x="680" y="14" text-anchor="end" font-size="12" fill="#f85149" font-weight="bold">35.2% ← 高！</text>
    <rect x="0" y="22" width="680" height="16" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="22" width="240" height="16" rx="4" fill="#f85149" opacity="0.7"/>
    <line x1="136" y1="20" x2="136" y2="42" stroke="#f85149" stroke-width="1.5" stroke-dasharray="2"/>
    <text x="136" y="52" text-anchor="middle" font-size="9" fill="#f85149">20%</text>
  </g>

  <!-- Warp Stall Math Pipe Throttle: 12.1% (ok, < 20%) -->
  <g transform="translate(40, 360)">
    <text x="0" y="14" font-size="12" fill="#c9d1d9" font-weight="bold">Warp Stall: Math Pipe Throttle</text>
    <text x="680" y="14" text-anchor="end" font-size="12" fill="#3fb950">12.1%</text>
    <rect x="0" y="22" width="680" height="16" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="22" width="82" height="16" rx="4" fill="#3fb950" opacity="0.7"/>
    <line x1="136" y1="20" x2="136" y2="42" stroke="#f85149" stroke-width="1.5" stroke-dasharray="2"/>
    <text x="136" y="52" text-anchor="middle" font-size="9" fill="#f85149">20%</text>
  </g>

  <!-- Register Pressure: 72% (ok, < 80%) -->
  <g transform="translate(40, 400)">
    <text x="0" y="14" font-size="12" fill="#c9d1d9" font-weight="bold">Register Pressure</text>
    <text x="680" y="14" text-anchor="end" font-size="12" fill="#3fb950">72%</text>
    <rect x="0" y="22" width="680" height="16" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="22" width="490" height="16" rx="4" fill="#3fb950" opacity="0.7"/>
    <line x1="544" y1="20" x2="544" y2="42" stroke="#d29922" stroke-width="1.5" stroke-dasharray="2"/>
    <text x="544" y="52" text-anchor="middle" font-size="9" fill="#d29922">80%</text>
