<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#fdfcf7"/>
  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">RTX 5090 Roofline Ridge Point</text>
  <path d="M 220 42 Q 360 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Param box: FP32 peak ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="68" width="280" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="80" y="90" font-size="11" fill="#888">FP32 峰值算力</text>
  <text x="80" y="112" font-size="15" font-family="monospace" fill="#2b6e9e" font-weight="bold">104.75 TFLOPS</text>

  <!-- ===== Param box: bandwidth ===== -->
  <g filter="url(#sk)">
    <rect x="380" y="68" width="280" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="400" y="90" font-size="11" fill="#888">显存带宽（GDDR7）</text>
  <text x="400" y="112" font-size="15" font-family="monospace" fill="#2e6e2e" font-weight="bold">1.792 TB/s</text>

  <!-- ===== Division arrow ===== -->
  <text x="360" y="150" text-anchor="middle" font-size="24" fill="#888" filter="url(#sk)">÷</text>

  <!-- ===== Result box ===== -->
  <g filter="url(#sk)">
    <rect x="120" y="160" width="480" height="80" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="360" y="188" text-anchor="middle" font-size="12" fill="#7a5415">Ridge Point（算术强度拐点）</text>
  <text x="360" y="216" text-anchor="middle" font-size="18" font-family="monospace" fill="#c98a2b" font-weight="bold">104.75 / 1.792 ≈ 58.45 FLOP/Byte</text>

  <!-- ===== Interpretation ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="250" width="600" height="22" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="0.8" stroke-dasharray="5 3"/>
  </g>
  <text x="360" y="266" text-anchor="middle" font-size="10" fill="#888">AI &lt; 58.45 → memory-bound  |  AI &gt; 58.45 → compute-bound</text>
</svg>
