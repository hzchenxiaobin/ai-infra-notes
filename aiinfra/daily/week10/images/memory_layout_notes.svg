<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="180" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">③ 内存布局</text>
  <path d="M 260 40 Q 380 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="60" width="680" height="104" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>

  <text x="60" y="88" font-size="12" fill="#2b6e9e" font-weight="bold">PyTorch Tensor 默认 row-major (contiguous)</text>
  <text x="60" y="108" font-size="12" fill="#444">自定义 kernel 必须假设 row-major</text>

  <path d="M 80 122 L 110 122" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="120" y="126" font-size="11" fill="#444">调用前用 tensor.contiguous() 确保</text>

  <path d="M 80 142 L 110 142" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="120" y="146" font-size="11" fill="#444">跨 stride 访问需用 input.stride(0/1)</text>
</svg>
