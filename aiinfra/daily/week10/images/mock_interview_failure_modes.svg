<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="820" height="280" fill="#fdfcf7"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Mock 面试常见翻车现场</text>
  <path d="M 290 40 Q 410 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Item 1 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="74" r="14" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="50" y="79" text-anchor="middle" font-size="14" fill="#c04050" font-weight="bold">✗</text>
  <text x="80" y="78" font-size="12" fill="#a03040" font-weight="bold">开场 5 分钟还没讲清楚项目是做什么的</text>
  <path d="M 430 74 L 460 74" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="78" font-size="11" fill="#444">听众仍然不知道项目价值</text>

  <!-- Item 2 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="114" r="14" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="50" y="119" text-anchor="middle" font-size="14" fill="#c04050" font-weight="bold">✗</text>
  <text x="80" y="118" font-size="12" fill="#a03040" font-weight="bold">技术点只停留在"是什么"，讲不出"为什么"</text>
  <path d="M 460 114 L 490 114" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="118" font-size="11" fill="#444">缺乏深度和决策思考</text>

  <!-- Item 3 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="154" r="14" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="50" y="159" text-anchor="middle" font-size="14" fill="#c04050" font-weight="bold">✗</text>
  <text x="80" y="158" font-size="12" fill="#a03040" font-weight="bold">被 follow-up 一问就卡壳，开始绕圈子</text>
  <path d="M 430 154 L 460 154" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="158" font-size="11" fill="#444">准备不够，理解不扎实</text>

  <!-- Item 4 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="194" r="14" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="50" y="199" text-anchor="middle" font-size="14" fill="#c04050" font-weight="bold">✗</text>
  <text x="80" y="198" font-size="12" fill="#a03040" font-weight="bold">时间分配失控，重点没讲完就被打断</text>
  <path d="M 430 194 L 460 194" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="198" font-size="11" fill="#444">缺乏限时练习</text>

  <!-- Item 5 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="234" r="14" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="50" y="239" text-anchor="middle" font-size="14" fill="#c04050" font-weight="bold">✗</text>
  <text x="80" y="238" font-size="12" fill="#a03040" font-weight="bold">口头禅严重：然后、那个、就是</text>
  <path d="M 370 234 L 400 234" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="410" y="238" font-size="11" fill="#444">录音回放才能发现，需刻意纠正</text>
</svg>
