<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="160" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">④ 边界处理</text>
  <path d="M 260 40 Q 380 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="60" width="680" height="84" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>

  <text x="60" y="88" font-size="11" fill="#7a5415">N 不是 blockDim.x 的整数倍</text>
  <path d="M 300 92 L 330 92" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="92" font-size="11" fill="#444">用 if (i &lt; N) 保护</text>

  <text x="60" y="112" font-size="11" fill="#7a5415">空输入</text>
  <path d="M 300 116 L 330 116" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="116" font-size="11" fill="#444">提前 return</text>

  <text x="60" y="136" font-size="11" fill="#7a5415">非对齐尺寸</text>
  <path d="M 300 140 L 330 140" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="140" font-size="11" fill="#444">不能用 float4 向量化</text>
</svg>
