<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">top-p（Nucleus）采样算法流程</text>
  <path d="M 280 40 Q 460 48 640 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Top: 5-step pipeline ===== -->
  <g font-size="10">
    <!-- Step 1: softmax -->
    <g filter="url(#sk)"><rect x="30" y="62" width="150" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="105" y="84" text-anchor="middle" font-weight="bold" fill="#2b6e9e">① Softmax</text>
    <text x="105" y="102" text-anchor="middle" fill="#444">logits → probs</text>
    <text x="105" y="118" text-anchor="middle" fill="#888">温度 scaling 可调</text>

    <path d="M 182 97 L 206 97" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

    <!-- Step 2: sort -->
    <g filter="url(#sk)"><rect x="212" y="62" width="150" height="70" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="287" y="84" text-anchor="middle" font-weight="bold" fill="#2e6e2e">② Sort 降序</text>
    <text x="287" y="102" text-anchor="middle" fill="#444">probs 排序</text>
    <text x="287" y="118" text-anchor="middle" fill="#888">CUDA: CUB sort</text>

    <path d="M 364 97 L 388 97" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

    <!-- Step 3: cumsum + cutoff -->
    <g filter="url(#sk)"><rect x="394" y="62" width="150" height="70" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
    <text x="469" y="84" text-anchor="middle" font-weight="bold" fill="#7a5415">③ Cumsum + 截断</text>
    <text x="469" y="102" text-anchor="middle" fill="#444">累计 ≥ p 的截断点</text>
    <text x="469" y="118" text-anchor="middle" fill="#888">CUDA: CUB scan</text>

    <path d="M 546 97 L 570 97" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

    <!-- Step 4: renormalize -->
    <g filter="url(#sk)"><rect x="576" y="62" width="150" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
    <text x="651" y="84" text-anchor="middle" font-weight="bold" fill="#b03a3a">④ 重归一化</text>
    <text x="651" y="102" text-anchor="middle" fill="#444">截断集合 / sum</text>
    <text x="651" y="118" text-anchor="middle" fill="#888">得到新分布</text>

    <path d="M 728 97 L 752 97" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

    <!-- Step 5: sample -->
    <g filter="url(#sk)"><rect x="758" y="62" width="132" height="70" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3"/></g>
    <text x="824" y="84" text-anchor="middle" font-weight="bold" fill="#5a3a7a">⑤ 采样</text>
    <text x="824" y="102" text-anchor="middle" fill="#444">multinomial</text>
    <text x="824" y="118" text-anchor="middle" fill="#888">→ 输出 token</text>
  </g>

  <!-- ===== Middle: nucleus visualization ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="150" width="860" height="200" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="460" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">Nucleus 选择可视化（p=0.9）</text>

  <!-- probability bars (sorted descending) -->
  <g font-size="9">
    <text x="60" y="196" fill="#888">token:</text>
    <!-- bar 1: 0.40 -->
    <rect x="100" y="186" width="120" height="20" rx="3" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <text x="160" y="200" text-anchor="middle" fill="#fff" font-weight="bold">0.40</text>
    <text x="100" y="218" fill="#444">T₁</text>

    <!-- bar 2: 0.25 -->
    <rect x="100" y="224" width="75" height="20" rx="3" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <text x="137" y="238" text-anchor="middle" fill="#fff" font-weight="bold">0.25</text>
    <text x="100" y="256" fill="#444">T₂</text>

    <!-- bar 3: 0.15 -->
    <rect x="100" y="262" width="45" height="20" rx="3" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <text x="122" y="276" text-anchor="middle" fill="#fff" font-weight="bold">0.15</text>
    <text x="100" y="294" fill="#444">T₃</text>

    <!-- bar 4: 0.08 (in nucleus, crosses cutoff) -->
    <rect x="100" y="300" width="24" height="20" rx="3" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="0.8"/>
    <text x="112" y="314" text-anchor="middle" fill="#fff" font-weight="bold">0.08</text>
    <text x="100" y="332" fill="#444">T₄</text>

    <!-- bar 5: 0.05 (outside nucleus) -->
    <rect x="100" y="338" width="15" height="20" rx="3" fill="#ccc" stroke="#999" stroke-width="0.8"/>
    <text x="107" y="352" text-anchor="middle" fill="#666" font-size="8">.05</text>

    <!-- bar 6+: tiny -->
    <rect x="100" y="364" width="8" height="14" rx="2" fill="#eee" stroke="#bbb" stroke-width="0.5"/>
    <rect x="100" y="382" width="5" height="10" rx="2" fill="#eee" stroke="#bbb" stroke-width="0.5"/>
    <text x="120" y="374" fill="#aaa" font-size="8">其余低概率 token...</text>
  </g>

  <!-- cumsum line on right side -->
  <g font-size="9">
    <text x="280" y="196" fill="#888">cumsum:</text>
    <text x="340" y="200" fill="#4a8edb" font-weight="bold">0.40</text>
    <text x="340" y="238" fill="#4a8edb" font-weight="bold">0.65</text>
    <text x="340" y="276" fill="#4a8edb" font-weight="bold">0.80</text>
    <text x="340" y="314" fill="#2e6e2e" font-weight="bold">0.88</text>
    <text x="340" y="352" fill="#b03a3a" font-weight="bold">0.93 ≥ p=0.9 ✓</text>
  </g>

  <!-- cutoff line -->
  <path d="M 400 186 L 400 360" stroke="#b03a3a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="410" y="200" font-size="9" fill="#b03a3a" font-weight="bold">cutoff</text>
  <text x="410" y="214" font-size="9" fill="#b03a3a">截断点</text>

  <!-- nucleus box -->
  <g filter="url(#sk)">
    <rect x="460" y="186" width="200" height="140" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="560" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">Nucleus = {T₁, T₂, T₃, T₄}</text>
  <text x="560" y="228" text-anchor="middle" font-size="10" fill="#444">累计概率 ≥ 0.9</text>
  <text x="560" y="252" text-anchor="middle" font-size="10" fill="#444">重归一化:</text>
  <text x="560" y="270" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">T₁: 0.40/0.88 = 0.45</text>
  <text x="560" y="286" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">T₂: 0.25/0.88 = 0.28</text>
  <text x="560" y="302" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">T₃: 0.15/0.88 = 0.17</text>
  <text x="560" y="318" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">T₄: 0.08/0.88 = 0.09</text>

  <!-- comparison: top-p vs top-k -->
  <g filter="url(#sk)">
    <rect x="690" y="186" width="180" height="140" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="780" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">top-p vs top-k</text>
  <g font-size="9" fill="#444">
    <text x="708" y="228" font-weight="bold" fill="#2e6e2e">top-p（自适应）</text>
    <text x="708" y="244">分布集中 → 核小</text>
    <text x="708" y="258">分布分散 → 核大</text>
    <text x="708" y="280" font-weight="bold" fill="#b03a3a">top-k（固定）</text>
    <text x="708" y="296">无论分布 → 固定 k 个</text>
    <text x="708" y="312">可能包含极低概率</text>
  </g>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="370" width="860" height="22" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1" stroke-dasharray="5 3"/>
  </g>
  <text x="460" y="386" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 面试口述：top-p = "按概率排序取累计 ≥ p 的核"，比 top-k 更自适应。kernel 难点 = sort + scan + 截断三步，CUDA 版用 CUB。</text>
</svg>
