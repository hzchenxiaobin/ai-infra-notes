<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="820" height="260" fill="#fdfcf7"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">异常输入场景</text>
  <path d="M 330 40 Q 410 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Item 1 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="74" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="50" y="78" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="80" y="78" font-size="12" fill="#2b6e9e" font-weight="bold">空 prompt</text>
  <path d="M 200 74 L 230 74" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="78" font-size="11" fill="#444">应正常处理（生成 max_new_tokens 个 token）</text>

  <!-- Item 2 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="114" r="14" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="50" y="118" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">2</text>
  <text x="80" y="118" font-size="12" fill="#7a5415" font-weight="bold">超长 prompt（200+ words）</text>
  <path d="M 280 114 L 310 114" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="118" font-size="11" fill="#444">可能触发 KV Cache 不足，应排队等待或超时</text>

  <!-- Item 3 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="154" r="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="50" y="158" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="80" y="158" font-size="12" fill="#2e6e2e" font-weight="bold">超时取消</text>
  <path d="M 200 154 L 230 154" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="158" font-size="11" fill="#444">future.result(timeout=0.1) 应抛 TimeoutError</text>

  <!-- Item 4 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="194" r="14" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="50" y="198" text-anchor="middle" font-size="12" fill="#a03040" font-weight="bold">4</text>
  <text x="80" y="198" font-size="12" fill="#a03040" font-weight="bold">请求突然大量涌入</text>
  <path d="M 240 194 L 270 194" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="280" y="198" font-size="11" fill="#444">应受 max_num_seqs 限制，排队不崩溃</text>

  <!-- Item 5 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="234" r="14" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.3"/>
  </g>
  <text x="50" y="238" text-anchor="middle" font-size="12" fill="#6a3d8a" font-weight="bold">5</text>
  <text x="80" y="238" font-size="12" fill="#6a3d8a" font-weight="bold">OOM 模拟</text>
  <path d="M 200 234 L 230 234" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="238" font-size="11" fill="#444">total_kv_blocks 极小时，应拒绝或排队</text>
</svg>
