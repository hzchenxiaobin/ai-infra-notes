  <g filter="url(#sk)"><rect x="330" y="188" width="70" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="365" y="208" text-anchor="middle" font-size="9" fill="#b03a3a">skip</text>
