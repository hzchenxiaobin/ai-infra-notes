<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="27" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Causal FA：块级跳过优化</text>
  <path d="M 260 40 Q 440 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="440" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">causal 下三角 → Q block i 只需遍历 K block j ≤ i，j &gt; i 直接 break → 省一半块计算</text>

  <!-- ===== Block grid: 6x6 ===== -->
  <!-- Q axis label -->
  <text x="30" y="100" font-size="11" font-weight="bold" fill="#2e6e2e">Q block i</text>
  <!-- K axis label -->
  <text x="300" y="92" font-size="11" font-weight="bold" fill="#2b6e9e">K block j →</text>

  <!-- Grid: 6 rows (Q) x 6 cols (K), each cell 70x40, starting at x=120, y=100 -->
  <!-- Row labels -->
  <g font-size="9" fill="#2e6e2e" font-weight="bold">
    <text x="110" y="124" text-anchor="end">i=0</text>
    <text x="110" y="164" text-anchor="end">i=1</text>
    <text x="110" y="204" text-anchor="end">i=2</text>
    <text x="110" y="244" text-anchor="end">i=3</text>
    <text x="110" y="284" text-anchor="end">i=4</text>
    <text x="110" y="324" text-anchor="end">i=5</text>
  </g>
  <!-- Column labels -->
  <g font-size="9" fill="#2b6e9e" font-weight="bold" text-anchor="middle">
    <text x="155" y="96">j=0</text>
    <text x="225" y="96">j=1</text>
    <text x="295" y="96">j=2</text>
    <text x="365" y="96">j=3</text>
    <text x="435" y="96">j=4</text>
    <text x="505" y="96">j=5</text>
  </g>

  <!-- Cells: computed (green) if j <= i, skipped (red/gray) if j > i -->
  <!-- Row i=0: only j=0 computed -->
  <g filter="url(#sk)"><rect x="120" y="108" width="70" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="155" y="128" text-anchor="middle" font-size="9" fill="#2e6e2e">✓ 计算</text>
  <g filter="url(#sk)"><rect x="190" y="108" width="70" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="225" y="128" text-anchor="middle" font-size="9" fill="#b03a3a">skip</text>
