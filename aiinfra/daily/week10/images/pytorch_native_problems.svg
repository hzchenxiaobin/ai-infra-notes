<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="290" fill="#fdfcf7"/>

  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">PyTorch 原生算子的问题</text>
  <path d="M 280 40 Q 440 48 600 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Problem 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="800" height="48" rx="6" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="70" cy="88" r="14" fill="#c04050"/>
  </g>
  <text x="70" y="92" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
  <text x="96" y="84" font-size="12" fill="#a03040" font-weight="bold">融合度低</text>
  <path d="M 180 88 L 210 88" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="84" font-size="11" fill="#444">Softmax + Scale + MatMul 分 3 个 kernel launch</text>
  <text x="220" y="100" font-size="10" fill="#888">开销大</text>

  <!-- Problem 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="120" width="800" height="48" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="70" cy="144" r="14" fill="#c98a2b"/>
  </g>
  <text x="70" y="148" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
  <text x="96" y="140" font-size="12" fill="#7a5415" font-weight="bold">显存占用高</text>
  <path d="M 180 144 L 210 144" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="140" font-size="11" fill="#444">中间结果（attention matrix）全量物化到 HBM</text>

  <!-- Problem 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="176" width="800" height="48" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="70" cy="200" r="14" fill="#2e8b57"/>
  </g>
  <text x="70" y="204" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
  <text x="96" y="196" font-size="12" fill="#2e6e2e" font-weight="bold">无法定制</text>
  <path d="M 180 200 L 210 200" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="196" font-size="11" fill="#444">推理特化（如 KV Cache、PagedAttention）需要自定义逻辑</text>

  <!-- Problem 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="232" width="800" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="70" cy="256" r="14" fill="#4a8edb"/>
  </g>
  <text x="70" y="260" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
  <text x="96" y="252" font-size="12" fill="#2b6e9e" font-weight="bold">缺乏控制</text>
  <path d="M 180 256 L 210 256" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="252" font-size="11" fill="#444">无法精细控制 tiling、shared memory、warp 调度</text>
</svg>
