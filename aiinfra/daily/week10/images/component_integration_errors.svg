<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="820" height="280" fill="#fdfcf7"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">组件单独正确，组合后出错的典型场景</text>
  <path d="M 280 40 Q 410 48 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Item 1 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="78" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="50" y="82" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="80" y="82" font-size="12" fill="#c04050" font-weight="bold">KV Cache 串台</text>
  <path d="M 220 78 L 250 78" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="82" font-size="11" fill="#444">请求 A 的 decode 读到请求 B 的 KV Cache（结果错误）</text>

  <!-- Item 2 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="118" r="14" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="50" y="122" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">2</text>
  <text x="80" y="122" font-size="12" fill="#c04050" font-weight="bold">资源泄漏</text>
  <path d="M 220 118 L 250 118" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="122" font-size="11" fill="#444">finished 请求的 KV Cache 未释放 → 累积 OOM</text>

  <!-- Item 3 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="158" r="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="50" y="162" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="80" y="162" font-size="12" fill="#c04050" font-weight="bold">Scheduler 死锁</text>
  <path d="M 220 158 L 250 158" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="162" font-size="11" fill="#444">请求被 still_waiting 丢弃 → future 永远不完成</text>

  <!-- Item 4 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="198" r="14" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="50" y="202" text-anchor="middle" font-size="12" fill="#a03040" font-weight="bold">4</text>
  <text x="80" y="202" font-size="12" fill="#c04050" font-weight="bold">超时传播</text>
  <path d="M 220 198 L 250 198" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="202" font-size="11" fill="#444">waiting 超时但 running 不检查 → 请求卡在 running</text>

  <!-- Item 5 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="238" r="14" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.3"/>
  </g>
  <text x="50" y="242" text-anchor="middle" font-size="12" fill="#6a3d8a" font-weight="bold">5</text>
  <text x="80" y="242" font-size="12" fill="#c04050" font-weight="bold">竞态条件</text>
  <path d="M 220 238 L 250 238" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="242" font-size="11" fill="#444">submit 和 schedule 并发操作 running map → 数据竞争</text>
</svg>
