<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">自我介绍 STAR-mini 模板</text>
  <path d="M 270 42 Q 450 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g font-size="11">
    <!-- Step 1 -->
    <g filter="url(#sk)"><rect x="60" y="80" width="250" height="56" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><circle cx="90" cy="108" r="14" fill="#4a8edb"/></g>
    <text x="90" y="112" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
    <text x="116" y="104" font-size="12" font-weight="bold" fill="#2b6e9e">我是谁</text>
    <text x="116" y="122" font-size="9" fill="#888">姓名 + 背景 + 当前方向</text>
    <path d="M 318 108 L 362 108" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="370" y="80" width="470" height="56" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.1"/></g>
    <text x="390" y="104" font-size="11" fill="#444">"我叫陈斌斌，最近 10 周集中学习 AI Infra"</text>
    <text x="390" y="122" font-size="9" fill="#888">一句话点明背景和方向</text>

    <!-- Step 2 -->
    <g filter="url(#sk)"><rect x="60" y="148" width="250" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><circle cx="90" cy="176" r="14" fill="#4a8e4a"/></g>
    <text x="90" y="180" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
    <text x="116" y="172" font-size="12" font-weight="bold" fill="#2e6e2e">我做了什么</text>
    <text x="116" y="190" font-size="9" fill="#888">一句话概括项目</text>
    <path d="M 318 176 L 362 176" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="370" y="148" width="470" height="56" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.1"/></g>
    <text x="390" y="172" font-size="11" fill="#444">手写 CUDA kernel + Mini 推理引擎</text>
    <text x="390" y="190" font-size="9" fill="#888">Mini AI Infra / 手写 CUDA kernel / Mini 推理引擎</text>

    <!-- Step 3 -->
    <g filter="url(#sk)"><rect x="60" y="216" width="250" height="56" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><circle cx="90" cy="244" r="14" fill="#c98a2b"/></g>
    <text x="90" y="248" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
    <text x="116" y="240" font-size="12" font-weight="bold" fill="#7a5415">核心亮点</text>
    <text x="116" y="258" font-size="9" fill="#888">1-2 个量化成果</text>
    <path d="M 318 244 L 362 244" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="370" y="216" width="470" height="56" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.1"/></g>
    <text x="390" y="240" font-size="11" fill="#444">GEMM 达到 cuBLAS ~64%（RTX 5090 实测 4096³）</text>
    <text x="390" y="258" font-size="9" fill="#888">支持 Continuous Batching —— 用数字说话</text>

    <!-- Step 4 -->
    <g filter="url(#sk)"><rect x="60" y="284" width="250" height="56" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><circle cx="90" cy="312" r="14" fill="#8e5db8"/></g>
    <text x="90" y="316" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
    <text x="116" y="308" font-size="12" font-weight="bold" fill="#5a3a7a">我想做什么</text>
    <text x="116" y="326" font-size="9" fill="#888">应聘岗位方向</text>
    <path d="M 318 312 L 362 312" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="370" y="284" width="470" height="56" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.1"/></g>
    <text x="390" y="308" font-size="11" fill="#444">"希望应聘 AI Infra / 推理优化相关岗位"</text>
    <text x="390" y="326" font-size="9" fill="#888">明确意向，收束自我介绍</text>
  </g>

  <text x="450" y="388" text-anchor="middle" font-size="10" fill="#888" font-style="italic">4 步收束：是谁 → 做了什么 → 亮点 → 想做什么 —— 控制在 1-2 分钟</text>
</svg>
