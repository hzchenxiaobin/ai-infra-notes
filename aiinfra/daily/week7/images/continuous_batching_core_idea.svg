<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="66" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="340" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Continuous Batching：Iteration-level Scheduling</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 核心机制 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="780" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="60" y="88" font-size="13" fill="#2b6e9e" font-weight="bold">核心机制</text>
  <text x="60" y="110" font-size="12" fill="#444">每个 iteration 都重新构建 batch</text>
  <text x="60" y="128" font-size="12" fill="#444">新请求可以在任意 iteration 加入</text>
  <text x="60" y="146" font-size="12" fill="#444">完成的请求可以在任意 iteration 退出</text>
  <text x="60" y="164" font-size="12" fill="#444">不再存在"一个 batch 一起结束"的概念</text>

  <!-- 效果 -->
  <g filter="url(#sk)">
    <rect x="40" y="196" width="780" height="120" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="60" y="220" font-size="13" fill="#2e6e2e" font-weight="bold">效果</text>
  <text x="60" y="242" font-size="12" fill="#444">GPU 始终满负荷运行</text>
  <text x="60" y="260" font-size="12" fill="#444">短请求不会被长请求阻塞</text>
  <text x="60" y="278" font-size="12" fill="#444">Throughput 和 latency 都更好</text>
  <text x="60" y="302" font-size="11" fill="#2e6e2e" font-weight="bold">→ 把 Dynamic 的"整批一起跑完"改成"每轮重建 batch"</text>
</svg>
