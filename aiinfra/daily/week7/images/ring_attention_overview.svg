<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a6fa5"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Ring Attention：KV 环形流式传输 + 本地 online softmax</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Ring topology (N=4) ============ -->
  <text x="470" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6fa5">Ring 拓扑（N=4 GPU，每卡持有 1/N 的 Q，KV 环形传递）</text>

  <!-- 4 nodes -->
  <g filter="url(#sk)">
    <rect x="120" y="96" width="120" height="60" rx="8" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.4"/>
    <rect x="420" y="96" width="120" height="60" rx="8" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.4"/>
    <rect x="420" y="240" width="120" height="60" rx="8" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.4"/>
    <rect x="120" y="240" width="120" height="60" rx="8" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#3a5a8a" text-anchor="middle" font-weight="bold">
    <text x="180" y="116">GPU 0</text>
    <text x="480" y="116">GPU 1</text>
    <text x="480" y="260">GPU 2</text>
    <text x="180" y="260">GPU 3</text>
  </g>
  <!-- Q (fixed) + KV (rotating) labels -->
  <g font-size="10" fill="#444" text-anchor="middle">
    <text x="180" y="134">Q₀ (固定)</text>
    <text x="180" y="148" fill="#d6a040">KV₀ →</text>
    <text x="480" y="134">Q₁ (固定)</text>
    <text x="480" y="148" fill="#d6a040">KV₁ →</text>
    <text x="480" y="278">Q₂ (固定)</text>
    <text x="480" y="292" fill="#d6a040">KV₂ →</text>
    <text x="180" y="278">Q₃ (固定)</text>
    <text x="180" y="292" fill="#d6a040">KV₃ →</text>
  </g>

  <!-- ring arrows: GPU i sends KV to GPU (i+1)%N -->
  <path d="M 240 126 L 420 126" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 540 156 Q 560 200 540 240" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 420 270 L 240 270" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 120 240 Q 100 200 120 156" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="330" y="120" text-anchor="middle" font-size="9" fill="#8a6a06">send KV</text>
  <text x="568" y="202" font-size="9" fill="#8a6a06">send KV</text>

  <!-- ============ Timeline: compute / comm overlap ============ -->
  <line x1="40" y1="332" x2="900" y2="332" stroke="#eee" stroke-width="1" filter="url(#sk)"/>
  <text x="40" y="356" font-size="13" font-weight="bold" fill="#2e8b57">N 步循环：本地 attention 与 KV 通信重叠（双流）</text>

  <!-- axis -->
  <path d="M 40 374 L 760 374" stroke="#888" stroke-width="1.2" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="40" y="370" font-size="9" fill="#888">t</text>

  <!-- compute stream: N blocks -->
  <text x="40" y="398" font-size="10" fill="#3a5a8a" font-weight="bold">compute</text>
  <g filter="url(#sk)">
    <rect x="130" y="384" width="120" height="22" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
    <rect x="270" y="384" width="120" height="22" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
    <rect x="410" y="384" width="120" height="22" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
    <rect x="550" y="384" width="120" height="22" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <g font-size="9" fill="#3a5a8a" text-anchor="middle">
    <text x="190" y="399">attn(Q,KV₀)</text>
    <text x="330" y="399">attn(Q,KV₁)</text>
    <text x="470" y="399">attn(Q,KV₂)</text>
    <text x="610" y="399">attn(Q,KV₃)</text>
  </g>

  <!-- comm stream: overlapping sends -->
  <text x="40" y="428" font-size="10" fill="#a03040" font-weight="bold">comm</text>
  <g filter="url(#sk)">
    <rect x="250" y="414" width="120" height="22" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
    <rect x="390" y="414" width="120" height="22" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
    <rect x="530" y="414" width="120" height="22" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <g font-size="9" fill="#a03040" text-anchor="middle">
    <text x="310" y="429">send KV₀</text>
    <text x="450" y="429">send KV₁</text>
    <text x="590" y="429">send KV₂</text>
  </g>
  <!-- overlap shading -->
  <path d="M 250 384 L 370 384 L 370 436 L 250 436 Z" fill="#fff7c0" opacity="0.45" filter="url(#sk)"/>
  <path d="M 390 384 L 510 384 L 510 436 L 390 436 Z" fill="#fff7c0" opacity="0.45" filter="url(#sk)"/>
  <path d="M 530 384 L 650 384 L 650 436 L 530 436 Z" fill="#fff7c0" opacity="0.45" filter="url(#sk)"/>

  <text x="470" y="448" text-anchor="middle" font-size="10" fill="#444">每步：用当前 KV 算 online softmax 增量更新 (m, l, O)，同时把 KV 发给右邻（下一步用）</text>
</svg>
