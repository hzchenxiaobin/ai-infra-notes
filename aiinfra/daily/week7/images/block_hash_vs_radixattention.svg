<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">block-hash vs RadixAttention：对齐损失对比</text>
  <path d="M 280 38 Q 440 46 600 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="54" text-anchor="middle" font-size="11" fill="#888">sys_prompt = 100 tokens · block_size = 16</text>

  <text x="60" y="82" font-size="13" fill="#2b6e9e" font-weight="bold">block-hash（vLLM）</text>
  <text x="60" y="100" font-size="11" fill="#666">每 16 token 算一个 hash，命中需严格对齐到 block 边界</text>

  <text x="100" y="142" font-size="11" fill="#444" font-weight="bold" text-anchor="end">请求:</text>

  <g filter="url(#sk)" font-size="10" text-anchor="middle">
    <rect x="140" y="124" width="80" height="28" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
    <text x="180" y="142" fill="#2e6e2e">16</text>
    <rect x="220" y="124" width="80" height="28" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
    <text x="260" y="142" fill="#2e6e2e">16</text>
    <rect x="300" y="124" width="80" height="28" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
    <text x="340" y="142" fill="#2e6e2e">16</text>
    <rect x="380" y="124" width="80" height="28" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
    <text x="420" y="142" fill="#2e6e2e">16</text>
    <rect x="460" y="124" width="80" height="28" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
    <text x="500" y="142" fill="#2e6e2e">16</text>
    <rect x="540" y="124" width="80" height="28" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
    <text x="580" y="142" fill="#2e6e2e">16</text>
    <rect x="620" y="124" width="20" height="28" rx="3" fill="#fdecec" stroke="#c04050" stroke-width="1.2"/>
    <text x="630" y="142" fill="#c04050" font-size="7">4</text>
    <rect x="650" y="124" width="130" height="28" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="715" y="142" fill="#2b6e9e">user_input</text>
  </g>

  <path d="M 140 158 L 140 164 L 620 164 L 620 158" stroke="#2e8b57" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="380" y="178" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">← 6 个完整 block 命中 (96 token) →</text>

  <line x1="630" y1="152" x2="630" y2="172" stroke="#c04050" stroke-width="1" stroke-dasharray="2,2" filter="url(#sk)"/>
  <text x="630" y="178" text-anchor="middle" font-size="9" fill="#c04050" font-weight="bold">4 token 丢弃</text>

  <line x1="60" y1="200" x2="820" y2="200" stroke="#eee" stroke-width="1" filter="url(#sk)"/>

  <text x="60" y="220" font-size="13" fill="#5d3a7e" font-weight="bold">RadixAttention（SGLang）</text>
  <text x="60" y="238" font-size="11" fill="#666">前缀树存任意长度的前缀，命中无对齐要求</text>

  <text x="100" y="274" font-size="11" fill="#444" font-weight="bold" text-anchor="end">请求:</text>

  <g filter="url(#sk)" font-size="10" text-anchor="middle">
    <rect x="140" y="256" width="500" height="28" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="390" y="274" fill="#2e6e2e" font-weight="bold">sys_prompt (100 tokens) — 全部命中</text>
    <rect x="650" y="256" width="130" height="28" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="715" y="274" fill="#2b6e9e">user_input</text>
  </g>

  <path d="M 140 290 L 140 296 L 640 296 L 640 290" stroke="#2e8b57" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="390" y="310" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">← 100 token 全部命中（前缀树精确匹配）→</text>

  <g filter="url(#sk)">
    <rect x="100" y="326" width="680" height="56" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="120" y="350" font-size="11" fill="#7a5415" font-weight="bold">对齐损失：</text>
  <text x="200" y="350" font-size="11" fill="#444">block-hash 尾部不对齐部分无法复用；RadixAttention 精确匹配无浪费</text>
  <text x="120" y="370" font-size="10" fill="#888">SGLang 在多轮对话 / few-shot / 共享 system prompt 场景 KV Cache 命中率比 vLLM 高 5-15%</text>
</svg>
