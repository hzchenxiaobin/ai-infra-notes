<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="72" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="300" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Day 1 ContinuousBatcher 的盲区</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">致命假设：显存永远够用</text>

  <!-- 步骤 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="74" width="780" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="100" font-size="12" fill="#2b6e9e" font-weight="bold">①</text>
  <text x="90" y="100" font-size="12" fill="#444">running 序列不断 decode → KV Cache 持续增长</text>

  <!-- 步骤 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="126" width="780" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="152" font-size="12" fill="#7a5415" font-weight="bold">②</text>
  <text x="90" y="152" font-size="12" fill="#444">新请求 prefill → 突然需要一大块显存</text>

  <!-- 步骤 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="178" width="780" height="44" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="204" font-size="12" fill="#b03a3a" font-weight="bold">③</text>
  <text x="90" y="204" font-size="12" fill="#444">显存满了？Day 1 的实现：直接不加入（waiting 继续等）</text>

  <!-- 步骤 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="230" width="780" height="44" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="60" y="256" font-size="12" fill="#b03a3a" font-weight="bold">④</text>
  <text x="90" y="256" font-size="12" fill="#444">但 running 也在增长 → 显存迟早爆 →</text>
  <text x="500" y="256" font-size="13" fill="#b03a3a" font-weight="bold">OOM 崩溃</text>
</svg>
