<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="99" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="200" fill="#fdfcf7"/>

  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Chunked Prefill + Prefix Caching 协同流程</text>
  <path d="M 270 38 Q 430 46 590 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="70" width="170" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="125" y="100" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">请求到达</text>
  <text x="125" y="120" text-anchor="middle" font-size="10" fill="#666">sys_prompt + user_input</text>

  <path d="M 210 105 L 238 105" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="240" y="70" width="170" height="70" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.4"/>
  </g>
  <text x="325" y="100" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">prefix caching 匹配</text>
  <text x="325" y="120" text-anchor="middle" font-size="10" fill="#666">block hash 查表</text>

  <path d="M 410 105 L 438 105" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="440" y="70" width="170" height="70" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="525" y="100" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">剩余未命中部分</text>
  <text x="525" y="120" text-anchor="middle" font-size="10" fill="#666">需 prefill 的 tokens</text>

  <path d="M 610 105 L 638 105" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="640" y="70" width="170" height="70" rx="8" fill="#f3e8fa" stroke="#7a4a8e" stroke-width="1.4"/>
  </g>
  <text x="725" y="100" text-anchor="middle" font-size="13" fill="#5d3a7e" font-weight="bold">chunked prefill 切分</text>
  <text x="725" y="120" text-anchor="middle" font-size="10" fill="#666">按 chunk_size 分块</text>

  <text x="325" y="160" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">↓ 跳过已知 prefix</text>
  <text x="725" y="160" text-anchor="middle" font-size="10" fill="#5d3a7e" font-weight="bold">↓ 与 decode 混合调度</text>

  <text x="430" y="186" text-anchor="middle" font-size="10" fill="#888">两者正交：prefix caching 减少计算量，chunked prefill 平滑调度</text>
</svg>
