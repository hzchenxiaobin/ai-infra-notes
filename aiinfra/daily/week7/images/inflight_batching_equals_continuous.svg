<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="80" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="280" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Inflight Batching = Continuous Batching</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">TensorRT-LLM 术语，本质同一思想</text>

  <!-- 请求动态加入 -->
  <g filter="url(#sk)">
    <rect x="40" y="74" width="780" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="100" font-size="12" fill="#2b6e9e" font-weight="bold">①</text>
  <text x="90" y="100" font-size="12" fill="#444">请求可以在 engine 运行过程中加入（in-flight）</text>

  <!-- 请求完成退出 -->
  <g filter="url(#sk)">
    <rect x="40" y="126" width="780" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="152" font-size="12" fill="#2e6e2e" font-weight="bold">②</text>
  <text x="90" y="152" font-size="12" fill="#444">请求完成后立即退出</text>

  <!-- 每轮重建 batch -->
  <g filter="url(#sk)">
    <rect x="40" y="178" width="780" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="204" font-size="12" fill="#7a5415" font-weight="bold">③</text>
  <text x="90" y="204" font-size="12" fill="#444">每轮 iteration 重新构建 batch</text>

  <!-- 结论 -->
  <g filter="url(#sk)">
    <rect x="40" y="234" width="780" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.4"/>
  </g>
  <text x="430" y="256" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">= Continuous Batching（vLLM）的同一思想</text>
</svg>
