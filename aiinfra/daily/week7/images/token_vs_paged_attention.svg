<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="86" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="340" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Token Attention vs PagedAttention</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- PagedAttention -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="380" height="200" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="230" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">PagedAttention</text>
  <text x="230" y="106" text-anchor="middle" font-size="11" fill="#888">vLLM / TensorRT-LLM</text>
  <text x="60" y="130" font-size="11" fill="#444">KV Cache 切成固定大小 block</text>
  <text x="60" y="148" font-size="11" fill="#444">（如 16 token/block）</text>
  <text x="60" y="172" font-size="11" fill="#444">block 是分配/回收的最小单位</text>
  <text x="60" y="196" font-size="11" fill="#2e6e2e" font-weight="bold">优点：管理简单</text>
  <text x="60" y="214" font-size="11" fill="#b03a3a" font-weight="bold">缺点：block 内可能有空洞</text>

  <!-- Token Attention -->
  <g filter="url(#sk)">
    <rect x="440" y="64" width="380" height="200" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="630" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">Token Attention</text>
  <text x="630" y="106" text-anchor="middle" font-size="11" fill="#888">LightLLM</text>
  <text x="460" y="130" font-size="11" fill="#444">以 token 为粒度动态管理 KV Cache</text>
  <text x="460" y="148" font-size="11" fill="#444">类似内存池：按需分配 token 级空间</text>
  <text x="460" y="172" font-size="11" fill="#444"></text>
  <text x="460" y="196" font-size="11" fill="#2e6e2e" font-weight="bold">优点：无 block 空洞，利用率更高</text>
  <text x="460" y="214" font-size="11" fill="#b03a3a" font-weight="bold">缺点：管理开销略大</text>

  <!-- 底部总结 -->
  <g filter="url(#sk)">
    <rect x="40" y="280" width="780" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="430" y="308" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">PagedAttention 通用性好；Token Attention 在长上下文、高并发场景内存利用率更高</text>
</svg>
