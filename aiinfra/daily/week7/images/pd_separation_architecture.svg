<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="52" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fdfcf7"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">PD 分离架构：双池 + KV 传输层</text>
  <path d="M 240 40 Q 360 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="200" y="60" width="320" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>  <text x="360" y="84" font-size="13" fill="#2b6e9e" font-weight="bold">Router / Scheduler</text>  <text x="360" y="104" font-size="10" fill="#666" font-weight="normal">（按阶段分发）</text>  <path d="M 360 116 L 200 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <path d="M 360 116 L 520 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="40" y="152" width="280" height="100" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>  <text x="180" y="180" font-size="13" fill="#2e6e2e" font-weight="bold">Prefill Pool</text>  <text x="180" y="200" font-size="10" fill="#666" font-weight="normal">(compute)</text>  <text x="180" y="226" font-size="10" fill="#444" font-weight="normal">专用处理 prefill</text>  <text x="180" y="242" font-size="10" fill="#888" font-weight="normal">compute-bound</text>  <g filter="url(#sk)">
    <rect x="400" y="152" width="280" height="100" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>  <text x="540" y="180" font-size="13" fill="#7a5415" font-weight="bold">Decode Pool</text>  <text x="540" y="200" font-size="10" fill="#666" font-weight="normal">(memory)</text>  <text x="540" y="226" font-size="10" fill="#444" font-weight="normal">专用处理 decode</text>  <text x="540" y="242" font-size="10" fill="#888" font-weight="normal">memory-bound</text>  <path d="M 320 200 L 400 200" stroke="#b03a3a" stroke-width="2" stroke-dasharray="6 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <text x="360" y="194" font-size="10" fill="#b03a3a" font-weight="bold">KV</text>  <text x="330" y="216" font-size="9" fill="#b03a3a" font-weight="normal">传输层</text>  <text x="180" y="280" font-size="10" fill="#666" font-weight="normal">prefill 完成后</text>  <text x="180" y="294" font-size="10" fill="#666" font-weight="normal">发送 KV Cache</text>  <text x="540" y="280" font-size="10" fill="#666" font-weight="normal">接收 KV Cache</text>  <text x="540" y="294" font-size="10" fill="#666" font-weight="normal">继续 decode</text>  <g filter="url(#sk)">
    <rect x="40" y="320" width="640" height="50" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.0"/>
  </g>  <text x="360" y="344" font-size="10" fill="#666" font-weight="bold">KV Transfer Layer: RDMA(RoCE) / NVLink(单机) / TCP(回退)</text>  <text x="360" y="362" font-size="10" fill="#888" font-weight="normal">代表实现: Mooncake / DistServe / vLLM V1</text></svg>