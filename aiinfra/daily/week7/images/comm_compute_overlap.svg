<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="940" height="380" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">通信-计算重叠：双 CUDA Stream</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 串行 timeline ============ -->
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#c04050">串行（不重叠）：total = compute + comm</text>
  <!-- axis -->
  <path d="M 40 96 L 540 96" stroke="#888" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="40" y="92" font-size="9" fill="#888">0</text>
  <!-- compute block -->
  <g filter="url(#sk)">
    <rect x="40" y="104" width="180" height="26" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="130" y="121" text-anchor="middle" font-size="11" fill="#3a5a8a" font-weight="bold">compute (GEMM)</text>
  <!-- comm block after compute -->
  <g filter="url(#sk)">
    <rect x="220" y="104" width="120" height="26" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="280" y="121" text-anchor="middle" font-size="11" fill="#a03040" font-weight="bold">all-reduce</text>
  <!-- total bracket -->
  <path d="M 40 142 L 340 142" stroke="#c04050" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 40 138 L 40 146 M 340 138 L 340 146" stroke="#c04050" stroke-width="1.2"/>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#c04050">total = T_c + T_a</text>

  <!-- ============ 重叠 timeline ============ -->
  <line x1="40" y1="176" x2="900" y2="176" stroke="#eee" stroke-width="1" filter="url(#sk)"/>
  <text x="40" y="202" font-size="13" font-weight="bold" fill="#2e8b57">重叠（双 stream）：total ≈ max(compute, comm)</text>
  <!-- compute stream -->
  <text x="40" y="226" font-size="10" fill="#3a5a8a" font-weight="bold">compute_stream</text>
  <g filter="url(#sk)">
    <rect x="180" y="212" width="200" height="24" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="280" y="228" text-anchor="middle" font-size="10" fill="#3a5a8a">compute (GEMM)</text>
  <!-- comm stream (overlapping) -->
  <text x="40" y="258" font-size="10" fill="#a03040" font-weight="bold">comm_stream</text>
  <g filter="url(#sk)">
    <rect x="200" y="244" width="160" height="24" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="280" y="260" text-anchor="middle" font-size="10" fill="#a03040">all-reduce</text>
  <!-- overlap region shading -->
  <path d="M 200 212 L 380 212 L 380 244 L 200 244 Z" fill="#fff7c0" opacity="0.5" filter="url(#sk)"/>
  <text x="290" y="284" text-anchor="middle" font-size="9" fill="#8a7a06">重叠区</text>
  <!-- total bracket -->
  <path d="M 180 296 L 380 296" stroke="#2e8b57" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 180 292 L 180 300 M 380 292 L 380 300" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#2e8b57">total ≈ max(T_c, T_a)</text>

  <!-- ============ summary ============ -->
  <line x1="40" y1="328" x2="900" y2="328" stroke="#eee" stroke-width="1" filter="url(#sk)"/>
  <text x="470" y="352" text-anchor="middle" font-size="11" fill="#444">
    实现：compute_stream.wait_stream(default) → launch GEMM；comm_stream 并行 launch all-reduce
  </text>
  <text x="470" y="368" text-anchor="middle" font-size="11" fill="#444">
    进阶：CUDA Graph 捕获双流 launch 序列，消除 Python/CPU launch 开销
  </text>
</svg>
