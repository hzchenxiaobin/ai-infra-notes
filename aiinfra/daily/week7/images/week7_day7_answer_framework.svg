<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="75" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="360" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">调度题答题框架（四步法）</text>
  <path d="M 260 42 Q 430 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="68" width="780" height="60" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="92" font-size="14" font-weight="bold" fill="#2b6e9e">① 先定性</text>
  <text x="60" y="114" font-size="11" fill="#444">这属于哪类策略（Continuous / Priority / Chunked / Prefix Cache / PD 分离）？</text>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="140" width="780" height="60" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="164" font-size="14" font-weight="bold" fill="#2e6e2e">② 给机制</text>
  <text x="60" y="186" font-size="11" fill="#444">底层原理（request vs iteration 级、token budget、block hash、双池 + RDMA）</text>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="212" width="780" height="60" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="236" font-size="14" font-weight="bold" fill="#7a5415">③ 量化</text>
  <text x="60" y="258" font-size="11" fill="#444">数据支撑（吞吐 2-8x、延迟尖峰降 40%、命中率 80-95%、TTFT/TPOT 改善 75%/62%）</text>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="284" width="780" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="308" font-size="14" font-weight="bold" fill="#7a2828">④ 给方案</text>
  <text x="60" y="330" font-size="11" fill="#444">3 个以上方向，分"标配"和"按需叠加"</text>
</svg>
