<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="860" height="320" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Mini 引擎 v1 要点速览</text>
  <path d="M 260 42 Q 430 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 异步流 -->
  <g filter="url(#sk)">
    <rect x="40" y="68" width="780" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="96" font-size="12" fill="#444">submit()</text>
  <text x="130" y="96" font-size="12" fill="#2b6e9e" font-weight="bold">→ Future（异步）</text>
  <text x="290" y="96" font-size="12" fill="#444">→ 后台 worker 做 Continuous Batching</text>

  <!-- 四组件 -->
  <g filter="url(#sk)">
    <rect x="40" y="128" width="780" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="156" font-size="12" fill="#2e6e2e" font-weight="bold">四组件：</text>
  <text x="140" y="156" font-size="11" fill="#444">Request Queue</text>
  <text x="260" y="156" font-size="11" fill="#888">+</text>
  <text x="280" y="156" font-size="11" fill="#444">Scheduler</text>
  <text x="370" y="156" font-size="11" fill="#888">+</text>
  <text x="390" y="156" font-size="11" fill="#444">Worker</text>
  <text x="470" y="156" font-size="11" fill="#888">+</text>
  <text x="490" y="156" font-size="11" fill="#444">Future</text>

  <!-- 锁策略 -->
  <g filter="url(#sk)">
    <rect x="40" y="188" width="780" height="48" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="216" font-size="12" fill="#444">锁内只做队列操作（快），锁外做 forward（慢但不阻塞 submit）</text>

  <!-- 实测 -->
  <g filter="url(#sk)">
    <rect x="40" y="248" width="780" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" fill-opacity="0.35"/>
  </g>
  <text x="60" y="272" font-size="12" fill="#444">实测：4 请求 8 轮完成（v0 串行需 23 次 forward）</text>
  <text x="60" y="292" font-size="13" fill="#b03a3a" font-weight="bold">并发收益 2.9x</text>
</svg>
