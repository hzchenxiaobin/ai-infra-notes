<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="280" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Dynamic Batching 的长请求阻塞问题</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">Batch = [R1(gen=5), R2(gen=100)]</text>

  <!-- iter 1-5: both decode -->
  <g filter="url(#sk)">
    <rect x="40" y="74" width="780" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="96" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">iter 1-5</text>
  <text x="200" y="96" font-size="12" fill="#444">R1 和 R2 都在 decode</text>
  <text x="500" y="96" font-size="11" fill="#2e6e2e">正常并行</text>

  <!-- iter 6: R1 done -->
  <g filter="url(#sk)">
    <rect x="40" y="126" width="780" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="148" font-size="12" fill="#7a5415" font-weight="bold" font-family="monospace">iter 6</text>
  <text x="200" y="148" font-size="12" fill="#444">R1 完成了！但 R2 还在跑...</text>
  <text x="500" y="148" font-size="11" fill="#c98a2b" font-weight="bold">R1 的 slot 开始空等</text>

  <!-- iter 6-100: waste -->
  <g filter="url(#sk)">
    <rect x="40" y="178" width="780" height="44" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="200" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">iter 6-100</text>
  <text x="200" y="200" font-size="12" fill="#444">R1 的 GPU slot 空等 R2</text>
  <text x="500" y="200" font-size="11" fill="#b03a3a" font-weight="bold">→ 95 iterations 的浪费</text>

  <!-- 底部总结 -->
  <g filter="url(#sk)">
    <rect x="40" y="234" width="780" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" fill-opacity="0.4"/>
  </g>
  <text x="430" y="256" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">request-level 聚合 → 长请求阻塞短请求，完成的必须等整批结束</text>
</svg>
