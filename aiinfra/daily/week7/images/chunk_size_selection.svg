<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="340" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">chunk_size 的选择：TTFT vs TPOT 权衡</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 太小 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="780" height="80" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="88" font-size="13" fill="#b03a3a" font-weight="bold">chunk_size 太小（如 64）</text>
  <text x="60" y="110" font-size="11" fill="#444">→ 长 prompt 要很多轮才 prefill 完，首 token 延迟（TTFT）增加</text>
  <text x="60" y="130" font-size="11" fill="#2e6e2e">→ 但 decode 延迟最平滑</text>

  <!-- 太大 -->
  <g filter="url(#sk)">
    <rect x="40" y="154" width="780" height="60" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="178" font-size="13" fill="#7a5415" font-weight="bold">chunk_size 太大（如 8192）</text>
  <text x="60" y="200" font-size="11" fill="#444">→ 退化为 naive prefill，decode 延迟又突增</text>

  <!-- 经验值 -->
  <g filter="url(#sk)">
    <rect x="40" y="224" width="780" height="80" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="60" y="248" font-size="13" fill="#2e6e2e" font-weight="bold">经验值：chunk_size = 512 ~ 2048（vLLM 默认 2048）</text>
  <text x="60" y="270" font-size="11" fill="#444">→ 在 TTFT 和 TPOT 间取平衡</text>
  <text x="60" y="290" font-size="11" fill="#2e6e2e" font-weight="bold">TTFT SLA 严 → 大 chunk；TPOT SLA 严 → 小 chunk</text>
</svg>
