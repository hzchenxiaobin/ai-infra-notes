<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>

  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Demo 1: RECOMPUTE 抢占时间线</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="60" text-anchor="middle" font-size="11" fill="#888">S1/S2(prompt=8,gen=3) + S3(prompt=4,gen=1) | 4 blocks × 4 token = 16 token 显存</text>

  <!-- preemption event banner -->
  <g filter="url(#sk)">
    <rect x="40" y="76" width="780" height="32" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="96" font-size="12" fill="#b03a3a" font-weight="bold">⚡ iter 2: 触发 RECOMPUTE 抢占！被抢占序列丢弃 KV Cache，回到 waiting 队首重新 prefill</text>

  <!-- column headers -->
  <text x="70" y="132" font-size="11" font-weight="bold" fill="#888">Iter</text>
  <text x="140" y="132" font-size="11" font-weight="bold" fill="#888">Batch 内容</text>
  <text x="560" y="132" font-size="11" font-weight="bold" fill="#888">FreeBlk</text>
  <text x="640" y="132" font-size="11" font-weight="bold" fill="#888">W/R/S</text>
  <text x="730" y="132" font-size="11" font-weight="bold" fill="#888">事件</text>
  <line x1="50" y1="138" x2="810" y2="138" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- iter 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="144" width="780" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" fill-opacity="0.3"/>
  </g>
  <text x="70" y="172" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)">
    <rect x="130" y="156" width="135" height="24" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="197" y="172" text-anchor="middle" font-size="11" fill="#2b6e9e">S1 prefill g=0</text>
  <g filter="url(#sk)">
    <rect x="275" y="156" width="135" height="24" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="342" y="172" text-anchor="middle" font-size="11" fill="#2b6e9e">S2 prefill g=0</text>
  <text x="565" y="172" font-size="12" fill="#444" font-family="monospace">0</text>
  <text x="645" y="172" font-size="12" fill="#444" font-family="monospace">1/2/0</text>
  <text x="730" y="172" font-size="11" fill="#999">—</text>

  <!-- iter 2 - PREEMPTION -->
  <g filter="url(#sk)">
    <rect x="40" y="200" width="780" height="48" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.3"/>
  </g>
  <text x="70" y="228" font-size="13" font-weight="bold" fill="#b03a3a">2</text>
  <g filter="url(#sk)">
    <rect x="130" y="212" width="135" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="197" y="228" text-anchor="middle" font-size="11" fill="#2e6e2e">S2 decode g=1</text>
  <g filter="url(#sk)">
    <rect x="275" y="212" width="135" height="24" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="342" y="228" text-anchor="middle" font-size="11" fill="#2b6e9e">S3 prefill g=0</text>
  <text x="565" y="228" font-size="12" fill="#444" font-family="monospace">0</text>
  <text x="645" y="228" font-size="12" fill="#444" font-family="monospace">1/2/0</text>
  <text x="730" y="228" font-size="11" fill="#b03a3a" font-weight="bold">⚡ 抢占 S1</text>

  <!-- preempted S1 annotation -->
  <path d="M 197 236 Q 197 250 197 250" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#ar)" stroke-dasharray="4 2" filter="url(#sk)"/>
  <text x="197" y="262" text-anchor="middle" font-size="10" fill="#b03a3a">S1 → waiting (g 归零)</text>

  <!-- iter 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="272" width="780" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" fill-opacity="0.3"/>
  </g>
  <text x="70" y="298" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)">
    <rect x="130" y="284" width="135" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="197" y="300" text-anchor="middle" font-size="11" fill="#2e6e2e">S2 decode g=2</text>
  <text x="565" y="298" font-size="12" fill="#444" font-family="monospace">1</text>
  <text x="645" y="298" font-size="12" fill="#444" font-family="monospace">1/1/0</text>
  <text x="730" y="298" font-size="11" fill="#999">—</text>

  <!-- iter 4 - RE-PREFILL -->
  <g filter="url(#sk)">
    <rect x="40" y="324" width="780" height="48" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" fill-opacity="0.3"/>
  </g>
  <text x="70" y="352" font-size="13" font-weight="bold" fill="#7a5415">4</text>
  <g filter="url(#sk)">
    <rect x="130" y="336" width="155" height="24" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="207" y="352" text-anchor="middle" font-size="11" fill="#7a5415">S1 re-prefill g=0</text>
  <text x="565" y="352" font-size="12" fill="#444" font-family="monospace">2</text>
  <text x="645" y="352" font-size="12" fill="#444" font-family="monospace">0/1/0</text>
  <text x="730" y="352" font-size="11" fill="#c98a2b" font-weight="bold">← g 归零重算</text>

  <!-- ... -->
  <text x="430" y="396" text-anchor="middle" font-size="14" fill="#aaa">...</text>

  <!-- iter 7 - DONE -->
  <g filter="url(#sk)">
    <rect x="40" y="408" width="780" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.3"/>
  </g>
  <text x="70" y="436" font-size="13" font-weight="bold" fill="#2e6e2e">7</text>
  <text x="197" y="436" text-anchor="middle" font-size="11" fill="#888">(空 batch — 全部完成)</text>
  <text x="565" y="436" font-size="12" fill="#444" font-family="monospace">4</text>
  <text x="645" y="436" font-size="12" fill="#444" font-family="monospace">0/0/0</text>
  <text x="730" y="436" font-size="11" fill="#2e6e2e" font-weight="bold">✅ 全部完成</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="40" y="472" width="780" height="52" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="496" font-size="12" font-weight="bold" fill="#444">总 iterations: 7</text>
  <text x="60" y="514" font-size="11" fill="#666">RECOMPUTE 模式：被抢占序列丢弃 KV Cache，重新 prefill（无 CPU 换出）</text>
</svg>
