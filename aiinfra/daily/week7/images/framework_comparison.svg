<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="18" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="940" height="430" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">四大推理框架调度策略对比</text>
  <path d="M 300 40 Q 470 48 640 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers -->
  <g filter="url(#sk)"><rect x="140" y="56" width="186" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="233" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">vLLM</text>

  <g filter="url(#sk)"><rect x="334" y="56" width="186" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="427" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">TensorRT-LLM</text>

  <g filter="url(#sk)"><rect x="528" y="56" width="186" height="34" rx="6" fill="#f3e8fa" stroke="#7a4a9e" stroke-width="1.5"/></g>
  <text x="621" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a2e7e">SGLang</text>

  <g filter="url(#sk)"><rect x="722" y="56" width="186" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="815" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">LightLLM</text>

  <!-- row 1: Batching -->
  <text x="28" y="124" font-size="11" font-weight="bold" fill="#444">Batching</text>
  <g filter="url(#sk)"><rect x="140" y="100" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="233" y="124" text-anchor="middle" font-size="10.5" fill="#2b6e9e">Continuous Batching</text>
  <g filter="url(#sk)"><rect x="334" y="100" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="427" y="124" text-anchor="middle" font-size="10.5" fill="#2e6e2e">Inflight Batching</text>
  <g filter="url(#sk)"><rect x="528" y="100" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="621" y="124" text-anchor="middle" font-size="10.5" fill="#5a2e7e">Continuous Batching</text>
  <g filter="url(#sk)"><rect x="722" y="100" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="815" y="124" text-anchor="middle" font-size="10.5" fill="#7a5415">Dynamic Split Fuse</text>

  <!-- row 2: 调度器 -->
  <text x="28" y="170" font-size="11" font-weight="bold" fill="#444">调度器</text>
  <g filter="url(#sk)"><rect x="140" y="146" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="233" y="170" text-anchor="middle" font-size="10.5" fill="#2b6e9e">Python</text>
  <g filter="url(#sk)"><rect x="334" y="146" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="427" y="170" text-anchor="middle" font-size="10.5" fill="#2e6e2e">C++</text>
  <g filter="url(#sk)"><rect x="528" y="146" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="621" y="170" text-anchor="middle" font-size="10.5" fill="#5a2e7e">Python</text>
  <g filter="url(#sk)"><rect x="722" y="146" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="815" y="170" text-anchor="middle" font-size="10.5" fill="#7a5415">Python / C++</text>

  <!-- row 3: KV Cache -->
  <text x="28" y="216" font-size="11" font-weight="bold" fill="#444">KV Cache</text>
  <g filter="url(#sk)"><rect x="140" y="192" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="233" y="216" text-anchor="middle" font-size="10.5" fill="#2b6e9e">PagedAttention</text>
  <g filter="url(#sk)"><rect x="334" y="192" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="427" y="216" text-anchor="middle" font-size="10.5" fill="#2e6e2e">PagedAttention</text>
  <g filter="url(#sk)"><rect x="528" y="192" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="621" y="216" text-anchor="middle" font-size="10.5" fill="#5a2e7e">PagedAttention</text>
  <g filter="url(#sk)"><rect x="722" y="192" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="815" y="216" text-anchor="middle" font-size="10.5" fill="#7a5415">Token Attention</text>

  <!-- row 4: Chunked Prefill -->
  <text x="28" y="262" font-size="11" font-weight="bold" fill="#444">Chunked Prefill</text>
  <g filter="url(#sk)"><rect x="140" y="238" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="233" y="262" text-anchor="middle" font-size="10.5" fill="#2b6e9e">0.5+ 版本引入</text>
  <g filter="url(#sk)"><rect x="334" y="238" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="427" y="262" text-anchor="middle" font-size="10.5" fill="#2e6e2e">原生支持</text>
  <g filter="url(#sk)"><rect x="528" y="238" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="621" y="262" text-anchor="middle" font-size="10.5" fill="#5a2e7e">原生支持</text>
  <g filter="url(#sk)"><rect x="722" y="238" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="815" y="262" text-anchor="middle" font-size="10.5" fill="#7a5415">Split Fuse</text>

  <!-- row 5: Prefix Caching（SGLang 的独门差异高亮） -->
  <text x="28" y="308" font-size="11" font-weight="bold" fill="#444">Prefix Caching</text>
  <g filter="url(#sk)"><rect x="140" y="284" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="233" y="308" text-anchor="middle" font-size="10.5" fill="#2b6e9e">block-hash APC</text>
  <g filter="url(#sk)"><rect x="334" y="284" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="427" y="308" text-anchor="middle" font-size="10.5" fill="#2e6e2e">KV cache reuse</text>
  <g filter="url(#sk)"><rect x="528" y="284" width="186" height="40" rx="4" fill="#f3e8fa" stroke="#7a4a9e" stroke-width="1.8"/></g>
  <text x="621" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5a2e7e">RadixAttention ★</text>
  <g filter="url(#sk)"><rect x="722" y="284" width="186" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>
  <text x="815" y="308" text-anchor="middle" font-size="10.5" fill="#7a5415">block-hash</text>

  <!-- bottom takeaway -->
  <path d="M 60 344 L 880 344" stroke="#d6a040" stroke-width="1" stroke-dasharray="5,5" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="60" y="352" width="820" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="470" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">表层已趋同：分页 KV Cache + 连续批处理是各家标配</text>
  <text x="470" y="395" text-anchor="middle" font-size="11" fill="#7a5415">真正的分水岭在 Prefix Caching——SGLang 的 RadixAttention 用 token 级基数树做前缀复用（★）</text>
</svg>
