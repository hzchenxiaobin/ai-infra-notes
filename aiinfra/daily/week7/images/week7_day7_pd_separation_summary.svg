<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="74" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="880" height="420" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">PD 分离要点速览</text>
  <path d="M 280 42 Q 440 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 动机 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="800" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="88" font-size="12" fill="#7a2828" font-weight="bold">动机</text>
  <text x="60" y="108" font-size="11" fill="#444">prefill compute-bound vs decode memory-bound 资源错配 + TTFT/TPOT SLO 矛盾</text>

  <!-- 架构 -->
  <g filter="url(#sk)">
    <rect x="40" y="132" width="800" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="156" font-size="12" fill="#2b6e9e" font-weight="bold">架构</text>
  <text x="60" y="176" font-size="11" fill="#444">Router + Prefill Pool（算力型）+ Decode Pool（显存型）+ KV 传输层（RDMA）</text>

  <!-- KV 传输 -->
  <g filter="url(#sk)">
    <rect x="40" y="200" width="800" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="224" font-size="12" fill="#7a5415" font-weight="bold">KV 传输</text>
  <text x="60" y="244" font-size="11" fill="#444">= seq_len × kv_bytes_per_token / RDMA 带宽</text>
  <text x="420" y="244" font-size="11" fill="#7a5415">（LLaMA-7B 32K：16GB → 160ms）</text>

  <!-- 收益与代价 -->
  <g filter="url(#sk)">
    <rect x="40" y="268" width="800" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="292" font-size="12" fill="#2e6e2e" font-weight="bold">收益</text>
  <text x="120" y="292" font-size="11" fill="#444">TTFT/TPOT 改善 75%/62%，p99 更显著</text>
  <text x="460" y="292" font-size="12" fill="#b85450" font-weight="bold">代价</text>
  <text x="520" y="292" font-size="11" fill="#444">传输开销 + 双池复杂度</text>
  <text x="60" y="312" font-size="11" fill="#888">不划算：短 prompt、低 QPS、单机够用</text>

  <!-- 与 Chunked Prefill 互补 -->
  <g filter="url(#sk)">
    <rect x="40" y="336" width="800" height="56" rx="8" fill="#f3e8fa" stroke="#7a4a9e" stroke-width="1.5" fill-opacity="0.35"/>
  </g>
  <text x="60" y="360" font-size="12" fill="#5a2e7e" font-weight="bold">与 Chunked Prefill 互补</text>
  <text x="60" y="380" font-size="11" fill="#444">Chunked Prefill = 单机调度优化；PD 分离 = 跨机架构优化——层次不同，可叠加</text>
</svg>
