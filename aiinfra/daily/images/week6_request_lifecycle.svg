<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="16" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="540" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">请求生命周期</text>
  <path d="M 230 44 Q 360 52 490 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="360" y="60" text-anchor="middle" font-size="11" fill="#888">submit() → WAITING → RUNNING（prefill → decode 循环）→ FINISHED → 异步返回</text>

  <!-- submit() -->
  <g filter="url(#sk)" font-size="12" text-anchor="middle">
    <rect x="270" y="80" width="180" height="38" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/>
    <text x="360" y="104" fill="#5d3a7e" font-weight="bold">submit() 立即返回 Future</text>
  </g>

  <g filter="url(#sk)" stroke="#5a5a5a" stroke-width="1.4" fill="none">
    <path d="M 360 118 L 360 144" marker-end="url(#ar)"/>
  </g>

  <!-- WAITING -->
  <g filter="url(#sk)" font-size="13" text-anchor="middle">
    <rect x="260" y="148" width="200" height="52" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <text x="360" y="172" fill="#2b6e9e" font-weight="bold" font-size="15">WAITING</text>
    <text x="360" y="190" fill="#2b6e9e" font-size="11">入队 · 等 token budget</text>
  </g>

  <!-- 入口折线：WAITING → Prefill -->
  <g filter="url(#sk)" stroke="#5a5a5a" stroke-width="1.4" fill="none">
    <path d="M 360 200 L 360 240 Q 360 248 352 248 L 236 248 Q 228 248 228 256 L 228 270" marker-end="url(#ar)"/>
  </g>
  <text x="372" y="222" font-size="10" fill="#666">schedule 选中</text>

  <!-- RUNNING 容器：prefill → decode 串行 -->
  <g filter="url(#sk)">
    <rect x="110" y="230" width="470" height="164" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="550" y="254" fill="#2e6e2e" font-weight="bold" font-size="15" text-anchor="end">RUNNING</text>
  </g>

  <!-- Prefill -->
  <g filter="url(#sk)" font-size="11" text-anchor="middle">
    <rect x="133" y="274" width="190" height="92" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <text x="228" y="296" fill="#7a5415" font-weight="bold" font-size="13">Prefill</text>
    <text x="228" y="316" fill="#7a5415" font-size="10">一次性处理 prompt</text>
    <text x="228" y="332" fill="#7a5415" font-size="10">建立 KV Cache</text>
    <text x="228" y="352" fill="#7a5415" font-size="9" font-style="italic">（仅 1 次）</text>
  </g>

  <!-- Prefill → Decode -->
  <g filter="url(#sk)" stroke="#5a5a5a" stroke-width="1.4" fill="none">
    <path d="M 323 324 L 381 324" marker-end="url(#ar)"/>
  </g>
  <text x="352" y="315" font-size="9" fill="#7a5415" text-anchor="middle">KV 就绪</text>

  <!-- Decode -->
  <g filter="url(#sk)" font-size="11" text-anchor="middle">
    <rect x="385" y="274" width="155" height="92" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <text x="463" y="296" fill="#7a5415" font-weight="bold" font-size="13">Decode</text>
    <text x="463" y="316" fill="#7a5415" font-size="10">每轮生成 1 token</text>
    <text x="463" y="332" fill="#7a5415" font-size="10">复用 KV Cache</text>
    <text x="463" y="352" fill="#7a5415" font-size="9" font-style="italic">循环 max_new_tokens 次</text>
  </g>

  <!-- decode 自环（容器内） -->
  <g filter="url(#sk)" stroke="#7a5415" stroke-width="1.2" fill="none" stroke-dasharray="3 2">
    <path d="M 540 298 C 575 298 575 348 540 348" marker-end="url(#ar)"/>
  </g>
  <text x="558" y="290" font-size="9" fill="#7a5415" text-anchor="middle">循环</text>

  <!-- 出口折线：Decode → FINISHED -->
  <g filter="url(#sk)" stroke="#5a5a5a" stroke-width="1.4" fill="none">
    <path d="M 463 366 L 463 376 Q 463 384 455 384 L 368 384 Q 360 384 360 392 L 360 426" marker-end="url(#ar)"/>
  </g>
  <text x="372" y="414" font-size="10" fill="#666">gen 满 max_new_tokens</text>

  <!-- FINISHED -->
  <g filter="url(#sk)" font-size="13" text-anchor="middle">
    <rect x="260" y="430" width="200" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="360" y="454" fill="#b85450" font-weight="bold" font-size="15">FINISHED</text>
    <text x="360" y="472" fill="#b85450" font-size="11">从 running 移除 · 释放资源</text>
  </g>

  <!-- 异步返回（右侧，避开容器） -->
  <g filter="url(#sk)" stroke="#5d3a7e" stroke-width="1.3" fill="none" stroke-dasharray="4 3">
    <path d="M 460 456 L 610 456 L 610 99 L 454 99" marker-end="url(#ar)"/>
  </g>
  <text x="620" y="278" font-size="10" fill="#5d3a7e" text-anchor="middle" transform="rotate(-90 620 278)">future.set_result() 异步返回</text>

  <text x="360" y="504" text-anchor="middle" font-size="10" fill="#888">Prefill 仅 1 次（建 KV）· Decode 循环 max_new_tokens 次（复用 KV）· 完成即异步通知</text>
  <text x="360" y="520" text-anchor="middle" font-size="9" fill="#aaa">对应 Day 2-3 Scheduler 状态机 · v1 用 Future 实现异步返回</text>
</svg>
