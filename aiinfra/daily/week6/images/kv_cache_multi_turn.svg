<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">多轮对话中的 KV Cache 复用</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 对话内容 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="420" height="180" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="86" font-size="12" fill="#2b6e9e" font-weight="bold">对话</text>

  <text x="60" y="108" font-size="11" fill="#444" font-weight="bold">Round 1</text>
  <text x="60" y="124" font-size="11" fill="#444">User: "你好"</text>
  <text x="60" y="140" font-size="11" fill="#444">Model: "你好！有什么可以帮你？"</text>

  <text x="60" y="168" font-size="11" fill="#444" font-weight="bold">Round 2</text>
  <text x="60" y="184" font-size="11" fill="#444">User: "请介绍一下 FlashAttention"</text>
  <text x="60" y="200" font-size="11" fill="#444">Model: "FlashAttention 是..."</text>

  <text x="60" y="228" font-size="10" fill="#888">Round 2 prompt = [系统提示] + [Round 1 全部] + [Round 2 User]</text>

  <!-- ===== Cache 复用流程 ===== -->
  <g filter="url(#sk)">
    <rect x="480" y="64" width="420" height="340" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="690" y="86" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">Cache 复用流程</text>

  <!-- Round 1 cache -->
  <g filter="url(#sk)">
    <rect x="500" y="100" width="380" height="60" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="516" y="120" font-size="11" fill="#2e6e2e" font-weight="bold">Round 1 算完</text>
  <g fill="#bfe0bf" stroke="#4a8e4a" stroke-width="0.8">
    <rect x="516" y="128" width="20" height="20" rx="2"/>
    <rect x="538" y="128" width="20" height="20" rx="2"/>
    <rect x="560" y="128" width="20" height="20" rx="2"/>
    <rect x="582" y="128" width="20" height="20" rx="2"/>
  </g>
  <text x="620" y="142" font-size="10" fill="#2e6e2e">K/V 已存入 cache（保留）</text>

  <!-- 箭头 -->
  <path d="M 690 162 L 690 178" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Round 2 新增 -->
  <g filter="url(#sk)">
    <rect x="500" y="184" width="380" height="80" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="516" y="204" font-size="11" fill="#7a5415" font-weight="bold">Round 2：只算新增 tokens</text>
  <g fill="#bfe0bf" stroke="#4a8e4a" stroke-width="0.8">
    <rect x="516" y="214" width="20" height="20" rx="2"/>
    <rect x="538" y="214" width="20" height="20" rx="2"/>
    <rect x="560" y="214" width="20" height="20" rx="2"/>
    <rect x="582" y="214" width="20" height="20" rx="2"/>
  </g>
  <g fill="#f0d9a8" stroke="#c98a2b" stroke-width="1.2">
    <rect x="606" y="214" width="20" height="20" rx="2"/>
    <rect x="628" y="214" width="20" height="20" rx="2"/>
  </g>
  <text x="516" y="252" font-size="10" fill="#2e6e2e">已有（复用）</text>
  <text x="624" y="252" font-size="10" fill="#b03a3a" font-weight="bold">新增（prefill + append）</text>

  <!-- 箭头 -->
  <path d="M 690 266 L 690 282" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结果 -->
  <g filter="url(#sk)">
    <rect x="500" y="288" width="380" height="50" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="690" y="308" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">不用整个 Round 2 prompt 重新 prefill</text>
  <text x="690" y="326" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">→ TTFT 大幅降低</text>

  <!-- 实现要点 -->
  <g filter="url(#sk)">
    <rect x="500" y="350" width="380" height="48" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="516" y="368" font-size="10" fill="#444">① 每个对话 session 维护独立 KV Cache</text>
  <text x="516" y="384" font-size="10" fill="#444">② 检查已缓存长度 → 只 prefill 新增 → append → decode 继续 append</text>

  <!-- 底部注意 -->
  <g filter="url(#sk)">
    <rect x="40" y="264" width="420" height="140" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.3"/>
  </g>
  <text x="60" y="286" font-size="12" fill="#b03a3a" font-weight="bold">⚠ 前提条件</text>
  <text x="60" y="306" font-size="11" fill="#444">Round 2 的 prompt 必须严格是</text>
  <text x="60" y="322" font-size="11" fill="#444">"Round 1 全部 + 新输入"的拼接</text>
  <text x="60" y="344" font-size="11" fill="#444">格式/顺序不能变，否则 cache 无法复用</text>
  <text x="60" y="362" font-size="11" fill="#444">（prefix 对不上）</text>
  <text x="60" y="386" font-size="10" fill="#888">生产系统（vLLM）用 prefix caching 显式管理</text>

  <!-- 连接箭头：对话 → 复用 -->
  <path d="M 460 154 L 480 154" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 底部总结 -->
  <g filter="url(#sk)">
    <rect x="40" y="420" width="860" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" fill-opacity="0.4"/>
  </g>
  <text x="470" y="438" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">Round 1 的 K/V 保留 → Round 2 只算新增 token → TTFT 大幅降低（前提：prompt 格式严格一致）</text>
</svg>
