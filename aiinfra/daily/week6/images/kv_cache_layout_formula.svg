<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="300" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">KV Cache 5D 内存布局与显存公式</text>
  <path d="M 270 40 Q 430 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 布局公式 -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="780" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="80" font-size="12" fill="#2b6e9e" font-weight="bold">布局</text>
  <text x="60" y="102" font-size="14" fill="#2b2b2b" font-family="monospace">k_cache[num_layers, batch_size, num_heads, max_seq_len, d_head]</text>
  <text x="60" y="118" font-size="14" fill="#2b2b2b" font-family="monospace">v_cache[num_layers, batch_size, num_heads, max_seq_len, d_head]</text>

  <!-- 每 token 大小 -->
  <g filter="url(#sk)">
    <rect x="40" y="134" width="380" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="156" font-size="12" fill="#b03a3a" font-weight="bold">每 token KV Cache 大小</text>
  <text x="60" y="176" font-size="13" fill="#2b2b2b" font-family="monospace">= 2 × num_layers × num_heads</text>
  <text x="60" y="194" font-size="13" fill="#2b2b2b" font-family="monospace">  × d_head × bytes_per_elem</text>
  <text x="280" y="176" font-size="10" fill="#888">（2 = K 和 V 各一份）</text>

  <!-- 总大小 -->
  <g filter="url(#sk)">
    <rect x="440" y="134" width="380" height="70" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="460" y="156" font-size="12" fill="#2b2b2b" font-weight="bold">总 KV Cache 大小</text>
  <text x="460" y="176" font-size="13" fill="#2b2b2b" font-family="monospace">= batch_size × seq_len × per_token</text>
  <text x="460" y="194" font-size="13" fill="#2b2b2b" font-family="monospace">= B × L × 2 × n_layers × n_heads</text>
  <text x="460" y="208" font-size="11" fill="#444" font-family="monospace">  × d_head × bytes</text>

  <!-- 底部直觉 -->
  <g filter="url(#sk)">
    <rect x="40" y="218" width="780" height="70" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.4"/>
  </g>
  <text x="60" y="240" font-size="12" fill="#2e6e2e" font-weight="bold">为什么 d_head 维放最内层？</text>
  <text x="60" y="258" font-size="11" fill="#444">d_head 连续 → 同一 token 同一 head 的 d 个元素内存连续，attention 点积时一次 coalesced 读 d 个 float，带宽最高</text>
  <text x="60" y="276" font-size="11" fill="#444">seq_len 维在外层 → append 新 token 只需在尾部写入，不搬移已有数据</text>
</svg>
