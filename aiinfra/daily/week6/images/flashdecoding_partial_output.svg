<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="39" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="220" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">每个 block 输出的 partial 结果</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">Block j 处理 KV 段 [j·Bc, (j+1)·Bc)</text>

  <!-- partial_m -->
  <g filter="url(#sk)">
    <rect x="40" y="74" width="780" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="96" font-size="12" fill="#2b6e9e" font-weight="bold" font-family="monospace">partial_m_j</text>
  <text x="220" y="96" font-size="12" fill="#444" font-family="monospace">= max(score in block j)</text>
  <text x="520" y="96" font-size="11" fill="#666">本段 score 最大值</text>

  <!-- partial_l -->
  <g filter="url(#sk)">
    <rect x="40" y="122" width="780" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="144" font-size="12" fill="#7a5415" font-weight="bold" font-family="monospace">partial_l_j</text>
  <text x="220" y="144" font-size="12" fill="#444" font-family="monospace">= Σ exp(score - partial_m_j)</text>
  <text x="520" y="144" font-size="11" fill="#666">本段 exp 之和（已 rescale 到本段 max）</text>

  <!-- partial_o -->
  <g filter="url(#sk)">
    <rect x="40" y="170" width="780" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="192" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">partial_o_j</text>
  <text x="220" y="192" font-size="12" fill="#444" font-family="monospace">= Σ p_i · V_i</text>
  <text x="520" y="192" font-size="11" fill="#666">本段加权 V 输出（已 rescale）</text>
</svg>
