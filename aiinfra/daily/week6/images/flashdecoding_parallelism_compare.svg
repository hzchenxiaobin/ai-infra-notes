<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="300" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Prefill vs Decode 并行度对比</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Prefill -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="380" height="110" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="230" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">Prefill 阶段（M=N）</text>
  <text x="60" y="110" font-size="11" fill="#444" font-family="monospace">Q 有 N 行 → 按 Br 切成 N/Br 个 Q tile</text>
  <text x="60" y="128" font-size="11" fill="#444" font-family="monospace">→ N/Br 个 block 并行</text>
  <text x="60" y="150" font-size="12" fill="#2e6e2e" font-weight="bold" font-family="monospace">并行度 = N/Br × Batch × Head</text>
  <text x="60" y="168" font-size="11" fill="#666">数百~数千 block，打满 GPU</text>

  <!-- Decode -->
  <g filter="url(#sk)">
    <rect x="440" y="64" width="380" height="110" rx="10" fill="#fdecec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="630" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">Decode 阶段（M=1）</text>
  <text x="460" y="110" font-size="11" fill="#444" font-family="monospace">Q 只有 1 行 → 无法按 Q tile 切分</text>
  <text x="460" y="128" font-size="11" fill="#444" font-family="monospace">→ 只有 1 个 block 处理整个 KV</text>
  <text x="460" y="150" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">并行度 = 1 × Batch × Head</text>
  <text x="460" y="168" font-size="11" fill="#666">可能 &lt; SM 数，大量 SM 空闲</text>

  <!-- 底部总结 -->
  <g filter="url(#sk)">
    <rect x="40" y="194" width="780" height="90" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.4"/>
  </g>
  <text x="60" y="218" font-size="12" fill="#7a5415" font-weight="bold">核心矛盾</text>
  <text x="60" y="238" font-size="11" fill="#444">FlashAttention 的并行维度是 Q tile（行方向）——Prefill 时 Q 有 N 行可以切；Decode 时 Q 只有 1 行，切不了。</text>
  <text x="60" y="256" font-size="11" fill="#444">KV sequence 再长，也只有一个 block 串行扫描——GPU 的 170 个 SM 里 169 个在干等。</text>
  <text x="60" y="274" font-size="11" fill="#b03a3a" font-weight="bold">→ FlashDecoding 破局：Q 切不了，那就切 KV</text>
</svg>
