<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="200" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">PagedAttention 关键参数</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- param 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="780" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="86" font-size="13" fill="#2b6e9e" font-weight="bold" font-family="monospace">block_size</text>
  <text x="200" y="86" font-size="12" fill="#444">每 block 容纳多少 token</text>
  <text x="780" y="86" text-anchor="end" font-size="12" fill="#b03a3a" font-weight="bold">vLLM 默认 16</text>

  <!-- param 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="108" width="780" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="132" font-size="13" fill="#7a5415" font-weight="bold" font-family="monospace">num_blocks</text>
  <text x="200" y="132" font-size="12" fill="#444">物理 block 池总大小</text>
  <text x="780" y="132" text-anchor="end" font-size="11" fill="#666">= 可用显存 / block 大小</text>

  <!-- param 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="154" width="780" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="178" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">max_num_blocks_per_seq</text>
  <text x="340" y="178" font-size="12" fill="#444">= ceil(max_seq_len / block_size)</text>
</svg>
