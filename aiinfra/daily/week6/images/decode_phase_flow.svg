<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="62" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#7a5415">Decode 阶段：自回归逐 token 生成</text>
  <path d="M 270 40 Q 430 48 590 40" stroke="#7a5415" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#888">输入 shape = (B, 1, d) · GEMM 退化为向量×矩阵 → memory-bound · 关注 TBT / TPOT</text>

  <!-- Input -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="200" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="140" y="90" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">输入</text>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">(B, 1, d) — 上一个生成的 token</text>

  <path d="M 240 92 L 270 92" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="270" y="70" width="260" height="44" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="290" y="90" font-size="11" fill="#c98a2b" font-weight="bold">①</text>
  <text x="400" y="90" text-anchor="middle" font-size="11" fill="#2b2b2b">计算新 token 的 Q + K/V</text>
  <text x="400" y="106" text-anchor="middle" font-size="10" fill="#888">K/V 追加到 cache</text>

  <path d="M 530 92 L 560 92" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="560" y="70" width="260" height="44" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="580" y="90" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <text x="690" y="90" text-anchor="middle" font-size="11" fill="#2b2b2b">从 KV Cache 读取所有历史 K, V</text>
  <text x="690" y="106" text-anchor="middle" font-size="10" fill="#b85450">2·L·d bytes / 步</text>

  <!-- arrows down -->
  <path d="M 690 114 L 690 130" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 400 114 L 400 130" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" stroke-dasharray="3 2"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="270" y="134" width="260" height="44" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="290" y="154" font-size="11" fill="#c98a2b" font-weight="bold">③</text>
  <text x="400" y="154" text-anchor="middle" font-size="11" fill="#2b2b2b">新 Q 与历史 K/V 做 attention</text>
  <text x="400" y="170" text-anchor="middle" font-size="10" fill="#888">1×N 矩阵 · M=1 退化</text>

  <path d="M 530 156 L 560 156" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="560" y="134" width="260" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="580" y="154" font-size="11" fill="#4a8e4a" font-weight="bold">④</text>
  <text x="690" y="154" text-anchor="middle" font-size="11" fill="#2b2b2b">输出下一个 token 的 logits</text>
  <text x="690" y="170" text-anchor="middle" font-size="10" fill="#888">→ TBT / TPOT</text>

  <!-- Loop arrow back to input -->
  <path d="M 690 178 L 690 200 L 140 200 L 140 114" stroke="#7a5415" stroke-width="1.3" fill="none" marker-end="url(#ar)" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="400" y="196" text-anchor="middle" font-size="10" fill="#7a5415">循环直到 &lt;eos&gt; 或达到最大长度</text>

  <!-- Features box -->
  <g filter="url(#sk)">
    <rect x="40" y="214" width="780" height="120" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.4" fill-opacity="0.3"/>
  </g>
  <text x="60" y="236" font-size="12" fill="#b85450" font-weight="bold">特征</text>

  <g filter="url(#sk)" font-size="11">
    <rect x="60" y="246" width="180" height="34" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="150" y="267" text-anchor="middle" fill="#7a5415" font-weight="bold">向量×矩阵 (M=1)</text>
    <rect x="260" y="246" width="160" height="34" rx="5" fill="#fdecec" stroke="#b85450" stroke-width="1.2"/>
    <text x="340" y="267" text-anchor="middle" fill="#b85450" font-weight="bold">Tensor Core 闲置</text>
    <rect x="440" y="246" width="170" height="34" rx="5" fill="#fdecec" stroke="#b85450" stroke-width="1.2"/>
    <text x="525" y="267" text-anchor="middle" fill="#b85450" font-weight="bold">memory-bound</text>
    <rect x="630" y="246" width="170" height="34" rx="5" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.2"/>
    <text x="715" y="267" text-anchor="middle" fill="#5d3a7e" font-weight="bold">关注: TBT / TPOT</text>
  </g>
  <text x="430" y="308" text-anchor="middle" font-size="10" fill="#888">每步读完整 KV Cache → 算术强度极低 → 卡在带宽线，SM 空闲等数据</text>
  <text x="430" y="324" text-anchor="middle" font-size="10" fill="#888">优化：KV Cache / PagedAttention / Continuous Batching / 量化</text>

  <text x="430" y="372" text-anchor="middle" font-size="10" fill="#888">无 KV Cache 时每步 FLOPs = O(L·d²) 且随长度线性增长</text>
  <text x="430" y="390" text-anchor="middle" font-size="10" fill="#888">有 KV Cache 时每步计算量降到 O(d²)，但每步要搬整个 cache 过 HBM</text>
</svg>
