<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4,L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="300" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">推理系统面试答题框架</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="780" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <g filter="url(#sk)">
    <rect x="56" y="76" width="28" height="28" rx="4" fill="#4a8edb"/>
  </g>
  <text x="70" y="96" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="88" font-size="12" fill="#2b6e9e" font-weight="bold">先定性</text>
  <text x="100" y="106" font-size="11" fill="#444">这属于哪个核心问题（内存 / Batch / Latency / 调度）？</text>

  <path d="M 430 116 L 430 126" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="130" width="780" height="50" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <g filter="url(#sk)">
    <rect x="56" y="142" width="28" height="28" rx="4" fill="#c98a2b"/>
  </g>
  <text x="70" y="162" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="154" font-size="12" fill="#7a5415" font-weight="bold">给机制</text>
  <text x="100" y="172" font-size="11" fill="#444">底层原理是什么（compute vs memory-bound、碎片、launch overhead）？</text>

  <path d="M 430 182 L 430 192" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="196" width="780" height="50" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <g filter="url(#sk)">
    <rect x="56" y="208" width="28" height="28" rx="4" fill="#4a8e4a"/>
  </g>
  <text x="70" y="228" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="220" font-size="12" fill="#2e6e2e" font-weight="bold">量化</text>
  <text x="100" y="238" font-size="11" fill="#444">数据/公式支撑（AI≈1.0、cache=2×L×...、gap&gt;20%）</text>

  <path d="M 430 248 L 430 258" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="780" height="30" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="70" y="282" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="282" font-size="12" fill="#b03a3a" font-weight="bold">给方案</text>
  <text x="170" y="282" font-size="11" fill="#444">3 个以上优化方向，分"治标"和"治本"</text>
</svg>
