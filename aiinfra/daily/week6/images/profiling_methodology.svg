<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="54" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4,L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="280" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Profiling 三层方法论</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Layer 1: nsys -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="240" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="160" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">nsys</text>
  <text x="160" y="108" text-anchor="middle" font-size="11" fill="#666">系统级</text>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#444">看时间线 / gap</text>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#444">kernel 间空闲占比</text>
  <text x="160" y="172" text-anchor="middle" font-size="10" fill="#888">→ 定位"哪里在等"</text>

  <!-- arrow -->
  <path d="M 280 124 L 300 124" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Layer 2: cuda.Event -->
  <g filter="url(#sk)">
    <rect x="310" y="64" width="240" height="120" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="430" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">cuda.Event</text>
  <text x="430" y="108" text-anchor="middle" font-size="11" fill="#666">阶段级</text>
  <text x="430" y="132" text-anchor="middle" font-size="11" fill="#444">测 TTFT / TBT</text>
  <text x="430" y="152" text-anchor="middle" font-size="11" fill="#444">Prefill vs Decode 耗时</text>
  <text x="430" y="172" text-anchor="middle" font-size="10" fill="#888">→ 定位"哪个阶段慢"</text>

  <!-- arrow -->
  <path d="M 550 124 L 570 124" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Layer 3: ncu -->
  <g filter="url(#sk)">
    <rect x="580" y="64" width="240" height="120" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="700" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">ncu</text>
  <text x="700" y="108" text-anchor="middle" font-size="11" fill="#666">kernel 级</text>
  <text x="700" y="132" text-anchor="middle" font-size="11" fill="#444">看带宽 / 算力</text>
  <text x="700" y="152" text-anchor="middle" font-size="11" fill="#444">dram__throughput</text>
  <text x="700" y="172" text-anchor="middle" font-size="10" fill="#888">→ 定位"为什么慢"</text>

  <!-- 底部判据 -->
  <g filter="url(#sk)">
    <rect x="40" y="204" width="780" height="60" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="228" font-size="12" fill="#b03a3a" font-weight="bold">判据</text>
  <text x="120" y="228" font-size="12" fill="#2b2b2b" font-family="monospace">dram__throughput 高 + sm__throughput 低 = memory-bound</text>
  <text x="60" y="250" font-size="11" fill="#666">反之 sm__throughput 高 + dram__throughput 低 = compute-bound → 对应 Prefill vs Decode 的不同优化方向</text>
</svg>
