<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">Prefill 阶段：一次性处理整段 prompt</text>
  <path d="M 270 40 Q 430 48 590 40" stroke="#2b6e9e" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#888">输入 shape = (B, N_prompt, d) · GEMM 大矩阵 → compute-bound · 关注 TTFT</text>

  <!-- Input -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="200" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="140" y="90" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">输入</text>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">(B, N_prompt, d)</text>

  <path d="M 240 92 L 270 92" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="270" y="70" width="260" height="44" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="290" y="90" font-size="11" fill="#4a8edb" font-weight="bold">①</text>
  <text x="400" y="90" text-anchor="middle" font-size="11" fill="#2b2b2b">一次性并行处理所有 prompt tokens</text>
  <text x="400" y="106" text-anchor="middle" font-size="10" fill="#888">M = N_prompt（大）</text>

  <path d="M 530 92 L 560 92" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="560" y="70" width="260" height="44" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="580" y="90" font-size="11" fill="#4a8edb" font-weight="bold">②</text>
  <text x="690" y="90" text-anchor="middle" font-size="11" fill="#2b2b2b">计算所有 token 的 Q, K, V</text>
  <text x="690" y="106" text-anchor="middle" font-size="10" fill="#888">大 GEMM → 打满 Tensor Core</text>

  <!-- arrows down -->
  <path d="M 690 114 L 690 130" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 400 114 L 400 130" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" stroke-dasharray="3 2"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="270" y="134" width="260" height="44" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="290" y="154" font-size="11" fill="#4a8edb" font-weight="bold">③</text>
  <text x="400" y="154" text-anchor="middle" font-size="11" fill="#2b2b2b">prompt 内部 self-attention</text>
  <text x="400" y="170" text-anchor="middle" font-size="10" fill="#888">N×N 完整矩阵 · O(N²) 计算</text>

  <path d="M 530 156 L 560 156" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="560" y="134" width="260" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="580" y="154" font-size="11" fill="#4a8e4a" font-weight="bold">④</text>
  <text x="690" y="154" text-anchor="middle" font-size="11" fill="#2b2b2b">输出第一个新 token 的 logits</text>
  <text x="690" y="170" text-anchor="middle" font-size="10" fill="#888">→ TTFT</text>

  <!-- Features box -->
  <g filter="url(#sk)">
    <rect x="40" y="200" width="780" height="120" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.4" fill-opacity="0.3"/>
  </g>
  <text x="60" y="222" font-size="12" fill="#b85450" font-weight="bold">特征</text>

  <g filter="url(#sk)" font-size="11">
    <rect x="60" y="232" width="180" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="150" y="253" text-anchor="middle" fill="#2b6e9e" font-weight="bold">GEMM 大矩阵 (M=N_prompt)</text>
    <rect x="260" y="232" width="160" height="34" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="340" y="253" text-anchor="middle" fill="#7a5415" font-weight="bold">Attention O(N²)</text>
    <rect x="440" y="232" width="170" height="34" rx="5" fill="#fdecec" stroke="#b85450" stroke-width="1.2"/>
    <text x="525" y="253" text-anchor="middle" fill="#b85450" font-weight="bold">compute-bound</text>
    <rect x="630" y="232" width="170" height="34" rx="5" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.2"/>
    <text x="715" y="253" text-anchor="middle" fill="#5d3a7e" font-weight="bold">关注: TTFT</text>
  </g>
  <text x="430" y="294" text-anchor="middle" font-size="10" fill="#888">算术强度高 → 卡在算力线，Tensor Core 满载</text>
  <text x="430" y="310" text-anchor="middle" font-size="10" fill="#888">FlashAttention 在这里直接适用（大 GEMM + N×N attention）</text>

  <text x="430" y="360" text-anchor="middle" font-size="10" fill="#888">Prefill 本质上和训练的一次前向很像——都是大 GEMM</text>
  <text x="430" y="378" text-anchor="middle" font-size="10" fill="#888">优化：Tensor Core / FlashAttention / 并行 prefill</text>
</svg>
