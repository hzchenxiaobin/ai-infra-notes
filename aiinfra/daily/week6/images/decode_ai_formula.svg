<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="64" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="160" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Decode 算术强度公式</text>
  <path d="M 300 40 Q 430 48 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- Formula box -->
  <g filter="url(#sk)">
    <rect x="80" y="58" width="700" height="60" rx="10" fill="#fdecec" stroke="#b85450" stroke-width="1.5" fill-opacity="0.35"/>
  </g>
  <text x="430" y="84" text-anchor="middle" font-size="15" fill="#2b2b2b" font-family="monospace">AI = FLOPs / Bytes ≈ d / (2·d·bytes_per_float)</text>
  <text x="430" y="106" text-anchor="middle" font-size="16" fill="#b85450" font-family="monospace" font-weight="bold">≈ 0.125 FLOP/Byte (fp16)</text>

  <!-- annotation -->
  <text x="430" y="138" text-anchor="middle" font-size="10" fill="#888">比 Ridge Point (58.45) 低近三个数量级 → 完全卡在显存带宽线上，SM 大量空闲等数据</text>
  <text x="430" y="154" text-anchor="middle" font-size="10" fill="#888">不是算得慢，是数据搬不过来</text>
</svg>
