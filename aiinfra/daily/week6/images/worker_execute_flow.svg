<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="28" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="320" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Worker.execute_model 执行流程</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">vLLM 三层架构最底层：接收 Scheduler 输出 → 构建 attention metadata → 执行前向 → 采样返回</text>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="78" width="780" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <g filter="url(#sk)">
    <rect x="56" y="86" width="26" height="22" rx="4" fill="#4a8edb"/>
  </g>
  <text x="69" y="102" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>
  <text x="94" y="102" font-size="12" fill="#2b2b2b">构建 input tokens 和 positions</text>

  <!-- arrow -->
  <path d="M 430 118 L 430 128" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="132" width="780" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <g filter="url(#sk)">
    <rect x="56" y="140" width="26" height="22" rx="4" fill="#c98a2b"/>
  </g>
  <text x="69" y="156" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>
  <text x="94" y="156" font-size="12" fill="#7a5415" font-weight="bold">构建 attention metadata（含 block table）</text>
  <text x="430" y="156" font-size="11" fill="#b03a3a" font-weight="bold">← PagedAttention 的关键</text>

  <!-- arrow -->
  <path d="M 430 172 L 430 182" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="186" width="780" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <g filter="url(#sk)">
    <rect x="56" y="194" width="26" height="22" rx="4" fill="#4a8edb"/>
  </g>
  <text x="69" y="210" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>
  <text x="94" y="210" font-size="12" fill="#2b2b2b">调用 ModelRunner.run() 执行模型前向</text>

  <!-- arrow -->
  <path d="M 430 226 L 430 236" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="240" width="780" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <g filter="url(#sk)">
    <rect x="56" y="248" width="26" height="22" rx="4" fill="#4a8edb"/>
  </g>
  <text x="69" y="264" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>
  <text x="94" y="264" font-size="12" fill="#2b2b2b">采样得到 next token</text>

  <!-- arrow -->
  <path d="M 430 280 L 430 290" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 5 -->
  <g filter="url(#sk)">
    <rect x="40" y="294" width="780" height="22" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="69" y="310" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">5</text>
  <text x="94" y="310" font-size="12" fill="#2e6e2e" font-weight="bold">返回 outputs</text>
</svg>
