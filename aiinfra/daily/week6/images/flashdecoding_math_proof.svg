<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="45" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="440" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">数学正确性证明</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 标准 softmax -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="780" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="82" font-size="12" fill="#2b6e9e" font-weight="bold">标准 softmax</text>
  <text x="60" y="102" font-size="12" fill="#2b2b2b" font-family="monospace">O = Σ_i exp(s_i - m) · V_i / Σ_i exp(s_i - m),  其中 m = max(all s_i)</text>

  <!-- Block j partial -->
  <g filter="url(#sk)">
    <rect x="40" y="120" width="780" height="64" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="142" font-size="12" fill="#7a5415" font-weight="bold">Block j 的 partial</text>
  <text x="60" y="160" font-size="11" fill="#2b2b2b" font-family="monospace">partial_l_j = Σ_{i∈block_j} exp(s_i - partial_m_j)</text>
  <text x="60" y="178" font-size="11" fill="#2b2b2b" font-family="monospace">partial_o_j = Σ_{i∈block_j} exp(s_i - partial_m_j) · V_i</text>

  <!-- 合并 rescale -->
  <g filter="url(#sk)">
    <rect x="40" y="194" width="780" height="110" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="216" font-size="12" fill="#2e6e2e" font-weight="bold">合并时 rescale</text>
  <text x="60" y="234" font-size="11" fill="#2b2b2b" font-family="monospace">w_j = exp(partial_m_j - global_max) · partial_l_j</text>
  <text x="60" y="250" font-size="11" fill="#2b2b2b" font-family="monospace">    = exp(partial_m_j - global_max) · Σ_{i∈block_j} exp(s_i - partial_m_j)</text>
  <text x="60" y="266" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">    = Σ_{i∈block_j} exp(s_i - global_max)        ← 回到全局 max 基准！</text>
  <text x="60" y="286" font-size="11" fill="#444" font-family="monospace">Σ_j w_j = Σ_j Σ_{i∈block_j} exp(s_i - global_max) = Σ_all exp(s_i - global_max) = global_sum ✓</text>

  <!-- 最终输出 -->
  <g filter="url(#sk)">
    <rect x="40" y="314" width="780" height="110" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="336" font-size="12" fill="#b03a3a" font-weight="bold">最终输出</text>
  <text x="60" y="356" font-size="11" fill="#2b2b2b" font-family="monospace">Σ_j w_j · partial_o_j / global_sum</text>
  <text x="60" y="372" font-size="11" fill="#444" font-family="monospace">  = Σ_j exp(partial_m_j - global_max) · Σ_{i∈j} exp(s_i - partial_m_j) · V_i / global_sum</text>
  <text x="60" y="390" font-size="11" fill="#444" font-family="monospace">  = Σ_all exp(s_i - global_max) · V_i / global_sum</text>
  <text x="60" y="412" font-size="13" fill="#b03a3a" font-weight="bold" font-family="monospace">  = O  ✓</text>
</svg>
