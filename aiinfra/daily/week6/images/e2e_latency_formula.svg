<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="65" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="180" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">推理时延关键关系式</text>
  <path d="M 300 40 Q 430 48 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- Formula 1 -->
  <g filter="url(#sk)">
    <rect x="80" y="56" width="700" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="430" y="84" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="monospace">E2E Latency = TTFT + (输出 token 数 − 1) × TBT</text>

  <!-- Formula 2 -->
  <g filter="url(#sk)">
    <rect x="80" y="110" width="700" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="430" y="138" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="monospace">TPOT = 总 Decode 时延 / 输出 token 数</text>

  <text x="430" y="172" text-anchor="middle" font-size="10" fill="#888">TTFT 由 Prefill 决定 · TBT/TPOT 由 Decode 决定 · 优化手段几乎不重叠</text>
</svg>
