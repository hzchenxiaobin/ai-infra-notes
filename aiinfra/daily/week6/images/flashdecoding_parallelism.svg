<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
    <marker id="arY" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FlashDecoding 并行对比</text>
  <path d="M 300 42 Q 430 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Standard decode：1 个 SM 串行 + 空闲 SM -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="780" height="120" rx="10" fill="#fdecec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.35"/>
    <rect x="60" y="102" width="64" height="26" rx="5" fill="#f6d7d7" stroke="#b03a3a" stroke-width="1.2"/>
    <path d="M 128 115 H 148" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="154" y="102" width="395" height="26" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#d9a3a3" stroke-width="1"/>
    <rect x="162" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="194" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="226" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="258" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="290" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="322" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="354" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="386" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="418" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="450" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="482" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <rect x="514" y="105" width="29" height="20" rx="3" fill="#fdecec" stroke="#b03a3a" stroke-width="0.8"/>
    <path d="M 162 144 H 536" stroke="#b03a3a" stroke-width="1.4" fill="none" marker-end="url(#arR)"/>
    <rect x="570" y="98" width="96" height="26" rx="5" fill="#f4f2ec" stroke="#b5b5b5" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="678" y="98" width="96" height="26" rx="5" fill="#f4f2ec" stroke="#b5b5b5" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="570" y="130" width="96" height="26" rx="5" fill="#f4f2ec" stroke="#b5b5b5" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="678" y="130" width="96" height="26" rx="5" fill="#f4f2ec" stroke="#b5b5b5" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>
  <text x="60" y="88" font-size="13" font-weight="bold" fill="#b03a3a">Standard Decode：1 个 SM 串行扫描整个 KV</text>
  <text x="92" y="119" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">SM 0</text>
  <text x="176.5" y="118" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#b03a3a">0</text>
  <text x="208.5" y="118" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#b03a3a">1</text>
  <text x="240.5" y="118" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#b03a3a">2</text>
  <text x="272.5" y="118" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#b03a3a">3</text>
  <text x="497" y="118" text-anchor="middle" font-size="10" fill="#999">…</text>
  <text x="528.5" y="118" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#b03a3a">N-1</text>
  <text x="351" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">串行扫描：耗时 ∝ N，KV 越长越慢</text>
  <text x="618" y="115" text-anchor="middle" font-size="10.5" fill="#a0a0a0">SM 1</text>
  <text x="726" y="115" text-anchor="middle" font-size="10.5" fill="#a0a0a0">SM 2</text>
  <text x="618" y="147" text-anchor="middle" font-size="10.5" fill="#a0a0a0">SM …</text>
  <text x="726" y="147" text-anchor="middle" font-size="10.5" fill="#a0a0a0">SM 169</text>
  <text x="672" y="172" text-anchor="middle" font-size="10.5" fill="#999">其余 169 个 SM 空闲</text>
  <path d="M 430 184 V 206" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- FlashDecoding：KV 切段，多 SM 并行 -->
  <g filter="url(#sk)">
    <rect x="40" y="210" width="780" height="234" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.35"/>
    <rect x="60" y="264" width="64" height="26" rx="5" fill="#d5ecd5" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 128 277 H 148" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="154" y="264" width="196" height="26" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#9ecf9e" stroke-width="1"/>
    <rect x="162" y="267" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="202" y="267" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="242" y="267" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="302" y="267" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <path d="M 354 277 H 386" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="390" y="264" width="110" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <path d="M 504 277 H 736" stroke="#c98a2b" stroke-width="1.2" fill="none" marker-end="url(#arY)"/>
    <rect x="60" y="296" width="64" height="26" rx="5" fill="#d5ecd5" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 128 309 H 148" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="154" y="296" width="196" height="26" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#9ecf9e" stroke-width="1"/>
    <rect x="162" y="299" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="202" y="299" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="242" y="299" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="302" y="299" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <path d="M 354 309 H 386" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="390" y="296" width="110" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <path d="M 504 309 H 736" stroke="#c98a2b" stroke-width="1.2" fill="none" marker-end="url(#arY)"/>
    <rect x="60" y="328" width="64" height="26" rx="5" fill="#d5ecd5" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 128 341 H 148" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="154" y="328" width="196" height="26" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#9ecf9e" stroke-width="1"/>
    <rect x="162" y="331" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="202" y="331" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="242" y="331" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <rect x="302" y="331" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8"/>
    <path d="M 354 341 H 386" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="390" y="328" width="110" height="26" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <path d="M 504 341 H 736" stroke="#c98a2b" stroke-width="1.2" fill="none" marker-end="url(#arY)"/>
    <rect x="60" y="376" width="64" height="26" rx="5" fill="#d5ecd5" fill-opacity="0.55" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 128 389 H 148" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="154" y="376" width="196" height="26" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#9ecf9e" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="162" y="379" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8" stroke-dasharray="3 2"/>
    <rect x="202" y="379" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8" stroke-dasharray="3 2"/>
    <rect x="242" y="379" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8" stroke-dasharray="3 2"/>
    <rect x="302" y="379" width="36" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8" stroke-dasharray="3 2"/>
    <path d="M 354 389 H 386" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="390" y="376" width="110" height="26" rx="5" fill="#fef6e6" fill-opacity="0.6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 504 389 H 736" stroke="#c98a2b" stroke-width="1.2" fill="none" marker-end="url(#arY)"/>
    <path d="M 742 277 V 478 H 648" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#arY)"/>
  </g>
  <text x="60" y="234" font-size="13" font-weight="bold" fill="#2e6e2e">FlashDecoding：KV 切成 T = N/Bc 段，T 个 SM 并行</text>
  <text x="60" y="252" font-size="10.5" fill="#888">Q 只有 1 行（M=1），所有 SM 共用同一个 Q —— 切的是 KV</text>
  <text x="92" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">SM 0</text>
  <text x="180" y="280" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">0</text>
  <text x="220" y="280" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">1</text>
  <text x="290" y="280" text-anchor="middle" font-size="10" fill="#999">…</text>
  <text x="320" y="280" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">Bc-1</text>
  <text x="445" y="281" text-anchor="middle" font-size="10" font-family="monospace" fill="#7a5415">partial_0</text>
  <text x="92" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">SM 1</text>
  <text x="180" y="312" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">Bc</text>
  <text x="220" y="312" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">Bc+1</text>
  <text x="290" y="312" text-anchor="middle" font-size="10" fill="#999">…</text>
  <text x="320" y="312" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">2Bc-1</text>
  <text x="445" y="313" text-anchor="middle" font-size="10" font-family="monospace" fill="#7a5415">partial_1</text>
  <text x="92" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">SM 2</text>
  <text x="180" y="344" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">2Bc</text>
  <text x="220" y="344" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">2Bc+1</text>
  <text x="290" y="344" text-anchor="middle" font-size="10" fill="#999">…</text>
  <text x="320" y="344" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">3Bc-1</text>
  <text x="445" y="345" text-anchor="middle" font-size="10" font-family="monospace" fill="#7a5415">partial_2</text>
  <text x="92" y="369" text-anchor="middle" font-size="16" fill="#999">⋮</text>
  <text x="92" y="393" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">SM T-1</text>
  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#999">…</text>
  <text x="320" y="392" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#2e6e2e">N-1</text>
  <text x="445" y="393" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#7a5415">partial_{T-1}</text>
  <text x="60" y="426" font-size="11" font-weight="bold" fill="#2e6e2e">并行度 = N/Bc：每个 SM 只扫 Bc 个 KV，耗时 ∝ Bc（与总长 N 无关）</text>

  <!-- Merge -->
  <g filter="url(#sk)">
    <rect x="214" y="456" width="432" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" fill-opacity="0.5"/>
  </g>
  <text x="430" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">Merge（第二阶段）：online softmax 合并 partial_0 … partial_{T-1}</text>
  <text x="430" y="493" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">output = Σ w_j · partial_o_j / Σ w_j</text>
</svg>
