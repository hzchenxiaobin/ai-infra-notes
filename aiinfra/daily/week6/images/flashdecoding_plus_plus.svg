<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="220" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FlashDecoding++：只 rescale 一次</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">提前估算 global_max，Phase 1 直接用，省掉 Phase 2 的第二次 rescale</text>

  <!-- Phase 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="72" width="780" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="94" font-size="12" fill="#2e6e2e" font-weight="bold">Phase 1</text>
  <text x="180" y="94" font-size="12" fill="#2b2b2b" font-family="monospace">partial_l_j = Σ exp(s_i - estimated_global_max)</text>
  <text x="780" y="94" text-anchor="end" font-size="11" fill="#2e6e2e" font-weight="bold">← 只 rescale 一次</text>
  <text x="60" y="116" font-size="11" fill="#666">提前估算 max，Phase 1 直接用全局基准</text>

  <!-- Phase 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="136" width="780" height="56" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="158" font-size="12" fill="#2b6e9e" font-weight="bold">Phase 2</text>
  <text x="180" y="158" font-size="11" fill="#2b2b2b" font-family="monospace">output = Σ_j partial_l_j · partial_o_j / Σ_j partial_l_j</text>
  <text x="780" y="158" text-anchor="end" font-size="11" fill="#2e6e2e" font-weight="bold">← 无需再 rescale</text>
  <text x="60" y="180" font-size="11" fill="#666">直接加权平均，省掉 rescale 计算</text>
</svg>
