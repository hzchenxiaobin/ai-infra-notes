<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="36" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="340" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FlashDecoding 并行度与 SM 利用率</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Standard decode -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="380" height="100" rx="10" fill="#fdecec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="230" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">Standard decode</text>
  <text x="60" y="110" font-size="11" fill="#444" font-family="monospace">并行度 = 1 block（处理整个 KV）</text>
  <text x="60" y="130" font-size="11" fill="#444" font-family="monospace">GPU 有 170 个 SM，只用了 1 个</text>
  <text x="60" y="152" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">利用率 ~0.6%</text>

  <!-- FlashDecoding -->
  <g filter="url(#sk)">
    <rect x="440" y="64" width="380" height="100" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="630" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">FlashDecoding</text>
  <text x="460" y="110" font-size="11" fill="#444" font-family="monospace">并行度 = ceil(seq_len / tokens_per_block)</text>
  <text x="460" y="130" font-size="11" fill="#444" font-family="monospace">seq_len=2048, Bc=64 → 32 blocks</text>
  <text x="460" y="148" font-size="11" fill="#444" font-family="monospace">seq_len=8192, Bc=64 → 128 blocks（~75%）</text>

  <!-- 表格 -->
  <g filter="url(#sk)" font-size="11">
    <rect x="40" y="180" width="780" height="140" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
    <text x="120" y="202" text-anchor="middle" fill="#2b2b2b" font-weight="bold">seq_len</text>
    <text x="300" y="202" text-anchor="middle" fill="#b03a3a" font-weight="bold">Standard (blocks)</text>
    <text x="500" y="202" text-anchor="middle" fill="#2e6e2e" font-weight="bold">FlashDecoding (blocks)</text>
    <text x="700" y="202" text-anchor="middle" fill="#7a5415" font-weight="bold">SM 利用率提升</text>
    <line x1="50" y1="210" x2="810" y2="210" stroke="#ccc" stroke-width="0.8"/>

    <text x="120" y="228" text-anchor="middle" fill="#444">256</text>
    <text x="300" y="228" text-anchor="middle" fill="#b03a3a">1</text>
    <text x="500" y="228" text-anchor="middle" fill="#2e6e2e">4</text>
    <text x="700" y="228" text-anchor="middle" fill="#7a5415">4×</text>

    <text x="120" y="248" text-anchor="middle" fill="#444">1024</text>
    <text x="300" y="248" text-anchor="middle" fill="#b03a3a">1</text>
    <text x="500" y="248" text-anchor="middle" fill="#2e6e2e">16</text>
    <text x="700" y="248" text-anchor="middle" fill="#7a5415">16×</text>

    <text x="120" y="268" text-anchor="middle" fill="#444">2048</text>
    <text x="300" y="268" text-anchor="middle" fill="#b03a3a">1</text>
    <text x="500" y="268" text-anchor="middle" fill="#2e6e2e">32</text>
    <text x="700" y="268" text-anchor="middle" fill="#7a5415">32×</text>

    <text x="120" y="288" text-anchor="middle" fill="#444">8192</text>
    <text x="300" y="288" text-anchor="middle" fill="#b03a3a">1</text>
    <text x="500" y="288" text-anchor="middle" fill="#2e6e2e">128</text>
    <text x="700" y="288" text-anchor="middle" fill="#7a5415">~128×（~75% SM）</text>

    <text x="430" y="312" text-anchor="middle" font-size="10" fill="#888">KV 序列越长，并行度收益越大；blocks ≥ 170 时才打满所有 SM</text>
  </g>
</svg>
