<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="48" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="220" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FlashDecoding：二次 rescale 问题</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">每个 partial 要被 rescale 两次，引入额外计算</text>

  <!-- Phase 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="72" width="780" height="56" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="94" font-size="12" fill="#2b6e9e" font-weight="bold">Phase 1</text>
  <text x="180" y="94" font-size="12" fill="#2b2b2b" font-family="monospace">partial_l_j = Σ exp(s_i - partial_m_j)</text>
  <text x="780" y="94" text-anchor="end" font-size="11" fill="#b03a3a" font-weight="bold">← 第一次 rescale</text>
  <text x="60" y="116" font-size="11" fill="#666">block 内部 online softmax，以 partial_m_j 为基准</text>

  <!-- Phase 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="136" width="780" height="56" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="158" font-size="12" fill="#7a5415" font-weight="bold">Phase 2</text>
  <text x="180" y="158" font-size="12" fill="#2b2b2b" font-family="monospace">w_j = exp(partial_m_j - global_max) · partial_l_j</text>
  <text x="780" y="158" text-anchor="end" font-size="11" fill="#b03a3a" font-weight="bold">← 第二次 rescale</text>
  <text x="60" y="180" font-size="11" fill="#666">合并时 rescale 到 global_max 基准</text>
</svg>
