<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="400" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FlashAttention SRAM 占用（Br=64, Bc=64, D=64, float32）</text>
  <path d="M 260 42 Q 430 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- s_Q -->
  <g filter="url(#sk)">
    <rect x="40" y="72" width="240" height="130" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="160" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">s_Q[Br][D]</text>
  <text x="160" y="126" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace">64 × 64 × 4B</text>
  <text x="160" y="150" text-anchor="middle" font-size="11" fill="#444">Q tile 驻留 SRAM</text>
  <text x="160" y="180" text-anchor="middle" font-size="20" fill="#2b6e9e" font-weight="bold">16 KB</text>

  <!-- s_K -->
  <g filter="url(#sk)">
    <rect x="310" y="72" width="240" height="130" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="430" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">s_K[Bc][D]</text>
  <text x="430" y="126" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace">64 × 64 × 4B</text>
  <text x="430" y="150" text-anchor="middle" font-size="11" fill="#444">K tile 逐块加载</text>
  <text x="430" y="180" text-anchor="middle" font-size="20" fill="#2e6e2e" font-weight="bold">16 KB</text>

  <!-- s_V -->
  <g filter="url(#sk)">
    <rect x="580" y="72" width="240" height="130" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="700" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">s_V[Bc][D]</text>
  <text x="700" y="126" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace">64 × 64 × 4B</text>
  <text x="700" y="150" text-anchor="middle" font-size="11" fill="#444">V tile 逐块加载</text>
  <text x="700" y="180" text-anchor="middle" font-size="20" fill="#2e6e2e" font-weight="bold">16 KB</text>

  <!-- 总计 -->
  <g filter="url(#sk)">
    <rect x="180" y="222" width="500" height="56" rx="8" fill="#b03a3a" opacity="0.12" stroke="#b03a3a" stroke-width="1.5"/>
  </g>
  <text x="430" y="248" text-anchor="middle" font-size="14" fill="#444">SRAM 合计 = 16 + 16 + 16</text>
  <text x="430" y="270" text-anchor="middle" font-size="22" fill="#b03a3a" font-weight="bold">48 KB</text>

  <!-- 上限标注 -->
  <g filter="url(#sk)">
    <rect x="80" y="296" width="700" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="430" y="321" text-anchor="middle" font-size="12" fill="#2b6e9e">恰好等于静态 __shared__ 48 KB/block 硬上限  ·  ≤ 100 KB/SM（RTX 5090）✓</text>

  <!-- 底部注释 -->
  <g filter="url(#sk)">
    <rect x="80" y="350" width="700" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="375" text-anchor="middle" font-size="11" fill="#444">官方实现中 K/V 可分时复用同一块 shared memory，教学版分开存储以简化代码</text>
</svg>
