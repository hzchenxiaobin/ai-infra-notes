<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="860" height="360" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">GEMM 前向与反向数据流（C = A × B）</text>
  <path d="M 260 42 Q 430 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Forward (left) ===== -->
  <text x="180" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a8edb">Forward</text>

  <!-- A node -->
  <g filter="url(#sk)">
    <rect x="60" y="100" width="80" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="100" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" font-family="monospace">A</text>

  <!-- B node -->
  <g filter="url(#sk)">
    <rect x="60" y="160" width="80" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="100" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" font-family="monospace">B</text>

  <!-- lines A->C, B->C -->
  <path d="M 140 120 Q 200 120 220 150" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 140 180 Q 200 180 220 150" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>

  <!-- C node -->
  <g filter="url(#sk)">
    <rect x="220" y="130" width="80" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="260" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" font-family="monospace">C</text>

  <!-- divider -->
  <path d="M 380 60 L 380 300" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#sk)"/>

  <!-- ===== Backward (right) ===== -->
  <text x="600" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a8e4a">Backward</text>

  <!-- dC node -->
  <g filter="url(#sk)">
    <rect x="460" y="130" width="80" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="500" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" font-family="monospace">dC</text>

  <!-- dA output -->
  <path d="M 540 150 Q 600 90 660 90" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="660" y="70" width="170" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="745" y="89" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">dA = dC @ Bᵀ</text>
  <text x="745" y="103" text-anchor="middle" font-size="10" fill="#888">（需要 B）</text>

  <!-- B reused -->
  <path d="M 500 170 Q 580 150 600 130" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="460" y="190" width="80" height="34" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <text x="500" y="212" text-anchor="middle" font-size="13" fill="#c98a2b" font-family="monospace">B (复用)</text>

  <!-- dB output -->
  <path d="M 540 150 Q 600 230 660 250" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="660" y="230" width="170" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="745" y="249" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">dB = Aᵀ @ dC</text>
  <text x="745" y="263" text-anchor="middle" font-size="10" fill="#888">（需要 A）</text>

  <!-- A reused -->
  <path d="M 500 170 Q 580 210 600 250" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="460" y="250" width="80" height="34" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <text x="500" y="272" text-anchor="middle" font-size="13" fill="#c98a2b" font-family="monospace">A (复用)</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="60" y="306" width="770" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="445" y="331" text-anchor="middle" font-size="12" fill="#666">算 dA 需要 B，算 dB 需要 A —— 前向输入在反向时仍要可访问（FA 反向重读 Q/K/V 的原因）</text>
</svg>
