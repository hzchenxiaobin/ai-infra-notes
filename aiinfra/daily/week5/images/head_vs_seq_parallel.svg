<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="55" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Head 并行 vs Seq 并行</text>
  <path d="M 270 40 Q 430 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: Head parallel ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="380" height="310" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="230" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">Head 并行（Batch / Head 维度）</text>

  <!-- Grid of blocks representing different heads -->
  <g filter="url(#sk)" font-size="10" text-anchor="middle">
    <rect x="70" y="104" width="70" height="36" rx="5" fill="#4a8edb" opacity="0.3" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="105" y="120" fill="#2b6e9e" font-weight="bold">Head 0</text>
    <text x="105" y="132" fill="#888" font-size="8">block</text>
    <rect x="150" y="104" width="70" height="36" rx="5" fill="#c98a2b" opacity="0.3" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="185" y="120" fill="#7a5415" font-weight="bold">Head 1</text>
    <text x="185" y="132" fill="#888" font-size="8">block</text>
    <rect x="230" y="104" width="70" height="36" rx="5" fill="#8e5db8" opacity="0.3" stroke="#8e5db8" stroke-width="1.2"/>
    <text x="265" y="120" fill="#5d3a7e" font-weight="bold">Head 2</text>
    <text x="265" y="132" fill="#888" font-size="8">block</text>
    <rect x="310" y="104" width="70" height="36" rx="5" fill="#b85450" opacity="0.3" stroke="#b85450" stroke-width="1.2"/>
    <text x="345" y="120" fill="#b85450" font-weight="bold">Head 3</text>
    <text x="345" y="132" fill="#888" font-size="8">block</text>

    <rect x="70" y="148" width="70" height="36" rx="5" fill="#4a8e4a" opacity="0.3" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="105" y="164" fill="#2e6e2e" font-weight="bold">Head 4</text>
    <text x="105" y="176" fill="#888" font-size="8">block</text>
    <rect x="150" y="148" width="70" height="36" rx="5" fill="#4a8edb" opacity="0.2" stroke="#4a8edb" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="185" y="170" fill="#888">...</text>
    <rect x="230" y="148" width="70" height="36" rx="5" fill="#4a8edb" opacity="0.2" stroke="#4a8edb" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="265" y="170" fill="#888">...</text>
    <rect x="310" y="148" width="70" height="36" rx="5" fill="#b85450" opacity="0.3" stroke="#b85450" stroke-width="1.2"/>
    <text x="345" y="164" fill="#b85450" font-weight="bold">Head 7</text>
    <text x="345" y="176" fill="#888" font-size="8">block</text>
  </g>
  <text x="230" y="208" text-anchor="middle" font-size="10" fill="#888">不同 head → 不同 block（天然无依赖）</text>

  <!-- pros/cons -->
  <g filter="url(#sk)">
    <rect x="70" y="224" width="310" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="80" y="242" font-size="11" fill="#2e6e2e" font-weight="bold">✓ 优点</text>
  <text x="80" y="258" font-size="10" fill="#2b2b2b">自然，不需要同步</text>
  <text x="80" y="272" font-size="10" fill="#2b2b2b">首选并行维度</text>

  <g filter="url(#sk)">
    <rect x="70" y="292" width="310" height="56" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="80" y="310" font-size="11" fill="#b85450" font-weight="bold">✗ 缺点</text>
  <text x="80" y="326" font-size="10" fill="#2b2b2b">head 数少时（如 8 头）</text>
  <text x="80" y="340" font-size="10" fill="#2b2b2b">并行度不够</text>

  <!-- ===== Right: Seq parallel ===== -->
  <g filter="url(#sk)">
    <rect x="440" y="60" width="380" height="310" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.35"/>
  </g>
  <text x="630" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">Seq 并行（Sequence 长度维度）</text>

  <!-- Same head, different seq segments -->
  <text x="630" y="104" text-anchor="middle" font-size="11" fill="#888">同一个 Head 的序列分成多个 block</text>
  <g filter="url(#sk)" font-size="10" text-anchor="middle">
    <rect x="470" y="114" width="310" height="40" rx="5" fill="none" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="472" y="116" width="74" height="36" rx="4" fill="#4a8e4a" opacity="0.3" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="509" y="132" fill="#2e6e2e" font-weight="bold">Q[0:Br]</text>
    <text x="509" y="144" fill="#888" font-size="8">block 0</text>
    <rect x="548" y="116" width="74" height="36" rx="4" fill="#c98a2b" opacity="0.3" stroke="#c98a2b" stroke-width="1.2"/>
    <text x="585" y="132" fill="#7a5415" font-weight="bold">Q[Br:2Br]</text>
    <text x="585" y="144" fill="#888" font-size="8">block 1</text>
    <rect x="624" y="116" width="74" height="36" rx="4" fill="#8e5db8" opacity="0.3" stroke="#8e5db8" stroke-width="1.2"/>
    <text x="661" y="132" fill="#5d3a7e" font-weight="bold">Q[2Br:3Br]</text>
    <text x="661" y="144" fill="#888" font-size="8">block 2</text>
    <rect x="700" y="116" width="74" height="36" rx="4" fill="#4a8edb" opacity="0.3" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="737" y="132" fill="#2b6e9e" font-weight="bold">Q[3Br:...]</text>
    <text x="737" y="144" fill="#888" font-size="8">block 3</text>
  </g>
  <text x="630" y="172" text-anchor="middle" font-size="10" fill="#888">长序列 → 更多 block → 更高并行度</text>

  <!-- pros/cons -->
  <g filter="url(#sk)">
    <rect x="470" y="188" width="310" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="480" y="206" font-size="11" fill="#2e6e2e" font-weight="bold">✓ 优点</text>
  <text x="480" y="222" font-size="10" fill="#2b2b2b">增加并行度，尤其适合长序列</text>
  <text x="480" y="236" font-size="10" fill="#2b2b2b">FA tiling 天然支持</text>

  <g filter="url(#sk)">
    <rect x="470" y="256" width="310" height="56" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="480" y="274" font-size="11" fill="#c98a2b" font-weight="bold">⚠ 注意</text>
  <text x="480" y="290" font-size="10" fill="#2b2b2b">需处理 Q tile 边界</text>
  <text x="480" y="304" font-size="10" fill="#2b2b2b">但 FA 的 tiling 天然适配</text>

  <!-- selection strategy -->
  <g filter="url(#sk)">
    <rect x="470" y="324" width="310" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="630" y="346" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">B×H 不够时再开启 seq 并行</text>

  <text x="430" y="400" text-anchor="middle" font-size="10" fill="#888">策略：先充分利用 Batch × Head（gridDim.y × gridDim.z），小 batch 推理时再开 seq 并行</text>
  <text x="430" y="418" text-anchor="middle" font-size="10" fill="#888">长序列（N=4096+）时 seq 并行收益最大</text>
</svg>
