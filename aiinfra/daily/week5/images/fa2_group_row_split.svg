<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="820" height="360" fill="#fdfcf7"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FA2：沿 Q 行方向切</text>
  <path d="M 280 40 Q 410 48 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="410" y="56" text-anchor="middle" font-size="11" fill="#888">2 group 各管 1/2 行 Q，遍历全部 K/V → 每个 group 看到完整 K/V → 自己算出完整 softmax 统计量</text>

  <!-- Q tile with 2 row blocks -->
  <text x="170" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb">Q tile（Br × d）</text>
  <g filter="url(#sk)">
    <rect x="50" y="88" width="240" height="180" fill="none" stroke="#4a8edb" stroke-width="2" rx="6"/>
    <rect x="52" y="90" width="236" height="86" rx="4" fill="#4a8e4a" opacity="0.3" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="52" y="178" width="236" height="86" rx="4" fill="#4a8edb" opacity="0.3" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="170" y="128" fill="#2e6e2e">group0</text>
    <text x="170" y="216" fill="#2b6e9e">group1</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#888" font-family="monospace">
    <text x="170" y="144">Q[0:Br/2, :]</text>
    <text x="170" y="232">Q[Br/2:Br, :]</text>
  </g>

  <!-- KV tiles in middle -->
  <text x="460" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">遍历所有 K/V tile</text>
  <g filter="url(#sk)">
    <rect x="360" y="100" width="56" height="36" rx="5" fill="#c98a2b" opacity="0.4" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="424" y="100" width="56" height="36" rx="5" fill="#c98a2b" opacity="0.3" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="488" y="100" width="56" height="36" rx="5" fill="#c98a2b" opacity="0.2" stroke="#c98a2b" stroke-width="1.1"/>
    <text x="560" y="122" font-size="14" fill="#888">...</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#c98a2b" font-family="monospace">
    <text x="388" y="122">K/V₀</text>
    <text x="452" y="122">K/V₁</text>
    <text x="516" y="122">K/V₂</text>
  </g>

  <!-- arrows from group0 to KV tiles -->
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="1.3" fill="none">
    <path d="M 290 133 L 358 118" marker-end="url(#arG)"/>
    <path d="M 290 133 L 422 118" marker-end="url(#arG)" stroke-dasharray="3 2"/>
    <path d="M 290 133 L 486 118" marker-end="url(#arG)" stroke-dasharray="3 2"/>
  </g>
  <!-- arrows from group1 to KV tiles -->
  <g filter="url(#sk)" stroke="#4a8edb" stroke-width="1.3" fill="none">
    <path d="M 290 221 L 358 136" marker-end="url(#arB)"/>
    <path d="M 290 221 L 422 136" marker-end="url(#arB)" stroke-dasharray="3 2"/>
    <path d="M 290 221 L 486 136" marker-end="url(#arB)" stroke-dasharray="3 2"/>
  </g>

  <!-- Result boxes on right -->
  <g filter="url(#sk)">
    <rect x="600" y="108" width="180" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="600" y="196" width="180" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">
    <text x="690" y="130" fill="#2e6e2e">完整 m₀, l₀, O₀</text>
    <text x="690" y="146" fill="#888" font-size="9" font-family="'Comic Sans MS',cursive">group 内独立完成</text>
    <text x="690" y="218" fill="#2b6e9e">完整 m₁, l₁, O₁</text>
    <text x="690" y="234" fill="#888" font-size="9" font-family="'Comic Sans MS',cursive">group 内独立完成</text>
  </g>

  <!-- arrows KV to results -->
  <g filter="url(#sk)" stroke="#5a5a5a" stroke-width="1.1" fill="none">
    <path d="M 548 118 L 598 132" marker-end="url(#ar)"/>
    <path d="M 548 136 L 598 220" marker-end="url(#ar)"/>
  </g>

  <!-- Bottom badge -->
  <g filter="url(#sk)">
    <rect x="240" y="288" width="340" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="410" y="308" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">✓ 无需跨 group 合并</text>
  <text x="410" y="324" text-anchor="middle" font-size="10" fill="#888">只剩 online softmax 固有 rescale（算法内在，消不掉）</text>
</svg>
