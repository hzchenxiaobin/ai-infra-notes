<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="91" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Online Softmax 三公式（速记卡）</text>
  <path d="M 270 40 Q 430 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#888">分块场景：已有前几块的 (m, l, O)，新来一块 S_block → 增量更新三状态</text>

  <!-- ===== Standard softmax baseline ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="68" width="780" height="50" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="60" y="90" font-size="12" fill="#4a8edb" font-weight="bold">标准 softmax</text>
  <text x="60" y="108" font-size="12" fill="#2b2b2b" font-family="monospace">softmax(x) = exp(x − max(x)) / sum(exp(x − max(x)))</text>

  <path d="M 430 120 L 430 134" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>

  <!-- ===== Formula 1 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="140" width="780" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="60" y="162" font-size="13" fill="#2b6e9e" font-weight="bold">公式 1 · 更新 max</text>
  <text x="60" y="186" font-size="14" fill="#2b2b2b" font-family="monospace">m_new = max(m, rowmax(S_block))</text>
  <text x="60" y="202" font-size="10" fill="#888">全局 max = 旧 m 与新块行 max 的较大者 → 参考点从 m 抬到 m_new</text>

  <path d="M 430 212 L 430 226" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>

  <!-- ===== Formula 2 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="232" width="780" height="80" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="60" y="254" font-size="13" fill="#7a5415" font-weight="bold">公式 2 · 更新 sum</text>
  <text x="60" y="278" font-size="14" fill="#2b2b2b" font-family="monospace">l_new = l · exp(m − m_new) + rowsum(exp(S_block − m_new))</text>
  <text x="60" y="298" font-size="10" fill="#888">旧分母按"汇率" α = exp(m − m_new) 缩到新参考点，再加新块指数和</text>

  <path d="M 430 314 L 430 328" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>

  <!-- ===== Formula 3 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="334" width="780" height="100" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="60" y="356" font-size="13" fill="#2e6e2e" font-weight="bold">公式 3 · 更新 output</text>
  <text x="60" y="380" font-size="13" fill="#2b2b2b" font-family="monospace">O_new = O · exp(m − m_new) · (l / l_new) + (exp(S_block − m_new) @ V) / l_new</text>
  <text x="60" y="400" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">简化: O_new = (O · exp(m − m_new) + exp(S_block − m_new) @ V) / l_new</text>
  <text x="60" y="420" font-size="10" fill="#888">旧输出 rescale + 新块加权和，再除 l_new 归一化</text>

  <!-- ===== Numerical stability ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="448" width="780" height="52" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/>
  </g>
  <text x="60" y="470" font-size="12" fill="#5d3a7e" font-weight="bold">数值稳定性</text>
  <text x="60" y="490" font-size="12" fill="#2b2b2b" font-family="monospace">exp(m − m_new) ≤ 1  （因为 m_new ≥ m）→ 指数非正，不会溢出</text>

  <text x="430" y="514" text-anchor="middle" font-size="10" fill="#888">α = exp(m − m_new) 是参考点平移的"汇率" · 详细推导见 online_softmax_derivation.svg</text>
</svg>
