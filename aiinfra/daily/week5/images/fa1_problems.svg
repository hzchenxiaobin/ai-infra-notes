<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="820" height="300" fill="#fdfcf7"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FA1 的三大效率问题</text>
  <path d="M 270 40 Q 410 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Problem 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="740" height="64" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.5" fill-opacity="0.3"/>
  </g>
  <circle cx="68" cy="92" r="14" fill="#b85450" opacity="0.2" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="68" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <text x="96" y="86" font-size="13" fill="#b85450" font-weight="bold">跨 warp 冗余同步</text>
  <text x="96" y="106" font-size="11" fill="#2b2b2b">不同 warp group 之间存在冗余的 softmax 统计量同步（max / l / O 需跨 warp 合并）</text>

  <!-- Problem 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="134" width="740" height="64" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" fill-opacity="0.3"/>
  </g>
  <circle cx="68" cy="166" r="14" fill="#c98a2b" opacity="0.2" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="68" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2</text>
  <text x="96" y="160" font-size="13" fill="#7a5415" font-weight="bold">Non-matmul 并行不充分</text>
  <text x="96" y="180" font-size="11" fill="#2b2b2b">非 matmul 计算（online softmax 的 reduce / rescale）没有充分并行</text>

  <!-- Problem 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="208" width="740" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" fill-opacity="0.3"/>
  </g>
  <circle cx="68" cy="240" r="14" fill="#4a8edb" opacity="0.2" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="68" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="96" y="234" font-size="13" fill="#2b6e9e" font-weight="bold">Warp 分工粒度粗</text>
  <text x="96" y="254" font-size="11" fill="#2b2b2b">Q tile 行 block 内部的 warp 分工不够细，导致部分 warp 空闲</text>

  <text x="410" y="290" text-anchor="middle" font-size="10" fill="#888">FA2 针对这三个问题逐一改进 → 减少同步 · 并行 non-matmul · 细化分工</text>
</svg>
