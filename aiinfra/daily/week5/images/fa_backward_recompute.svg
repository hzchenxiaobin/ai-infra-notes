<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="92" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FA Backward 重算逻辑</text>
  <path d="M 270 40 Q 430 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#888">不存 N² 的 S/P，backward 时用 saved (m, l) 重算 → IO 仍 O(Nd)</text>

  <!-- ===== Forward saved ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="68" width="780" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="60" y="90" font-size="13" fill="#2b6e9e" font-weight="bold">Forward 保存</text>
  <text x="60" y="110" font-size="12" fill="#2b2b2b" font-family="monospace">Q, K, V, O, m, l   （共 O(Nd) · 不存 N² 的 S/P）</text>
  <text x="540" y="100" font-size="11" fill="#888">Backward 输入</text>
  <text x="540" y="116" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">dO</text>

  <path d="M 430 126 L 430 142" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>

  <!-- ===== Recompute loop ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="148" width="780" height="300" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/>
  </g>
  <text x="430" y="170" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">重算 S/P：for each KV tile</text>

  <!-- Step 1: recompute S -->
  <g filter="url(#sk)">
    <rect x="70" y="184" width="340" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="85" y="202" font-size="11" fill="#2b6e9e" font-weight="bold">重算 S</text>
  <text x="85" y="220" font-size="12" fill="#2b2b2b" font-family="monospace">S = Q @ K^T / sqrt(d)</text>

  <!-- Step 2: recompute P -->
  <g filter="url(#sk)">
    <rect x="450" y="184" width="340" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="465" y="202" font-size="11" fill="#2e6e2e" font-weight="bold">重算 P（用 saved m, l）</text>
  <text x="465" y="220" font-size="12" fill="#2b2b2b" font-family="monospace">P = exp(S − m) / l</text>

  <!-- arrow S -> P -->
  <path d="M 410 206 L 450 206" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- Step 3: softmax backward -->
  <g filter="url(#sk)">
    <rect x="70" y="240" width="720" height="44" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3"/>
  </g>
  <text x="85" y="258" font-size="11" fill="#5d3a7e" font-weight="bold">softmax backward</text>
  <text x="85" y="276" font-size="12" fill="#2b2b2b" font-family="monospace">dS = (dP − sum(dP · P)) · P</text>

  <!-- Step 4: accumulate gradients -->
  <text x="430" y="306" text-anchor="middle" font-size="11" fill="#888">累加梯度</text>
  <g filter="url(#sk)" font-size="12" text-anchor="middle">
    <rect x="70" y="314" width="220" height="48" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <text x="180" y="334" fill="#7a5415" font-weight="bold" font-family="monospace">dV += P^T @ dO</text>
    <text x="180" y="352" fill="#888" font-size="9">累加 dV</text>

    <rect x="310" y="314" width="220" height="48" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.3"/>
    <text x="420" y="334" fill="#b85450" font-weight="bold" font-family="monospace">dQ += dS @ K</text>
    <text x="420" y="352" fill="#888" font-size="9">累加 dQ</text>

    <rect x="550" y="314" width="220" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="660" y="334" fill="#2b6e9e" font-weight="bold" font-family="monospace">dK += dS^T @ Q</text>
    <text x="660" y="352" fill="#888" font-size="9">累加 dK</text>
  </g>

  <!-- arrows from dS to accumulators -->
  <g filter="url(#sk)" stroke="#8e5db8" stroke-width="1.1" fill="none" stroke-dasharray="3 2">
    <path d="M 280 284 L 180 314"/>
    <path d="M 430 284 L 420 314"/>
    <path d="M 580 284 L 660 314"/>
  </g>

  <!-- loop note -->
  <text x="430" y="388" text-anchor="middle" font-size="11" fill="#c98a2b">↑ 遍历所有 KV tile，累加 dV / dQ / dK</text>
  <text x="430" y="406" text-anchor="middle" font-size="10" fill="#888">每个元素只被访问常数次</text>

  <!-- ===== Bottom: key insights ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="436" width="375" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="55" y="458" font-size="12" fill="#2e6e2e" font-weight="bold">✓ IO 仍 O(Nd)</text>
  <text x="55" y="476" font-size="11" fill="#2b2b2b">每个元素被访问常数次，</text>
  <text x="55" y="488" font-size="11" fill="#2b2b2b">总 IO 不变</text>

  <g filter="url(#sk)">
    <rect x="445" y="436" width="375" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="460" y="458" font-size="12" fill="#7a5415" font-weight="bold">⚠ 代价：重算增加 FLOPs</text>
  <text x="460" y="476" font-size="11" fill="#2b2b2b">但 FLOPs 便宜</text>
  <text x="460" y="488" font-size="11" fill="#2b2b2b">（算力 &gt;&gt; 带宽）</text>

  <text x="430" y="528" text-anchor="middle" font-size="10" fill="#888">存 S/P 的话 IO 变 O(N²)，等于把 FA 的 IO 优势全部抵消 → 重算代替存储</text>
  <text x="430" y="546" text-anchor="middle" font-size="10" fill="#888">Forward 保存 Q, K, V, O, m, l（共 O(Nd)），backward 时用 m/l 重算 P</text>
</svg>
