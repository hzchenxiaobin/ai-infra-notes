<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="380" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FlashAttention Kernel Grid / Block 配置</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Grid 维度 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="500" height="200" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" fill-opacity="0.3"/>
  </g>
  <text x="60" y="88" font-size="13" fill="#2b6e9e" font-weight="bold">grid = (ceil(N / Br), H, B)</text>

  <!-- x 维 -->
  <g filter="url(#sk)">
    <rect x="60" y="104" width="140" height="68" rx="6" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="130" y="124" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">x 维</text>
  <text x="130" y="142" text-anchor="middle" font-size="12" fill="#2b2b2b" font-family="monospace">ceil(N / Br)</text>
  <text x="130" y="160" text-anchor="middle" font-size="10" fill="#888">Q tile 索引</text>

  <!-- y 维 -->
  <g filter="url(#sk)">
    <rect x="220" y="104" width="140" height="68" rx="6" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">y 维</text>
  <text x="290" y="142" text-anchor="middle" font-size="12" fill="#2b2b2b" font-family="monospace">H</text>
  <text x="290" y="160" text-anchor="middle" font-size="10" fill="#888">head 索引</text>

  <!-- z 维 -->
  <g filter="url(#sk)">
    <rect x="380" y="104" width="140" height="68" rx="6" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="450" y="124" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">z 维</text>
  <text x="450" y="142" text-anchor="middle" font-size="12" fill="#2b2b2b" font-family="monospace">B</text>
  <text x="450" y="160" text-anchor="middle" font-size="10" fill="#888">batch 索引</text>

  <!-- 说明 -->
  <text x="60" y="194" font-size="11" fill="#444">每个 Block 处理一个 Q tile（Br 行 × d 列）</text>
  <text x="60" y="212" font-size="11" fill="#444">grid 覆盖 batch × head × Q tile 全空间</text>
  <text x="60" y="234" font-size="11" fill="#888">blockIdx.x → Q tile,  blockIdx.y → head,  blockIdx.z → batch</text>
  <text x="60" y="252" font-size="11" fill="#888" font-family="monospace">bhOffset = ((batch * H + head) * N) * d</text>

  <!-- ===== Block 配置 ===== -->
  <g filter="url(#sk)">
    <rect x="560" y="64" width="260" height="200" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" fill-opacity="0.3"/>
  </g>
  <text x="690" y="88" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">block 配置</text>

  <g filter="url(#sk)">
    <rect x="580" y="104" width="220" height="50" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.1"/>
  </g>
  <text x="690" y="128" text-anchor="middle" font-size="12" fill="#2b2b2b" font-family="monospace">THREADS_PER_BLOCK</text>
  <text x="690" y="146" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">256</text>

  <g filter="url(#sk)">
    <rect x="580" y="166" width="220" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.4"/>
  </g>
  <text x="690" y="188" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">= 8 warps × 32 threads</text>
  <text x="690" y="210" text-anchor="middle" font-size="10" fill="#444">WARPS_PER_BLOCK = 8</text>
  <text x="690" y="228" text-anchor="middle" font-size="10" fill="#444">ROWS_PER_WARP = Br / 8 = 8</text>

  <!-- ===== 底部注释 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="284" width="780" height="80" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.4"/>
  </g>
  <text x="60" y="308" font-size="11" fill="#7a5415" font-weight="bold">线程映射层次</text>
  <text x="60" y="326" font-size="11" fill="#444">grid 维度：Block 并行处理 Q tile（外层并行，Block 间无依赖）</text>
  <text x="60" y="344" font-size="11" fill="#444">block 内维度：warp 并行处理 Q 行（8 warp × 8 行 = 64 行 = Br）</text>
  <text x="60" y="358" font-size="11" fill="#444">warp 内维度：32 线程协作做点积与归约（__shfl 硬件同步）</text>
</svg>
