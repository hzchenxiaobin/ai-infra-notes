<svg xmlns="http://www.w3.org/2000/svg" width="860" height="720" viewBox="0 0 860 720" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arLoop" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>

  <rect width="860" height="720" fill="#fdfcf7"/>

  <!-- ===== Title ===== -->
  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FlashAttention Tiling 伪代码流程</text>
  <path d="M 220 46 Q 430 54 640 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 0: Q tile resident in SRAM ===== -->
  <g filter="url(#sk)">
    <rect x="180" y="66" width="500" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="88" font-size="11" fill="#888" font-weight="bold">外层循环</text>
  <text x="430" y="96" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="monospace">Q tile (Br×d) 常驻 SRAM</text>

  <!-- arrow down -->
  <path d="M 430 118 L 430 142" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Loop container ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="146" width="720" height="440" rx="10" fill="none" stroke="#c98a2b" stroke-width="2" stroke-dasharray="7 4"/>
  </g>
  <rect x="300" y="138" width="260" height="22" fill="#fdfcf7"/>
  <text x="430" y="153" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">🔄 for each KV tile (Bc×d)</text>

  <!-- ===== Step 1: Load KV ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="176" width="640" height="60" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="130" y="198" font-size="13" fill="#7a5415" font-weight="bold">加载</text>
  <text x="430" y="222" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace">加载 Kj, Vj 到 SRAM</text>

  <!-- arrow -->
  <path d="M 430 238 L 430 256" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 2: Compute S ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="260" width="640" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="130" y="282" font-size="13" fill="#2b6e9e" font-weight="bold">计算 S</text>
  <text x="430" y="306" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace">Sij = Qi × Kj^T  (Br×Bc)</text>
  <text x="430" y="324" text-anchor="middle" font-size="10" fill="#888">留在 register / SRAM，不落 HBM</text>

  <!-- arrow -->
  <path d="M 430 334 L 430 352" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 3: Online softmax ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="356" width="640" height="60" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="130" y="378" font-size="13" fill="#2e6e2e" font-weight="bold">递推更新</text>
  <text x="430" y="402" text-anchor="middle" font-size="13" fill="#4a8e4a" font-family="monospace" font-weight="bold">online softmax 更新 m, l, o</text>

  <!-- arrow -->
  <path d="M 430 418 L 430 436" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 4: Discard S ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="440" width="640" height="60" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  </g>
  <text x="130" y="462" font-size="13" fill="#b03a3a" font-weight="bold">丢弃</text>
  <text x="430" y="486" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace">丢弃 Sij（不写回 HBM）</text>

  <!-- ===== Loop back arrow ===== -->
  <path d="M 760 206 Q 810 206 810 300 Q 810 370 760 370" stroke="#c98a2b" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arLoop)" filter="url(#sk)"/>
  <text x="826" y="300" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold" transform="rotate(90 826 300)">下一个 KV tile</text>

  <!-- arrow down to output -->
  <path d="M 430 588 L 430 612" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 5: Write back O ===== -->
  <g filter="url(#sk)">
    <rect x="180" y="616" width="500" height="58" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="240" y="640" font-size="12" fill="#888" font-weight="bold">写回 HBM</text>
  <text x="430" y="656" text-anchor="middle" font-size="16" fill="#2e6e2e" font-family="monospace" font-weight="bold">写回 Oi = o / l 到 HBM</text>

  <!-- ===== Bottom insight ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="686" width="640" height="26" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="430" y="704" text-anchor="middle" font-size="11" fill="#5a3a7a" font-weight="bold">S/P 不落 HBM：softmax 与 P·V 在 SRAM/register 中融合完成</text>
</svg>
