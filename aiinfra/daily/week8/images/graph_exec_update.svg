<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c04050"/>
    </marker>
  </defs>
  <rect width="940" height="300" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">cudaGraphExecUpdate：拓扑不变时原地更新参数</text>
  <path d="M 220 40 Q 470 48 720 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左：Update 快路径 ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="62" width="540" height="180" rx="10" fill="#eaf6ee" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="50" y="88" font-size="13" font-weight="bold" fill="#2e6e2e">✓ Update（拓扑不变，参数变了）</text>

  <g filter="url(#sk)">
    <rect x="50" y="100" width="180" height="50" rx="6" fill="#e3f4e8" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="140" y="122" text-anchor="middle" font-size="10" font-family="monospace" fill="#2e6e2e">graphExec</text>
  <text x="140" y="138" text-anchor="middle" font-size="9" fill="#666">batch=4, grid=(4,)</text>

  <path d="M 230 125 L 260 125" stroke="#2e8b57" stroke-width="1.4" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="260" y="100" width="180" height="50" rx="6" fill="#e3f4e8" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="350" y="122" text-anchor="middle" font-size="10" font-family="monospace" fill="#2e6e2e">newGraph</text>
  <text x="350" y="138" text-anchor="middle" font-size="9" fill="#666">batch=6, grid=(6,)</text>

  <path d="M 350 150 L 350 172" stroke="#2e8b57" stroke-width="1.4" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="172" width="300" height="34" rx="5" fill="#fff7c0" stroke="#b8a040" stroke-width="1.2"/>
  </g>
  <text x="350" y="194" text-anchor="middle" font-size="10" font-family="monospace" fill="#7a5415">cudaGraphExecUpdate(graphExec, newGraph)</text>

  <g filter="url(#sk)">
    <rect x="200" y="214" width="300" height="20" rx="4" fill="#eaf6ee" stroke="#2e8b57" stroke-width="1"/>
  </g>
  <text x="350" y="228" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">→ success！参数已更新，无需重新实例化</text>

  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">快 5-10x</text>
  <text x="300" y="284" text-anchor="middle" font-size="9" fill="#888">条件：节点数 / 边 / kernel 类型不变</text>

  <!-- ============ 右：Re-instantiate 慢路径 ============ -->
  <g filter="url(#sk)">
    <rect x="600" y="62" width="310" height="180" rx="10" fill="#fce4ec" stroke="#c04050" stroke-width="1.5"/>
  </g>
  <text x="620" y="88" font-size="13" font-weight="bold" fill="#a03040">✗ 重新 Instantiate</text>

  <g filter="url(#sk)">
    <rect x="620" y="100" width="130" height="40" rx="6" fill="#f5d0d8" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="685" y="120" text-anchor="middle" font-size="10" font-family="monospace" fill="#a03040">newGraph</text>
  <text x="685" y="134" text-anchor="middle" font-size="9" fill="#666">batch=6</text>

  <path d="M 685 140 L 685 158" stroke="#c04050" stroke-width="1.4" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="620" y="158" width="270" height="34" rx="5" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="755" y="180" text-anchor="middle" font-size="10" font-family="monospace" fill="#a03040">cudaGraphInstantiate(&amp;newExec)</text>

  <path d="M 755 192 L 755 206" stroke="#c04050" stroke-width="1.4" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="620" y="206" width="270" height="20" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1"/>
  </g>
  <text x="755" y="220" text-anchor="middle" font-size="10" fill="#a03040">重新编译整张图（慢）</text>

  <text x="755" y="268" text-anchor="middle" font-size="11" fill="#a03040" font-weight="bold">慢 5-10x</text>
  <text x="755" y="284" text-anchor="middle" font-size="9" fill="#888">适用于拓扑完全变化的情况</text>
</svg>
