<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="940" height="300" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">每次 Kernel Launch 慢在哪：4 步拆解</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ CPU 侧串行开销区域 ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="64" width="610" height="170" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="335" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">CPU 侧串行开销（5-10μs，与 kernel 计算量无关）</text>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="50" y="100" width="180" height="80" rx="6" fill="#fff7c0" stroke="#b8a040" stroke-width="1.3"/>
  </g>
  <text x="140" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">① 解析参数</text>
  <text x="140" y="140" text-anchor="middle" font-size="10" fill="#444">组装 kernel descriptor</text>
  <text x="140" y="156" text-anchor="middle" font-size="9" fill="#666">参数指针 / grid / block</text>
  <text x="140" y="170" text-anchor="middle" font-size="9" fill="#666">shared mem</text>

  <!-- arrow -->
  <path d="M 230 140 L 250 140" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="250" y="100" width="180" height="80" rx="6" fill="#fff7c0" stroke="#b8a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">② 驱动态切换</text>
  <text x="340" y="140" text-anchor="middle" font-size="10" fill="#444">user → driver</text>
  <text x="340" y="156" text-anchor="middle" font-size="9" fill="#666">+ stream 入队</text>
  <text x="340" y="170" text-anchor="middle" font-size="9" fill="#666">（上下文切换开销）</text>

  <!-- arrow -->
  <path d="M 430 140 L 450 140" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="450" y="100" width="180" height="80" rx="6" fill="#fff7c0" stroke="#b8a040" stroke-width="1.3"/>
  </g>
  <text x="540" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">③ GPU 取 launch</text>
  <text x="540" y="140" text-anchor="middle" font-size="10" fill="#444">command processor</text>
  <text x="540" y="156" text-anchor="middle" font-size="9" fill="#666">取出并配置</text>
  <text x="540" y="170" text-anchor="middle" font-size="9" fill="#666">grid / block dim</text>

  <!-- big arrow to step 4 -->
  <path d="M 640 140 L 670 140" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ============ GPU 计算区域 ============ -->
  <g filter="url(#sk)">
    <rect x="670" y="64" width="240" height="170" rx="10" fill="#eaf6ee" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="790" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">GPU 真正计算</text>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="690" y="100" width="200" height="80" rx="6" fill="#e3f4e8" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="790" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">④ kernel 执行</text>
  <text x="790" y="140" text-anchor="middle" font-size="10" fill="#444">SM 开始跑计算</text>
  <text x="790" y="156" text-anchor="middle" font-size="9" fill="#666">这才是 GPU 算的时间</text>
  <text x="790" y="170" text-anchor="middle" font-size="9" fill="#666">（与 kernel 计算量相关）</text>

  <!-- ============ 底部结论 ============ -->
  <g filter="url(#sk)">
    <rect x="80" y="250" width="780" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="470" y="272" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">若 kernel 本身只要 5μs，launch 开销（5-10μs）就和计算平起平坐 → Decode M=1 的核心痛点</text>
</svg>
