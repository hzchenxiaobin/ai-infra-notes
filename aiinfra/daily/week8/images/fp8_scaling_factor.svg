<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#fdfcf7"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">FP8 Scaling Factor：FP16 ↔ FP8 的映射</text>
  <path d="M 220 42 Q 410 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="86" width="280" height="160" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="200" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">FP16</text>
  <text x="200" y="140" text-anchor="middle" font-size="12" fill="#444">范围 ±65504</text>
  <text x="200" y="164" text-anchor="middle" font-size="11" fill="#666">动态范围大</text>
  <text x="200" y="196" text-anchor="middle" font-size="11" fill="#888">例：A_fp16 = 2.0</text>
  <text x="200" y="216" text-anchor="middle" font-size="10" fill="#888">scale_A = A_max / 448</text>

  <g filter="url(#sk)">
    <rect x="480" y="86" width="280" height="160" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="620" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">FP8 E4M3</text>
  <text x="620" y="140" text-anchor="middle" font-size="12" fill="#444">范围 ±448</text>
  <text x="620" y="164" text-anchor="middle" font-size="11" fill="#666">动态范围有限</text>
  <text x="620" y="196" text-anchor="middle" font-size="11" fill="#888">例：A_fp8 = A_fp16 / scale_A</text>
  <text x="620" y="216" text-anchor="middle" font-size="10" fill="#888">落入 ±448 内</text>

  <path d="M 340 130 L 480 130" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="410" y="120" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">量化 (÷ scale_A)</text>
  <text x="410" y="150" text-anchor="middle" font-size="11" fill="#444">A_fp8 = A_fp16 / scale_A</text>

  <path d="M 480 205 L 340 205" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="410" y="195" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">反量化 (× scale_A)</text>
  <text x="410" y="225" text-anchor="middle" font-size="11" fill="#444">A_fp16 = A_fp8 × scale_A</text>

  <g filter="url(#sk)">
    <rect x="80" y="266" width="660" height="118" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="100" y="290" font-size="13" font-weight="bold" fill="#2b2b2b">Scale 粒度选择：</text>
  <text x="100" y="316" font-size="12" fill="#444">• per-tensor：整个张量一个 scale，简单但精度低</text>
  <text x="100" y="342" font-size="12" fill="#444">• per-channel：每行/列一个 scale，精度好（GEMM 中 scale 可提到点积外）</text>
  <text x="100" y="368" font-size="12" fill="#444">• per-token：每个 token 一个 scale（激活量化常用）</text>
</svg>
