<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="820" height="490" fill="#fdfcf7"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">GPTQ：Hessian-based 逐列量化</text>
  <path d="M 230 42 Q 410 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="66" width="740" height="50" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="60" y="96" font-size="13" font-weight="bold" fill="#2b6e9e">① 计算 H = XᵀX</text>
  <text x="250" y="96" font-size="12" fill="#444">（校准数据 X 的二阶信息，捕获误差传播）</text>

  <path d="M 410 116 L 410 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="144" width="740" height="200" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="60" y="170" font-size="13" font-weight="bold" fill="#7a5415">② 逐列量化：w_q = round(w / s)</text>
  <text x="410" y="170" font-size="12" fill="#444">误差用 Hessian 逆补偿到剩余列</text>

  <g font-size="10" fill="#333">
    <rect x="80" y="188" width="130" height="86" rx="5" fill="#d4edda" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
    <text x="145" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">col 0</text>
    <text x="145" y="234" text-anchor="middle" font-size="10" fill="#2e6e2e">✓ 已量化</text>
    <text x="145" y="256" text-anchor="middle" font-size="9" fill="#666">w_q, scale</text>

    <rect x="230" y="188" width="130" height="86" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.5" filter="url(#sk)"/>
    <text x="295" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">col 1</text>
    <text x="295" y="234" text-anchor="middle" font-size="10" fill="#7a5415">← 当前</text>
    <text x="295" y="256" text-anchor="middle" font-size="9" fill="#666">round(w/s)</text>

    <rect x="380" y="188" width="130" height="86" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
    <text x="445" y="212" text-anchor="middle" font-size="11" fill="#888">col 2</text>
    <text x="445" y="234" text-anchor="middle" font-size="10" fill="#888">待量化</text>

    <rect x="530" y="188" width="130" height="86" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
    <text x="595" y="212" text-anchor="middle" font-size="11" fill="#888">col 3 …</text>
    <text x="595" y="234" text-anchor="middle" font-size="10" fill="#888">待量化</text>
  </g>

  <path d="M 295 188 C 295 168, 445 168, 445 188" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 295 188 C 295 160, 595 160, 595 188" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="410" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">error = w − dequant(w_q)</text>
  <text x="410" y="316" text-anchor="middle" font-size="11" fill="#b85450">按 H⁻¹ 比例分摊到剩余列 → 更新 w[:, col+1:]</text>

  <path d="M 410 344 L 410 368" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="372" width="740" height="50" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="60" y="402" font-size="13" font-weight="bold" fill="#2e6e2e">③ 输出</text>
  <text x="170" y="402" font-size="12" fill="#444">量化后的 INT4 权重 + scale</text>

  <g filter="url(#sk)">
    <rect x="40" y="432" width="740" height="46" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="454" font-size="11" fill="#2e6e2e" font-weight="bold">优点：精度高（二阶信息捕获误差传播）</text>
  <text x="430" y="454" font-size="11" fill="#b03a3a" font-weight="bold">缺点：校准慢（Hessian 计算）、逐列串行</text>
</svg>
