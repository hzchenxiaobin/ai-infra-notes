<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="820" height="320" fill="#fdfcf7"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Graph Replay：30 次 launch 压成 1 次</text>
  <path d="M 220 40 Q 410 48 600 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Before：Eager 300μs（淡化） ============ -->
  <text x="100" y="78" font-size="12" font-weight="bold" fill="#a07070">Eager</text>
  <g filter="url(#sk)" opacity="0.5">
    <rect x="100" y="86" width="600" height="40" rx="3" fill="#fce4ec" stroke="#c04050" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>
  <text x="400" y="111" text-anchor="middle" font-size="12" fill="#a07070">300μs（210μs launch + 90μs 计算）</text>

  <!-- ============ 转换箭头 ============ -->
  <path d="M 400 134 L 400 160" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="412" y="152" font-size="10" fill="#5a5a5a">capture → replay</text>

  <!-- ============ After：Graph Replay 100μs ============ -->
  <text x="100" y="180" font-size="12" font-weight="bold" fill="#2e8b57">Graph Replay</text>
  <g filter="url(#sk)">
    <rect x="100" y="188" width="20" height="40" rx="3" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="110" y="213" text-anchor="middle" font-size="9" font-weight="bold" fill="#b03a3a">10μs</text>
  <g filter="url(#sk)">
    <rect x="120" y="188" width="180" height="40" rx="3" fill="#e3f4e8" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="210" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">计算 90μs</text>

  <path d="M 100 182 L 90 182 L 90 234 L 100 234" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="78" y="210" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90 78 210)">100μs</text>

  <!-- ============ 公式 ============ -->
  <text x="100" y="258" font-size="12" fill="#444">Graph replay: 10μs launch + 90μs 计算</text>
  <text x="430" y="258" font-size="14" font-weight="bold" fill="#2b2b2b">= 100μs</text>

  <!-- ============ 结论 ============ -->
  <g filter="url(#sk)">
    <rect x="100" y="276" width="600" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="400" y="298" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">收益: 300μs → 100μs, -67%</text>
</svg>
