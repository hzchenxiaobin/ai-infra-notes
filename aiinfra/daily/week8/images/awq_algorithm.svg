<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="820" height="470" fill="#fdfcf7"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">AWQ：Activation-Aware 权重保护</text>
  <path d="M 240 42 Q 410 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="66" width="740" height="110" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="60" y="90" font-size="13" font-weight="bold" fill="#2b6e9e">① 找激活大的通道（"salient" channels）</text>
  <g filter="url(#sk)">
    <line x1="80" y1="150" x2="760" y2="150" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="120" width="40" height="30" fill="#d4d4d4" stroke="#888"/>
    <rect x="170" y="92" width="40" height="58" fill="#f9d5dc" stroke="#b85450" stroke-width="1.5"/>
    <rect x="240" y="128" width="40" height="22" fill="#d4d4d4" stroke="#888"/>
    <rect x="310" y="110" width="40" height="40" fill="#d4d4d4" stroke="#888"/>
    <rect x="380" y="124" width="40" height="26" fill="#d4d4d4" stroke="#888"/>
    <rect x="450" y="98" width="40" height="52" fill="#f9d5dc" stroke="#b85450" stroke-width="1.5"/>
    <rect x="520" y="126" width="40" height="24" fill="#d4d4d4" stroke="#888"/>
    <rect x="590" y="116" width="40" height="34" fill="#d4d4d4" stroke="#888"/>
  </g>
  <text x="190" y="86" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">salient</text>
  <text x="470" y="86" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">salient</text>

  <path d="M 410 176 L 410 200" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="204" width="740" height="70" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="60" y="232" font-size="13" font-weight="bold" fill="#7a5415">② 对 salient 通道权重做 per-channel scale</text>
  <text x="60" y="256" font-size="12" fill="#444">w' = w × s  (s &gt; 1，放大后量化精度更高)</text>
  <text x="540" y="248" font-size="11" fill="#7a5415" font-weight="bold">保护重要通道</text>

  <path d="M 410 274 L 410 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="302" width="740" height="70" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="60" y="330" font-size="13" font-weight="bold" fill="#2e6e2e">③ 对应激活做反向 scale（保持数学等价）</text>
  <text x="60" y="354" font-size="12" fill="#444">x' = x ÷ s  →  w' × x' = (w×s)(x÷s) = w×x</text>
  <text x="540" y="346" font-size="11" fill="#2e6e2e" font-weight="bold">数学等价</text>

  <g filter="url(#sk)">
    <rect x="40" y="384" width="740" height="46" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="406" font-size="11" fill="#2e6e2e" font-weight="bold">优点：校准快、部署友好（不改模型结构）</text>
  <text x="430" y="406" font-size="11" fill="#b03a3a" font-weight="bold">缺点：精度略低于 GPTQ</text>
  <text x="410" y="424" text-anchor="middle" font-size="10" fill="#888">vLLM 默认用 AWQ（平衡精度与速度）</text>
</svg>
