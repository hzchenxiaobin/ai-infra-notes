<svg xmlns="http://www.w3.org/2000/svg" width="820" height="586" viewBox="0 0 820 586" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="820" height="586" fill="#fdfcf7"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">AWQ：Activation-Aware 权重保护</text>
  <path d="M 240 42 Q 410 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="66" width="740" height="110" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="60" y="90" font-size="13" font-weight="bold" fill="#2b6e9e">① 统计激活幅值 → 找 salient 通道</text>
  <text x="280" y="90" font-size="11" fill="#666">（幅值大的 ≈1% 输入通道）</text>
  <g filter="url(#sk)">
    <line x1="84" y1="112" x2="756" y2="112" stroke="#b85450" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="84" y1="160" x2="756" y2="160" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="130" width="40" height="30" fill="#d4d4d4" stroke="#888"/>
    <rect x="170" y="98" width="40" height="62" fill="#f9d5dc" stroke="#b85450" stroke-width="1.5"/>
    <rect x="240" y="140" width="40" height="20" fill="#d4d4d4" stroke="#888"/>
    <rect x="310" y="120" width="40" height="40" fill="#d4d4d4" stroke="#888"/>
    <rect x="380" y="134" width="40" height="26" fill="#d4d4d4" stroke="#888"/>
    <rect x="450" y="102" width="40" height="58" fill="#f9d5dc" stroke="#b85450" stroke-width="1.5"/>
    <rect x="520" y="138" width="40" height="22" fill="#d4d4d4" stroke="#888"/>
    <rect x="590" y="126" width="40" height="34" fill="#d4d4d4" stroke="#888"/>
  </g>
  <text x="754" y="108" text-anchor="end" font-size="9.5" fill="#b03a3a">判定阈值</text>
  <text x="754" y="128" text-anchor="end" font-size="9" fill="#888">纵轴：激活幅值 |x|</text>
  <text x="190" y="130" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b03a3a">salient</text>
  <text x="470" y="132" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b03a3a">salient</text>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="120" y="173">c0</text><text x="190" y="173">c1</text><text x="260" y="173">c2</text><text x="330" y="173">c3</text>
    <text x="400" y="173">c4</text><text x="470" y="173">c5</text><text x="540" y="173">c6</text><text x="610" y="173">c7</text>
  </g>

  <path d="M 410 178 L 410 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="194" width="740" height="108" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="60" y="220" font-size="13" font-weight="bold" fill="#7a5415">② 等价缩放：W′ = W·diag(s)，X′ = X/s</text>
  <text x="60" y="255" font-size="11.5" fill="#444">s =（每输入通道）</text>
  <g filter="url(#sk)">
    <rect x="200" y="238" width="36" height="24" fill="#ffffff" stroke="#aaa"/>
    <rect x="244" y="238" width="36" height="24" fill="#f9d5dc" stroke="#b85450" stroke-width="1.5"/>
    <rect x="288" y="238" width="36" height="24" fill="#ffffff" stroke="#aaa"/>
    <rect x="332" y="238" width="36" height="24" fill="#ffffff" stroke="#aaa"/>
    <rect x="376" y="238" width="36" height="24" fill="#ffffff" stroke="#aaa"/>
    <rect x="420" y="238" width="36" height="24" fill="#f9d5dc" stroke="#b85450" stroke-width="1.5"/>
    <rect x="464" y="238" width="36" height="24" fill="#ffffff" stroke="#aaa"/>
    <rect x="508" y="238" width="36" height="24" fill="#ffffff" stroke="#aaa"/>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888">
    <text x="218" y="255">1</text><text x="306" y="255">1</text><text x="350" y="255">1</text><text x="394" y="255">1</text>
    <text x="482" y="255">1</text><text x="526" y="255">1</text>
  </g>
  <text x="262" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">s</text>
  <text x="438" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">s</text>
  <text x="560" y="252" font-size="12" font-weight="bold" fill="#2e6e2e">Y = X′·W′ᵀ = X·Wᵀ</text>
  <text x="560" y="268" font-size="9.5" fill="#666">输出不变 —— 精确等价</text>
  <text x="60" y="290" font-size="10" fill="#666">s &gt; 1 集中在 salient 通道；激活保持 FP16 → ÷s 基本无损（weight-only 的关键）</text>
  <text x="530" y="290" font-size="10" fill="#2e6e2e">不改模型结构 → 部署友好</text>

  <path d="M 410 304 L 410 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="320" width="740" height="132" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="60" y="344" font-size="13" font-weight="bold" fill="#2e6e2e">③ 为什么放大有效：格距 Δ 不变，s·w 离 0 更远 → 相对误差 ÷ s</text>

  <text x="70" y="390" font-size="11" fill="#444">缩放前</text>
  <g filter="url(#sk)">
    <line x1="176" y1="386" x2="640" y2="386" stroke="#777" stroke-width="1.2"/>
    <line x1="640" y1="378" x2="640" y2="394" stroke="#555" stroke-width="1.5"/>
  </g>
  <path d="M176,382v8M192,382v8M208,382v8M224,382v8M240,382v8M256,382v8M272,382v8M288,382v8M304,382v8M320,382v8M336,382v8M352,382v8M368,382v8M384,382v8M400,382v8M416,382v8M432,382v8M448,382v8M464,382v8M480,382v8M496,382v8M512,382v8M528,382v8M544,382v8M560,382v8M576,382v8M592,382v8M608,382v8M624,382v8M640,382v8" stroke="#b0b0b0" stroke-width="1" fill="none"/>
  <text x="640" y="376" text-anchor="middle" font-size="8.5" fill="#888">行 max（定格距 Δ）</text>
  <path d="M232,371 v6 M248,371 v6 M232,374 h16" stroke="#b03a3a" stroke-width="1.2" fill="none"/>
  <text x="240" y="366" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b03a3a">±Δ/2</text>
  <circle cx="240" cy="386" r="3.5" fill="#b85450"/>
  <text x="176" y="402" text-anchor="middle" font-size="8.5" fill="#999">0</text>
  <text x="240" y="402" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b03a3a">w</text>
  <text x="652" y="390" font-size="10.5" font-weight="bold" fill="#b03a3a">相对误差 ~12%</text>

  <text x="70" y="432" font-size="11" fill="#444">缩放后（s=3）</text>
  <g filter="url(#sk)">
    <line x1="176" y1="428" x2="640" y2="428" stroke="#777" stroke-width="1.2"/>
  </g>
  <path d="M176,424v8M192,424v8M208,424v8M224,424v8M240,424v8M256,424v8M272,424v8M288,424v8M304,424v8M320,424v8M336,424v8M352,424v8M368,424v8M384,424v8M400,424v8M416,424v8M432,424v8M448,424v8M464,424v8M480,424v8M496,424v8M512,424v8M528,424v8M544,424v8M560,424v8M576,424v8M592,424v8M608,424v8M624,424v8M640,424v8" stroke="#b0b0b0" stroke-width="1" fill="none"/>
  <path d="M360,413 v6 M376,413 v6 M360,416 h16" stroke="#2e6e2e" stroke-width="1.2" fill="none"/>
  <text x="368" y="408" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2e6e2e">±Δ/2（不变）</text>
  <circle cx="368" cy="428" r="3.5" fill="#2e6e2e"/>
  <text x="176" y="444" text-anchor="middle" font-size="8.5" fill="#999">0</text>
  <text x="368" y="444" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e">s·w</text>
  <text x="652" y="432" font-size="10.5" font-weight="bold" fill="#2e6e2e">相对误差 ~4%（↓3×）</text>

  <path d="M 410 454 L 410 468" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="470" width="740" height="48" rx="10" fill="#f5f0fa" stroke="#8a6fb5" stroke-width="1.5"/>
  </g>
  <text x="60" y="492" font-size="12" font-weight="bold" fill="#5f4a8a">④ 网格搜索 α：s = s_x^α，α ∈ [0,1]（校准集上选输出误差最小的 s）</text>
  <text x="60" y="510" font-size="10.5" fill="#666">s 太大 → s·w 顶成新行 max → Δ 变大伤其他通道，需折中；非迭代 → 校准快</text>
  <text x="500" y="510" font-size="10.5" fill="#666">（vs GPTQ 逐列串行求解）</text>

  <g filter="url(#sk)">
    <rect x="40" y="528" width="740" height="48" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="548" font-size="11" font-weight="bold" fill="#2e6e2e">优点：校准快、部署友好（全 INT4 权重，无需混合精度）</text>
  <text x="430" y="548" font-size="11" font-weight="bold" fill="#b03a3a">缺点：精度略低于 GPTQ（W4 下两者接近）</text>
  <text x="410" y="566" text-anchor="middle" font-size="10" fill="#888">vLLM 默认用 AWQ（平衡精度与速度）</text>
</svg>
