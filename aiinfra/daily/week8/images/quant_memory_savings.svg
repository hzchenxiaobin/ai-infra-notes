<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="18" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">7B 模型量化显存节省：16 GB → 4.5 GB（3.6×）</text>
  <path d="M 280 42 Q 470 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左：FP16 基线 ============ -->
  <g filter="url(#sk)">
    <rect x="40" y="68" width="380" height="220" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="60" y="94" font-size="14" font-weight="bold" fill="#7a2828">FP16 基线（单请求）</text>

  <text x="60" y="124" font-size="12" font-weight="bold" fill="#444">权重</text>
  <g filter="url(#sk)">
    <rect x="60" y="132" width="340" height="32" rx="5" fill="#f9d5dc" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="72" y="153" font-size="12" fill="#444">7B × 2B = 14 GB</text>

  <text x="60" y="186" font-size="12" font-weight="bold" fill="#444">KV Cache (seq=4096)</text>
  <g filter="url(#sk)">
    <rect x="60" y="194" width="48" height="32" rx="5" fill="#f9d5dc" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="72" y="215" font-size="10" fill="#444">2 GB</text>
  <text x="118" y="215" font-size="10" fill="#888">2×4096×32×128×32×2B</text>

  <g filter="url(#sk)">
    <rect x="60" y="240" width="340" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="230" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2828">总计 ≈ 16 GB</text>

  <!-- ============ 右：量化后 ============ -->
  <g filter="url(#sk)">
    <rect x="520" y="68" width="380" height="220" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="540" y="94" font-size="14" font-weight="bold" fill="#2e6e2e">量化后（单请求）</text>

  <text x="540" y="118" font-size="11" fill="#444">W4A16：7B × 0.5B</text>
  <g filter="url(#sk)">
    <rect x="540" y="124" width="85" height="20" rx="4" fill="#d4edda" stroke="#4a8e4a"/>
  </g>
  <text x="635" y="138" font-size="11" fill="#2e6e2e">3.5 GB（权重 1/4）</text>

  <text x="540" y="158" font-size="11" fill="#444">W8A16：7B × 1B</text>
  <g filter="url(#sk)">
    <rect x="540" y="164" width="170" height="20" rx="4" fill="#d4edda" stroke="#4a8e4a"/>
  </g>
  <text x="720" y="178" font-size="11" fill="#2e6e2e">7 GB（权重 1/2）</text>

  <text x="540" y="198" font-size="11" fill="#444">INT8 KV：KV × 0.5</text>
  <g filter="url(#sk)">
    <rect x="540" y="204" width="24" height="20" rx="4" fill="#d4edda" stroke="#4a8e4a"/>
  </g>
  <text x="574" y="218" font-size="11" fill="#2e6e2e">1 GB（KV 1/2）</text>

  <g filter="url(#sk)">
    <rect x="540" y="240" width="340" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="710" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">W4A16 + INT8 KV ≈ 4.5 GB</text>

  <!-- ============ 中间箭头 ============ -->
  <path d="M 420 178 Q 470 178 520 178" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="470" y="170" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">量化</text>

  <!-- ============ 底部：对比条 + 结论 ============ -->
  <text x="40" y="316" font-size="13" font-weight="bold" fill="#2b2b2b">显存条形对比（同等比例）</text>

  <g filter="url(#sk)">
    <rect x="180" y="330" width="680" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="190" y="349" font-size="11" fill="#7a2828" font-weight="bold">FP16 基线：16 GB</text>

  <g filter="url(#sk)">
    <rect x="180" y="368" width="297.5" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="190" y="387" font-size="11" fill="#7a5415" font-weight="bold">W8A16：7 GB + 1 GB = 8 GB</text>

  <g filter="url(#sk)">
    <rect x="180" y="406" width="191.25" height="28" rx="4" fill="#d4edda" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="190" y="425" font-size="11" fill="#2e6e2e" font-weight="bold">W4A16 + INT8 KV：4.5 GB</text>

  <g filter="url(#sk)">
    <rect x="180" y="452" width="680" height="46" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="520" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">总显存 16 → 4.5 GB，3.6× 节省</text>
  <text x="520" y="492" text-anchor="middle" font-size="11" fill="#666">显存节省 → 更大并发 batch → 吞吐红利（单请求加速 × 并发提升）</text>
</svg>
