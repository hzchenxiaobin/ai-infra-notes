<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="34" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c04050"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
  </defs>
  <rect width="940" height="340" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Chunked Prefill：问题与方案</text>
  <path d="M 280 40 Q 470 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Problem (left) ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="400" height="200" rx="10" fill="#fce4ec" stroke="#c04050" stroke-width="1.4"/>
  </g>
  <text x="60" y="86" font-size="13" font-weight="bold" fill="#a03040">⚠ 问题</text>

  <!-- Problem items -->
  <g filter="url(#sk)">
    <rect x="60" y="98" width="360" height="44" rx="4" fill="#fff" stroke="#c04050" stroke-width="1"/>
  </g>
  <text x="72" y="116" font-size="10" fill="#a03040" font-weight="bold">长 prompt（如 2048 tokens）一次性处理</text>
  <text x="72" y="132" font-size="9" fill="#a03040">→ 占用全部 token budget</text>

  <g filter="url(#sk)">
    <rect x="60" y="150" width="360" height="44" rx="4" fill="#fff" stroke="#c04050" stroke-width="1"/>
  </g>
  <text x="72" y="168" font-size="10" fill="#a03040" font-weight="bold">同 batch 的 decode 请求被阻塞</text>
  <text x="72" y="184" font-size="9" fill="#a04040">→ 延迟尖峰</text>

  <g filter="url(#sk)">
    <rect x="60" y="202" width="360" height="44" rx="4" fill="#fff" stroke="#c04050" stroke-width="1"/>
  </g>
  <text x="72" y="220" font-size="10" fill="#a03040" font-weight="bold">用户感知：decode token 突然卡顿</text>
  <text x="72" y="236" font-size="9" fill="#a03040">→ 体验差</text>

  <!-- Arrow from problem to solution -->
  <path d="M 450 162 L 490 162" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Solution (right) ===== -->
  <g filter="url(#sk)">
    <rect x="500" y="62" width="400" height="200" rx="10" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.4"/>
  </g>
  <text x="520" y="86" font-size="13" font-weight="bold" fill="#2e6e2e">✓ Chunked Prefill</text>

  <!-- Solution items -->
  <g filter="url(#sk)">
    <rect x="520" y="98" width="360" height="44" rx="4" fill="#fff" stroke="#2e8b57" stroke-width="1"/>
  </g>
  <text x="532" y="116" font-size="10" fill="#2e6e2e" font-weight="bold">将长 prompt 分成多个 chunk</text>
  <text x="532" y="132" font-size="9" fill="#2e6e2e">如每 chunk 512 tokens</text>

  <g filter="url(#sk)">
    <rect x="520" y="150" width="360" height="44" rx="4" fill="#fff" stroke="#2e8b57" stroke-width="1"/>
  </g>
  <text x="532" y="168" font-size="10" fill="#2e6e2e" font-weight="bold">每个 chunk 与 decode 请求一起执行</text>
  <text x="532" y="184" font-size="9" fill="#2e6e2e">共享 token budget</text>

  <g filter="url(#sk)">
    <rect x="520" y="202" width="360" height="44" rx="4" fill="#fff" stroke="#2e8b57" stroke-width="1"/>
  </g>
  <text x="532" y="220" font-size="10" fill="#2e6e2e" font-weight="bold">逐步完成 prefill，同时不中断 decode</text>
  <text x="532" y="236" font-size="9" fill="#2e6e2e">→ 延迟平滑</text>

  <!-- ===== Bottom: key insight ===== -->
  <g filter="url(#sk)">
    <rect x="120" y="278" width="700" height="48" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="470" y="298" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">💡 关键洞察：总 prefill 时间不变，但 decode 最大等待延迟从"整个 prefill"降到"一个 chunk"</text>
  <text x="470" y="316" text-anchor="middle" font-size="10" fill="#7a5415">prompt 越长、chunk 越小 → 效果越显著（8192 tok 从 82s → 2.6s，-97%）</text>
</svg>
