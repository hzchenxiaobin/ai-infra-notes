<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c04050"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">基本原理：传统 Decode vs Speculative Decoding</text>
  <path d="M 280 40 Q 470 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Traditional Decode (top) ===== -->
  <text x="40" y="68" font-size="12" font-weight="bold" fill="#c04050">传统 Decode</text>

  <!-- Step boxes: input → forward → output, repeated -->
  <g filter="url(#sk)">
    <rect x="40" y="78" width="80" height="28" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
    <rect x="130" y="78" width="100" height="28" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
    <rect x="240" y="78" width="80" height="28" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <g font-size="9" text-anchor="middle">
    <text x="80" y="96" fill="#a03040">输入 1 tok</text>
    <text x="180" y="96" fill="#a03040" font-weight="bold">大模型 forward</text>
    <text x="280" y="96" fill="#a03040">输出 1 tok</text>
  </g>

  <!-- Repeat arrow -->
  <path d="M 280 110 Q 180 124 80 110" stroke="#c04050" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="180" y="128" text-anchor="middle" font-size="9" fill="#c04050">重复每步</text>

  <text x="350" y="96" font-size="10" fill="#c04050" font-weight="bold">⚠ 缺点：大模型每次只处理 1 token，GPU 算力浪费</text>

  <!-- Divider -->
  <line x1="40" y1="146" x2="900" y2="146" stroke="#eee" stroke-width="1" filter="url(#sk)"/>

  <!-- ===== Speculative Decoding (bottom) ===== -->
  <text x="40" y="172" font-size="12" font-weight="bold" fill="#2e8b57">Speculative Decoding</text>

  <!-- Step 1: Draft model generates k tokens -->
  <g filter="url(#sk)">
    <rect x="40" y="182" width="360" height="44" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="56" y="200" font-size="10" fill="#2e6e2e" font-weight="bold">① 小模型（draft model）连续生成 k 个候选 tokens</text>
  <g filter="url(#sk)">
    <rect x="56" y="206" width="40" height="16" rx="3" fill="#fff" stroke="#2e8b57" stroke-width="1"/>
    <rect x="100" y="206" width="40" height="16" rx="3" fill="#fff" stroke="#2e8b57" stroke-width="1"/>
    <rect x="144" y="206" width="40" height="16" rx="3" fill="#fff" stroke="#2e8b57" stroke-width="1"/>
    <rect x="188" y="206" width="40" height="16" rx="3" fill="#fff" stroke="#2e8b57" stroke-width="1"/>
  </g>
  <g font-size="8" fill="#2e6e2e" text-anchor="middle">
    <text x="76" y="218">t₁</text>
    <text x="120" y="218">t₂</text>
    <text x="164" y="218">t₃</text>
    <text x="208" y="218">t₄</text>
  </g>
  <text x="250" y="218" font-size="9" fill="#888">k=4 个 draft</text>

  <!-- Arrow down -->
  <path d="M 220 228 L 220 244" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: Target model verifies k+1 tokens -->
  <g filter="url(#sk)">
    <rect x="40" y="250" width="360" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="56" y="268" font-size="10" fill="#2b6e9e" font-weight="bold">② 大模型（target）一次验证 k+1 个 tokens</text>
  <g filter="url(#sk)">
    <rect x="56" y="274" width="328" height="16" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="220" y="286" text-anchor="middle" font-size="9" fill="#2b6e9e" font-weight="bold">batch 验证，高效！</text>

  <!-- Arrow down -->
  <path d="M 220 296 L 220 312" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3 & 4: Accept/reject + distribution preserved -->
  <g filter="url(#sk)">
    <rect x="40" y="318" width="360" height="44" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="56" y="336" font-size="10" fill="#7a5415" font-weight="bold">③ 接受匹配的 tokens，从第一个不匹配处重新采样</text>
  <text x="56" y="354" font-size="10" fill="#7a5415" font-weight="bold">④ 保持输出分布不变（与原始大模型一致）</text>

  <!-- Right side: benefit summary -->
  <g filter="url(#sk)">
    <rect x="440" y="182" width="460" height="180" rx="10" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,3"/>
  </g>
  <text x="670" y="210" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">为什么更快？</text>
  <text x="460" y="236" font-size="10" fill="#444">• 小模型生成快（t_d ≪ T_fwd）</text>
  <text x="460" y="256" font-size="10" fill="#444">• 大模型一次验证多个 tokens，提高 batch 利用率</text>
  <text x="460" y="276" font-size="10" fill="#444">• 接受率 α 高时，每步产出 k×α+1 个 tokens</text>
  <text x="460" y="296" font-size="10" fill="#444">• 通过接受/拒绝采样保证分布不变</text>
  <text x="460" y="326" font-size="11" fill="#2e8b57" font-weight="bold">→ 典型加速比 1.5-2.7x</text>
  <text x="460" y="346" font-size="9" fill="#888">前提：draft 快 + 接受率高</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="120" y="378" width="700" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="470" y="398" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 核心思想：用小模型的"快"弥补大模型的"慢"，大模型批量验证不浪费算力</text>
</svg>
