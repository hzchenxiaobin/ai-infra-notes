<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
  </defs>
  <rect width="940" height="300" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Day 2 调度器遗留的性能问题</text>
  <path d="M 280 40 Q 470 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row 1: Decode 算力浪费 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="40" height="40" rx="6" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="60" y="88" text-anchor="middle" font-size="16" fill="#c04050" font-weight="bold">1</text>

  <g filter="url(#sk)">
    <rect x="100" y="62" width="340" height="40" rx="6" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="270" y="80" text-anchor="middle" font-size="11" fill="#a03040" font-weight="bold">Decode 每步只出 1 token</text>
  <text x="270" y="95" text-anchor="middle" font-size="10" fill="#a03040">大模型 GPU 算力浪费</text>

  <path d="M 450 82 L 540 82" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="550" y="62" width="350" height="40" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="725" y="80" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Speculative Decoding</text>
  <text x="725" y="95" text-anchor="middle" font-size="10" fill="#2e6e2e">TBT 降低 2-3x</text>

  <!-- ===== Row 2: Prefill 阻塞 decode ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="122" width="40" height="40" rx="6" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="60" y="148" text-anchor="middle" font-size="16" fill="#c04050" font-weight="bold">2</text>

  <g filter="url(#sk)">
    <rect x="100" y="122" width="340" height="40" rx="6" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#a03040" font-weight="bold">长 prompt prefill 阻塞 decode</text>
  <text x="270" y="155" text-anchor="middle" font-size="10" fill="#a03040">decode 延迟尖峰</text>

  <path d="M 450 142 L 540 142" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="550" y="122" width="350" height="40" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="725" y="140" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Chunked Prefill</text>
  <text x="725" y="155" text-anchor="middle" font-size="10" fill="#2e6e2e">延迟降低 50-97%</text>

  <!-- ===== Row 3: 重复 prefix ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="182" width="40" height="40" rx="6" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="60" y="208" text-anchor="middle" font-size="16" fill="#c04050" font-weight="bold">3</text>

  <g filter="url(#sk)">
    <rect x="100" y="182" width="340" height="40" rx="6" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="270" y="200" text-anchor="middle" font-size="11" fill="#a03040" font-weight="bold">重复 prefix 每次重新 prefill</text>
  <text x="270" y="215" text-anchor="middle" font-size="10" fill="#a03040">TTFT 高</text>

  <path d="M 450 202 L 540 202" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="550" y="182" width="350" height="40" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="725" y="200" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Prefix Caching</text>
  <text x="725" y="215" text-anchor="middle" font-size="10" fill="#2e6e2e">TTFT 降低 3-5x</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="120" y="244" width="700" height="40" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="470" y="268" text-anchor="middle" font-size="11" fill="#7a5415">💡 Day 3 从"会调度"升级为"跑得快"——三大特性分别解决 decode 效率、延迟平滑、前缀复用</text>
</svg>
