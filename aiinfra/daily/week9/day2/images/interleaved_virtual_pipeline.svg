<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="840" height="300" fill="#fdfcf7"/>
  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Interleaved 1F1B（Virtual Pipeline, V=2）</text>
  <path d="M 260 44 Q 420 52 580 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="420" y="60" text-anchor="middle" font-size="11" fill="#888">每个 device 负责两段层 · forward 跨 device 轮流穿过 V 个 virtual stage · bubble = (P−1)/(V·M+P−1)</text>
  <rect x="60" y="110" width="140" height="100" rx="6" fill="#f7f4ec" stroke="#b8a878" stroke-width="1.4" filter="url(#sk)"/>
  <text x="130.0" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">Device 0</text>
    <rect x="68" y="122" width="124" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="130.0" y="143" text-anchor="middle" font-size="11" fill="#2b6e9e">v-stage 0</text>
    <rect x="68" y="166" width="124" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" filter="url(#sk)"/>
    <text x="130.0" y="187" text-anchor="middle" font-size="11" fill="#2e6e2e">v-stage 1</text>
  <rect x="256" y="110" width="140" height="100" rx="6" fill="#f7f4ec" stroke="#b8a878" stroke-width="1.4" filter="url(#sk)"/>
  <text x="326.0" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">Device 1</text>
    <rect x="264" y="122" width="124" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="326.0" y="143" text-anchor="middle" font-size="11" fill="#2b6e9e">v-stage 0</text>
    <rect x="264" y="166" width="124" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" filter="url(#sk)"/>
    <text x="326.0" y="187" text-anchor="middle" font-size="11" fill="#2e6e2e">v-stage 1</text>
  <rect x="452" y="110" width="140" height="100" rx="6" fill="#f7f4ec" stroke="#b8a878" stroke-width="1.4" filter="url(#sk)"/>
  <text x="522.0" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">Device 2</text>
    <rect x="460" y="122" width="124" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="522.0" y="143" text-anchor="middle" font-size="11" fill="#2b6e9e">v-stage 0</text>
    <rect x="460" y="166" width="124" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" filter="url(#sk)"/>
    <text x="522.0" y="187" text-anchor="middle" font-size="11" fill="#2e6e2e">v-stage 1</text>
  <rect x="648" y="110" width="140" height="100" rx="6" fill="#f7f4ec" stroke="#b8a878" stroke-width="1.4" filter="url(#sk)"/>
  <text x="718.0" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">Device 3</text>
    <rect x="656" y="122" width="124" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="718.0" y="143" text-anchor="middle" font-size="11" fill="#2b6e9e">v-stage 0</text>
    <rect x="656" y="166" width="124" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" filter="url(#sk)"/>
    <text x="718.0" y="187" text-anchor="middle" font-size="11" fill="#2e6e2e">v-stage 1</text>
  <path d="M 196 138 L 260 138" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <path d="M 392 138 L 456 138" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <path d="M 588 138 L 652 138" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <path d="M 780 138 C 820 148, 28 172, 68 182" stroke="#b85450" stroke-width="1.6" marker-end="url(#ar)" fill="none" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="424.0" y="176" text-anchor="middle" font-size="10.5" fill="#b85450">stage_0 段完成 → 切到 stage_P 段</text>
  <path d="M 196 182 L 260 182" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <path d="M 392 182 L 456 182" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <path d="M 588 182 L 652 182" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <rect x="60" y="246" width="18" height="12" rx="2" fill="#e8f0fa" stroke="#4a8edb"/>
  <text x="84" y="256" font-size="11" fill="#2b6e9e">v-stage 0（stage_0 层段）</text>
  <rect x="300" y="246" width="18" height="12" rx="2" fill="#eaf6ee" stroke="#4a8e4a"/>
  <text x="324" y="256" font-size="11" fill="#2e6e2e">v-stage 1（stage_P 层段）</text>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#888">V 越大 bubble 越小，但 stage 间 send/recv 次数 × V（Megatron-LM 常用 V=2~4）</text>
</svg>
