<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="940" height="260" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">调度时间线：通信计算重叠</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <path d="M 40 58 L 900 58" stroke="#888" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="40" y="54" font-size="9" fill="#888">时间</text>

  <text x="40" y="92" font-size="11" fill="#3a5a8a" font-weight="bold">compute</text>

  <g filter="url(#sk)">
    <rect x="180" y="74" width="140" height="28" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="250" y="93" text-anchor="middle" font-size="10" fill="#3a5a8a" font-weight="bold">Y1 calc</text>

  <g filter="url(#sk)">
    <rect x="320" y="74" width="140" height="28" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="390" y="93" text-anchor="middle" font-size="10" fill="#3a5a8a" font-weight="bold">Y2 calc</text>

  <g filter="url(#sk)">
    <rect x="460" y="74" width="140" height="28" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="530" y="93" text-anchor="middle" font-size="10" fill="#3a5a8a" font-weight="bold">next_Y1 calc</text>

  <g filter="url(#sk)">
    <rect x="600" y="74" width="140" height="28" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="670" y="93" text-anchor="middle" font-size="10" fill="#3a5a8a" font-weight="bold">next_Y2 calc</text>

  <text x="760" y="93" font-size="14" fill="#888">...</text>

  <text x="40" y="148" font-size="11" fill="#a03040" font-weight="bold">comm</text>

  <path d="M 320 106 L 320 134 L 460 134 L 460 106 Z" fill="#fff7c0" opacity="0.45" filter="url(#sk)"/>
  <path d="M 320 130 L 320 158 L 460 158 L 460 130 Z" fill="#fff7c0" opacity="0.45" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="320" y="130" width="140" height="28" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="390" y="149" text-anchor="middle" font-size="10" fill="#a03040" font-weight="bold">AR(Y1)</text>

  <g filter="url(#sk)">
    <rect x="600" y="130" width="140" height="28" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="670" y="149" text-anchor="middle" font-size="10" fill="#a03040" font-weight="bold">AR(Y2)</text>

  <path d="M 390 106 L 390 128" stroke="#8a7a06" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="390" y="180" text-anchor="middle" font-size="10" fill="#8a7a06" font-weight="bold">↑ Y2 计算与 Y1 all-reduce 重叠</text>

  <path d="M 670 106 L 670 128" stroke="#8a7a06" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="670" y="180" text-anchor="middle" font-size="10" fill="#8a7a06" font-weight="bold">↑ next_Y1 与 Y2 AR 重叠</text>

  <path d="M 180 200 L 740 200" stroke="#2e8b57" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 180 196 L 180 204 M 740 196 L 740 204" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="460" y="218" text-anchor="middle" font-size="11" fill="#2e8b57">每层 ≈ max(T_Y1_calc, T_AR(Y1)) + max(T_Y2_calc, T_AR(Y2))</text>

  <text x="460" y="240" text-anchor="middle" font-size="10" fill="#888" font-style="italic">前半 all-reduce 与后半计算并行，串行加法变取最大值</text>
</svg>
