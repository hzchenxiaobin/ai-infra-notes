<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="920" height="200" fill="#fdfcf7"/>

  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">串行执行：compute 与 all-reduce 串行</text>
  <path d="M 240 40 Q 460 48 680 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="40" y="80" font-size="11" fill="#c04050" font-weight="bold">串行</text>
  <path d="M 40 92 L 880 92" stroke="#888" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="40" y="88" font-size="9" fill="#888">0</text>

  <g filter="url(#sk)">
    <rect x="60" y="100" width="160" height="28" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="140" y="119" text-anchor="middle" font-size="11" fill="#3a5a8a" font-weight="bold">compute (GEMM)</text>

  <g filter="url(#sk)">
    <rect x="220" y="100" width="120" height="28" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="280" y="119" text-anchor="middle" font-size="11" fill="#a03040" font-weight="bold">all-reduce</text>

  <g filter="url(#sk)">
    <rect x="340" y="100" width="160" height="28" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="420" y="119" text-anchor="middle" font-size="11" fill="#3a5a8a" font-weight="bold">compute (next GEMM)</text>

  <g filter="url(#sk)">
    <rect x="500" y="100" width="120" height="28" rx="4" fill="#fce4ec" stroke="#c04050" stroke-width="1.2"/>
  </g>
  <text x="560" y="119" text-anchor="middle" font-size="11" fill="#a03040" font-weight="bold">all-reduce</text>

  <text x="640" y="119" font-size="14" fill="#888">...</text>

  <text x="140" y="150" text-anchor="middle" font-size="10" fill="#3a5a8a">↑ SM 忙, NCCL 闲</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#a03040">↑ SM 闲, NCCL 忙</text>
  <text x="420" y="150" text-anchor="middle" font-size="10" fill="#3a5a8a">↑ SM 忙</text>

  <path d="M 60 170 L 620 170" stroke="#c04050" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 60 166 L 60 174 M 620 166 L 620 174" stroke="#c04050" stroke-width="1.2"/>
  <text x="340" y="186" text-anchor="middle" font-size="11" fill="#c04050">每层 = T_compute + T_comm（串行累加）</text>
</svg>
