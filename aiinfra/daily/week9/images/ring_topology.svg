<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fdfcf7"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Ring 拓扑（N=4）</text>
  <path d="M 140 40 Q 260 48 380 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 4 nodes in a ring -->
  <g filter="url(#sk)">
    <circle cx="260" cy="110" r="32" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.5"/>
    <circle cx="380" cy="190" r="32" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.5"/>
    <circle cx="260" cy="270" r="32" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.5"/>
    <circle cx="140" cy="190" r="32" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#3a5a8a" text-anchor="middle" font-weight="bold">
    <text x="260" y="114">节点 0</text>
    <text x="380" y="194">节点 1</text>
    <text x="260" y="274">节点 2</text>
    <text x="140" y="194">节点 3</text>
  </g>

  <!-- ring arrows (clockwise) -->
  <path d="M 288 128 Q 350 150 365 172" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 365 212 Q 350 240 288 258" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 232 258 Q 170 240 155 212" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 155 172 Q 170 150 232 128" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- direction label -->
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#888">顺时针单向传输</text>
</svg>
