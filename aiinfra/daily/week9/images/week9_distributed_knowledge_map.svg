<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="54" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="840" height="760" fill="#fdfcf7"/>
  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">分布式并行与多硬件知识地图</text>
  <path d="M 300 40 Q 420 48 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="40" y="56" width="760" height="70" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  </g>  <text x="60" y="80" font-size="13" fill="#b03a3a" font-weight="bold">动机</text>  <text x="60" y="102" font-size="10" fill="#444" font-weight="normal">模型太大（70B FP16 ≈ 140GB &gt; 单卡 80GB）</text>  <text x="60" y="118" font-size="10" fill="#444" font-weight="normal">+ 吞吐需求 + 延迟需求</text>  <path d="M 420 126 L 420 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="40" y="156" width="760" height="110" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>  <text x="60" y="180" font-size="13" fill="#4a8edb" font-weight="bold">四维并行</text>  <text x="60" y="202" font-size="10" fill="#444" font-weight="normal">TP: 参数按 head 切, 每层 all-reduce → 低延迟, 适合 intra-node</text>  <text x="60" y="218" font-size="10" fill="#444" font-weight="normal">PP: 参数按层切, stage 边界 send/recv → 有 bubble, 适合跨 node</text>  <text x="60" y="234" font-size="10" fill="#444" font-weight="normal">DP: 完整副本, 推理无通信 → 高吞吐, 需模型 ≤ 单卡</text>  <text x="60" y="250" font-size="10" fill="#444" font-weight="normal">EP: MoE 专家切, all-to-all → decode 阶段优于 TP</text>  <path d="M 420 266 L 420 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="40" y="296" width="760" height="80" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>  <text x="60" y="320" font-size="13" fill="#c98a2b" font-weight="bold">通信底座 (NCCL)</text>  <text x="60" y="342" font-size="10" fill="#444" font-weight="normal">all-reduce = reduce-scatter + all-gather</text>  <text x="60" y="358" font-size="10" fill="#444" font-weight="normal">通信量: 2(N-1)/N × D, 步数 2(N-1) (ring)</text>  <text x="60" y="374" font-size="10" fill="#444" font-weight="normal">ring (大消息) vs tree (小消息)</text>  <path d="M 420 376 L 420 406" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="40" y="406" width="760" height="80" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>  <text x="60" y="430" font-size="13" fill="#4a8e4a" font-weight="bold">通信计算重叠</text>  <text x="60" y="452" font-size="10" fill="#444" font-weight="normal">双 Stream: compute + comm 并发</text>  <text x="60" y="468" font-size="10" fill="#444" font-weight="normal">CUDA Graph: 消除 launch overhead</text>  <text x="60" y="484" font-size="10" fill="#444" font-weight="normal">收益: max(T_comp, T_comm) 替代 T_comp + T_comm</text>  <path d="M 420 486 L 420 516" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="40" y="516" width="760" height="80" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>  <text x="60" y="540" font-size="13" fill="#4a8edb" font-weight="bold">MoE + EP</text>  <text x="60" y="562" font-size="10" fill="#444" font-weight="normal">Top-K 路由 + all-to-all dispatch/combine</text>  <text x="60" y="578" font-size="10" fill="#444" font-weight="normal">DeepEP/EPLB: 大 EP 部署 (EP32/EP144)</text>  <text x="60" y="594" font-size="10" fill="#444" font-weight="normal">decode: EP &gt; TP (通信量更小)</text>  <path d="M 420 596 L 420 626" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="40" y="626" width="760" height="70" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/>
  </g>  <text x="60" y="650" font-size="13" fill="#9e9e9e" font-weight="bold">多硬件: NVIDIA vs Ascend</text>  <text x="60" y="672" font-size="10" fill="#444" font-weight="normal">SM/warp/Tensor Core (SIMT) vs AI Core (Cube/Vector)</text>  <text x="60" y="688" font-size="10" fill="#444" font-weight="normal">概念映射: smem↔UB, warp shuffle↔DataCopy</text></svg>