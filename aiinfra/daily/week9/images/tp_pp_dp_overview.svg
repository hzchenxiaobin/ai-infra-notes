<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a6fa5"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c04050"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">TP / PP / DP 三种分布式并行对比</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ TP (column 1) ============ -->
  <text x="160" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6fa5">Tensor Parallelism (TP)</text>
  <text x="160" y="90" text-anchor="middle" font-size="11" fill="#666">切权重矩阵，同层跨卡</text>
  <!-- GPU 0 -->
  <g filter="url(#sk)">
    <rect x="40" y="104" width="120" height="40" rx="5" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.3"/>
    <rect x="40" y="150" width="120" height="40" rx="5" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#3a5a8a">GPU0: W[:, :out/2]</text>
  <text x="100" y="174" text-anchor="middle" font-size="10" fill="#3a5a8a">GPU0: W[:, in/2:]</text>
  <!-- GPU 1 -->
  <g filter="url(#sk)">
    <rect x="170" y="104" width="120" height="40" rx="5" fill="#e3edf7" stroke="#4a6fa5" stroke-width="1.3"/>
    <rect x="170" y="150" width="120" height="40" rx="5" fill="#e3edf7" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="230" y="128" text-anchor="middle" font-size="10" fill="#3a5a8a">GPU1: W[:, out/2:]</text>
  <text x="230" y="174" text-anchor="middle" font-size="10" fill="#3a5a8a">GPU1: W[:, in/2:]</text>
  <!-- all-reduce arrow -->
  <path d="M 165 200 L 165 216" stroke="#c04050" stroke-width="1.4" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="165" y="232" text-anchor="middle" font-size="10" fill="#c04050" font-weight="bold">all-reduce</text>
  <path d="M 100 244 Q 165 250 230 244" stroke="#c04050" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="160" y="270" text-anchor="middle" font-size="10" fill="#3a5a8a">同层算力 x2，每层 1 次通信</text>

  <!-- ============ PP (column 2) ============ -->
  <text x="470" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">Pipeline Parallelism (PP)</text>
  <text x="470" y="90" text-anchor="middle" font-size="11" fill="#666">切层，按 stage 分卡</text>
  <g filter="url(#sk)">
    <rect x="350" y="104" width="80" height="86" rx="5" fill="#fef3e2" stroke="#d97706" stroke-width="1.3"/>
    <rect x="430" y="104" width="80" height="86" rx="5" fill="#fdf0d9" stroke="#d97706" stroke-width="1.3"/>
    <rect x="510" y="104" width="80" height="86" rx="5" fill="#fde9c6" stroke="#d97706" stroke-width="1.3"/>
  </g>
  <text x="390" y="124" text-anchor="middle" font-size="10" fill="#8a5a06">GPU0</text>
  <text x="390" y="140" text-anchor="middle" font-size="9" fill="#8a5a06">Layer 0-3</text>
  <text x="390" y="156" text-anchor="middle" font-size="9" fill="#8a5a06">stage 0</text>
  <text x="470" y="124" text-anchor="middle" font-size="10" fill="#8a5a06">GPU1</text>
  <text x="470" y="140" text-anchor="middle" font-size="9" fill="#8a5a06">Layer 4-7</text>
  <text x="470" y="156" text-anchor="middle" font-size="9" fill="#8a5a06">stage 1</text>
  <text x="550" y="124" text-anchor="middle" font-size="10" fill="#8a5a06">GPU2</text>
  <text x="550" y="140" text-anchor="middle" font-size="9" fill="#8a5a06">Layer 8-11</text>
  <text x="550" y="156" text-anchor="middle" font-size="9" fill="#8a5a06">stage 2</text>
  <!-- pipeline arrows -->
  <path d="M 430 147 L 446 147" stroke="#d97706" stroke-width="1.4" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 510 147 L 526 147" stroke="#d97706" stroke-width="1.4" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="470" y="208" text-anchor="middle" font-size="10" fill="#8a5a06">micro-batch 流水，stage 间传 activation</text>
  <text x="470" y="224" text-anchor="middle" font-size="10" fill="#8a5a06">bubble = (P-1)/(M+P-1)</text>
  <text x="470" y="246" text-anchor="middle" font-size="10" fill="#8a5a06">显存省，但有空泡</text>

  <!-- ============ DP (column 3) ============ -->
  <text x="780" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e8b57">Data Parallelism (DP)</text>
  <text x="780" y="90" text-anchor="middle" font-size="11" fill="#666">切数据，各卡完整模型</text>
  <g filter="url(#sk)">
    <rect x="660" y="104" width="100" height="86" rx="5" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/>
    <rect x="770" y="104" width="100" height="86" rx="5" fill="#dff0e4" stroke="#2e8b57" stroke-width="1.3"/>
  </g>
  <text x="710" y="124" text-anchor="middle" font-size="10" fill="#2e6e2e">GPU0</text>
  <text x="710" y="140" text-anchor="middle" font-size="9" fill="#2e6e2e">完整模型</text>
  <text x="710" y="156" text-anchor="middle" font-size="9" fill="#2e6e2e">batch_0</text>
  <text x="820" y="124" text-anchor="middle" font-size="10" fill="#2e6e2e">GPU1</text>
  <text x="820" y="140" text-anchor="middle" font-size="9" fill="#2e6e2e">完整模型</text>
  <text x="820" y="156" text-anchor="middle" font-size="9" fill="#2e6e2e">batch_1</text>
  <!-- grad all-reduce -->
  <path d="M 760 196 Q 760 208 740 208 Q 710 208 710 196" stroke="#c04050" stroke-width="1.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 770 196 Q 770 208 790 208 Q 820 208 820 196" stroke="#c04050" stroke-width="1.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="780" y="224" text-anchor="middle" font-size="10" fill="#c04050" font-weight="bold">grad all-reduce</text>
  <text x="780" y="246" text-anchor="middle" font-size="10" fill="#2e6e2e">推理：每卡独立请求，吞吐 xN</text>

  <!-- ============ 对比表 ============ -->
  <line x1="40" y1="280" x2="900" y2="280" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <text x="40" y="302" font-size="12" font-weight="bold" fill="#2b2b2b">对比</text>
  <g font-size="11" fill="#444">
    <text x="40" y="322">维度</text>
    <text x="160" y="322" fill="#4a6fa5" font-weight="bold">TP</text>
    <text x="430" y="322" fill="#d97706" font-weight="bold">PP</text>
    <text x="700" y="322" fill="#2e8b57" font-weight="bold">DP</text>
    <text x="40" y="344">切分对象</text>
    <text x="160" y="344">权重矩阵</text>
    <text x="430" y="344">层（stage）</text>
    <text x="700" y="344">输入数据</text>
    <text x="40" y="366">通信</text>
    <text x="160" y="344"></text>
    <text x="160" y="366">all-reduce /层</text>
    <text x="430" y="366">send/recv stage 间</text>
    <text x="700" y="366">grad all-reduce /步</text>
    <text x="40" y="388">显存</text>
    <text x="160" y="388">权重 ÷ TP</text>
    <text x="430" y="388">权重 ÷ PP</text>
    <text x="700" y="388">完整模型 x N</text>
    <text x="40" y="410">推理适用</text>
    <text x="160" y="410">大模型单卡放不下</text>
    <text x="430" y="410">超大模型</text>
    <text x="700" y="410">高吞吐多请求</text>
    <text x="40" y="432">通信量</text>
    <text x="160" y="432">中（每层）</text>
    <text x="430" y="432">小（点对点）</text>
    <text x="700" y="432">大（梯度全聚合）</text>
  </g>
  <text x="470" y="456" text-anchor="middle" font-size="10" fill="#888">💡 实际系统常组合：DP-TP（外层 DP 切请求，内层 TP 切模型）或 DP-PP</text>
</svg>
