<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c04050"/>
    </marker>
  </defs>
  <rect width="940" height="240" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">TP 经典 pattern：Column + Row 配对</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="470" y="62" text-anchor="middle" font-size="12" fill="#666">一个 Attention Block 仅 1 次 all-reduce</text>

  <!-- flow boxes -->
  <!-- X input -->
  <g filter="url(#sk)">
    <rect x="30" y="92" width="50" height="40" rx="5" fill="#f5f0e8" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="55" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">X</text>

  <!-- arrow -->
  <path d="M 80 112 L 118 112" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ColumnParallel(QKV) -->
  <g filter="url(#sk)">
    <rect x="120" y="84" width="200" height="56" rx="6" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="220" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a8a">ColumnParallel</text>
  <text x="220" y="126" text-anchor="middle" font-size="11" fill="#3a5a8a">(QKV 投影)</text>

  <!-- arrow -->
  <path d="M 320 112 L 358 112" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Attention -->
  <g filter="url(#sk)">
    <rect x="360" y="84" width="180" height="56" rx="6" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="450" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a8a">Attention</text>
  <text x="450" y="126" text-anchor="middle" font-size="11" fill="#3a5a8a">各 head 独立</text>

  <!-- arrow -->
  <path d="M 540 112 L 578 112" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- RowParallel(Output) -->
  <g filter="url(#sk)">
    <rect x="580" y="84" width="200" height="56" rx="6" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="680" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a8a">RowParallel</text>
  <text x="680" y="126" text-anchor="middle" font-size="11" fill="#3a5a8a">(Output 投影)</text>

  <!-- arrow -->
  <path d="M 780 112 L 818 112" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Y output -->
  <g filter="url(#sk)">
    <rect x="820" y="92" width="50" height="40" rx="5" fill="#f5f0e8" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="845" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">Y</text>

  <!-- communication annotations -->
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="bold">无通信</text>
  <text x="220" y="186" text-anchor="middle" font-size="10" fill="#2e6e2e">各 rank 算自己 head 的 QKV</text>

  <text x="450" y="170" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="bold">无通信</text>
  <text x="450" y="186" text-anchor="middle" font-size="10" fill="#2e6e2e">各 head 本地计算</text>

  <!-- all-reduce marker at RowParallel -->
  <path d="M 680 140 L 680 158" stroke="#c04050" stroke-width="1.4" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="680" y="170" text-anchor="middle" font-size="11" fill="#c04050" font-weight="bold">1 次 all-reduce</text>
  <text x="680" y="186" text-anchor="middle" font-size="10" fill="#a03040">部分和聚合</text>

  <!-- bracket showing total comm -->
  <path d="M 120 208 L 780 208" stroke="#c04050" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#sk)"/>
  <path d="M 120 204 L 120 212 M 780 204 L 780 212" stroke="#c04050" stroke-width="1.2"/>
  <text x="450" y="228" text-anchor="middle" font-size="11" fill="#c04050" font-weight="bold">整个 Attention Block 仅 1 次通信</text>
</svg>
