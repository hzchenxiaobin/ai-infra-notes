<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="600" height="560" fill="#fdfcf7"/>
  <text x="300" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">MoE 前向数据流</text>
  <path d="M 180 40 Q 300 48 420 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="56" width="480" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>  <text x="80" y="78" font-size="11" fill="#4a8edb" font-weight="bold" font-family="monospace">token x</text>  <path d="M 300 106 L 300 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="126" width="480" height="50" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>  <text x="80" y="148" font-size="11" fill="#c98a2b" font-weight="bold" font-family="monospace">gate(x) = softmax(x @ W_gate)</text>  <text x="80" y="166" font-size="9" fill="#666" font-weight="normal">路由网络（小 GEMM）</text>  <path d="M 300 176 L 300 196" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="196" width="480" height="50" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>  <text x="80" y="218" font-size="11" fill="#c98a2b" font-weight="bold" font-family="monospace">top-k(gate)</text>  <text x="80" y="236" font-size="9" fill="#666" font-weight="normal">选 k 个专家（如 k=2）</text>  <path d="M 300 246 L 300 266" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="266" width="480" height="50" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  </g>  <text x="80" y="288" font-size="11" fill="#b03a3a" font-weight="bold" font-family="monospace">dispatch: x 发给 k 个专家</text>  <text x="80" y="306" font-size="9" fill="#666" font-weight="normal">all-to-all（EP 时跨节点）</text>  <path d="M 300 316 L 300 336" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="336" width="480" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>  <text x="80" y="358" font-size="11" fill="#4a8e4a" font-weight="bold" font-family="monospace">expert_i(x) = FFN_i(x)</text>  <text x="80" y="376" font-size="9" fill="#666" font-weight="normal">k 个专家并行计算</text>  <path d="M 300 386 L 300 406" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="406" width="480" height="50" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/>
  </g>  <text x="80" y="428" font-size="11" fill="#b03a3a" font-weight="bold" font-family="monospace">combine: 加权求和 Σ w_i · expert_i(x)</text>  <text x="80" y="446" font-size="9" fill="#666" font-weight="normal">all-to-all 回收</text>  <path d="M 300 456 L 300 476" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>  <g filter="url(#sk)">
    <rect x="60" y="476" width="480" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>  <text x="80" y="498" font-size="11" fill="#4a8edb" font-weight="bold" font-family="monospace">output</text></svg>