<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">国内 AI Infra 多硬件现状 vs 只懂 CUDA 的瓶颈</text>
  <path d="M 230 40 Q 450 48 670 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左栏：多硬件现状 ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="56" width="390" height="300" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="225" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a8a">多硬件现状</text>

  <g filter="url(#sk)">
    <rect x="50" y="100" width="350" height="60" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="66" y="120" font-size="12" font-weight="bold" fill="#444">互联网大厂</text>
  <text x="66" y="140" font-size="10" fill="#666">NVIDIA A100/H100 为主，战略上引入国产算力降风险</text>

  <g filter="url(#sk)">
    <rect x="50" y="170" width="350" height="60" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="66" y="190" font-size="12" font-weight="bold" fill="#444">华为云 / 昇腾生态</text>
  <text x="66" y="210" font-size="10" fill="#666">Ascend 910/910B 是主力，CANN 是软件栈</text>

  <g filter="url(#sk)">
    <rect x="50" y="240" width="350" height="60" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="66" y="260" font-size="12" font-weight="bold" fill="#444">推理框架</text>
  <text x="66" y="280" font-size="10" fill="#666">vLLM / TensorRT-LLM 也在做"多后端"适配</text>

  <!-- ============ 箭头：现状 → 瓶颈 ============ -->
  <path d="M 420 206 L 478 206" stroke="#888" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="449" y="196" text-anchor="middle" font-size="9" fill="#999">所以</text>

  <!-- ============ 右栏：只懂 CUDA 的瓶颈 ============ -->
  <g filter="url(#sk)">
    <rect x="480" y="56" width="390" height="300" rx="10" fill="#fce4ec" stroke="#c04050" stroke-width="1.5"/>
  </g>
  <text x="675" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#c04050">只懂 CUDA 的瓶颈</text>

  <g filter="url(#sk)">
    <rect x="500" y="100" width="350" height="60" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="516" y="120" font-size="12" font-weight="bold" fill="#444">面试官</text>
  <text x="516" y="140" font-size="10" fill="#666">"你这 kernel 迁到 Ascend 要改什么？" → 答不上来</text>

  <g filter="url(#sk)">
    <rect x="500" y="170" width="350" height="60" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="516" y="190" font-size="12" font-weight="bold" fill="#444">业务方</text>
  <text x="516" y="210" font-size="10" fill="#666">"我们要支持昇腾卡" → 你说"我只懂 CUDA"</text>

  <g filter="url(#sk)">
    <rect x="500" y="240" width="350" height="60" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="516" y="260" font-size="12" font-weight="bold" fill="#444">本质</text>
  <text x="516" y="280" font-size="10" fill="#666">只懂一种硬件 = 只会一种"表达计算"的方式</text>

  <!-- 脚注 -->
  <text x="450" y="372" text-anchor="middle" font-size="10" fill="#888">只懂 CUDA → 多硬件视野是"单硬件工程师"到"多硬件适配"的关键一课</text>
</svg>
