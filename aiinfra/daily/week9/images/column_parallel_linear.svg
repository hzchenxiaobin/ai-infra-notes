<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <rect width="940" height="320" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Column-Parallel Linear（QKV 投影）</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- weight split -->
  <text x="470" y="68" text-anchor="middle" font-size="12" fill="#666">W ∈ [out, in] 按 output 维切分</text>
  <g filter="url(#sk)">
    <rect x="320" y="78" width="130" height="28" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
    <rect x="470" y="78" width="130" height="28" rx="4" fill="#e3edf7" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="385" y="96" text-anchor="middle" font-size="11" fill="#3a5a8a">W₀: [out/2, in]</text>
  <text x="535" y="96" text-anchor="middle" font-size="11" fill="#3a5a8a">W₁: [out/2, in]</text>

  <!-- input X (shared) -->
  <g filter="url(#sk)">
    <rect x="370" y="120" width="200" height="30" rx="5" fill="#f5f0e8" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="470" y="140" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">输入 X[B, in]</text>
  <text x="600" y="140" font-size="10" fill="#888">各 rank 相同</text>

  <!-- broadcast arrows -->
  <path d="M 420 150 L 250 176" stroke="#888" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 150 L 690 176" stroke="#888" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- GPU0 lane -->
  <g filter="url(#sk)">
    <rect x="140" y="182" width="220" height="64" rx="6" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="250" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a8a">GPU0</text>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#3a5a8a">Y₀ = X @ W₀ᵀ</text>
  <text x="250" y="238" text-anchor="middle" font-size="10" fill="#3a5a8a">→ [B, out/2]</text>

  <!-- GPU1 lane -->
  <g filter="url(#sk)">
    <rect x="580" y="182" width="220" height="64" rx="6" fill="#e3edf7" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="690" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a8a">GPU1</text>
  <text x="690" y="220" text-anchor="middle" font-size="11" fill="#3a5a8a">Y₁ = X @ W₁ᵀ</text>
  <text x="690" y="238" text-anchor="middle" font-size="10" fill="#3a5a8a">→ [B, out/2]</text>

  <!-- output annotation -->
  <path d="M 250 246 L 250 266" stroke="#4a6fa5" stroke-width="1.2" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 690 246 L 690 266" stroke="#4a6fa5" stroke-width="1.2" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- communication annotation -->
  <g filter="url(#sk)">
    <rect x="250" y="272" width="440" height="34" rx="5" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="470" y="294" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">通信量: 0 — 按 head 天然并行，下游 attention 本地消费</text>
</svg>
