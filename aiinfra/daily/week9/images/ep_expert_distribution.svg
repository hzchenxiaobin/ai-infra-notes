<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="640" height="370" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">EP 专家分布（EP=4, 8 专家, 每节点 2 专家）</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Node 0 -->
  <g filter="url(#sk)">
    <rect x="40" y="72" width="260" height="104" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="60" y="94" font-size="13" fill="#4a8edb" font-weight="bold" font-family="monospace">Node 0</text>
  <g filter="url(#sk)">
    <rect x="70" y="112" width="92" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="180" y="112" width="92" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="116" y="139" font-size="12" fill="#c98a2b" font-weight="bold" text-anchor="middle">Expert 0</text>
  <text x="226" y="139" font-size="12" fill="#c98a2b" font-weight="bold" text-anchor="middle">Expert 1</text>

  <!-- Node 1 -->
  <g filter="url(#sk)">
    <rect x="340" y="72" width="260" height="104" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="360" y="94" font-size="13" fill="#4a8edb" font-weight="bold" font-family="monospace">Node 1</text>
  <g filter="url(#sk)">
    <rect x="370" y="112" width="92" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="480" y="112" width="92" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="416" y="139" font-size="12" fill="#c98a2b" font-weight="bold" text-anchor="middle">Expert 2</text>
  <text x="526" y="139" font-size="12" fill="#c98a2b" font-weight="bold" text-anchor="middle">Expert 3</text>

  <!-- Node 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="204" width="260" height="104" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="60" y="226" font-size="13" fill="#4a8edb" font-weight="bold" font-family="monospace">Node 2</text>
  <g filter="url(#sk)">
    <rect x="70" y="244" width="92" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="180" y="244" width="92" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="116" y="271" font-size="12" fill="#c98a2b" font-weight="bold" text-anchor="middle">Expert 4</text>
  <text x="226" y="271" font-size="12" fill="#c98a2b" font-weight="bold" text-anchor="middle">Expert 5</text>

  <!-- Node 3 -->
  <g filter="url(#sk)">
    <rect x="340" y="204" width="260" height="104" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="360" y="226" font-size="13" fill="#4a8edb" font-weight="bold" font-family="monospace">Node 3</text>
  <g filter="url(#sk)">
    <rect x="370" y="244" width="92" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="480" y="244" width="92" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="416" y="271" font-size="12" fill="#c98a2b" font-weight="bold" text-anchor="middle">Expert 6</text>
  <text x="526" y="271" font-size="12" fill="#c98a2b" font-weight="bold" text-anchor="middle">Expert 7</text>

  <!-- footnote -->
  <text x="320" y="345" text-anchor="middle" font-size="11" fill="#666">token 选 top-k 专家 → 可能跨节点 → all-to-all 通信</text>
</svg>
