<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a6fa5"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c04050"/>
    </marker>
  </defs>
  <rect width="940" height="360" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Row-Parallel Linear（Output 投影）</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- weight split -->
  <text x="470" y="68" text-anchor="middle" font-size="12" fill="#666">W ∈ [out, in] 按 input 维切分</text>
  <g filter="url(#sk)">
    <rect x="320" y="78" width="130" height="28" rx="4" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.2"/>
    <rect x="470" y="78" width="130" height="28" rx="4" fill="#e3edf7" stroke="#4a6fa5" stroke-width="1.2"/>
  </g>
  <text x="385" y="96" text-anchor="middle" font-size="11" fill="#3a5a8a">W₀: [out, in/2]</text>
  <text x="535" y="96" text-anchor="middle" font-size="11" fill="#3a5a8a">W₁: [out, in/2]</text>

  <!-- input X_i per rank (different) -->
  <g filter="url(#sk)">
    <rect x="140" y="120" width="200" height="30" rx="5" fill="#f5f0e8" stroke="#999" stroke-width="1.2"/>
    <rect x="600" y="120" width="200" height="30" rx="5" fill="#f5f0e8" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="240" y="140" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">X₀[B, in/2]</text>
  <text x="700" y="140" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">X₁[B, in/2]</text>
  <text x="470" y="140" text-anchor="middle" font-size="10" fill="#888">各 rank 不同</text>

  <!-- arrows down to GPUs -->
  <path d="M 240 150 L 240 176" stroke="#888" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 700 150 L 700 176" stroke="#888" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- GPU0 lane -->
  <g filter="url(#sk)">
    <rect x="140" y="182" width="200" height="64" rx="6" fill="#e8f0fa" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="240" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a8a">GPU0</text>
  <text x="240" y="220" text-anchor="middle" font-size="11" fill="#3a5a8a">Y₀ = X₀ @ W₀ᵀ</text>
  <text x="240" y="238" text-anchor="middle" font-size="10" fill="#3a5a8a">部分和 [B, out]</text>

  <!-- GPU1 lane -->
  <g filter="url(#sk)">
    <rect x="600" y="182" width="200" height="64" rx="6" fill="#e3edf7" stroke="#4a6fa5" stroke-width="1.3"/>
  </g>
  <text x="700" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a8a">GPU1</text>
  <text x="700" y="220" text-anchor="middle" font-size="11" fill="#3a5a8a">Y₁ = X₁ @ W₁ᵀ</text>
  <text x="700" y="238" text-anchor="middle" font-size="10" fill="#3a5a8a">部分和 [B, out]</text>

  <!-- all-reduce convergence -->
  <path d="M 240 246 Q 240 270 470 280" stroke="#c04050" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 700 246 Q 700 270 470 280" stroke="#c04050" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- all-reduce box -->
  <g filter="url(#sk)">
    <rect x="330" y="286" width="280" height="30" rx="5" fill="#fce4ec" stroke="#c04050" stroke-width="1.3"/>
  </g>
  <text x="470" y="306" text-anchor="middle" font-size="12" fill="#a03040" font-weight="bold">all-reduce(sum) → Y[B, out]</text>

  <!-- communication annotation -->
  <text x="470" y="340" text-anchor="middle" font-size="12" fill="#a03040" font-weight="bold">通信量: all-reduce [B, out] 元素</text>
</svg>
