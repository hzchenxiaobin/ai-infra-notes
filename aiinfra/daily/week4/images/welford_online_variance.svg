<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="18" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#fdfcf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Welford 在线均值/方差算法（一次 reduce 合并）</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- Top: comparison -->
  <g filter="url(#sk2)">
    <rect x="40" y="60" width="380" height="56" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.3"/>
    <text x="230" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">朴素两次 reduce（Day 2 默认实现）</text>
    <text x="230" y="100" text-anchor="middle" font-size="10" fill="#444">Pass 1: 求 mean → Pass 2: 求 variance</text>
    <text x="230" y="112" text-anchor="middle" font-size="10" fill="#888" font-style="italic">读 HBM 2N 次（两次扫描）</text>
  </g>

  <text x="460" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#888">→</text>

  <g filter="url(#sk2)">
    <rect x="500" y="60" width="380" height="56" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.3"/>
    <text x="690" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d4f">Welford 一次 reduce（Day 3 FT 做法）</text>
    <text x="690" y="100" text-anchor="middle" font-size="10" fill="#444">单遍同时维护 mean + M2 + count</text>
    <text x="690" y="112" text-anchor="middle" font-size="10" fill="#888" font-style="italic">读 HBM N 次（一次扫描）</text>
  </g>

  <!-- Main: Welford loop flow -->
  <text x="460" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">遍历每个元素 xi 的在线更新流程</text>

  <!-- Input element -->
  <g filter="url(#sk2)">
    <rect x="360" y="162" width="200" height="32" rx="6" fill="#f0ede4" stroke="#3a3a3a" stroke-width="1.4"/>
    <text x="460" y="182" text-anchor="middle" font-size="11" fill="#2b2b2b">取下一个元素 xi</text>
  </g>
  <path d="M 460 196 L 460 210" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>

  <!-- Step 1: count++ -->
  <g filter="url(#sk2)">
    <rect x="310" y="214" width="300" height="36" rx="6" fill="#4a8edb" stroke="#3a3a3a" stroke-width="1.4" opacity="0.55"/>
    <text x="460" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">count++</text>
  </g>
  <path d="M 460 252 L 460 266" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>

  <!-- Step 2: delta -->
  <g filter="url(#sk2)">
    <rect x="280" y="270" width="360" height="36" rx="6" fill="#e8a838" stroke="#3a3a3a" stroke-width="1.4" opacity="0.55"/>
    <text x="460" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">delta = xi - mean</text>
  </g>
  <path d="M 460 308 L 460 322" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>

  <!-- Step 3: update mean -->
  <g filter="url(#sk2)">
    <rect x="250" y="326" width="420" height="36" rx="6" fill="#4a8edb" stroke="#3a3a3a" stroke-width="1.4" opacity="0.55"/>
    <text x="460" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">mean += delta / count</text>
  </g>
  <path d="M 460 364 L 460 378" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>

  <!-- Step 4: update M2 -->
  <g filter="url(#sk2)">
    <rect x="210" y="382" width="500" height="36" rx="6" fill="#e57373" stroke="#3a3a3a" stroke-width="1.4" opacity="0.55"/>
    <text x="460" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">M2 += delta * (xi - mean)  // M2 累积平方差</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 710 400 Q 780 400 780 290 Q 780 178 560 178" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar3)" stroke-dasharray="4 3"/>
  <text x="800" y="290" font-size="10" fill="#888" font-style="italic">还有元素?</text>
  <text x="800" y="304" font-size="10" fill="#888" font-style="italic">→ 继续</text>

  <!-- Final result -->
  <path d="M 460 420 L 460 434" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <g filter="url(#sk2)">
    <rect x="300" y="438" width="320" height="40" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.6"/>
    <text x="460" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d4f">最终：variance = M2 / count</text>
    <text x="460" y="472" text-anchor="middle" font-size="10" fill="#444">mean 和 variance 在一次遍历内同时求出</text>
  </g>

  <!-- Bottom: parallel merge note -->
  <g filter="url(#sk2)">
    <rect x="40" y="496" width="840" height="48" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="60" y="518" font-size="11" font-weight="bold" fill="#2b2b2b">并行化挑战：</text>
    <text x="60" y="536" font-size="11" fill="#444">需合并多个线程的 (mean, M2, count)，合并公式按 count 加权 —— 这是 Day 3 FasterTransformer generalLayerNorm 的核心优化点</text>
  </g>
</svg>
