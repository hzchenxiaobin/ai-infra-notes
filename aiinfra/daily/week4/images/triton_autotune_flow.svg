<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="760" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Triton @triton.autotune：配置搜索与缓存流程</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- Configs panel -->
  <text x="470" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">多套 Config（BLOCK_SIZE / num_warps / num_stages）</text>
  <g filter="url(#sk2)">
    <rect x="80" y="82" width="780" height="64" rx="8" fill="#f4f0e6" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <g font-size="9" fill="#2b2b2b">
    <g filter="url(#sk2)"><rect x="100" y="94" width="170" height="40" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="110" y="110" font-size="9" font-weight="bold">config 0</text><text x="110" y="124" font-size="9">BM64 BN64 BK32</text><text x="110" y="136" font-size="9">warps=4 stages=3</text></g>
    <g filter="url(#sk2)"><rect x="290" y="94" width="170" height="40" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="300" y="110" font-size="9" font-weight="bold">config 1</text><text x="300" y="124" font-size="9">BM128 BN64 BK32</text><text x="300" y="136" font-size="9">warps=4 stages=3</text></g>
    <g filter="url(#sk2)"><rect x="480" y="94" width="170" height="40" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="490" y="110" font-size="9" font-weight="bold">config 2</text><text x="490" y="124" font-size="9">BM128 BN128 BK32</text><text x="490" y="136" font-size="9">warps=8 stages=3</text></g>
    <g filter="url(#sk2)"><rect x="670" y="94" width="170" height="40" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="680" y="110" font-size="9" font-weight="bold">config 3</text><text x="680" y="124" font-size="9">BM128 BN64 BK64</text><text x="680" y="136" font-size="9">warps=4 stages=4</text></g>
  </g>

  <!-- Arrow down to decision diamond -->
  <path d="M 470 146 L 470 164" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>

  <!-- Decision diamond -->
  <g filter="url(#sk2)">
    <path d="M 470 168 L 570 205 L 470 242 L 370 205 Z" fill="#fff3cf" stroke="#e8a838" stroke-width="1.6"/>
  </g>
  <text x="470" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">key=(M,N,K)</text>
  <text x="470" y="217" text-anchor="middle" font-size="10" fill="#444">查缓存？</text>

  <!-- Left branch: cache hit -->
  <path d="M 370 205 L 200 205 L 200 265" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <text x="290" y="197" text-anchor="middle" font-size="10" fill="#2e7d4f" font-weight="bold">命中 ✓</text>
  <g filter="url(#sk2)">
    <rect x="60" y="270" width="280" height="110" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.4"/>
  </g>
  <text x="200" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d4f">后续调用：直接用最优 config</text>
  <text x="80" y="314" font-size="10" fill="#444">① 按 key 查缓存表</text>
  <text x="80" y="330" font-size="10" fill="#444">② 取出已选最优 config</text>
  <text x="80" y="346" font-size="10" fill="#444">③ 直接 launch（零搜索开销）</text>
  <text x="80" y="368" font-size="10" fill="#2e7d4f" font-style="italic">之后零调优成本</text>

  <!-- Right branch: cache miss -->
  <path d="M 570 205 L 740 205 L 740 265" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <text x="655" y="197" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">未命中 ✗（首次/shape 变）</text>
  <g filter="url(#sk2)">
    <rect x="600" y="270" width="280" height="110" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="740" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">首次调用：试所有 config</text>
  <text x="620" y="314" font-size="10" fill="#444">① 对每个 config 各跑一次</text>
  <text x="620" y="330" font-size="10" fill="#444">② 测量 kernel 时间</text>
  <text x="620" y="346" font-size="10" fill="#444">③ 选最快的 config</text>
  <text x="620" y="368" font-size="10" fill="#b03a3a" font-style="italic">首次慢（试 N 个 config）</text>

  <!-- Arrow down from miss box to select best -->
  <path d="M 740 380 L 740 398" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>

  <!-- Select best + cache box -->
  <g filter="url(#sk2)">
    <rect x="600" y="402" width="280" height="64" rx="8" fill="#fff3cf" stroke="#e8a838" stroke-width="1.4"/>
  </g>
  <text x="740" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">选最优 + 按 key 缓存</text>
  <text x="740" y="442" text-anchor="middle" font-size="10" fill="#444">cache[(M,N,K)] = best_config</text>
  <text x="740" y="458" text-anchor="middle" font-size="10" fill="#888" font-style="italic">下次同 shape → 命中左路</text>

  <!-- Merge arrows to launch (both flow downward, no overlap) -->
  <path d="M 200 380 L 200 517 L 368 517" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <path d="M 740 466 L 740 517 L 572 517" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>

  <!-- Launch box -->
  <g filter="url(#sk2)">
    <rect x="370" y="495" width="200" height="44" rx="8" fill="#4a8edb" stroke="#3a3a3a" stroke-width="1.6" opacity="0.7"/>
  </g>
  <text x="470" y="522" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">launch kernel[grid]</text>

  <!-- Params explanation -->
  <g filter="url(#sk2)">
    <rect x="40" y="565" width="860" height="68" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="60" y="587" font-size="11" font-weight="bold" fill="#1b5e8c">Config 三参数含义</text>
  <text x="60" y="605" font-size="10" fill="#444">BLOCK_SIZE_* : tile 大小，决定算力/访存比（典型 32/64/128/256）</text>
  <text x="60" y="621" font-size="10" fill="#444">num_warps : 每 program 的 warp 数（= CUDA blockDim.x/32，典型 4/8/16）</text>
  <text x="60" y="637" font-size="10" fill="#444">num_stages : 软件流水线深度（double buffering 自动版，典型 2/3/4，越大越耗寄存器）</text>

  <!-- Key takeaways -->
  <g filter="url(#sk2)">
    <rect x="40" y="650" width="860" height="66" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="672" font-size="11" font-weight="bold" fill="#2b2b2b">key 参数设计原则</text>
  <text x="60" y="690" font-size="10" fill="#444">放入 key：shape / 维度等影响 tiling 决策的参数（如 M,N,K）—— 变化时需重新选最优 config</text>
  <text x="60" y="706" font-size="10" fill="#b03a3a">不放 key：batch 步长 / 指针地址等不影响 tiling 的参数 —— 否则频繁触发重编译，缓存爆炸</text>
</svg>
