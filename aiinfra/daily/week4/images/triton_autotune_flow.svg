<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Triton @triton.autotune：配置搜索与缓存流程</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- Configs panel -->
  <text x="470" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">多套 Config（BLOCK_SIZE / num_warps / num_stages）</text>
  <g filter="url(#sk2)">
    <rect x="80" y="88" width="780" height="64" rx="8" fill="#f4f0e6" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <g font-size="9" fill="#2b2b2b">
    <g filter="url(#sk2)"><rect x="100" y="100" width="170" height="40" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="110" y="116" font-size="9" font-weight="bold">config 0</text><text x="110" y="130" font-size="9">BM64 BN64 BK32</text><text x="110" y="142" font-size="9">warps=4 stages=3</text></g>
    <g filter="url(#sk2)"><rect x="290" y="100" width="170" height="40" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="300" y="116" font-size="9" font-weight="bold">config 1</text><text x="300" y="130" font-size="9">BM128 BN64 BK32</text><text x="300" y="142" font-size="9">warps=4 stages=3</text></g>
    <g filter="url(#sk2)"><rect x="480" y="100" width="170" height="40" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="490" y="116" font-size="9" font-weight="bold">config 2</text><text x="490" y="130" font-size="9">BM128 BN128 BK32</text><text x="490" y="142" font-size="9">warps=8 stages=3</text></g>
    <g filter="url(#sk2)"><rect x="670" y="100" width="170" height="40" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="0.8"/><text x="680" y="116" font-size="9" font-weight="bold">config 3</text><text x="680" y="130" font-size="9">BM128 BN64 BK64</text><text x="680" y="142" font-size="9">warps=4 stages=4</text></g>
  </g>

  <!-- Decision diamond -->
  <path d="M 470 168 L 470 186" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <g filter="url(#sk2)">
    <path d="M 470 190 L 560 230 L 470 270 L 380 230 Z" fill="#fff3cf" stroke="#e8a838" stroke-width="1.6"/>
  </g>
  <text x="470" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">key=(M,N,K)</text>
  <text x="470" y="242" text-anchor="middle" font-size="10" fill="#444">查缓存？</text>

  <!-- Left branch: cache hit -->
  <path d="M 380 230 L 200 230 L 200 290" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <text x="290" y="222" text-anchor="middle" font-size="10" fill="#2e7d4f" font-weight="bold">命中 ✓</text>
  <g filter="url(#sk2)">
    <rect x="60" y="294" width="280" height="110" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.4"/>
  </g>
  <text x="200" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d4f">后续调用：直接用最优 config</text>
  <text x="80" y="338" font-size="10" fill="#444">① 按 key 查缓存表</text>
  <text x="80" y="354" font-size="10" fill="#444">② 取出已选最优 config</text>
  <text x="80" y="370" font-size="10" fill="#444">③ 直接 launch（零搜索开销）</text>
  <text x="80" y="392" font-size="10" fill="#2e7d4f" font-style="italic">之后零调优成本</text>

  <!-- Right branch: cache miss -->
  <path d="M 560 230 L 740 230 L 740 290" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <text x="650" y="222" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">未命中 ✗（首次/shape 变）</text>
  <g filter="url(#sk2)">
    <rect x="600" y="294" width="280" height="110" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="740" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">首次调用：试所有 config</text>
  <text x="620" y="338" font-size="10" fill="#444">① 对每个 config 各跑一次</text>
  <text x="620" y="354" font-size="10" fill="#444">② 测量 kernel 时间</text>
  <text x="620" y="370" font-size="10" fill="#444">③ 选最快的 config</text>
  <text x="620" y="392" font-size="10" fill="#b03a3a" font-style="italic">首次慢（试 N 个 config）</text>

  <!-- measure arrows -->
  <path d="M 740 408 L 740 426" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <g filter="url(#sk2)">
    <rect x="600" y="430" width="280" height="56" rx="8" fill="#fff3cf" stroke="#e8a838" stroke-width="1.4"/>
  </g>
  <text x="740" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">选最优 + 按 key 缓存</text>
  <text x="740" y="470" text-anchor="middle" font-size="10" fill="#444">cache[(M,N,K)] = best_config</text>
  <text x="740" y="484" text-anchor="middle" font-size="10" fill="#888" font-style="italic">下次同 shape 直接命中左路</text>

  <!-- merge arrow to launch -->
  <path d="M 200 404 L 200 458 L 460 458" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>
  <path d="M 740 488 L 740 458 L 480 458" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar3)"/>

  <!-- launch -->
  <g filter="url(#sk2)">
    <rect x="380" y="440" width="180" height="40" rx="8" fill="#4a8edb" stroke="#3a3a3a" stroke-width="1.6" opacity="0.7"/>
  </g>
  <text x="470" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">launch kernel[grid]</text>

  <!-- params explanation -->
  <g filter="url(#sk2)">
    <rect x="40" y="500" width="860" height="68" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="60" y="522" font-size="11" font-weight="bold" fill="#1b5e8c">Config 三参数含义</text>
  <text x="60" y="540" font-size="10" fill="#444">BLOCK_SIZE_* : tile 大小，决定算力/访存比（典型 32/64/128/256）</text>
  <text x="60" y="556" font-size="10" fill="#444">num_warps : 每 program 的 warp 数（= CUDA blockDim.x/32，典型 4/8/16）</text>
  <text x="60" y="572" font-size="10" fill="#444">num_stages : 软件流水线深度（double buffering 自动版，典型 2/3/4，越大越耗寄存器）</text>

  <!-- key takeaways -->
  <g filter="url(#sk2)">
    <rect x="40" y="582" width="860" height="66" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="60" y="604" font-size="11" font-weight="bold" fill="#2b2b2b">key 参数设计原则</text>
    <text x="60" y="622" font-size="10" fill="#444">放入 key：shape / 维度等影响 tiling 决策的参数（如 M,N,K）—— 变化时需重新选最优 config</text>
    <text x="60" y="638" font-size="10" fill="#b03a3a">不放 key：batch 步长 / 指针地址等不影响 tiling 的参数 —— 否则频繁触发重编译，缓存爆炸</text>
  </g>
</svg>
