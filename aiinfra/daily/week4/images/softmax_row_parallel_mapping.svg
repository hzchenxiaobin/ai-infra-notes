<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="580" fill="#fdfcf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Row-wise 并行映射：一个 Block 处理一行</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- Left: Matrix (M, D) -->
  <text x="170" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">输入矩阵 shape: (M, D)</text>
  <g filter="url(#sk2)">
    <rect x="60" y="92" width="220" height="300" rx="8" fill="#f4f0e6" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <!-- matrix rows -->
  <g font-size="10" fill="#2b2b2b">
    <g filter="url(#sk2)">
      <rect x="80" y="108" width="180" height="28" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="1"/>
      <text x="170" y="126" text-anchor="middle">row 0：x[0][0..D-1]</text>
    </g>
    <g filter="url(#sk2)">
      <rect x="80" y="142" width="180" height="28" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="1"/>
      <text x="170" y="160" text-anchor="middle">row 1：x[1][0..D-1]</text>
    </g>
    <g filter="url(#sk2)">
      <rect x="80" y="176" width="180" height="28" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="1"/>
      <text x="170" y="194" text-anchor="middle">row 2：x[2][0..D-1]</text>
    </g>
    <text x="170" y="222" text-anchor="middle" font-size="14" fill="#888">...</text>
    <g filter="url(#sk2)">
      <rect x="80" y="234" width="180" height="28" rx="4" fill="#dbeaf6" stroke="#4a8edb" stroke-width="1"/>
      <text x="170" y="252" text-anchor="middle">row M-1</text>
    </g>
  </g>
  <text x="170" y="288" text-anchor="middle" font-size="9" fill="#888" font-style="italic">M 行，每行 D 个元素</text>
  <text x="170" y="304" text-anchor="middle" font-size="9" fill="#888" font-style="italic">跨行无依赖</text>

  <!-- Arrows: each row → one block -->
  <path d="M 280 122 L 380 122" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar3)"/>
  <path d="M 280 156 L 380 156" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar3)"/>
  <path d="M 280 190 L 380 190" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar3)"/>
  <path d="M 280 248 L 380 248" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar3)"/>
  <text x="330" y="110" text-anchor="middle" font-size="9" fill="#888" font-style="italic">blockIdx.x</text>
  <text x="330" y="100" text-anchor="middle" font-size="9" fill="#888" font-style="italic">= row index</text>

  <!-- Right: Blocks -->
  <text x="560" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">Block 级并行（gridDim.x = M）</text>

  <!-- Block 0 -->
  <g filter="url(#sk2)">
    <rect x="390" y="92" width="490" height="72" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.4"/>
  </g>
  <text x="400" y="110" font-size="10" font-weight="bold" fill="#2b2b2b">Block 0 (blockIdx.x=0)</text>
  <text x="400" y="126" font-size="9" fill="#444">blockDim.x = 256/512（≥ D 处理能力）</text>
  <g font-size="8" fill="#2b2b2b">
    <rect x="400" y="134" width="140" height="18" rx="3" fill="#4a8edb" opacity="0.5" stroke="#4a8edb" stroke-width="0.8"/>
    <text x="470" y="147" text-anchor="middle">Step1: blockReduceMax</text>
    <rect x="552" y="134" width="150" height="18" rx="3" fill="#e8a838" opacity="0.5" stroke="#e8a838" stroke-width="0.8"/>
    <text x="627" y="147" text-anchor="middle">Step2: blockReduceSum</text>
    <rect x="714" y="134" width="150" height="18" rx="3" fill="#e57373" opacity="0.5" stroke="#e57373" stroke-width="0.8"/>
    <text x="789" y="147" text-anchor="middle">Step3: 归一化写出</text>
  </g>

  <!-- Block 1 -->
  <g filter="url(#sk2)">
    <rect x="390" y="174" width="490" height="44" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.2" opacity="0.7"/>
  </g>
  <text x="400" y="192" font-size="10" font-weight="bold" fill="#2b2b2b">Block 1 (blockIdx.x=1)</text>
  <text x="400" y="208" font-size="9" fill="#888">同样的三步：max → sum → normalize</text>

  <!-- Block 2 -->
  <g filter="url(#sk2)">
    <rect x="390" y="226" width="490" height="44" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.2" opacity="0.7"/>
  </g>
  <text x="400" y="244" font-size="10" font-weight="bold" fill="#2b2b2b">Block 2 (blockIdx.x=2)</text>
  <text x="400" y="260" font-size="9" fill="#888">同样的三步：max → sum → normalize</text>

  <text x="635" y="292" text-anchor="middle" font-size="14" fill="#888">...</text>

  <!-- Block M-1 -->
  <g filter="url(#sk2)">
    <rect x="390" y="304" width="490" height="44" rx="8" fill="#eaf6ee" stroke="#2e7d4f" stroke-width="1.2" opacity="0.7"/>
  </g>
  <text x="400" y="322" font-size="10" font-weight="bold" fill="#2b2b2b">Block M-1 (blockIdx.x=M-1)</text>
  <text x="400" y="338" font-size="9" fill="#888">同样的三步：max → sum → normalize</text>

  <!-- Bottom: why one block per row -->
  <g filter="url(#sk2)">
    <rect x="40" y="370" width="840" height="90" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="60" y="392" font-size="12" font-weight="bold" fill="#2b2b2b">为什么一个 block 处理一行？</text>
    <text x="60" y="412" font-size="11" fill="#444">① softmax 分母 Σexp(xj-m) 需要本行所有元素参与 reduce，跨行无依赖</text>
    <text x="60" y="430" font-size="11" fill="#444">② 一行放在一个 block 内 → shared memory + __syncthreads 高效协作，无需跨 block 通信</text>
    <text x="60" y="448" font-size="11" fill="#2e7d4f">③ blockReduceMax / blockReduceSum 复用 Week2 的 warp shuffle 两级结构</text>
  </g>

  <!-- HBM read annotation -->
  <g filter="url(#sk2)">
    <rect x="40" y="490" width="840" height="70" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="60" y="512" font-size="12" font-weight="bold" fill="#b03a3a">每个 Block 内的三步（三遍扫描）</text>
    <text x="60" y="532" font-size="11" fill="#444">Step 1: 所有线程协作求本行 max（block reduce max）  ← 读 HBM: D×4B</text>
    <text x="60" y="548" font-size="11" fill="#444">Step 2: 所有线程协作求本行 sum(exp(x-max))（block reduce sum）  ← 读 HBM: D×4B</text>
    <text x="60" y="564" font-size="11" fill="#444">Step 3: 所有线程协作做归一化写出  ← 读 HBM + 写 HBM</text>
  </g>
</svg>
