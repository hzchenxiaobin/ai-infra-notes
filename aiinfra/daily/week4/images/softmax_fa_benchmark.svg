<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="820" fill="#fdfcf7"/>

  <!-- ===== Title ===== -->
  <text x="460" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Softmax + FlashAttention 三方 Benchmark</text>
  <text x="460" y="48" text-anchor="middle" font-size="12" fill="#666">RTX 5090 · 预估口径（待实测回填）</text>
  <path d="M 280 54 Q 460 62 640 54" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Section 1: Softmax (FP32) ============ -->
  <text x="460" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">Softmax Benchmark (FP32)</text>

  <!-- Y-axis -->
  <path d="M 120 350 L 120 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="62" y="225" font-size="11" fill="#444" transform="rotate(-90 62 225)">延迟 (ms, 对数轴)</text>
  <!-- grid -->
  <path d="M 120 300 L 700 300" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="112" y="304" text-anchor="end" font-size="9" fill="#999">0.01</text>
  <path d="M 120 200 L 700 200" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="112" y="204" text-anchor="end" font-size="9" fill="#999">0.1</text>
  <!-- X-axis -->
  <path d="M 120 350 L 720 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="420" text-anchor="middle" font-size="11" fill="#444">M × D</text>

  <!-- Group 1: 1024×1024 -->
  <text x="220" y="368" text-anchor="middle" font-size="10" fill="#2b2b2b" font-weight="bold">1024×1024</text>
  <g filter="url(#sk)"><rect x="176" y="278" width="28" height="72" fill="#4a8edb" opacity="0.65" stroke="#2b6e9e" stroke-width="1.3"/></g>
  <text x="190" y="272" text-anchor="middle" font-size="8" fill="#1b5e8c">0.008</text>
  <g filter="url(#sk)"><rect x="208" y="260" width="28" height="90" fill="#e8a838" opacity="0.65" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="222" y="254" text-anchor="middle" font-size="8" fill="#c98a2b">0.012</text>
  <g filter="url(#sk)"><rect x="240" y="308" width="28" height="42" fill="#4a8e4a" opacity="0.65" stroke="#2e6e2e" stroke-width="1.3"/></g>
  <text x="254" y="302" text-anchor="middle" font-size="8" fill="#2e6e2e">0.004</text>
  <text x="220" y="386" text-anchor="middle" font-size="9" fill="#b03a3a" font-weight="bold">0.50x</text>

  <!-- Group 2: 4096×1024 -->
  <text x="380" y="368" text-anchor="middle" font-size="10" fill="#2b2b2b" font-weight="bold">4096×1024</text>
  <g filter="url(#sk)"><rect x="336" y="278" width="28" height="72" fill="#4a8edb" opacity="0.65" stroke="#2b6e9e" stroke-width="1.3"/></g>
  <text x="350" y="272" text-anchor="middle" font-size="8" fill="#1b5e8c">0.008</text>
  <g filter="url(#sk)"><rect x="368" y="238" width="28" height="112" fill="#e8a838" opacity="0.65" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="382" y="232" text-anchor="middle" font-size="8" fill="#c98a2b">0.020</text>
  <g filter="url(#sk)"><rect x="400" y="278" width="28" height="72" fill="#4a8e4a" opacity="0.65" stroke="#2e6e2e" stroke-width="1.3"/></g>
  <text x="414" y="272" text-anchor="middle" font-size="8" fill="#2e6e2e">0.008</text>
  <text x="380" y="386" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">1.00x</text>

  <!-- Group 3: 4096×4096 -->
  <text x="540" y="368" text-anchor="middle" font-size="10" fill="#2b2b2b" font-weight="bold">4096×4096</text>
  <g filter="url(#sk)"><rect x="496" y="182" width="28" height="168" fill="#4a8edb" opacity="0.65" stroke="#2b6e9e" stroke-width="1.3"/></g>
  <text x="510" y="176" text-anchor="middle" font-size="8" fill="#1b5e8c">0.072</text>
  <g filter="url(#sk)"><rect x="528" y="178" width="28" height="172" fill="#e8a838" opacity="0.65" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="542" y="172" text-anchor="middle" font-size="8" fill="#c98a2b">0.080</text>
  <g filter="url(#sk)"><rect x="560" y="182" width="28" height="168" fill="#4a8e4a" opacity="0.65" stroke="#2e6e2e" stroke-width="1.3"/></g>
  <text x="574" y="176" text-anchor="middle" font-size="8" fill="#2e6e2e">0.073</text>
  <text x="540" y="386" text-anchor="middle" font-size="9" fill="#2e7d4f" font-weight="bold">1.01x</text>

  <!-- Softmax legend + note -->
  <g filter="url(#sk)"><rect x="730" y="110" width="14" height="14" fill="#4a8edb" opacity="0.65" stroke="#2b6e9e" stroke-width="1.2"/></g>
  <text x="750" y="122" font-size="10" fill="#2b2b2b">Triton</text>
  <g filter="url(#sk)"><rect x="730" y="132" width="14" height="14" fill="#e8a838" opacity="0.65" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="750" y="144" font-size="10" fill="#2b2b2b">手写 CUDA</text>
  <g filter="url(#sk)"><rect x="730" y="154" width="14" height="14" fill="#4a8e4a" opacity="0.65" stroke="#2e6e2e" stroke-width="1.2"/></g>
  <text x="750" y="166" font-size="10" fill="#2b2b2b">PyTorch</text>
  <path d="M 730 182 L 800 182" stroke="#d4d4d4" stroke-width="0.8" filter="url(#sk)"/>
  <text x="730" y="198" font-size="9" fill="#666">标注 = PyTorch/Triton</text>
  <text x="730" y="212" font-size="8" fill="#999">&lt;1: Triton 更慢</text>
  <text x="730" y="226" font-size="8" fill="#999">&gt;1: Triton 更快</text>

  <!-- Softmax note -->
  <g filter="url(#sk)"><rect x="60" y="398" width="800" height="34" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="80" y="418" font-size="10" fill="#444">Triton Softmax 大矩阵与 PyTorch 持平（1.01x），小矩阵更慢（0.50x）——memory-bound 算子上 Triton 无明显优势。max_diff ~1e-9</text>

  <!-- ============ Section 2: FlashAttention (causal, FP16) ============ -->
  <text x="460" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">FlashAttention Benchmark (causal, FP16)</text>

  <!-- Y-axis -->
  <path d="M 120 690 L 120 470" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="62" y="580" font-size="11" fill="#444" transform="rotate(-90 62 580)">延迟 (ms, 对数轴)</text>
  <!-- grid -->
  <path d="M 120 640 L 700 640" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="112" y="644" text-anchor="end" font-size="9" fill="#999">1</text>
  <path d="M 120 540 L 700 540" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="112" y="544" text-anchor="end" font-size="9" fill="#999">10</text>
  <!-- X-axis -->
  <path d="M 120 690 L 720 690" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="760" text-anchor="middle" font-size="11" fill="#444">N (d=64)</text>

  <!-- Group 1: N=2048 -->
  <text x="220" y="708" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">2048</text>
  <g filter="url(#sk)"><rect x="176" y="638" width="28" height="52" fill="#4a8edb" opacity="0.65" stroke="#2b6e9e" stroke-width="1.3"/></g>
  <text x="190" y="632" text-anchor="middle" font-size="8" fill="#1b5e8c">0.50</text>
  <g filter="url(#sk)"><rect x="208" y="582" width="28" height="108" fill="#b03a3a" opacity="0.55" stroke="#8a2a2a" stroke-width="1.3"/></g>
  <text x="222" y="576" text-anchor="middle" font-size="8" fill="#8a2a2a">1.80</text>
  <g filter="url(#sk)"><rect x="240" y="648" width="28" height="42" fill="#4a8e4a" opacity="0.65" stroke="#2e6e2e" stroke-width="1.3"/></g>
  <text x="254" y="642" text-anchor="middle" font-size="8" fill="#2e6e2e">0.40</text>
  <text x="220" y="726" text-anchor="middle" font-size="9" fill="#b03a3a" font-weight="bold">80%</text>

  <!-- Group 2: N=4096 -->
  <text x="380" y="708" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">4096</text>
  <g filter="url(#sk)"><rect x="336" y="582" width="28" height="108" fill="#4a8edb" opacity="0.65" stroke="#2b6e9e" stroke-width="1.3"/></g>
  <text x="350" y="576" text-anchor="middle" font-size="8" fill="#1b5e8c">1.80</text>
  <g filter="url(#sk)"><rect x="368" y="468" width="28" height="222" fill="#b03a3a" opacity="0.55" stroke="#8a2a2a" stroke-width="1.3"/></g>
  <text x="382" y="462" text-anchor="middle" font-size="8" fill="#8a2a2a">6.50</text>
  <g filter="url(#sk)"><rect x="400" y="590" width="28" height="100" fill="#4a8e4a" opacity="0.65" stroke="#2e6e2e" stroke-width="1.3"/></g>
  <text x="414" y="584" text-anchor="middle" font-size="8" fill="#2e6e2e">1.50</text>
  <text x="380" y="726" text-anchor="middle" font-size="9" fill="#b03a3a" font-weight="bold">83%</text>

  <!-- Group 3: N=8192 -->
  <text x="540" y="708" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">8192</text>
  <g filter="url(#sk)"><rect x="496" y="523" width="28" height="167" fill="#4a8edb" opacity="0.65" stroke="#2b6e9e" stroke-width="1.3"/></g>
  <text x="510" y="517" text-anchor="middle" font-size="8" fill="#1b5e8c">7.00</text>
  <g filter="url(#sk)"><rect x="528" y="468" width="28" height="222" fill="#b03a3a" opacity="0.55" stroke="#8a2a2a" stroke-width="1.3"/></g>
  <text x="542" y="462" text-anchor="middle" font-size="8" fill="#8a2a2a">25.0</text>
  <g filter="url(#sk)"><rect x="560" y="530" width="28" height="160" fill="#4a8e4a" opacity="0.65" stroke="#2e6e2e" stroke-width="1.3"/></g>
  <text x="574" y="524" text-anchor="middle" font-size="8" fill="#2e6e2e">6.00</text>
  <text x="540" y="726" text-anchor="middle" font-size="9" fill="#2e7d4f" font-weight="bold">86%</text>

  <!-- FA legend -->
  <g filter="url(#sk)"><rect x="730" y="480" width="14" height="14" fill="#4a8edb" opacity="0.65" stroke="#2b6e9e" stroke-width="1.2"/></g>
  <text x="750" y="492" font-size="10" fill="#2b2b2b">Triton FA</text>
  <text x="750" y="504" font-size="8" fill="#999">~40 行</text>
  <g filter="url(#sk)"><rect x="730" y="514" width="14" height="14" fill="#b03a3a" opacity="0.55" stroke="#8a2a2a" stroke-width="1.2"/></g>
  <text x="750" y="526" font-size="10" fill="#2b2b2b">naive attention</text>
  <text x="750" y="538" font-size="8" fill="#999">物化 S/P</text>
  <g filter="url(#sk)"><rect x="730" y="548" width="14" height="14" fill="#4a8e4a" opacity="0.65" stroke="#2e6e2e" stroke-width="1.2"/></g>
  <text x="750" y="560" font-size="10" fill="#2b2b2b">官方 FA</text>
  <text x="750" y="572" font-size="8" fill="#999">CUDA ~300 行</text>
  <path d="M 730 584 L 800 584" stroke="#d4d4d4" stroke-width="0.8" filter="url(#sk)"/>
  <text x="730" y="600" font-size="9" fill="#666">标注 = Triton%官方</text>

  <!-- FA note -->
  <g filter="url(#sk)"><rect x="60" y="738" width="800" height="68" rx="8" fill="#fffdf3" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="80" y="760" font-size="11" font-weight="bold" fill="#2b2b2b">关键发现</text>
  <text x="80" y="778" font-size="10" fill="#2e7d4f">✓ Triton FA 达官方 CUDA 版 80–86%，核心逻辑 ~40 行 vs CUDA ~300 行——Triton 的"甜区"</text>
  <text x="80" y="794" font-size="10" fill="#b03a3a">✗ naive attention 物化 S/P 矩阵，O(N²) IO 开销巨大（N=8192 时 25ms vs Triton 7ms）</text>
  <text x="80" y="810" font-size="10" fill="#1b5e8c">注：CUDA 手写 FA 的对比见 Week 5 Day 3；naive 列为标准注意力（非 CUDA 手写 FA）</text>
</svg>
