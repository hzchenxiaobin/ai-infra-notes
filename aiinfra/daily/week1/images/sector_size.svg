<svg xmlns="http://www.w3.org/2000/svg" width="680" height="345" viewBox="0 0 680 345" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','KaiTi','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <pattern id="wasteHatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#8b949e" opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8b949e" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>
  <g filter="url(#sketch)">
  <rect width="680" height="345" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Sector：显存搬运的最小单位（32 字节）</text>

  <!-- L2 sector -->
  <text x="60" y="66" font-size="13" font-weight="bold" fill="#6ab0ff">L2 Cache 最小搬运粒度 &#8212;&#8212; sector</text>
  <rect x="60" y="78" width="288" height="52" rx="5" fill="#6ab0ff" opacity="0.18" stroke="#6ab0ff" stroke-width="2"/>
  <rect x="63" y="84" width="34" height="40" fill="#fdfcf7" opacity="0.4" stroke="#6ab0ff" stroke-width="1"/><text x="80" y="108" text-anchor="middle" font-size="9.5" fill="#2b2b2b">4B</text>
  <rect x="97" y="84" width="34" height="40" fill="#fdfcf7" opacity="0.4" stroke="#6ab0ff" stroke-width="1"/><text x="114" y="108" text-anchor="middle" font-size="9.5" fill="#2b2b2b">4B</text>
  <rect x="131" y="84" width="34" height="40" fill="#fdfcf7" opacity="0.4" stroke="#6ab0ff" stroke-width="1"/><text x="148" y="108" text-anchor="middle" font-size="9.5" fill="#2b2b2b">4B</text>
  <rect x="165" y="84" width="34" height="40" fill="#fdfcf7" opacity="0.4" stroke="#6ab0ff" stroke-width="1"/><text x="182" y="108" text-anchor="middle" font-size="9.5" fill="#2b2b2b">4B</text>
  <rect x="199" y="84" width="34" height="40" fill="#fdfcf7" opacity="0.4" stroke="#6ab0ff" stroke-width="1"/><text x="216" y="108" text-anchor="middle" font-size="9.5" fill="#2b2b2b">4B</text>
  <rect x="233" y="84" width="34" height="40" fill="#fdfcf7" opacity="0.4" stroke="#6ab0ff" stroke-width="1"/><text x="250" y="108" text-anchor="middle" font-size="9.5" fill="#2b2b2b">4B</text>
  <rect x="267" y="84" width="34" height="40" fill="#fdfcf7" opacity="0.4" stroke="#6ab0ff" stroke-width="1"/><text x="284" y="108" text-anchor="middle" font-size="9.5" fill="#2b2b2b">4B</text>
  <rect x="301" y="84" width="34" height="40" fill="#fdfcf7" opacity="0.4" stroke="#6ab0ff" stroke-width="1"/><text x="318" y="108" text-anchor="middle" font-size="9.5" fill="#2b2b2b">4B</text>
  <text x="368" y="102" font-size="13" font-weight="bold" fill="#6ab0ff">= 32 字节</text>
  <text x="368" y="120" font-size="11" fill="#666666">恰好装 8 个 float（FP32）</text>

  <!-- L1 cache line -->
  <text x="60" y="152" font-size="13" font-weight="bold" fill="#5cb86c">L1 Cache line = 4 个 sector</text>
  <rect x="54" y="160" width="300" height="56" rx="6" fill="none" stroke="#5cb86c" stroke-width="2" stroke-dasharray="7,4"/>
  <rect x="62" y="168" width="66" height="40" rx="3" fill="#5cb86c" opacity="0.2" stroke="#5cb86c" stroke-width="1.5"/><text x="95" y="192" text-anchor="middle" font-size="11" fill="#2b2b2b">32B</text>
  <rect x="132" y="168" width="66" height="40" rx="3" fill="#5cb86c" opacity="0.2" stroke="#5cb86c" stroke-width="1.5"/><text x="165" y="192" text-anchor="middle" font-size="11" fill="#2b2b2b">32B</text>
  <rect x="202" y="168" width="66" height="40" rx="3" fill="#5cb86c" opacity="0.2" stroke="#5cb86c" stroke-width="1.5"/><text x="235" y="192" text-anchor="middle" font-size="11" fill="#2b2b2b">32B</text>
  <rect x="272" y="168" width="66" height="40" rx="3" fill="#5cb86c" opacity="0.2" stroke="#5cb86c" stroke-width="1.5"/><text x="305" y="192" text-anchor="middle" font-size="11" fill="#2b2b2b">32B</text>
  <text x="368" y="186" font-size="13" font-weight="bold" fill="#5cb86c">= 128 字节</text>
  <text x="368" y="204" font-size="11" fill="#666666">32B &#215; 4，硬件固定，程序员无法改变</text>

  <!-- truck analogy chip -->
  <rect x="60" y="238" width="280" height="88" rx="8" fill="#fffdf5" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="80" y="262" font-size="13" font-weight="bold" fill="#2b2b2b">&#128666; 运货卡车类比</text>
  <text x="80" y="286" font-size="11.5" fill="#2b2b2b">不管你寄多少货（哪怕 1 个字节）</text>
  <text x="80" y="304" font-size="11.5" fill="#2b2b2b">卡车一次至少拉 32 字节。</text>
  <text x="80" y="318" font-size="10" fill="#666666">运费按整车算，不按货物算</text>

  <!-- partial load chip -->
  <rect x="360" y="238" width="280" height="88" rx="8" fill="#fffdf5" stroke="#e57373" stroke-width="1.5"/>
  <text x="380" y="262" font-size="13" font-weight="bold" fill="#e57373">只读 1 个 float，也要搬整个 sector</text>
  <rect x="380" y="272" width="30" height="16" fill="#e57373" opacity="0.7" stroke="#d06060" stroke-width="1"/>
  <rect x="410" y="272" width="30" height="16" fill="url(#wasteHatch)" stroke="#8b949e" stroke-width="1"/>
  <rect x="440" y="272" width="30" height="16" fill="url(#wasteHatch)" stroke="#8b949e" stroke-width="1"/>
  <rect x="470" y="272" width="30" height="16" fill="url(#wasteHatch)" stroke="#8b949e" stroke-width="1"/>
  <rect x="500" y="272" width="30" height="16" fill="url(#wasteHatch)" stroke="#8b949e" stroke-width="1"/>
  <rect x="530" y="272" width="30" height="16" fill="url(#wasteHatch)" stroke="#8b949e" stroke-width="1"/>
  <rect x="560" y="272" width="30" height="16" fill="url(#wasteHatch)" stroke="#8b949e" stroke-width="1"/>
  <rect x="590" y="272" width="30" height="16" fill="url(#wasteHatch)" stroke="#8b949e" stroke-width="1"/>
  <text x="395" y="264" font-size="9" fill="#e57373" font-weight="bold">&#8592; 要的 4B</text>
  <text x="380" y="310" font-size="11.5" fill="#2b2b2b">有效载荷 4B / 32B = <tspan font-weight="bold" fill="#e57373">12.5%</tspan>，其余 28B 白搬</text>
  </g>
</svg>
