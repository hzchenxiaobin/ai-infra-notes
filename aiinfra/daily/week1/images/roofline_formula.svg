<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="260" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Roofline 核心公式</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主公式 -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="780" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="84" font-size="12" fill="#2b6e9e" font-weight="bold">可达到的算力</text>
  <text x="60" y="106" font-size="15" fill="#2b2b2b" font-family="monospace">Attainable FLOP/s = min(Peak FLOP/s, AI × Peak Bandwidth)</text>

  <!-- 两个天花板 -->
  <g filter="url(#sk)">
    <rect x="40" y="128" width="380" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="150" font-size="12" fill="#2e6e2e" font-weight="bold">Memory Bandwidth 天花板（斜线）</text>
  <text x="60" y="172" font-size="13" fill="#2b2b2b" font-family="monospace">Achievable = AI × Peak Bandwidth</text>

  <g filter="url(#sk)">
    <rect x="440" y="128" width="380" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="460" y="150" font-size="12" fill="#7a5415" font-weight="bold">Peak Compute 天花板（水平）</text>
  <text x="460" y="172" font-size="13" fill="#2b2b2b" font-family="monospace">Achievable = Peak FLOP/s</text>

  <!-- 底部备注 -->
  <g filter="url(#sk)">
    <rect x="40" y="198" width="780" height="46" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.3"/>
  </g>
  <text x="430" y="226" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">取两者较小值 —— 瓶颈由"喂不饱"的那一侧决定</text>
</svg>
