<svg xmlns="http://www.w3.org/2000/svg" width="760" height="495" viewBox="0 0 760 495" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','KaiTi','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e57373"/>
    </marker>
  </defs>
  <g filter="url(#sketch)">
  <rect width="760" height="495" fill="#fdfcf7"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">矩阵转置：读按行 &#10003;，写按列 &#10007;</text>

  <!-- input matrix -->
  <text x="184" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#6ab0ff">Input A（行优先，4&#215;4）</text>
  <text x="106" y="86" text-anchor="middle" font-size="9" fill="#666666">j=0</text>
  <text x="158" y="86" text-anchor="middle" font-size="9" fill="#666666">1</text>
  <text x="210" y="86" text-anchor="middle" font-size="9" fill="#666666">2</text>
  <text x="262" y="86" text-anchor="middle" font-size="9" fill="#666666">3</text>
  <text x="72" y="116" text-anchor="end" font-size="9" fill="#666666">i=0</text>
  <text x="72" y="168" text-anchor="end" font-size="9" fill="#666666">1</text>
  <text x="72" y="220" text-anchor="end" font-size="9" fill="#666666">2</text>
  <text x="72" y="272" text-anchor="end" font-size="9" fill="#666666">3</text>

  <rect x="80" y="90" width="208" height="52" fill="#4a8edb" opacity="0.3"/>
  <rect x="80" y="90" width="208" height="208" fill="none" stroke="#6ab0ff" stroke-width="2"/>
  <line x1="132" y1="90" x2="132" y2="298" stroke="#6ab0ff" stroke-width="1"/>
  <line x1="184" y1="90" x2="184" y2="298" stroke="#6ab0ff" stroke-width="1"/>
  <line x1="236" y1="90" x2="236" y2="298" stroke="#6ab0ff" stroke-width="1"/>
  <line x1="80" y1="142" x2="288" y2="142" stroke="#6ab0ff" stroke-width="1"/>
  <line x1="80" y1="194" x2="288" y2="194" stroke="#6ab0ff" stroke-width="1"/>
  <line x1="80" y1="246" x2="288" y2="246" stroke="#6ab0ff" stroke-width="1"/>

  <text x="106" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="158" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="210" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="262" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="106" y="130" text-anchor="middle" font-size="9" fill="#666666">+0B</text>
  <text x="158" y="130" text-anchor="middle" font-size="9" fill="#666666">+4B</text>
  <text x="210" y="130" text-anchor="middle" font-size="9" fill="#666666">+8B</text>
  <text x="262" y="130" text-anchor="middle" font-size="9" fill="#666666">+12B</text>

  <text x="106" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b">5</text>
  <text x="158" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b">6</text>
  <text x="210" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b">7</text>
  <text x="262" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b">8</text>
  <text x="106" y="216" text-anchor="middle" font-size="13" fill="#2b2b2b">9</text>
  <text x="158" y="216" text-anchor="middle" font-size="13" fill="#2b2b2b">10</text>
  <text x="210" y="216" text-anchor="middle" font-size="13" fill="#2b2b2b">11</text>
  <text x="262" y="216" text-anchor="middle" font-size="13" fill="#2b2b2b">12</text>
  <text x="106" y="268" text-anchor="middle" font-size="13" fill="#2b2b2b">13</text>
  <text x="158" y="268" text-anchor="middle" font-size="13" fill="#2b2b2b">14</text>
  <text x="210" y="268" text-anchor="middle" font-size="13" fill="#2b2b2b">15</text>
  <text x="262" y="268" text-anchor="middle" font-size="13" fill="#2b2b2b">16</text>

  <text x="184" y="326" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">warp 读第 0 行：地址 +0B、+4B、+8B、+12B</text>
  <text x="184" y="344" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">连续 &#8594; coalesced read &#10003;</text>

  <!-- middle: transpose code + arrow -->
  <text x="392" y="146" text-anchor="middle" font-family="monospace" font-size="11" fill="#2b2b2b">out[x*height + y]</text>
  <text x="392" y="162" text-anchor="middle" font-family="monospace" font-size="11" fill="#2b2b2b"> = in[y*width + x]</text>
  <line x1="330" y1="186" x2="470" y2="186" stroke="#666666" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="400" y="212" text-anchor="middle" font-size="12" fill="#666666">转置</text>

  <!-- output matrix -->
  <text x="594" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#5cb86c">Output A&#7488;（行优先，4&#215;4）</text>
  <text x="516" y="86" text-anchor="middle" font-size="9" fill="#666666">j=0</text>
  <text x="568" y="86" text-anchor="middle" font-size="9" fill="#666666">1</text>
  <text x="620" y="86" text-anchor="middle" font-size="9" fill="#666666">2</text>
  <text x="672" y="86" text-anchor="middle" font-size="9" fill="#666666">3</text>
  <text x="482" y="116" text-anchor="end" font-size="9" fill="#666666">i=0</text>
  <text x="482" y="168" text-anchor="end" font-size="9" fill="#666666">1</text>
  <text x="482" y="220" text-anchor="end" font-size="9" fill="#666666">2</text>
  <text x="482" y="272" text-anchor="end" font-size="9" fill="#666666">3</text>

  <rect x="490" y="90" width="52" height="208" fill="#e57373" opacity="0.22"/>
  <rect x="490" y="90" width="208" height="208" fill="none" stroke="#5cb86c" stroke-width="2"/>
  <line x1="542" y1="90" x2="542" y2="298" stroke="#5cb86c" stroke-width="1"/>
  <line x1="594" y1="90" x2="594" y2="298" stroke="#5cb86c" stroke-width="1"/>
  <line x1="646" y1="90" x2="646" y2="298" stroke="#5cb86c" stroke-width="1"/>
  <line x1="490" y1="142" x2="698" y2="142" stroke="#5cb86c" stroke-width="1"/>
  <line x1="490" y1="194" x2="698" y2="194" stroke="#5cb86c" stroke-width="1"/>
  <line x1="490" y1="246" x2="698" y2="246" stroke="#5cb86c" stroke-width="1"/>

  <text x="516" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="568" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="620" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">9</text>
  <text x="672" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">13</text>
  <text x="516" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="568" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">6</text>
  <text x="620" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">10</text>
  <text x="672" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">14</text>
  <text x="516" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="568" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">7</text>
  <text x="620" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">11</text>
  <text x="672" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">15</text>
  <text x="516" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="568" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">8</text>
  <text x="620" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">12</text>
  <text x="672" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">16</text>

  <text x="516" y="130" text-anchor="middle" font-size="9" fill="#666666">+0B</text>
  <text x="516" y="182" text-anchor="middle" font-size="9" fill="#666666">+16B</text>
  <text x="516" y="234" text-anchor="middle" font-size="9" fill="#666666">+32B</text>
  <text x="516" y="286" text-anchor="middle" font-size="9" fill="#666666">+48B</text>

  <line x1="516" y1="146" x2="516" y2="158" stroke="#e57373" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="516" y1="198" x2="516" y2="210" stroke="#e57373" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="516" y1="250" x2="516" y2="262" stroke="#e57373" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="594" y="326" text-anchor="middle" font-size="12" fill="#e57373" font-weight="bold">warp 写第 0 列：地址 +0B、+16B、+32B、+48B</text>
  <text x="594" y="344" text-anchor="middle" font-size="12" fill="#e57373" font-weight="bold">跳跃 &#8594; stride write &#10007;（每步跳 height&#215;4B）</text>

  <!-- bottom box -->
  <rect x="60" y="372" width="640" height="108" rx="9" fill="#fffdf5" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="380" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e57373">问题：naive 转置读是 coalesced（按行），写是 stride（按列）</text>
  <text x="380" y="422" text-anchor="middle" font-size="12" fill="#2b2b2b">写地址每次跳 height&#215;4 字节——一个 warp 的写散落在大量 sector，带宽利用率骤降</text>
  <text x="380" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5cb86c">解决：Shared Memory tile 中转——先按行读入 tile，再按行写出（Tiled 版本）</text>
  </g>
</svg>
