<svg xmlns="http://www.w3.org/2000/svg" width="760" height="990" viewBox="0 0 760 990" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a9d5f"/></marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/></marker>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e8a838"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e57373"/></marker>
  </defs>

  <g filter="url(#sketch)">

  <rect width="760" height="990" fill="#fdfcf7"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">Shared Memory 访问模式总结</text>
  <text x="380" y="62" text-anchor="middle" font-size="12" fill="#666666">同一条 load 指令，warp 内 32 线程的 4 种典型情况（图中以 8 线程示意）</text>

  <!-- 模式 1：无 conflict（各线程访问不同 bank） -->
  <rect x="30" y="76" width="700" height="196" rx="10" fill="#e8f5e9" stroke="#5cb86c" stroke-width="2"/>
  <text x="66" y="110" font-size="15" font-weight="bold" fill="#3d8b4f">✅ 模式 1：无 Conflict（各线程访问不同 bank）</text>
  <rect x="636" y="92" width="80" height="26" rx="13" fill="#4a9d5f"/>
  <text x="676" y="109" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fff">1 cycle</text>

  <rect x="50" y="128" width="380" height="46" rx="6" fill="#f0ede4" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="64" y="147" font-family="monospace" font-size="12" fill="#2b2b2b">float v = tile[threadIdx.x];</text>
  <text x="64" y="165" font-family="monospace" font-size="10.5" fill="#666666">// 线程 i 访问 bank i</text>
  <text x="50" y="200" font-size="12.5" fill="#2b2b2b"><tspan fill="#4a9d5f" font-weight="bold">•</tspan> 32 个线程分散在 32 个不同 bank</text>
  <text x="50" y="222" font-size="12.5" fill="#666666"><tspan fill="#4a9d5f" font-weight="bold">•</tspan> 所有请求并行完成，1 cycle 最快</text>

  <g fill="#4a9d5f">
    <circle cx="458" cy="154" r="11"/><circle cx="491" cy="154" r="11"/><circle cx="524" cy="154" r="11"/><circle cx="557" cy="154" r="11"/><circle cx="590" cy="154" r="11"/><circle cx="623" cy="154" r="11"/><circle cx="656" cy="154" r="11"/><circle cx="689" cy="154" r="11"/>
  </g>
  <g font-size="8.5" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="458" y="157">T0</text><text x="491" y="157">T1</text><text x="524" y="157">T2</text><text x="557" y="157">T3</text><text x="590" y="157">T4</text><text x="623" y="157">T5</text><text x="656" y="157">T6</text><text x="689" y="157">T7</text>
  </g>
  <g stroke="#4a9d5f" stroke-width="1.8" marker-end="url(#arrG)">
    <line x1="458" y1="165" x2="458" y2="190"/><line x1="491" y1="165" x2="491" y2="190"/><line x1="524" y1="165" x2="524" y2="190"/><line x1="557" y1="165" x2="557" y2="190"/><line x1="590" y1="165" x2="590" y2="190"/><line x1="623" y1="165" x2="623" y2="190"/><line x1="656" y1="165" x2="656" y2="190"/><line x1="689" y1="165" x2="689" y2="190"/>
  </g>
  <g fill="#BBDEFB" stroke="#6ab0ff" stroke-width="1.5">
    <rect x="444" y="194" width="28" height="24"/><rect x="477" y="194" width="28" height="24"/><rect x="510" y="194" width="28" height="24"/><rect x="543" y="194" width="28" height="24"/><rect x="576" y="194" width="28" height="24"/><rect x="609" y="194" width="28" height="24"/><rect x="642" y="194" width="28" height="24"/><rect x="675" y="194" width="28" height="24"/>
  </g>
  <g font-size="10" fill="#2b2b2b" text-anchor="middle">
    <text x="458" y="209">B0</text><text x="491" y="209">B1</text><text x="524" y="209">B2</text><text x="557" y="209">B3</text><text x="590" y="209">B4</text><text x="623" y="209">B5</text><text x="656" y="209">B6</text><text x="689" y="209">B7</text>
  </g>
  <text x="580" y="240" text-anchor="middle" font-size="10.5" fill="#666666">一一对应，互不干扰</text>

  <!-- 模式 2：Broadcast（全部读同一地址） -->
  <rect x="30" y="286" width="700" height="196" rx="10" fill="#e3f2fd" stroke="#6ab0ff" stroke-width="2"/>
  <text x="66" y="320" font-size="15" font-weight="bold" fill="#4a8edb">✅ 模式 2：Broadcast 广播（全部读同一地址）</text>
  <rect x="636" y="302" width="80" height="26" rx="13" fill="#4a8edb"/>
  <text x="676" y="319" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fff">1 cycle</text>

  <rect x="50" y="338" width="380" height="46" rx="6" fill="#f0ede4" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="64" y="357" font-family="monospace" font-size="12" fill="#2b2b2b">float v = tile[0];</text>
  <text x="64" y="375" font-family="monospace" font-size="10.5" fill="#666666">// 32 个线程读的都是字节地址 0</text>
  <text x="50" y="410" font-size="12.5" fill="#2b2b2b"><tspan fill="#4a8edb" font-weight="bold">•</tspan> 同一个地址 → 硬件一次广播给全部线程</text>
  <text x="50" y="432" font-size="12.5" fill="#666666"><tspan fill="#4a8edb" font-weight="bold">•</tspan> 虽然都在 Bank 0，但不算 conflict</text>

  <g fill="#4a8edb">
    <circle cx="458" cy="364" r="11"/><circle cx="491" cy="364" r="11"/><circle cx="524" cy="364" r="11"/><circle cx="557" cy="364" r="11"/><circle cx="590" cy="364" r="11"/><circle cx="623" cy="364" r="11"/><circle cx="656" cy="364" r="11"/><circle cx="689" cy="364" r="11"/>
  </g>
  <g font-size="8.5" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="458" y="367">T0</text><text x="491" y="367">T1</text><text x="524" y="367">T2</text><text x="557" y="367">T3</text><text x="590" y="367">T4</text><text x="623" y="367">T5</text><text x="656" y="367">T6</text><text x="689" y="367">T7</text>
  </g>
  <g stroke="#4a8edb" stroke-width="1.8" marker-end="url(#arrB)">
    <line x1="458" y1="376" x2="518" y2="400"/><line x1="491" y1="376" x2="532" y2="400"/><line x1="524" y1="376" x2="546" y2="400"/><line x1="557" y1="376" x2="560" y2="400"/><line x1="590" y1="376" x2="574" y2="400"/><line x1="623" y1="376" x2="588" y2="400"/><line x1="656" y1="376" x2="602" y2="400"/><line x1="689" y1="376" x2="616" y2="400"/>
  </g>
  <rect x="513" y="404" width="120" height="24" fill="#BBDEFB" stroke="#6ab0ff" stroke-width="1.5"/>
  <text x="573" y="420" text-anchor="middle" font-size="10.5" fill="#2b2b2b">Bank 0 · 地址 0</text>
  <text x="573" y="450" text-anchor="middle" font-size="10.5" fill="#4a8edb">一次广播 → 全体同时拿到值</text>

  <!-- 模式 3：Multicast（多路广播，无 conflict，易误判） -->
  <rect x="30" y="496" width="700" height="196" rx="10" fill="#fff8e1" stroke="#f0c050" stroke-width="2"/>
  <text x="66" y="530" font-size="15" font-weight="bold" fill="#c8961e">⚠️ 模式 3：Multicast 多路广播（易误判，实无 Conflict）</text>
  <rect x="636" y="512" width="80" height="26" rx="13" fill="#e8a838"/>
  <text x="676" y="529" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fff">1 cycle</text>

  <rect x="50" y="548" width="380" height="46" rx="6" fill="#f0ede4" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="64" y="567" font-family="monospace" font-size="12" fill="#2b2b2b">float v = tile[threadIdx.x % 2];</text>
  <text x="64" y="585" font-family="monospace" font-size="10.5" fill="#666666">// 偶数线程读地址 0，奇数线程读地址 1</text>
  <text x="50" y="620" font-size="12.5" fill="#2b2b2b"><tspan fill="#e8a838" font-weight="bold">•</tspan> 16 线程读 tile[0]（Bank 0），16 线程读 tile[1]（Bank 1）</text>
  <text x="50" y="642" font-size="12.5" fill="#666666"><tspan fill="#e8a838" font-weight="bold">•</tspan> 两组各自广播一次 → 1 cycle，不是 2-way conflict</text>

  <g fill="#e8a838">
    <circle cx="458" cy="574" r="11"/><circle cx="491" cy="574" r="11"/><circle cx="524" cy="574" r="11"/><circle cx="557" cy="574" r="11"/><circle cx="590" cy="574" r="11"/><circle cx="623" cy="574" r="11"/><circle cx="656" cy="574" r="11"/><circle cx="689" cy="574" r="11"/>
  </g>
  <g font-size="8.5" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="458" y="577">T0</text><text x="491" y="577">T1</text><text x="524" y="577">T2</text><text x="557" y="577">T3</text><text x="590" y="577">T4</text><text x="623" y="577">T5</text><text x="656" y="577">T6</text><text x="689" y="577">T7</text>
  </g>
  <g stroke="#e8a838" stroke-width="1.8" marker-end="url(#arrY)">
    <line x1="458" y1="586" x2="475" y2="610"/><line x1="491" y1="586" x2="611" y2="610"/><line x1="524" y1="586" x2="495" y2="610"/><line x1="557" y1="586" x2="631" y2="610"/><line x1="590" y1="586" x2="515" y2="610"/><line x1="623" y1="586" x2="651" y2="610"/><line x1="656" y1="586" x2="535" y2="610"/><line x1="689" y1="586" x2="671" y2="610"/>
  </g>
  <g fill="#BBDEFB" stroke="#6ab0ff" stroke-width="1.5">
    <rect x="457" y="614" width="96" height="24"/><rect x="593" y="614" width="96" height="24"/>
  </g>
  <g font-size="9" fill="#2b2b2b" text-anchor="middle">
    <text x="505" y="629">Bank 0 · addr 0</text><text x="641" y="629">Bank 1 · addr 1</text>
  </g>
  <g font-size="9.5" fill="#666666" text-anchor="middle">
    <text x="505" y="650">×16 线程</text><text x="641" y="650">×16 线程</text>
  </g>

  <!-- 模式 4：32-way conflict（最坏情况） -->
  <rect x="30" y="706" width="700" height="196" rx="10" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
  <text x="66" y="740" font-size="15" font-weight="bold" fill="#d9534f">❌ 模式 4：32-way Conflict（最坏情况）</text>
  <rect x="621" y="722" width="95" height="26" rx="13" fill="#e57373"/>
  <text x="668" y="739" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fff">32 cycles</text>

  <rect x="50" y="758" width="380" height="46" rx="6" fill="#f0ede4" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="64" y="777" font-family="monospace" font-size="12" fill="#2b2b2b">float v = tile[threadIdx.x * 32];</text>
  <text x="64" y="795" font-family="monospace" font-size="10.5" fill="#666666">// 线程 i 访问 tile[i×32] → 全部落入 Bank 0</text>
  <text x="50" y="830" font-size="12.5" fill="#2b2b2b"><tspan fill="#e57373" font-weight="bold">•</tspan> 32 个线程挤在 Bank 0 的 32 个不同地址</text>
  <text x="50" y="852" font-size="12.5" fill="#666666"><tspan fill="#e57373" font-weight="bold">•</tspan> 硬件一次只能服务一个请求 → 串行 32 次</text>
  <text x="50" y="874" font-size="12.5" fill="#666666"><tspan fill="#e57373" font-weight="bold">•</tspan> 耗时 32 cycles，速度降为 1/32</text>

  <g fill="#e57373">
    <circle cx="458" cy="766" r="11"/><circle cx="491" cy="766" r="11"/><circle cx="524" cy="766" r="11"/><circle cx="557" cy="766" r="11"/><circle cx="590" cy="766" r="11"/><circle cx="623" cy="766" r="11"/><circle cx="656" cy="766" r="11"/><circle cx="689" cy="766" r="11"/>
  </g>
  <g font-size="8.5" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="458" y="769">T0</text><text x="491" y="769">T1</text><text x="524" y="769">T2</text><text x="557" y="769">T3</text><text x="590" y="769">T4</text><text x="623" y="769">T5</text><text x="656" y="769">T6</text><text x="689" y="769">T7</text>
  </g>
  <g stroke="#e57373" stroke-width="1.8" marker-end="url(#arrR)">
    <line x1="458" y1="778" x2="458" y2="794"/><line x1="491" y1="778" x2="491" y2="794"/><line x1="524" y1="778" x2="524" y2="794"/><line x1="557" y1="778" x2="557" y2="794"/><line x1="590" y1="778" x2="590" y2="794"/><line x1="623" y1="778" x2="623" y2="794"/><line x1="656" y1="778" x2="656" y2="794"/><line x1="689" y1="778" x2="689" y2="794"/>
  </g>
  <text x="438" y="811" text-anchor="end" font-family="monospace" font-size="8.5" fill="#666666">tile[]</text>
  <g fill="#ffcdd2" stroke="#e57373" stroke-width="1.5">
    <rect x="444" y="798" width="28" height="20"/><rect x="477" y="798" width="28" height="20"/><rect x="510" y="798" width="28" height="20"/><rect x="543" y="798" width="28" height="20"/><rect x="576" y="798" width="28" height="20"/><rect x="609" y="798" width="28" height="20"/><rect x="642" y="798" width="28" height="20"/><rect x="675" y="798" width="28" height="20"/>
  </g>
  <g font-family="monospace" font-size="8" fill="#2b2b2b" text-anchor="middle">
    <text x="458" y="811">0</text><text x="491" y="811">32</text><text x="524" y="811">64</text><text x="557" y="811">96</text><text x="590" y="811">128</text><text x="623" y="811">160</text><text x="656" y="811">192</text><text x="689" y="811">224</text>
  </g>
  <g stroke="#e57373" stroke-width="1.8" marker-end="url(#arrR)">
    <line x1="458" y1="820" x2="528" y2="836"/><line x1="491" y1="820" x2="541" y2="836"/><line x1="524" y1="820" x2="554" y2="836"/><line x1="557" y1="820" x2="567" y2="836"/><line x1="590" y1="820" x2="580" y2="836"/><line x1="623" y1="820" x2="593" y2="836"/><line x1="656" y1="820" x2="606" y2="836"/><line x1="689" y1="820" x2="619" y2="836"/>
  </g>
  <rect x="518" y="840" width="110" height="26" fill="#e57373"/>
  <text x="573" y="857" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Bank 0</text>
  <text x="636" y="857" font-size="11" font-weight="bold" fill="#d9534f">串行 32 次！</text>

  <!-- 底部总结 -->
  <rect x="30" y="916" width="700" height="62" rx="10" fill="#f0ede4" stroke="#3a3a3a" stroke-width="2"/>
  <text x="380" y="941" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">⚡ 核心规则：同一个 warp 访问同一个 bank 时</text>
  <text x="380" y="963" text-anchor="middle" font-size="12.5"><tspan fill="#3d8b4f" font-weight="bold">同地址 → 广播 / 多路广播（1 cycle，免费）</tspan><tspan fill="#999999">　　·　　</tspan><tspan fill="#d9534f" font-weight="bold">不同地址 → conflict（串行 N cycles）</tspan></text>
  </g>
</svg>
