<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="28" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="280" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">RTX 5090 Ridge Point 计算</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Peak FP32 -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="380" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="84" font-size="12" fill="#2b6e9e" font-weight="bold">Peak FP32 算力</text>
  <text x="60" y="106" font-size="13" fill="#2b2b2b" font-family="monospace">SM=170 × 128 cores × 2.407GHz × 2</text>
  <text x="60" y="124" font-size="15" fill="#4a8edb" font-weight="bold" font-family="monospace">≈ 104.75 TFLOP/s</text>

  <!-- Peak Bandwidth -->
  <g filter="url(#sk)">
    <rect x="440" y="60" width="380" height="70" rx="8" fill="#f3eafa" stroke="#9b6dd9" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="460" y="84" font-size="12" fill="#6b3fa0" font-weight="bold">Peak 显存带宽</text>
  <text x="460" y="106" font-size="13" fill="#2b2b2b" font-family="monospace">GDDR7 × 5120-bit bus</text>
  <text x="460" y="124" font-size="15" fill="#9b6dd9" font-weight="bold" font-family="monospace">≈ 1.792 TB/s</text>

  <!-- Ridge Point 计算 -->
  <g filter="url(#sk)">
    <rect x="40" y="146" width="780" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="168" font-size="12" fill="#7a5415" font-weight="bold">Ridge Point</text>
  <text x="60" y="190" font-size="14" fill="#2b2b2b" font-family="monospace">Ridge Point = 104.75 / 1.792 ≈ 58.45 FLOP/Byte</text>

  <!-- 底部备注 -->
  <g filter="url(#sk)">
    <rect x="40" y="216" width="780" height="46" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.3"/>
  </g>
  <text x="430" y="244" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">AI &lt; 58.45 → memory-bound　|　AI &gt; 58.45 → compute-bound</text>
</svg>
