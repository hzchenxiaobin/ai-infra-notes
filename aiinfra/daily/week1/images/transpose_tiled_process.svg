<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','KaiTi','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a8edb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a9d5f"/>
    </marker>
  </defs>
  <g filter="url(#sketch)">
  <rect width="1000" height="750" fill="#fdfcf7"/>
  <text x="500" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2b2b">Tiled 转置三步走：读 tile &#8594; SM 内转置 &#8594; 写 tile</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#666666">Block(bx=1, by=0)，TILE_DIM=4，8&#215;8 矩阵；&#9733; 追踪同一个元素：A[0][4] &#8594; tile[0][0] &#8594; O[4][0]</text>

  <!-- stage labels -->
  <text x="190" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#6ab0ff">&#9312; 读 Global（coalesced）</text>
  <text x="500" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#5cb86c">&#9314; Shared Memory 中转 + 转置</text>
  <text x="790" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a9d5f">&#9317; 写 Global（coalesced）</text>

  <!-- ================= input grid ================= -->
  <text x="85" y="97" text-anchor="middle" font-size="9" fill="#666666">0</text>
