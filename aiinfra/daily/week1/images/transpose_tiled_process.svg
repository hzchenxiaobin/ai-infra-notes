  <rect x="190" y="100" width="120" height="30" fill="none" stroke="#e57373" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="205" y="117" text-anchor="middle" font-size="10" fill="#d0342c" font-weight="bold">&#9733;</text>
  <text x="205" y="127" text-anchor="middle" font-size="6.5" fill="#2b2b2b">T0,0</text>
  <text x="235" y="127" text-anchor="middle" font-size="6.5" fill="#2b2b2b">T1,0</text>
