  <text x="295" y="127" text-anchor="middle" font-size="6.5" fill="#2b2b2b">T3,0</text>

  <text x="190" y="360" text-anchor="middle" font-size="10.5" fill="#4a8edb" font-weight="bold">warp 按 x 方向读：T(tx,0) 读 A[0][4+tx]</text>
  <text x="190" y="376" text-anchor="middle" font-size="10.5" fill="#4a8edb" font-weight="bold">地址连续 &#8594; coalesced read &#10003;</text>

  <!-- arrow 1 -->
  <line x1="314" y1="150" x2="416" y2="168" stroke="#4a8edb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="365" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8edb">&#9312; 按行读入</text>

  <!-- ================= shared memory grid ================= -->
  <text x="500" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5cb86c">tile（4&#215;4，Shared Memory）</text>

