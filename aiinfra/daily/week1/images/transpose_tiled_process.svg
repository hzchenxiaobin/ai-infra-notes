  <rect x="540" y="230" width="40" height="40" fill="#4a9d5f" opacity="0.22" stroke="#5cb86c" stroke-width="1"/>
  <rect x="420" y="270" width="40" height="40" fill="#4a9d5f" opacity="0.22" stroke="#5cb86c" stroke-width="1"/>
  <rect x="460" y="270" width="40" height="40" fill="#4a9d5f" opacity="0.22" stroke="#5cb86c" stroke-width="1"/>
  <rect x="500" y="270" width="40" height="40" fill="#4a9d5f" opacity="0.22" stroke="#5cb86c" stroke-width="1"/>
  <rect x="540" y="270" width="40" height="40" fill="#4a9d5f" opacity="0.22" stroke="#5cb86c" stroke-width="1"/>

  <text x="442" y="175" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(0,0)</text>
  <text x="482" y="175" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(0,1)</text>
  <text x="522" y="175" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(0,2)</text>
  <text x="562" y="175" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(0,3)</text>
  <text x="442" y="215" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(1,0)</text>
  <text x="482" y="215" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(1,1)</text>
  <text x="522" y="215" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(1,2)</text>
  <text x="562" y="215" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(1,3)</text>
  <text x="442" y="255" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(2,0)</text>
  <text x="482" y="255" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(2,1)</text>
  <text x="522" y="255" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(2,2)</text>
  <text x="562" y="255" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(2,3)</text>
  <text x="442" y="295" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(3,0)</text>
  <text x="482" y="295" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(3,1)</text>
  <text x="522" y="295" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(3,2)</text>
  <text x="562" y="295" text-anchor="middle" font-size="8.5" fill="#2b2b2b">(3,3)</text>

  <!-- row 0: written by the warp (blue) -->
  <rect x="420" y="150" width="160" height="40" fill="none" stroke="#6ab0ff" stroke-width="2"/>
  <!-- col 0: read out by the warp (red) -->
  <rect x="420" y="150" width="40" height="160" fill="none" stroke="#e57373" stroke-width="2"/>
  <text x="426" y="165" text-anchor="middle" font-size="10" fill="#d0342c" font-weight="bold">&#9733;</text>

  <!-- transpose badge -->
  <circle cx="500" cy="235" r="24" fill="#fdfcf7" stroke="#e8a838" stroke-width="2.5" opacity="0.95"/>
  <text x="500" y="233" text-anchor="middle" font-size="11" fill="#e8a838" font-weight="bold">&#9314;</text>
  <text x="500" y="247" text-anchor="middle" font-size="11" fill="#e8a838" font-weight="bold">转置</text>

  <text x="500" y="336" text-anchor="middle" font-size="10.5" fill="#6ab0ff" font-weight="bold">写入：tile[threadIdx.y][threadIdx.x]（保持原布局）</text>
  <text x="500" y="352" text-anchor="middle" font-size="10.5" fill="#e57373" font-weight="bold">读出：tile[threadIdx.x][threadIdx.y]（转置在此发生）</text>

  <!-- arrow 3 -->
  <line x1="584" y1="235" x2="668" y2="232" stroke="#4a9d5f" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="625" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a9d5f">&#9317; 按行写出</text>

  <!-- ================= output grid ================= -->
  <text x="685" y="97" text-anchor="middle" font-size="9" fill="#666666">0</text>
  <text x="715" y="97" text-anchor="middle" font-size="9" fill="#666666">1</text>
  <text x="745" y="97" text-anchor="middle" font-size="9" fill="#666666">2</text>
  <text x="775" y="97" text-anchor="middle" font-size="9" fill="#666666">3</text>
  <text x="805" y="97" text-anchor="middle" font-size="9" fill="#666666">4</text>
  <text x="835" y="97" text-anchor="middle" font-size="9" fill="#666666">5</text>
  <text x="865" y="97" text-anchor="middle" font-size="9" fill="#666666">6</text>
  <text x="895" y="97" text-anchor="middle" font-size="9" fill="#666666">7</text>
  <text x="664" y="119" text-anchor="end" font-size="9" fill="#666666">0</text>
  <text x="664" y="149" text-anchor="end" font-size="9" fill="#666666">1</text>
  <text x="664" y="179" text-anchor="end" font-size="9" fill="#666666">2</text>
  <text x="664" y="209" text-anchor="end" font-size="9" fill="#666666">3</text>
  <text x="664" y="239" text-anchor="end" font-size="9" fill="#666666">4</text>
  <text x="664" y="269" text-anchor="end" font-size="9" fill="#666666">5</text>
  <text x="664" y="299" text-anchor="end" font-size="9" fill="#666666">6</text>
  <text x="664" y="329" text-anchor="end" font-size="9" fill="#666666">7</text>

  <rect x="670" y="220" width="120" height="120" fill="#4a9d5f" opacity="0.3"/>
  <rect x="670" y="100" width="240" height="240" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="700" y1="100" x2="700" y2="340" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="730" y1="100" x2="730" y2="340" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="760" y1="100" x2="760" y2="340" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="790" y1="100" x2="790" y2="340" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="820" y1="100" x2="820" y2="340" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="850" y1="100" x2="850" y2="340" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="880" y1="100" x2="880" y2="340" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="670" y1="130" x2="910" y2="130" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="670" y1="160" x2="910" y2="160" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="670" y1="190" x2="910" y2="190" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="670" y1="220" x2="910" y2="220" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="670" y1="250" x2="910" y2="250" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="670" y1="280" x2="910" y2="280" stroke="#3a3a3a" stroke-width="0.7"/>
  <line x1="670" y1="310" x2="910" y2="310" stroke="#3a3a3a" stroke-width="0.7"/>

  <!-- warp write row -->
  <rect x="670" y="220" width="120" height="30" fill="#4a9d5f" opacity="0.45"/>
  <rect x="670" y="220" width="120" height="30" fill="none" stroke="#e57373" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="685" y="239" text-anchor="middle" font-size="10" fill="#d0342c" font-weight="bold">&#9733;</text>

  <text x="790" y="360" text-anchor="middle" font-size="10.5" fill="#4a9d5f" font-weight="bold">warp 写 O[4][0..3] = A[0..3][4]（tile 的第 0 列）</text>
  <text x="790" y="376" text-anchor="middle" font-size="10.5" fill="#4a9d5f" font-weight="bold">地址连续 &#8594; coalesced write &#10003;</text>

  <!-- ================= code explanation ================= -->
  <rect x="60" y="400" width="880" height="330" rx="10" fill="#fffdf5" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="500" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">为什么两步都是 coalesced？&#8212;&#8212;两段关键代码</text>

  <text x="90" y="458" font-size="12.5" font-weight="bold" fill="#6ab0ff">读阶段（&#9312;）</text>
  <rect x="80" y="466" width="420" height="100" rx="6" fill="#f0ede4" stroke="#3a3a3a" stroke-width="1"/>
  <text x="92" y="486" font-family="monospace" font-size="10.5" fill="#2b2b2b">int x = blockIdx.x * TILE_DIM + threadIdx.x;</text>
  <text x="92" y="502" font-family="monospace" font-size="10.5" fill="#2b2b2b">int y = blockIdx.y * TILE_DIM + threadIdx.y;</text>
  <text x="92" y="518" font-family="monospace" font-size="10.5" fill="#2b2b2b">tile[threadIdx.y][threadIdx.x]</text>
  <text x="92" y="534" font-family="monospace" font-size="10.5" fill="#2b2b2b">    = in[y * width + x];</text>
  <text x="90" y="590" font-size="11" fill="#4a8edb" font-weight="bold">warp 内 threadIdx.x 连续变化 &#8594; x 连续 &#8594; in 地址连续 &#10003;</text>
  <text x="90" y="608" font-size="10.5" fill="#666666">tile 按 [y][x] 存：保持原矩阵布局，warp 把整行搬进来</text>

  <text x="530" y="458" font-size="12.5" font-weight="bold" fill="#5cb86c">写阶段（&#9317;）</text>
  <rect x="520" y="466" width="400" height="100" rx="6" fill="#f0ede4" stroke="#3a3a3a" stroke-width="1"/>
  <text x="532" y="486" font-family="monospace" font-size="10.5" fill="#2b2b2b">x = blockIdx.y * TILE_DIM + threadIdx.x;</text>
  <text x="532" y="502" font-family="monospace" font-size="10.5" fill="#2b2b2b">y = blockIdx.x * TILE_DIM + threadIdx.y;</text>
  <text x="532" y="518" font-family="monospace" font-size="10.5" fill="#2b2b2b">out[y * height + x]</text>
  <text x="532" y="534" font-family="monospace" font-size="10.5" fill="#2b2b2b">    = tile[threadIdx.x][threadIdx.y];</text>
  <text x="530" y="590" font-size="11" fill="#4a9d5f" font-weight="bold">交换 blockIdx.x/y，threadIdx.x 仍对应输出的连续维度 &#10003;</text>
  <text x="530" y="608" font-size="10.5" fill="#666666">tile 按 [x][y] 取：取的是一列，但写出的地址连续</text>

  <text x="500" y="652" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e57373">非连续访问只发生在 Shared Memory 内部&#8212;&#8212;它延迟低（~20-30 cycles），不构成瓶颈</text>
  <text x="500" y="680" text-anchor="middle" font-size="10.5" fill="#666666">kernel 对应任务 2 的 transpose_optimized；tile[TILE_DIM][TILE_DIM+1] 的 padding 留到 Day 5 讲 bank conflict</text>
  <text x="500" y="704" text-anchor="middle" font-size="10.5" fill="#666666">地址正确性验证：跟踪线程 (a,b) 可得 out[(bx*T+b)*H + (by*T+a)] = in[(by*T+a)*W + (bx*T+b)]</text>
  </g>
</svg>
