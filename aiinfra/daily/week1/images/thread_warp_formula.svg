<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="280" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">总线程数 &amp; Warp 数计算公式</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 总线程数 -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="780" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="82" font-size="12" fill="#2b6e9e" font-weight="bold">总线程数</text>
  <text x="60" y="104" font-size="13" fill="#2b2b2b" font-family="monospace">total = gridDim.x × gridDim.y × gridDim.z</text>
  <text x="80" y="122" font-size="13" fill="#2b2b2b" font-family="monospace">× blockDim.x × blockDim.y × blockDim.z</text>

  <!-- Warp 数（详细） -->
  <g filter="url(#sk)">
    <rect x="40" y="142" width="380" height="70" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="164" font-size="12" fill="#2e6e2e" font-weight="bold">Warp 数（详细）</text>
  <text x="60" y="184" font-size="12" fill="#2b2b2b" font-family="monospace">warps_per_block = ceil(</text>
  <text x="80" y="200" font-size="11" fill="#2b2b2b" font-family="monospace">blockDim.x × y × z / 32)</text>
  <text x="60" y="216" font-size="11" fill="#666" font-family="monospace">total = warps_per_block × gridDim.x × y × z</text>

  <!-- Warp 数（简写） -->
  <g filter="url(#sk)">
    <rect x="440" y="142" width="380" height="70" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="460" y="164" font-size="12" fill="#7a5415" font-weight="bold">Warp 数（简写）</text>
  <text x="460" y="186" font-size="12" fill="#2b2b2b" font-family="monospace">warps_per_block = ceil(threads / 32)</text>
  <text x="460" y="206" font-size="12" fill="#2b2b2b" font-family="monospace">total_warps = warps_per_block × num_blocks</text>

  <!-- 核心记忆点 -->
  <g filter="url(#sk)">
    <rect x="40" y="226" width="780" height="42" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.3" fill-opacity="0.3"/>
  </g>
  <text x="430" y="252" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">⚠ 先按 block 算 warp，再乘 block 数——不要把整个 grid 的线程加在一起除以 32</text>
</svg>
