<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <g filter="url(#sketch)">

  <rect width="860" height="640" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">Week 1 目录结构</text>

  <!-- Root node -->
  <rect x="60" y="60" width="160" height="36" rx="6" fill="#4a8edb" opacity="0.15" stroke="#6ab0ff" stroke-width="2"/>
  <text x="78" y="83" font-size="15" fill="#2b2b2b" font-family="monospace" font-weight="bold">📁 week1/</text>

  <!-- Tree vertical line -->
  <path d="M 140 96 L 140 548" stroke="#999999" stroke-width="1.5" fill="none"/>

  <!-- README.md -->
  <path d="M 140 120 L 180 120" stroke="#999999" stroke-width="1.5" fill="none"/>
