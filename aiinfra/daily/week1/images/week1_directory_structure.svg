  <rect x="180" y="572" width="540" height="48" rx="8" fill="#fffdf5" stroke="#6ab0ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="594" text-anchor="middle" font-size="13" fill="#6ab0ff" font-weight="bold">💡 每天的 CUDA 源码在当天目录的 kernels/ 或 exercise/ 下</text>
  <text x="450" y="612" text-anchor="middle" font-size="12" fill="#666666">编译时先 cd 到对应 day 目录（命令均以 week1/ 为基准路径）</text>

  </g>
</svg>
