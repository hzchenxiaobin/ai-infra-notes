  <path d="M 140 538 L 140 538 M 140 538 L 180 538" stroke="#999999" stroke-width="1.5" fill="none"/>
  <rect x="180" y="524" width="300" height="28" rx="4" fill="#e8a838" opacity="0.12" stroke="#e8a838" stroke-width="1.5"/>
  <text x="192" y="543" font-size="13" fill="#2b2b2b" font-family="monospace">tools/cuda_occupancy_calculator.py</text>
