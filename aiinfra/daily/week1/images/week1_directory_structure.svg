  <!-- day4/ -->
  <path d="M 140 272 L 180 272" stroke="#999999" stroke-width="1.5" fill="none"/>
  <rect x="180" y="258" width="200" height="28" rx="4" fill="#b689e8" opacity="0.12" stroke="#b689e8" stroke-width="1.5"/>
