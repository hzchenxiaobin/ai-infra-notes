<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <g filter="url(#sketch)">

  <rect width="760" height="400" fill="#fdfcf7"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">Warp Scheduler 延迟隐藏</text>

  <text x="90" y="95" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">warp 0</text>
  <rect x="100" y="75" width="40" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="120" y="95" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">load</text>
  <rect x="140" y="75" width="520" height="30" fill="#e57373" opacity="0.45" stroke="#e57373" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-size="12" fill="#2b2b2b">等内存中…（约 800 cycles）</text>
  <rect x="660" y="75" width="40" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="680" y="95" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>

  <text x="90" y="145" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">warp 1</text>
  <rect x="220" y="125" width="70" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="255" y="145" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>

  <text x="90" y="195" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">warp 2</text>
  <rect x="400" y="175" width="70" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="435" y="195" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>

  <text x="90" y="245" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">warp 3</text>
  <rect x="490" y="225" width="70" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="525" y="245" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>

  <rect x="100" y="275" width="600" height="25" fill="#4a8edb" opacity="0.3" stroke="#6ab0ff" stroke-width="2"/>
  <text x="400" y="293" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">SM 计算单元持续工作（延迟被隐藏）</text>

  <line x1="100" y1="325" x2="700" y2="325" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="100" y1="320" x2="100" y2="330" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="220" y1="320" x2="220" y2="330" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="400" y1="320" x2="400" y2="330" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="660" y1="320" x2="660" y2="330" stroke="#3a3a3a" stroke-width="2"/>
  <text x="100" y="350" text-anchor="middle" font-size="13" fill="#666666">cycle 0</text>
  <text x="220" y="350" text-anchor="middle" font-size="13" fill="#666666">cycle 2</text>
  <text x="400" y="350" text-anchor="middle" font-size="13" fill="#666666">cycle 400</text>
  <text x="660" y="350" text-anchor="middle" font-size="13" fill="#666666">cycle 800</text>

  </g>
</svg>
