<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9b6dd9"/>
    </marker>
  </defs>

  <g filter="url(#sketch)">

  <rect width="760" height="450" fill="#fdfcf7"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">Warp Scheduler 延迟隐藏</text>

  <!-- 图例 -->
  <rect x="225" y="48" width="14" height="14" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="245" y="60" font-size="12" fill="#2b2b2b">执行中</text>
  <rect x="315" y="48" width="14" height="14" fill="#e57373" opacity="0.45" stroke="#e57373" stroke-width="2"/>
  <text x="335" y="60" font-size="12" fill="#2b2b2b">等内存（stall）</text>
  <rect x="455" y="48" width="14" height="14" fill="#fdfcf7" stroke="#999999" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="475" y="60" font-size="12" fill="#2b2b2b">就绪待命</text>

  <!-- warp 0 -->
  <text x="92" y="104" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">warp 0</text>
  <rect x="100" y="84" width="90" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="145" y="104" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>
  <rect x="190" y="84" width="450" height="30" fill="#e57373" opacity="0.45" stroke="#e57373" stroke-width="2"/>
  <text x="415" y="104" text-anchor="middle" font-size="12" fill="#2b2b2b">发出 load 后等内存中…（global memory ≈ 800 cycles）</text>
  <rect x="640" y="84" width="60" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="670" y="104" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>

  <!-- warp 1 -->
  <text x="92" y="154" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">warp 1</text>
  <text x="145" y="154" text-anchor="middle" font-size="10" font-style="italic" fill="#999999">就绪待命</text>
  <rect x="190" y="134" width="90" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="235" y="154" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>
  <rect x="280" y="134" width="180" height="30" fill="#e57373" opacity="0.45" stroke="#e57373" stroke-width="2"/>
  <text x="370" y="154" text-anchor="middle" font-size="11" fill="#2b2b2b">等内存</text>
  <rect x="460" y="134" width="90" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="505" y="154" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>
  <rect x="550" y="134" width="150" height="30" fill="#e57373" opacity="0.45" stroke="#e57373" stroke-width="2"/>
  <text x="625" y="154" text-anchor="middle" font-size="11" fill="#2b2b2b">等内存</text>

  <!-- warp 2 -->
  <text x="92" y="204" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">warp 2</text>
  <text x="190" y="204" text-anchor="middle" font-size="10" font-style="italic" fill="#999999">就绪待命</text>
  <rect x="280" y="184" width="90" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="325" y="204" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>
  <rect x="370" y="184" width="180" height="30" fill="#e57373" opacity="0.45" stroke="#e57373" stroke-width="2"/>
  <text x="460" y="204" text-anchor="middle" font-size="11" fill="#2b2b2b">等内存</text>
  <rect x="550" y="184" width="90" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="595" y="204" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>
  <rect x="640" y="184" width="60" height="30" fill="#e57373" opacity="0.45" stroke="#e57373" stroke-width="2"/>
  <text x="670" y="204" text-anchor="middle" font-size="11" fill="#2b2b2b">等内存</text>

  <!-- warp 3 -->
  <text x="92" y="254" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">warp 3</text>
  <text x="235" y="254" text-anchor="middle" font-size="10" font-style="italic" fill="#999999">就绪待命</text>
  <rect x="370" y="224" width="90" height="30" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="415" y="254" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">执行</text>
  <rect x="460" y="224" width="240" height="30" fill="#e57373" opacity="0.45" stroke="#e57373" stroke-width="2"/>
  <text x="580" y="254" text-anchor="middle" font-size="11" fill="#2b2b2b">等内存中…</text>

  <!-- 调度轨迹 -->
  <text x="160" y="76" font-size="12" font-weight="bold" fill="#9b6dd9">调度轨迹（卡住就换人）</text>
  <polyline points="145,99 235,149 325,199 415,249 505,149 595,199 670,99" fill="none" stroke="#9b6dd9" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <circle cx="145" cy="99" r="4" fill="#fdfcf7" stroke="#9b6dd9" stroke-width="1.5"/>
  <circle cx="235" cy="149" r="4" fill="#fdfcf7" stroke="#9b6dd9" stroke-width="1.5"/>
  <circle cx="325" cy="199" r="4" fill="#fdfcf7" stroke="#9b6dd9" stroke-width="1.5"/>
  <circle cx="415" cy="249" r="4" fill="#fdfcf7" stroke="#9b6dd9" stroke-width="1.5"/>
  <circle cx="505" cy="149" r="4" fill="#fdfcf7" stroke="#9b6dd9" stroke-width="1.5"/>
  <circle cx="595" cy="199" r="4" fill="#fdfcf7" stroke="#9b6dd9" stroke-width="1.5"/>
  <text x="655" y="127" text-anchor="middle" font-size="10" fill="#666666">warp 0 恢复</text>

  <!-- SM 计算单元 -->
  <rect x="100" y="270" width="600" height="28" fill="#4a8edb" opacity="0.15" stroke="#6ab0ff" stroke-width="2"/>
  <rect x="100" y="270" width="90" height="28" fill="#4a9d5f" opacity="0.75"/>
  <text x="145" y="289" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">w0</text>
  <rect x="190" y="270" width="90" height="28" fill="#4a9d5f" opacity="0.75"/>
  <text x="235" y="289" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">w1</text>
  <rect x="280" y="270" width="90" height="28" fill="#4a9d5f" opacity="0.75"/>
  <text x="325" y="289" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">w2</text>
  <rect x="370" y="270" width="90" height="28" fill="#4a9d5f" opacity="0.75"/>
  <text x="415" y="289" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">w3</text>
  <rect x="460" y="270" width="90" height="28" fill="#4a9d5f" opacity="0.75"/>
  <text x="505" y="289" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">w1</text>
  <rect x="550" y="270" width="90" height="28" fill="#4a9d5f" opacity="0.75"/>
  <text x="595" y="289" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">w2</text>
  <rect x="640" y="270" width="60" height="28" fill="#4a9d5f" opacity="0.75"/>
  <text x="670" y="289" text-anchor="middle" font-size="11" fill="#fdfcf7" font-weight="bold">w0</text>
  <text x="400" y="320" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">SM 计算单元：始终有 warp 在执行 → 延迟被隐藏</text>

  <!-- 时间轴 -->
  <line x1="100" y1="338" x2="700" y2="338" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="100" y1="332" x2="100" y2="344" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="190" y1="332" x2="190" y2="344" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="370" y1="332" x2="370" y2="344" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="640" y1="332" x2="640" y2="344" stroke="#3a3a3a" stroke-width="2"/>
  <text x="100" y="360" text-anchor="middle" font-size="12" fill="#666666">cycle 0</text>
  <text x="190" y="360" text-anchor="middle" font-size="12" fill="#666666">cycle 2</text>
  <text x="370" y="360" text-anchor="middle" font-size="12" fill="#666666">cycle ~400</text>
  <text x="640" y="360" text-anchor="middle" font-size="12" fill="#666666">cycle 800</text>
  <text x="400" y="378" text-anchor="middle" font-size="11" fill="#999999">（横轴为示意图，非线性比例）</text>

  <!-- 结论 -->
  <rect x="100" y="388" width="600" height="48" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.5" fill-opacity="0.6"/>
  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">只要有就绪的 warp 可切换，计算单元就不空转 —— 延迟被『藏』起来了</text>
  <text x="400" y="430" text-anchor="middle" font-size="11" fill="#666666">若 warp 不够切（低 occupancy）→ 计算单元空转，见下图</text>

  </g>
</svg>
