<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <g filter="url(#sketch)">
  <rect width="680" height="300" fill="#fdfcf7"/>
  <text x="340" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">GEMM C = A × B (4096³) 的计算强度</text>

  <!-- Memory read/write -->
  <text x="60" y="75" font-size="14" font-weight="bold" fill="#6ab0ff">内存读写</text>

  <rect x="60" y="85" width="100" height="40" rx="4" fill="#6ab0ff" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="110" y="110" text-anchor="middle" font-size="12" fill="#2b2b2b">读 A</text>
  <text x="170" y="110" font-size="12" fill="#666666">67MB</text>

  <text x="215" y="108" font-size="16" fill="#666666">+</text>

  <rect x="230" y="85" width="100" height="40" rx="4" fill="#6ab0ff" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#2b2b2b">读 B</text>
  <text x="340" y="110" font-size="12" fill="#666666">67MB</text>

  <text x="385" y="108" font-size="16" fill="#666666">+</text>

  <rect x="400" y="85" width="100" height="40" rx="4" fill="#e57373" opacity="0.2" stroke="#e57373" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#2b2b2b">写 C</text>
  <text x="510" y="110" font-size="12" fill="#666666">67MB</text>

  <text x="555" y="108" font-size="16" fill="#666666">=</text>

  <rect x="570" y="85" width="90" height="40" rx="4" fill="#e8a838" opacity="0.3" stroke="#e8a838" stroke-width="2"/>
  <text x="615" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">201MB</text>

  <!-- FLOPs -->
  <text x="60" y="165" font-size="14" font-weight="bold" fill="#5cb86c">浮点运算</text>
  <rect x="60" y="175" width="180" height="40" rx="4" fill="#5cb86c" opacity="0.2" stroke="#5cb86c" stroke-width="2"/>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#2b2b2b">2 × 4096³</text>
  <text x="255" y="200" font-size="16" fill="#666666">≈</text>
  <rect x="270" y="175" width="100" height="40" rx="4" fill="#5cb86c" opacity="0.3" stroke="#5cb86c" stroke-width="2"/>
  <text x="320" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">137 GFLOP</text>

  <!-- AI result -->
  <line x1="60" y1="240" x2="620" y2="240" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="60" y="265" font-size="14" font-weight="bold" fill="#5cb86c">计算强度 AI =</text>
  <text x="180" y="265" font-size="14" fill="#2b2b2b">137 GFLOP / 201 MB</text>
  <text x="360" y="265" font-size="16" fill="#666666">≈</text>
  <text x="390" y="265" font-size="18" font-weight="bold" fill="#5cb86c">683 FLOP/Byte</text>
  <text x="540" y="265" font-size="12" fill="#666666">&gt;&gt; Ridge 58.45 → Compute-Bound</text>

  </g>
</svg>
