<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','KaiTi','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <g filter="url(#sketch)">
  <rect width="680" height="392" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">GEMM C = A &#215; B（M=N=K=4096，float32）的计算强度</text>

  <!-- 1. memory traffic (whole matrices, read once / write once) -->
  <text x="60" y="66" font-size="14" font-weight="bold" fill="#6ab0ff">&#9312; 内存流量（每个矩阵只读一次、写一次）</text>

  <rect x="60" y="78" width="90" height="42" rx="5" fill="#6ab0ff" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="105" y="104" text-anchor="middle" font-size="13" fill="#2b2b2b">读 A</text>
  <text x="158" y="104" font-size="12" fill="#666666">67MB</text>

  <text x="172" y="105" font-size="16" fill="#666666">+</text>

  <rect x="182" y="78" width="90" height="42" rx="5" fill="#6ab0ff" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="227" y="104" text-anchor="middle" font-size="13" fill="#2b2b2b">读 B</text>
  <text x="280" y="104" font-size="12" fill="#666666">67MB</text>

  <text x="294" y="105" font-size="16" fill="#666666">+</text>

  <rect x="304" y="78" width="90" height="42" rx="5" fill="#e57373" opacity="0.2" stroke="#e57373" stroke-width="2"/>
  <text x="349" y="104" text-anchor="middle" font-size="13" fill="#2b2b2b">写 C</text>
  <text x="402" y="104" font-size="12" fill="#666666">67MB</text>

  <text x="416" y="105" font-size="16" fill="#666666">=</text>

  <rect x="428" y="78" width="110" height="42" rx="5" fill="#e8a838" opacity="0.3" stroke="#e8a838" stroke-width="2"/>
  <text x="483" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">201 MB</text>

  <text x="552" y="98" font-size="10" fill="#666666">4096&#178;&#215;4B</text>
  <text x="552" y="112" font-size="10" fill="#666666">&#215; 3 个矩阵</text>

  <!-- 2. compute -->
  <text x="60" y="158" font-size="14" font-weight="bold" fill="#5cb86c">&#9313; 计算量</text>

  <rect x="60" y="170" width="160" height="42" rx="5" fill="#5cb86c" opacity="0.2" stroke="#5cb86c" stroke-width="2"/>
  <text x="140" y="196" text-anchor="middle" font-size="13" fill="#2b2b2b">2 &#215; 4096&#179; 次乘加</text>

  <text x="235" y="197" font-size="16" fill="#666666">&#8776;</text>

  <rect x="248" y="170" width="120" height="42" rx="5" fill="#5cb86c" opacity="0.3" stroke="#5cb86c" stroke-width="2"/>
  <text x="308" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">137 GFLOP</text>

  <text x="385" y="190" font-size="11" fill="#666666">每个输出元素 2K = 8192 FLOP</text>
  <text x="385" y="206" font-size="11" fill="#666666">关键：每个读入的元素参与 K=4096 次乘加</text>

  <!-- divider -->
  <line x1="60" y1="238" x2="620" y2="238" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 3. AI result -->
  <text x="60" y="272" font-size="15" font-weight="bold" fill="#5cb86c">AI = 137 GFLOP &#247; 201 MB &#8776; 683 FLOP/Byte</text>

  <!-- comparison bars -->
  <text x="60" y="307" font-size="11.5" fill="#2b2b2b">GEMM 4096&#179;</text>
  <rect x="200" y="296" width="370" height="14" rx="2" fill="#4a9d5f" opacity="0.7" stroke="#5cb86c" stroke-width="1.5"/>
  <text x="580" y="307" font-size="11" fill="#5cb86c" font-weight="bold">683</text>

  <text x="60" y="337" font-size="11.5" fill="#2b2b2b">RTX 5090 平衡点</text>
  <rect x="200" y="326" width="32" height="14" rx="2" fill="#e8a838" opacity="0.7" stroke="#e8a838" stroke-width="1.5"/>
  <text x="242" y="337" font-size="11" fill="#e8a838" font-weight="bold">58.45</text>

  <!-- bottom line -->
  <text x="60" y="372" font-size="13" font-weight="bold" fill="#5cb86c">683 &#8776; 12 倍于平衡点 &#8594; Compute-Bound &#10003;（高计算强度来自数据的反复复用）</text>
  </g>
</svg>
