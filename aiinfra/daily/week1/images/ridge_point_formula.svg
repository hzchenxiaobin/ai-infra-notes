<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="230" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Ridge Point（山脊点）</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 公式 -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="780" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="84" font-size="12" fill="#2b6e9e" font-weight="bold">山脊点公式</text>
  <text x="60" y="106" font-size="15" fill="#2b2b2b" font-family="monospace">Ridge Point = Peak FLOP/s / Peak Bandwidth</text>

  <!-- 左侧：交点含义 -->
  <g filter="url(#sk)">
    <rect x="40" y="128" width="380" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="150" font-size="12" fill="#2e6e2e" font-weight="bold">两条天花板的交点</text>
  <text x="60" y="172" font-size="12" fill="#2b2b2b">斜线与水平线的交汇处</text>

  <!-- 右侧：判定准则 -->
  <g filter="url(#sk)">
    <rect x="440" y="128" width="380" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="460" y="150" font-size="12" fill="#7a5415" font-weight="bold">判定准则</text>
  <text x="460" y="170" font-size="11" fill="#2b2b2b">AI &lt; Ridge Point → memory-bound</text>
  <text x="460" y="184" font-size="11" fill="#2b2b2b">AI &gt; Ridge Point → compute-bound</text>
</svg>
