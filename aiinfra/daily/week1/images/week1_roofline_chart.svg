  <path d="M 260 40 Q 380 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <path d="M 80 340 L 680 340" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <path d="M 80 340 L 80 60" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>  <text x="50" y="200" font-size="12" fill="#444" font-weight="bold">FLOP/s</text>  <text x="380" y="370" font-size="12" fill="#444" font-weight="bold">Arithmetic Intensity (FLOP/Byte)</text>  <path d="M 80 80 L 300 80 L 680 300" stroke="#b03a3a" stroke-width="2" fill="none" filter="url(#sk)"/>  <text x="320" y="76" font-size="11" fill="#b03a3a" font-weight="bold">Peak 104.75 TFLOPS</text>  <path d="M 420 60 L 420 340" stroke="#c98a2b" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>  <text x="424" y="56" font-size="10" fill="#c98a2b" font-weight="bold">Ridge Point 58.45</text>  <circle cx="450" cy="90" r="5" fill="#4a8e4a" opacity="0.8" filter="url(#sk)"/>  <text x="460" y="94" font-size="10" fill="#4a8e4a" font-weight="normal">GEMM (tiled)</text>  <circle cx="160" cy="250" r="5" fill="#4a8edb" opacity="0.8" filter="url(#sk)"/>  <text x="170" y="254" font-size="10" fill="#4a8edb" font-weight="normal">occupancy_test</text>  <circle cx="220" cy="290" r="5" fill="#c98a2b" opacity="0.8" filter="url(#sk)"/>  <text x="230" y="294" font-size="10" fill="#c98a2b" font-weight="normal">transpose_naive</text>  <circle cx="120" cy="310" r="5" fill="#b03a3a" opacity="0.8" filter="url(#sk)"/>  <text x="130" y="314" font-size="10" fill="#b03a3a" font-weight="normal">hello_gpu</text>  <circle cx="130" cy="305" r="5" fill="#b03a3a" opacity="0.8" filter="url(#sk)"/>  <text x="140" y="309" font-size="10" fill="#b03a3a" font-weight="normal">softmax</text>  <text x="100" y="330" font-size="10" fill="#888" font-weight="normal" font-family="monospace">0   10   20   30   40   50</text>  <text x="380" y="330" font-size="10" fill="#c98a2b" font-weight="bold" font-family="monos