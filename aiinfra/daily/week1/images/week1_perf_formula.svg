<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="220" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Week 1 核心公式</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主公式 -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="780" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" fill-opacity="0.35"/>
  </g>
  <text x="60" y="84" font-size="12" fill="#2b6e9e" font-weight="bold">GPU 性能核心公式</text>
  <text x="430" y="106" text-anchor="middle" font-size="17" fill="#2b2b2b" font-family="monospace" font-weight="bold">GPU 性能 = Memory + 并行度</text>

  <!-- 左侧：Memory -->
  <g filter="url(#sk)">
    <rect x="40" y="128" width="380" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="60" y="150" font-size="12" fill="#2e6e2e" font-weight="bold">Memory（内存层次）</text>
  <text x="60" y="172" font-size="12" fill="#2b2b2b">减少慢速内存访问，提高带宽利用率</text>

  <!-- 右侧：并行度 -->
  <g filter="url(#sk)">
    <rect x="440" y="128" width="380" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.35"/>
  </g>
  <text x="460" y="150" font-size="12" fill="#7a5415" font-weight="bold">并行度（执行模型）</text>
  <text x="460" y="172" font-size="12" fill="#2b2b2b">提高 occupancy，隐藏延迟，让计算单元不空转</text>
</svg>
