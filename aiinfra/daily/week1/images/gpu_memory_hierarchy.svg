<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','KaiTi','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrowDown2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,0 L5,8 z" fill="#e57373"/>
    </marker>
  </defs>
  <g filter="url(#sketch)">
  <rect width="780" height="560" fill="#fdfcf7"/>
  <text x="390" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">GPU 内存层次结构（RTX 5090 实测容量）</text>

  <!-- pyramid level 0: Register -->
  <polygon points="280,66 380,66 396,120 264,120" fill="#4a9d5f" opacity="0.45" stroke="#5cb86c" stroke-width="2"/>
  <text x="330" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">Register</text>
  <text x="330" y="110" text-anchor="middle" font-size="10" fill="#2b2b2b">~1 cycle</text>

  <!-- level 1: Shared Memory -->
  <polygon points="264,120 396,120 420,176 240,176" fill="#4a8edb" opacity="0.4" stroke="#6ab0ff" stroke-width="2"/>
  <text x="330" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">Shared Memory</text>
  <text x="330" y="164" text-anchor="middle" font-size="10" fill="#2b2b2b">~20-30 cycles</text>

  <!-- level 2: L1 Cache -->
  <polygon points="240,176 420,176 444,232 216,232" fill="#6ab0ff" opacity="0.18" stroke="#6ab0ff" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="330" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">L1 Cache</text>
  <text x="330" y="220" text-anchor="middle" font-size="10" fill="#2b2b2b">~20-30 cycles（自动）</text>

  <!-- level 3: L2 Cache -->
  <polygon points="216,232 444,232 468,288 192,288" fill="#9b6dd9" opacity="0.3" stroke="#b689e8" stroke-width="2"/>
  <text x="330" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">L2 Cache</text>
  <text x="330" y="276" text-anchor="middle" font-size="10" fill="#2b2b2b">~200 cycles</text>

  <!-- level 4: Global Memory -->
  <polygon points="192,288 468,288 492,344 168,344" fill="#e8a838" opacity="0.35" stroke="#e8a838" stroke-width="2"/>
  <text x="330" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">Global Memory (HBM)</text>
  <text x="330" y="332" text-anchor="middle" font-size="10" fill="#2b2b2b">~400-800 cycles</text>

  <!-- right detail cards -->
  <rect x="600" y="68" width="170" height="50" rx="5" fill="#4a9d5f" opacity="0.12" stroke="#5cb86c" stroke-width="1.5"/>
  <text x="610" y="86" font-size="11" font-weight="bold" fill="#4a9d5f">容量：256 KB/SM</text>
  <text x="610" y="101" font-size="10" fill="#666666">可编程：否（编译器分配）</text>
  <text x="610" y="114" font-size="10" fill="#666666">作用域：Thread</text>

  <rect x="600" y="123" width="170" height="50" rx="5" fill="#4a8edb" opacity="0.12" stroke="#6ab0ff" stroke-width="1.5"/>
  <text x="610" y="141" font-size="11" font-weight="bold" fill="#6ab0ff">容量：100 KB/SM</text>
  <text x="610" y="156" font-size="10" fill="#666666">可编程：是（显式管理）</text>
  <text x="610" y="169" font-size="10" fill="#666666">作用域：Block</text>

  <rect x="600" y="179" width="170" height="50" rx="5" fill="#6ab0ff" opacity="0.06" stroke="#6ab0ff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="610" y="197" font-size="11" font-weight="bold" fill="#6ab0ff">与 Shared Memory 同一块物理存储</text>
  <text x="610" y="212" font-size="10" fill="#666666">可编程：否（自动 cache）</text>
  <text x="610" y="225" font-size="10" fill="#666666">两者按比例动态划分</text>

  <rect x="600" y="235" width="170" height="50" rx="5" fill="#9b6dd9" opacity="0.12" stroke="#b689e8" stroke-width="1.5"/>
  <text x="610" y="253" font-size="11" font-weight="bold" fill="#9b6dd9">容量：96 MB</text>
  <text x="610" y="268" font-size="10" fill="#666666">可编程：否（自动 cache）</text>
  <text x="610" y="281" font-size="10" fill="#666666">作用域：所有 SM 共享</text>

  <rect x="600" y="291" width="170" height="50" rx="5" fill="#e8a838" opacity="0.12" stroke="#e8a838" stroke-width="1.5"/>
  <text x="610" y="309" font-size="11" font-weight="bold" fill="#e8a838">容量：32 GB GDDR7</text>
  <text x="610" y="324" font-size="10" fill="#666666">可编程：显式分配</text>
  <text x="610" y="337" font-size="10" fill="#666666">作用域：全局</text>

  <!-- left latency arrow -->
  <line x1="140" y1="76" x2="140" y2="338" stroke="#e57373" stroke-width="2.5" marker-end="url(#arrowDown2)"/>
  <text x="118" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#e57373" transform="rotate(-90, 118, 207)">延迟递增 &#8594;</text>
  <text x="112" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#5cb86c">快</text>
  <text x="112" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#e57373">慢</text>

  <!-- caption under pyramid -->
  <text x="330" y="370" text-anchor="middle" font-size="12" fill="#666666">越往下：容量越大 &#183; 延迟越高 &#183; 每字节越便宜</text>

  <!-- key insights -->
  <rect x="50" y="390" width="680" height="160" rx="10" fill="#fffdf5" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="70" y="415" font-size="13" font-weight="bold" fill="#6ab0ff">&#128161; 核心洞察</text>
  <text x="70" y="440" font-size="12" fill="#2b2b2b">&#8226; <tspan fill="#5cb86c" font-weight="bold">Register</tspan> 最快但不可控——编译器自动分配，程序员只能通过代码间接影响</text>
  <text x="70" y="462" font-size="12" fill="#2b2b2b">&#8226; <tspan fill="#6ab0ff" font-weight="bold">Shared Memory</tspan> 是可编程的高速缓存——显式管理，用得好可大幅减少 Global 访问</text>
  <text x="70" y="484" font-size="12" fill="#2b2b2b">&#8226; <tspan fill="#6ab0ff">L1/L2</tspan> 是自动缓存——透明工作但不可控；理解它们有助于预测性能</text>
  <text x="70" y="506" font-size="12" fill="#2b2b2b">&#8226; <tspan fill="#e8a838" font-weight="bold">Global Memory</tspan> 是瓶颈——大多数优化都是在减少对它的访问</text>
  <text x="70" y="532" font-size="12" fill="#e57373" font-weight="bold">优化核心思想：数据离计算单元越近越好，能不访问 HBM 就不访问</text>
  </g>
</svg>
