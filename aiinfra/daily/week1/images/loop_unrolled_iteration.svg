<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <g filter="url(#sketch)">

  <rect width="720" height="380" fill="#fdfcf7"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">#pragma unroll 16：一次迭代处理 16 个元素</text>

  <text x="90" y="100" text-anchor="end" font-size="15" font-weight="bold" fill="#2b2b2b">一次大迭代</text>
  <rect x="110" y="70" width="460" height="50" rx="6" fill="#4a8edb" opacity="0.25" stroke="#6ab0ff" stroke-width="2"/>
  <text x="340" y="100" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">加载 v0, v1, v2, … v15（16 个同时活跃）</text>

  <rect x="110" y="135" width="460" height="50" rx="6" fill="#4a9d5f" opacity="0.85" stroke="#5cb86c" stroke-width="2"/>
  <text x="340" y="165" text-anchor="middle" font-size="13" fill="#fdfcf7" font-weight="bold">acc += v0*v0+1; v1*v1+1; … v15*v15+1</text>

  <text x="340" y="215" text-anchor="middle" font-size="20" fill="#666666" font-weight="bold">…</text>

  <rect x="110" y="245" width="460" height="110" rx="8" fill="#fffdf5" stroke="#3a3a3a" stroke-width="2"/>
  <text x="340" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">特点</text>
  <text x="340" y="305" text-anchor="middle" font-size="13" fill="#666666">16 个 v 同时活着，需要更多寄存器</text>
  <text x="340" y="335" text-anchor="middle" font-size="13" fill="#e57373" font-weight="bold">寄存器用量大幅增加（可能触发 spilling）</text>

  </g>
</svg>
