<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrowEq" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
  </defs>
  <g filter="url(#sketch)">
  <rect width="680" height="200" fill="#fdfcf7"/>
  <text x="340" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">转置地址正确性验证</text>

  <!-- Output box -->
  <rect x="40" y="70" width="270" height="60" rx="6" fill="#6ab0ff" opacity="0.12" stroke="#6ab0ff" stroke-width="2"/>
  <text x="60" y="95" font-family="monospace" font-size="13" fill="#2b2b2b">out[(bx*TILE_DIM + b) * height</text>
  <text x="60" y="115" font-family="monospace" font-size="13" fill="#2b2b2b">    + (by*TILE_DIM + a)]</text>

  <!-- = sign -->
  <text x="335" y="105" text-anchor="middle" font-size="20" fill="#666666" font-weight="bold">=</text>

  <!-- Input box -->
  <rect x="360" y="70" width="290" height="60" rx="6" fill="#5cb86c" opacity="0.12" stroke="#5cb86c" stroke-width="2"/>
  <text x="380" y="95" font-family="monospace" font-size="13" fill="#2b2b2b">in[(by*TILE_DIM + a) * width</text>
  <text x="380" y="115" font-family="monospace" font-size="13" fill="#2b2b2b">    + (bx*TILE_DIM + b)]</text>

  <!-- Annotation -->
  <text x="175" y="155" text-anchor="middle" font-size="12" fill="#6ab0ff" font-weight="bold">输出位置 [j][i]</text>
  <text x="505" y="155" text-anchor="middle" font-size="12" fill="#5cb86c" font-weight="bold">输入位置 [i][j]</text>

  <text x="340" y="180" text-anchor="middle" font-size="13" fill="#666666">即 output[j][i] = input[i][j] —— 正是转置的定义</text>

  </g>
</svg>
