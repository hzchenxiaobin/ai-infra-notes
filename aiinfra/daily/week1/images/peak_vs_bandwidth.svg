<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','KaiTi','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <pattern id="idleHatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#e57373" opacity="0.05"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#e57373" stroke-width="1.5" opacity="0.4"/>
    </pattern>
  </defs>
  <g filter="url(#sketch)">
  <rect width="640" height="355" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">峰值算力 vs 带宽喂得饱的有效算力（RTX 5090）</text>
  <text x="575" y="64" text-anchor="end" font-size="11" fill="#666666">趋势：算力涨得比带宽快 → 这个差距逐代拉大</text>

  <!-- baseline -->
  <line x1="70" y1="260" x2="570" y2="260" stroke="#3a3a3a" stroke-width="2"/>

  <!-- peak compute bar -->
  <rect x="110" y="100" width="100" height="160" rx="4" fill="#4a9d5f" opacity="0.75" stroke="#5cb86c" stroke-width="2.5"/>
  <text x="160" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a9d5f">104.75 TFLOP/s</text>
  <text x="160" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">峰值 FP32 算力</text>
  <text x="160" y="302" text-anchor="middle" font-size="11" fill="#666666">计算单元全开的理论上限</text>

  <!-- dashed reference line at peak top -->
  <line x1="210" y1="100" x2="500" y2="100" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- idle compute (hatched) -->
  <rect x="400" y="100" width="100" height="156" fill="url(#idleHatch)" stroke="#e57373" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="450" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#e57373">计算单元</text>
  <text x="450" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#e57373">大量空闲</text>
  <text x="450" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#e57373">99.86%</text>

  <!-- bandwidth-limited effective bar -->
  <rect x="400" y="256" width="100" height="4" rx="1" fill="#e57373" stroke="#d06060" stroke-width="1"/>
  <text x="450" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#e57373">≈ 0.15 TFLOP/s</text>
  <text x="450" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">带宽喂得饱的有效算力</text>
  <text x="450" y="302" text-anchor="middle" font-size="11" fill="#666666">element-wise kernel 实际能到的高度</text>

  <!-- gap annotation -->
  <text x="305" y="160" text-anchor="middle" font-size="26" font-weight="bold" fill="#e8a838">&#x226B;</text>
  <text x="305" y="188" text-anchor="middle" font-size="12" fill="#666666">约 700 倍差距</text>

  <!-- bottom formula strip -->
  <rect x="55" y="318" width="530" height="28" rx="6" fill="#fffdf5" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="320" y="337" text-anchor="middle" font-size="12" fill="#2b2b2b">有效算力 = 带宽 &#215; AI = 1792 GB/s &#215; 0.083 FLOP/B &#8776; 0.15 TFLOP/s &#8810; 104.75 TFLOP/s</text>
  </g>
</svg>
