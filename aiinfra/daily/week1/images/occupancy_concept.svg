<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <g filter="url(#sketch)">

  <rect width="720" height="360" fill="#fdfcf7"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">Occupancy 概念</text>

  <!-- SM slot -->
  <rect x="80" y="56" width="560" height="140" rx="8" fill="#fffdf5" stroke="#3a3a3a" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">一个 SM 的 Warp 槽位（例如最大 32 个 warp）</text>

  <!-- Active warps: 16 -->
  <g fill="#4a9d5f" stroke="#5cb86c" stroke-width="2">
    <rect x="106" y="96" width="28" height="36"/>
    <rect x="138" y="96" width="28" height="36"/>
    <rect x="170" y="96" width="28" height="36"/>
    <rect x="202" y="96" width="28" height="36"/>
    <rect x="234" y="96" width="28" height="36"/>
    <rect x="266" y="96" width="28" height="36"/>
    <rect x="298" y="96" width="28" height="36"/>
    <rect x="330" y="96" width="28" height="36"/>
    <rect x="362" y="96" width="28" height="36"/>
    <rect x="394" y="96" width="28" height="36"/>
    <rect x="426" y="96" width="28" height="36"/>
    <rect x="458" y="96" width="28" height="36"/>
    <rect x="490" y="96" width="28" height="36"/>
    <rect x="522" y="96" width="28" height="36"/>
    <rect x="554" y="96" width="28" height="36"/>
    <rect x="586" y="96" width="28" height="36"/>
  </g>

  <!-- Empty slots: 16 -->
  <g fill="#3a3a3a" stroke="#555555" stroke-width="2">
    <rect x="106" y="140" width="28" height="36"/>
    <rect x="138" y="140" width="28" height="36"/>
    <rect x="170" y="140" width="28" height="36"/>
    <rect x="202" y="140" width="28" height="36"/>
    <rect x="234" y="140" width="28" height="36"/>
    <rect x="266" y="140" width="28" height="36"/>
    <rect x="298" y="140" width="28" height="36"/>
    <rect x="330" y="140" width="28" height="36"/>
    <rect x="362" y="140" width="28" height="36"/>
    <rect x="394" y="140" width="28" height="36"/>
    <rect x="426" y="140" width="28" height="36"/>
    <rect x="458" y="140" width="28" height="36"/>
    <rect x="490" y="140" width="28" height="36"/>
    <rect x="522" y="140" width="28" height="36"/>
    <rect x="554" y="140" width="28" height="36"/>
    <rect x="586" y="140" width="28" height="36"/>
  </g>

  <!-- Legend -->
  <rect x="168" y="208" width="14" height="14" fill="#4a9d5f" stroke="#5cb86c" stroke-width="2"/>
  <text x="190" y="220" font-size="13" font-weight="bold" fill="#5cb86c">Active Warps = 16</text>
  <rect x="420" y="208" width="14" height="14" fill="#3a3a3a" stroke="#555555" stroke-width="2"/>
  <text x="442" y="220" font-size="13" fill="#666666">Empty Slots = 16</text>

  <!-- Formula -->
  <rect x="80" y="244" width="560" height="84" rx="8" fill="#4a8edb" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="360" y="278" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Occupancy = 16 / 32 = 50%</text>
  <text x="360" y="306" text-anchor="middle" font-size="13" fill="#666666">分子：驻留的 Active Warp 数　分母：SM 支持的最大 Warp 数</text>
  </g>
</svg>
