<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <g filter="url(#sketch)">
  <rect width="680" height="300" fill="#fdfcf7"/>
  <text x="340" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">向量加法 C[i] = A[i] + B[i] 的计算强度</text>

  <!-- Memory read/write -->
  <text x="60" y="75" font-size="14" font-weight="bold" fill="#6ab0ff">内存读写</text>

  <rect x="60" y="85" width="100" height="40" rx="4" fill="#6ab0ff" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="110" y="110" text-anchor="middle" font-size="12" fill="#2b2b2b">读 A[i]</text>
  <text x="170" y="110" font-size="12" fill="#666666">4B</text>

  <text x="195" y="108" font-size="16" fill="#666666">+</text>

  <rect x="210" y="85" width="100" height="40" rx="4" fill="#6ab0ff" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#2b2b2b">读 B[i]</text>
  <text x="320" y="110" font-size="12" fill="#666666">4B</text>

  <text x="345" y="108" font-size="16" fill="#666666">+</text>

  <rect x="360" y="85" width="100" height="40" rx="4" fill="#e57373" opacity="0.2" stroke="#e57373" stroke-width="2"/>
  <text x="410" y="110" text-anchor="middle" font-size="12" fill="#2b2b2b">写 C[i]</text>
  <text x="470" y="110" font-size="12" fill="#666666">4B</text>

  <text x="495" y="108" font-size="16" fill="#666666">=</text>

  <rect x="510" y="85" width="110" height="40" rx="4" fill="#e8a838" opacity="0.3" stroke="#e8a838" stroke-width="2"/>
  <text x="565" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">12 bytes</text>

  <!-- FLOPs -->
  <text x="60" y="165" font-size="14" font-weight="bold" fill="#5cb86c">浮点运算</text>
  <rect x="60" y="175" width="120" height="40" rx="4" fill="#5cb86c" opacity="0.2" stroke="#5cb86c" stroke-width="2"/>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#2b2b2b">1 次加法</text>
  <text x="195" y="200" font-size="16" fill="#666666">=</text>
  <rect x="210" y="175" width="80" height="40" rx="4" fill="#5cb86c" opacity="0.3" stroke="#5cb86c" stroke-width="2"/>
  <text x="250" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">1 FLOP</text>

  <!-- AI result -->
  <line x1="60" y1="240" x2="620" y2="240" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="60" y="265" font-size="14" font-weight="bold" fill="#e57373">计算强度 AI =</text>
  <text x="180" y="265" font-size="14" fill="#2b2b2b">1 FLOP / 12 Bytes</text>
  <text x="340" y="265" font-size="16" fill="#666666">≈</text>
  <text x="370" y="265" font-size="18" font-weight="bold" fill="#e57373">0.083 FLOP/Byte</text>
  <text x="530" y="265" font-size="12" fill="#666666">(Ridge Point: 58.45)</text>

  </g>
</svg>
