<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','KaiTi','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <g filter="url(#sketch)">
  <rect width="680" height="392" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">向量加法 C[i] = A[i] + B[i] 的计算强度（float32）</text>

  <!-- 1. memory traffic per element -->
  <text x="60" y="66" font-size="14" font-weight="bold" fill="#6ab0ff">&#9312; 每个元素的内存流量</text>

  <rect x="60" y="78" width="100" height="42" rx="5" fill="#6ab0ff" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="110" y="104" text-anchor="middle" font-size="13" fill="#2b2b2b">读 A[i]</text>
  <text x="170" y="104" font-size="12" fill="#666666">4B</text>

  <text x="180" y="105" font-size="16" fill="#666666">+</text>

  <rect x="192" y="78" width="100" height="42" rx="5" fill="#6ab0ff" opacity="0.2" stroke="#6ab0ff" stroke-width="2"/>
  <text x="242" y="104" text-anchor="middle" font-size="13" fill="#2b2b2b">读 B[i]</text>
  <text x="302" y="104" font-size="12" fill="#666666">4B</text>

  <text x="312" y="105" font-size="16" fill="#666666">+</text>

  <rect x="324" y="78" width="100" height="42" rx="5" fill="#e57373" opacity="0.2" stroke="#e57373" stroke-width="2"/>
  <text x="374" y="104" text-anchor="middle" font-size="13" fill="#2b2b2b">写 C[i]</text>
  <text x="434" y="104" font-size="12" fill="#666666">4B</text>

  <text x="448" y="105" font-size="16" fill="#666666">=</text>

  <rect x="460" y="78" width="150" height="42" rx="5" fill="#e8a838" opacity="0.3" stroke="#e8a838" stroke-width="2"/>
  <text x="535" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">12 B / 元素</text>

  <!-- 2. compute per element -->
  <text x="60" y="158" font-size="14" font-weight="bold" fill="#5cb86c">&#9313; 每个元素的计算量</text>

  <rect x="60" y="170" width="140" height="42" rx="5" fill="#5cb86c" opacity="0.2" stroke="#5cb86c" stroke-width="2"/>
  <text x="130" y="196" text-anchor="middle" font-size="13" fill="#2b2b2b">1 次加法</text>

  <text x="215" y="197" font-size="16" fill="#666666">=</text>

  <rect x="228" y="170" width="90" height="42" rx="5" fill="#5cb86c" opacity="0.3" stroke="#5cb86c" stroke-width="2"/>
  <text x="273" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">1 FLOP</text>

  <text x="335" y="190" font-size="11" fill="#666666">element-wise：每元素只有 O(1) 次运算</text>
  <text x="335" y="206" font-size="11" fill="#666666">数据只访问一次，没有任何复用</text>

  <!-- divider -->
  <line x1="60" y1="238" x2="620" y2="238" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 3. AI result -->
  <text x="60" y="272" font-size="15" font-weight="bold" fill="#e57373">AI = 1 FLOP &#247; 12 B &#8776; 0.083 FLOP/Byte</text>

  <!-- comparison bars -->
  <text x="60" y="307" font-size="11.5" fill="#2b2b2b">element-wise</text>
  <rect x="200" y="296" width="5" height="14" rx="1" fill="#e57373" stroke="#d06060" stroke-width="0.8"/>
  <text x="216" y="307" font-size="11" fill="#e57373" font-weight="bold">0.083</text>
  <text x="216" y="322" font-size="9.5" fill="#666666">（按真实比例不足 1 像素）</text>

  <text x="60" y="337" font-size="11.5" fill="#2b2b2b">RTX 5090 平衡点</text>
  <rect x="200" y="326" width="370" height="14" rx="2" fill="#4a9d5f" opacity="0.7" stroke="#5cb86c" stroke-width="1.5"/>
  <text x="580" y="337" font-size="11" fill="#5cb86c" font-weight="bold">58.45</text>

  <!-- bottom line -->
  <text x="60" y="372" font-size="13" font-weight="bold" fill="#e57373">只有平衡点的 0.14% —— 数据喂不饱，计算单元 99.86% 的时间在等</text>
  </g>
</svg>
