<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI',cursive">
  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <g filter="url(#sketch)">

  <rect width="720" height="360" fill="#fdfcf7"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">低 Occupancy：所有 Warp 都在等内存</text>

  <text x="120" y="100" text-anchor="end" font-size="15" font-weight="bold" fill="#2b2b2b">warp 0</text>
  <rect x="140" y="80" width="460" height="36" fill="#e57373" opacity="0.5" stroke="#e57373" stroke-width="2"/>
  <text x="370" y="104" text-anchor="middle" font-size="14" fill="#2b2b2b">等内存中…</text>

  <text x="120" y="155" text-anchor="end" font-size="15" font-weight="bold" fill="#2b2b2b">warp 1</text>
  <rect x="140" y="135" width="460" height="36" fill="#e57373" opacity="0.5" stroke="#e57373" stroke-width="2"/>
  <text x="370" y="159" text-anchor="middle" font-size="14" fill="#2b2b2b">等内存中…</text>

  <text x="120" y="210" text-anchor="end" font-size="15" font-weight="bold" fill="#2b2b2b">warp 2</text>
  <rect x="140" y="190" width="460" height="36" fill="#e57373" opacity="0.5" stroke="#e57373" stroke-width="2"/>
  <text x="370" y="214" text-anchor="middle" font-size="14" fill="#2b2b2b">等内存中…</text>

  <text x="120" y="265" text-anchor="end" font-size="15" font-weight="bold" fill="#2b2b2b">warp 3</text>
  <rect x="140" y="245" width="460" height="36" fill="#e57373" opacity="0.5" stroke="#e57373" stroke-width="2"/>
  <text x="370" y="269" text-anchor="middle" font-size="14" fill="#2b2b2b">也等内存中…</text>

  <rect x="140" y="300" width="460" height="40" rx="8" fill="#3a3a3a" opacity="0.85" stroke="#555555" stroke-width="2"/>
  <text x="370" y="326" text-anchor="middle" font-size="15" fill="#fdfcf7" font-weight="bold">SM 计算单元空转（无可切换的 warp）</text>

  </g>
</svg>
