<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">迭代中序：一路向左压栈，弹栈计数</text>

  <!-- 入口 -->
  <rect x="190" y="50" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="12" fill="#333">cur = root; 栈空</text>

  <path d="M 290 84 L 290 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层判断 -->
  <polygon points="290,104 410,146 290,188 170,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="142" text-anchor="middle" font-size="12" fill="#333">cur != null</text>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#888">或栈非空？</text>

  <path d="M 410 146 L 470 146" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="138" font-size="10" fill="#b85450">否</text>
  <rect x="470" y="130" width="90" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="515" y="151" text-anchor="middle" font-size="11" fill="#888">结束</text>

  <path d="M 290 188 L 290 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="200" font-size="10" fill="#82b366">是</text>

  <!-- 一路向左压栈 -->
  <rect x="140" y="208" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="230" text-anchor="middle" font-size="11" fill="#333">while (cur) { push(cur); cur = cur.left }</text>

  <path d="M 290 242 L 290 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 弹栈 -->
  <rect x="160" y="262" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="11" fill="#333">cur = pop(); k--</text>

  <path d="M 290 296 L 290 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 k -->
  <polygon points="290,314 380,346 290,378 200,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="11" fill="#333">k == 0 ?</text>

  <path d="M 200 346 L 130 346" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="338" font-size="10" fill="#b85450">是</text>
  <rect x="40" y="330" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="85" y="351" text-anchor="middle" font-size="11" fill="#333">返回 cur.val</text>

  <path d="M 290 378 L 290 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="390" font-size="10" fill="#82b366">否</text>

  <!-- 转右 -->
  <rect x="200" y="386" width="180" height="0" fill="none"/>

  <rect x="380" y="330" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="460" y="349" text-anchor="middle" font-size="10" fill="#333">cur = cur.right</text>
  <path d="M 380 346 L 372 346" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回到外层 -->
  <path d="M 460 330 L 460 80 L 410 80" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="200" font-size="10" fill="#b85450" transform="rotate(-90 468 200)">循环</text>
</svg>
