<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">状态 = (位置, 行动奇偶) — 每个格子拆成两层</text>

  <!-- Layer 1: odd (action奇数) -->
  <text x="50" y="70" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">奇数层 (p=1)：右/下免费，左/上加罚</text>
  <g filter="url(#rough2)">
    <rect x="50" y="85" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="80" y="110" text-anchor="middle" font-size="11" fill="#446688">(0,0)</text>
    <rect x="130" y="85" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="110" text-anchor="middle" font-size="11" fill="#446688">(0,1)</text>
    <rect x="50" y="140" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="80" y="165" text-anchor="middle" font-size="11" fill="#446688">(1,0)</text>
    <rect x="130" y="140" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="165" text-anchor="middle" font-size="11" fill="#446688">(1,1)</text>
  </g>
  <!-- green arrows for allowed directions -->
  <path d="M110 105 L128 105" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M80 125 L80 138" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="225" y="108" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→↓ 免费</text>

  <!-- Layer 2: even (action偶数) -->
  <text x="340" y="70" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">偶数层 (p=0)：左/上免费，右/下加罚</text>
  <g filter="url(#rough2)">
    <rect x="340" y="85" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="370" y="110" text-anchor="middle" font-size="11" fill="#d6a040">(0,0)</text>
    <rect x="420" y="85" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="450" y="110" text-anchor="middle" font-size="11" fill="#d6a040">(0,1)</text>
    <rect x="340" y="140" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="370" y="165" text-anchor="middle" font-size="11" fill="#d6a040">(1,0)</text>
    <rect x="420" y="140" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="450" y="165" text-anchor="middle" font-size="11" fill="#d6a040">(1,1)</text>
  </g>
  <path d="M420 105 L402 105" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M370 140 L370 127" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="490" y="108" font-size="10" fill="#4a7a3a" filter="url(#rough2)">←↑ 免费</text>

  <!-- vertical parity-flip arrows (wait) -->
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">等待：原地翻转奇偶，代价 = penalty[i][j]</text>
  <path d="M190 105 Q280 60 335 105" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M335 160 Q280 205 190 160" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Dijkstra box -->
  <rect x="80" y="230" width="400" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Dijkstra 最短路</text>
  <text x="100" y="285" font-size="12" fill="#333" filter="url(#rough2)">• 状态数 = 2 × m × n ≤ 2×10⁵</text>
  <text x="100" y="305" font-size="12" fill="#333" filter="url(#rough2)">• 每状态 5 条边：等待 + 4 方向移动</text>
  <text x="100" y="325" font-size="12" fill="#333" filter="url(#rough2)">• 边权 ≥ 0 → Dijkstra 正确</text>
  <text x="100" y="345" font-size="12" fill="#333" filter="url(#rough2)">• 复杂度 O(mn log(mn))</text>
</svg>
