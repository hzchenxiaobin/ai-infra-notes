<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：pre=[8,5,1,7,10,12]</text>

  <!-- 前序数组带指针 -->
  <text x="40" y="58" font-size="12" fill="#888">preorder：</text>
  <rect x="40" y="66" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="88" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="86" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="136" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="184" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="86" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="232" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="86" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="280" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="86" text-anchor="middle" font-size="12" fill="#333">12</text>

  <text x="62" y="112" text-anchor="middle" font-size="10" fill="#b85450">i=0</text>
  <text x="110" y="112" text-anchor="middle" font-size="10" fill="#446688">i=1</text>
  <text x="158" y="112" text-anchor="middle" font-size="10" fill="#446688">i=2</text>
  <text x="206" y="112" text-anchor="middle" font-size="10" fill="#446688">i=3</text>
  <text x="254" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a">i=4</text>
  <text x="302" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a">i=5</text>

  <!-- 构造树 -->
  <circle cx="290" cy="160" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <text x="330" y="156" font-size="10" fill="#888">i=0 (-∞,+∞)</text>

  <line x1="276" y1="170" x2="210" y2="210" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="304" y1="170" x2="370" y2="210" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="200" cy="220" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="224" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="140" y="220" font-size="10" fill="#888">i=1 (-∞,8)</text>

  <circle cx="380" cy="220" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="224" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="420" y="220" font-size="10" fill="#888">i=4 (8,+∞)</text>

  <line x1="190" y1="232" x2="155" y2="270" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="210" y1="232" x2="245" y2="270" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="390" y1="232" x2="425" y2="270" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="150" cy="282" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="286" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="110" y="300" font-size="9" fill="#888">i=2 (-∞,5)</text>

  <circle cx="250" cy="282" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="286" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="210" y="300" font-size="9" fill="#888">i=3 (5,8)</text>

  <circle cx="430" cy="282" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="286" text-anchor="middle" font-size="10" fill="#333">12</text>
  <text x="390" y="300" font-size="9" fill="#888">i=5 (10,+∞)</text>

  <!-- 说明 -->
  <rect x="40" y="320" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="344" font-size="12" fill="#333" font-weight="bold">指针推进轨迹（递归先左后右）：</text>
  <text x="60" y="364" font-size="11" fill="#555">8(根) → 5(8左) → 1(5左,叶子,回溯) → 7(5右,叶子,回溯到8) → 10(8右) → 12(10右,叶子)</text>
  <text x="60" y="380" font-size="11" fill="#b85450" font-weight="bold">值域约束让指针自动跳过不属于当前子树的元素</text>
</svg>
