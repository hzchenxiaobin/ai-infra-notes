<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>
  <text x="270" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">贪心填位：每位放尽可能大的数字</text>

  <text x="270" y="62" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">n=3, s=18 → 每位最多 9，余下位数须能容纳剩余和</text>

  <!-- digit boxes -->
  <g filter="url(#rough2)">
    <rect x="80" y="90" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="170" y="90" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="260" y="90" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>

  <!-- step 1: first digit = min(9, s - 0*9) but ensure remainder fit -->
  <text x="115" y="135" text-anchor="middle" font-size="28" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <text x="205" y="135" text-anchor="middle" font-size="28" font-weight="bold" fill="#d6a040" filter="url(#rough2)">9</text>
  <text x="295" y="135" text-anchor="middle" font-size="28" font-weight="bold" fill="#d6a040" filter="url(#rough2)">0</text>

  <text x="115" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">放 9</text>
  <text x="205" y="180" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">放 9</text>
  <text x="295" y="180" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">放 0</text>

  <text x="115" y="200" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">余 s=9</text>
  <text x="205" y="200" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">余 s=0</text>
  <text x="295" y="200" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">余 s=0</text>

  <!-- constraint arrow -->
  <path d="M115 215 L295 215" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="205" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每位 d ≤ 9，且剩余 (n-i-1) 位能容纳 (s-d) → d ≤ s 即可</text>

  <!-- infeasible case -->
  <rect x="60" y="255" width="420" height="65" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">不可行判断</text>
  <text x="270" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s &gt; 9n → 每位都填 9 也不够 → 返回 -1</text>
  <text x="270" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">特例 s=0 → 唯一非负整数 0（返回 "0"，非 "00...0"）</text>
</svg>
