<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前序第二元素 = 左子树根，定位后序划分</text>

  <!-- 前序 -->
  <text x="40" y="62" font-size="12" fill="#888">前序 preorder:</text>
  <rect x="40" y="70" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="84" y="70" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="128" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="91" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="172" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="91" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="216" y="70" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="91" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="260" y="70" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="304" y="70" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="91" text-anchor="middle" font-size="12" fill="#333">7</text>

  <text x="60" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 根</text>
  <text x="104" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 左子树根</text>
  <text x="192" y="120" text-anchor="middle" font-size="10" fill="#446688">左子树前序</text>
  <text x="270" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a">右子树前序</text>

  <!-- 后序 -->
  <text x="40" y="160" font-size="12" fill="#888">后序 postorder:</text>
  <rect x="40" y="168" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="189" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="84" y="168" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="189" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="128" y="168" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="172" y="168" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="189" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="216" y="168" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="189" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="260" y="168" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="304" y="168" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <text x="104" y="218" text-anchor="middle" font-size="10" fill="#446688">左子树后序</text>
  <text x="148" y="218" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 左根在此</text>
  <text x="236" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a">右子树后序</text>
  <text x="324" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 根</text>

  <!-- 连线 -->
  <path d="M 104 124 L 148 166" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="40" y="250" width="500" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="12" fill="#333" font-weight="bold">分治步骤：</text>
  <text x="60" y="294" font-size="11" fill="#555">① 根 = preorder[preL]；左子树根 = preorder[preL+1]</text>
  <text x="60" y="312" font-size="11" fill="#555">② 哈希查 mid = idx[左子树根]（在后序中的位置）</text>
  <text x="60" y="330" font-size="11" fill="#555">③ 左子树：后序 [postL, mid]，节点数 k = mid-postL+1；前序 [preL+1, preL+k]</text>
  <text x="60" y="348" font-size="11" fill="#555">④ 右子树：后序 [mid+1, postR-1]；前序 [preL+k+1, preR]</text>
  <text x="60" y="366" font-size="11" fill="#555">⑤ 递归构造左右子树（先左后右）</text>
</svg>
