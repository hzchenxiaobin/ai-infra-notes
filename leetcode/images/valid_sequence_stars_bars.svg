<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">插板法：n=5, k=3 的两步变换</text>

  <!-- Step 1: 正整数序列 -->
  <text x="280" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 全集：x₁+x₂+x₃=5，x_i ≥ 1（插板法）</text>

  <!-- balls -->
  <g filter="url(#rough2)">
    <circle cx="50" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="80" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="110" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="140" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="170" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="110" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5 个球（代表 n=5）</text>

  <!-- 板 -->
  <g filter="url(#rough2)">
    <rect x="62" y="82" width="3" height="26" fill="#b85450"/>
    <rect x="122" y="82" width="3" height="26" fill="#b85450"/>
  </g>
  <text x="195" y="100" font-size="11" fill="#b85450" filter="url(#rough2)">← 插 2 块板（k−1=2）</text>

  <text x="280" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">= C(5−1, 3−1) = C(4,2) = 6 种</text>

  <!-- divider -->
  <path d="M60 150 L500 150" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Step 2: 全奇序列 -->
  <text x="280" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">② 全奇：x_i = 2z_i + 1，代入 2Σz_i = n−k = 2</text>

  <!-- pairs -->
  <g filter="url(#rough2)">
    <!-- group 1: z1 -->
    <rect x="50" y="205" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="63" y="223" text-anchor="middle" font-size="12" fill="#d6a040">1</text>
    <text x="40" y="223" text-anchor="end" font-size="10" fill="#888">z₁</text>
    <!-- group 2: z2 -->
    <rect x="86" y="205" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="99" y="223" text-anchor="middle" font-size="12" fill="#d6a040">1</text>
    <text x="76" y="223" text-anchor="end" font-size="10" fill="#888">z₂</text>
    <!-- group 3: z3 -->
    <rect x="122" y="205" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="135" y="223" text-anchor="middle" font-size="12" fill="#d6a040">1</text>
    <text x="112" y="223" text-anchor="end" font-size="10" fill="#888">z₃</text>
  </g>
  <text x="180" y="223" font-size="11" fill="#333" filter="url(#rough2)">每项先放 1（共 k=3），剩余 (n−k)/2=1 个“2-球”</text>

  <!-- distribute one 2-ball -->
  <g filter="url(#rough2)">
    <circle cx="70" cy="270" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="70" y="274" text-anchor="middle" font-size="10" fill="#446688">2</text>
  </g>
  <text x="90" y="274" font-size="11" fill="#333" filter="url(#rough2)">把这个“2-球”放进某个 z_i → 又是插板</text>

  <text x="280" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">= C((n−k)/2 + k − 1, k−1) = C(1+2, 2) = C(3,2) = 3 种</text>

  <!-- divider -->
  <path d="M60 325 L500 325" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="120" y="345" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 6 − 3 = 3 ✓</text>
</svg>
