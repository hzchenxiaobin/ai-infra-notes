<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [3,9,20,null,null,15,7]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">自底向上返回高度，遇到不平衡立即返回 -1</text>

  <!-- 树 -->
  <circle cx="200" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="228" y="85" font-size="10" fill="#b85450" font-weight="bold">h=3</text>

  <circle cx="140" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="160" y="145" font-size="9" fill="#888">h=1</text>

  <circle cx="270" cy="140" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="145" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">20</text>
  <text x="295" y="145" font-size="9" fill="#888">h=2</text>

  <line x1="188" y1="92" x2="150" y2="128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="212" y1="92" x2="258" y2="128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="230" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">15</text>
  <text x="248" y="205" font-size="9" fill="#888">h=1</text>

  <circle cx="310" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="328" y="205" font-size="9" fill="#888">h=1</text>

  <line x1="262" y1="152" x2="236" y2="190" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="278" y1="152" x2="304" y2="190" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 演算表 -->
  <rect x="370" y="64" width="170" height="190" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="455" y="84" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">自底向上返回</text>
  <line x1="370" y1="92" x2="540" y2="92" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="380" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">节点</text>
  <text x="440" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">lh</text>
  <text x="475" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">rh</text>
  <text x="505" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">返回</text>
  <line x1="370" y1="116" x2="540" y2="116" stroke="#ccc" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="380" y="134" font-size="11" fill="#333">9（叶子）</text>
  <text x="440" y="134" font-size="11" fill="#888">0</text>
  <text x="475" y="134" font-size="11" fill="#888">0</text>
  <text x="505" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="380" y="154" font-size="11" fill="#333">15（叶子）</text>
  <text x="440" y="154" font-size="11" fill="#888">0</text>
  <text x="475" y="154" font-size="11" fill="#888">0</text>
  <text x="505" y="154" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="380" y="174" font-size="11" fill="#333">7（叶子）</text>
  <text x="440" y="174" font-size="11" fill="#888">0</text>
  <text x="475" y="174" font-size="11" fill="#888">0</text>
  <text x="505" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="380" y="194" font-size="11" fill="#333">20</text>
  <text x="440" y="194" font-size="11" fill="#888">1</text>
  <text x="475" y="194" font-size="11" fill="#888">1</text>
  <text x="505" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="380" y="214" font-size="11" fill="#333">3</text>
  <text x="440" y="214" font-size="11" fill="#888">1</text>
  <text x="475" y="214" font-size="11" fill="#888">2</text>
  <text x="505" y="214" font-size="11" fill="#b85450" font-weight="bold">3 ⭐</text>

  <line x1="370" y1="224" x2="540" y2="224" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="455" y="242" text-anchor="middle" font-size="10" fill="#888">|1-2|=1 ≤ 1 → 平衡</text>

  <!-- 结论 -->
  <rect x="30" y="250" width="320" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="274" font-size="12" fill="#4a7a3a" font-weight="bold">结论：</text>
  <text x="50" y="296" font-size="11" fill="#555">• 每个节点 |lh-rh| ≤ 1，无 -1 返回</text>
  <text x="50" y="314" font-size="11" fill="#555">• 根节点返回 3（≠ -1）→ 是平衡二叉树</text>
  <text x="50" y="332" font-size="11" fill="#b85450" font-weight="bold">最终结果 = true ✅</text>
</svg>
