<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单指针相邻比较：相等跳过 next，不等前进</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">已排序 → 重复必相邻，只看 curr 与 curr.next 即可</text>

  <!-- ===== 链表节点：1→1→2 ===== -->
  <g font-size="13">
    <rect x="60" y="74" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="88" y="96" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="116" y1="91" x2="144" y2="91" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="150" y="74" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="178" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="178" y="66" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">重复！</text>

    <rect x="240" y="74" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="268" y="96" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="296" y1="91" x2="324" y2="91" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="336" y="96" font-size="12" fill="#888">∅</text>
  </g>

  <!-- curr 指针 -->
  <rect x="60" y="124" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">curr</text>
  <path d="M 88 124 L 88 110" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- 跳过箭头：从第1个1 指向 2 -->
  <path d="M 116 86 Q 178 50 240 86" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="44" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">curr.next = curr.next.next（跳过重复）</text>

  <!-- ===== 跳过后状态 ===== -->
  <text x="40" y="184" font-size="12" fill="#444" font-weight="bold">跳过后：</text>
  <g font-size="13">
    <rect x="120" y="170" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="148" y="192" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="176" y1="187" x2="204" y2="187" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="210" y="170" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="238" y="192" text-anchor="middle" fill="#333" font-weight="bold">2</text>
  </g>
  <rect x="120" y="220" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="148" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">curr</text>
  <text x="290" y="190" font-size="10" fill="#4a7a3a">curr 不动，下一轮比 1 和 2 → 不等 → curr 前进</text>

  <!-- ===== 规则总结 ===== -->
  <rect x="30" y="264" width="520" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="284" font-size="11" fill="#8a6a20" font-weight="bold">两条规则：</text>
  <text x="44" y="304" font-size="11" fill="#555">① curr.val == curr.next.val → curr.next = curr.next.next（跳过，curr 不动）</text>
  <text x="44" y="324" font-size="11" fill="#555">② curr.val != curr.next.val → curr = curr.next（不重复，前进）</text>
  <text x="44" y="346" font-size="11" fill="#d6a040" font-weight="bold">关键：相等时 curr 不前进，继续和新 curr.next 比（处理连续重复）</text>
</svg>
