<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历找 child → 递归扁平化 → 插入接回 → 继续</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">O(n) 时间，O(n) 递归空间（嵌套层数）</text>

  <!-- Start -->
  <rect x="190" y="62" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">curr = head</text>

  <path d="M 280 92 L 280 110" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: curr 非空? -->
  <polygon points="280,112 370,150 280,188 190,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">curr != null?</text>
  <text x="280" y="160" text-anchor="middle" font-size="9" fill="#8a6a20">（还有节点?）</text>

  <!-- No: return head -->
  <text x="170" y="146" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 190 150 L 110 150" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="134" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="75" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return</text>
  <text x="75" y="166" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">head</text>

  <!-- Yes -->
  <text x="296" y="204" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 188 L 280 206" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: child 非空? -->
  <polygon points="280,208 380,246 280,284 180,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">curr.child != null?</text>

  <!-- No: curr 前进 -->
  <text x="160" y="242" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 246 L 120 246" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="230" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">curr = curr.next</text>
  <!-- loop back to curr!=null? -->
  <path d="M 70 262 L 70 360 L 470 360 L 470 150 L 370 150" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes: 递归 + 插入 -->
  <text x="296" y="300" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 284 L 280 304" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="306" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">递归 flatten(child) → childHead</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">找 childTail；四处接指针；curr.child=null</text>

  <path d="M 280 350 L 280 368" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- curr = next（跳过子链）-->
  <rect x="150" y="370" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="389" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">curr = next（跳过子链继续）</text>

  <!-- loop back -->
  <path d="M 280 400 L 280 420 L 470 420 L 470 150 L 370 150" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="288" font-size="8" fill="#888">继续</text>
  <text x="478" y="300" font-size="8" fill="#888">遍历</text>

  <!-- 提示 -->
  <rect x="30" y="436" width="500" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="454" font-size="11" fill="#b85450" font-weight="bold">关键：插入后 curr 跳到 next（跳过子链），子链已递归扁平无需重走</text>
</svg>
