<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 演算：等待翻转奇偶 (m=2,n=2,pen=[[0,7],[3,2]])</text>

  <!-- Step 0: start -->
  <g filter="url(#rough2)">
    <rect x="40" y="55" width="70" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="75" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">(0,0)</text>
    <text x="75" y="98" text-anchor="middle" font-size="10" fill="#888">entry=1</text>
  </g>
  <text x="75" y="48" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">起点 p=1(奇)</text>
  <text x="75" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">代价=1</text>

  <!-- arrow step 1: wait -->
  <path d="M115 82 L155 82" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="135" y="74" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">等待</text>
  <text x="135" y="95" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">+0</text>

  <!-- Step 1: (0,0) p=0 -->
  <g filter="url(#rough2)">
    <rect x="160" y="55" width="70" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <text x="195" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">(0,0)</text>
    <text x="195" y="98" text-anchor="middle" font-size="10" fill="#888">pen=0</text>
  </g>
  <text x="195" y="48" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">p=0(偶)</text>
  <text x="195" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">累计=1</text>

  <!-- arrow step 2: move right (violates even) -->
  <path d="M235 82 L275 82" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="255" y="74" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">→违例</text>
  <text x="255" y="95" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">+2+0</text>

  <!-- Step 2: (0,1) p=1 -->
  <g filter="url(#rough2)">
    <rect x="280" y="55" width="70" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="315" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">(0,1)</text>
    <text x="315" y="98" text-anchor="middle" font-size="10" fill="#888">entry=2</text>
  </g>
  <text x="315" y="48" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">p=1(奇)</text>
  <text x="315" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">累计=3</text>

  <!-- arrow step 3: move down (follows odd) -->
  <path d="M355 82 L395 82" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="375" y="74" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">↓免费</text>
  <text x="375" y="95" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+4</text>

  <!-- Step 3: (1,1) target -->
  <g filter="url(#rough2)">
    <rect x="400" y="55" width="70" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="5"/>
    <text x="435" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">(1,1)</text>
    <text x="435" y="98" text-anchor="middle" font-size="10" fill="#888">entry=4</text>
  </g>
  <text x="435" y="48" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">终点</text>
  <text x="435" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">累计=7 ✓</text>

  <!-- Comparison: direct path without wait -->
  <path d="M75 200 L75 230" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">对比：不等待直接走会怎样？</text>

  <g filter="url(#rough2)">
    <rect x="40" y="240" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="75" y="265" text-anchor="middle" font-size="11" fill="#446688">(0,0) p=1</text>
  </g>
  <path d="M115 260 L155 260" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="135" y="253" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">→免费</text>

  <g filter="url(#rough2)">
    <rect x="160" y="240" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="195" y="265" text-anchor="middle" font-size="11" fill="#446688">(0,1) p=0</text>
  </g>
  <path d="M235 260 L275 260" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="255" y="253" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">↓违例</text>
  <text x="255" y="280" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">+4+7</text>

  <g filter="url(#rough2)">
    <rect x="280" y="240" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="315" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a">(1,1)</text>
  </g>
  <text x="315" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">累计=1+2+4+7=14 ✗</text>

  <text x="420" y="265" font-size="12" fill="#333" filter="url(#rough2)">← 更贵！</text>

  <!-- insight -->
  <rect x="40" y="320" width="500" height="65" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">关键洞察</text>
  <text x="290" y="365" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">penalty[0][0]=0 时，等待几乎免费翻转奇偶，</text>
  <text x="290" y="380" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">把"违例移动(+penalty)"变成"等待(+0) + 免费移动"</text>
</svg>
