<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：DFS 与 BFS 两条路线</text>

  <!-- 左半：DFS -->
  <rect x="20" y="46" width="250" height="340" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">方案 A：递归 DFS</text>

  <rect x="50" y="84" width="190" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="106" text-anchor="middle" font-size="11" fill="#333">node == null ? 返回 0</text>

  <line x1="145" y1="118" x2="145" y2="136" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="138" width="190" height="50" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="158" text-anchor="middle" font-size="11" fill="#333">maxD = 0</text>
  <text x="145" y="176" text-anchor="middle" font-size="11" fill="#333">for child in children:</text>

  <line x1="145" y1="188" x2="145" y2="206" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="208" width="190" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="228" text-anchor="middle" font-size="11" fill="#333">maxD = max(maxD,</text>
  <text x="145" y="244" text-anchor="middle" font-size="11" fill="#333">         dfs(child))</text>

  <line x1="145" y1="252" x2="145" y2="270" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="272" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="145" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return maxD + 1</text>

  <text x="145" y="332" text-anchor="middle" font-size="10" fill="#888">空间 O(h)，三行写完</text>

  <!-- 右半：BFS -->
  <rect x="290" y="46" width="250" height="340" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">方案 B：迭代 BFS</text>

  <rect x="320" y="84" width="190" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="106" text-anchor="middle" font-size="11" fill="#333">queue = [root], depth = 0</text>

  <line x1="415" y1="118" x2="415" y2="136" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="138" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="160" text-anchor="middle" font-size="11" fill="#333">while queue 非空:</text>

  <line x1="415" y1="172" x2="415" y2="190" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="192" width="190" height="44" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="212" text-anchor="middle" font-size="11" fill="#333">size = len(queue)</text>
  <text x="415" y="228" text-anchor="middle" font-size="11" fill="#333">depth += 1</text>

  <line x1="415" y1="236" x2="415" y2="254" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="256" width="190" height="50" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="276" text-anchor="middle" font-size="11" fill="#333">for i in range(size):</text>
  <text x="415" y="292" text-anchor="middle" font-size="11" fill="#333">  出队，所有 children 入队</text>

  <line x1="415" y1="306" x2="415" y2="324" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="326" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return depth</text>

  <text x="415" y="376" text-anchor="middle" font-size="10" fill="#888">空间 O(最宽层)，避免深树栈溢出</text>
</svg>
