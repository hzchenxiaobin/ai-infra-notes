<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分治构造：递归流程</text>

  <!-- 入口 -->
  <rect x="170" y="50" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="12" fill="#333">build(L, R)</text>

  <path d="M 290 84 L 290 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,104 410,146 290,188 170,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="142" text-anchor="middle" font-size="12" fill="#333">L &gt; R ?</text>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#888">区间为空</text>

  <path d="M 410 146 L 470 146 L 470 92" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="138" font-size="10" fill="#b85450">是</text>
  <rect x="410" y="76" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="470" y="97" text-anchor="middle" font-size="12" fill="#888">返回 null</text>

  <path d="M 290 188 L 290 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="202" font-size="10" fill="#82b366">否</text>

  <!-- 取中点 -->
  <rect x="150" y="210" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="232" text-anchor="middle" font-size="11" fill="#333">mid = L + (R - L) / 2；建节点 root(nums[mid])</text>

  <path d="M 290 244 L 290 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左右递归 -->
  <rect x="60" y="264" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="286" text-anchor="middle" font-size="11" fill="#333">root.left = build(L, mid-1)</text>

  <rect x="320" y="264" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="286" text-anchor="middle" font-size="11" fill="#333">root.right = build(mid+1, R)</text>

  <path d="M 290 298 L 290 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="190" y="318" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#333">return root</text>

  <!-- 说明 -->
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#888">每层取中点 ⇒ 左右子树节点数最多差 1 ⇒ 高度平衡</text>
</svg>
