<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三种基本情况：先判结构，再判值</text>

  <!-- 情况1：都空 -->
  <rect x="20" y="50" width="160" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情况 1：都空</text>
  <text x="100" y="92" text-anchor="middle" font-size="28" fill="#ccc">∅ ∅</text>
  <text x="100" y="120" text-anchor="middle" font-size="11" fill="#555">p == null</text>
  <text x="100" y="136" text-anchor="middle" font-size="11" fill="#555">q == null</text>
  <rect x="40" y="150" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true ✅</text>

  <!-- 情况2：一空一非空 -->
  <rect x="200" y="50" width="160" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情况 2：一空一非空</text>
  <circle cx="250" cy="100" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="315" y="105" text-anchor="middle" font-size="20" fill="#ccc">∅</text>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#555">结构不同</text>
  <rect x="220" y="150" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false ❌</text>

  <!-- 情况3：都非空 -->
  <rect x="380" y="50" width="160" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="72" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">情况 3：都非空</text>
  <circle cx="430" cy="100" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="490" cy="100" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="105" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="460" y="138" text-anchor="middle" font-size="11" fill="#555">先比值，再递归</text>
  <rect x="400" y="150" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="460" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">比 val + 递归</text>

  <!-- 判断顺序 -->
  <rect x="30" y="200" width="500" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="224" font-size="12" fill="#446688" font-weight="bold">判断顺序很重要（短路求值）：</text>

  <text x="50" y="250" font-size="11" fill="#333" font-family="monospace">① if (p == null &amp;&amp; q == null) return true;   // 先判都空</text>
  <text x="50" y="270" font-size="11" fill="#b85450" font-family="monospace">② if (p == null || q == null) return false;  // 再判一空一非空</text>
  <text x="50" y="290" font-size="11" fill="#333" font-family="monospace">③ if (p.val != q.val) return false;          // 再判值不同</text>
  <text x="50" y="310" font-size="11" fill="#4a7a3a" font-family="monospace">④ return isSame(p.left, q.left)</text>
  <text x="50" y="328" font-size="11" fill="#4a7a3a" font-family="monospace">       &amp;&amp; isSame(p.right, q.right);          // 递归左右</text>

  <text x="50" y="350" font-size="10" fill="#888">⚠️ ①必须在②之前：否则都空时 ②的 || 也会触发返回 false</text>
</svg>
