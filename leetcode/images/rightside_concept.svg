<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">右视图：从右侧看树，每层最右节点</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">站在树右侧看过去，能看到的节点就是每层最右者</text>

  <!-- 树 -->
  <circle cx="200" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="85" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <circle cx="130" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <circle cx="290" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <line x1="188" y1="92" x2="138" y2="128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="212" y1="92" x2="278" y2="128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="250" cy="210" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="215" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>

  <circle cx="330" cy="210" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="215" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>

  <line x1="280" y1="152" x2="256" y2="198" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="300" y1="152" x2="324" y2="198" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 右侧视线 -->
  <line x1="430" y1="60" x2="430" y2="240" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="440" y="74" font-size="11" fill="#b85450" font-weight="bold">视线方向</text>
  <text x="440" y="88" font-size="11" fill="#b85450" font-weight="bold">← 从右看</text>

  <!-- 每层最右节点高亮 + 标注 -->
  <circle cx="200" cy="80" r="22" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="200" y="50" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第0层最右</text>

  <circle cx="290" cy="140" r="20" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="350" y="135" font-size="10" fill="#b85450" font-weight="bold">第1层最右</text>

  <circle cx="330" cy="210" r="19" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="365" y="245" font-size="10" fill="#b85450" font-weight="bold">第2层最右</text>

  <!-- 视线箭头指向最右节点 -->
  <path d="M 430 80 L 218 80" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 140 L 308 140" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 210 L 348 210" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="30" y="270" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="12" fill="#333" font-weight="bold">右视图结果：</text>
  <text x="50" y="318" font-size="14" fill="#b85450" font-family="monospace" font-weight="bold">[1, 3, 4]</text>
  <text x="50" y="334" font-size="11" fill="#888">第0层看 1，第1层看 3（2 被 3 遮住），第2层看 4</text>
</svg>
