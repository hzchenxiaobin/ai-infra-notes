<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：next(price) → 初始化 → 弹栈累加 → 入栈 → 返回</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(1) 均摊每次，空间 O(n)；每个 (price,span) 入栈出栈各 1 次</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: init -->
    <rect x="40" y="62" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="82" font-size="12" fill="#446688" font-weight="bold">① 构造</text>
    <text x="120" y="82" font-family="monospace" font-size="10" fill="#555">stack = []   // 栈存 (price, span)，price 严格递减</text>
    <text x="120" y="98" font-size="9" fill="#888">在线流式：每次 next 复用同一个栈，历史被压缩成 span</text>

    <path d="M 260 114 L 260 128" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: next called, span=1 -->
    <rect x="40" y="132" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="152" font-size="12" fill="#4a7a3a" font-weight="bold">② next(price) 被调用</text>
    <text x="200" y="152" font-family="monospace" font-size="10" fill="#555">int span = 1;   // 今天自己算 1 天</text>
    <text x="200" y="168" font-size="9" fill="#888">跨度至少为 1（含今天）</text>

    <path d="M 260 182 L 260 196" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: while pop -->
    <rect x="40" y="200" width="440" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="220" font-size="12" fill="#b85450" font-weight="bold">③ 弹栈累加（核心）</text>
    <text x="54" y="238" font-family="monospace" font-size="10" fill="#d6a040">// while 栈非空 且 栈顶 price ≤ 当前 price</text>
    <text x="70" y="254" font-family="monospace" font-size="10" fill="#b85450">while (!st.empty() &amp;&amp; st.top().price &lt;= price) {</text>
    <text x="86" y="270" font-family="monospace" font-size="10" fill="#b85450">span += st.top().span;   // 吞并这一整段</text>
    <text x="86" y="286" font-family="monospace" font-size="10" fill="#b85450">st.pop();</text>
    <text x="70" y="302" font-family="monospace" font-size="10" fill="#555">}</text>

    <path d="M 260 310 L 260 324" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: push & return -->
    <rect x="40" y="328" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="348" font-size="12" fill="#d6a040" font-weight="bold">④ 入栈并返回</text>
    <text x="160" y="348" font-family="monospace" font-size="10" fill="#555">st.push((price, span));   // 入栈，等更大的来吞并</text>
    <text x="160" y="364" font-family="monospace" font-size="10" fill="#555">return span;             // 返回当天跨度</text>
    <text x="160" y="380" font-size="9" fill="#888">栈顶 price &gt; 当前价，故新入栈后仍严格递减</text>

    <path d="M 260 392 L 260 404" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="260" y="416" text-anchor="middle" font-size="9" fill="#888">等待下一次 next(price) 调用</text>
  </g>
</svg>
