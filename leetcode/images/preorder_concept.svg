<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">前序遍历：根 → 左 → 右</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">先访问根，再递归左子树，最后递归右子树</text>

  <!-- 树 -->
  <circle cx="240" cy="80" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="85" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="270" y="85" font-size="11" fill="#b85450" font-weight="bold">①</text>

  <circle cx="160" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="155" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="185" y="155" font-size="11" fill="#b85450" font-weight="bold">②</text>

  <circle cx="330" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="355" y="155" font-size="11" fill="#b85450" font-weight="bold">⑤</text>

  <line x1="226" y1="94" x2="172" y2="138" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="254" y1="94" x2="318" y2="138" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="110" cy="220" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="225" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="132" y="225" font-size="11" fill="#b85450" font-weight="bold">③</text>

  <circle cx="200" cy="220" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="225" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="222" y="225" font-size="11" fill="#b85450" font-weight="bold">④</text>

  <line x1="148" y1="164" x2="118" y2="208" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="172" y1="164" x2="192" y2="208" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 遍历路径箭头 -->
  <path d="M 240 97 Q 180 120 160 135" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <path d="M 160 165 Q 130 190 112 207" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <path d="M 122 220 L 186 220" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 207 Q 250 180 320 150" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="30" y="265" width="500" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="289" font-size="12" fill="#333" font-weight="bold">遍历顺序：</text>
  <text x="50" y="313" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">①1 → ②2 → ③4 → ④5 → ⑤3</text>
  <text x="50" y="335" font-size="11" fill="#888">结果 = [1, 2, 4, 5, 3] —— 根永远在子树之前被访问</text>
</svg>
