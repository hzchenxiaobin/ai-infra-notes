<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DFS 陷阱：单侧为空不能取 min</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">空的一侧没有叶子，必须走向非空侧</text>

  <!-- 错误示例树 -->
  <rect x="20" y="60" width="240" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="82" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌ 错误：min(0, 2)+1 = 1</text>

  <circle cx="140" cy="110" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="115" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <text x="100" y="148" text-anchor="middle" font-size="11" fill="#ccc">∅（左空）</text>

  <circle cx="180" cy="150" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <circle cx="180" cy="195" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>

  <line x1="140" y1="125" x2="180" y2="138" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="180" y1="164" x2="180" y2="183" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>

  <text x="140" y="222" text-anchor="middle" font-size="10" fill="#b85450">把节点 2 当成叶子 → 错！</text>

  <!-- 正确示例 -->
  <rect x="290" y="60" width="240" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅ 正确：走向非空侧 = 3</text>

  <circle cx="410" cy="110" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="370" y="148" text-anchor="middle" font-size="11" fill="#ccc">∅（左空）</text>

  <circle cx="450" cy="150" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <circle cx="450" cy="195" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <line x1="410" y1="125" x2="450" y2="138" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="450" y1="164" x2="450" y2="183" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <path d="M 410 125 L 450 138 L 450 183" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">2→3→4，最近叶子是 4</text>

  <!-- 正确逻辑 -->
  <rect x="20" y="250" width="520" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="274" font-size="12" fill="#446688" font-weight="bold">DFS 正确逻辑：</text>
  <text x="40" y="298" font-size="11" fill="#555" font-family="monospace">if node.left==null &amp;&amp; node.right==null: return 1   // 叶子</text>
  <text x="40" y="316" font-size="11" fill="#555" font-family="monospace">if node.left==null:  return dfs(node.right) + 1       // 左空，走右</text>
  <text x="40" y="334" font-size="11" fill="#555" font-family="monospace">if node.right==null: return dfs(node.left)  + 1       // 右空，走左</text>
  <text x="40" y="352" font-size="11" fill="#555" font-family="monospace">return min(dfs(left), dfs(right)) + 1                // 两侧都有，取 min</text>
</svg>
