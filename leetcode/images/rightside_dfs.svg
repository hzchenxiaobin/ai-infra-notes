<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DFS 解法：根→右→左，每层首个访问的即最右</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">先走右子树，每层第一次到达时记录——天然是最右节点</text>

  <!-- 树 -->
  <circle cx="240" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="85" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="268" y="85" font-size="10" fill="#b85450" font-weight="bold">depth=0</text>

  <circle cx="170" cy="145" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="195" y="150" font-size="9" fill="#888">d=1</text>

  <circle cx="320" cy="145" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="345" y="150" font-size="9" fill="#888">d=1</text>

  <line x1="228" y1="94" x2="178" y2="133" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="252" y1="94" x2="308" y2="133" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="290" cy="210" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="215" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="310" y="215" font-size="9" fill="#888">d=2</text>

  <circle cx="360" cy="210" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="215" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="380" y="215" font-size="9" fill="#888">d=2</text>

  <line x1="312" y1="157" x2="296" y2="198" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="328" y1="157" x2="352" y2="198" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- DFS 访问顺序标注 -->
  <text x="240" y="60" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">① 记录</text>
  <text x="370" y="140" font-size="10" fill="#b85450" font-weight="bold">② 记录</text>
  <text x="400" y="230" font-size="10" fill="#b85450" font-weight="bold">③ 记录</text>
  <text x="290" y="240" text-anchor="middle" font-size="9" fill="#888">④ 跳过（d=2 已记）</text>
  <text x="170" y="170" text-anchor="middle" font-size="9" fill="#888">⑤ 跳过（d=1 已记）</text>

  <!-- 访问路径 -->
  <path d="M 240 96 L 310 133" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 159 L 352 198" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 210 L 300 210" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 197 Q 250 170 190 150" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- DFS 逻辑 -->
  <rect x="20" y="260" width="520" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="284" font-size="12" fill="#446688" font-weight="bold">DFS 逻辑（根→右→左）：</text>
  <text x="40" y="306" font-size="11" fill="#555" font-family="monospace">def dfs(node, depth):</text>
  <text x="40" y="324" font-size="11" fill="#555" font-family="monospace">  if depth == len(result):   # 该层首次访问</text>
  <text x="40" y="342" font-size="11" fill="#b85450" font-family="monospace">    result.append(node.val)  # 记录（天然是最右）</text>
  <text x="40" y="360" font-size="11" fill="#555" font-family="monospace">  dfs(node.right, depth+1); dfs(node.left, depth+1)  # 先右后左</text>
</svg>
