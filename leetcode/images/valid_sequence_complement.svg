<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">补集转化：总序列 − 全奇序列 = 乘积为偶</text>

  <!-- 全集框 -->
  <rect x="40" y="60" width="460" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">全集：和为 n、长为 k 的正整数序列</text>
  <text x="270" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x₁ + x₂ + ... + x_k = n，x_i ≥ 1</text>
  <text x="270" y="132" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">插板法 = C(n−1, k−1)</text>

  <!-- 全奇子集框 -->
  <rect x="60" y="175" width="280" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">子集：全奇序列（乘积为奇）</text>
  <text x="200" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x_i = 2z_i + 1，代入得 Σz_i = (n−k)/2</text>
  <text x="200" y="243" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">仅 n−k 偶时存在 = C((n+k)/2−1, k−1)</text>

  <!-- 减号 -->
  <text x="380" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="#b85450" filter="url(#rough2)">−</text>
  <path d="M345 215 L360 215" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 答案框 -->
  <rect x="120" y="285" width="300" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案：乘积为偶的序列数</text>
  <text x="270" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">= C(n−1, k−1) − C((n+k)/2−1, k−1)</text>

  <!-- 等号箭头 -->
  <path d="M200 260 L200 280" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M340 260 L340 280" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
