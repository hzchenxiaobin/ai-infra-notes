<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：7243 + 564 = 7807</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">压栈后弹栈相加，头插构建结果链表</text>

  <!-- 列头 -->
  <text x="36" y="66" font-size="10" fill="#888" font-weight="bold">轮次</text>
  <text x="90" y="66" font-size="10" fill="#888" font-weight="bold">a (s1 弹)</text>
  <text x="170" y="66" font-size="10" fill="#888" font-weight="bold">b (s2 弹)</text>
  <text x="250" y="66" font-size="10" fill="#888" font-weight="bold">carry 入</text>
  <text x="330" y="66" font-size="10" fill="#888" font-weight="bold">sum</text>
  <text x="390" y="66" font-size="10" fill="#888" font-weight="bold">digit</text>
  <text x="460" y="66" font-size="10" fill="#888" font-weight="bold">头插后结果</text>

  <!-- ===== 初始压栈说明 ===== -->
  <rect x="30" y="76" width="520" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="91" font-size="10" fill="#888">压栈：s1=[7,2,4,3]（栈顶 3），s2=[5,6,4]（栈顶 4）</text>

  <!-- ===== 轮1: a=3 b=4 ===== -->
  <text x="44" y="116" font-size="10" fill="#888">1</text>
  <rect x="86" y="104" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="104" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="162" y="104" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="180" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="270" y="119" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="330" y="119" text-anchor="middle" font-size="11" fill="#555">7</text>
  <rect x="382" y="104" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="119" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="460" y="119" font-size="10" fill="#555">carry=0</text>
  <!-- 头插后 -->
  <g font-size="11">
    <rect x="450" y="128" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="466" y="143" text-anchor="middle" fill="#333" font-weight="bold">7</text>
  </g>

  <!-- ===== 轮2: a=4 b=6 ===== -->
  <text x="44" y="174" font-size="10" fill="#888">2</text>
  <rect x="86" y="162" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="104" y="177" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="162" y="162" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="180" y="177" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <text x="270" y="177" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="330" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <rect x="382" y="162" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="460" y="177" font-size="10" fill="#b85450" font-weight="bold">carry=1</text>
  <g font-size="11">
    <rect x="450" y="186" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="466" y="201" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <line x1="482" y1="197" x2="496" y2="197" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="500" y="186" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="516" y="201" text-anchor="middle" fill="#333" font-weight="bold">7</text>
  </g>
  <text x="466" y="224" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">↑新头</text>

  <!-- ===== 轮3: a=2 b=5 carry=1 ===== -->
  <text x="44" y="246" font-size="10" fill="#888">3</text>
  <rect x="86" y="234" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="104" y="249" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="162" y="234" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="180" y="249" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="270" y="249" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="330" y="249" text-anchor="middle" font-size="11" fill="#555">8</text>
  <rect x="382" y="234" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="249" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="460" y="249" font-size="10" fill="#555">carry=0</text>
  <g font-size="11">
    <rect x="412" y="258" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="428" y="273" text-anchor="middle" fill="#333" font-weight="bold">8</text>
    <line x1="444" y1="269" x2="458" y2="269" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="462" y="258" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="478" y="273" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <line x1="494" y1="269" x2="508" y2="269" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="512" y="258" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="528" y="273" text-anchor="middle" fill="#333" font-weight="bold">7</text>
  </g>

  <!-- ===== 轮4: a=7 b=0(s2空) ===== -->
  <text x="44" y="306" font-size="10" fill="#888">4</text>
  <rect x="86" y="294" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="104" y="309" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <rect x="162" y="294" width="36" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="309" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="210" y="309" font-size="8" fill="#888">s2空</text>
  <text x="270" y="309" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="330" y="309" text-anchor="middle" font-size="11" fill="#555">7</text>
  <rect x="382" y="294" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="309" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="460" y="309" font-size="10" fill="#555">carry=0</text>

  <!-- ===== 结果链表 ===== -->
  <text x="40" y="346" font-size="11" fill="#444" font-weight="bold">结束（carry=0，无需补位）：</text>
  <g font-size="13">
    <rect x="180" y="354" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="202" y="374" text-anchor="middle" fill="#333" font-weight="bold">7</text>
    <line x1="224" y1="369" x2="242" y2="369" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="248" y="354" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="270" y="374" text-anchor="middle" fill="#333" font-weight="bold">8</text>
    <line x1="292" y1="369" x2="310" y2="369" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="316" y="354" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="338" y="374" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <line x1="360" y1="369" x2="378" y2="369" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="384" y="354" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="406" y="374" text-anchor="middle" fill="#333" font-weight="bold">7</text>
  </g>
  <text x="202" y="344" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">头（最高位）</text>

  <!-- ===== 结论 ===== -->
  <rect x="30" y="404" width="520" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="424" font-size="11" fill="#4a7a3a" font-weight="bold">7243 + 564 = 7807 ✓</text>
  <text x="44" y="442" font-size="10" fill="#555">第2轮 sum=10 产生进位1，第3轮 2+5+1=8 把进位加上</text>
  <text x="44" y="458" font-size="10" fill="#555">第4轮 s2 空取 0（自动补零对齐），7+0+0=7，结果 7→8→0→7</text>
</svg>
