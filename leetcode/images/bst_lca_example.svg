<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：p=2, q=4 ⇒ LCA=2</text>

  <!-- BST 树 -->
  <circle cx="290" cy="70" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="312" y="66" font-size="9" fill="#888">root</text>

  <circle cx="200" cy="140" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="278" y1="82" x2="210" y2="130" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="380" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="144" text-anchor="middle" font-size="11" fill="#333">8</text>
  <line x1="302" y1="82" x2="370" y2="130" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="140" cy="210" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="214" text-anchor="middle" font-size="10" fill="#333">0</text>
  <line x1="190" y1="152" x2="148" y2="200" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="250" cy="210" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <line x1="210" y1="152" x2="242" y2="200" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="340" cy="210" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="214" text-anchor="middle" font-size="10" fill="#333">7</text>
  <line x1="372" y1="152" x2="344" y2="200" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="420" cy="210" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="214" text-anchor="middle" font-size="10" fill="#333">9</text>
  <line x1="388" y1="152" x2="416" y2="200" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="210" cy="280" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="210" y="284" text-anchor="middle" font-size="9" fill="#333">3</text>
  <line x1="242" y1="220" x2="214" y2="270" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <circle cx="290" cy="280" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="9" fill="#333">5</text>
  <line x1="258" y1="220" x2="286" y2="270" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 标注 p q -->
  <text x="200" y="170" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">p=2</text>
  <text x="270" y="200" font-size="9" fill="#b85450" font-weight="bold">q=4</text>

  <!-- 路径箭头 -->
  <path d="M 282 84 L 210 126" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="240" y="100" font-size="10" fill="#b85450" font-weight="bold">① 2,4 &lt; 6 向左</text>

  <!-- 步骤说明 -->
  <rect x="40" y="310" width="500" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="334" font-size="12" fill="#333" font-weight="bold">演算步骤：</text>
  <text x="60" y="354" font-size="11" fill="#555">① cur=6：p=2, q=4 都 &lt; 6 ⇒ 向左，cur=2</text>
  <text x="60" y="372" font-size="11" fill="#b85450" font-weight="bold">② cur=2：cur.val==p.val ⇒ 情况3，返回 2（2 是 4 的祖先）</text>
</svg>
