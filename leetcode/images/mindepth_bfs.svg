<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">BFS 解法：遇到第一个叶子立即返回 ✅</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">层序遍历天然按距离搜索，首叶子即最近</text>

  <!-- 树 -->
  <text x="30" y="80" font-size="11" fill="#446688" font-weight="bold">输入树</text>
  <circle cx="130" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="95" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <circle cx="80" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>

  <circle cx="190" cy="140" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="145" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">20</text>

  <line x1="120" y1="102" x2="90" y2="128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="140" y1="102" x2="178" y2="128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="160" cy="195" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">15</text>

  <circle cx="230" cy="195" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>

  <line x1="180" y1="152" x2="165" y2="183" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="200" y1="152" x2="222" y2="183" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 高亮9是叶子 -->
  <circle cx="80" cy="140" r="18" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="40" y="170" font-size="10" fill="#b85450" font-weight="bold">叶子！</text>

  <!-- BFS 流程 -->
  <rect x="290" y="60" width="250" height="310" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">BFS 层序</text>

  <rect x="310" y="94" width="210" height="30" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="415" y="114" text-anchor="middle" font-size="11" fill="#333">queue=[3], depth=0</text>

  <line x1="415" y1="124" x2="415" y2="138" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="140" width="210" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="415" y="158" text-anchor="middle" font-size="11" fill="#333">第1层 depth=1</text>
  <text x="415" y="174" text-anchor="middle" font-size="11" fill="#333">出队 3，入队 9,20</text>

  <line x1="415" y1="184" x2="415" y2="198" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="200" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="415" y="220" text-anchor="middle" font-size="11" fill="#333">第2层 depth=2</text>
  <text x="415" y="236" text-anchor="middle" font-size="11" fill="#333">出队 9 → 无孩子</text>
  <text x="415" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9 是叶子！return 2 ✅</text>

  <line x1="415" y1="256" x2="415" y2="270" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="272" width="210" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="415" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">提前返回，不遍历 20 的子树</text>
  <text x="415" y="306" text-anchor="middle" font-size="10" fill="#888">这就是 BFS 比DFS 快的原因</text>

  <rect x="310" y="322" width="210" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="415" y="345" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果 = 2</text>

  <!-- 底部对比 -->
  <rect x="20" y="350" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="368" text-anchor="middle" font-size="10" fill="#555">DFS 必须「走到底」才知道是否最短</text>
  <text x="150" y="382" text-anchor="middle" font-size="10" fill="#555">BFS 按层搜索，首个叶子必最近</text>
</svg>
