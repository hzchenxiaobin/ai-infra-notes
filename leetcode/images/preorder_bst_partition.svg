<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">上下界递归：全局指针 + 值域约束</text>

  <!-- 前序数组 -->
  <text x="40" y="58" font-size="12" fill="#888">preorder = [8,5,1,7,10,12]</text>
  <rect x="40" y="66" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="88" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="86" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="136" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="184" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="86" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="232" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="86" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="280" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="86" text-anchor="middle" font-size="12" fill="#333">12</text>

  <text x="62" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ i=0 根</text>
  <text x="170" y="112" text-anchor="middle" font-size="10" fill="#446688">左子树值域(-∞,8)</text>
  <text x="268" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a">右子树值域(8,+∞)</text>

  <!-- 递归树形 -->
  <circle cx="290" cy="150" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <text x="320" y="148" font-size="10" fill="#888">(-∞,+∞)</text>

  <line x1="276" y1="160" x2="220" y2="195" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="304" y1="160" x2="360" y2="195" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="210" cy="205" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="209" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="150" y="208" font-size="9" fill="#888">(-∞,8)</text>

  <circle cx="370" cy="205" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="209" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="400" y="208" font-size="9" fill="#888">(8,+∞)</text>

  <line x1="200" y1="216" x2="170" y2="250" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="216" x2="250" y2="250" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="380" y1="216" x2="410" y2="250" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="160" cy="260" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="264" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="130" y="278" font-size="9" fill="#888">(-∞,5)</text>

  <circle cx="260" cy="260" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="230" y="278" font-size="9" fill="#888">(5,8)</text>

  <circle cx="420" cy="260" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="264" text-anchor="middle" font-size="10" fill="#333">12</text>
  <text x="390" y="278" font-size="9" fill="#888">(10,+∞)</text>

  <!-- 说明框 -->
  <rect x="40" y="305" width="500" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="329" font-size="12" fill="#333" font-weight="bold">核心：值域 (lower, upper) 自动划分左右子树</text>
  <text x="60" y="349" font-size="11" fill="#555">全局指针 i 单调递增；val 不在 (lower,upper) ⇒ 返回 null（剪枝）</text>
  <text x="60" y="367" font-size="11" fill="#555">左子树 build(lower, val)；右子树 build(val, upper)</text>
  <text x="60" y="383" font-size="11" fill="#b85450" font-weight="bold">无需显式找分界点，O(n) 一次遍历完成</text>
</svg>
