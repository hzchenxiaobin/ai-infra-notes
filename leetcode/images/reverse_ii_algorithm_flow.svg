<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：定位 pre → 头插循环 right-left 次 → 返回</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">curr 全程段尾，pre 全程前驱，一遍遍历 O(n) O(1)</text>

  <!-- Start -->
  <rect x="170" y="62" width="220" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dummy.next = head; pre = dummy</text>

  <path d="M 280 94 L 280 112" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 定位 pre -->
  <rect x="140" y="114" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">for i in 1..left-1: pre = pre.next</text>

  <path d="M 280 144 L 280 160" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="162" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">curr = pre.next（段尾，全程不动）</text>

  <path d="M 280 192 L 280 210" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 循环次数 -->
  <polygon points="280,212 380,250 280,288 180,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">已循环</text>
  <text x="280" y="258" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">right-left 次?</text>
  <text x="280" y="272" text-anchor="middle" font-size="9" fill="#8a6a20">（反转完成?）</text>

  <!-- No -->
  <text x="160" y="244" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 180 250 L 120 250" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三步 -->
  <rect x="20" y="196" width="100" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">头插三步</text>
  <text x="28" y="230" font-size="8" fill="#555">nxt = curr.next</text>
  <text x="28" y="244" font-size="8" fill="#b85450" font-weight="bold">①curr.next</text>
  <text x="28" y="254" font-size="8" fill="#b85450" font-weight="bold">  =nxt.next</text>
  <text x="28" y="268" font-size="8" fill="#4a7a3a" font-weight="bold">②nxt.next</text>
  <text x="28" y="278" font-size="8" fill="#4a7a3a" font-weight="bold">  =pre.next</text>
  <text x="28" y="292" font-size="8" fill="#d6a040" font-weight="bold">③pre.next=nxt</text>
  <!-- loop back to diamond -->
  <path d="M 70 304 L 70 322 L 280 322 L 280 288" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes -->
  <text x="296" y="304" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <path d="M 280 288 L 280 340" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="342" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">反转完成，curr.next 自动接后段</text>

  <path d="M 280 372 L 280 390" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="392" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return dummy.next</text>

  <!-- 关键提示 -->
  <rect x="30" y="436" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="454" font-size="11" fill="#8a6a20" font-weight="bold">循环次数 = right-left（节点数减一），不是 right-left+1</text>
</svg>
