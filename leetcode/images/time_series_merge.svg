<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">双序列归并：按 timestamp 并集前进</text>

  <!-- series1 timeline -->
  <text x="40" y="70" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">series1</text>
  <line x1="110" y1="65" x2="540" y2="65" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="160" cy="65" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="160" y="50" text-anchor="middle" font-size="10" fill="#446688">t=1</text>
    <text x="160" y="88" text-anchor="middle" font-size="10" fill="#446688">v=3</text>
    <circle cx="400" cy="65" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="400" y="50" text-anchor="middle" font-size="10" fill="#446688">t=4</text>
    <text x="400" y="88" text-anchor="middle" font-size="10" fill="#446688">v=1</text>
  </g>

  <!-- series2 timeline -->
  <text x="40" y="150" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">series2</text>
  <line x1="110" y1="145" x2="540" y2="145" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="280" cy="145" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="130" text-anchor="middle" font-size="10" fill="#d6a040">t=2</text>
    <text x="280" y="168" text-anchor="middle" font-size="10" fill="#d6a040">v=2</text>
    <circle cx="520" cy="145" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="520" y="130" text-anchor="middle" font-size="10" fill="#d6a040">t=5</text>
    <text x="520" y="168" text-anchor="middle" font-size="10" fill="#d6a040">v=2</text>
  </g>

  <!-- union timeline -->
  <text x="40" y="230" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">并集</text>
  <line x1="110" y1="225" x2="540" y2="225" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="160" cy="225" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="160" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
    <circle cx="280" cy="225" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
    <circle cx="400" cy="225" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="400" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
    <circle cx="520" cy="225" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="520" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">5</text>
  </g>

  <!-- value lookup arrows for t=1 -->
  <path d="M160 65 Q160 100 160 225" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M160 145 Q220 180 275 225" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="190" font-size="9" fill="#d6a040" filter="url(#rough2)">t=1缺失→取下个更晚(t=2,v=2)</text>

  <!-- result table -->
  <rect x="80" y="275" width="440" height="85" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">结果：每个并集 t 算两序列值之和</text>
  <g font-size="11" filter="url(#rough2)">
    <text x="100" y="320" fill="#333">t=1: s1=3, s2=2(向前看) → 5</text>
    <text x="100" y="338" fill="#333">t=2: s1=1(向前看), s2=2 → 3</text>
    <text x="100" y="356" fill="#333">t=4: s1=1, s2=2(向前看) → 3   t=5: s1=0(无更晚), s2=2 → 2</text>
  </g>
</svg>
