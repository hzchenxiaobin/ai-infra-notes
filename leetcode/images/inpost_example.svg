<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：后序指针取根顺序</text>

  <!-- 后序 -->
  <text x="40" y="58" font-size="12" fill="#888">后序 postorder = [9,15,7,20,3]</text>
  <rect x="40" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="86" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="88" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="86" text-anchor="middle" font-size="12" fill="#333">15</text>
  <rect x="136" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="86" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="184" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="86" text-anchor="middle" font-size="12" fill="#333">20</text>
  <rect x="232" y="66" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="254" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">postIdx 从右往左 ←</text>

  <!-- 取根顺序 -->
  <text x="40" y="138" font-size="12" fill="#888">全局指针取根顺序（先右后左递归）：</text>

  <rect x="40" y="146" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="165" text-anchor="middle" font-size="11" fill="#333">① 根=3</text>

  <path d="M 140 160 L 156 160" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="146" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="165" text-anchor="middle" font-size="11" fill="#333">② 根=20</text>

  <path d="M 260 160 L 276 160" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="280" y="146" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="165" text-anchor="middle" font-size="11" fill="#333">③ 根=7</text>

  <path d="M 380 160 L 396 160" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="400" y="146" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="165" text-anchor="middle" font-size="11" fill="#333">④ 根=15</text>

  <rect x="40" y="180" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="199" text-anchor="middle" font-size="11" fill="#333">⑤ 根=9</text>

  <text x="160" y="199" font-size="10" fill="#888">（20 的右子树处理完后回到左子树）</text>

  <!-- 构造结果树 -->
  <text x="320" y="240" font-size="12" fill="#888">最终构造结果：</text>
  <circle cx="400" cy="260" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <circle cx="355" cy="315" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="319" text-anchor="middle" font-size="11" fill="#333">9</text>
  <line x1="388" y1="272" x2="362" y2="304" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="445" cy="315" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="319" text-anchor="middle" font-size="11" fill="#333">20</text>
  <line x1="412" y1="272" x2="438" y2="304" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="415" cy="370" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="415" y="374" text-anchor="middle" font-size="10" fill="#333">15</text>
  <line x1="438" y1="327" x2="422" y2="360" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="475" cy="370" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="475" y="374" text-anchor="middle" font-size="10" fill="#333">7</text>
  <line x1="452" y1="327" x2="468" y2="360" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 说明 -->
  <text x="290" y="394" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：①取根3 → ②递归右(取20→取7→取15) → ③递归左(取9)</text>
</svg>
