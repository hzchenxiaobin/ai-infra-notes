<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">BFS 解法：层序遍历，每层最后一个即右视图</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">复用层序遍历骨架，for 循环最后记录的节点就是本层最右</text>

  <!-- 树 -->
  <text x="20" y="80" font-size="11" fill="#446688" font-weight="bold">输入树</text>
  <circle cx="140" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <circle cx="80" cy="145" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <circle cx="200" cy="145" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>

  <line x1="130" y1="102" x2="88" y2="134" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="102" x2="192" y2="134" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="170" cy="200" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>

  <circle cx="230" cy="200" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="205" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>

  <line x1="192" y1="155" x2="176" y2="190" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="208" y1="155" x2="222" y2="190" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <!-- BFS 流程 -->
  <rect x="280" y="60" width="260" height="320" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">BFS 层序</text>

  <rect x="300" y="94" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="11" fill="#333">第0层 size=1</text>
  <text x="410" y="128" text-anchor="middle" font-size="11" fill="#333">出队 1</text>
  <text x="410" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最后 → 记录 1 ✅</text>

  <line x1="410" y1="150" x2="410" y2="164" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="166" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="410" y="184" text-anchor="middle" font-size="11" fill="#333">第1层 size=2</text>
  <text x="410" y="200" text-anchor="middle" font-size="11" fill="#333">出队 2 → 出队 3</text>
  <text x="410" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最后 → 记录 3 ✅</text>

  <line x1="410" y1="222" x2="410" y2="236" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="238" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="410" y="256" text-anchor="middle" font-size="11" fill="#333">第2层 size=2</text>
  <text x="410" y="272" text-anchor="middle" font-size="11" fill="#333">出队 5 → 出队 4</text>
  <text x="410" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最后 → 记录 4 ✅</text>

  <line x1="410" y1="294" x2="410" y2="308" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="310" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="328" text-anchor="middle" font-size="11" fill="#333">队列空，结束</text>
  <text x="410" y="348" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">result = [1, 3, 4]</text>

  <!-- 核心逻辑 -->
  <rect x="20" y="290" width="250" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="12" fill="#446688" font-weight="bold">核心逻辑：</text>
  <text x="40" y="332" font-size="11" fill="#555" font-family="monospace">for i in range(size):</text>
  <text x="40" y="350" font-size="11" fill="#555" font-family="monospace">  node = queue.popleft()</text>
  <text x="40" y="368" font-size="11" fill="#b85450" font-family="monospace">  if i == size-1: result.append(node.val)</text>
</svg>
