<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">相同的树：逐节点同步递归对比</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">两棵树同步往下走，结构+值都相同才返回 true</text>

  <!-- 树 p -->
  <text x="120" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">树 p</text>
  <circle cx="120" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="105" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <circle cx="80" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <circle cx="160" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <line x1="108" y1="112" x2="90" y2="148" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="132" y1="112" x2="150" y2="148" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 树 q -->
  <text x="420" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">树 q</text>
  <circle cx="420" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <circle cx="380" cy="160" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <circle cx="460" cy="160" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <line x1="408" y1="112" x2="390" y2="148" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="432" y1="112" x2="450" y2="148" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 同步对比箭头 -->
  <path d="M 136 100 L 404 100" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">p.val == q.val?</text>

  <path d="M 95 160 L 365 160" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 175 160 L 445 160" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归逻辑 -->
  <rect x="30" y="210" width="500" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="234" font-size="12" fill="#333" font-weight="bold">递归逻辑（同步双指针）：</text>
  <text x="50" y="258" font-size="11" fill="#555" font-family="monospace">isSame(p, q):</text>
  <text x="50" y="276" font-size="11" fill="#555" font-family="monospace">  if p==null and q==null: return true     // 都空 → 相同</text>
  <text x="50" y="294" font-size="11" fill="#555" font-family="monospace">  if p==null or q==null:  return false     // 一空一非空 → 不同</text>
  <text x="50" y="312" font-size="11" fill="#555" font-family="monospace">  if p.val != q.val:      return false     // 值不同 → 不同</text>
  <text x="50" y="330" font-size="11" fill="#555" font-family="monospace">  return isSame(p.left, q.left) and isSame(p.right, q.right)</text>
  <text x="50" y="350" font-size="10" fill="#888">值相同后，递归对比左子树 and 右子树——两者都相同整体才相同</text>
</svg>
