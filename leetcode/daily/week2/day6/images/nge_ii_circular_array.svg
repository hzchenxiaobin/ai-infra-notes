<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">环形数组：用取模遍历 2n 模拟“绕一圈”</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">数组首尾相连，最后一个元素的“下一个更大”可能绕回到数组开头</text>

  <!-- ===== Left: circular array ===== -->
  <text x="120" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">环形数组 nums = [1, 2, 1]</text>

  <!-- circular arrows -->
  <path d="M 120 90 A 55 55 0 1 1 119.9 90" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- node 0: value 1 -->
  <circle cx="120" cy="100" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="105" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="84" text-anchor="middle" font-size="8" fill="#888">[0]</text>

  <!-- node 1: value 2 -->
  <circle cx="167" cy="140" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="190" y="134" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">[1]</text>

  <!-- node 2: value 1 -->
  <circle cx="73" cy="140" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="145" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="50" y="134" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">[2]</text>

  <!-- wrap-around arrow from [2] to [1] -->
  <path d="M 90 154 Q 120 180 155 154" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">绕一圈找到 2！</text>

  <!-- ===== Right: unrolled 2n traversal ===== -->
  <text x="380" y="72" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">取模展开：遍历 2n 步，i % n 访问</text>

  <!-- pass 1 label -->
  <text x="300" y="96" font-size="9" fill="#4a7a3a" font-weight="bold">第一遍 i=0..n-1（正常 + 入栈）</text>
  <g font-size="10">
    <rect x="300" y="102" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="320" y="121" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="320" y="96" text-anchor="middle" font-size="7" fill="#888">i=0</text>

    <rect x="344" y="102" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="364" y="121" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="364" y="96" text-anchor="middle" font-size="7" fill="#888">i=1</text>

    <rect x="388" y="102" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="408" y="121" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="408" y="96" text-anchor="middle" font-size="7" fill="#888">i=2</text>
  </g>

  <!-- pass 2 label -->
  <text x="300" y="150" font-size="9" fill="#b85450" font-weight="bold">第二遍 i=n..2n-1（绕回 + 只弹不入栈）</text>
  <g font-size="10">
    <rect x="300" y="156" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="320" y="175" text-anchor="middle" fill="#b85450">1</text>
    <text x="320" y="150" text-anchor="middle" font-size="7" fill="#b85450">i=3→0</text>

    <rect x="344" y="156" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="364" y="175" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="364" y="150" text-anchor="middle" font-size="7" fill="#b85450" font-weight="bold">i=4→1 ✓</text>

    <rect x="388" y="156" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="408" y="175" text-anchor="middle" fill="#b85450">1</text>
    <text x="408" y="150" text-anchor="middle" font-size="7" fill="#b85450">i=5→2</text>
  </g>

  <!-- arrow i=4→1 highlight: this is where [2] finds its answer -->
  <path d="M 364 190 L 364 210" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="440" y="204" font-size="9" fill="#b85450" font-weight="bold">i=4 时 nums[1]=2</text>
  <text x="440" y="216" font-size="9" fill="#b85450" font-weight="bold">弹 [2]，res[2]=2</text>

  <!-- ===== Bottom summary ===== -->
  <rect x="30" y="240" width="480" height="165" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="262" font-size="12" fill="#d6a040" font-weight="bold">核心技巧：取模遍历 2n</text>
  <text x="50" y="282" font-size="10" fill="#555">① 环形 = 数组首尾相连，最后一个元素可能要绕到开头才找到更大值</text>
  <text x="50" y="300" font-size="10" fill="#555">② 不复制数组，而是遍历 i = 0 .. 2n-1，用 i % n 访问元素</text>
  <text x="50" y="318" font-size="10" fill="#555">③ 第一遍（i &lt; n）：正常比较 + 入栈（每个下标只入一次）</text>
  <text x="50" y="336" font-size="10" fill="#555">④ 第二遍（i ≥ n）：只比较弹栈结算，不再入栈（避免重复处理）</text>
  <text x="50" y="358" font-size="10" fill="#b85450" font-weight="bold">关键：第二遍“只弹不入”——残留元素靠绕回来的更大值结算</text>
  <text x="50" y="378" font-size="10" fill="#4a7a3a" font-weight="bold">与 496/739 同模板，仅多了“取模 + 遍历两遍”这一层</text>
  <text x="50" y="396" font-size="9" fill="#888">存下标（数组可能有重复值，不能像 496 那样用值当哈希键）</text>
</svg>
