<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单调递减栈：新价格吞并栈顶连续段，累加跨度</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">栈存 (price, span)，price 严格递减；栈顶 price ≤ 当前价就弹出并累加 span</text>

  <!-- ===== Price stream ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">价格流</text>
  <g font-size="10" fill="#333">
    <rect x="30" y="82" width="40" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="101" text-anchor="middle" font-size="10" fill="#888">100</text>
    <rect x="74" y="82" width="40" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="94" y="101" text-anchor="middle" font-size="10" fill="#888">80</text>
    <rect x="118" y="82" width="40" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="138" y="101" text-anchor="middle" font-size="10" fill="#888">60</text>
    <rect x="162" y="82" width="40" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="182" y="101" text-anchor="middle" font-size="10" fill="#888">70</text>
    <rect x="206" y="82" width="40" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="226" y="101" text-anchor="middle" font-size="10" fill="#888">60</text>
    <rect x="250" y="82" width="40" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="270" y="101" text-anchor="middle" font-size="10" fill="#888">75</text>
    <rect x="294" y="82" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="317" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">85</text>
    <text x="317" y="76" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">当前 next(85)</text>
  </g>

  <!-- arrow down to stack -->
  <path d="M 317 116 L 317 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Stack before processing 85 ===== -->
  <text x="30" y="146" font-size="11" fill="#d6a040" font-weight="bold">栈（底→顶，price 严格递减）</text>
  <g font-size="10">
    <!-- stack: (100,1) (80,1) (75,4) -->
    <rect x="220" y="158" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="280" y="177" text-anchor="middle" fill="#446688" font-weight="bold">(100, span=1)</text>

    <rect x="220" y="192" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="280" y="211" text-anchor="middle" fill="#b85450" font-weight="bold">(80, span=1) ← 栈顶</text>

    <text x="356" y="211" font-size="9" fill="#888">85 ≥ 80 → 弹！</text>
  </g>

  <!-- pop (80,1) -->
  <path d="M 220 207 L 180 207" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="207" font-size="9" fill="#b85450" font-weight="bold">弹出 (80,1)</text>
  <text x="120" y="221" font-size="8" fill="#b85450">span = 1+1 = 2</text>

  <!-- ===== After popping (80,1), check (75,4) ===== -->
  <text x="30" y="244" font-size="11" fill="#d6a040" font-weight="bold">继续弹（85 仍 ≥ 75）</text>
  <g font-size="10">
    <rect x="220" y="256" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="280" y="275" text-anchor="middle" fill="#446688" font-weight="bold">(100, span=1)</text>

    <rect x="220" y="290" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="280" y="309" text-anchor="middle" fill="#d6a040" font-weight="bold">(75, span=4) ← 栈顶</text>
    <text x="356" y="309" font-size="9" fill="#888">85 ≥ 75 → 弹！</text>
  </g>
  <path d="M 220 305 L 180 305" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="305" font-size="9" fill="#d6a040" font-weight="bold">弹出 (75,4)</text>
  <text x="120" y="319" font-size="8" fill="#d6a040">span = 2+4 = 6</text>

  <!-- ===== Stop: 100 > 85 ===== -->
  <text x="30" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">停止：栈顶 100 &gt; 85（第一个屏障）</text>
  <g font-size="10">
    <rect x="220" y="354" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="280" y="373" text-anchor="middle" fill="#446688" font-weight="bold">(100, span=1)</text>
    <rect x="220" y="384" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="280" y="399" text-anchor="middle" fill="#4a7a3a" font-weight="bold">入栈 (85, span=6)</text>
  </g>

  <!-- ===== Summary ===== -->
  <rect x="360" y="354" width="190" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="455" y="374" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">返回 span = 6</text>
  <text x="455" y="389" text-anchor="middle" font-size="9" fill="#555">85 连续吞并 75、80 两段</text>
  <text x="455" y="402" text-anchor="middle" font-size="9" fill="#555">6 = 1 + 4 + 1</text>
</svg>
