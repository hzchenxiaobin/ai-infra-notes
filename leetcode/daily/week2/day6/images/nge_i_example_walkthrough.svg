<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums2 = [1,3,4,2] 上单调栈建表</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">每步看 num 与栈顶：更大则弹栈记表，否则入栈</text>

  <!-- Column headers -->
  <text x="36" y="64" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="78" y="64" font-size="10" fill="#888" font-weight="bold">num</text>
  <text x="150" y="64" font-size="10" fill="#888" font-weight="bold">栈（处理后）</text>
  <text x="280" y="64" font-size="10" fill="#888" font-weight="bold">动作</text>
  <text x="430" y="64" font-size="10" fill="#888" font-weight="bold">nextGreater</text>

  <!-- ===== Row 1: num=1 ===== -->
  <text x="44" y="92" font-size="10" fill="#888">1</text>
  <rect x="64" y="78" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="84" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <path d="M 112 92 L 138 92" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="144" y="78" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="161" y="97" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="280" y="97" font-size="10" fill="#555">栈空 → 入栈 1</text>
  <rect x="424" y="78" width="120" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="97" text-anchor="middle" font-size="10" fill="#888">{ } 空</text>

  <!-- ===== Row 2: num=3 ===== -->
  <text x="44" y="147" font-size="10" fill="#888">2</text>
  <rect x="64" y="133" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <path d="M 112 147 L 138 147" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="144" y="133" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="161" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="280" y="147" font-size="10" fill="#b85450" font-weight="bold">3&gt;1 弹 1</text>
  <text x="280" y="160" font-size="9" fill="#b85450">记 nextGreater[1]=3</text>
  <rect x="424" y="133" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="152" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">{1: 3}</text>

  <!-- ===== Row 3: num=4 ===== -->
  <text x="44" y="202" font-size="10" fill="#888">3</text>
  <rect x="64" y="188" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <path d="M 112 202 L 138 202" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="144" y="188" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="161" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="280" y="202" font-size="10" fill="#b85450" font-weight="bold">4&gt;3 弹 3</text>
  <text x="280" y="215" font-size="9" fill="#b85450">记 nextGreater[3]=4</text>
  <rect x="424" y="188" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="207" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">{1:3, 3:4}</text>

  <!-- ===== Row 4: num=2 ===== -->
  <text x="44" y="257" font-size="10" fill="#888">4</text>
  <rect x="64" y="243" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="84" y="262" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <path d="M 112 257 L 138 257" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="144" y="243" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="161" y="262" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="180" y="243" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="197" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="280" y="257" font-size="10" fill="#555">2&lt;4 不弹 → 入栈 2</text>
  <text x="280" y="270" font-size="9" fill="#888">表不变</text>
  <rect x="424" y="243" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="262" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">{1:3, 3:4}</text>

  <!-- ===== End row ===== -->
  <text x="44" y="312" font-size="10" fill="#888" font-weight="bold">结束</text>
  <rect x="144" y="298" width="34" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="161" y="317" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="180" y="298" width="34" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="197" y="317" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="280" y="312" font-size="10" fill="#555">栈剩 [4,2]，无更大 → 不入表</text>
  <text x="280" y="325" font-size="9" fill="#888">查 4、2 时 .get 默认 -1</text>
  <rect x="424" y="298" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="317" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">{1:3, 3:4}</text>

  <!-- ===== Phase 2 query summary ===== -->
  <rect x="30" y="345" width="520" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="365" font-size="11" fill="#4a7a3a" font-weight="bold">阶段二：nums1 = [4,1,2] 查表</text>
  <text x="50" y="383" font-size="10" fill="#555">4 → .get(4,-1) = -1 　 1 → [1] = 3 　 2 → .get(2,-1) = -1</text>
  <text x="50" y="401" font-size="10" fill="#4a7a3a" font-weight="bold">ans = [-1, 3, -1] ✓</text>
</svg>
