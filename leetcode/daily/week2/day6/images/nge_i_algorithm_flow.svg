<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：阶段一单调栈建表，阶段一遍历 nums1 查表</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">两阶段：预算 O(n) + 查表 O(m) = O(n+m)</text>

  <!-- Phase 1 band -->
  <rect x="20" y="56" width="520" height="270" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough)"/>
  <text x="34" y="74" font-size="11" fill="#d6a040" font-weight="bold">阶段一：在 nums2 上跑单调栈建表</text>

  <!-- Start: init -->
  <rect x="190" y="84" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">初始化 stack=[], nextGreater={}</text>

  <path d="M 280 116 L 280 132" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for num in nums2 -->
  <rect x="170" y="134" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">for num in nums2</text>

  <path d="M 280 166 L 280 184" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond decision -->
  <polygon points="280,186 380,228 280,270 180,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">stack 非空</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">且 num &gt; 栈顶?</text>

  <!-- Yes branch (left) -->
  <text x="170" y="222" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 180 228 L 130 228" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="208" width="100" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">top = pop</text>
  <text x="80" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">nextGreater[top]=num</text>
  <!-- loop back up to diamond -->
  <path d="M 80 208 L 80 188 L 200 188" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="184" font-size="8" fill="#888">继续判栈顶</text>

  <!-- No branch (down) -->
  <text x="296" y="284" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 270 L 280 290" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="292" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">stack.push(num) → 下一个 num</text>
  <!-- loop back to for -->
  <path d="M 380 307 L 430 307 L 430 150 L 390 150" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="230" font-size="8" fill="#888">nums2</text>
  <text x="436" y="242" font-size="8" fill="#888">遍历完?</text>

  <!-- Phase 2 band -->
  <rect x="20" y="338" width="520" height="120" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough)"/>
  <text x="34" y="356" font-size="11" fill="#4a7a3a" font-weight="bold">阶段二：按 nums1 查表</text>

  <path d="M 280 330 L 280 362" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="364" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">for x in nums1: ans[i] = nextGreater.get(x, -1)</text>

  <path d="M 280 398 L 280 414" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="416" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="435" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return ans</text>
</svg>
