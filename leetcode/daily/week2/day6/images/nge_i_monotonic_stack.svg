<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单调递减栈 + 哈希表：遇到更大值时弹栈并记录</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">栈存值（递减），新值大于栈顶则弹出，把栈顶的“下一个更大”记进表</text>

  <!-- ===== nums2 array ===== -->
  <text x="40" y="74" font-size="11" fill="#446688" font-weight="bold">nums2[]</text>
  <g font-size="10" fill="#333">
    <rect x="70" y="80" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="92" y="100" text-anchor="middle" font-size="11" fill="#888">1</text>
    <text x="92" y="74" text-anchor="middle" font-size="8" fill="#888">[0] 已处理</text>

    <rect x="118" y="80" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="140" y="100" text-anchor="middle" font-size="11" fill="#888">3</text>
    <text x="140" y="74" text-anchor="middle" font-size="8" fill="#888">[1] 已弹</text>

    <rect x="166" y="80" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="188" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="188" y="74" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">[2] 当前</text>

    <rect x="214" y="80" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="236" y="100" text-anchor="middle" font-size="10" fill="#bbb">2</text>
    <text x="236" y="74" text-anchor="middle" font-size="8" fill="#bbb">[3]</text>
  </g>

  <!-- arrow from current 4 down to stack -->
  <path d="M 188 116 L 188 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Stack ===== -->
  <text x="40" y="156" font-size="11" fill="#d6a040" font-weight="bold">栈（存值，递减）</text>
  <g font-size="10">
    <rect x="150" y="166" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="188" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">3 ← 栈顶</text>
    <text x="240" y="185" font-size="9" fill="#888">4 &gt; 3 → 弹！</text>
  </g>
  <path d="M 150 181 L 110 181" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="185" font-size="9" fill="#b85450" font-weight="bold">弹出 3</text>

  <!-- arrow from pop to hash table -->
  <path d="M 110 188 Q 80 230 150 250" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Hash table ===== -->
  <text x="40" y="232" font-size="11" fill="#d6a040" font-weight="bold">nextGreater 哈希表</text>
  <g font-size="10">
    <rect x="150" y="242" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="210" y="260" text-anchor="middle" fill="#446688" font-weight="bold">1 → 3</text>
    <text x="285" y="260" font-size="8" fill="#888">上一轮 3 弹 1 时记</text>

    <rect x="150" y="274" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="210" y="292" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3 → 4</text>
    <text x="285" y="292" font-size="8" fill="#4a7a3a" font-weight="bold">刚记！nextGreater[3]=4</text>
  </g>

  <!-- ===== Summary ===== -->
  <rect x="30" y="320" width="480" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">两阶段套路：</text>
  <text x="50" y="358" font-size="10" fill="#555">① 在 nums2 上跑递减栈，弹栈时写 nextGreater[top] = num（预算）</text>
  <text x="50" y="374" font-size="10" fill="#555">② 按 nums1 查表：nextGreater.get(x, -1)，查不到就是 -1</text>
  <text x="50" y="390" font-size="10" fill="#4a7a3a" font-weight="bold">存值不存下标：本题问“更大的值是多少”，不需要算距离</text>
</svg>
