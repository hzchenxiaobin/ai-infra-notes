<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrDash" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">扁平化子链：递归处理 child，子链插入到 curr 与 next 之间</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">双向链表要接四处指针：curr↔childHead、childTail↔next</text>

  <!-- ===== 扁平前：curr 有 child ===== -->
  <text x="40" y="78" font-size="12" fill="#444" font-weight="bold">扁平前：curr 节点有 child 指针</text>
  <!-- 主链 -->
  <g font-size="12">
    <rect x="40" y="86" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="62" y="106" text-anchor="middle" fill="#333" font-weight="bold">curr</text>
    <line x1="84" y1="101" x2="142" y2="101" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="148" y="86" width="44" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="170" y="106" text-anchor="middle" fill="#888">next</text>
    <line x1="192" y1="101" x2="250" y2="101" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="262" y="106" font-size="11" fill="#888">...</text>
  </g>
  <!-- child 指针向下 -->
  <path d="M 62 116 L 62 150" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrDash)" filter="url(#rough2)"/>
  <text x="78" y="138" font-size="9" fill="#b85450" font-weight="bold">child</text>
  <!-- 子链 -->
  <g font-size="12">
    <rect x="40" y="154" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="62" y="174" text-anchor="middle" fill="#333" font-weight="bold">c1</text>
    <line x1="84" y1="169" x2="102" y2="169" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="108" y="154" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="130" y="174" text-anchor="middle" fill="#333" font-weight="bold">c2</text>
    <line x1="152" y1="169" x2="170" y2="169" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="176" y="154" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="198" y="174" text-anchor="middle" fill="#333" font-weight="bold">c3</text>
  </g>
  <text x="62" y="200" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">childHead</text>
  <text x="198" y="200" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">childTail</text>

  <!-- 递归说明 -->
  <rect x="280" y="154" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="173" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">递归 flatten(child) 得扁平子链</text>

  <!-- ===== 扁平后：子链插入 ===== -->
  <text x="40" y="236" font-size="12" fill="#444" font-weight="bold">扁平后：子链插入到 curr 与 next 之间</text>
  <g font-size="12">
    <rect x="40" y="244" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="62" y="264" text-anchor="middle" fill="#333" font-weight="bold">curr</text>
    <line x1="84" y1="259" x2="102" y2="259" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="108" y="244" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="130" y="264" text-anchor="middle" fill="#333" font-weight="bold">c1</text>
    <line x1="152" y1="259" x2="170" y2="259" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="176" y="244" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="198" y="264" text-anchor="middle" fill="#333" font-weight="bold">c2</text>
    <line x1="220" y1="259" x2="238" y2="259" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="244" y="244" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="266" y="264" text-anchor="middle" fill="#333" font-weight="bold">c3</text>
    <line x1="288" y1="259" x2="306" y2="259" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="312" y="244" width="44" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="334" y="264" text-anchor="middle" fill="#888">next</text>
    <line x1="356" y1="259" x2="414" y2="259" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="426" y="264" font-size="11" fill="#888">...</text>
  </g>
  <text x="62" y="234" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">① curr.next=c1</text>
  <text x="130" y="234" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">② c1.prev=curr</text>
  <text x="266" y="294" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">③ c3.next=next</text>
  <text x="334" y="294" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">④ next.prev=c3</text>

  <!-- ===== 四处指针说明 ===== -->
  <rect x="30" y="312" width="520" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="332" font-size="11" fill="#446688" font-weight="bold">双向链表插入要接四处指针：</text>
  <text x="44" y="350" font-size="10" fill="#555">① curr.next = childHead　② childHead.prev = curr　③ childTail.next = next　④ next.prev = childTail</text>

  <!-- ===== 关键 ===== -->
  <rect x="30" y="372" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="392" font-size="11" fill="#4a7a3a" font-weight="bold">核心：DFS 深入处理子链，回溯时插入接回</text>
  <text x="44" y="410" font-size="10" fill="#555">子链本身也可能有 child，递归先扁平化最内层，逐层接回</text>
  <text x="44" y="424" font-size="10" fill="#d6a040" font-weight="bold">插入后 curr.child=null（清空），curr 跳到 next 继续（子链已扁平，不重走）</text>
</svg>
