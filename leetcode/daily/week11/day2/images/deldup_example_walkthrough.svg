<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="450" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：1→1→2→3→3 逐步去重</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">绿色=curr 当前位置，红色=被跳过的重复节点</text>

  <!-- ===== 初始 ===== -->
  <text x="40" y="78" font-size="11" fill="#444" font-weight="bold">初始：1→1→2→3→3</text>
  <g font-size="12">
    <rect x="40" y="86" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="65" y="105" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="94" y="86" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="119" y="105" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="148" y="86" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="173" y="105" text-anchor="middle" fill="#888">2</text>
    <rect x="202" y="86" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="227" y="105" text-anchor="middle" fill="#888">3</text>
    <rect x="256" y="86" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="281" y="105" text-anchor="middle" fill="#888">3</text>
  </g>
  <text x="65" y="76" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">curr</text>

  <!-- ===== 步骤1: 跳过第二个1 ===== -->
  <text x="40" y="146" font-size="11" fill="#444" font-weight="bold">步骤1：1==1 跳过 → 1→2→3→3</text>
  <g font-size="12">
    <rect x="40" y="154" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="65" y="173" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="94" y="154" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="119" y="173" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">1</text>
    <rect x="148" y="154" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="173" y="173" text-anchor="middle" fill="#888">2</text>
    <rect x="202" y="154" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="227" y="173" text-anchor="middle" fill="#888">3</text>
    <rect x="256" y="154" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="281" y="173" text-anchor="middle" fill="#888">3</text>
  </g>
  <path d="M 90 168 Q 119 140 148 168" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="65" y="196" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">curr 不动</text>

  <!-- ===== 步骤2: 1!=2 前进 ===== -->
  <text x="40" y="226" font-size="11" fill="#444" font-weight="bold">步骤2：1!=2 前进 → curr 到 2</text>
  <g font-size="12">
    <rect x="40" y="234" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="65" y="253" text-anchor="middle" fill="#888">1</text>
    <rect x="94" y="234" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="119" y="253" text-anchor="middle" fill="#ccc">1</text>
    <rect x="148" y="234" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="173" y="253" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="202" y="234" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="227" y="253" text-anchor="middle" fill="#888">3</text>
    <rect x="256" y="234" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="281" y="253" text-anchor="middle" fill="#888">3</text>
  </g>
  <text x="173" y="224" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">curr</text>

  <!-- ===== 步骤3: 2!=3 前进 ===== -->
  <text x="40" y="296" font-size="11" fill="#444" font-weight="bold">步骤3：2!=3 前进 → curr 到 3</text>
  <g font-size="12">
    <rect x="40" y="304" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="65" y="323" text-anchor="middle" fill="#888">1</text>
    <rect x="94" y="304" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="119" y="323" text-anchor="middle" fill="#ccc">1</text>
    <rect x="148" y="304" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="173" y="323" text-anchor="middle" fill="#888">2</text>
    <rect x="202" y="304" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="227" y="323" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="256" y="304" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="281" y="323" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>
  <text x="227" y="294" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">curr</text>

  <!-- ===== 步骤4: 跳过第二个3 ===== -->
  <text x="40" y="366" font-size="11" fill="#444" font-weight="bold">步骤4：3==3 跳过 → 1→2→3</text>
  <g font-size="12">
    <rect x="40" y="374" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="65" y="393" text-anchor="middle" fill="#888">1</text>
    <rect x="94" y="374" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="119" y="393" text-anchor="middle" fill="#ccc">1</text>
    <rect x="148" y="374" width="50" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="173" y="393" text-anchor="middle" fill="#888">2</text>
    <rect x="202" y="374" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="227" y="393" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="256" y="374" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="281" y="393" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">3</text>
  </g>
  <path d="M 252 388 Q 281 360 310 388" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="227" y="364" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">curr（next=null 退出）</text>

  <!-- ===== 结果 ===== -->
  <rect x="320" y="374" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="332" y="394" font-size="11" fill="#4a7a3a" font-weight="bold">最终：1→2→3 ✓</text>
  <text x="332" y="412" font-size="10" fill="#555">每个值只出现一次</text>
  <text x="332" y="426" font-size="10" fill="#555">head 始终不变，返回 head</text>
</svg>
