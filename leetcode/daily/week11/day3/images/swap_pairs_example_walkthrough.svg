<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：1→2→3→4 逐对交换 → 2→1→4→3</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">黄色=prev，蓝色=a，绿色=b；每轮交换 prev 后两节点</text>

  <!-- ===== 初始 ===== -->
  <text x="40" y="78" font-size="11" fill="#444" font-weight="bold">初始：dummy→1→2→3→4</text>
  <g font-size="12">
    <rect x="40" y="86" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="67" y="106" text-anchor="middle" fill="#333" font-weight="bold">dummy</text>
    <line x1="94" y1="101" x2="116" y2="101" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="122" y="86" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="144" y="106" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="166" y1="101" x2="188" y2="101" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="194" y="86" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="216" y="106" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="238" y1="101" x2="260" y2="101" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="266" y="86" width="44" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="288" y="106" text-anchor="middle" fill="#888">3</text>
    <line x1="310" y1="101" x2="332" y2="101" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="338" y="86" width="44" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="360" y="106" text-anchor="middle" fill="#888">4</text>
  </g>
  <text x="67" y="76" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">prev</text>
  <text x="144" y="76" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">a</text>
  <text x="216" y="76" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">b</text>

  <!-- ===== 第1轮 ===== -->
  <text x="40" y="146" font-size="11" fill="#444" font-weight="bold">第 1 轮：交换 a=1, b=2</text>
  <g font-size="12">
    <rect x="40" y="154" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="67" y="174" text-anchor="middle" fill="#333" font-weight="bold">dummy</text>
    <line x1="94" y1="169" x2="116" y2="169" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="122" y="154" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="144" y="174" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="166" y1="169" x2="188" y2="169" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="194" y="154" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="216" y="174" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="238" y1="169" x2="260" y2="169" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="266" y="154" width="44" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="288" y="174" text-anchor="middle" fill="#888">3</text>
    <line x1="310" y1="169" x2="332" y2="169" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="338" y="154" width="44" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="360" y="174" text-anchor="middle" fill="#888">4</text>
  </g>
  <text x="216" y="200" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">prev=a=1（下轮前驱）</text>

  <!-- ===== 第2轮 ===== -->
  <text x="40" y="226" font-size="11" fill="#444" font-weight="bold">第 2 轮：prev=1，交换 a=3, b=4</text>
  <g font-size="12">
    <rect x="40" y="234" width="54" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="67" y="254" text-anchor="middle" fill="#888">dummy</text>
    <line x1="94" y1="249" x2="116" y2="249" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="122" y="234" width="44" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="144" y="254" text-anchor="middle" fill="#888">2</text>
    <line x1="166" y1="249" x2="188" y2="249" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="194" y="234" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="216" y="254" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="238" y1="249" x2="260" y2="249" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="266" y="234" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="288" y="254" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="310" y1="249" x2="332" y2="249" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="338" y="234" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="360" y="254" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="382" y1="249" x2="404" y2="249" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="416" y="254" font-size="12" fill="#888">∅</text>
  </g>
  <text x="216" y="224" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">prev</text>
  <text x="288" y="224" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="360" y="224" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">a</text>

  <!-- ===== 结果 ===== -->
  <text x="40" y="306" font-size="11" fill="#444" font-weight="bold">结束：prev=3，next=null 退出</text>
  <g font-size="12">
    <rect x="40" y="314" width="54" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="67" y="334" text-anchor="middle" fill="#888">dummy</text>
    <line x1="94" y1="329" x2="116" y2="329" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="122" y="314" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="144" y="334" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="166" y1="329" x2="188" y2="329" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="194" y="314" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="216" y="334" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="238" y1="329" x2="260" y2="329" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="266" y="314" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="288" y="334" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="310" y1="329" x2="332" y2="329" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="338" y="314" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="360" y="334" text-anchor="middle" fill="#333" font-weight="bold">3</text>
  </g>

  <!-- ===== 结论 ===== -->
  <rect x="30" y="362" width="520" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">返回 dummy.next → 2→1→4→3 ✓</text>
  <text x="50" y="402" font-size="10" fill="#555">每对独立交换，prev 从 dummy 走到 1 再到 3，共 2 轮</text>
  <text x="50" y="420" font-size="10" fill="#4a7a3a" font-weight="bold">关键：prev 落在交换后的 a（原第一个，现第二个），保证下一对正确衔接</text>
</svg>
