<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三指针交换一对：prev→a→b→c 变成 prev→b→a→c</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">改三根指针，顺序：① prev→b ② a→c ③ b→a</text>

  <!-- ===== 交换前 ===== -->
  <text x="40" y="78" font-size="12" fill="#444" font-weight="bold">交换前：</text>
  <g font-size="13">
    <rect x="60" y="86" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="90" y="108" text-anchor="middle" fill="#333" font-weight="bold">prev</text>
    <line x1="120" y1="103" x2="148" y2="103" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="154" y="86" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="179" y="108" text-anchor="middle" fill="#333" font-weight="bold">a</text>
    <line x1="204" y1="103" x2="232" y2="103" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="238" y="86" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="263" y="108" text-anchor="middle" fill="#333" font-weight="bold">b</text>
    <line x1="288" y1="103" x2="316" y2="103" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="322" y="86" width="50" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="347" y="108" text-anchor="middle" fill="#888">c</text>
    <line x1="372" y1="103" x2="400" y2="103" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="412" y="108" font-size="12" fill="#888">...</text>
  </g>

  <!-- ===== 三步说明 ===== -->
  <text x="40" y="146" font-size="12" fill="#444" font-weight="bold">三步改指针：</text>

  <rect x="40" y="154" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="52" y="173" font-size="11" fill="#333">① <tspan font-weight="bold" fill="#4a7a3a">prev.next = b</tspan>　prev 跨过 a 直接指向 b</text>

  <rect x="40" y="186" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="52" y="205" font-size="11" fill="#333">② <tspan font-weight="bold" fill="#d6a040">a.next = b.next</tspan>　a 接到 c（必须先于③，否则 c 丢失）</text>

  <rect x="40" y="218" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="52" y="237" font-size="11" fill="#333">③ <tspan font-weight="bold" fill="#b85450">b.next = a</tspan>　b 指向 a，完成 a、b 互换</text>

  <!-- ===== 交换后 ===== -->
  <text x="40" y="278" font-size="12" fill="#444" font-weight="bold">交换后：</text>
  <g font-size="13">
    <rect x="60" y="286" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="90" y="308" text-anchor="middle" fill="#333" font-weight="bold">prev</text>
    <line x1="120" y1="303" x2="148" y2="303" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

    <rect x="154" y="286" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="179" y="308" text-anchor="middle" fill="#333" font-weight="bold">b</text>
    <line x1="204" y1="303" x2="232" y2="303" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>

    <rect x="238" y="286" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="263" y="308" text-anchor="middle" fill="#333" font-weight="bold">a</text>
    <line x1="288" y1="303" x2="316" y2="303" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="322" y="286" width="50" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="347" y="308" text-anchor="middle" fill="#888">c</text>
    <line x1="372" y1="303" x2="400" y2="303" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="412" y="308" font-size="12" fill="#888">...</text>
  </g>
  <text x="154" y="340" font-size="9" fill="#4a7a3a">①新指</text>
  <text x="238" y="340" font-size="9" fill="#b85450">③新指</text>
  <text x="288" y="340" font-size="9" fill="#d6a040">②新指</text>

  <!-- ===== 注意 ===== -->
  <rect x="40" y="354" width="500" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="372" font-size="11" fill="#b85450" font-weight="bold">⚠ 顺序陷阱：必须先 ② 再 ③</text>
  <text x="52" y="386" font-size="10" fill="#555">若先 ③ b.next=a，b.next 被覆盖，再 ② a.next=b.next 就变成 a.next=a 自指，c 丢失</text>
</svg>
