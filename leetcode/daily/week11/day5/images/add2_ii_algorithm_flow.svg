<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：压栈 → 弹栈相加 → 头插 → 处理进位</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">O(max(m,n)) 时间空间，不改输入链表</text>

  <!-- 压栈 -->
  <rect x="150" y="60" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 遍历 l1、l2，值压入 s1、s2</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="110" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">carry=0; head=null</text>

  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="280,160 390,200 280,240 170,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">s1 或 s2 或</text>
  <text x="280" y="208" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">carry&gt;0 ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="9" fill="#8a6a20">（还有位没加?）</text>

  <!-- No: return -->
  <text x="160" y="194" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 170 200 L 110 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="184" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="75" y="204" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return</text>
  <text x="75" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">head</text>

  <!-- Yes -->
  <text x="296" y="256" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 240 L 280 258" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取值 -->
  <rect x="140" y="260" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a=s1.pop() if s1 else 0; b=s2.pop() if s2 else 0</text>

  <path d="M 280 290 L 280 308" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求和进位 -->
  <rect x="120" y="310" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">sum = a + b + carry</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">carry = sum/10; digit = sum%10</text>

  <path d="M 280 354 L 280 372" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 头插 -->
  <rect x="140" y="374" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="393" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">head = ListNode(digit, head)（头插）</text>

  <!-- loop back -->
  <path d="M 420 389 L 470 389 L 470 200 L 390 200" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="296" font-size="8" fill="#888">下一位</text>

  <!-- 提示 -->
  <rect x="30" y="416" width="500" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="434" font-size="11" fill="#b85450" font-weight="bold">⚠ 循环条件含 carry&gt;0：两栈空但仍有进位时补最高位节点</text>
  <text x="42" y="448" font-size="10" fill="#555">短链表栈空取 0（自动补零对齐），无需预先对齐长度</text>
</svg>
