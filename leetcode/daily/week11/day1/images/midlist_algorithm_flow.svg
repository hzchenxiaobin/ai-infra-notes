<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：快慢指针同步前进，fast 到尾返回 slow</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">一遍遍历 O(n)，O(1) 空间</text>

  <!-- Start: init -->
  <rect x="170" y="62" width="220" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">slow = fast = head</text>

  <path d="M 280 94 L 280 110" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond decision -->
  <polygon points="280,112 390,156 280,200 170,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">fast != null</text>
  <text x="280" y="166" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">且 fast.next != null?</text>

  <!-- Yes branch (right) -->
  <text x="400" y="152" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 390 156 L 430 156" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="138" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="490" y="155" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">slow = slow.next</text>
  <text x="490" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">fast = fast.next.next</text>
  <!-- loop back to diamond -->
  <path d="M 490 174 L 490 220 L 280 220 L 280 200" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="216" font-size="9" fill="#888">继续下一轮</text>

  <!-- No branch (down) -->
  <text x="296" y="216" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 200 L 280 250" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="252" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">fast 到尾，slow 即中间结点</text>

  <path d="M 280 282 L 280 300" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="302" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return slow</text>

  <!-- ===== 奇偶情形说明 ===== -->
  <rect x="30" y="350" width="500" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="370" font-size="11" fill="#446688" font-weight="bold">两种退出情形：</text>
  <text x="44" y="388" font-size="10" fill="#555">奇数链：fast.next == null（停在最后节点）→ slow 在正中</text>
  <text x="44" y="404" font-size="10" fill="#555">偶数链：fast == null（越过末尾）→ slow 在第二个中点</text>
</svg>
