<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BFS 层序：每层用 next 串成链表</text>

  <!-- 完美二叉树 -->
  <!-- 第0层 -->
  <circle cx="290" cy="60" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- 第1层 -->
  <circle cx="210" cy="130" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="370" cy="130" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="134" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="278" y1="72" x2="220" y2="118" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="302" y1="72" x2="360" y2="118" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- next 箭头 2->3 -->
  <path d="M 226 130 L 354 130" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="290" y="122" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">next</text>

  <!-- 第2层 -->
  <circle cx="160" cy="210" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="214" text-anchor="middle" font-size="10" fill="#333">4</text>
  <circle cx="250" cy="210" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="214" text-anchor="middle" font-size="10" fill="#333">5</text>
  <circle cx="330" cy="210" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="214" text-anchor="middle" font-size="10" fill="#333">6</text>
  <circle cx="420" cy="210" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="214" text-anchor="middle" font-size="10" fill="#333">7</text>
  <line x1="200" y1="142" x2="166" y2="200" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="220" y1="142" x2="246" y2="200" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="142" x2="334" y2="200" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="380" y1="142" x2="414" y2="200" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- next 链 4->5->6->7 -->
  <path d="M 172 210 L 238 210" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 262 210 L 318 210" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 342 210 L 408 210" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="40" y="250" width="500" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="12" fill="#333" font-weight="bold">BFS 层序思路：</text>
  <text x="60" y="294" font-size="11" fill="#555">① 队列入队 root，记录每层 size</text>
  <text x="60" y="312" font-size="11" fill="#555">② 同层从左到右出队，prev.next = 当前节点</text>
  <text x="60" y="330" font-size="11" fill="#555">③ 每层末尾 prev.next 自然保持 null</text>
  <text x="60" y="350" font-size="11" fill="#b85450" font-weight="bold">缺点：队列占用 O(n) 空间，不满足进阶要求</text>
  <text x="60" y="370" font-size="11" fill="#4a7a3a">优化：用已建立的 next 链代替队列 ⇒ O(1) 空间</text>
</svg>
