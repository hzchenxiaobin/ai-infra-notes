<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">O(1) 空间：上一层 next 链 = 下一层免费队列</text>

  <!-- 第1层（已建好 next） -->
  <text x="40" y="62" font-size="11" fill="#888">第1层（已建好 next）：</text>
  <circle cx="130" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="300" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="84" text-anchor="middle" font-size="11" fill="#333">3</text>
  <path d="M 144 80 L 286 80" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="215" y="72" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">next（已建）</text>

  <!-- 第2层孩子 -->
  <circle cx="90" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="174" text-anchor="middle" font-size="10" fill="#333">4</text>
  <circle cx="170" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="174" text-anchor="middle" font-size="10" fill="#333">5</text>
  <circle cx="260" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="10" fill="#333">6</text>
  <circle cx="340" cy="170" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="174" text-anchor="middle" font-size="10" fill="#333">7</text>

  <!-- 父子连线 -->
  <line x1="120" y1="92" x2="96" y2="160" stroke="#446688" stroke-width="1.1" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <line x1="140" y1="92" x2="164" y2="160" stroke="#446688" stroke-width="1.1" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <line x1="290" y1="92" x2="266" y2="160" stroke="#446688" stroke-width="1.1" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <line x1="310" y1="92" x2="334" y2="160" stroke="#446688" stroke-width="1.1" stroke-dasharray="2,2" filter="url(#rough2)"/>

  <!-- 亲兄弟 4->5 -->
  <path d="M 102 170 L 158 170" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="130" y="160" text-anchor="middle" font-size="9" fill="#d6a040">亲兄弟</text>

  <!-- 堂兄弟 5->6 -->
  <path d="M 182 170 L 248 170" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="215" y="160" text-anchor="middle" font-size="9" fill="#d6a040">堂兄弟</text>

  <!-- 亲兄弟 6->7 -->
  <path d="M 272 170 L 328 170" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="middle" font-size="9" fill="#d6a040">亲兄弟</text>

  <!-- 说明箭头：父next -> 堂兄弟 -->
  <path d="M 215 100 L 215 150" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="225" y="128" font-size="9" fill="#b85450">父.next 连接</text>

  <!-- 说明框 -->
  <rect x="40" y="220" width="500" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="244" font-size="12" fill="#333" font-weight="bold">O(1) 空间核心：</text>
  <text x="60" y="264" font-size="11" fill="#555">横向遍历第1层（沿 next）：</text>
  <text x="60" y="282" font-size="11" fill="#d6a040">  node=2：2.left.next=2.right ⇒ 4→5（亲兄弟）</text>
  <text x="60" y="300" font-size="11" fill="#d6a040">         2.right.next=2.next.left ⇒ 5→6（堂兄弟，靠 2.next=3）</text>
  <text x="60" y="318" font-size="11" fill="#d6a040">  node=3：3.left.next=3.right ⇒ 6→7（亲兄弟）</text>
  <text x="60" y="336" font-size="11" fill="#555">进入下一层：levelStart = levelStart.left，重复</text>
  <text x="60" y="358" font-size="11" fill="#b85450" font-weight="bold">父节点的 next 链 = 下一层的免费横向通道，无需队列</text>
</svg>
