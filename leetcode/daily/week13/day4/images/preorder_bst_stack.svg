<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">栈方法：单调栈维护祖先路径</text>

  <!-- 步骤说明 -->
  <rect x="40" y="50" width="500" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="74" font-size="12" fill="#333" font-weight="bold">栈方法流程：</text>
  <text x="60" y="94" font-size="11" fill="#555">① 第一个元素是根，压栈</text>
  <text x="60" y="112" font-size="11" fill="#555">② 新值 &lt; 栈顶 ⇒ 作为栈顶的左孩子，压栈</text>
  <text x="60" y="130" font-size="11" fill="#555">③ 新值 &gt; 栈顶 ⇒ 弹栈到最后一个小于新值的节点，新值作为其右孩子，压栈</text>

  <!-- 示例栈状态 -->
  <text x="40" y="166" font-size="12" fill="#888">preorder = [8,5,1,7,10,12] 的栈演变：</text>

  <!-- i=0: [8] -->
  <text x="40" y="190" font-size="11" fill="#888">i=0, val=8：</text>
  <rect x="110" y="178" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="196" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="160" y="196" font-size="10" fill="#446688">根</text>

  <!-- i=1: [8,5] -->
  <text x="40" y="222" font-size="11" fill="#888">i=1, val=5 &lt; 8：</text>
  <rect x="110" y="210" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="128" y="228" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="150" y="210" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="228" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="200" y="228" font-size="10" fill="#446688">8的左孩子</text>

  <!-- i=2: [8,5,1] -->
  <text x="40" y="254" font-size="11" fill="#888">i=2, val=1 &lt; 5：</text>
  <rect x="110" y="242" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="128" y="260" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="150" y="242" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="168" y="260" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="190" y="242" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="260" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="240" y="260" font-size="10" fill="#446688">5的左孩子</text>

  <!-- i=3: 弹1,弹5 val=7 -->
  <text x="40" y="286" font-size="11" fill="#888">i=3, val=7 &gt; 1,5：</text>
  <rect x="110" y="274" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="128" y="292" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="150" y="274" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="292" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="200" y="292" font-size="10" fill="#b85450">弹1,弹5；7是5的右孩子</text>

  <!-- i=4: 弹8 val=10 -->
  <text x="40" y="318" font-size="11" fill="#888">i=4, val=10 &gt; 8：</text>
  <rect x="110" y="306" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="324" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="160" y="324" font-size="10" fill="#b85450">弹8；10是8的右孩子</text>

  <!-- i=5: val=12 -->
  <text x="40" y="350" font-size="11" fill="#888">i=5, val=12 &gt; 10：</text>
  <rect x="110" y="338" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="356" text-anchor="middle" font-size="11" fill="#333">12</text>
  <text x="160" y="356" font-size="10" fill="#b85450">弹10；12是10的右孩子</text>

  <text x="290" y="388" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">栈底→栈顶 = 根→当前节点的祖先链</text>
</svg>
