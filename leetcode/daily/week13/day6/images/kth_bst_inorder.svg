<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 中序遍历 = 升序序列</text>

  <!-- BST 树 -->
  <text x="40" y="58" font-size="12" fill="#888">BST：</text>
  <circle cx="200" cy="90" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <circle cx="140" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="164" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="188" y1="102" x2="150" y2="148" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="270" cy="160" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="164" text-anchor="middle" font-size="11" fill="#333">6</text>
  <line x1="212" y1="102" x2="260" y2="148" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="100" cy="230" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="130" y1="172" x2="108" y2="220" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="180" cy="230" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="234" text-anchor="middle" font-size="10" fill="#333">4</text>
  <line x1="150" y1="172" x2="172" y2="220" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="60" cy="300" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="304" text-anchor="middle" font-size="9" fill="#333">1</text>
  <line x1="92" y1="240" x2="66" y2="290" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 中序箭头标注 -->
  <text x="40" y="350" font-size="11" fill="#888">中序访问顺序：</text>

  <!-- 中序序列 -->
  <rect x="280" y="90" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="109" text-anchor="middle" font-size="11" fill="#333">1</text>
  <path d="M 316 104 L 332 104" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="336" y="90" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="354" y="109" text-anchor="middle" font-size="11" fill="#333">2</text>
  <path d="M 372 104 L 388 104" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="392" y="90" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="109" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <path d="M 428 104 L 444 104" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="448" y="90" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="466" y="109" text-anchor="middle" font-size="11" fill="#333">4</text>
  <path d="M 484 104 L 500 104" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="504" y="90" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="522" y="109" text-anchor="middle" font-size="11" fill="#333">5</text>

  <rect x="280" y="130" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="149" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- 第k小标注 -->
  <path d="M 410 122 L 410 70" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="64" font-size="11" fill="#b85450" font-weight="bold">k=3 ⇒ 第3小</text>

  <!-- 说明框 -->
  <rect x="40" y="370" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="60" y="386" font-size="11" fill="#333">中序 [1,2,3,4,5,6] 严格递增；第 k 小 = 中序第 k 个访问的节点</text>
</svg>
