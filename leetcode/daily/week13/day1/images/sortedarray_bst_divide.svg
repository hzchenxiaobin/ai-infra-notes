<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">取中点为根，左右分治</text>

  <!-- 升序数组 -->
  <text x="40" y="60" font-size="12" fill="#888">升序数组（= BST 中序）：</text>
  <rect x="40" y="68" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="62" y="89" text-anchor="middle" font-size="12" fill="#333">-10</text>
  <rect x="88" y="68" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="110" y="89" text-anchor="middle" font-size="12" fill="#333">-3</text>
  <rect x="136" y="68" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="184" y="68" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="206" y="89" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="232" y="68" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="254" y="89" text-anchor="middle" font-size="12" fill="#333">9</text>

  <text x="62" y="116" text-anchor="middle" font-size="10" fill="#446688">左半</text>
  <text x="158" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 根</text>
  <text x="220" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a">右半</text>

  <!-- 中点指向根 -->
  <path d="M 158 120 L 290 150" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 构造的树 -->
  <circle cx="320" cy="160" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <circle cx="270" cy="220" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="11" fill="#333">-3</text>
  <line x1="308" y1="172" x2="278" y2="208" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="380" cy="220" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="224" text-anchor="middle" font-size="11" fill="#333">9</text>
  <line x1="332" y1="172" x2="372" y2="208" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="240" cy="280" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="284" text-anchor="middle" font-size="10" fill="#333">-10</text>
  <line x1="262" y1="230" x2="246" y2="270" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="350" cy="280" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="284" text-anchor="middle" font-size="10" fill="#333">5</text>
  <line x1="372" y1="230" x2="356" y2="270" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="40" y="320" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="344" font-size="12" fill="#333" font-weight="bold">核心：升序数组 = BST 中序序列</text>
  <text x="60" y="364" font-size="11" fill="#555">取中点 nums[mid] 为根 → 左 [L, mid-1] 构造左子树，右 [mid+1, R] 构造右子树</text>
  <text x="60" y="378" font-size="11" fill="#555">左右节点数最多差 1 ⇒ 高度平衡</text>
</svg>
