<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">N 叉树最大深度 = max(各子树深度) + 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">遍历所有孩子取最大，不再是左右两个</text>

  <!-- N叉树 -->
  <circle cx="240" cy="78" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="83" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="268" y="83" font-size="11" fill="#b85450" font-weight="bold">d=3</text>

  <!-- 三个孩子 -->
  <circle cx="120" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="155" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="142" y="155" font-size="10" fill="#888">d=1</text>

  <circle cx="240" cy="150" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="155" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="262" y="155" font-size="10" fill="#888">d=2</text>

  <circle cx="380" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="402" y="155" font-size="10" fill="#888">d=1</text>

  <!-- 边 root -> 三个孩子 -->
  <line x1="224" y1="92" x2="132" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="96" x2="240" y2="134" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="256" y1="92" x2="368" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 节点 2 的两个孩子 -->
  <circle cx="200" cy="220" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="220" y="225" font-size="9" fill="#888">d=1</text>

  <circle cx="285" cy="220" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="305" y="225" font-size="9" fill="#888">d=1</text>

  <line x1="230" y1="164" x2="210" y2="208" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="250" y1="164" x2="275" y2="208" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 最长路径高亮 -->
  <path d="M 240 96 L 240 134" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 240 166 L 240 190 L 215 208" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="170" font-size="11" fill="#b85450" font-weight="bold">最长路径</text>
  <text x="430" y="186" font-size="10" fill="#b85450">1→2→5（3 个节点）</text>

  <!-- 递归公式 -->
  <rect x="30" y="270" width="500" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="12" fill="#333" font-weight="bold">后序递归（自底向上汇总）：</text>
  <text x="50" y="318" font-size="12" fill="#555" font-family="monospace">depth(node) = max(depth(child) for child in node.children) + 1</text>
  <text x="50" y="340" font-size="11" fill="#888">• 叶子节点（children 为空）→ max() 空集 = 0，+1 = 1</text>
  <text x="50" y="356" font-size="11" fill="#888">• depth(1) = max(1, 2, 1) + 1 = 3 ⭐</text>
</svg>
