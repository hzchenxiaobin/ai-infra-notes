<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,null,3,2,4,null,5,6]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">后序递归自底向上汇总深度</text>

  <!-- 树结构 -->
  <circle cx="220" cy="74" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="79" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <circle cx="120" cy="138" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <circle cx="220" cy="138" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <circle cx="320" cy="138" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <line x1="206" y1="88" x2="132" y2="126" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="220" y1="91" x2="220" y2="123" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="234" y1="88" x2="308" y2="126" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="185" cy="205" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <circle cx="255" cy="205" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="255" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <line x1="210" y1="150" x2="192" y2="193" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="150" x2="248" y2="193" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <!-- 演算表 -->
  <rect x="370" y="64" width="170" height="200" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="455" y="84" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">递归返回值</text>
  <line x1="370" y1="92" x2="540" y2="92" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="380" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">节点</text>
  <text x="470" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">depth</text>
  <line x1="370" y1="116" x2="540" y2="116" stroke="#ccc" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="380" y="134" font-size="11" fill="#333">5（叶子）</text>
  <text x="480" y="134" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="380" y="154" font-size="11" fill="#333">6（叶子）</text>
  <text x="480" y="154" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="380" y="174" font-size="11" fill="#333">3（叶子）</text>
  <text x="480" y="174" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="380" y="194" font-size="11" fill="#333">4（叶子）</text>
  <text x="480" y="194" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="380" y="214" font-size="11" fill="#333">2</text>
  <text x="480" y="214" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <text x="380" y="234" font-size="11" fill="#333">1</text>
  <text x="480" y="234" font-size="11" fill="#b85450" font-weight="bold">3 ⭐</text>

  <line x1="370" y1="242" x2="540" y2="242" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="455" y="258" text-anchor="middle" font-size="10" fill="#888">depth(2)=max(1,1)+1=2</text>

  <!-- 汇总说明 -->
  <rect x="30" y="260" width="320" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="11" fill="#333" font-weight="bold">汇总：</text>
  <text x="50" y="302" font-size="11" fill="#555">• depth(3)=1, depth(2)=2, depth(4)=1</text>
  <text x="50" y="320" font-size="11" fill="#555">• depth(1) = max(1, 2, 1) + 1 = 3</text>
  <text x="50" y="336" font-size="11" fill="#b85450" font-weight="bold">最终结果 = 3</text>
</svg>
