<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,2,3,4,5]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">先得「根右左」[1,3,5,4,2]，反转得后序 [2,4,5,3,1]</text>

  <!-- 树 -->
  <circle cx="220" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <circle cx="150" cy="140" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <circle cx="300" cy="140" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <line x1="208" y1="94" x2="160" y2="128" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="232" y1="94" x2="288" y2="128" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="100" cy="200" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="205" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>

  <circle cx="190" cy="200" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="205" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>

  <line x1="138" y1="154" x2="108" y2="188" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="162" y1="154" x2="182" y2="188" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 演算表 -->
  <rect x="350" y="60" width="200" height="180" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">栈迭代过程</text>
  <line x1="350" y1="88" x2="550" y2="88" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="360" y="106" font-size="10" fill="#b85450" font-weight="bold">出栈 → result（根右左）</text>

  <text x="360" y="126" font-size="11" fill="#333">pop 1 → [1]</text>
  <text x="360" y="144" font-size="11" fill="#333">push 2, 3</text>

  <text x="360" y="164" font-size="11" fill="#333">pop 3 → [1,3]</text>
  <text x="360" y="182" font-size="11" fill="#333">（3 无子）</text>

  <text x="360" y="202" font-size="11" fill="#333">pop 2 → [1,3,2]</text>
  <text x="360" y="220" font-size="11" fill="#333">push 4, 5</text>

  <text x="360" y="240" font-size="10" fill="#888">（继续 pop 5, 4...）</text>

  <!-- 结果 -->
  <rect x="20" y="250" width="520" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="274" font-size="12" fill="#4a7a3a" font-weight="bold">两步结果：</text>
  <text x="40" y="296" font-size="12" fill="#555" font-family="monospace">① 根右左 = [1, 3, 5, 4, 2]   ← 左先入栈、右后入栈，出栈即根右左</text>
  <text x="40" y="316" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">② reverse → [2, 4, 5, 3, 1]   ✅ 后序结果</text>
</svg>
