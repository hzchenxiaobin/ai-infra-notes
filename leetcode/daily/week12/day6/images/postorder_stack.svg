<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">栈迭代巧思：根→右→左 再反转 = 左→右→根</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">前序是「根左右」，把左右互换得「根右左」，反转即后序</text>

  <!-- 转换关系图 -->
  <rect x="20" y="60" width="160" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">前序：根左右</text>
  <text x="100" y="104" text-anchor="middle" font-size="10" fill="#888">1 2 4 5 3</text>
  <text x="100" y="124" text-anchor="middle" font-size="10" fill="#888">左先入栈</text>

  <text x="200" y="104" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">→</text>
  <text x="200" y="124" text-anchor="middle" font-size="9" fill="#888">左右互换</text>

  <rect x="220" y="60" width="160" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="84" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">变种：根右左</text>
  <text x="300" y="104" text-anchor="middle" font-size="10" fill="#888">1 3 5 4 2</text>
  <text x="300" y="124" text-anchor="middle" font-size="10" fill="#888">右先入栈</text>

  <text x="400" y="104" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">→</text>
  <text x="400" y="124" text-anchor="middle" font-size="9" fill="#888">反转</text>

  <rect x="420" y="60" width="130" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">后序：左右根</text>
  <text x="485" y="104" text-anchor="middle" font-size="10" fill="#888">2 4 5 3 1</text>
  <text x="485" y="124" text-anchor="middle" font-size="10" fill="#888">reverse</text>

  <!-- 栈迭代逻辑 -->
  <rect x="20" y="160" width="520" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="184" font-size="12" fill="#446688" font-weight="bold">栈迭代代码（与前序几乎一样，只改入栈顺序 + 最后反转）：</text>
  <text x="40" y="208" font-size="11" fill="#555" font-family="monospace">stack = [root]</text>
  <text x="40" y="226" font-size="11" fill="#555" font-family="monospace">while stack:</text>
  <text x="40" y="244" font-size="11" fill="#555" font-family="monospace">  node = stack.pop()</text>
  <text x="40" y="262" font-size="11" fill="#b85450" font-family="monospace">  result.append(node.val)   # 访问（先存着，待反转）</text>
  <text x="40" y="278" font-size="11" fill="#555" font-family="monospace">  push 左; push 右   # 注意：左先入，右后入（右在顶先出）</text>

  <rect x="20" y="290" width="520" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="314" font-size="12" fill="#4a7a3a" font-weight="bold">关键对比：</text>
  <text x="40" y="336" font-size="11" fill="#555">前序迭代：出栈访问，<tspan font-weight="bold" fill="#b85450">先 push 右、再 push 左</tspan> → 根左右</text>
  <text x="40" y="356" font-size="11" fill="#555">后序迭代：出栈访问，<tspan font-weight="bold" fill="#b85450">先 push 左、再 push 右</tspan> → 根右左 → reverse → 左右根</text>
  <text x="40" y="372" font-size="10" fill="#888">入栈顺序互换 + 最后 reverse，就是后序与前序迭代的唯一区别</text>
</svg>
