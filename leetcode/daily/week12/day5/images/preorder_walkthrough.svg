<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,2,3,4,5]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">递归与栈迭代结果一致：根→左→右</text>

  <!-- 树 -->
  <circle cx="220" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <circle cx="150" cy="140" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <circle cx="300" cy="140" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <line x1="208" y1="94" x2="160" y2="128" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="232" y1="94" x2="288" y2="128" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="100" cy="200" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="205" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>

  <circle cx="190" cy="200" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="205" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>

  <line x1="138" y1="154" x2="108" y2="188" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="162" y1="154" x2="182" y2="188" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 访问序号 -->
  <text x="245" y="85" font-size="11" fill="#b85450" font-weight="bold">①</text>
  <text x="175" y="145" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <text x="78" y="225" font-size="11" fill="#b85450" font-weight="bold">③</text>
  <text x="210" y="225" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <text x="325" y="145" font-size="11" fill="#b85450" font-weight="bold">⑤</text>

  <!-- 递归展开 -->
  <rect x="350" y="60" width="200" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="82" font-size="12" fill="#446688" font-weight="bold">递归调用：</text>
  <text x="370" y="104" font-size="11" fill="#555" font-family="monospace">visit(1)</text>
  <text x="370" y="122" font-size="11" fill="#555" font-family="monospace">  visit(2)</text>
  <text x="370" y="140" font-size="11" fill="#555" font-family="monospace">    visit(4)  ← 叶</text>
  <text x="370" y="158" font-size="11" fill="#555" font-family="monospace">    visit(5)  ← 叶</text>
  <text x="370" y="176" font-size="11" fill="#555" font-family="monospace">  visit(3)</text>
  <text x="370" y="194" font-size="11" fill="#555" font-family="monospace">    (无子)</text>
  <text x="370" y="212" font-size="10" fill="#888">根在子树前被访问</text>

  <!-- 结果 -->
  <rect x="20" y="250" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="274" font-size="12" fill="#333" font-weight="bold">访问结果：</text>
  <text x="40" y="298" font-size="14" fill="#b85450" font-family="monospace" font-weight="bold">[1, 2, 4, 5, 3]</text>
  <text x="40" y="318" font-size="11" fill="#888">根 1 最先，然后整个左子树 [2,4,5]，最后右子树 [3]——根永远在子树之前</text>
</svg>
