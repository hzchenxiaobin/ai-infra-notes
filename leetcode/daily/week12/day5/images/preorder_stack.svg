<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">栈迭代：用栈模拟递归，先右后左入栈</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">栈是 LIFO，要让左先出，就得让右先入</text>

  <!-- 树 -->
  <text x="30" y="80" font-size="11" fill="#446688" font-weight="bold">输入树</text>
  <circle cx="140" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <circle cx="90" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <circle cx="200" cy="140" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="145" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>

  <line x1="130" y1="102" x2="98" y2="128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="102" x2="188" y2="128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 栈状态 -->
  <text x="320" y="80" font-size="11" fill="#b85450" font-weight="bold">栈状态（底→顶）</text>

  <!-- 步骤1 -->
  <rect x="280" y="88" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="104" font-size="10" fill="#b85450" font-weight="bold">① push 1</text>
  <rect x="360" y="98" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="113" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="405" y="113" font-size="9" fill="#888">← 栈顶</text>

  <!-- 步骤2 -->
  <rect x="280" y="136" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="152" font-size="10" fill="#4a7a3a" font-weight="bold">② pop 1, 访问, push 3,2</text>
  <rect x="360" y="146" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="161" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <rect x="395" y="146" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="435" y="161" font-size="9" fill="#888">←顶</text>

  <!-- 步骤3 -->
  <rect x="280" y="184" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">③ pop 2, 访问（无子）</text>
  <rect x="380" y="194" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="209" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="420" y="209" font-size="9" fill="#888">←顶</text>

  <!-- 步骤4 -->
  <rect x="280" y="232" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">④ pop 3, 访问（无子）</text>
  <text x="390" y="257" text-anchor="middle" font-size="10" fill="#888">栈空 → 结束</text>

  <!-- 结果 -->
  <rect x="280" y="280" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="300" font-size="11" fill="#333" font-weight="bold">访问顺序：</text>
  <text x="290" y="318" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">1 → 2 → 3</text>

  <!-- 核心逻辑 -->
  <rect x="20" y="290" width="240" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="12" fill="#446688" font-weight="bold">核心逻辑：</text>
  <text x="40" y="332" font-size="11" fill="#555" font-family="monospace">stack.push(root)</text>
  <text x="40" y="350" font-size="11" fill="#555" font-family="monospace">while stack:</text>
  <text x="40" y="368" font-size="11" fill="#555" font-family="monospace">  node = stack.pop()</text>
  <text x="40" y="384" font-size="11" fill="#b85450" font-family="monospace">  visit(node); push 右; push 左</text>
</svg>
