<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">平衡二叉树：每个节点左右子树高度差 ≤ 1</text>

  <!-- 平衡树 -->
  <rect x="20" y="50" width="250" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅ 平衡</text>

  <circle cx="145" cy="96" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <circle cx="90" cy="146" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>

  <circle cx="200" cy="146" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">20</text>

  <circle cx="170" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">15</text>

  <circle cx="230" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>

  <line x1="133" y1="108" x2="100" y2="136" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="157" y1="108" x2="190" y2="136" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="190" y1="158" x2="175" y2="190" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="210" y1="158" x2="225" y2="190" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <text x="145" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a">左高1 右高2 差1 ✓</text>

  <!-- 不平衡树 -->
  <rect x="290" y="50" width="250" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌ 不平衡</text>

  <circle cx="415" cy="96" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="101" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <circle cx="415" cy="140" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <circle cx="415" cy="180" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="415" y="185" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <circle cx="415" cy="220" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="415" y="225" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>

  <line x1="415" y1="111" x2="415" y2="126" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="415" y1="154" x2="415" y2="167" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="415" y1="193" x2="415" y2="208" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>

  <text x="415" y="244" text-anchor="middle" font-size="10" fill="#b85450">左高0 右高3 差3 ✗</text>

  <!-- 定义说明 -->
  <rect x="20" y="270" width="520" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="292" font-size="12" fill="#333" font-weight="bold">定义：</text>
  <text x="40" y="312" font-size="11" fill="#555">平衡二叉树 = 每个节点的左右子树高度差不超过 1，且左右子树本身也是平衡的</text>
  <text x="40" y="330" font-size="11" fill="#555">关键：「每个节点」都要满足，不只是根节点——需递归检查所有子树</text>
</svg>
