<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：p=[1,2,3], q=[1,2,3]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">同步递归，逐节点对比结构与值</text>

  <!-- 步骤1：对比根 -->
  <circle cx="100" cy="90" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="95" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <circle cx="160" cy="90" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="95" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="130" y="70" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1==1 ✓</text>
  <text x="130" y="120" text-anchor="middle" font-size="10" fill="#888">步骤① 根节点：值相同</text>

  <line x1="180" y1="90" x2="220" y2="90" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：对比左子 -->
  <circle cx="250" cy="90" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="95" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <circle cx="310" cy="90" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="95" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="280" y="70" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2==2 ✓</text>
  <text x="280" y="120" text-anchor="middle" font-size="10" fill="#888">步骤② 左子：值相同，均无孩子</text>

  <line x1="330" y1="90" x2="370" y2="90" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3：对比右子 -->
  <circle cx="400" cy="90" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="95" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <circle cx="460" cy="90" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="95" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="70" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3==3 ✓</text>
  <text x="430" y="120" text-anchor="middle" font-size="10" fill="#888">步骤③ 右子：值相同，均无孩子</text>

  <!-- 递归展开 -->
  <rect x="30" y="150" width="500" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="174" font-size="12" fill="#333" font-weight="bold">递归调用树：</text>
  <text x="50" y="198" font-size="11" fill="#555" font-family="monospace">isSame(p=1, q=1)</text>
  <text x="50" y="216" font-size="11" fill="#555" font-family="monospace">  ├─ isSame(p.left=2, q.left=2)</text>
  <text x="50" y="234" font-size="11" fill="#4a7a3a" font-family="monospace">  │    └─ 都无子 → true</text>
  <text x="50" y="252" font-size="11" fill="#555" font-family="monospace">  └─ isSame(p.right=3, q.right=3)</text>
  <text x="50" y="270" font-size="11" fill="#4a7a3a" font-family="monospace">       └─ 都无子 → true</text>
  <text x="50" y="294" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace">  → true and true = true ✅</text>
  <text x="50" y="314" font-size="10" fill="#888">只要任一子树返回 false，整棵树即 false（短路求值）</text>
</svg>
